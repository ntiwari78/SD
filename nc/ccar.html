: "<p>During a long refactoring investigation, Claude discovers specific constraints across multiple files, including a database column that must remain nullable. After <code>/compact<\/code>, Claude starts giving generic recommendations instead of recalling those precise facts. The work will continue in a new session tomorrow.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the team preserve the findings?<\/p>", "c": [{"l": "A", "ok": false, "t": "Let Claude Code re-read recently accessed files after compaction.", "e": "Automatic recovery can reread only a limited number of recently accessed files, and large files may be represented only by path references. The critical findings here are conclusions synthesized across multiple files; they may not exist in any single recently read file."}, {"l": "B", "ok": true, "t": "Record each finding in a scratchpad file and read it in the next session.", "e": "A scratchpad stores investigation-specific findings outside the conversation. Compaction does not remove the file, and a new session can recover the details by reading it."}, {"l": "C", "ok": false, "t": "Append all discovered constraints to the project's <code>CLAUDE.md<\/code>.", "e": "<code>CLAUDE.md<\/code> is intended for durable project guidance that should be available across future sessions. Adding temporary, investigation-specific details can clutter the shared instructions and consume context in sessions where those facts are irrelevant."}, {"l": "D", "ok": false, "t": "Compact the session before ending work and resume it tomorrow.", "e": "Resuming is a valid way to continue a session, but it does not recover details that the compacted summary has already lost. The scenario explicitly establishes that compaction is failing to preserve the precise findings."}], "o": "<p>Conversation history is a temporary and potentially lossy store of information. Compaction summarizes the history, and summaries may lose precise details such as:<\/p>\n<ul><li>A database column that must remain nullable.<\/li><li>An exact file-and-line association.<\/li><li>A specific compatibility constraint.<\/li><li>An important exception discovered during debugging.<\/li><\/ul>\n<p>The reliable solution is to externalize task-specific state while the investigation is happening.<\/p>\n<p>For example, a scratchpad might record:<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Finding<\/th><th>Location<\/th><th>Constraint<\/th><\/tr><\/thead><tbody><tr><td>Database column must remain nullable<\/td><td>Relevant schema or migration file<\/td><td>Do not introduce a <code>NOT NULL<\/code> constraint<\/td><\/tr><tr><td>Legacy behavior must be preserved<\/td><td>Relevant implementation file<\/td><td>Preserve existing compatibility behavior<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>These entries illustrate the scratchpad format; they are not additional findings from the source file.<\/em><\/p>\n<p>At the beginning of the next session, Claude should read the scratchpad before continuing. This preserves the conclusions without forcing the team to rediscover everything.<\/p>\n<p>The important distinction is between three kinds of information:<\/p>\n<ul><li><strong>Conversation history:<\/strong> Temporary context that may be summarized.<\/li><li><strong><code>CLAUDE.md<\/code>:<\/strong> Durable project or team instructions.<\/li><li><strong>Scratchpad:<\/strong> Working state and findings specific to an ongoing task.<\/li><\/ul>\n<p><strong>Key takeaway:<\/strong> Write precise investigation findings to a persistent scratchpad as they are discovered, and reload them explicitly when work resumes.<\/p>", "docs": []}, {"k": "4.31", "d": "d3", "title": "Reducing Context Usage With Path-Scoped Rules", "scen": "<p>A team splits a large project <code>CLAUDE.md<\/code> into multiple standards files using <code>@path<\/code> imports. Despite the reorganization, per-session token usage does not decrease. Example import paths in a contributor guide are also unintentionally importing real files.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO changes should the team make? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Put double quotes around import paths containing spaces.", "e": "Quoted paths are not imported as intended. Paths containing spaces must use backslash-escaped spaces so the entire path resolves correctly."}, {"l": "B", "ok": true, "t": "Move applicable standards into path-scoped rules.", "e": "Path-scoped rules use file-matching patterns to load instructions only when Claude works on relevant files. This prevents unrelated standards from consuming context in every session."}, {"l": "C", "ok": true, "t": "Wrap example import paths in backticks.", "e": "Markdown code spans and fenced code blocks prevent <code>@path<\/code> examples from being parsed as imports. This lets the guide show example paths without loading the referenced files."}, {"l": "D", "ok": false, "t": "Start Claude Code from each package directory.", "e": "Incorrect for the stated goal. Starting from a package directory can help manage monorepo context, but ancestor <code>CLAUDE.md<\/code> files still load. Their imports also expand, so the original context cost may remain."}], "o": "<p>The <code>@path<\/code> syntax provides modularity, not automatic token savings. When a session starts, imported files are expanded into the instruction context. Splitting one large file into several imported files can make the instructions easier to maintain without reducing their total size.<\/p>\n<p>Path-scoped rules address a different problem: <strong>loading only the instructions relevant to the current files<\/strong>. A rule can target a subset of the codebase through a path pattern, avoiding unnecessary context for unrelated tasks.<\/p>\n<p>The contributor guide presents a second issue. An import path written as ordinary text can be interpreted as a real import. Backticks make the example literal.<\/p>\n<p><strong>Key takeaway:<\/strong> Use path-scoped rules to reduce irrelevant context, and use Markdown code formatting to show import examples safely.<\/p>", "docs": []}, {"k": "4.32", "d": "d1", "title": "Batching Independent Subagents and Handling Failed Calls", "scen": "<p>A coordinator delegates three tasks:<\/p>\n<ul><li>Search for deprecated API usage.<\/li><li>Build a dependency map.<\/li><li>Create a migration plan that requires both earlier results.<\/li><\/ul>\n<p>Sometimes the agent loop cannot launch one of the batched <code>Task<\/code> calls.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO implementation practices are correct? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Emit all three <code>Task<\/code> calls in one response and let the scheduler determine the order.", "e": "The migration plan depends on results that do not yet exist. No scheduling strategy can give the planning subagent findings that have not been produced and passed into its prompt."}, {"l": "B", "ok": false, "t": "Set <code>tool_choice<\/code> to <code>any<\/code> to guarantee multiple <code>Task<\/code> calls.", "e": "<code>any<\/code> forces the model to use at least one tool. It does not guarantee multiple tool calls in a single response."}, {"l": "C", "ok": true, "t": "Batch the two independent investigations, then delegate the migration plan afterward.", "e": "The deprecated-API search and dependency map can run independently. The migration plan must wait until both results are available so they can be included in its delegation prompt."}, {"l": "D", "ok": true, "t": "Return an error-marked <code>tool_result<\/code> for a call that could not launch, alongside the other results.", "e": "Every tool call in a batch needs a corresponding result. If a call fails or cannot launch, the coordinator must receive an error-marked result rather than having the result silently omitted."}], "o": "<p>Parallel execution is appropriate when tasks are independent. The two initial investigations do not depend on each other, so they can be emitted together in one assistant response. The migration plan, however, depends on their results and must be delegated afterward.<\/p>\n<p>The tool-result protocol also matters. Every <code>tool_use<\/code> block needs a matching <code>tool_result<\/code> block, and results from a batch must be returned together in the next user message.<\/p>\n<p>A failed or skipped call still needs a corresponding result marked with <code>is_error: true<\/code>. This allows the coordinator to understand the failure and decide whether to retry, continue with partial information, or change its plan.<\/p>\n<p><strong>Key takeaway:<\/strong> Batch independent work, wait for prerequisites before dependent work, and return a result for every tool call—including failures.<\/p>", "docs": []}, {"k": "4.33", "d": "d1", "title": "Replacing an Unpredictable Agent Loop With a Fixed Pipeline", "scen": "<p>An agent scaffolds endpoints using one open-ended prompt. The steps never change: copy a template, write code and tests, and update a registry. Tool-call counts vary widely, and the registry update is sometimes skipped.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the team restructure this task?<\/p>", "c": [{"l": "A", "ok": false, "t": "Spawn a parallel subagent for each step.", "e": "Parallel subagents are useful for independent workstreams. Here, the tests depend on the generated code, and the registry update comes last. Running these steps concurrently would violate their dependencies."}, {"l": "B", "ok": true, "t": "Restructure the task as a fixed sequential pipeline.", "e": "The subtasks are known in advance and their order does not vary. A fixed pipeline makes each step explicit and ensures that the registry update is not left to the model's discretion."}, {"l": "C", "ok": false, "t": "Add few-shot examples showing the correct sequence.", "e": "Examples may improve the likelihood that the model follows the sequence, but they do not guarantee it. A predefined pipeline enforces the required order in the orchestration code."}, {"l": "D", "ok": false, "t": "Keep the open-ended loop but set <code>max_turns<\/code>.", "e": "<code>max_turns<\/code> limits how many tool-use rounds the agent can perform. It does not ensure that every required step executes, so the registry update could still be skipped."}], "o": "<p>The main design decision is whether the task needs dynamic agent behavior or a predictable workflow.<\/p>\n<p>An agent loop is useful when the next step depends on information discovered along the way. Here, the sequence is known in advance, so a fixed pipeline is a better fit:<\/p>\n<ol><li>Copy the template.<\/li><li>Generate the implementation.<\/li><li>Generate and run the tests.<\/li><li>Update the registry.<\/li><\/ol>\n<p>The orchestration code can enforce the sequence, check each step's result, and stop or report an error if a prerequisite fails.<\/p>\n<p>A fixed pipeline also reduces unnecessary tool-call variation, latency, and cost. There is little benefit in allowing the model to decide dynamically which step to perform next when the steps never change.<\/p>\n<p><strong>Key takeaway:<\/strong> Use deterministic orchestration for predictable tasks with fixed steps; reserve agentic flexibility for work that genuinely requires adaptation.<\/p>", "docs": []}, {"k": "4.34", "d": "d2", "title": "Providing a Live Module Inventory as Reference Context", "scen": "<p>An MCP server wraps a module library and exposes <code>list<\/code> and <code>describe<\/code> tools. Teams add modules every week. The agent must have the current inventory available as reference context before it makes any tool calls.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change achieves this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Force the list tool to run first with <code>tool_choice<\/code>.", "e": "This guarantees the order of a model-invoked tool call, but the inventory is still obtained through a tool call. It is not available as reference context before any calls occur."}, {"l": "B", "ok": true, "t": "Expose the catalog as an MCP resource and have the host attach it.", "e": "MCP resources are designed for read-oriented information such as catalogs, schemas, and documentation. The host can fetch the live catalog and include it in the agent's context at session start."}, {"l": "C", "ok": false, "t": "Copy the current inventory into the system prompt.", "e": "This provides initial context, but the catalog becomes stale as teams add modules. The scenario requires a live inventory rather than a manually maintained snapshot."}, {"l": "D", "ok": false, "t": "Merge the list and describe tools into one discovery tool.", "e": "Combining the tools may reduce round trips, but the agent must still call the discovery tool before it learns about the inventory."}], "o": "<p>MCP distinguishes between tools and resources:<\/p>\n<ul><li><strong>Tools<\/strong> represent actions that the model chooses to invoke.<\/li><li><strong>Resources<\/strong> represent read-oriented information that the host can retrieve and supply as context.<\/li><\/ul>\n<p>A live module catalog is reference data, not an action. Exposing it as a resource allows the server to generate the catalog from its current inventory, so new modules appear without manually editing the agent's prompt.<\/p>\n<p>One important distinction: creating a resource does not automatically place its contents in the model's context. The host application must fetch the resource and attach the returned content when initializing the session or preparing the prompt.<\/p>\n<p><strong>Key takeaway:<\/strong> Use MCP resources for live reference information that must be available before the agent begins acting.<\/p>", "docs": []}, {"k": "4.35", "d": "d2", "title": "Correctly Replacing Built-In Bash Tool Output in a Hook", "scen": "<p>A developer's <code>PostToolUse<\/code> hook redacts internal hostnames from Bash command output. The hook returns <code>updatedToolOutput<\/code> as a plain string, but Claude still sees the original, unredacted output.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should the developer change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the redaction to <code>PreToolUse<\/code> and rewrite the command using <code>updatedInput<\/code>.", "e": "<code>PreToolUse<\/code> runs before command execution and can change the input. It cannot reliably redact arbitrary hostnames that only become known after the command has produced its output."}, {"l": "B", "ok": true, "t": "Return a structured object matching Bash's output shape.", "e": "Built-in tools return structured output objects. Bash output includes fields such as <code>stdout<\/code> and <code>stderr<\/code>. A replacement that does not match the expected output schema can be discarded, leaving Claude with the original output."}, {"l": "C", "ok": false, "t": "Return a block decision with the redacted text as the reason.", "e": "A block decision does not replace the tool output. The reason is added alongside the result, so the original hostnames remain visible."}, {"l": "D", "ok": false, "t": "Return the redacted text through <code>additionalContext<\/code>.", "e": "<code>additionalContext<\/code> adds information; it does not replace or hide the original output. Claude would receive the redacted text alongside the unredacted result."}], "o": "<p>A <code>PostToolUse<\/code> hook runs after a tool executes and can modify the output the model receives. The replacement must match the output format expected by that tool.<\/p>\n<p>For a built-in Bash tool, the output is a structured object rather than an arbitrary string. The replacement must preserve the expected structure and place the sanitized command output in the appropriate field, such as <code>stdout<\/code>.<\/p>\n<p>The alternatives fail for distinct reasons:<\/p>\n<ul><li><code>PreToolUse<\/code> modifies inputs before execution.<\/li><li>A block decision does not substitute for the original output.<\/li><li><code>additionalContext<\/code> appends information instead of removing sensitive data.<\/li><\/ul>\n<p>The source also distinguishes built-in tools from MCP tools: MCP tool output is passed through without the same schema validation, which is why returning a plain string may appear to work for an MCP tool but fail for Bash.<\/p>\n<p><strong>Key takeaway:<\/strong> When replacing built-in tool output, preserve its expected schema; returning a plain string may cause the replacement to be discarded.<\/p>", "docs": []}, {"k": "4.36", "d": "d3", "title": "Keeping Architecture Rules Active After Compaction", "scen": "<p>A rule file in <code>.claude/rules/<\/code> contains architecture conventions and a <code>paths<\/code> glob targeting source files. After compaction in long sessions, Claude Code ignores the conventions until it next touches a matching file. The team needs these rules active on every turn, including turns with no file edits.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should the team change?<\/p>", "c": [{"l": "A", "ok": true, "t": "Move the rule's content into the project-root <code>CLAUDE.md<\/code>.", "e": "Root <code>CLAUDE.md<\/code> instructions remain part of the active instruction context after compaction. Moving conventions that must apply on every turn into this file ensures they remain available even when no files are accessed."}, {"l": "B", "ok": false, "t": "Run <code>/compact<\/code> with an instruction telling the summary to keep the conventions.", "e": "Instructions supplied to <code>/compact<\/code> can influence the resulting summary, but the summary is lossy and does not guarantee that a path-scoped rule will be reloaded on every turn. Repeating this instruction at each compaction also adds maintenance overhead."}, {"l": "C", "ok": false, "t": "Broaden the rule's <code>paths<\/code> glob to <code>**/*<\/code>.", "e": "This broadens the set of files that trigger the rule, but the rule still loads in response to matching file activity. A turn involving only discussion and no file access would still not trigger it."}, {"l": "D", "ok": false, "t": "Add an <code>InstructionsLoaded<\/code> hook that reloads the rule after each compaction.", "e": "The hook observes instruction-loading events, but it cannot force a path-scoped rule to load when no matching file activity occurs."}], "o": "<p>Claude Code instructions have different loading behavior depending on where they are defined.<\/p>\n<ul><li><strong>Project-root <code>CLAUDE.md<\/code>:<\/strong> The always-on instruction layer.<\/li><li><strong>Path-scoped rules in <code>.claude/rules/<\/code>:<\/strong> Conditional instructions that load when relevant files are accessed.<\/li><\/ul>\n<p>Path-scoped rules help save context because unrelated conventions do not need to be loaded continuously. The trade-off is that, after compaction, these rules are reloaded on demand when a matching file is touched.<\/p>\n<p>The scenario explicitly requires the conventions to apply during every turn, including turns with no file activity. Therefore, the content belongs in the always-loaded project instruction file rather than the conditional layer.<\/p>\n<p><strong>Key takeaway:<\/strong> Choose the instruction location according to how broadly and consistently the rule must apply. Use root <code>CLAUDE.md<\/code> for rules that must remain active across all turns.<\/p>", "docs": []}, {"k": "4.37", "d": "d1", "title": "Resuming an Unnamed Exploration Session", "scen": "<p>An engineer ran a long codebase exploration session yesterday but never gave it a name. Several unrelated sessions have run in the same repository since then.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO commands reopen that exact exploration session? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Run <code>claude --continue<\/code> in the repository.", "e": "<code>--continue<\/code> loads the most recent conversation in the current directory. Since several unrelated sessions have run since the original exploration, it would reopen a newer conversation rather than necessarily selecting yesterday's session."}, {"l": "B", "ok": true, "t": "Run <code>claude --resume<\/code> with no session argument and choose the session from the interactive picker.", "e": "Without a specific session argument, <code>--resume<\/code> opens an interactive picker listing previous sessions. The engineer can select the intended exploration even though it was never named."}, {"l": "C", "ok": true, "t": "Run <code>claude --resume<\/code> with the exploration session's session ID.", "e": "A session ID identifies the saved conversation directly. The session does not need a human-readable name to be resumed by its ID."}, {"l": "D", "ok": false, "t": "Start a new session, run <code>/rename<\/code>, then try to resume yesterday's session by that name.", "e": "<code>/rename<\/code> renames the current session. Running it in a new session would rename that new session, not the earlier exploration."}], "o": "<p>Claude Code saves conversations as sessions on disk. The <code>--resume<\/code> flag lets an engineer reopen a particular saved session using its ID or name, or choose it through the interactive picker.<\/p>\n<p>The distinction between the two main commands is important:<\/p>\n<ul><li><code>--continue<\/code> means “reopen the most recent conversation in this directory.”<\/li><li><code>--resume<\/code> means “reopen a particular saved conversation.”<\/li><\/ul>\n<p>Naming a session is convenient, but it is not a requirement for recovery. The session ID and interactive picker provide alternative ways to locate an unnamed session.<\/p>\n<p><strong>Key takeaway:<\/strong> Use <code>--resume<\/code> when you need a specific older session. Use <code>--continue<\/code> when the most recent conversation is the one you want.<\/p>", "docs": []}, {"k": "4.38", "d": "d1", "title": "Resuming a Named Dependency Investigation", "scen": "<p>An engineer named a dependency investigation session <code>dep-audit<\/code> last week. Several unrelated sessions have run in the same repository since then.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO actions reopen that specific investigation with its saved context? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Run <code>claude --name dep-audit<\/code>.", "e": "<code>--name<\/code> assigns a display name to a session being launched. It does not search for and attach to an existing session. This would create a new session with that name rather than reopen the saved investigation."}, {"l": "B", "ok": false, "t": "Run <code>claude --continue<\/code> in the repository.", "e": "<code>--continue<\/code> reopens the most recent conversation in the current directory. It does not target the named investigation, and newer unrelated sessions may be selected instead."}, {"l": "C", "ok": true, "t": "Run <code>/resume dep-audit<\/code> from inside a running session.", "e": "The in-session <code>/resume<\/code> command accepts a saved session's name or ID. It lets the engineer switch to the named dependency investigation without restarting the CLI."}, {"l": "D", "ok": true, "t": "Run <code>claude --resume<\/code> without an argument and choose <code>dep-audit<\/code> from the picker.", "e": "The interactive picker lets the engineer find and select the saved named session, restoring its conversation context."}], "o": "<p>Claude Code offers two primary ways to resume a specific saved session:<\/p>\n<ul><li><strong>CLI resumption:<\/strong> <code>claude --resume<\/code> can target a session by name or ID, or open the interactive picker when no argument is supplied.<\/li><li><strong>In-session resumption:<\/strong> <code>/resume<\/code> can switch to a named session or one identified by its ID.<\/li><\/ul>\n<p>By contrast, <code>--name<\/code> and <code>/rename<\/code> are naming operations, not mechanisms for locating a prior session. They label the session being created or currently used.<\/p>\n<p>The <code>--continue<\/code> option is also different: it targets the most recent conversation rather than a particular older session.<\/p>\n<p><strong>Key takeaway:<\/strong> Use <code>--name<\/code> or <code>/rename<\/code> to label sessions, and use <code>--resume<\/code> or <code>/resume<\/code> to return to a saved session.<\/p>", "docs": []}, {"k": "4.39", "d": "d2", "title": "Making MCP Policy Denials Understandable", "scen": "<p>Several agents across different teams call the same MCP tool. The tool denies production schema changes without an approved change ticket. The denial has <code>isError: true<\/code> and a team-defined <code>retriable: false<\/code> field, so agents stop retrying.<\/p>\n<p>However, the error content contains only internal policy rule IDs. Since the policy engine adds new rules every month, agents tell engineers that an unknown error occurred.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Mark the denial as a validation error and provide a hint naming the missing ticket parameter.", "e": "The problem is not malformed input. The operation is prohibited until a human approval process has been completed. Asking the agent to retry with a corrected parameter cannot substitute for the required approval."}, {"l": "B", "ok": true, "t": "Put a plain-language reason and the approved next step into the error content.", "e": "The tool should return an understandable explanation of why the operation was denied and what the engineer must do next, such as filing an approved change ticket."}, {"l": "C", "ok": false, "t": "Add a table to every agent's system prompt mapping internal rule IDs to friendly messages.", "e": "This duplicates the mapping across agents and requires continual updates as the policy engine adds rules. New IDs that are missing from the table would recreate the same problem."}, {"l": "D", "ok": false, "t": "Include the full policy engine rejection payload and all rule documentation links.", "e": "More internal detail does not necessarily make the error more useful to the engineer. The issue is the lack of a clear explanation and actionable next step, not a lack of raw policy data."}], "o": "<p>When a tool rejects an operation, its error content is an important source of information for the model. If the content contains only internal identifiers, the agent has little basis for explaining the denial in useful language.<\/p>\n<p>A better error should include:<\/p>\n<ul><li><strong>Reason:<\/strong> Why the action was denied.<\/li><li><strong>Next step:<\/strong> What the engineer should do to satisfy the policy.<\/li><li><strong>Retry guidance:<\/strong> Whether the action can be retried or requires an external approval.<\/li><\/ul>\n<p>In this case, an approved change ticket is a human-process requirement, so the error should direct the engineer to that process rather than invite futile retries.<\/p>\n<p>The <code>isError<\/code> flag marks the tool result as an error. The <code>retriable<\/code> field in this scenario is a team-defined convention, not a standardized MCP field. Together with clear error content, it can help the agent distinguish a policy denial from a transient failure.<\/p>\n<p><strong>Key takeaway:<\/strong> Make shared tool errors understandable and actionable at the source, rather than maintaining separate rule-ID translations in every agent prompt.<\/p>", "docs": []}, {"k": "4.40", "d": "d2", "title": "Enforcing Complete Escalation Handoffs With a Schema", "scen": "<p>A developer productivity agent escalates stuck tasks to an on-call engineer through an MCP tool named <code>escalate_to_engineer<\/code>. The tool accepts one free-text message field.<\/p>\n<p>Prompt instructions already list the required details, but escalations often omit the files examined and the fixes attempted.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change makes each handoff reliably complete?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add few-shot examples of complete escalations to the system prompt.", "e": "Few-shot examples can improve the consistency of generated responses, but they remain behavioral guidance. The scenario already shows that prompt instructions alone have not reliably produced complete escalations."}, {"l": "B", "ok": true, "t": "Replace the free-text field with a structured input schema containing required fields.", "e": "A structured schema can make the required handoff information part of the tool's input contract. The tool call must supply the required fields rather than relying on Claude to remember every detail in an unstructured message."}, {"l": "C", "ok": false, "t": "Attach the full session transcript and raw tool outputs to every escalation.", "e": "A transcript may contain the relevant details, but it also contains large amounts of unprocessed information. The on-call engineer would still need to reconstruct which files were examined and which fixes were attempted."}, {"l": "D", "ok": false, "t": "Add a severity rating and self-rated confidence score to every escalation.", "e": "Severity and confidence can help prioritize incidents, but they do not provide the missing investigation details. An escalation can be correctly prioritized and still be incomplete."}], "o": "<p>An escalation is a transfer of working state from the agent to a human engineer. The receiving engineer may not have access to the agent's session, so the escalation must contain the information necessary to continue the investigation.<\/p>\n<p>A free-text field leaves completeness dependent on the model remembering every requested detail. Prompt instructions and examples can improve the odds, but they do not enforce the structure.<\/p>\n<p>A schema with required fields turns the handoff requirements into an explicit interface contract. Each escalation must provide the files examined, current root-cause analysis, attempted fixes, and recommended action before it can satisfy the required input structure.<\/p>\n<p>For MCP tools, required input-schema fields define the contract. The <code>strict: true<\/code> mechanism associated with Messages API tool use is a separate feature and should not be assumed to be an MCP schema flag.<\/p>\n<p><strong>Key takeaway:<\/strong> When a handoff must contain specific information every time, enforce completeness through the tool's input schema rather than relying only on prompt instructions.<\/p>", "docs": []}, {"k": "4.41", "d": "d2", "title": "Fixing Authentication for a Remote HTTP MCP Server", "scen": "<p>A team has committed a <code>.mcp.json<\/code> configuration defining a remote HTTP MCP server. Its headers block sets <code>Authorization<\/code> to <code>Bearer ${ANTHROPIC_AUTH_TOKEN}<\/code> because engineers already export that variable in their shells. However, connections fail with HTTP 401 even though the environment variable is set.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change fixes authentication?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have each engineer run <code>claude mcp reset-project-choices<\/code>.", "e": "This resets approval choices for project-scoped MCP servers. Approval determines whether a server can be used; it does not fix the credential sent in an HTTP request. The HTTP 401 indicates that the remote service is rejecting the authentication information."}, {"l": "B", "ok": false, "t": "Move <code>${ANTHROPIC_AUTH_TOKEN}<\/code> from the headers block into the server entry's <code>env<\/code> block.", "e": "The <code>env<\/code> block configures environment variables for a locally launched server process, such as a stdio server. A remote HTTP server is not launched as a local process, and its <code>env<\/code> block does not automatically send an HTTP authorization header."}, {"l": "C", "ok": false, "t": "Use <code>${ANTHROPIC_AUTH_TOKEN:-PLACEHOLDER_TOKEN}<\/code> to provide a fallback.", "e": "Although fallback syntax is supported in ordinary variable expansion, Claude Code treats its own credential variable names specially in remote server URL and header fields. The protected variable can still expand to an empty string, so adding a fallback does not solve this case."}, {"l": "D", "ok": true, "t": "Copy the token into a differently named variable and reference that variable in the headers block.", "e": "Claude Code treats certain variables used for its own authentication, including <code>ANTHROPIC_AUTH_TOKEN<\/code> and <code>ANTHROPIC_API_KEY<\/code>, as protected in remote server URL and header expansion. Copying the token into a variable such as <code>MCP_SEARCH_TOKEN<\/code> allows the ordinary <code>${VAR}<\/code> expansion to work."}], "o": "<p>The important distinction is between a variable being available in the shell and Claude Code allowing that variable to be expanded in a particular configuration field.<\/p>\n<p>A remote HTTP MCP server can use a header such as:<\/p>\n<pre><code class=\"lang-json\">{\n  \"headers\": {\n    \"Authorization\": \"Bearer ${MCP_SEARCH_TOKEN}\"\n  }\n}<\/code><\/pre>\n<p>The token itself should be supplied securely through the environment rather than committed to source control.<\/p>\n<p>The protected-variable behavior helps prevent a repository-provided configuration from inadvertently forwarding the credentials used to authenticate Claude Code itself to an arbitrary remote endpoint.<\/p>\n<p><strong>Key takeaway:<\/strong> For remote MCP authentication, use a dedicated environment variable with a non-protected name and reference it in the HTTP headers.<\/p>", "docs": []}, {"k": "4.42", "d": "d2", "title": "Improving MCP Tool Selection When Descriptions Are Truncated", "scen": "<p>An MCP tool named <code>find_references<\/code> has a generated description of 7,000 characters. Parameter details appear first, while the description of returned data and guidance about when to use the tool instead of Grep appear near the end.<\/p>\n<p>Claude Code truncates descriptions of tools loaded at session start at a default limit of 4,096 characters. Consequently, the agent keeps choosing Grep rather than <code>find_references<\/code>.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What is the most direct fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Increase <code>CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH<\/code> on each engineer's machine.", "e": "Incorrect as the best fix. This environment variable can raise the limit in supported versions, but it requires configuration across individual environments. It also loads additional description text when the routing problem can be fixed directly in the shared tool description."}, {"l": "B", "ok": false, "t": "Set the <code>anthropic/alwaysLoad<\/code> metadata flag on the tool.", "e": "This flag controls whether a tool is loaded into context up front rather than deferred behind tool search. In the scenario, the tool already loads at session start. The flag does not increase the description-length limit."}, {"l": "C", "ok": false, "t": "Add a <code>CLAUDE.md<\/code> rule instructing the agent always to prefer <code>find_references<\/code> over Grep.", "e": "This provides behavioral guidance but does not address why the model chooses Grep: the model cannot see the tool's purpose and routing guidance because that text falls beyond the truncation point. A blanket preference can also lead to inappropriate tool use when Grep is actually more suitable."}, {"l": "D", "ok": true, "t": "Move the purpose, returned data, and guidance about when to use the tool instead of Grep to the beginning of the description.", "e": "Claude sees the beginning of the description before the truncation point. Putting the most important selection information first ensures it remains visible even when the full description is too long."}], "o": "<p>Tool descriptions are a major factor in tool selection. The model needs to understand three things before it can choose effectively:<\/p>\n<ol><li><strong>Purpose:<\/strong> What does the tool do?<\/li><li><strong>Output:<\/strong> What information does it return?<\/li><li><strong>Routing boundary:<\/strong> When is it preferable to a built-in alternative such as Grep?<\/li><\/ol>\n<p>A description that begins with a long list of parameters but hides these details near the end gives the model the wrong information for deciding which tool to call.<\/p>\n<p>A better structure is:<\/p>\n<ul><li>Start with the tool's purpose.<\/li><li>Describe the data it returns.<\/li><li>Explain when to use it instead of Grep.<\/li><li>Put parameter details and edge cases afterward.<\/li><\/ul>\n<p><strong>Key takeaway:<\/strong> Put tool-selection guidance first. The opening portion of a tool description should explain what it does, what it returns, and when to use it.<\/p>", "docs": []}, {"k": "4.43", "d": "d2", "title": "Choosing Between Existing and Custom MCP Integrations", "scen": "<p>A team building developer productivity tools needs two integrations:<\/p>\n<ul><li>Reading Jira issues for task context.<\/li><li>Querying an internal deployment tracker used only by that team.<\/li><\/ul>\n<p>Integration time is limited.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the team build or source these integrations?<\/p>", "c": [{"l": "A", "ok": false, "t": "Call both systems' REST APIs through Bash.", "e": "Raw REST calls through Bash may work mechanically, but they bypass the structured tool interfaces that help agents select and use tools reliably. Tool descriptions, input schemas, and structured error handling are useful parts of an MCP integration."}, {"l": "B", "ok": false, "t": "Build custom MCP servers for both systems.", "e": "Custom servers allow the team to tailor tool names and descriptions, but building a new Jira integration duplicates existing functionality. With limited integration time, maintaining a custom connector for a standard service is unnecessary if a suitable reviewed connector already exists."}, {"l": "C", "ok": false, "t": "Implement both integrations in-process with <code>create_sdk_mcp_server<\/code>.", "e": "The Agent SDK supports in-process MCP servers, which are useful for application-specific tools. However, reimplementing the standard Jira integration this way duplicates existing functionality and creates ongoing maintenance work."}, {"l": "D", "ok": true, "t": "Reuse an existing reviewed Jira MCP connector and build a custom server for the internal tracker.", "e": "Jira is a standard service for which existing connectors are available. The internal deployment tracker is unique to the team, making a custom MCP server appropriate for that integration."}], "o": "<p>The central decision is whether to reuse an existing integration or build one from scratch.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Integration<\/th><th>Best approach<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Jira<\/td><td>Use an existing reviewed MCP connector<\/td><td>Standard service with existing integration options<\/td><\/tr><tr><td>Internal deployment tracker<\/td><td>Build a custom MCP server<\/td><td>Team-specific functionality may not have an existing connector<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Reusing a maintained connector saves implementation time and avoids taking responsibility for duplicating authentication, tool definitions, error handling, and future API changes.<\/p>\n<p>A custom server is justified when the required functionality is unique and cannot be adequately covered by an existing connector.<\/p>\n<p>The team can still improve tool selection through descriptions and configuration without necessarily owning a custom server for every standard service.<\/p>\n<p><strong>Key takeaway:<\/strong> Treat MCP servers like software dependencies: reuse maintained integrations for common services and build custom integrations for genuinely unique requirements.<\/p>", "docs": []}, {"k": "4.44", "d": "d1", "title": "Passing Discovered Conventions to a Subagent", "scen": "<p>An agent has made dozens of tool calls while investigating a legacy module's naming and error-handling conventions. It then spawns a code-generation subagent, but the generated boilerplate ignores all the conventions the parent discovered.<\/p>\n<p>The team cannot afford to repeat the exploration.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should be changed?<\/p>", "c": [{"l": "A", "ok": false, "t": "Pass the current session ID to the subagent so it resumes with the parent's conversation history.", "e": "Resuming a session continues that session's own previous work. A session ID does not give a newly spawned subagent access to the parent's accumulated conversation history or tool results."}, {"l": "B", "ok": false, "t": "Move the convention summary into the parent agent's system prompt.", "e": "A non-fork subagent runs with its own system prompt, not the parent's. Adding information to the parent's system prompt does not automatically pass that information to the subagent."}, {"l": "C", "ok": true, "t": "Put the convention summary and relevant file paths in the spawning Agent tool prompt.", "e": "A non-fork subagent starts with a fresh context window. The delegation prompt is the explicit channel through which the parent provides the information the subagent needs."}, {"l": "D", "ok": false, "t": "Add Read and Grep to the subagent's allowed tools so it can rediscover the conventions.", "e": "Incorrect in this scenario. Giving the subagent read tools can be useful generally, but it would require repeating the expensive exploration. The scenario explicitly says that the team cannot afford to repeat that work."}], "o": "<p>A subagent is a separate agent instance, not a helper that automatically shares the parent's memory.<\/p>\n<p>A non-fork subagent does not automatically inherit:<\/p>\n<ul><li>The parent's conversation history.<\/li><li>The parent's tool results.<\/li><li>The parent's system prompt.<\/li><\/ul>\n<p>Instead, the parent must explicitly provide the relevant context in the delegation prompt.<\/p>\n<p>For code-generation tasks, useful context includes:<\/p>\n<ul><li>Naming conventions discovered during exploration.<\/li><li>Error-handling patterns.<\/li><li>Relevant file paths.<\/li><li>Existing examples that the generated code should follow.<\/li><li>Decisions already made by the parent agent.<\/li><\/ul>\n<p>This approach preserves the benefit of subagents: verbose exploration stays in the parent or exploring agent's context, while the code-generation subagent receives a concise summary of the findings it needs.<\/p>\n<p><strong>Key takeaway:<\/strong> When delegating to a new subagent, explicitly pass all necessary findings and file paths in the delegation prompt. Do not assume that the subagent inherits the parent's context.<\/p>", "docs": []}, {"k": "4.45", "d": "d1", "title": "Enforcing a Two-Stage Audit Pipeline", "scen": "<p>A team is building a two-stage audit of legacy modules:<\/p>\n<ol><li>A quick scan identifies risky modules.<\/li><li>A deep analysis investigates only the flagged modules.<\/li><\/ol>\n<p>Compliance requires each stage's output to be stored as a separate audit record. The deep analysis must never run if the quick scan flags nothing.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which design meets both requirements?<\/p>", "c": [{"l": "A", "ok": false, "t": "Send one request with numbered steps and ask Claude to wrap each stage's output in separate XML-tagged sections.", "e": "Numbered steps and XML-tagged output can help organize a response, and the application could parse the sections into records. However, the model would still decide within a single response whether to execute the second stage. Instructions alone cannot guarantee that the deep analysis never runs when no modules are flagged."}, {"l": "B", "ok": true, "t": "Use separate API calls for the stages and let application code decide whether to call the second stage.", "e": "The application receives the scan's result, stores it as an audit record, and checks whether any modules were flagged. It invokes the deep-analysis API call only when the list is nonempty."}, {"l": "C", "ok": false, "t": "Set <code>max_turns<\/code> to one turn per stage so the agent loop pauses after each stage.", "e": "<code>max_turns<\/code> limits tool-use round trips within an agent run. It does not define separate pipeline stages, guarantee a clean per-stage response, or make the application decide whether the next stage should run."}, {"l": "D", "ok": false, "t": "Spawn one subagent for each stage in parallel.", "e": "Parallel subagents are suitable for independent tasks. Here, the deep analysis depends on the scan's findings and must be skipped if the scan finds nothing. Running both stages in parallel violates that dependency."}], "o": "<p>This problem has two application-level requirements:<\/p>\n<ul><li>Each stage's output must be available separately so it can be stored as an independent audit record.<\/li><li>The second stage must not run when the first stage flags no modules.<\/li><\/ul>\n<p>Prompt chaining is the appropriate pattern. Each stage is a separate API call, allowing the application to inspect and store the intermediate output before deciding what to do next.<\/p>\n<p>A simplified flow is:<\/p>\n<pre><code class=\"lang-text\">Run quick scan\n      |\n      v\nStore scan output\n      |\n      v\nWere any modules flagged?\n      |\n   +--+--+\n   |     |\n  No    Yes\n   |     |\n   v     v\n Stop   Run deep analysis\n             |\n             v\n      Store deep-analysis output<\/code><\/pre>\n<p>The decision to invoke the second stage is made by application code rather than left to the model's instructions. That is what makes the skip condition enforceable.<\/p>\n<p>The alternatives fail for distinct reasons:<\/p>\n<ul><li><strong>One request with XML sections:<\/strong> Produces organized output but leaves the conditional execution decision to the model.<\/li><li><strong><code>max_turns<\/code>:<\/strong> Limits execution length rather than defining an application-controlled pipeline.<\/li><li><strong>Parallel subagents:<\/strong> Ignores the dependency between the scan and deep analysis.<\/li><\/ul>\n<p><strong>Key takeaway:<\/strong> When a workflow requires inspectable intermediate results and a guaranteed conditional branch, use separate API calls with application-level control flow.<\/p>", "docs": []}, {"k": "4.46", "d": "d4", "title": "Making Severity Ratings Consistent for Security Triage", "scen": "<p>A nightly security audit reports findings through a tool whose schema limits severity to four enum values, so every label is structurally valid. However, a missing authorization check on a payments endpoint is rated <em>medium<\/em>, while an outdated comment is rated <em>critical<\/em>. On-call engineers triage findings by severity, causing them to investigate the wrong issues first.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change makes the severity labels dependable for triage?<\/p>", "c": [{"l": "A", "ok": false, "t": "Enable strict mode on the audit tool definition.", "e": "Strict tool use validates that tool inputs conform to the schema. The scenario already guarantees that every severity value is one of the four allowed enum values. Structural validation cannot determine which valid severity is appropriate for a particular finding."}, {"l": "B", "ok": true, "t": "Add written definitions for each severity level, with a concrete code example for each level.", "e": "The problem is inconsistent judgment, not invalid output. Defining severity levels with concrete examples gives the model an operational rubric for classifying findings according to their actual impact."}, {"l": "C", "ok": false, "t": "Run a second independent audit and report only ratings on which both instances agree.", "e": "Independent reviews can help identify missed issues, but agreement does not establish a correct severity standard. If both instances use the same undefined criteria, their ratings may remain inconsistent. Discarding disagreements can also silently remove legitimate findings."}, {"l": "D", "ok": false, "t": "Derive severity from the directory containing the affected file.", "e": "File location is not a reliable measure of impact. A harmless comment in a payments directory could be rated above a serious authorization flaw in shared middleware, reproducing the triage problem."}], "o": "<p>This is a <strong>semantic consistency problem<\/strong>, not a structural validation problem.<\/p>\n<p>A schema enum restricts the possible outputs, but it does not define the decision boundary between severity levels. To make ratings useful for triage, the prompt must specify what each level means and illustrate the criteria with concrete examples.<\/p>\n<p>The broader principle is that different reliability mechanisms solve different problems:<\/p>\n<ul><li><strong>Schema validation<\/strong> controls output shape and permitted values.<\/li><li><strong>Written criteria<\/strong> define how categories should be interpreted.<\/li><li><strong>Concrete examples<\/strong> demonstrate how those criteria apply to realistic findings.<\/li><li><strong>Independent review<\/strong> can help detect issues, but does not replace a clear classification rubric.<\/li><\/ul>\n<p><strong>Key takeaway:<\/strong> When outputs are valid but classifications are inconsistent, improve the definitions and examples rather than tightening the schema.<\/p>", "docs": []}, {"k": "4.47", "d": "d4", "title": "Making Suggested Fixes Consistently Actionable", "scen": "<p>Review findings already arrive as schema-valid JSON through a <code>tool_use<\/code> extraction. However, the <code>suggested_fix<\/code> field varies: some findings contain exact code changes, while others only say “consider refactoring.” Detailed written rules describing concrete fixes have not reduced the variation.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change most reliably makes the fixes consistently actionable?<\/p>", "c": [{"l": "A", "ok": false, "t": "Ask Claude to rate its confidence in each suggested fix and filter out findings below a threshold.", "e": "Confidence filtering changes which findings developers see, not the quality of the fixes themselves. The remaining fixes can still be vague or inconsistent."}, {"l": "B", "ok": false, "t": "Expand the written rules into explicit criteria for concrete fixes in each finding category.", "e": "Incorrect as the best answer here. Explicit criteria are useful, but the scenario states that detailed written rules have already failed to reduce the variation. Adding more prose repeats the technique that has not solved the problem."}, {"l": "C", "ok": true, "t": "Add example findings with exact code changes in their suggested fixes.", "e": "Few-shot examples demonstrate what an actionable fix looks like. The model can imitate concrete replacement code instead of repeatedly interpreting abstract instructions."}, {"l": "D", "ok": false, "t": "Tighten the tool's input schema so <code>suggested_fix<\/code> must contain a code block and meet a minimum length.", "e": "The output is already schema-valid. Requiring more characters or a code block does not guarantee useful content: a long explanation or irrelevant snippet can still be vague."}], "o": "<p>Schema validation guarantees structure, not quality. It can require a <code>suggested_fix<\/code> string, but it cannot ensure that the string contains a precise, useful correction.<\/p>\n<p>When detailed instructions fail to produce consistent output, examples can communicate the intended standard more effectively than additional prose.<\/p>\n<p>For example, rather than writing “fix the unsafe input handling,” an example could show the actual validation check or replacement code expected for that kind of finding.<\/p>\n<p>The best examples should:<\/p>\n<ul><li>Mirror realistic repository issues.<\/li><li>Show a concrete, implementable correction.<\/li><li>Maintain the same output structure used by the pipeline.<\/li><li>Demonstrate the intended degree of detail.<\/li><\/ul>\n<p><strong>Key takeaway:<\/strong> If the output is structurally valid but the content remains vague, demonstrate the desired quality through well-chosen examples.<\/p>", "docs": []}, {"k": "4.48", "d": "d4", "title": "Making Few-Shot Review Findings Consistent", "scen": "<p>A pipeline parses each review finding into <code>location<\/code>, <code>issue<\/code>, <code>severity<\/code>, and <code>suggested_fix<\/code> to post inline pull request comments. During the current sprint, only prompt text may change; the parser and API request configuration are frozen.<\/p>\n<p>The team is adding few-shot example findings to keep the output consistent.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO practices make these examples effective? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Define the finding format as a tool whose input schema lists the four fields.", "e": "Incorrect under the sprint constraints. Schema-enforced tool input can provide strong structural guarantees, but implementing it would require changing the API request configuration and rewriting the parser to read tool input rather than text. Both are frozen this sprint."}, {"l": "B", "ok": false, "t": "Replace real repository code in the examples with abstract placeholder snippets.", "e": "Realistic examples better reflect the use case and show how the expected output applies to actual code. Abstract placeholders can remove the context that helps the model produce relevant findings."}, {"l": "C", "ok": true, "t": "Write each example as a complete finding with the exact field names and field order.", "e": "Few-shot examples teach by demonstration. If examples omit fields, use different names, or change their order, the model may reproduce those inconsistencies in production output."}, {"l": "D", "ok": true, "t": "Keep the written format specification alongside the examples.", "e": "Written instructions and examples serve complementary purposes. The specification states the rules explicitly, while the examples demonstrate the required format in practice."}], "o": "<p>Few-shot examples are particularly useful when a downstream parser expects a stable format. The model learns from the structure and patterns demonstrated in the examples, so inconsistencies in the examples can become inconsistencies in real output.<\/p>\n<p>The most effective approach combines two mechanisms:<\/p>\n<ul><li><strong>Explicit specification:<\/strong> Describe the required output format and any rules for handling missing or uncertain values.<\/li><li><strong>Consistent examples:<\/strong> Demonstrate complete findings with the exact field names and ordering expected by the parser.<\/li><\/ul>\n<p>The sprint restriction matters. Although changing to schema-enforced tool output could be a reasonable future improvement, it is not available when the API configuration and parser cannot change.<\/p>\n<p><strong>Key takeaway:<\/strong> Keep the format specification explicit and make every example a faithful demonstration of the exact output contract.<\/p>", "docs": []}, {"k": "4.49", "d": "d4", "title": "Handling Contradictory Totals in Scan Reports", "scen": "<p>Claude extracts metrics from nightly scan reports into schema-validated JSON. Some reports state a total finding count that does not match the sum of their own per-category counts.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO design choices handle this correctly? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": true, "t": "Extract the stated total, calculated total, and a conflict flag.", "e": "The extraction should preserve the number stated in the report while separately calculating the total from the category counts. A <code>conflict_detected<\/code> flag makes discrepancies visible to downstream systems instead of silently choosing one value."}, {"l": "B", "ok": false, "t": "Encode the equality rule as a numeric constraint in the JSON schema.", "e": "JSON Schema cannot express the required cross-field equality rule in this scenario, and structured outputs do not support numeric constraints such as <code>minimum<\/code>, <code>maximum<\/code>, or <code>multipleOf<\/code>. Unsupported schema features can cause a request error."}, {"l": "C", "ok": false, "t": "Retry extraction with the mismatch reported as a validation error until the totals agree.", "e": "The scenario says that the source report itself contains inconsistent totals. Repeatedly asking the model to make the values agree risks changing information that is genuinely present in the source."}, {"l": "D", "ok": true, "t": "Verify the arithmetic in pipeline code.", "e": "Schema validation ensures that the output has the expected structure and data types. It does not guarantee that the calculated total actually equals the stated total. Application code should perform the comparison and route discrepancies for appropriate handling."}], "o": "<p>The key distinction is between <strong>structural validity<\/strong> and <strong>semantic consistency<\/strong>.<\/p>\n<p>A JSON object can be perfectly valid while containing contradictory numbers. The appropriate response is to preserve the source's stated value, calculate the value implied by the category counts, and explicitly flag any mismatch.<\/p>\n<p>A useful output structure is:<\/p>\n<pre><code class=\"lang-json\">{\n  \"stated_total\": 125,\n  \"calculated_total\": 119,\n  \"conflict_detected\": true\n}<\/code><\/pre>\n<p>The values above are illustrative. In a real extraction, the fields should reflect the source report and the calculation performed from its category counts.<\/p>\n<p>The pipeline should then independently verify the arithmetic and decide whether the report needs review, quarantine, or an alert.<\/p>\n<p><strong>Key takeaway:<\/strong> Do not force contradictory source values to agree. Preserve both values, flag the discrepancy, and verify the arithmetic in code.<\/p>", "docs": []}, {"k": "4.50", "d": "d3", "title": "Loading Conventions Only for Matching Files", "scen": "<p>The project <code>CLAUDE.md<\/code> has grown large. It contains API review criteria, conventions for test files spread throughout the repository, and frontend styling rules.<\/p>\n<p>The team wants each convention to load automatically, but only when a CI review touches matching files.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should they do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add directory-level <code>CLAUDE.md<\/code> files in <code>src/api<\/code>, the test folders, and the frontend tree.", "e": "Directory-level files work when the convention belongs to a specific directory. However, test files are spread throughout the repository, so a single directory-level file cannot cover all of them. A path-scoped glob can match files by type regardless of where they are located."}, {"l": "B", "ok": false, "t": "Convert each topic into a skill under <code>.claude/skills/<\/code>.", "e": "Skills are designed for on-demand, task-specific workflows. A skill is not guaranteed to run automatically whenever a CI review encounters a matching file, so standing conventions could be skipped."}, {"l": "C", "ok": true, "t": "Split the content into topic files under <code>.claude/rules/<\/code> with <code>paths<\/code> globs in frontmatter.", "e": "Path-scoped rules support automatic conditional loading based on the files being accessed. Each topic can have its own glob, allowing conventions to load when relevant files are involved."}, {"l": "D", "ok": false, "t": "Keep a short root <code>CLAUDE.md<\/code> and use <code>@path<\/code> imports for one file per topic.", "e": "Incorrect for the stated requirement. Imports are useful for organizing instructions into separate files, but imported content expands into the instruction context at launch. This would not provide the requested conditional loading; all imported topics would still be included."}], "o": "<p>The deciding requirement is <strong>automatic, conditional loading<\/strong>. The team does not merely want a more maintainable instruction file; it wants each convention to be present only when relevant files are touched.<\/p>\n<p>The mechanisms serve different purposes:<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Mechanism<\/th><th>Best use<\/th><\/tr><\/thead><tbody><tr><td>Root <code>CLAUDE.md<\/code><\/td><td>General project instructions<\/td><\/tr><tr><td>Directory-level <code>CLAUDE.md<\/code><\/td><td>Conventions tied to a particular directory<\/td><\/tr><tr><td><code>.claude/rules/<\/code> with <code>paths<\/code><\/td><td>Rules that should load when matching files are accessed, including files distributed across directories<\/td><\/tr><tr><td>Skills<\/td><td>On-demand workflows or task-specific procedures<\/td><\/tr><tr><td><code>@path<\/code> imports<\/td><td>Organizing instructions across files without making them conditional<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Path-scoped rules offer the right combination of maintainability and conditional loading. They keep the main instruction file smaller while making relevant conventions available automatically when matching files are involved.<\/p>\n<p><strong>Key takeaway:<\/strong> Use <code>.claude/rules/<\/code> with path globs when conventions must load automatically based on the files being reviewed.<\/p>", "docs": []}, {"k": "4.51", "d": "d4", "title": "Guaranteeing Tool Execution Order", "scen": "<p>A CI review step defines <code>extract_pr_metadata<\/code> and two enrichment tools in one request. The enrichment tools fail unless metadata extraction has already run, but Claude sometimes calls an enrichment tool first.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which design guarantees that metadata extraction happens before enrichment?<\/p>", "c": [{"l": "A", "ok": true, "t": "Force <code>extract_pr_metadata<\/code> using <code>tool_choice<\/code> of type <code>tool<\/code>, then run enrichment after returning its result.", "e": "Specifying the exact tool forces Claude to produce a <code>tool_use<\/code> block for <code>extract_pr_metadata<\/code>. The application executes the extraction, returns the corresponding <code>tool_result<\/code>, and then continues the interaction with enrichment available."}, {"l": "B", "ok": false, "t": "Set <code>tool_choice<\/code> to <code>any<\/code>.", "e": "This requires Claude to call a tool, but it can choose either enrichment tool instead of the extraction tool. It guarantees a tool call, not the required order."}, {"l": "C", "ok": false, "t": "Keep <code>tool_choice<\/code> on <code>auto<\/code> and disable parallel tool use.", "e": "Disabling parallel tool use limits how many tools Claude can call in a turn; it does not specify which tool must be called first. Under <code>auto<\/code>, Claude may still choose an enrichment tool or respond without calling a tool."}, {"l": "D", "ok": false, "t": "Set <code>strict: true<\/code> on <code>extract_pr_metadata<\/code>.", "e": "Strict tool use validates the tool's input against its JSON schema. It does not control tool selection or execution order."}], "o": "<p>Tool orchestration involves three separate controls:<\/p>\n<ul><li><strong>Tool selection:<\/strong> <code>tool_choice<\/code> determines whether Claude chooses freely, must call some tool, or must call a specific tool.<\/li><li><strong>Input validation:<\/strong> Strict tool use constrains the structure of the selected tool's arguments.<\/li><li><strong>Call count:<\/strong> Parallel-tool-use settings constrain how many tools may be called in a turn.<\/li><\/ul>\n<p>For this workflow, the application should force the extraction tool, execute it, return its result, and only then proceed with enrichment.<\/p>\n<p><strong>Key takeaway:<\/strong> When execution order is mandatory, force the prerequisite tool and use the application flow to gate dependent operations.<\/p>", "docs": []}, {"k": "4.52", "d": "d4", "title": "Recovering Missing Acceptance Criteria", "scen": "<p>A pipeline step extracts acceptance criteria into JSON, but the prompt contains only the PR diff and description. The criteria exist only in the linked tracker ticket. Retries with validation errors keep failing.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should the team change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Define the extraction as a tool with a schema listing the criteria fields.", "e": "A schema can guarantee the expected output structure, but it cannot provide information missing from the prompt. Requiring the fields without supplying their source can encourage fabricated values."}, {"l": "B", "ok": false, "t": "Raise the retry limit and add backoff.", "e": "Backoff and retries help with transient problems such as rate limits or temporary service failures. Here, each attempt lacks the same necessary information, so more retries will repeat the failure."}, {"l": "C", "ok": true, "t": "Fetch the linked tracker ticket and include its text in the prompt.", "e": "The acceptance criteria exist in an external source that has not been provided. Retrieving that source makes the necessary information available for extraction."}, {"l": "D", "ok": false, "t": "Add the failed extraction, full diff, and validation errors to each retry.", "e": "Incorrect for this specific scenario. Retry-with-error-feedback is useful when the model has the information but extracts or formats it incorrectly. It cannot recover criteria that are absent from both the diff and PR description."}], "o": "<p>Retry mechanisms can repair an incorrect transformation of available information. They cannot reliably recover information that was never supplied.<\/p>\n<p>The right workflow is:<\/p>\n<ol><li>Retrieve the linked tracker ticket.<\/li><li>Include its relevant text alongside the PR description and diff.<\/li><li>Extract the acceptance criteria.<\/li><li>Validate the output structure and content.<\/li><\/ol>\n<p>This distinction prevents the pipeline from wasting attempts or inventing plausible criteria to satisfy the schema.<\/p>\n<p><strong>Key takeaway:<\/strong> If the source information is missing, retrieve it before retrying. Retries repair extraction errors, not missing inputs.<\/p>", "docs": []}, {"k": "4.53", "d": "d4", "title": "Improving Few-Shot Example Coverage", "scen": "<p>A reviewer gives inconsistent verdicts on swallowed exceptions. A written rule did not resolve the inconsistency, so the team added four few-shot examples, all from database code. Verdicts on database code are now consistent, but API handlers and background jobs still receive mixed verdicts.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change to the examples is most effective?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep the database examples and add an instruction to apply the same judgment to API handlers and background jobs.", "e": "The team already tried a written rule and found it insufficient. Another instruction states the desired behavior but does not demonstrate how the decision applies in the missing contexts."}, {"l": "B", "ok": true, "t": "Replace some database examples with API-handler and background-job examples, each with a short rationale.", "e": "The current examples demonstrate the judgment only in database code. Adding examples from the other contexts makes the intended decision boundary clearer across the codebase. Rationales also explain why each verdict is appropriate."}, {"l": "C", "ok": false, "t": "Wrap the four examples in an XML tag named <code>examples<\/code>.", "e": "Incorrect as the solution to this problem. XML tags help distinguish demonstrations from the actual input. Here, the examples are already being understood and applied to database code; the problem is insufficient coverage of other contexts."}, {"l": "D", "ok": false, "t": "Expand the set to ten or more database examples.", "e": "More examples from a context where the model is already consistent will reinforce an existing pattern without addressing the missing contexts. It also consumes additional prompt space."}], "o": "<p>Few-shot examples teach through the patterns they demonstrate. If all examples come from one module or context, the model may learn an overly narrow association rather than the intended general rule.<\/p>\n<p>An effective example set should be:<\/p>\n<ul><li><strong>Representative:<\/strong> Cover the contexts where the decision is required.<\/li><li><strong>Diverse:<\/strong> Demonstrate the rule across different code structures.<\/li><li><strong>Explanatory:<\/strong> Pair verdicts with short rationales that clarify why a finding should be accepted or rejected.<\/li><\/ul>\n<p>For this scenario, some database examples should be replaced with API-handler and background-job examples. The objective is to improve coverage, not simply increase the number of examples.<\/p>\n<p><strong>Key takeaway:<\/strong> When few-shot examples work in one context but fail in others, improve contextual coverage rather than adding more examples of the same type.<\/p>", "docs": []}, {"k": "4.54", "d": "d4", "title": "Preventing Findings Against Example Code", "scen": "<p>A review prompt includes few-shot code examples pasted as plain text directly above the PR diff. Prose rules alone produced inconsistent judgments. Now, some findings report issues in the example snippets rather than in the PR.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change fixes the root cause?<\/p>", "c": [{"l": "A", "ok": true, "t": "Wrap examples and the PR diff in separate XML tags.", "e": "Clearly delimiting examples and the actual diff makes their different roles explicit. The examples remain available to guide judgment, but the model can distinguish them from the code it must review."}, {"l": "B", "ok": false, "t": "Add a post-processing filter to drop findings matching example snippets.", "e": "This treats the symptom rather than the cause. It can also fail when the model paraphrases a finding or refers to example code indirectly."}, {"l": "C", "ok": false, "t": "Shorten each example to one line.", "e": "Shorter examples reduce the amount of potentially confusing code but do not establish a clear boundary between demonstration material and the PR diff."}, {"l": "D", "ok": false, "t": "Replace the examples with a more detailed prose description.", "e": "This would remove the confusing code, but it would also discard the examples that were added because prose alone produced inconsistent judgments."}], "o": "<p>Few-shot examples and the real input serve different purposes:<\/p>\n<ul><li><strong>Examples<\/strong> demonstrate the judgment the reviewer should apply.<\/li><li><strong>The PR diff<\/strong> is the content that must actually be evaluated.<\/li><\/ul>\n<p>When both are pasted together without clear boundaries, the model may treat demonstration code as review input. XML tags can make these roles explicit while preserving the benefits of few-shot examples.<\/p>\n<p>For example, a prompt can place demonstrations inside an <code>&lt;examples&gt;<\/code> section and the actual code inside a separate <code>&lt;diff&gt;<\/code> section.<\/p>\n<p>The general lesson is that prompt content and prompt structure are separate levers. Examples and rules determine the intended judgment; delimiters help determine which content that judgment applies to.<\/p>\n<p><strong>Key takeaway:<\/strong> Clearly separate examples from task input using explicit delimiters, rather than removing useful examples or filtering erroneous findings afterward.<\/p>", "docs": []}, {"k": "4.55", "d": "d4", "title": "Making Validation Retries Effective", "scen": "<p>Pydantic validation rejects about 5% of automated review outputs because of field errors. Common failures include invalid severity values and location strings that match no line in the reviewed diff.<\/p>\n<p>The error messages identify the failing fields but do not supply the correct values. The current retry simply resends the original prompt unchanged and rarely succeeds.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change makes retries most effective?<\/p>", "c": [{"l": "A", "ok": false, "t": "Send only the failed output and exact Pydantic error messages.", "e": "The model would see its mistakes and know which fields failed, but it would lack the source material needed to correct them. In particular, it could not reliably determine a valid location string without the reviewed diff."}, {"l": "B", "ok": false, "t": "Add a firm instruction that the previous output was invalid and the schema must be followed exactly.", "e": "This gives a general warning but no actionable correction information. It does not identify the exact failures or provide the source needed to repair them."}, {"l": "C", "ok": true, "t": "Include the reviewed diff, failed finding, and specific validation errors.", "e": "The retry contains all three elements needed for targeted correction:"}, {"l": "D", "ok": false, "t": "Route the retry to an independent Claude instance with no memory of the first attempt.", "e": "An independent instance can help with review quality in some situations, but without the failed output and validation errors it is effectively making another blind attempt. It also needs the diff to ground its response."}], "o": "<p>A reliable validation-retry loop should preserve the information necessary to diagnose and correct the failure.<\/p>\n<p>The pipeline should:<\/p>\n<ol><li>Generate a review finding.<\/li><li>Validate it using Pydantic.<\/li><li>If validation fails, send a retry containing the original diff, failed output, and exact validation errors.<\/li><li>Validate the corrected result again.<\/li><li>Stop after a bounded number of attempts and route persistent failures for appropriate handling.<\/li><\/ol>\n<p>Each element serves a different purpose. The source grounds the correction, the failed output identifies what needs fixing, and the error messages make the correction specific.<\/p>\n<p>A fresh retry without feedback discards the opportunity to learn from the previous failure. Conversely, if the source itself lacks the information needed to populate a field, retrying cannot reliably solve the problem; the pipeline should instead allow missing values where appropriate or escalate the case.<\/p>\n<p><strong>Key takeaway:<\/strong> For schema-validation failures, retry with the source, the failed output, and specific validation errors—not just the original prompt or a generic instruction.<\/p>", "docs": []}, {"k": "4.56", "d": "d3", "title": "Fixing a Missing Slash-Command Autocomplete Hint", "scen": "<p>A teammate's <code>/review-pr<\/code> <code>SKILL.md<\/code> frontmatter defines a <code>description<\/code> and a field named <code>argument_hint<\/code> with the value <code>PR-NUMBER<\/code>. Claude uses the skill when relevant, but typing <code>/review-pr<\/code> shows no autocomplete hint, and no error appears.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What is the fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add a <code>$ARGUMENTS<\/code> placeholder to the skill body.", "e": "<code>$ARGUMENTS<\/code> controls where argument text is substituted into the skill's content. The autocomplete hint comes from the <code>argument-hint<\/code> frontmatter field and does not depend on whether the body consumes arguments."}, {"l": "B", "ok": true, "t": "Rename the field to <code>argument-hint<\/code>.", "e": "Frontmatter field names must match the documented names exactly. The underscore makes <code>argument_hint<\/code> unrecognized, so Claude Code silently ignores it. Changing it to <code>argument-hint<\/code> restores the autocomplete hint."}, {"l": "C", "ok": false, "t": "List the parameter in an <code>arguments<\/code> frontmatter field.", "e": "The <code>arguments<\/code> field defines named arguments and their mapping. It does not generate the autocomplete hint; that comes from <code>argument-hint<\/code>."}, {"l": "D", "ok": false, "t": "Move the opening frontmatter delimiter to the first line of <code>SKILL.md<\/code>.", "e": "Incorrect for this scenario. Frontmatter must begin at the start of the file, but the working <code>description<\/code> shows that the existing frontmatter is already being read. The problem is the misspelled field name."}], "o": "<p>Claude Code reads skill configuration from YAML frontmatter at the top of <code>SKILL.md<\/code>. Unknown field names may be ignored without an error, which makes typos easy to miss.<\/p>\n<p>Three mechanisms should be distinguished:<\/p>\n<ul><li><code>description<\/code> helps Claude determine when a skill is relevant.<\/li><li><code>argument-hint<\/code> displays guidance during slash-command autocomplete.<\/li><li><code>$ARGUMENTS<\/code> controls where invocation arguments are inserted into the skill content.<\/li><\/ul>\n<p>Because the description is working, the appropriate fix is to correct the field name rather than change argument substitution or move the frontmatter.<\/p>\n<p><strong>Key takeaway:<\/strong> Use the exact documented frontmatter key <code>argument-hint<\/code>. Autocomplete hints and argument substitution are separate mechanisms.<\/p>", "docs": []}, {"k": "4.57", "d": "d4", "title": "Protecting Developer Trust During Prompt Repair", "scen": "<p>An automated review reports documentation findings with a 55% false-positive rate, while security findings are accurate. Developers have begun dismissing every finding without reading it. Fixing the documentation prompts will take approximately two weeks.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should the team do during those two weeks?<\/p>", "c": [{"l": "A", "ok": true, "t": "Disable documentation findings while improving the prompts offline.", "e": "The noisy category is undermining trust in the entire review pipeline, including accurate security findings. Disabling it immediately removes the noise while the team fixes and evaluates the prompts away from developers."}, {"l": "B", "ok": false, "t": "Keep the category live and improve its prompt with contrasting few-shot examples.", "e": "Incorrect for the stated time period. Contrasting examples can improve precision, but developers would continue seeing false positives for two weeks while the team iterates. That prolongs the damage to trust."}, {"l": "C", "ok": false, "t": "Instruct the reviewer to report only documentation findings it is highly confident about.", "e": "“Highly confident” is subjective and does not establish an operational decision boundary. Explicit criteria and representative examples are needed to improve precision consistently."}, {"l": "D", "ok": false, "t": "Downgrade documentation findings to non-blocking suggestions.", "e": "Lowering severity or removing merge-blocking consequences changes how findings affect the workflow, not whether developers see them. The noisy findings would continue to undermine trust."}], "o": "<p>False positives create more than an accuracy problem: they change how users respond to all subsequent output. Once developers learn to dismiss findings unread, genuine security defects can be ignored alongside false alarms.<\/p>\n<p>The immediate response should be to protect the signal that is still reliable:<\/p>\n<ol><li>Disable the noisy category.<\/li><li>Improve its criteria and examples offline.<\/li><li>Evaluate the revised prompt against known outcomes.<\/li><li>Re-enable the category only when precision is acceptable.<\/li><\/ol>\n<p>This separates the urgent operational decision from the longer-term prompt improvement work.<\/p>\n<p><strong>Key takeaway:<\/strong> When a noisy category erodes trust in otherwise accurate findings, remove it from production whil
