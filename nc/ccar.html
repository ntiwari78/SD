code>CLAUDE.md<\/code> content, and the Agent tool prompt the parent wrote when delegating. It does not get the parent's history, the parent's tool results, or the parent's system prompt. So a prompt that says \"the conventions identified above\" refers to text the subagent cannot see. The fix is to copy the actual findings, including file paths and concrete rules, into the delegation prompt itself.<\/p>\n<p>This isolation is a deliberate tradeoff. Fresh context keeps the subagent focused and keeps its verbose work out of the main conversation. The cost is that every handoff must be explicit: if a fact is not in the prompt, it does not exist for that subagent.<\/p>\n<p>The other options place the knowledge in the wrong surface. An <code>AgentDefinition<\/code> system prompt is written before runtime, so it fits stable expertise, not findings that change with every module. Resuming a subagent continues that subagent's own prior conversation; it never imports the parent's history, and a first invocation has no history to resume. A shared <code>CLAUDE.md<\/code> does reach subagents, but it is a static project-wide file; the question says conventions differ per module, so one file cannot carry the right rules for each spawn.<\/p>", "docs": [["Claude Agent SDK documentation", "https://platform.claude.com/docs/en/agent-sdk/overview"], ["Claude Code subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.7", "d": "d3", "title": "Enforcing Plan-Then-Approve", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>An engineer asks the agent to redesign a legacy module. A prompt rule to propose an approach first still let early edits through. After approval, the same session must implement the changes. How should the session be configured?<\/p>", "c": [{"l": "A", "ok": false, "t": "Strengthen the <code>CLAUDE.md<\/code> instruction to require a written approach and mark it IMPORTANT.", "e": "<code>CLAUDE.md<\/code> content is guidance the model follows most of the time, not an enforced control. The scenario states that a prompt rule already let early edits through, so a louder version of the same instruction still has a failure rate."}, {"l": "B", "ok": true, "t": "Start the session with <code>permission_mode<\/code> set to <code>plan<\/code>, then approve the plan before edits begin.", "e": "Plan mode is enforced by the harness, not by instructions. The agent can read files and explore, but file edits are never auto-approved while planning. Once the plan is approved, the same session moves into implementation, which matches both stated requirements."}, {"l": "C", "ok": false, "t": "Add a <code>PostToolUse<\/code> hook on Write and Edit that reverts any file change made before approval.", "e": "A <code>PostToolUse<\/code> hook runs after the tool call has already executed, so the unwanted edit happens first and gets cleaned up afterward. Reverting changes also risks removing legitimate work and does not create the plan-then-approve flow the team wants."}, {"l": "D", "ok": false, "t": "Restrict <code>allowed_tools<\/code> to Read, Grep, and Glob so the agent cannot modify any files.", "e": "A read-only tool list does enforce safe exploration, so this is a reasonable guardrail in general. It fails here because the scenario requires the same session to implement the changes after approval, and this configuration removes the editing tools for the whole session."}], "o": "<p>The scenario gives two facts that decide the answer. First, a prompt instruction already failed to stop early edits. Second, the same session must implement the changes after the approach is approved. Plan mode satisfies both. It is a permission mode, so the restriction is enforced by Claude Code itself rather than by text the model may ignore. While planning, the agent can read files, search the codebase, and run exploration commands, but it does not edit source files. In the Agent SDK, setting <code>permission_mode=\"plan\"<\/code> means file edits are never auto-approved and are routed through the <code>canUseTool<\/code> callback, so a human decision always sits between the plan and the first edit.<\/p>\n<p>The mental model: exploration is cheap and reversible, edits are not. Plan mode front-loads the cheap work, produces a reviewable plan, and only then unlocks editing, which prevents costly rework on large or unfamiliar changes. Restricting <code>allowed_tools<\/code> to Read, Grep, and Glob is a sound way to get a read-only agent, but it blocks the implementation phase this session must perform. Strengthening <code>CLAUDE.md<\/code> keeps the control at the instruction level, which the scenario shows is unreliable here. A <code>PostToolUse<\/code> hook that reverts changes acts only after an edit has run, so it cleans up damage instead of preventing it.<\/p>", "docs": [["Claude Code permissions", "https://code.claude.com/docs/en/permissions"], ["Claude Agent SDK documentation", "https://platform.claude.com/docs/en/agent-sdk/overview"]]}, {"k": "1.8", "d": "d3", "title": "Choosing Direct Execution for a Small Bug Fix", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>An engineer using this agent encounters a failing test. The stack trace names one function in one file, and the fix is a missing null check. A single command reproduces the failure. How should the engineer direct the agent?<\/p>", "c": [{"l": "A", "ok": false, "t": "Switch to plan mode so the agent maps the module's dependencies and proposes a plan before editing.", "e": "Plan mode is sound practice for large changes, unfamiliar code, or several viable approaches. Here the stack trace names the exact function and the fix is a known null check, so a planning phase is pure overhead."}, {"l": "B", "ok": false, "t": "Run the investigation in an Explore subagent first, then apply the fix in the main conversation.", "e": "The Explore subagent isolates verbose discovery output during multi-phase tasks. This bug needs no lengthy discovery; the stack trace already supplies the location, so an isolation step adds a round trip without benefit."}, {"l": "C", "ok": false, "t": "Ask the agent to first write a new failing test that reproduces the bug, then apply the fix.", "e": "Writing a failing reproduction test first is recommended practice when no reproduction exists. Here a failing test already exists and a single command reproduces it, so a new test duplicates coverage the engineer already has."}, {"l": "D", "ok": true, "t": "Have the agent fix it directly, giving it the stack trace and the reproduction command as a check.", "e": "This is the right workflow for a well-understood, single-file change. The stack trace already identifies the location, so planning adds no value. The reproduction command gives the agent a check it can run until the fix passes."}], "o": "<p>The core decision here is plan mode versus direct execution. The rule of thumb from Anthropic's guidance: if you could describe the diff in one sentence, skip the plan. A missing null check in one named function is exactly that case. Plan mode earns its overhead when the approach is uncertain, the change spans many files, or the codebase is unfamiliar.<\/p>\n<p>A good direct-execution request is still precise. Give the agent the stack trace, the command that reproduces the failure, and a clear definition of done. The reproduction command matters most: it turns the fix into a verification loop, where the agent edits, runs the check, reads the result, and iterates until the test passes. Asking for evidence such as test output is more reliable than accepting a claim of success.<\/p>\n<p>The other workflows are real and valuable, just mismatched here. Plan mode defers edits until a reviewed plan is approved, which pays off on architectural work, not a one-line fix. The Explore subagent keeps verbose discovery output out of the main context during multi-phase tasks; this bug has no discovery phase. Writing a failing test before fixing is the documented approach when a bug lacks a reproduction; here the failing test and its reproduction command already exist, so the step adds nothing.<\/p>", "docs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code common workflows", "https://code.claude.com/docs/en/common-workflows"]]}, {"k": "1.9", "d": "d3", "title": "Isolating a Skill's Exploration Context", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>A skill contains only reference guidelines and no actionable task. Its frontmatter uses <code>context: fork<\/code>, so invoking it launches a separate subagent. The skill produces no useful output, and the main conversation never receives the guidelines. What should you change?<\/p>", "c": [{"l": "A", "ok": true, "t": "Remove <code>context: fork<\/code> so the skill's content loads inline when invoked.", "e": "With <code>context: fork<\/code>, Claude Code launches a fresh subagent and uses the skill's content as that subagent's prompt. Because the skill contains guidelines but no task to perform, the subagent has no actionable work. Removing <code>context: fork<\/code> makes the content available inline to the main conversation."}, {"l": "B", "ok": false, "t": "Add explicit instructions telling the subagent to follow the guidelines independently.", "e": "Standalone instructions matter when a forked skill incorrectly references earlier conversation content. This skill has a different problem: it contains no instructions to perform at all. Rewriting guidelines more independently still leaves the subagent without a task."}, {"l": "C", "ok": false, "t": "Set <code>agent: Explore<\/code> so the forked skill runs with read-only exploration tools.", "e": "The <code>agent<\/code> field changes which subagent environment runs the fork, including its model and tools. It does not give the subagent an actionable task. A guidelines-only skill still produces no meaningful output in an Explore fork."}, {"l": "D", "ok": false, "t": "Set <code>background: false<\/code> so the main conversation waits for the subagent to finish.", "e": "<code>background: false<\/code> controls waiting only in interactive sessions. In non-interactive mode and the Agent SDK, Claude Code already waits for the fork's result. Waiting also only matters once the fork produces something."}], "o": "<p>With <code>context: fork<\/code>, Claude Code does not copy the conversation into the subagent. It starts a fresh subagent and uses the skill's content as that subagent's prompt. The subagent then works on its own and returns a result to the main session. This design keeps verbose or exploratory work out of the main context window.<\/p>\n<p>That design assumes the skill contains an actionable task. Anthropic warns that forking only makes sense for skills with explicit instructions. A skill that holds only reference guidelines gives the subagent no work to perform. The fork may return no meaningful output. Worse, the guidelines never reach the main conversation, so the session cannot follow them. The fix is to remove <code>context: fork<\/code> so the skill's content loads inline when invoked.<\/p>\n<p>The other changes adjust real fork settings but miss the cause. The <code>agent<\/code> field picks the execution environment for the fork, such as Explore with read-only tools; it does not supply a task. <code>background: false<\/code> controls waiting only in interactive sessions; in non-interactive mode and the Agent SDK, Claude Code already waits for the fork's result. Waiting also only matters once the fork produces something. Rewriting instructions to stand alone fixes skills that depend on conversation history, not skills that contain no instructions.<\/p>", "docs": [["Claude Code Skills", "https://code.claude.com/docs/en/skills"], ["Claude Code Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.10", "d": "d3", "title": "Loading Testing Standards in Every Session", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>Claude-generated tests skip error and boundary cases. The team's one-page testing standards must load in every session, even while Claude edits source files, with no manual invocation. Which two changes meet these requirements? <strong>(Select TWO.)<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "State the test command and the required error cases concretely in the project <code>CLAUDE.md<\/code>.", "e": "The project <code>CLAUDE.md<\/code> loads at the start of every session, so the standards apply before any file is edited. Naming the exact test command and the error cases to cover makes the instructions concrete and checkable."}, {"l": "B", "ok": false, "t": "Move the standards into <code>.claude/rules/testing.md<\/code> with a <code>paths<\/code> glob matching the project's test files.", "e": "A path-scoped rule is sound practice for conventions tied to specific files, but it loads only when Claude works with files that match the glob. The scenario requires the standards while Claude edits source files, which a test-file glob does not match. The rule would not be loaded at that point."}, {"l": "C", "ok": false, "t": "Package the standards as a skill in <code>.claude/skills/<\/code> so Claude invokes it when it detects test work.", "e": "A skill is a real option for task-specific procedures, but its body loads only when the skill is invoked or triggered. The scenario requires the standards in every session with no invocation. Sessions where the skill never triggers would never see the standards."}, {"l": "D", "ok": true, "t": "Import the one-page standards file into the project <code>CLAUDE.md<\/code> with <code>@path<\/code> syntax.", "e": "Importing the file through <code>@path<\/code> lets the project <code>CLAUDE.md<\/code> include the testing standards in its session instructions. This keeps the separate standards document maintainable while ensuring its contents are loaded automatically."}], "o": "<p>The requirement has two parts: the standards must always be available, and the instructions must be concrete enough to guide test generation. Project-level <code>CLAUDE.md<\/code> is appropriate because it loads at the start of each session rather than waiting for Claude to open a particular file or invoke a skill.<\/p>\n<p>Specifying the exact test command and the required error cases makes the standards actionable. Importing the separate standards file using <code>@path<\/code> keeps the source document organized without sacrificing automatic availability.<\/p>\n<p>Path-scoped rules are useful when instructions apply only to matching files, but they do not meet the requirement that the standards be present while Claude edits source files. Skills are useful for reusable, task-specific procedures, but they are not guaranteed to load in every session without invocation.<\/p>", "docs": [["Claude Code Memory and `CLAUDE.md`", "https://code.claude.com/docs/en/memory"], ["Claude Code Skills", "https://code.claude.com/docs/en/skills"]]}, {"k": "1.11", "d": "d3", "title": "Choosing Direct Execution for a Small Bug Fix", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>A failing test pinpoints a missing null check in one named function. The engineer knows the exact one-line change and can describe the diff in a single sentence. Which workflow should they use?<\/p>", "c": [{"l": "A", "ok": false, "t": "Start in plan mode, inspect the file and callers, and wait for approval before editing.", "e": "Plan mode is useful when the approach is uncertain, when changes span multiple files, or when the engineer needs Claude to investigate before proposing a solution. Here, the failing test has already identified the function and the engineer knows the exact change. Planning adds an unnecessary approval step."}, {"l": "B", "ok": false, "t": "Ask Claude to use the Explore subagent to investigate the codebase before editing.", "e": "The Explore subagent is useful for broad, read-only investigation, especially when exploration output could overwhelm the main conversation. This task requires no discovery phase: the cause, location, and change are already known. A separate exploration step adds latency without providing new information."}, {"l": "C", "ok": false, "t": "Ask Claude to inspect the file and all callers in read-only mode, then make the change after confirming the diagnosis.", "e": "Read-only inspection is valuable when the root cause is uncertain or the effects of a change are unclear. In this scenario, the test has already located the issue and the engineer can state the exact diff. Additional inspection is unnecessary for the stated task."}, {"l": "D", "ok": true, "t": "Ask Claude to make the edit directly in the main conversation, with no planning phase.", "e": "This is correct. The change is well scoped: one function, one known cause, a diff the engineer can state in one sentence. Anthropic's guidance says to skip planning for small, clear fixes and execute directly."}], "o": "<p>Claude Code gives you two broad ways to work. You can have Claude plan first and execute after approval, or you can ask for the change directly. The deciding factor is scope and certainty, not change size alone. Anthropic's rule of thumb is simple: if you could describe the diff in one sentence, skip the plan. A missing null check in one named function, found by a failing test, meets that bar exactly. Direct execution is fastest here, and the edit still runs under whatever permission mode the session is in.<\/p>\n<p>Plan mode earns its overhead when the approach is uncertain, when a change touches many files, or when the engineer does not know the code. In plan mode Claude reads files and explores, and it generally proposes changes without editing source files until the plan is approved; the documented exception involves interactive sessions where bypass permissions are available. That separation prevents expensive rework on big changes. On a one-line fix it only adds a review step with nothing to decide.<\/p>\n<p>The same logic rules out a preliminary read-only inspection of the file and its callers. That step is useful when the cause is still in doubt. In this scenario the failing test has already located the function and the engineer knows the exact diff, so the inspection adds latency without new information. The Explore subagent solves yet another problem: it keeps thousands of lines of discovery output out of the main conversation during multi-phase work. A fix with no discovery phase gains nothing from it, and quick targeted changes belong in the main conversation.<\/p>", "docs": [["Claude Code Best Practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code Common Workflows", "https://code.claude.com/docs/en/common-workflows"], ["Claude Code Permission Modes", "https://code.claude.com/docs/en/permission-modes"]]}, {"k": "1.12", "d": "d3", "title": "Enforcing a Path-Specific Edit Restriction", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>A rule file in <code>.claude/rules/<\/code> has frontmatter with <code>paths: [\"src/billing/**/*\"]<\/code> and <code>allowed-tools: [\"Read\", \"Grep\"]<\/code>. The conventions load correctly, but Claude still edits billing files. The team needs edits to that path blocked. What is the correct fix?<\/p>", "c": [{"l": "A", "ok": true, "t": "Add a deny permission rule in <code>settings.json<\/code> blocking Write and Edit on <code>src/billing<\/code> files.", "e": "This is correct. Rule frontmatter reads only the <code>paths<\/code> field; <code>allowed-tools<\/code> is silently ignored there. A deny permission rule is enforced in code, so it blocks the action even if the model attempts it. The paths frontmatter can stay as is to keep the conventions loading."}, {"l": "B", "ok": false, "t": "Run <code>claude --debug<\/code> and correct the frontmatter YAML so the <code>allowed-tools<\/code> field parses.", "e": "<code>claude --debug<\/code> does show YAML parse errors, but there is no parse error here. The frontmatter is valid YAML; Claude Code simply ignores every rule frontmatter field except <code>paths<\/code>, without raising an error."}, {"l": "C", "ok": false, "t": "Move the conventions into a skill under <code>.claude/skills/<\/code> and set <code>allowed-tools<\/code> in its <code>SKILL.md<\/code> frontmatter.", "e": "<code>allowed-tools<\/code> is a real <code>SKILL.md<\/code> frontmatter option, so this looks reasonable. However, it restricts tools only while that skill is executing. The team needs edits blocked whenever Claude touches <code>src/billing<\/code> files, and a skill does not activate based on which file is being edited."}, {"l": "D", "ok": false, "t": "State in the rule's Markdown body that files under <code>src/billing<\/code> are read-only and must never be modified.", "e": "Rule content is guidance the model follows probabilistically, not enforcement. An instruction in the body reduces the chance of an edit but cannot guarantee it is blocked, which the scenario requires."}], "o": "<p>Rule files under <code>.claude/rules/<\/code> support exactly one frontmatter field: <code>paths<\/code>. Claude Code reads the paths globs to decide when the rule loads, then strips the frontmatter before adding the rule to context. Any other field, such as <code>allowed-tools<\/code>, is ignored without an error. That is why the conventions in this rule load correctly while the tool restriction silently does nothing.<\/p>\n<p>The deeper distinction is between guidance and enforcement. Rules and <code>CLAUDE.md<\/code> are instructions the model follows probabilistically. They shape behavior but cannot guarantee it. Hard guarantees come from mechanisms that run as code outside the model: deny permission rules in <code>settings.json<\/code>, or hooks that intercept tool calls. A deny rule for Write and Edit on the billing path blocks those calls no matter what the model tries. The path-scoped rule can stay in place to carry the conventions themselves.<\/p>\n<p><code>allowed-tools<\/code> does exist, but as <code>SKILL.md<\/code> frontmatter. It bounds what a skill can invoke during that skill's execution. It is not triggered by which file Claude is editing, so it cannot protect a path across a whole session. The <code>--debug<\/code> flag helps when frontmatter YAML fails to parse, which makes Claude Code load the rule unconditionally; here the YAML is valid, so there is nothing for debug output to reveal.<\/p>", "docs": [["Claude Code Memory and Rules", "https://code.claude.com/docs/en/memory"], ["Claude Code Permissions", "https://code.claude.com/docs/en/permissions"], ["Claude Code Skills", "https://code.claude.com/docs/en/skills"]]}, {"k": "1.13", "d": "d3", "title": "Preventing Permission Prompts from Hanging a CI Job", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>A nightly CI job runs <code>claude -p<\/code> to produce a report on legacy code. When the agent requests a Bash command, the step stalls until it times out. The report does not need Bash, and policy forbids auto-approving Bash in CI. Which change fixes the hang?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add Bash to the allowed tools in the project's <code>.claude/settings.json<\/code> so it runs without prompting.", "e": "Allow-listing is a sound way to stop permission prompts for tools the job should run. It fails here because the question states that policy forbids auto-approving Bash in CI, and allow-listing auto-approves it."}, {"l": "B", "ok": true, "t": "Run the job with <code>--permission-prompts none<\/code> so unresolved permission requests are denied.", "e": "This flag tells Claude Code not to consult or wait for any approval source. Unresolved permission requests are denied and the run continues. The job never stalls, Bash is not auto-approved, and the report still gets produced."}, {"l": "C", "ok": false, "t": "Configure <code>--permission-prompt-tool<\/code> with an MCP tool that approves the agent's Bash requests.", "e": "A permission prompt tool is a real mechanism for handling approvals programmatically in unattended runs. Here it would auto-approve Bash, which the stated policy forbids, and the report does not need Bash anyway."}, {"l": "D", "ok": false, "t": "Pipe a stream of yes answers into the process's standard input to answer the prompts.", "e": "A <code>-p<\/code> run is non-interactive and does not read approval answers from standard input. The stall is a pending permission request inside Claude Code, not a terminal prompt, so piped input never reaches it. It would also auto-approve Bash, against policy."}], "o": "<p>The <code>-p<\/code> flag makes Claude Code run non-interactively: it processes the prompt, prints the result, and exits. But non-interactive mode does not remove the permission system. When the agent requests a tool that is not pre-approved, the request must still be resolved somehow. In CI there is no human to resolve it, so the run can stall until the pipeline times out.<\/p>\n<p>The <code>--permission-prompts none<\/code> flag, available in Claude Code v2.1.259 and later according to the source, handles exactly this case. It tells Claude Code not to consult or wait for any approval source, including a <code>--permission-prompt-tool<\/code>. Any unresolved request is denied and the run continues. That matches the scenario: the report does not need Bash, so a denied Bash call costs nothing, and the policy against auto-approval is respected.<\/p>\n<p>The alternatives resolve the prompt by granting it. Allow-listing Bash in <code>.claude/settings.json<\/code> and wiring a <code>--permission-prompt-tool<\/code> that approves requests are both real designs, but both auto-approve Bash, which the policy forbids. Piping text into standard input does nothing in a <code>-p<\/code> run, because the stall is an unresolved permission request inside Claude Code, not a terminal waiting for keystrokes.<\/p>\n<p>The mental model for unattended runs: decide in advance how every permission request resolves. Pre-approve the tools the job genuinely needs, and use <code>--permission-prompts none<\/code> so everything else is denied instead of blocking.<\/p>", "docs": [["Run Claude Code programmatically", "https://code.claude.com/docs/en/headless"], ["Claude Code CLI reference", "https://code.claude.com/docs/en/cli-reference"], ["Claude Code permissions", "https://code.claude.com/docs/en/permissions"]]}, {"k": "1.14", "d": "d2", "title": "Finding Literal Function Calls with Grep", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>You need to locate every literal call to <code>cache.flushAll(<\/code> and inspect the matching lines with their line numbers. The Grep invocation returns only file paths, so you cannot review the call sites. Which adjustment is appropriate?<\/p>", "c": [{"l": "A", "ok": true, "t": "Use Grep's <code>content<\/code> output mode and escape the regular-expression metacharacters in the search pattern.", "e": "Grep's <code>content<\/code> mode returns the matching lines, including line numbers. Since Grep uses ripgrep regular-expression syntax, the literal function call must escape the dot and opening parenthesis: <code>cache\\.flushAll\\(<\/code>."}, {"l": "B", "ok": false, "t": "Keep the default <code>files_with_matches<\/code> mode and use Glob to enumerate the matching files.", "e": "The default <code>files_with_matches<\/code> mode returns paths of files that contain a match. Glob matches file names and paths; it does not return the matching source lines or their line numbers. Combining the two does not solve the inspection requirement."}, {"l": "C", "ok": false, "t": "Switch to <code>count<\/code> mode to obtain a count of every matching call site.", "e": "Count mode reports the number of matches per file and a total. It is useful for estimating the scope of a change, but it does not return the source lines and line numbers needed for a line-by-line review."}, {"l": "D", "ok": false, "t": "Read every source file first, then search the loaded text for <code>cache.flushAll(<\/code>.", "e": "Reading every file before searching fills the context window with code that may be irrelevant. The search-first workflow narrows the candidate files and then reads only the relevant content."}], "o": "<p>Claude Code's built-in tools are designed for incremental investigation. Grep searches file contents and, by default, returns only the paths of matching files (<code>files_with_matches<\/code> mode). That default exists for a reason: the intended workflow is to search first, then Read only the files that matter. The agent builds understanding in loops: find where a symbol is defined, read that file, find where it is imported or called, read those consumers, and repeat until the flow is clear.<\/p>\n<p>This pattern protects the context window. Reading dozens of files before answering fills the context with code that is mostly irrelevant. Listing files with Glob and reading each one has the same problem; Glob matches names, not relevance. Reading a single entry file is too little instead of too much: relevant information may pass through modules the agent never loads, so its answer becomes a guess.<\/p>\n<p>Search-first is necessary but not sufficient; the search must target the right code. Grep uses ripgrep regular-expression syntax, not literal text matching or POSIX grep syntax. A dot matches any character, and an unescaped parenthesis opens a regular-expression group. To find the literal call <code>cache.flushAll(<\/code>, escape both metacharacters: <code>cache\\.flushAll\\(<\/code>.<\/p>\n<p>The scenario needs the matching lines themselves plus their line numbers. That is exactly what <code>content<\/code> mode returns. Count mode answers a different question—how often something appears—and is better suited to a quick impact estimate. See the Claude Code tools reference for the Grep output modes and options.<\/p>", "docs": [["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference"], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "1.15", "d": "d3", "title": "Enabling Structured Clarifying Questions in the Agent SDK", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>Your application prompts Claude to interview the engineer about requirements before generating boilerplate. The SDK call passes a <code>tools<\/code> array containing only Read, Write, Grep, and Glob. Claude never asks any questions and implements based on its own assumptions. What is the fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Start the session in plan mode so Claude must analyze before making edits.", "e": "Plan mode stops Claude from editing files until a plan is approved. It does not give Claude a mechanism for asking structured clarifying questions, and it does not add a tool that the tools array has excluded."}, {"l": "B", "ok": false, "t": "Add a permission allow rule for <code>AskUserQuestion<\/code> so its calls are approved.", "e": "Allow rules control approval of tool calls, not which tools exist in the session. The tools array here omits <code>AskUserQuestion<\/code> entirely, so there is no call to approve. Allow rules also do not auto-approve <code>AskUserQuestion<\/code>; it still goes through the user-input flow."}, {"l": "C", "ok": false, "t": "Generate the interview questions inside the <code>canUseTool<\/code> callback and return the engineer's answers.", "e": "The <code>canUseTool<\/code> callback surfaces questions that Claude generates; the application cannot add its own questions to that flow. If the application needs its own questions, it must ask them in separate application logic, and that still would not let Claude interview the engineer."}, {"l": "D", "ok": true, "t": "Add <code>AskUserQuestion<\/code> to the tools array passed in the SDK call.", "e": "When an application restricts Claude's tools with a <code>tools<\/code> array, that array is the complete list of tools Claude can call. <code>AskUserQuestion<\/code> must be included for Claude to ask clarifying questions. The current array omits it, so Claude cannot run the interview no matter what the prompt says."}], "o": "<p>In the Agent SDK, <code>AskUserQuestion<\/code> is the tool Claude uses to ask structured clarifying questions. If the application passes a <code>tools<\/code> array, that array is the complete list of tools Claude can call. A prompt can tell Claude to interview the user, but the instruction does nothing if the tool is missing. The fix is to include <code>AskUserQuestion<\/code> in the array.<\/p>\n<p>The mental model: prompts shape behavior, but tool availability bounds it. The interview pattern depends on both. Claude generates the questions and answer options; the application's job is to present them and return the user's selections through the <code>canUseTool<\/code> callback. The documentation is explicit that the application cannot inject its own questions into this flow; application-driven questions belong in separate application logic.<\/p>\n<p>Permission allow rules are a different layer. They decide whether an available tool call runs without a prompt; they cannot create a tool the session does not have. <code>AskUserQuestion<\/code> is also special here: an allow rule does not auto-approve it, because the whole point of the call is user interaction. Plan mode is another separate concept. It blocks file edits until a plan is approved, which is useful for scoping changes, but it is not a question-asking mechanism.<\/p>", "docs": [["Agent SDK — Handling user input", "https://platform.claude.com/docs/en/agent-sdk/user-input"], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "1.16", "d": "d3", "title": "Discovering Requirements for an Unfamiliar Caching Layer", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>An engineer asks the agent to build a caching layer for slow MCP lookups. The first attempt ignored invalidation and staleness. The engineer has never designed caching and cannot list the requirements that matter. What should they try next?<\/p>", "c": [{"l": "A", "ok": false, "t": "Write a test suite for the caching layer first, then let test failures guide each iteration.", "e": "Test-driven iteration works well when expected behavior is already known. Tests encode expectations, and the engineer does not yet know what to expect from invalidation or failure handling. Tests written now would simply omit the same unconsidered cases."}, {"l": "B", "ok": false, "t": "Run the task in plan mode so the agent explores the codebase and presents a plan before making changes.", "e": "Plan mode is sound practice for large or architectural changes, and reviewing a plan before edits is valuable. It fails here because the missing requirements are not in the codebase; they are decisions the engineer has never made. A plan built from the same underspecified request repeats the first attempt's gaps, and the engineer cannot judge a caching plan they do not know how to evaluate."}, {"l": "C", "ok": false, "t": "Give the agent two or three concrete input and output examples that show the expected caching behavior.", "e": "Concrete examples are the best way to communicate a known transformation when prose is interpreted inconsistently. The scenario states the engineer cannot list the requirements that matter, so they cannot author examples that encode invalidation or staleness decisions they have not made yet."}, {"l": "D", "ok": true, "t": "Have the agent ask the engineer questions about invalidation, staleness, and failure modes before it implements.", "e": "This is the interview pattern. The agent raises design considerations the engineer has not thought about, such as how stale data is tolerated and what happens when the backing lookup fails. The answers become explicit requirements before any code is written, which is exactly what an unfamiliar domain calls for."}], "o": "<p>The interview pattern flips the usual direction of a session. Instead of the engineer specifying and Claude implementing, Claude asks questions first. This matters in unfamiliar domains such as caching, where the hard part is not writing the code but knowing which decisions exist: invalidation triggers, acceptable staleness, cache size limits, and what happens when the backing system fails. An engineer who has never designed a cache does not know to mention these. The agent, prompted to interview, does.<\/p>\n<p>The other techniques all assume the requirements already exist somewhere. Plan mode finds facts in the codebase and proposes an approach, but it plans from the same incomplete request; the missing decisions live in the engineer's head, not in the files. Few-shot examples and test-driven iteration are both strong tools for communicating known expectations. Neither helps when the engineer cannot yet state what the expectations are. Examples and tests written at this point would carry the same blind spots as the first attempt.<\/p>\n<p>A useful mental model: choose the technique by where the missing information lives. In the codebase, use plan mode or an Explore pass. In the engineer's head but unstated, use examples or tests. Not yet decided by anyone, use the interview pattern to surface the decisions first.<\/p>", "docs": [["Claude Code Best Practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code Common Workflows", "https://code.claude.com/docs/en/common-workflows"]]}, {"k": "1.17", "d": "d3", "title": "Recovering Context with /compact", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom Model Context Protocol (MCP) tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>A long Claude Code session debugging the agent's escalation logic is nearly out of context because of verbose discovery output. The developer must free context now, keep the refund-threshold findings, and continue the same investigation. What should the developer do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Delegate the remaining investigation to a subagent so new discovery output stays out of the main context.", "e": "This is a sound pattern for preventing context bloat, but it does not fix this situation. The main context is already nearly full of verbose output, and a subagent only keeps future output isolated. The existing bloat still degrades the session until it is compacted."}, {"l": "B", "ok": false, "t": "Run <code>/clear<\/code> to reset the context, then restate the investigation goal in a fresh conversation.", "e": "This is incorrect here. <code>/clear<\/code> starts a new conversation with empty context, so the refund-threshold findings and the investigation state are lost. The documentation says to use <code>/compact<\/code> instead when you want to free space but keep working in the same conversation."}, {"l": "C", "ok": false, "t": "Run <code>/autocompact<\/code> with a lower token threshold so Claude Code compacts the conversation sooner.", "e": "<code>/autocompact<\/code> only configures when automatic compaction will trigger in the future; it does not compact the conversation now. The developer needs immediate relief, and the automatic pass also guesses what to keep instead of taking the developer's focus instructions."}, {"l": "D", "ok": true, "t": "Run <code>/compact<\/code> with focus instructions that tell the summary to preserve the refund-threshold findings.", "e": "<code>/compact<\/code> summarizes the conversation so far and frees context while the same session continues. The optional focus instructions tell the summary what to keep, so the refund-threshold findings survive compaction instead of being condensed away."}], "o": "<p>The <code>/compact<\/code> command is the in-session tool for exactly this problem. It summarizes the conversation so far and frees context, and the session keeps going. The command also accepts optional focus instructions, such as <code>/compact preserve the refund-threshold findings<\/code>. These instructions tell the summary what must survive. That matters because summarization is lossy by default and tends to drop precise values.<\/p>\n<p>It helps to know what compaction keeps and what it rewrites. The system prompt, the project <code>CLAUDE.md<\/code>, and memory are re-injected after compaction. Recently used files come back within limits. The message history itself is replaced by the summary. That is why the focus instructions are the right lever when specific findings must not be lost.<\/p>\n<p>The other options each miss a stated fact. <code>/clear<\/code> empties the context entirely, so the findings and the investigation state are gone. Anthropic explicitly recommends <code>/compact<\/code> over <code>/clear<\/code> when the same conversation must continue. <code>/autocompact<\/code> sets the threshold at which automatic compaction fires later; it performs no compaction now. The automatic pass also guesses importance instead of following the developer's instructions.<\/p>\n<p>Subagent delegation is the right design for keeping verbose discovery out of the main context. However, it only helps with future output. The bloat already in the window remains until a compaction runs.<\/p>", "docs": [["Claude Code Slash Commands", "https://code.claude.com/docs/en/slash-commands"], ["Claude Code Context Windows", "https://code.claude.com/docs/en/context-windows"]]}, {"k": "1.18", "d": "d2", "title": "Fixing Ambiguous Tool Descriptions", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom Model Context Protocol (MCP) tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>You add <code>track_shipment<\/code>, described as \"Gets order and delivery information\". <code>lookup_order<\/code> is described as \"Retrieves order information\". Delivery questions still reach <code>lookup_order<\/code> after you add a routing rule to the system prompt. What most directly fixes the misrouting?<\/p>", "c": [{"l": "A", "ok": false, "t": "Expand the system prompt routing rule with few-shot examples of correct tool choice for each request type.", "e": "Prompt guidance is a real technique, but the question states a routing rule was already added and the misrouting continued. Claude selects tools primarily from their descriptions, so more prompt text does not fix the overlap where the choice is actually made."}, {"l": "B", "ok": false, "t": "Add <code>input_examples<\/code> to both tools showing representative calls with typical order and tracking identifiers.", "e": "<code>input_examples<\/code> help Claude build correct inputs for complex or format-sensitive parameters. The failure here is choosing between two tools, not constructing the call, so example inputs do not resolve the overlapping descriptions."}, {"l": "C", "ok": false, "t": "Classify incoming messages for delivery keywords and force <code>track_shipment<\/code> with <code>tool_choice<\/code> for those requests.", "e": "Forcing a specific tool with <code>tool_choice<\/code> is meant to guarantee a fixed step, such as a required first call. Keyword matching cannot classify high-ambiguity support messages reliably, and this approach works around the overlapping descriptions instead of fixing them."}, {"l": "D", "ok": true, "t": "Rewrite each tool's description to state what it returns, when to use it, and when the other tool applies.", "e": "Tool descriptions are the primary signal Claude uses to choose between tools. These two descriptions overlap almost completely, so the model cannot tell where one tool ends and the other begins. Boundary language in each description removes the ambiguity at the exact point where selection happens."}], "o": "<p>Anthropic lists \"Claude calls tool A when you wanted tool B\" as a known tool-use failure. Its documented likely cause is description ambiguity. The documented fix is to sharpen the descriptions and differentiate the tools by when each should be used, not only by what each does. Here, \"Gets order and delivery information\" and \"Retrieves order information\" are nearly the same sentence. The model has no way to draw a boundary between them.<\/p>\n<p>The mental model: the description is the selection mechanism. Claude reads descriptions at the moment it picks a tool. Anthropic calls detailed descriptions by far the most important factor for routing, and recommends at least three to four sentences per tool. A strong description says what the tool does, what it returns, when to use it, and when to use a similar tool instead. For example, <code>lookup_order<\/code> can say \"use for order details, items, and payment status; for delivery location or tracking, use <code>track_shipment<\/code> instead.\"<\/p>\n<p>The other options act in the wrong place. The question states a system prompt routing rule already failed, so adding few-shot routing examples repeats a weaker approach; prompt text sits farther from the selection decision than the descriptions do. Forcing <code>track_shipment<\/code> with <code>tool_choice<\/code> after keyword matching replaces the model's judgment with a brittle classifier, and support requests are too ambiguous for keywords. <code>input_examples<\/code> address a different documented problem: they help Claude construct complex inputs, not choose between overlapping tools.<\/p>", "docs": [["Troubleshooting Tool Use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use#troubleshooting"], ["Define Tools", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "1.19", "d": "d1", "title": "Enforcing a Critical Tool-Call Precondition", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom Model Context Protocol (MCP) tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>An audit finds one refund ran before identity verification. An engineer proposes replacing the agent loop with a hard-coded decision tree so ordering can never be violated. Which two design choices are correct?<\/p>", "c": [{"l": "A", "ok": false, "t": "Replace the agent loop with a classifier that maps each request category to a fixed tool sequence.", "e": "Fixed sequences work for predictable workflows, but this agent faces high-ambiguity requests that often mix returns, billing, and account issues. A category-to-sequence tree breaks whenever a request does not fit an anticipated category. It also removes far more flexibility than the single ordering rule requires."}, {"l": "B", "ok": false, "t": "Add a rule to the system prompt that <code>process_refund<\/code> must never run before <code>get_customer<\/code>, and restate it every turn.", "e": "Prompt instructions give probabilistic compliance, not a guarantee. The audit already proves the agent can skip verification, so a repeated instruction still leaves a non-zero failure rate. A rule with compliance consequences belongs in code, not in the prompt."}, {"l": "C", "ok": true, "t": "Add a programmatic precondition that blocks <code>process_refund<\/code> until <code>get_customer<\/code> has returned a verified customer ID.", "e": "The audit shows the ordering rule must never be violated, so it needs a deterministic guarantee. A code-level precondition blocks the violating call before it executes, which prompt instructions cannot guarantee. This fixes the compliance gap without removing flexibility anywhere else."}, {"l": "D", "ok": true, "t": "Keep model-driven tool selection for investigation, where Claude picks the next tool from conversation context.", "e": "The agent handles ambiguous requests like disputes and multi-concern messages, so the right tool path differs for each case. Model-driven tool selection lets Claude adapt its next step to what prior tool results reveal. Only the one critical ordering rule needs hard enforcement."}], "o": "<p>This question is about choosing the right control surface for each part of an agent. In an agentic loop, Claude selects the next tool itself, based on the conversation and prior tool results. This model-driven design is why the agent can handle ambiguous requests: the path to resolution is different for a billing dispute than for a damaged-item return, and often one message contains several issues at once. A pre-configured decision tree fixes the path before the request is understood, so it fails on anything outside its anticipated categories.<\/p>\n<p>Model-driven does not mean uncontrolled. When one rule must hold every time, enforce that rule in code. A programmatic precondition (for example, a hook on outgoing tool calls) can block <code>process_refund<\/code> until <code>get_customer<\/code> has returned a verified ID. The blocked call can never execute, so compliance is deterministic. The rest of the workflow stays flexible.<\/p>\n<p>The two incorrect options each over- or under-correct. The classifier with fixed sequences replaces the whole loop to fix one ordering rule; it trades away the adaptability the scenario depends on. The system prompt rule keeps flexibility but gives only probabilistic compliance; the audit already shows the model can skip the step, and repeating an instruction does not make it binding.<\/p>\n<p>The working mental model: prompts shape behavior, code guarantees it, and the model drives everything that does not need a guarantee.<\/p>", "docs": [["Tool Use with Claude", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Agent SDK Permissions", "https://platform.claude.com/docs/en/agent-sdk/permissions"]]}, {"k": "1.20", "d": "d1", "title": "Parallelizing Independent Work While Respecting Dependencies", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom Model Context Protocol (MCP) tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>One customer message contains three concerns: a duplicate charge on order #4451, a refund whose amount depends on what the duplicate-charge check finds, and an unrelated shipping address change. How should the agent structure the investigation before replying?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the duplicate-charge subagent spawn the refund subagent itself once its own investigation finishes.", "e": "This handles the dependency, but it moves orchestration out of the coordinator. In a hub-and-spoke design the coordinator owns delegation, error handling, and result aggregation. A refund decision launched inside another subagent's branch is harder to observe and harder to gate before the final unified reply."}, {"l": "B", "ok": false, "t": "Spawn three parallel subagents in one coordinator turn, one per concern, each receiving the shared customer record in its prompt.", "e": "Parallel delegation with explicit context is the right pattern for independent concerns, so this choice is defensible in general. It fails here because the refund assessment depends on the duplicate-charge finding, which does not exist yet when all three subagents start. The refund subagent would investigate without the fact it needs."}, {"l": "C", "ok": false, "t": "Handle all three concerns sequentially inside the main agent without delegating to any subagents.", "e": "Sequential handling respects the dependency, but it gives up the speedup available for the two independent items. It also lets verbose investigation output from all three concerns accumulate in one context. Decomposition with parallel subagents for the independent items is the better fit."}, {"l": "D", "ok": true, "t": "Run the address-change and duplicate-charge subagents in parallel, then assess the refund once the duplicate-charge result returns.", "e": "Parallel delegation fits only independent workstreams. The address change and the duplicate-charge check are independent, so they can run at the same time. The refund amount depends on the duplicate-charge finding, so that step must wait for the result before it runs."}], "o": "<p>Decomposing a multi-concern request is not only about splitting it into items. It also requires checking which items are independent and which are dependent. Anthropic's guidance is direct: parallel subagents work best when the work paths do not depend on each other. Here the address change and the duplicate-charge check share nothing, so they can run as parallel subagents. The refund is different: its amount comes from the duplicate-charge finding, so it must run after that result returns.<\/p>\n<p>The mechanism behind this rule is context isolation. A subagent sees only what its delegation prompt contains, and its findings reach the parent only in its final report. If the refund subagent starts in parallel, the duplicate-charge finding does not exist yet and cannot be passed in. Launching every concern at once therefore produces an investigation with a missing input, not a faster one.<\/p>\n<p>Keeping the dependency inside the coordinator also matters. Letting one subagent spawn the next hides the handoff from the hub that must aggregate results, handle errors, and compose the single unified reply for the customer. Handling everything sequentially in the main agent avoids these problems but wastes the parallelism the two independent items allow and fills the main context with investigation detail.<\/p>\n<p>The strongest design splits the concerns, parallelizes only the independent ones, sequences the dependent one, and then synthesizes one combined reply.<\/p>", "docs": [["Subagents in the Agent SDK", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Create Custom Subagents in Claude Code", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.21", "d": "d1", "title": "Passing Case Findings to a Subagent", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>The coordinator verifies the customer, retrieves the disputed order, and records the customer's own account of the double charge. It then delegates with the prompt \"Analyze this billing dispute.\" The subagent's analysis is generic and cites none of these facts. What should you change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the investigation summary into the subagent's description field so the data is available when Claude selects it.", "e": "The description field helps Claude decide when to delegate to a subagent. It is not a channel for runtime case data, and a static definition cannot carry findings that change with every customer."}, {"l": "B", "ok": true, "t": "Place the customer record, order details, and the customer's account of the charge directly in the delegation prompt.", "e": "A non-fork subagent starts with a fresh context. The coordinator passes it information through the Agent tool's prompt string. Including the gathered findings there is the documented way to hand off the investigation."}, {"l": "C", "ok": false, "t": "Update the subagent's system prompt in <code>AgentDefinition<\/code> to instruct it to base its analysis on the conversation history.", "e": "The system prompt defines the subagent's role and behavior, but it cannot grant access to data the subagent does not have. A non-fork subagent does not receive the parent's conversation history, so this instruction refers to content unavailable to it."}, {"l": "D", "ok": false, "t": "Add <code>get_customer<\/code> and <code>lookup_order<\/code> to the subagent's <code>allowedTools<\/code> so it retrieves the dispute records itself.", "e": "Giving a subagent its own data tools could let it retrieve the customer record and order. However, it cannot recover the customer's own account of the double charge, because that information came from the conversation and no backend tool returns it."}], "o": "<p>Each subagent is a separate agent instance with its own context window. Unless it is a fork, its context starts fresh and contains its own system prompt and the prompt string passed through the Agent tool—not the parent's conversation history or tool results.<\/p>\n<p>This isolation keeps the subagent's intermediate tool calls and verbose output out of the main conversation. The cost is that handoffs must be explicit. A delegation prompt such as \"Analyze this billing dispute\" refers to findings the subagent has never seen.<\/p>\n<p>The fix is to include the complete findings in the prompt: the verified customer record, disputed order details, and the customer's description of the charge. The description field carries stable information about when a subagent should be selected, not per-case data. A system prompt cannot provide missing runtime facts, and granting backend tools cannot recover information that exists only in the coordinator's conversation.<\/p>", "docs": [["Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.22", "d": "d1", "title": "Resuming a Session After a File Changes", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>A paused session holds detailed analysis of several MCP server files. Teammates rewrote only the <code>process_refund<\/code> handler; the other analyzed files are unchanged. An engineer pulls the merged code. What should the engineer do when resuming the session?<\/p>", "c": [{"l": "A", "ok": false, "t": "Use <code>fork_session<\/code> to branch the session and continue the editing work in the fresh branch.", "e": "<code>fork_session<\/code> copies the session's context into the new branch, so the branch inherits the same stale analysis of the handler. Forking is useful for comparing divergent approaches from a shared baseline, but it does not refresh outdated context."}, {"l": "B", "ok": false, "t": "Discard the session and start a new one seeded with a structured summary of the prior conclusions.", "e": "Starting fresh with a summary is appropriate when most prior tool results are stale. Here, only one handler changed and the rest of the analysis remains valid. A new session discards useful context that a targeted re-read could preserve."}, {"l": "C", "ok": false, "t": "Use file checkpointing to revert the handler to the version the session analyzed, then continue.", "e": "File checkpointing reverts files on disk, which would overwrite the teammates' merged rewrite with the old handler. The code on disk is correct; the agent's in-context view is outdated. The fix is to update the agent's view, not the files."}, {"l": "D", "ok": true, "t": "Tell the agent that <code>process_refund<\/code> was rewritten and have it re-read the handler before proposing edits.", "e": "This refreshes the agent's knowledge of the changed file while preserving its still-valid analysis of the other files. It is the targeted response to partial staleness."}], "o": "<p>A resumed session preserves its previous conversation and tool results. This is useful when continuing an investigation without rereading everything, but it creates a risk when files change outside the session. The agent's remembered analysis does not automatically become current simply because the engineer has pulled new code.<\/p>\n<p>The documentation describes resuming as useful when acting on earlier analysis without rereading files. The same behavior becomes a hazard when a file has changed. There is no automatic staleness check, so the engineer must identify the changed file and ask the agent to reread it.<\/p>\n<p>The selection rule has two sides. When most prior analysis remains valid, resume and identify the changed files so the agent can reread only those. When tool results are stale across the board, start a new session seeded with a structured summary. Here, only one handler changed, so a targeted reread preserves useful context.<\/p>\n<p>Forking copies the existing context, including stale analysis. File checkpointing changes files on disk rather than updating the agent's view. Starting a new session throws away more useful context than necessary.<\/p>", "docs": [["Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"]]}, {"k": "1.23", "d": "d2", "title": "Handling Transient Failures in a Subagent", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>The agent spawns an investigation subagent for billing disputes. Its <code>lookup_order<\/code> calls time out intermittently; logs show one retry succeeds about 90% of the time, but some timeouts persist through every retry. How should the subagent handle these timeouts?<\/p>", "c": [{"l": "A", "ok": false, "t": "Catch the timeout inside the subagent and return an empty order result that is marked as a successful lookup.", "e": "This silently suppresses the error. The coordinator would treat the empty result as a valid query with no matching orders, turning a temporary access failure into false information about the customer's account."}, {"l": "B", "ok": true, "t": "Retry the timed-out call inside the subagent with backoff; if retries fail, return the failure type, attempted query, and any partial results.", "e": "Local retries resolve about 90% of the timeouts without involving the coordinator. For timeouts that persist, structured context—failure type, attempted query, and partial results—gives the coordinator what it needs to choose a recovery action."}, {"l": "C", "ok": false, "t": "Retry inside the subagent with backoff; after retries run out, send the coordinator a short \"order lookup unavailable\" status.", "e": "The local retry is appropriate, but the generic status hides information the coordinator needs. Without the failure type, attempted query, and partial results, the coordinator cannot decide whether to retry later, try another approach, or proceed with partial data."}, {"l": "D", "ok": false, "t": "Send each timeout straight to the coordinator as it happens, including the attempted query, and let the coordinator choose the recovery action.", "e": "Central error handling can be reasonable, but the logs show that one retry fixes about 90% of these timeouts. Propagating every timeout makes the coordinator spend turns and context on failures the subagent can resolve itself."}], "o": "<p>Error handling in a multi-agent system has two layers. The subagent should handle what it can handle. The coordinator should only see errors the subagent could not resolve, and those errors must carry enough context for a good decision.<\/p>\n<p>In this application, the observed timeout pattern is transient: the logs show that one retry succeeds about 90% of the time. That evidence justifies local retry with backoff before anything is propagated. Retrying locally keeps the coordinator's context clean and avoids extra turns.<\/p>\n<p>Subagents are isolated instances; the parent receives the subagent's final output. That makes the final output the channel for unresolved error information, so it must be structured. A useful failure report includes the failure type, the query that was attempted, and any partial results gathered before the failure.<\/p>\n<p>Sending every timeout to the coordinator is unnecessarily expensive here. Returning only a generic \"unavailable\" status strips context needed to choose between retrying later, using an alternative lookup, or proceeding with partial data. Returning an empty result marked as success is worse: it makes a timeout look like a customer with no orders and can produce a confidently wrong answer.<\/p>", "docs": [["Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.24", "d": "d1", "title": "Fixing an MCP Tool Hook Matcher", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>You register a <code>PreToolUse<\/code> hook with the matcher <code>process_refund<\/code>; unit tests confirm its callback returns a deny decision for amounts above $500. The refund tool runs on an MCP server named <code>support<\/code>. In production the hook never fires and large refunds execute. Which change fixes the problem?<\/p>", "c": [{"l": "A", "ok": false, "t": "Register the hook on the <code>PostToolUse<\/code> event instead, since MCP tools trigger only that event.", "e": "MCP tool calls trigger <code>PreToolUse<\/code> events just like built-in tools. <code>PreToolUse<\/code> fires on the tool-call request and can block or modify it, while <code>PostToolUse<\/code> fires only after the tool has already run. The event choice is correct; the matcher is the problem."}, {"l": "B", "ok": false, "t": "Move the refund limit check into the MCP server, because SDK hooks do not cover MCP tools.", "e": "Agent SDK hooks are configured through the agent options and apply to MCP tools when the matcher names them correctly. MCP servers do not register SDK hooks, and the registration location is already correct."}, {"l": "C", "ok": true, "t": "Change the matcher to the tool's fully qualified MCP name, <code>mcp__support__process_refund<\/code>.", "e": "Hook matchers filter on the tool name exactly as the agent sees it. Tools exposed by an MCP server use fully qualified names in the form <code>mcp__server__tool<\/code>. The bare matcher <code>process_refund<\/code> does not match <code>mcp__support__process_refund<\/code>, so the hook never runs until the matcher is corrected."}, {"l": "D", "ok": false, "t": "Fix the callback's amount comparison so it returns a deny decision for refunds above $500.", "e": "Unit tests confirm that the callback already returns <code>deny<\/code> for amounts above $500, so its comparison logic is correct. The callback is never invoked; changing working logic would not fix the production issue."}], "o": "<p>In the Claude Agent SDK, hooks are passed through the agent options, with event names such as <code>PreToolUse<\/code> as keys. Each entry pairs a matcher with callback functions. For tool events, the matcher filters on the tool name. Built-in tools use names such as <code>Bash<\/code> or <code>Write<\/code>, while MCP tools use fully qualified names in the form <code>mcp__&lt;server&gt;__&lt;action&gt;<\/code>.<\/p>\n<p>A refund tool on a server named <code>support<\/code> is therefore <code>mcp__support__process_refund<\/code>. A matcher set to the bare name <code>process_refund<\/code> matches nothing, even though the callback logic is correct.<\/p>\n<p>The matcher decides when the callback runs; the callback decides what happens to the call. When debugging a hook that never fires, check the matcher before changing the callback.<\/p>\n<p>The other options fail on documented behavior. MCP tools trigger <code>PreToolUse<\/code> like any other tool. <code>PostToolUse<\/code> fires after execution, so it cannot block a refund. Hooks live in the agent options, not inside MCP servers. Omitting the matcher would make the hook run on every occurrence of the event, which can be useful for audit logging but adds overhead to every tool call.<\/p>", "docs": [["Agent SDK — Hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"], ["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks"]]}, {"k": "1.25", "d": "d1", "title": "Parallelizing Independent Investigations", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>A customer message raises a billing dispute and an unrelated shipping question. Today the coordinator delegates the two investigations sequentially, doubling latency. You want them to run in parallel. Which two steps are required? <strong>(Select TWO.)<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "Put the customer ID and the details of its own issue directly into each subagent's Task prompt.", "e": "Subagents start with isolated contexts and do not inherit the coordinator's conversation history. Once the two investigations run side by side, each one can only see what its own prompt contains. Without the customer ID and issue details in the prompt, a subagent has nothing to investigate."}, {"l": "B", "ok": false, "t": "Issue the two Task calls in consecutive coordinator turns with no user input between them, so the runtime overlaps their execution.", "e": "This looks fast but remains sequential. After the first Task call, the agent loop waits for that subagent's result before the coordinator can produce its next response. The second delegation cannot start until the first one finishes."}, {"l": "C", "ok": true, "t": "Have the coordinator emit both Task tool calls inside one assistant response instead of across separate turns.", "e": "Parallel subagent execution happens when the coordinator requests multiple Task calls in a single response. The harness can then run both delegations concurrently. Calls spread across separate turns run one after another."}, {"l": "D", "ok": false, "t": "Merge both investigations into a single Task prompt so one subagent resolves the whole customer message.", "e": "One subagent works through its tasks inside a single conversation, so the two investigations still run one after the other. This removes delegation overhead but gives up concurrency and mixes two unrelated issues into one context."}], "o": "<p>In the Claude Agent SDK, a coordinator delegates work by calling the Task tool. The agent loop drives the workflow: the coordinator produces a response, the harness executes the tool calls in that response, and the results return before the next response.<\/p>\n<p>If a response contains two Task calls, the harness can run both subagents at the same time. If the calls land in separate responses, the loop waits for the first subagent's result before the coordinator can speak again, so the second delegation waits. Removing the user from the middle does not change this; the wait is built into the loop.<\/p>\n<p>The second requirement comes from context isolation. A subagent starts a fresh conversation and sees only the prompt the coordinator writes for it. When two investigations run in parallel, neither can read the coordinator's history or the other subagent's findings. The coordinator must therefore copy the customer ID and relevant issue details into each prompt.<\/p>\n<p>Back-to-back coordinator turns remain sequential. Merging both issues into one subagent also gives up concurrency. The correct design launches both independent tasks in one assistant response and gives each subagent the information it needs.<\/p>", "docs": [["Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code — Create Custom Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.26", "d": "d1", "title": "Returning Results for Parallel Tool Calls When One Fails", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>The agent requests <code>get_customer<\/code> and <code>lookup_order<\/code> in one assistant turn. The <code>lookup_order<\/code> backend times out, and one retry also fails. The agent must decide its next step now. How should the loop return results to Claude?<\/p>", "c": [{"l": "A", "ok": true, "t": "Send one user message with the <code>get_customer<\/code> tool result plus a <code>lookup_order<\/code> tool result marked <code>is_error: true<\/code> with timeout details.", "e": "The API requires one <code>tool_result<\/code> for every <code>tool_use<\/code> block in the assistant turn. Marking the failed call with <code>is_error: true<\/code> tells the model the lookup failed, so it can reason about escalating or proceeding with partial data. Both results go together in the single next user message."}, {"l": "B", "ok": false, "t": "Send the <code>ge
