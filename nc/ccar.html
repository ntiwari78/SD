<style>
/* Layout idea: fixed chapter rail on the left, one reading column (68ch) on the right;

:root{
  --paper:#f4f5f7; --panel:#ffffff; --ink:#161a24; --muted:#5a6272; --line:#d6dae2;
  --accent:#7a3fb0; --accent-soft:#efe6f8; --on-accent:#ffffff;

  --t-add:#62d493; --t-chg:#f0b54e; --t-del:#ff8177; --t-str:#9fd6a6; --t-kw:#a9b2ff; --t-num:#f0b54e; --t-typ:#7fd0e8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a0f1f; --panel:#121932; --ink:#e7eaf6; --muted:#9ba4c2; --line:#273158;
  --accent:#c9a2f2; --accent-soft:#2b1d3d; --on-accent:#12091c;
  --add:#62d493; --chg:#f0b54e; --del:#ff8177; --add-soft:#12301f; --chg-soft:#33280f; --del-soft:#3a1714;
  --term:#060a17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0a0f1f; --panel:#121932; --ink:#e7eaf6; --muted:#9ba4c2; --line:#273158;
  --accent:#c9a2f2; --accent-soft:#2b1d3d; --on-accent:#12091c;
  --add:#62d493; --chg:#f0b54e; --del:#ff8177; --add-soft:#12301f; --chg-soft:#33280f; --del-soft:#3a1714;

html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.62 var(--body);-webkit-font-smoothing:antialiased}

<template id="t-home">
<p class="eyebrow">Claude Certified Architect · Foundations</p>
<h1>CCAR-F study guide, by topic</h1>
<p class="lede"><span data-h="total"></span> practice questions from your four sets, regrouped into <span data-h="ntopics"></span> topics across the five exam domains. Each topic explains the concept first, then gives you its questions, then names the pattern and the anti-patterns.</p>
<h2>How to use it</h2>
<div class="grid3 wide">
  <div class="pane"><h4>1 · Concept</h4>A short explanation of the idea the questions test, drawn from Anthropic's documentation.</div>
  <div class="pane"><h4>2 · Questions</h4>Every question from sets 1 to 4 on that topic. Pick, check, then read why each option is right or wrong.</div>
  <div class="pane"><h4>3 · Patterns and anti-patterns</h4>What the correct answers have in common, and the mistakes the wrong answers are built from.</div>
</div>
<p class="note">Your answers are remembered in this browser, and the counts beside each topic show progress.</p>
<h2>Domains and topics</h2>
<div class="tablewrap wide"><table><thead><tr><th>#</th><th>Domain</th><th>Exam weight</th><th>Topics</th><th>Questions</th><th>Answered</th></tr></thead><tbody data-h="domains"></tbody></table></div>
<p class="note">Exam weights are as published in the exam guide, from memory; confirm them against the current guide.</p>
<h2>The idea that decides most questions</h2>
<div class="model"><b>Meta-pattern</b><p>Most wrong options replace a deterministic mechanism with a probabilistic one. When a question asks how to make something <em>always</em> happen, the answer is the mechanism that cannot be skipped. When it asks how to make output <em>better</em> or more consistent, prompting techniques are fair game.</p></div>
<div class="tablewrap wide"><table><thead><tr><th>Need</th><th>Probabilistic (usually the distractor)</th><th>Deterministic (usually the answer)</th></tr></thead><tbody>
<tr><td>Enforce tool ordering or a precondition</td><td>Few-shot examples, emphatic prompt text</td><td>PreToolUse hook, check inside the tool, withholding the tool</td></tr>
<tr><td>Decide when the loop ends</td><td>Reading the reply's wording</td><td><code>stop_reason</code></td></tr>
<tr><td>Guarantee output shape</td><td>"Respond in JSON" in the prompt</td><td>Structured outputs, <code>strict: true</code>, forced <code>tool_choice</code></td></tr>
<tr><td>Route escalation</td><td>Sentiment, self-reported confidence</td><td>Explicit triggers and policy rules</td></tr>
<tr><td>Recover from errors</td><td>Retry everything, or hide the failure</td><td>Typed errors with a retryable flag</td></tr>
<tr><td>Restrict what an agent can do</td><td>Asking it not to</td><td>Tool allowlist, permission deny rule</td></tr>
<tr><td>Give a subagent context</td><td>Hoping it inherits the conversation</td><td>Writing it into the delegation prompt</td></tr>
</tbody></table></div>
<h2>Sources</h2>
<ul>
<li><strong>Questions and explanations:</strong> your sets at ntiwari78.github.io/SD/ccar (<a href="https://ntiwari78.github.io/SD/ccar/set1.html" target="_blank" rel="noopener">1</a>, <a href="https://ntiwari78.github.io/SD/ccar/set2.html" target="_blank" rel="noopener">2</a>, <a href="https://ntiwari78.github.io/SD/ccar/set3.html" target="_blank" rel="noopener">3</a>, <a href="https://ntiwari78.github.io/SD/ccar/set4.html" target="_blank" rel="noopener">4</a>), reproduced as written, with each question's own links to official documentation.</li>
<li><strong>Concept sections:</strong> written for this guide from Anthropic's documentation at platform.claude.com and code.claude.com and its engineering posts. Each topic lists the official pages its questions cite.</li>
<li><strong>Anti-pattern list:</strong> the <a href="https://claudecertprep.com/study-guide/anti-patterns" target="_blank" rel="noopener">claudecertprep.com anti-patterns guide</a>, a community resource not affiliated with Anthropic. Items from it are marked (CP n).</li>
</ul>

<script type="application/json" id="data">{"D": {"d1": ["Agentic Architecture & Orchestration", 27], "d2": ["Tool Design & MCP Integration", 18], "d3": ["Claude Code Configuration & Workflows", 20], "d4": ["Prompt Engineering & Structured Output", 20], "d5": ["Context Management & Reliability", 15]}, "T": [{"id": "d1-context", "dom": "d1", "title": "Subagent context isolation and explicit handoffs", "one": "A subagent knows only what its delegation prompt tells it.", "concept": "<p>A subagent is a separate agent instance with its own context window. Unless it is a fork, that window starts fresh. It contains the subagent's own system prompt, the prompt string the parent wrote when delegating, project <code>CLAUDE.md<\/code>, and its tool definitions. It does <strong>not<\/strong> contain the parent's conversation, the parent's tool results, or the parent's system prompt. Going the other way, only the subagent's final message returns; its intermediate tool calls stay inside it.<\/p>\n<p>This is a deliberate trade. Isolation keeps a verbose investigation out of the main conversation and keeps the subagent focused. The price is that every handoff must be explicit. A phrase like \"the conventions identified above\" points at text the subagent has never seen. Anything it needs (file paths, findings, decisions, source URLs, dates) has to be written into the delegation prompt, and anything the coordinator needs back (claim-to-source mappings, file and line) has to be requested as structured output.<\/p>", "pat": ["Put the actual findings, paths and constraints in the delegation prompt, not a reference to \"earlier\".", "Ask subagents to return structured results that keep each claim attached to its source, file, line and date.", "Pass each downstream agent only the slice of context its task needs.", "Use the agent definition's system prompt for stable expertise; use the delegation prompt for per-task facts.", "Resume a subagent only to continue that subagent's own earlier work."], "anti": ["Assuming a subagent inherits the coordinator's history or tool results.", "Resuming a subagent to \"give it the parent's context\". Resume restores its own history, never the parent's.", "Putting per-task findings in <code>CLAUDE.md<\/code> or an agent's system prompt, which are static.", "Letting a synthesis step receive prose summaries with the citations stripped, then asking it to cite.", "Forwarding everything to every subagent \"to be safe\", which dilutes attention and wastes tokens."], "q": ["1.6", "1.21", "1.53", "1.56", "2.7", "2.12", "2.22", "2.25", "2.29", "3.36", "3.41", "3.53", "4.2", "4.10", "4.44"], "refs": [["Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents", 7], ["Claude Code subagents", "https://code.claude.com/docs/en/sub-agents", 6], ["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents", 3], ["Claude Agent SDK documentation", "https://platform.claude.com/docs/en/agent-sdk/overview", 2], ["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview", 2], ["Claude prompt templates and variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables", 1], ["Claude citations", "https://platform.claude.com/docs/en/build-with-claude/citations", 1], ["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", 1]]}, {"id": "d1-decomp", "dom": "d1", "title": "Task decomposition, parallelism and coordinator design", "one": "Split by independence, run independent work together, and survive partial failure.", "concept": "<p>In the orchestrator-workers pattern a coordinator breaks a request into subtasks, delegates them, and combines the results. Three design questions decide whether it works. <strong>Coverage:<\/strong> does the decomposition account for every part of the request, with no overlap between workers? <strong>Dependency:<\/strong> which subtasks need another's output? Those run in sequence; the rest can run in parallel. <strong>Necessity:<\/strong> does this request need every subagent, or any at all?<\/p>\n<p>Parallelism is requested by emitting several Agent (Task) tool calls in a single assistant turn; one call per turn runs them serially. Independent subtasks then finish in the time of the slowest. A subagent costs a fresh context and a round trip, so for a couple of direct searches the main agent should just call the tool itself. When one worker fails, the coordinator should keep the successful results, report the gap, and decide whether to retry, not abandon the whole run.<\/p>", "pat": ["Emit all independent delegation calls in one response so they run concurrently.", "Sequence only where a real data dependency exists.", "Give each worker a non-overlapping scope, stated in its prompt, to prevent duplicate work.", "Select subagents dynamically: invoke only those the request needs.", "For unfamiliar territory, map first, prioritise, then follow a plan that can adapt.", "On a worker failure, continue with partial results and annotate what is missing."], "anti": ["Dispatching one delegation per turn and waiting, when the tasks are independent.", "Always running the full pipeline of subagents regardless of the request.", "Terminating the entire workflow because a single subagent failed. (CP 12)", "Spawning a subagent for work that is one or two direct tool calls.", "Decomposing by what is easy to name, leaving one of the user's concerns unassigned."], "q": ["1.20", "1.25", "2.13", "2.23", "2.26", "2.40", "2.45", "2.56", "2.58", "3.24", "3.28", "3.43", "4.8", "4.32"], "refs": [["Subagents in the Agent SDK", "https://platform.claude.com/docs/en/agent-sdk/subagents", 8], ["Building effective agents", "https://www.anthropic.com/research/building-effective-agents", 5], ["Create Custom Subagents in Claude Code", "https://code.claude.com/docs/en/sub-agents", 3], ["How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system", 3], ["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview", 1], ["Anthropic — Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents", 1], ["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview", 1], ["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows", 1]]}, {"id": "d1-workflow", "dom": "d1", "title": "Workflows versus agents, and loop control", "one": "Use a fixed pipeline when the steps are known; use an agent when they are not.", "concept": "<p>Anthropic's <em>Building effective agents<\/em> separates two kinds of system. A <strong>workflow<\/strong> orchestrates model calls through predefined code paths: prompt chaining, routing, parallelisation, orchestrator-workers, evaluator-optimizer. An <strong>agent<\/strong> lets the model direct its own process and tool use. The guidance is to choose the simplest thing that works. If a task has the same steps every time, such as a weekly brief or a recurring audit, a fixed chain is more predictable, cheaper and easier to test than an open-ended loop.<\/p>\n<p>When a loop is right, it needs an exit. An evaluator-optimizer or re-extraction loop should stop on a measurable condition (coverage reached, no new issues, an iteration cap), not on the model saying it is done. Autonomy also needs oversight: review a random, stratified sample of what the agent resolved by itself, because escalated cases are a biased sample. And prompts steer behaviour: wording in a system prompt that pairs a topic with a tool will pull the model toward that tool.<\/p>", "pat": ["Recurring task with fixed stages: implement a prompt chain or pipeline in code.", "Open-ended task where steps depend on findings: use an agent loop.", "Give refinement loops an explicit stop condition and a maximum iteration count.", "Detect gaps in code (for example null fields) and re-delegate only those.", "Audit autonomous outcomes with ongoing stratified random sampling."], "anti": ["Using an autonomous agent for a job whose steps never vary.", "Loops that end only when the model judges its own work finished.", "Reviewing only the cases the agent chose to escalate.", "System-prompt language that accidentally associates a subject with an action (\"billing… escalate with care\").", "Asking a prompt to \"always do step A then step B\" when code could simply call them in order."], "q": ["2.15", "2.27", "2.28", "2.30", "3.55", "4.7", "4.33", "4.45"], "refs": [["Building effective agents", "https://www.anthropic.com/research/building-effective-agents", 5], ["Claude prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 1], ["How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system", 1], ["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview", 1], ["Claude Code: Subagents", "https://code.claude.com/docs/en/sub-agents", 1], ["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", 1], ["Claude Agent SDK documentation", "https://docs.anthropic.com/en/docs/claude-code/sdk", 1], ["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 1]]}, {"id": "d1-enforce", "dom": "d1", "title": "Programmatic enforcement with hooks and preconditions", "one": "If it must always happen, enforce it in code. Prompts only make it likely.", "concept": "<p>A prompt instruction is a strong suggestion. For a rule that must hold every time, such as \"verify the customer before a refund\" or \"never send internal codenames to an external search tool\", use a deterministic mechanism. Hooks are that mechanism in Claude Code and the Agent SDK.<\/p>\n<p>A <strong>PreToolUse<\/strong> hook runs before a tool call and can block it: exit code 2 blocks and feeds the reason back to Claude, or the hook can return a permission decision of allow, deny or ask. A <strong>PostToolUse<\/strong> hook runs after the tool and can add context or rewrite what the model sees, which makes it the place to normalise or trim tool results. Hooks select tools with a matcher; MCP tools are named <code>mcp__&lt;server&gt;__&lt;tool&gt;<\/code>, so a matcher must use that full form or a pattern such as <code>mcp__payments__.*<\/code>. The same principle works without hooks: a precondition check inside the tool handler, or simply not giving an agent the tool.<\/p>", "pat": ["Gate high-stakes tool calls with a PreToolUse hook or a check inside the tool itself.", "Leave tool <em>selection<\/em> to the model; enforce only the hard precondition in code.", "Match MCP tools by their fully qualified <code>mcp__server__tool<\/code> name.", "Normalise or filter tool output in a PostToolUse hook before the model reads it.", "Apply one policy across several tools with a shared hook, not a rule copied into each prompt.", "Make an action impossible by withholding the tool from that agent."], "anti": ["Using few-shot examples or emphatic prompt text to enforce tool ordering. (CP 1)", "A hook matcher written as the bare tool name, which never matches the MCP tool.", "Hard-coding the whole tool sequence when only one precondition needs guaranteeing.", "Relying on a generic tool when a constrained one could validate its own input. (CP 14)", "Trying to block in PostToolUse: the tool has already run."], "q": ["1.19", "1.24", "1.47", "1.54", "2.31", "2.51", "3.11", "3.23", "3.42", "3.45", "4.4"], "refs": [["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks", 6], ["Agent SDK — Hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks", 5], ["Claude Agent SDK — Hooks", "https://docs.anthropic.com/en/docs/claude-code/sdk", 2], ["Claude Code — Hooks reference", "https://docs.anthropic.com/en/docs/claude-code/hooks", 2], ["Tool Use with Claude", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 1], ["Agent SDK Permissions", "https://platform.claude.com/docs/en/agent-sdk/permissions", 1], ["Claude Code features overview", "https://code.claude.com/docs/en/features-overview", 1], ["Claude Code — Get started with hooks", "https://code.claude.com/docs/en/hooks-guide", 1]]}, {"id": "d1-loop", "dom": "d1", "title": "The agent loop and tool results in the Messages API", "one": "Drive the loop from stop_reason, and answer every tool call.", "concept": "<p>An agent is a loop around the Messages API. Send the conversation; if the response's <code>stop_reason<\/code> is <code>tool_use<\/code>, run the requested tools, append the results, and call again; if it is <code>end_turn<\/code>, the model is finished. The signal is the structured field, never the wording of the reply.<\/p>\n<p>Returning results has strict rules. Every <code>tool_use<\/code> block needs exactly one <code>tool_result<\/code> with the matching <code>tool_use_id<\/code>, including when the tool failed. All results go in the single user message that immediately follows the assistant's tool-use message, and the <code>tool_result<\/code> blocks come first in that message, before any text. A failed call is reported with <code>is_error: true<\/code> and a useful message, which lets Claude retry or explain. Omitting a result, or putting text ahead of results, produces an API error. When Claude requests several tools in one turn, run them and return all results together.<\/p>", "pat": ["Loop while <code>stop_reason == \"tool_use\"<\/code>; stop on <code>end_turn<\/code>.", "Return one <code>tool_result<\/code> per <code>tool_use<\/code> id, all in the next user message, results first.", "Report failures as results with <code>is_error: true<\/code> and an actionable message.", "Cap retries in your loop, since Claude may retry a failing call."], "anti": ["Parsing the assistant's natural language to decide whether the loop is done. (CP 7)", "Dropping the result for a failed parallel call and returning only the successes.", "Placing explanatory text before the <code>tool_result<\/code> blocks.", "Splitting results for one assistant turn across several user messages.", "Stopping after a fixed number of iterations as the primary termination rule."], "q": ["1.26", "2.20", "3.37", "3.44", "4.6"], "refs": [["Tool Use Overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 2], ["Handling Tool Calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use", 2], ["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview", 2], ["Anthropic — Messages API", "https://docs.anthropic.com/en/api/messages", 2], ["Claude tool use: Handle tool calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", 1]]}, {"id": "d1-session", "dom": "d1", "title": "Sessions: resume, fork, or start fresh", "one": "A resumed session remembers what it read, not what changed since.", "concept": "<p>A session is the stored conversation history. <strong>Resuming<\/strong> restores it so work continues with full context; in Claude Code, <code>--resume<\/code> takes a session name or ID and <code>--continue<\/code> picks up the most recent one, while scripts should capture the <code>session_id<\/code> from the first run's output and resume that exact session. <strong>Forking<\/strong> (<code>fork_session<\/code>) copies the history into a new session, so two lines of work can branch from one baseline without affecting each other.<\/p>\n<p>History is a record of past observations. If files changed while the session was idle, the model still \"remembers\" the old contents. Tell it what changed and have it re-read just those files; a <code>SessionStart<\/code> hook matched on <code>resume<\/code> can inject that list automatically. When most of the earlier context is now wrong, for example after a framework migration, start a new session with a written summary of what still holds, because stale tool results will keep misleading a resumed one.<\/p>", "pat": ["Resume by explicit ID or name in automation; do not rely on \"most recent\".", "After files change, name the changed files and ask for a targeted re-read.", "Automate that refresh with a SessionStart hook on resume.", "Fork from a shared baseline to compare alternatives independently.", "Start fresh with a curated summary when earlier context is largely stale."], "anti": ["Resuming a session without telling Claude which files changed. (CP 9)", "Re-reading the whole repository after a one-file change.", "Running two experiments in sequence in one session, so the first contaminates the second.", "Carrying stale evidence into a new session by pasting the old transcript.", "Expecting <code>--continue<\/code> to find a specific named investigation."], "q": ["1.22", "1.28", "1.52", "1.55", "3.9", "3.10", "3.17", "3.26", "4.3", "4.5", "4.37", "4.38"], "refs": [["Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions", 6], ["Claude Code — CLI Reference", "https://code.claude.com/docs/en/cli-reference", 4], ["Claude Code — Headless mode", "https://code.claude.com/docs/en/headless", 2], ["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks", 1], ["Claude Code slash commands", "https://code.claude.com/docs/en/slash-commands", 1], ["Claude Code common workflows", "https://code.claude.com/docs/en/common-workflows", 1], ["Context windows", "https://code.claude.com/docs/en/context-windows", 1], ["Claude Code — How Claude Code works", "https://code.claude.com/docs/en/how-claude-code-works", 1]]}, {"id": "d2-desc", "dom": "d2", "title": "Tool descriptions and tool selection", "one": "The description is the model's only guide to which tool to call.", "concept": "<p>Claude chooses tools from their names, descriptions and input schemas. When two tools have short, overlapping descriptions, selection becomes guesswork. Anthropic's tool-use guidance treats detailed descriptions as the single most important factor in tool performance: say what the tool does, when to use it and when not to, what each parameter means, and what it returns. Where tools are similar, state the boundary between them explicitly.<\/p>\n<p>Fix selection errors at the source. Rewriting descriptions is cheap and affects every call; adding few-shot examples or a routing layer treats the symptom. With many MCP tools, descriptions may be truncated or deferred, so put the distinguishing information first and consider fewer, better-scoped tools. If a query is ambiguous about which document or record is meant, the tool should return the candidates so the agent can ask, not pick one.<\/p>", "pat": ["Write multi-sentence descriptions: purpose, when to use, when not to, inputs, outputs.", "Differentiate similar tools by naming the boundary in both descriptions.", "Front-load the distinguishing facts in case descriptions are truncated.", "Rename tools so the name itself separates them.", "Reduce the number of tools an agent sees to those its role needs."], "anti": ["One-line descriptions for tools with overlapping purposes.", "Compensating for vague descriptions with few-shot examples in the system prompt.", "Adding a classifier or router in front of tools whose descriptions were never fixed.", "Merging distinct tools into one generic tool with a \"mode\" parameter to hide the ambiguity."], "q": ["1.18", "2.46", "2.48", "3.47", "4.13", "4.42"], "refs": [["Define Tools", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 2], ["Anthropic API — How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use", 2], ["Troubleshooting Tool Use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use#troubleshooting", 1], ["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents", 1], ["Anthropic — Tool search tool", "https://docs.anthropic.com/en/docs/agents-and-tools/tool-use/tool-search-tool", 1]]}, {"id": "d2-errors", "dom": "d2", "title": "Structured tool errors and failure semantics", "one": "An error should tell the agent what failed, whether to retry, and what to do next.", "concept": "<p>A tool result is information the model reasons over. \"Operation failed\" gives it nothing. A useful error says what kind of failure occurred (transient, validation, permission, business rule), whether a retry could succeed, and what alternative exists. With that, the agent can retry a timeout, correct an invalid input, or explain a policy refusal to the customer without burning turns on attempts that cannot work.<\/p>\n<p>Two distinctions matter most. First, <strong>failure is not emptiness<\/strong>: a search that timed out and a search that ran and found nothing must look different, or the agent will report \"no results\" for a query that never executed. Second, <strong>handle errors at the right level<\/strong>: a subagent should retry transient faults locally, and only when that is exhausted return a structured failure with what it tried and any partial results, so the coordinator can decide. A policy block is not retryable and should say so.<\/p>", "pat": ["Return error category, a retryable flag, and a human-readable next step.", "Use <code>is_error<\/code> for failures; return a normal empty result for \"ran fine, found nothing\".", "Retry transient errors inside the subagent, with a bound.", "Propagate failures upward with what was attempted and any partial results.", "Mark business-rule and policy refusals as non-retryable, with the reason in customer-safe wording."], "anti": ["Generic error strings with no category or guidance.", "Returning an empty result set when the call actually failed. (CP 5)", "Marking every error retryable, so the agent loops on a permission denial.", "Bubbling every transient blip to the coordinator instead of retrying locally.", "Discarding valid partial results because one part failed.", "Leaking internal stack traces or policy codes into text the customer sees."], "q": ["1.23", "1.27", "1.48", "1.49", "1.59", "2.10", "2.53", "2.57", "3.4", "3.13", "4.14", "4.39"], "refs": [["Handling Tool Calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use", 5], ["Tool Use Overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 4], ["Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents", 3], ["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents", 1], ["Agent SDK hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks", 1], ["MCP tools specification", "https://modelcontextprotocol.io/specification/latest/server/tools", 1], ["Claude Agent SDK — MCP", "https://platform.claude.com/docs/en/agent-sdk/mcp", 1], ["Anthropic API — How to handle tool calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", 1]]}, {"id": "d2-scope", "dom": "d2", "title": "Scoping tools per agent and controlling tool choice", "one": "Give each agent the tools of its role, and force a call only when you need one.", "concept": "<p>Tool access is a design decision. In an agent definition, the <code>tools<\/code> list restricts a subagent to those tools; a tool left out is simply absent from its session. A report writer with search tools will search instead of citing what it was given. A read-only reviewer with a refund tool can issue refunds. Fewer tools also means better selection. Scoping extends to data: a tool that takes a customer ID from the model can leak across customers, whereas a tool bound to the authenticated session cannot.<\/p>\n<p><code>tool_choice<\/code> controls whether a tool is called. <code>auto<\/code> lets the model decide, <code>any<\/code> requires some tool, <code>{\"type\": \"tool\", \"name\": …}<\/code> requires a specific one, and <code>none<\/code> forbids tools. Force a tool to guarantee the first step or to get schema-shaped output; use <code>any<\/code> when several schemas are valid and the model should pick. A required field in a tool's schema, such as a handoff summary on an escalation tool, makes a complete handoff structurally unavoidable.<\/p>", "pat": ["Define an explicit <code>tools<\/code> allowlist per subagent, matched to its role.", "Withhold side-effecting tools from analysis and review agents.", "Bind identity and scope in the tool implementation, not in a model-supplied argument.", "Force a specific tool for a guaranteed first call; use <code>any<\/code> to require one of several.", "Encode required handoff content as required schema fields."], "anti": ["Giving every agent every available tool. (CP 6)", "Giving a synthesis or report agent web-search tools it should not need. (CP 10)", "Asking an agent in its prompt not to use a tool it has been given.", "Trusting a model-supplied customer or tenant identifier for access control.", "Leaving <code>tool_choice<\/code> on <code>auto<\/code> when a tool call is mandatory."], "q": ["1.30", "2.43", "2.44", "3.5", "3.27", "4.1", "4.11", "4.15", "4.40"], "refs": [["Tool Use Overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 3], ["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents", 3], ["How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system", 1], ["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents", 1], ["Claude Agent SDK — TypeScript reference", "https://platform.claude.com/docs/en/agent-sdk/typescript", 1], ["Anthropic API — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview", 1], ["Anthropic API — Define tools and tool choice", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/implement-tool-use", 1], ["Anthropic API — How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use", 1]]}, {"id": "d2-mcp", "dom": "d2", "title": "MCP servers: configuration, scopes and resources", "one": "Choose the scope by who needs the server, and keep secrets out of the repository.", "concept": "<p>The Model Context Protocol connects Claude to external systems through servers that expose <strong>tools<\/strong> (actions the model can call), <strong>resources<\/strong> (data the application can read and attach as context) and prompts. In Claude Code a server is configured at one of three scopes: <strong>local<\/strong> (you, this project), <strong>project<\/strong> (a <code>.mcp.json<\/code> file committed to the repository, so the team shares it) and <strong>user<\/strong> (you, across all your projects). Several servers can be active in one session; their tools are namespaced by server.<\/p>\n<p>A shared <code>.mcp.json<\/code> must not contain credentials. It supports environment-variable expansion such as <code>${API_TOKEN}<\/code>, so the file is committed and each developer supplies the value. Remote HTTP servers authenticate with headers or OAuth. When an agent keeps spending tool calls just to discover what exists (module lists, schemas), expose that as an MCP resource so it arrives as reference context. Prefer an existing, maintained server for a standard system, and build a custom one for what is specific to you.<\/p>", "pat": ["Team-wide server: project scope in <code>.mcp.json<\/code>, with <code>${VAR}<\/code> for secrets.", "Personal server used in many repositories: user scope.", "Publish stable reference data as MCP resources to cut discovery calls.", "Use an existing community or vendor server before writing your own.", "Configure auth for remote servers explicitly (headers or OAuth)."], "anti": ["Committing API keys inside <code>.mcp.json<\/code>.", "Configuring a personal server separately in every repository.", "Putting a team server in one developer's local config and wondering why others lack it.", "Making the agent rediscover the same catalogue with tool calls on every run.", "Building a custom server for a system that already has a good one."], "q": ["1.58", "2.5", "2.36", "3.32", "3.33", "4.34", "4.41", "4.43"], "refs": [["Claude Code MCP", "https://code.claude.com/docs/en/mcp", 3], ["Claude Agent SDK MCP", "https://platform.claude.com/docs/en/agent-sdk/mcp", 2], ["Anthropic — Connect Claude Code to tools via MCP", "https://docs.anthropic.com/en/docs/claude-code/mcp", 2], ["Claude Code settings", "https://code.claude.com/docs/en/settings", 1], ["Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 1], ["Model Context Protocol — Resources", "https://modelcontextprotocol.io/docs/concepts/resources", 1]]}, {"id": "d2-builtin", "dom": "d2", "title": "Built-in tools and shaping tool output", "one": "Know what Grep, Edit and Read actually do, and control what comes back.", "concept": "<p>Claude Code's built-in tools have precise semantics. <strong>Grep<\/strong> searches file <em>contents<\/em> with regular expressions, so a literal such as <code>foo(<\/code> needs its metacharacters escaped, and its output mode decides whether you get matching lines, file names or counts. <strong>Glob<\/strong> matches file <em>paths<\/em>. <strong>Edit<\/strong> replaces an exact string and fails if that string is missing or appears more than once; the fix is to include enough surrounding text to make the anchor unique, or to replace all occurrences deliberately. If an edit cannot be anchored, read the file and write it back.<\/p>\n<p>Output shape matters as much as input. Large or inconsistent tool results crowd the context and confuse the model, so trim and normalise them before it sees them, typically in a PostToolUse hook. And context size is not attention: a single pass over a very long document yields detailed results early and sparse ones later. Split the work into per-section passes and add a separate pass for cross-section consistency.<\/p>", "pat": ["Use Grep for content, Glob for paths; escape regex metacharacters for literal searches.", "Make Edit anchors unique by adding surrounding context.", "Fall back to Read then Write when exact-string editing cannot work.", "Normalise and trim tool output in a hook before it reaches the model.", "Process long documents in focused per-section passes plus a reconciliation pass."], "anti": ["Searching for code with unescaped regex characters and trusting \"no matches\".", "Retrying a failed Edit with the same ambiguous string.", "Using a larger context window to fix attention dilution over long inputs. (CP 4)", "Passing raw, verbose tool output straight into the conversation.", "One giant extraction pass over a multi-document packet."], "q": ["1.14", "1.60", "2.8", "2.34", "3.46", "4.12", "4.16", "4.35"], "refs": [["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference", 3], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices", 3], ["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows", 1], ["Claude Code — Settings and tools", "https://docs.anthropic.com/en/docs/claude-code/settings", 1], ["Chain complex prompts for stronger performance", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-prompts", 1], ["Long-context prompting tips", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/long-context-tips", 1]]}, {"id": "d3-memory", "dom": "d3", "title": "CLAUDE.md, imports and path-scoped rules", "one": "Where an instruction lives decides who gets it and when it loads.", "concept": "<p><code>CLAUDE.md<\/code> files are instructions loaded into every session. Location sets scope: a managed policy file for the organisation; <code>~/.claude/CLAUDE.md<\/code> for you across all projects; <code>./CLAUDE.md<\/code> or <code>./.claude/CLAUDE.md<\/code> for the team through source control; <code>CLAUDE.local.md<\/code> for you in one project, uncommitted. CI and teammates see only what is in the repository, so shared review criteria belong in the project file.<\/p>\n<p>A file can pull in others with <code>@path<\/code> imports. Imports organise; they do not save context, because imported files load at launch too. To load guidance only when relevant, put it in <code>.claude/rules/<\/code> with <code>paths:<\/code> frontmatter: such a rule loads when Claude reads a matching file. A <code>CLAUDE.md<\/code> in a subdirectory also loads lazily, when files there are read. After <code>/compact<\/code>, the project-root <code>CLAUDE.md<\/code> is re-read from disk and re-injected, so rules that must survive compaction belong there, not in chat. Keep each file short; long files reduce adherence.<\/p>", "pat": ["Team standards: project <code>CLAUDE.md<\/code>, committed.", "Personal preferences across projects: <code>~/.claude/CLAUDE.md<\/code>.", "File-type or directory-specific conventions: <code>.claude/rules/*.md<\/code> with <code>paths:<\/code> globs.", "Reuse an existing standards document with an <code>@import<\/code> instead of copying it.", "Keep instructions concrete and files under about 200 lines."], "anti": ["Putting team rules in a user-level file, so CI and colleagues never load them.", "Expecting <code>@imports<\/code> to reduce context usage.", "Loading every convention in every session when only test files need the testing rules.", "Stating a critical rule once in conversation and expecting it to survive compaction.", "Vague guidance (\"write good tests\") where a concrete rule was needed."], "q": ["1.10", "2.4", "2.32", "2.41", "3.18", "3.50", "3.58", "4.31", "4.36", "4.50"], "refs": [["Claude Code Memory and `CLAUDE.md`", "https://code.claude.com/docs/en/memory", 6], ["Claude Code settings", "https://code.claude.com/docs/en/settings", 4], ["Claude Code Skills", "https://code.claude.com/docs/en/skills", 1], ["Claude Code — Manage Claude's memory", "https://docs.anthropic.com/en/docs/claude-code/memory", 1], ["Claude Code — Slash commands", "https://docs.anthropic.com/en/docs/claude-code/slash-commands", 1], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices", 1]]}, {"id": "d3-plan", "dom": "d3", "title": "Plan mode, direct execution and iteration", "one": "Plan when the change is large or uncertain; just do it when it is small and clear.", "concept": "<p>Claude Code's best-practice workflow is explore, plan, implement, verify. <strong>Plan mode<\/strong> is a permission mode in which Claude can read and investigate, including read-only shell commands, and proposes a plan for approval before editing anything. It pays off when a change spans many files, when the approach is unclear, or when the codebase is unfamiliar. If you could describe the diff in one sentence, planning is overhead: execute directly.<\/p>\n<p>When a plan is incomplete, revise it before approving. When you do not know the requirements yet, have Claude interview you so unknowns surface before code is written. The strongest lever for quality is giving Claude a way to check its own work: tests, a build, a screenshot. Test-driven iteration (write failing tests, implement, run, repeat) turns \"looks right\" into \"passes\". Batch related findings into one request so interdependent fixes are made together, and keep unrelated ones separate.<\/p>", "pat": ["Multi-file, architectural or unfamiliar work: plan mode, then approve.", "Small, well-understood fix: direct execution.", "Unknown requirements: ask Claude to interview you first.", "Provide verification (tests, expected output) so Claude can self-correct.", "Group interdependent findings in one prompt; fix independent ones separately."], "anti": ["Planning a one-line fix.", "Diving into a cross-cutting refactor with no plan or approval gate.", "Approving a plan you know is incomplete and fixing it mid-execution.", "Accepting an implementation with no way to verify it.", "Treating read-only commands in plan mode as a bug."], "q": ["1.7", "1.8", "1.11", "1.16", "2.1", "2.11", "2.17", "3.2", "3.8", "3.30", "3.48", "3.59", "4.17", "4.26"], "refs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices", 9], ["Claude Code common workflows", "https://code.claude.com/docs/en/common-workflows", 7], ["Claude Code permissions", "https://code.claude.com/docs/en/permissions", 4], ["Claude Agent SDK documentation", "https://platform.claude.com/docs/en/agent-sdk/overview", 1], ["Claude Code Permission Modes", "https://code.claude.com/docs/en/permission-modes", 1], ["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows", 1], ["Claude Code — Best practices", "https://docs.anthropic.com/en/docs/claude-code/best-practices", 1], ["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference", 1]]}, {"id": "d3-skills", "dom": "d3", "title": "Skills and slash commands", "one": "A skill is a packaged procedure; its frontmatter controls how it runs.", "concept": "<p>A skill is a directory with a <code>SKILL.md<\/code> file: YAML frontmatter plus instructions, invoked by Claude when its description matches or by a user as <code>/name<\/code>. Location sets scope: <code>.claude/skills/<\/code> in the repository shares it with the team, <code>~/.claude/skills/<\/code> is personal. When a personal and a project skill share a name, one shadows the other, so give a personal variant its own name.<\/p>\n<p>Frontmatter matters. <code>description<\/code> tells Claude when to use the skill. <code>argument-hint<\/code> shows expected arguments in autocomplete. <code>disable-model-invocation: true<\/code> means only a user can trigger it, which is right for anything with side effects such as a deploy. <code>context: fork<\/code> runs the skill in an isolated subagent context: useful for verbose exploration, wrong for a skill that only supplies guidelines the main conversation needs. <code>allowed-tools<\/code> pre-approves tools while the skill runs; it does not restrict the others. To block a tool, use a permission deny rule.<\/p>", "pat": ["Share a command with the team by committing it under <code>.claude/skills/<\/code> (or <code>.claude/commands/<\/code>).", "Give a personal variant a distinct name to avoid shadowing.", "Add <code>argument-hint<\/code> so required arguments appear in autocomplete.", "Require explicit invocation for side-effecting skills.", "Fork context only for skills that do heavy, self-contained work."], "anti": ["Reading <code>allowed-tools<\/code> as a restriction. It grants; it does not deny.", "Forking a guidelines-only skill, so its guidance never reaches the main conversation.", "Letting the model auto-invoke a skill that deploys or deletes.", "A personal skill with the same name as the team's, silently replacing it.", "Keeping a team command in your home directory."], "q": ["1.9", "2.19", "2.50", "2.54", "3.22", "4.27", "4.56", "4.60"], "refs": [["Claude Code Skills", "https://code.claude.com/docs/en/skills", 5], ["Claude Code Subagents", "https://code.claude.com/docs/en/sub-agents", 1], ["Claude Code memory and configuration", "https://code.claude.com/docs/en/memory", 1], ["Claude Code — Permissions", "https://code.claude.com/docs/en/permissions", 1], ["Claude Code — Slash commands", "https://code.claude.com/docs/en/slash-commands", 1]]}, {"id": "d3-ci", "dom": "d3", "title": "Permissions, headless runs and CI", "one": "An unattended run cannot answer a prompt, so decide everything in advance.", "concept": "<p>Claude Code asks permission before tools that change things. Rules in settings decide the outcome ahead of time: <strong>allow<\/strong> rules pre-approve, <strong>deny<\/strong> rules block, and deny wins. Rules can target a tool, a command pattern, a path, or an MCP tool by its <code>mcp__server__tool<\/code> name. A restriction such as \"never edit this directory\" is a deny rule, not a sentence in a rules file.<\/p>\n<p>In CI, Claude runs non-interactively with <code>-p<\/code>. Nobody is there to approve, so an unresolved permission prompt hangs or fails the job. Pre-approve exactly the tools the job needs, configure unresolved requests to be denied, and request machine-readable output. Project configuration from the repository applies; a developer's personal files do not, which is the usual reason \"it works locally\" and not in CI. Parallel clarifying questions in an SDK app need the <code>AskUserQuestion<\/code> tool enabled. When the agent must hand off to a person who cannot see its transcript, the handoff has to stand alone.<\/p>", "pat": ["Pre-approve the job's tools, including MCP tools by full name, for unattended runs.", "Use deny rules for hard path and tool restrictions.", "Make CI fail fast on any unresolved permission request.", "Keep CI-relevant instructions in the repository.", "Write escalations as self-contained summaries: scope, analysis so far, the blocking question, a recommendation."], "anti": ["Running CI with interactive defaults and letting it wait for input.", "Bypassing all permissions to stop the prompts.", "Encoding a restriction as prose in a rules file.", "Escalating with \"see the session for details\" to someone who cannot see the session.", "Review instructions that live only in a developer's personal config."], "q": ["1.12", "1.13", "1.15", "2.33", "3.12", "3.21", "3.25", "3.51", "4.21"], "refs": [["Claude Code Permissions", "https://code.claude.com/docs/en/permissions", 3], ["Run Claude Code programmatically", "https://code.claude.com/docs/en/headless", 3], ["Claude Code CLI reference", "https://code.claude.com/docs/en/cli-reference", 2], ["Claude Code — MCP", "https://code.claude.com/docs/en/mcp", 2], ["Claude Code Memory and Rules", "https://code.claude.com/docs/en/memory", 1], ["Claude Code Skills", "https://code.claude.com/docs/en/skills", 1], ["Agent SDK — Handling user input", "https://platform.claude.com/docs/en/agent-sdk/user-input", 1], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices", 1]]}, {"id": "d3-context", "dom": "d3", "title": "Keeping the main context clean: subagents and /compact", "one": "Push exploration into subagents and compact with instructions.", "concept": "<p>The context window is the scarce resource in a long Claude Code session. Reading dozens of files to answer one question fills it with material you will not need again. Delegating that exploration to a subagent keeps the reading in the subagent's context and returns only the conclusion. The built-in <strong>Explore<\/strong> subagent is read-only and fast, suited to search and codebase discovery; it cannot edit, and it is one-shot, so it cannot be resumed. Work that needs edits, or a long investigation you will return to, calls for a general-purpose or custom subagent, which returns an agent ID you can resume.<\/p>\n<p>What a subagent returns is all the parent gets, so ask for findings in a usable form: file paths, line numbers, the specific facts. <code>/compact<\/code> summarises the conversation to free space. Give it focus instructions that name what must survive, such as decisions made and key findings, or important detail may be summarised away.<\/p>", "pat": ["Delegate broad codebase discovery to an Explore subagent.", "Use a resumable custom or general-purpose subagent for long investigations.", "Ask subagents to return paths, lines and concrete findings, not narrative.", "Run <code>/compact<\/code> with instructions naming what to keep.", "Choose the subagent by capability: read-only for exploration, edit-capable for changes."], "anti": ["Doing wide exploration in the main conversation.", "Asking Explore to make edits, or trying to resume it.", "Accepting a vague subagent summary and then re-doing the search.", "Compacting with no guidance and losing the decision you needed.", "Clearing the session when a focused compact would have kept the findings."], "q": ["1.17", "2.49", "3.1", "3.60", "4.28"], "refs": [["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents", 3], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices", 2], ["Claude Code Slash Commands", "https://code.claude.com/docs/en/slash-commands", 1], ["Claude Code Context Windows", "https://code.claude.com/docs/en/context-windows", 1], ["Anthropic — Citations", "https://docs.anthropic.com/en/docs/build-with-claude/citations", 1]]}, {"id": "d4-schema", "dom": "d4", "title": "Structured outputs, schemas and tool_choice", "one": "A schema guarantees shape. It does not guarantee the values are right.", "concept": "<p>Structured outputs constrain generation so the response is valid JSON matching your schema. There are two forms: JSON output format for the response itself, and <code>strict: true<\/code> on a tool so its inputs always match the tool's schema. Both remove malformed JSON and missing required fields. Neither checks meaning: the model can still put the buyer in the seller field or invent a plausible identifier.<\/p>\n<p>Know the limits. If the response hits <code>max_tokens<\/code>, the JSON may be cut off and invalid: raise the limit. A refusal overrides the schema. Enum casing in output can differ from the schema, so compare case-insensitively. Structured outputs cannot be combined with citations or prefilled responses. Forcing a specific tool with <code>tool_choice<\/code> is not compatible with extended thinking, which supports only <code>auto<\/code> and <code>none<\/code>. Schema design is where you prevent fabrication: make a field nullable or optional when the source may not contain it, add an explicit \"not found\" option, and add fields that let code cross-check, such as line items alongside a stated total.<\/p>", "pat": ["Use strict tools or JSON output when downstream code parses the result.", "Make absent-in-source fields nullable; never force a value.", "Use enums with an \"other/unknown\" escape and compare case-insensitively.", "Check <code>stop_reason<\/code>; treat <code>max_tokens<\/code> as truncation.", "Add redundant fields (stated total and computed total) so code can detect conflicts.", "Validate semantics in code or a second pass; normalise formats before or after extraction."], "anti": ["Making every schema field required to \"ensure complete output\". (CP 15)", "Treating schema-valid output as correct output.", "Asking for JSON in the prompt and parsing free text when a schema was available.", "Forcing a tool while extended thinking is on.", "Fixing truncated JSON with prompt wording instead of a higher token limit."], "q": ["1.34", "1.36", "1.37", "1.39", "1.40", "1.45", "2.9", "2.16", "2.35", "2.39", "3.7", "3.16", "3.34", "4.49", "4.51"], "refs": [["Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", 9], ["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use", 3], ["Strict tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use", 3], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 2], ["Increase output consistency", "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", 2], ["Extended thinking", "https://platform.claude.com/docs/en/build-with-claude/extended-thinking", 1], ["Messages API reference", "https://platform.claude.com/docs/en/api/messages", 1], ["Define tools for Claude", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", 1]]}, {"id": "d4-fewshot", "dom": "d4", "title": "Few-shot examples and explicit criteria", "one": "Examples teach format and judgement; the examples you choose become the pattern.", "concept": "<p>A few well-chosen examples are the most reliable way to get consistent format and to convey a judgement that is hard to state as a rule. Anthropic's guidance asks for examples that are relevant, diverse and clearly delimited. The model generalises from the pattern it sees, including patterns you did not intend. If every example is \"high severity\", output skews high. If every example escalates, the agent over-escalates. Coverage of edge cases and of the \"do nothing\" case matters as much as the number of examples.<\/p>\n<p>Where a rule can be stated, state it. \"Flag only when the names refer to different legal entities\" beats \"be careful with names\". Vague instructions such as \"be conservative\" or \"only report high-confidence findings\" move behaviour unpredictably and usually trade recall for precision silently. A better structure is to have the model report everything with a confidence or category, and filter in code. To stop a reviewer flagging sample code, tell it which content is example material.<\/p>", "pat": ["Give 2–4 varied examples covering the hard and the negative cases.", "Pair contrasting examples (flag / do not flag) to mark the boundary.", "Write explicit, checkable criteria for categories such as severity.", "Show the exact output format, including a fully worked suggested fix.", "Separate finding from filtering: report with confidence, threshold downstream.", "Delimit examples and say what is illustrative."], "anti": ["Examples drawn from one category, biasing every output toward it.", "Using few-shot examples to enforce something that must be guaranteed.", "\"Be conservative\" or \"only if highly confident\" as the fix for false positives.", "Adding more examples of the same kind when the gap is coverage.", "Leaving example code unmarked so the reviewer reports issues in it."], "q": ["1.33", "1.35", "1.44", "2.3", "2.6", "2.55", "3.31", "3.35", "3.38", "3.40", "4.46", "4.47", "4.48", "4.53", "4.54"], "refs": [["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 4], ["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview", 4], ["Structured Outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", 3], ["Anthropic — Use examples (few-shot prompting)", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting", 3], ["Prompt Templates and Variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables", 2], ["Claude Code code review", "https://code.claude.com/docs/en/code-review", 1], ["Be clear and direct", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/be-clear-and-direct", 1], ["Anthropic API — Increase output consistency", "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", 1]]}, {"id": "d4-retry", "dom": "d4", "title": "Validation and retry loops", "one": "A retry helps only if the model learns what was wrong and the answer exists.", "concept": "<p>Validate extracted output in code, and when it fails, retry with feedback. The retry prompt should include the original document, the failed output and the <em>specific<\/em> validation error: which field, what was expected, what was found. \"Try again\" or resending the same request gives the model nothing new and tends to reproduce the same answer.<\/p>\n<p>Know when a retry cannot help. If the information is simply not in the source, no amount of feedback will produce it; the model will either keep returning null or, worse, invent a value to satisfy the validator. Distinguish format and consistency errors, which are fixable by retry, from missing information, which needs a nullable field, a different source or a human. Bound the loop and record what failed.<\/p>", "pat": ["Feed the exact validation error back with the prior output.", "Target the retry at the failing fields, not the whole extraction.", "Cap attempts, then route to human review.", "Classify the failure first: fixable format error or absent information."], "anti": ["Blind retries with the identical prompt.", "Generic feedback such as \"the output was invalid\".", "Retrying to obtain data that the document does not contain.", "Tightening the validator until the model fabricates a passing value.", "Unbounded retry loops."], "q": ["2.59", "3.49", "3.57", "4.52", "4.55"], "refs": [["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 1], ["Anthropic API — Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 1], ["Anthropic — Structured outputs", "https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs", 1], ["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview", 1], ["Anthropic API documentation", "https://docs.anthropic.com/", 1], ["Anthropic — Prompt engineering", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview", 1]]}, {"id": "d4-batch", "dom": "d4", "title": "Batch processing and large-volume extraction", "one": "Batch is half price and asynchronous. Use it only where waiting is acceptable.", "concept": "<p>The Message Batches API processes requests asynchronously at 50% of standard prices. Most batches finish within an hour, but the only guarantee is 24 hours, after which unprocessed requests expire. A batch can hold up to 100,000 requests or 256 MB. Results arrive in any order, so each request carries a unique <code>custom_id<\/code> that you use to match results to inputs; make it meaningful, such as a document ID. Each result is <code>succeeded<\/code>, <code>errored<\/code>, <code>canceled<\/code> or <code>expired<\/code>, and you resubmit only the ones that did not succeed. Results are kept for 29 days.<\/p>\n<p>Because of the 24-hour window, batch suits overnight audits and backfills and does not suit anything a user is waiting on or a pipeline step that blocks a merge. Plan deadlines backwards: a 36-hour deadline leaves room for one batch plus a resubmission of failures, not two full cycles. Test the prompt on a small sample through the normal API first; a flaw found after 9,000 requests costs a day.<\/p>", "pat": ["Use batch for latency-tolerant bulk work; the synchronous API for interactive or blocking work.", "Set <code>custom_id<\/code> to a stable identifier from your data.", "Resubmit only errored and expired requests, by <code>custom_id<\/code>.", "Schedule so a failure-resubmit cycle still fits before the deadline.", "Pilot the prompt on a sample before submitting the full batch.", "Extract per document, then reconcile across documents in a separate pass."], "anti": ["Routing every workflow to batch for the discount. (CP 3)", "Submitting a large batch without testing the prompt on a sample. (CP 16)", "Relying on result order instead of <code>custom_id<\/code>.", "Resubmitting the entire batch because a few requests failed.", "Planning around \"usually an hour\" when the guarantee is 24 hours."], "q": ["1.31", "1.38", "1.41", "2.24", "2.37", "3.29", "3.39", "4.59"], "refs": [["Message Batches API", "https://platform.claude.com/docs/en/build-with-claude/batch-processing", 3], ["Anthropic API — Message Batches", "https://platform.claude.com/docs/en/build-with-claude/message-batches", 2], ["Messages API reference", "https://platform.claude.com/docs/en/api/messages", 1], ["Message Batches API reference", "https://platform.claude.com/docs/en/api/creating-message-batches", 1], ["Anthropic API — Create a Message Batch", "https://platform.claude.com/docs/en/api/beta/messages/batches/create", 1], ["Anthropic — Message Batches API", "https://docs.anthropic.com/en/docs/build-with-claude/message-batches", 1], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices", 1], ["Claude Code subagents", "https://code.claude.com/docs/en/sub-agents", 1]]}, {"id": "d4-review", "dom": "d4", "title": "Independent review and evaluating prompt changes", "one": "A reviewer that shares the author's context shares its blind spots.", "concept": "<p>A model reviewing its own output in the same conversation tends to agree with itself: it has the same reasoning in context and the same assumptions. An independent review uses a fresh instance that sees the artefact and the criteria, not the author's chain of thought. This is the evaluator half of the evaluator-optimizer pattern, and it is why multi-pass review (per-file passes, then a cross-file pass) finds more than one long pass.<\/p>\n<p>Prompt changes need the same discipline as code changes. Define success criteria, build a test set of real cases with known answers, including the ones that failed, and run the revised prompt against it before re-enabling it. Measure false positives and false negatives separately. When a noisy check has cost developer trust, narrow or disable the noisy category while it is repaired, and bring it back only once it passes evaluation. For decision logic such as refund eligibility, write the test cases first and iterate against them.<\/p>", "pat": ["Review with a separate instance that lacks the generator's reasoning.", "Build an evaluation set from real, labelled cases before changing a prompt.", "Track precision and recall separately per category.", "Disable or scope down a noisy check during repair to protect trust.", "Design verifiers to give calibrated signals you can route on."], "anti": ["Self-review in the same session as the proof of correctness.", "Shipping a \"fixed\" prompt after trying it on two examples.", "Leaving a high false-positive check running while you tune it.", "Judging a prompt change by one aggregate number.", "Giving the reviewer the author's explanation along with the work."], "q": ["2.42", "3.19", "3.20", "4.57", "4.58"], "refs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices", 2], ["Anthropic — Prompting Claude Sonnet 5", "https://platform.claude.com/docs/en/about-claude/models/overview", 1], ["Anthropic — Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 1], ["Claude Code — Common workflows", "https://code.claude.com/docs/en/common-workflows", 1]]}, {"id": "d5-escalate", "dom": "d5", "title": "Escalation and handling ambiguity", "one": "Escalate on explicit triggers, and ask when the target is ambiguous.", "concept": "<p>An agent should resolve what it can and hand off what it should not. Reliable escalation rests on explicit, observable triggers: the customer asks for a human; the request falls outside a documented policy; the agent cannot make progress after a bounded attempt. A customer who says \"I want to speak to a person\" gets one, promptly, without the agent first trying to solve the problem. Proxies such as detected frustration or the model's own stated confidence are poor triggers: an angry customer may have a simple issue, and a calm one may have a case nobody but a human can decide.<\/p>\n<p>Ambiguity is a separate case. When a lookup returns several matching accounts, or a command could apply to more than one ticket or file, the agent should ask a clarifying question before acting, above all before a change that is hard to undo. When a handoff does happen, it must be self-contained: who the customer is, what was found, what was tried, and what decision is needed.<\/p>", "pat": ["Honour an explicit request for a human immediately.", "Define escalation criteria as rules with examples of both escalate and resolve.", "Ask a clarifying question when several records or targets match.", "Acknowledge frustration and keep solving if the issue is within policy.", "Hand off with a complete, structured summary."], "anti": ["Routing escalation on self-reported confidence scores. (CP 2)", "Using sentiment analysis as the escalation trigger. (CP 8)", "Picking one of several matching records by heuristic. (CP 17)", "Trying to resolve first when the user has asked for a person.", "One-sided examples that teach the agent to escalate everything."], "q": ["1.32", "1.57", "2.21", "3.6", "3.54", "3.56", "4.29"], "refs": [["Building Effective Agents", "https://www.anthropic.com/research/building-effective-agents", 3], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 1], ["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 1], ["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview", 1], ["Claude Code — GitHub Actions", "https://code.claude.com/docs/en/github-actions", 1], ["Claude Code — Best practices", "https://docs.anthropic.com/en/docs/claude-code/best-practices", 1], ["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows", 1]]}, {"id": "d5-errors", "dom": "d5", "title": "Error propagation: failure is not an empty result", "one": "\"Nothing found\" and \"could not look\" must never look the same.", "concept": "<p>In a multi-agent system an error crosses several boundaries before anyone acts on it. At each one there is a temptation to simplify. A search subagent whose backend timed out returns an empty list; the coordinator reads that as \"no evidence exists\"; the report states a negative finding that was never tested. The fix is structural: a failed access returns an error with its type, while a successful query with no matches returns an explicit, successful empty result.<\/p>\n<p>Recovery belongs at the lowest level that can do it. The subagent retries a transient timeout a bounded number of times. Only then does it report upward, with what failed, what it tried, and whatever partial results it has. The coordinator can then continue with other sources, retry later, or tell the user precisely what could not be checked. Suppressing the error, or halting everything, both discard information.<\/p>", "pat": ["Return typed errors for access failures and explicit success for empty results.", "Retry transient failures locally before reporting.", "Include failure type, attempts made and partial results in the report upward.", "State coverage gaps in the final output.", "Give the coordinator enough to choose between retry, alternative and proceed."], "anti": ["Returning empty results when a subagent or tool fails. (CP 5)", "Silently omitting topic areas that had no source coverage. (CP 13)", "Aborting the whole workflow on one failure. (CP 12)", "Making the coordinator spend turns re-issuing calls a subagent could have retried.", "A generic \"search unavailable\" with no detail about what was attempted."], "q": ["1.46", "1.51", "2.14", "2.18", "2.38", "3.52", "4.18"], "refs": [["Handling tool calls and errors", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", 3], ["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use", 2], ["Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents", 2], ["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", 2], ["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents", 1], ["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview", 1]]}, {"id": "d5-context", "dom": "d5", "title": "Preserving context across long work, compaction and handoffs", "one": "Decide what must survive, write it down in structured form, and keep the rest out.", "concept": "<p>Long tasks lose information in predictable places. <strong>Compaction<\/strong> summarises, and summaries drop exact values: file paths, line numbers, figures, dates. <strong>Handoffs<\/strong> between agents or sessions carry only what was written into them. <strong>Long inputs<\/strong> get uneven attention, with material in the middle most likely to be missed. And <strong>accumulation<\/strong> of verbose tool output pushes the important facts out of focus.<\/p>\n<p>The countermeasures are the same idea in different places. Persist findings that must stay exact in a structured artefact (a scratchpad file, a JSON record) that survives compaction and new sessions, and re-read it when needed. When compacting, say what to keep. Carry time context with every figure in a handoff. Keep bulky investigation in subagents and bring back conclusions. For long documents, put the question after the material and process sections separately. In recurring jobs, feed the previous run's findings in so the new run reports only what is new or still open.<\/p>", "pat": ["Write exact findings (file, line, value, date) to a persistent structured file.", "Compact with explicit keep-instructions; clear when starting unrelated work.", "Give every figure in a handoff its own date and source.", "Offload verbose investigation to subagents.", "Supply prior-run findings so nightly jobs do not repeat themselves.", "Give delegated agents the specific context they need in the prompt."], "anti": ["Relying on a conversation summary to preserve exact file-and-line detail.", "A larger context window as the answer to missed mid-document content. (CP 4)", "Handoffs with undated figures.", "Re-posting the same findings every run until people stop reading.", "Letting raw tool output accumulate in the main conversation."], "q": ["1.29", "1.50", "2.52", "2.60", "3.15", "4.9", "4.19", "4.22", "4.23", "4.25", "4.30"], "refs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices", 2], ["Prompt Templates and Variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables", 1], ["Claude Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions", 1], ["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference", 1], ["Anthropic API — Context windows", "https://platform.claude.com/docs/en/build-with-claude/context-windows", 1], ["Anthropic API — Long-context prompting tips", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/long-context-tips", 1], ["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks", 1], ["Claude Agent SDK — Hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks", 1]]}, {"id": "d5-prov", "dom": "d5", "title": "Provenance, dates and conflicting sources", "one": "Two numbers disagree only if they claim to measure the same thing at the same time.", "concept": "<p>Research agents collect figures from many sources and a synthesis step has to reconcile them. Many apparent contradictions are not contradictions. A statistic from 2023 and one from 2024 can both be right; one may be growth. Two surveys may use different definitions or populations. A synthesis agent that receives only a value and a source name cannot tell these apart and will either flag false conflicts or average them away.<\/p>\n<p>The fix is to carry provenance as structured data with every finding: the source, its publication date, the period the figure covers, and where useful the method. With dates attached, the synthesiser can order figures into a trend, recognise change over time, and reserve \"conflict\" for same-period, same-measure disagreements, which it should report with both sources instead of silently choosing one. Where no source covers a topic, the report should say so.<\/p>", "pat": ["Require publication date and covered period as structured fields on every finding.", "Order dated figures before analysing a trend.", "Report true conflicts with both values and both sources.", "State explicitly where coverage is missing."], "anti": ["Passing findings as value plus source name only.", "Treating every difference between figures as a contradiction.", "Resolving a conflict by picking the newer or the more common number without saying so.", "Silently omitting topics with no source coverage. (CP 13)"], "q": ["1.42", "2.2", "3.3", "4.24"], "refs": [["How we built our multi-agent research system", "https://www.anthropic.com/engineering/built-multi-agent-research-system", 1], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 1], ["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview", 1], ["Prompt templates and variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables", 1], ["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents", 1], ["Anthropic — Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents", 1]]}, {"id": "d5-conf", "dom": "d5", "title": "Confidence calibration and human review", "one": "Reduce human review only where measured accuracy, per segment, justifies it.", "concept": "<p>Human review is how you catch what automation gets wrong, so reducing it is a reliability decision. An overall accuracy figure hides the distribution: 97% in aggregate can be 99.9% on easy documents and 70% on one difficult type. Before removing review, measure accuracy by document type and by field, on a labelled sample, and keep review where the numbers are weak.<\/p>\n<p>Confidence is useful when it is specific and checked. Field-level confidence lets you route just the uncertain fields of a record to a person. But a model's stated confidence is only a signal once you have calibrated it: compare stated confidence with actual correctness on labelled data, and set thresholds from that. In pipelines, also check that the run really succeeded before trusting its output: for a headless Claude Code run with a JSON schema, confirm the result reports success and that the structured output is present.<\/p>", "pat": ["Validate accuracy per document type and per field before reducing review.", "Route review using field-level confidence, calibrated against labelled data.", "Keep ongoing stratified sampling after automation is expanded.", "In CI, require both a success status and the presence of structured output before acting on it."], "anti": ["Trusting an aggregate accuracy metric to cut human review. (CP 11)", "Using uncalibrated self-reported confidence as the routing rule. (CP 2)", "A single document-level confidence when errors are field-specific.", "Posting pipeline output without checking the run completed and the schema was satisfied."], "q": ["1.43", "2.47", "3.14", "4.20"], "refs": [["Define success criteria and build evaluations", "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", 3], ["Anthropic API — Define success criteria", "https://platform.claude.com/docs/en/test-and-evaluate/define-success", 2], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", 1]]}], "Q": [{"k": "1.6", "d": "d1", "title": "Passing Runtime Findings to a Subagent", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario A · Developer productivity agent (Agent SDK)", "inline": false, "stem": "<p>The main agent maps a legacy module's conventions over several turns, then spawns a code-generation subagent with the prompt \"Generate adapters following the conventions identified above.\" The subagent ignores them. Conventions vary per module. What should change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resume the subagent with the parent's session ID so it continues from the earlier investigation context.", "e": "Resuming continues a subagent's own earlier conversation, not the parent's. The investigation happened in the main conversation, and this is the subagent's first invocation, so there is no prior subagent history to continue. Resuming cannot give the subagent findings it never had."}, {"l": "B", "ok": true, "t": "Include the mapped conventions and file paths directly in the delegation prompt sent to the subagent.", "e": "A non-fork subagent starts with a fresh context and receives nothing from the parent except the delegation prompt. \"The conventions identified above\" points at content the subagent has never seen. Putting the actual conventions and file paths into the prompt is the only channel that delivers them."}, {"l": "C", "ok": false, "t": "Write the mapped conventions into the shared project <code>CLAUDE.md<\/code> so subagents load them at startup.", "e": "Subagents do load the project <code>CLAUDE.md<\/code>, so this mechanism is real. It fails here because the question states that conventions vary per module; one shared file would apply a single module's rules to every module. <code>CLAUDE.md<\/code> suits stable project-wide conventions, not findings discovered at runtime for one task."}, {"l": "D", "ok": false, "t": "Move the conventions into the subagent's <code>AgentDefinition<\/code> system prompt so they load on every invocation.", "e": "A system prompt is a sound place for rules that stay the same across tasks. Here the question states that conventions vary per module, so a fixed definition written ahead of time cannot carry findings discovered at runtime. The per-task findings must travel in the delegation prompt instead."}], "o": "<p>In the Claude Agent SDK, a subagent is a separate agent instance with its own context window. Unless the subagent is a fork, that window starts fresh, with no parent conversation in it. The subagent gets its own system prompt, its tool definitions, applicable <
