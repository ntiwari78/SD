e repairing and evaluating it offline.<\/p>", "docs": []}, {"k": "4.58", "d": "d4", "title": "Evaluating a Revised Prompt Before Re-enabling It", "scen": "<p>Findings with a particular <code>detected_pattern<\/code> value had a 70% dismissal rate. The team disabled that category and rewrote its prompt with explicit criteria. Every past finding is stored with its dismissal outcome.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the team confirm the revision works before re-enabling the category?<\/p>", "c": [{"l": "A", "ok": false, "t": "Re-enable the findings as low-severity suggestions and observe whether dismissals fall.", "e": "Lowering severity changes presentation, not the false-positive rate. Developers would still see the findings and have to triage the same potentially noisy output."}, {"l": "B", "ok": true, "t": "Replay the revised prompt on historical pull requests and measure precision using the recorded outcomes.", "e": "Historical findings and their dismissal outcomes provide a labeled evaluation set. Running the revised prompt against the relevant past pull requests allows the team to measure whether the new criteria actually improve precision without exposing developers to unproven findings."}, {"l": "C", "ok": false, "t": "Re-enable the category and track dismissal rates over several sprints.", "e": "Incorrect for this situation. Live monitoring can be useful, but it would expose developers to the category before the revision is proven. The team already has historical data that can support offline evaluation."}, {"l": "D", "ok": false, "t": "Ask the model to self-rate confidence and re-enable the category when average confidence passes a threshold.", "e": "Self-reported confidence is not a reliable substitute for measured precision. A model can be highly confident in false-positive findings."}], "o": "<p>The <code>detected_pattern<\/code> field turns findings into analyzable data. Combined with recorded developer dismissals, it helps the team identify which patterns produce false positives and evaluate whether changes improve them.<\/p>\n<p>The correct process is to treat the prompt revision like a change to production logic:<\/p>\n<ol><li>Select historical pull requests that exhibit the noisy pattern.<\/li><li>Run the revised prompt against them.<\/li><li>Compare the new findings with the recorded judgments.<\/li><li>Calculate precision and assess whether the revision meets the team's criteria.<\/li><li>Re-enable the category only after acceptable results are demonstrated.<\/li><\/ol>\n<p>Structured fields make results easier to analyze, but they do not guarantee that the findings are correct. Correctness must be measured against labeled outcomes.<\/p>\n<p><strong>Key takeaway:<\/strong> Use historical, labeled findings to evaluate a prompt revision offline before exposing developers to the category again.<\/p>", "docs": []}, {"k": "4.59", "d": "d4", "title": "Preparing a 9,000-File Audit for Batch Processing", "scen": "<p>A team plans a one-time audit of 9,000 source files using a single Message Batches API submission. The audit prompt is a new first draft.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the team maximize first-pass success and avoid paying for a large rerun?<\/p>", "c": [{"l": "A", "ok": false, "t": "Submit the full batch now, then use <code>custom_id<\/code> values to locate unsatisfactory results and resubmit only those files.", "e": "<code>custom_id<\/code> helps correlate requests and identify request-level failures. However, a weak prompt can produce successful API responses containing poor-quality findings. Those quality failures are not automatically identified as failed requests, so the team may need to rerun much of the 9,000-file audit."}, {"l": "B", "ok": false, "t": "Add few-shot examples for every issue category and immediately submit the full batch.", "e": "Few-shot examples can improve consistency, but adding them does not prove that the prompt works on the team's codebase. The revised prompt still needs to be tested before the expensive, large-scale run."}, {"l": "C", "ok": false, "t": "Split the files into smaller batches and revise the prompt after reviewing each batch.", "e": "Incorrect as the preferred approach. This provides feedback between batches, but batch processing has no latency guarantee and can take up to 24 hours. It also spends substantial resources on iterative testing that could be performed more quickly on a small synchronous sample."}, {"l": "D", "ok": true, "t": "Test synchronously on a representative sample, refine the prompt, then submit the full batch.", "e": "A small sample allows fast iteration. Including typical files and edge cases helps expose weaknesses before the prompt is applied across all 9,000 files."}], "o": "<p>Prompt development and large-scale execution should be treated as separate phases.<\/p>\n<p><strong>Phase 1: Validate the prompt<\/strong><\/p>\n<ul><li>Select a representative sample of files.<\/li><li>Include edge cases and different kinds of source files.<\/li><li>Run the prompt through the synchronous API.<\/li><li>Review the findings against clear acceptance criteria.<\/li><li>Revise and retest until results are acceptable.<\/li><\/ul>\n<p><strong>Phase 2: Run the full batch<\/strong><\/p>\n<ul><li>Freeze the validated prompt and request structure.<\/li><li>Submit all 9,000 files.<\/li><li>Use <code>custom_id<\/code> values to correlate each result with its source file.<\/li><li>Retry genuine request-level failures separately.<\/li><\/ul>\n<p>The distinction between request failures and quality failures is crucial. A request that errors can be identified and resubmitted. A request that successfully returns an incorrect or low-quality finding may look successful at the API level and require a broader rerun.<\/p>\n<p><strong>Key takeaway:<\/strong> Validate the prompt synchronously on a representative sample before scaling it to a large batch. Use <code>custom_id<\/code> for request tracking, not as a substitute for quality evaluation.<\/p>", "docs": []}, {"k": "4.60", "d": "d3", "title": "Requiring Explicit Invocation for a Side-Effecting Skill", "scen": "<p>A skill posts review findings as pull request comments. Claude sometimes invokes it automatically and posts draft findings too early. The team wants the skill to run only when a developer explicitly invokes its slash command.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which configuration achieves this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Set <code>user-invocable: false<\/code>.", "e": "This removes the skill from user-invocable slash commands and leaves it available for Claude to invoke. That is the opposite of the intended behavior."}, {"l": "B", "ok": false, "t": "Set <code>allowed-tools<\/code> to a read-only tool list.", "e": "<code>allowed-tools<\/code> controls which tools are pre-approved during the skill's execution. It does not determine whether Claude or a developer may initiate the skill."}, {"l": "C", "ok": false, "t": "Add a rule to the project <code>CLAUDE.md<\/code> saying the skill runs only on explicit developer requests.", "e": "A project instruction guides Claude's behavior but does not enforce an invocation boundary. Claude could still decide to invoke the skill when its description matches the task."}, {"l": "D", "ok": true, "t": "Set <code>disable-model-invocation: true<\/code>.", "e": "This setting makes the skill user-invocable only. Claude Code prevents the model from invoking it automatically, leaving the slash command as the explicit entry point."}], "o": "<p>Claude Code skill configuration distinguishes whether a skill is available to the user, the model, or both.<\/p>\n<ul><li><strong><code>disable-model-invocation: true<\/code>:<\/strong> Prevents Claude from automatically invoking the skill while retaining explicit user invocation.<\/li><li><strong><code>user-invocable: false<\/code>:<\/strong> Removes the skill from user-invocable slash commands.<\/li><li><strong><code>allowed-tools<\/code>:<\/strong> Specifies tools that are pre-approved during the skill's execution.<\/li><li><strong><code>CLAUDE.md<\/code> instructions:<\/strong> Guide behavior but do not provide the same enforced invocation restriction.<\/li><\/ul>\n<p>Because this skill creates external side effects by posting pull request comments, the team wants explicit human control over when it runs.<\/p>\n<p><strong>Key takeaway:<\/strong> Use <code>disable-model-invocation: true<\/code> when a skill must run only after an explicit developer command, especially for side-effecting workflows.<\/p>", "docs": []}], "CP": [["Few-shot examples to enforce tool ordering", "Programmatic prerequisite checks or hooks that block the downstream call", ["d1-enforce"]], ["Self-reported confidence scores for escalation routing", "Explicit rule-based triggers; confidence only after calibration", ["d5-escalate", "d5-conf"]], ["Routing all workflows to the Batch API for cost savings", "Batch only for latency-tolerant work", ["d4-batch"]], ["A larger context window to fix attention dilution", "Focused per-section passes plus a reconciliation pass", ["d2-builtin", "d5-context"]], ["Returning empty results when a subagent fails", "Typed error with what was tried and partial results", ["d5-errors", "d2-errors"]], ["Giving all agents access to all tools", "Per-role tool allowlists", ["d2-scope"]], ["Parsing natural language to decide loop termination", "Check stop_reason", ["d1-loop"]], ["Sentiment analysis for escalation routing", "Explicit requests and policy-based criteria", ["d5-escalate"]], ["Resuming a session without telling Claude which files changed", "Name the changed files and re-read them", ["d1-session"]], ["Giving synthesis agents web search tools", "Scope the synthesiser to the material it was given", ["d2-scope"]], ["Trusting aggregate accuracy to reduce human review", "Validate per document type and field", ["d5-conf"]], ["Ter
