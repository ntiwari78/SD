broadened queries until at least one match is returned.", "e": "A successful empty result is not a failure. Requiring every search to return at least one match can waste resources and encourage irrelevant results merely to satisfy the retry condition."}, {"l": "D", "ok": true, "t": "Return timeouts as errors carrying structured context (failure type, attempted query) so the coordinator can decide whether to retry.", "e": "A timeout means the search did not complete successfully. Returning an error with structured context, including the failure type and attempted query, lets the coordinator decide whether to retry, change the query, or document a research coverage gap."}], "o": "<p>The essential distinction is between a <strong>failed operation<\/strong> and a <strong>successful operation that found nothing<\/strong>.<\/p>\n<ul><li>A timeout means the answer is unknown because the search did not complete. Recovery may involve retrying, changing the query, or using another source.<\/li><li>An empty result set means the search completed and found no matches. This is a legitimate research result that should be preserved.<\/li><\/ul>\n<p>Conflating these outcomes causes two opposite problems: the system may retry searches that already succeeded, or it may silently accept a failed search as though it had established that no evidence exists.<\/p>\n<p>Tool results should therefore communicate outcomes honestly. Execution failures should be marked as errors and include actionable details; valid empty results should remain successful responses. This allows the coordinator to make informed recovery decisions and report coverage limitations accurately.<\/p>", "docs": [["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Handling tool calls and errors", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"]]}, {"k": "2.15", "d": "d1", "title": "Repairing Missing Values Through Iterative Extraction", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JavaScript Object Notation (JSON) schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>The coordinator delegates section-level extraction to subagents and an assembly agent produces the final JSON. Outputs are always schema-valid, yet nullable fields are frequently null even though the source document contains those values. Which orchestration change fixes this?<\/p>", "c": [{"l": "A", "ok": true, "t": "Have the coordinator detect null fields in the assembled output, re-delegate targeted extraction for them, and re-assemble until coverage is sufficient.", "e": "The coordinator should evaluate the assembled output against explicit completeness criteria, identify null fields, and delegate targeted follow-up extraction for those fields. The assembly agent can then produce a revised output. This iterative refinement process directly addresses missing values rather than simply recording them."}, {"l": "B", "ok": false, "t": "Append a completeness score and a list of missing fields to each output so downstream consumers know which values were not captured.", "e": "A completeness score and missing-field list improve observability but do not repair the output. Downstream consumers still receive incomplete data and may not have access to the original document or extraction agents."}, {"l": "C", "ok": false, "t": "Run every extraction subagent twice on each document and merge the two result sets, keeping whichever pass returned a non-null value for each output field.", "e": "Running every subagent twice doubles the work even when the first pass was complete. The second pass is not targeted at known gaps, and there is no guarantee that it will recover the missing values."}, {"l": "D", "ok": false, "t": "Change the schema to mark the frequently null fields as required so the extraction subagents are forced to populate them on the first pass.", "e": "Making a field required does not make its value easier to find in the source document. If the model cannot locate a value, a restrictive schema may encourage fabrication instead of allowing an honest null."}], "o": "<p>This question tests the <strong>iterative refinement loop<\/strong>, also known as the evaluator-optimizer pattern.<\/p>\n<p>The first extraction pass is not necessarily sufficient. Even when the resulting JSON satisfies the schema, some fields may be incomplete. Schema validation checks structural properties such as types and required keys; it does not guarantee that every recoverable fact in the source has been extracted.<\/p>\n<p>A robust orchestration process should:<\/p>\n<ol><li>Assemble the initial extraction results.<\/li><li>Evaluate the assembled output against explicit completeness criteria.<\/li><li>Identify nullable fields that are null even though their values may be present in the source.<\/li><li>Delegate focused follow-up extraction for the missing fields.<\/li><li>Reassemble the output and evaluate it again until the required coverage threshold is met.<\/li><\/ol>\n<p>This is more efficient than blindly repeating all extraction work because the coordinator directs additional effort toward the known gaps.<\/p>\n<p>The distinction between <strong>structural validity<\/strong> and <strong>extraction completeness<\/strong> is critical. A schema-valid output can still be factually incomplete. Tightening the schema to force values may turn visible omissions into plausible but incorrect data, whereas targeted refinement attempts to recover the actual source information.<\/p>", "docs": [["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["Claude Code: Subagents", "https://code.claude.com/docs/en/sub-agents"], ["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]]}, {"k": "2.16", "d": "d4", "title": "Preventing Fabricated CVE Identifiers with Structured Outputs", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline's finding schema declares <code>cve_id<\/code> as a required string on every security finding. When a flagged vulnerability has no published CVE, Claude emits realistic-looking identifiers such as <code>CVE-2023-48213<\/code>. Which change prevents these fabricated values?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run a retry with the fabricated value and a validation error so Claude can correct the identifier.", "e": "Retry with error feedback is useful for correctable formatting or structural mistakes. It cannot recover a CVE identifier that does not exist. Because the unchanged schema still requires a string, Claude may fabricate another identifier on the next attempt."}, {"l": "B", "ok": false, "t": "Add a system prompt rule stating that CVE identifiers must never be invented under any circumstances.", "e": "A prompt instruction against fabrication conflicts with the schema's requirement to provide a string for every finding. The instruction may reduce the frequency of fabricated values, but it cannot remove the structural pressure to provide one."}, {"l": "C", "ok": false, "t": "Validate each <code>cve_id<\/code> against the public CVE registry after extraction and discard entries that fail.", "e": "Registry validation treats the symptom rather than the cause. It may catch fabricated identifiers that do not exist, but a fabricated identifier could coincide with a real CVE associated with an unrelated vulnerability, allowing an incorrect association to pass."}, {"l": "D", "ok": true, "t": "Declare <code>cve_id<\/code> with type <code>[\"string\", \"null\"]<\/code> so findings without a published CVE can report <code>null<\/code>.", "e": "Allowing the field to contain either a string or <code>null<\/code> gives Claude a schema-valid way to represent the absence of a published CVE. The model can return a real identifier when available and <code>null<\/code> when no identifier exists."}], "o": "<p>Structured Outputs and strict tool schemas help guarantee that generated data follows the required structure. However, a restrictive schema can create a problem when the source information is genuinely absent.<\/p>\n<p>If <code>cve_id<\/code> must always be a string, Claude has no valid way to express that a vulnerability has no published CVE. The model may therefore produce a plausible-looking identifier simply to satisfy the schema.<\/p>\n<p>The fix is to represent missing information explicitly. For example:<\/p>\n<pre><code class=\"lang-json\">{\n  \"cve_id\": {\n    \"type\": [\"string\", \"null\"]\n  }\n}<\/code><\/pre>\n<p>This is a simplified illustration of the field definition; it would be incorporated into the complete schema.<\/p>\n<p>A field can remain required in the output object while permitting <code>null<\/code> as its value. Alternatively, it can be made optional by omitting it from the schema's required-field list. Required and nullable are separate design decisions.<\/p>\n<p>The core principle is that <strong>the schema must allow the truth to be represented<\/strong>. Prompt instructions, retries, and post-validation cannot fully compensate for a schema that requires a value even when the underlying fact may not exist.<\/p>", "docs": [["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Increase output consistency", "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency"]]}, {"k": "2.17", "d": "d3", "title": "Surfacing Unanticipated Requirements Before Implementation", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You are about to implement the agent's billing-dispute workflow. On past features, specifications written up front kept missing failure modes nobody anticipated, such as chargebacks and partial refunds. Which technique best surfaces these considerations before implementation starts?<\/p>", "c": [{"l": "A", "ok": false, "t": "Use plan mode so Claude explores the existing codebase read-only and hands you an implementation plan to approve before any code is written.", "e": "Plan mode is useful for safely exploring a codebase and reviewing an implementation approach. However, the plan is based on the prompt and what Claude can discover in the code. It does not systematically elicit business requirements that have not yet been identified or expressed."}, {"l": "B", "ok": false, "t": "Write a more exhaustive upfront specification yourself, enumerating every billing edge case your team can identify.", "e": "A longer specification is still limited by what the team already knows to consider. Since previous specifications have repeatedly missed unexpected failure modes, making the same process more exhaustive does not introduce a new mechanism for discovering unknown requirements."}, {"l": "C", "ok": true, "t": "Ask Claude to interview you about edge cases, concerns, and tradeoffs, capturing the decisions in a specification before coding.", "e": "The interview pattern has Claude ask targeted questions about implementation choices, edge cases, concerns, and tradeoffs. The developer's answers are captured in a written specification before implementation begins, helping surface requirements that might otherwise be overlooked."}, {"l": "D", "ok": false, "t": "Provide two or three concrete input and output examples demonstrating how representative disputes should be resolved.", "e": "Input/output examples are helpful when a known transformation is difficult to describe consistently in prose. They demonstrate expected behavior for scenarios already understood, but they do not systematically uncover edge cases that nobody has thought to include."}], "o": "<p>The interview pattern reverses the usual prompting approach. Rather than asking the developer to enumerate every requirement, Claude actively questions the developer about the feature.<\/p>\n<p>A useful workflow is to:<\/p>\n<ol><li>Start with a concise description of the feature.<\/li><li>Ask Claude to interview you about technical implementation, user experience, edge cases, risks, concerns, and tradeoffs.<\/li><li>Push the interview beyond obvious questions to explore difficult or unusual cases.<\/li><li>Consolidate the answers into a written specification, such as <code>SPEC.md<\/code>.<\/li><li>Start a fresh session for implementation when appropriate, so the coding work can focus on the completed specification.<\/li><\/ol>\n<p>For billing disputes, this could surface questions about partial refunds, chargebacks, cancellations, conflicting order records, or situations requiring human review.<\/p>\n<p>The distinction is that plan mode primarily helps determine <strong>how to implement a known requirement<\/strong>, while the interview pattern helps discover <strong>which requirements and failure modes need to be addressed in the first place<\/strong>.<\/p>", "docs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference"]]}, {"k": "2.18", "d": "d5", "title": "Distinguishing Tool Failures from Valid Empty Results", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline's log-fetch tool returns the same generic <code>\"logs unavailable\"<\/code> message both when a request times out and when a job genuinely produced no logs. As a result, Claude retries valid empty results and sometimes skips review sections after real failures. How should the tool's error handling be redesigned?<\/p>", "c": [{"l": "A", "ok": true, "t": "Return distinct structured responses that state the failure type, the request attempted, and whether a retry is worthwhile.", "e": "A timeout and a successful query with no logs are semantically different outcomes. Structured error information should identify the failure type, what was attempted, and whether retrying is appropriate. This lets Claude retry transient failures while accepting legitimate empty results."}, {"l": "B", "ok": false, "t": "Return empty log content marked as a successful result so the review proceeds without retry behavior firing.", "e": "Marking a failed request as a successful empty result silently suppresses the error. The review may incorrectly conclude that no logs exist when the real problem is that the tool could not retrieve them."}, {"l": "C", "ok": false, "t": "Instruct Claude in the system prompt to retry any unavailable-logs message at most once before continuing the review.", "e": "Limiting retries may reduce wasted attempts, but it does not fix the underlying ambiguity. Claude still cannot determine whether the empty response is valid or whether a real access failure needs to be reported."}, {"l": "D", "ok": false, "t": "Fail the entire pipeline run whenever the tool reports logs unavailable so incomplete reviews are never posted.", "e": "Aborting the entire pipeline because of one tool failure discards work that could otherwise be completed. A more resilient design preserves available results and annotates the affected review sections when data could not be retrieved."}], "o": "<p>The fundamental problem is that one generic status conflates two different outcomes.<\/p>\n<ul><li><strong>Timeout:<\/strong> The request did not complete successfully. The logs may exist, and retrying might work.<\/li><li><strong>Valid empty result:<\/strong> The request completed successfully, but the job produced no logs. There is nothing to retry.<\/li><\/ul>\n<p>When both outcomes are represented as <code>\"logs unavailable\"<\/code>, the model has no reliable basis for deciding whether to retry, proceed, or report a coverage gap.<\/p>\n<p>A better tool response distinguishes these situations and includes recovery-relevant context. Tool failures should be returned as errors, using the appropriate error mechanism, with an informative description of what went wrong and what to try next.<\/p>\n<p>This also supports graceful degradation. If a log-fetch request genuinely fails, the pipeline can continue reviewing other available evidence while clearly identifying the missing coverage rather than silently treating it as an empty result.<\/p>", "docs": [["Claude tool use: Handle tool calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"], ["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "2.19", "d": "d3", "title": "Creating a Personal Variant of a Shared Claude Code Skill", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools and targets 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>The repository ships a team skill at <code>.claude/skills/summarize-ticket/<\/code> that the whole team uses on escalation cases. You want a personal variant with different formatting, keeping the shared <code>/summarize-ticket<\/code> unchanged and still invocable for you. Where does your variant belong?<\/p>", "c": [{"l": "A", "ok": false, "t": "In <code>~/.claude/skills/summarize-ticket/SKILL.md<\/code>, reusing the shared skill's directory name.", "e": "The personal location is correct, but reusing the same skill name creates a collision. Personal skills take precedence over project skills with the same name, so the personal variant would shadow the team's <code>/summarize-ticket<\/code> on your machine."}, {"l": "B", "ok": false, "t": "In <code>.claude/skills/<\/code> under a new directory, with the frontmatter <code>name<\/code> field changed to rename it.", "e": "Project-level skills are stored in the repository and can be shared with teammates through version control. In addition, the slash command name for personal and project skills is derived from the directory name; changing the frontmatter <code>name<\/code> field alone does not rename the command."}, {"l": "C", "ok": true, "t": "In <code>~/.claude/skills/<\/code> under a new directory name, such as <code>summarize-ticket-alt/SKILL.md<\/code>.", "e": "Personal skills belong under <code>~/.claude/skills/<\/code>. Creating the variant in a new directory, such as <code>~/.claude/skills/summarize-ticket-alt/SKILL.md<\/code>, keeps it personal and gives it a distinct command name. The shared team skill remains available as <code>/summarize-ticket<\/code>."}, {"l": "D", "ok": false, "t": "In <code>.claude/skills/summarize-ticket/SKILL.md<\/code>, edited directly but left uncommitted in your working tree.", "e": "Editing the checked-in team skill changes the local copy of a shared artifact, even if the changes are not committed. This risks accidental commits, creates divergence from future team updates, and prevents you from cleanly retaining both versions."}], "o": "<p>Claude Code supports different skill locations for personal and project-specific workflows:<\/p>\n<ul><li><strong>Personal skills:<\/strong> <code>~/.claude/skills/<\/code>. These apply across the user's projects and are not shared through the repository.<\/li><li><strong>Project skills:<\/strong> <code>.claude/skills/<\/code>. These can be committed to version control and shared with teammates.<\/li><\/ul>\n<p>A personal variant should live in the personal skills directory and use a different directory name. This preserves the team workflow and allows both commands to coexist.<\/p>\n<p>For example:<\/p>\n<pre><code class=\"lang-text\">Repository:\n.claude/skills/summarize-ticket/SKILL.md\n\nPersonal:\n~/.claude/skills/summarize-ticket-alt/SKILL.md<\/code><\/pre>\n<p>The project skill remains <code>/summarize-ticket<\/code>, while the personal version can be invoked as <code>/summarize-ticket-alt<\/code>.<\/p>\n<p>The important details are that skill location determines sharing scope and the directory name determines the slash command. A personal skill with the same name can shadow the project skill, so using a distinct name is essential.<\/p>", "docs": [["Claude Code skills", "https://code.claude.com/docs/en/skills"], ["Claude Code memory and configuration", "https://code.claude.com/docs/en/memory"]]}, {"k": "2.20", "d": "d1", "title": "Returning Tool Results to Claude During Extraction", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>The extraction pipeline defines a <code>lookup_reference<\/code> tool that Claude calls mid-extraction to resolve entity codes found in a document. Claude returns <code>stop_reason<\/code> <code>\"tool_use\"<\/code> and the application executes the lookup. How should the result be delivered so Claude can continue?<\/p>", "c": [{"l": "A", "ok": false, "t": "Append a user message that opens with a text block explaining the lookup outcome, followed by the <code>tool_result<\/code> block carrying the matching <code>tool_use_id<\/code>.", "e": "The <code>tool_result<\/code> and matching <code>tool_use_id<\/code> are necessary, but the block placement is wrong. Within a user message, tool-result blocks must precede any text blocks. Putting the explanatory text first violates the required ordering."}, {"l": "B", "ok": true, "t": "Append the assistant message containing the <code>tool_use<\/code> block, then a user message with a <code>tool_result<\/code> block carrying the matching <code>tool_use_id<\/code>, and call the API again.", "e": "The application must preserve the assistant's message containing the original <code>tool_use<\/code> block, append a user message containing the corresponding <code>tool_result<\/code> block, and call the API again with the updated conversation history. The <code>tool_use_id<\/code> must match the ID of the original tool call."}, {"l": "C", "ok": false, "t": "Send the output back as a plain text block in the next user message so Claude reads the lookup result as ordinary conversational input rather than a <code>tool_result<\/code>.", "e": "Plain text does not resolve the pending tool call. The API expects the tool call to be answered by a matching <code>tool_result<\/code>; sending only conversational text can result in an error because the expected tool result is missing."}, {"l": "D", "ok": false, "t": "Attach the output to the <code>lookup_reference<\/code> tool definition so the model re-reads the updated definition and result on its next inference pass.", "e": "Tool definitions describe a tool's name, purpose, and input schema. They are not a channel for returning runtime execution results. The result must be provided in the conversation history."}], "o": "<p>Claude does not execute client-defined tools itself. Instead, the interaction follows a tool-use loop:<\/p>\n<ol><li>Claude returns a message containing a <code>tool_use<\/code> block and stops with <code>stop_reason: \"tool_use\"<\/code>.<\/li><li>The application executes the requested operation.<\/li><li>The application appends the assistant message containing the tool call to the conversation history.<\/li><li>The application adds a user message containing a <code>tool_result<\/code> block with the matching <code>tool_use_id<\/code>.<\/li><li>The application sends the updated message history to Claude in another API request.<\/li><li>Claude incorporates the result and continues its reasoning or requests another tool.<\/li><\/ol>\n<p>The conversation history is the mechanism through which tool output becomes available to the model. Tool definitions remain static declarations; runtime results belong in <code>tool_result<\/code> blocks.<\/p>\n<p>The key rule is to match each tool result to its original call and follow the required message and content-block ordering. This allows the model to continue the extraction workflow using the information returned by the application.<\/p>", "docs": [["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Claude tool use: Handle tool calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"], ["Build a tool-using agent", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "2.21", "d": "d5", "title": "Resolving Ambiguous Customer Accounts Before Billing Changes", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>Many customers share a phone number on family plans. When the agent looks up an account by phone, <code>get_customer<\/code> often returns several accounts. The agent picks one and sometimes applies billing credits to the wrong household member. What should you change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Modify <code>get_customer<\/code> to rank the candidate accounts and return only the single highest-scoring one so the agent never sees ambiguous results.", "e": "Hiding ambiguity inside the tool does not eliminate it. A ranking algorithm can still select the wrong household member, and returning only one result removes the signal that the agent needs to know clarification is necessary."}, {"l": "B", "ok": false, "t": "Have the agent apply the credit to the account flagged as the primary plan holder and ask the customer to confirm once the credit posts.", "e": "A primary-plan-holder flag is a heuristic, not identity verification. Asking for confirmation after the credit posts is too late because the financial action has already occurred."}, {"l": "C", "ok": true, "t": "Instruct the agent to request a distinguishing identifier (email, account number, or a recent order) before applying any account-specific change.", "e": "Ask the customer for a distinguishing identifier, such as an email address, account number, or recent order, before making account-specific changes. This resolves the ambiguity using information that identifies the intended account rather than relying on a probabilistic guess."}, {"l": "D", "ok": false, "t": "Route every phone lookup that returns multiple accounts to <code>escalate_to_human<\/code> so a person settles the identity question.", "e": "Multiple matches are a routine disambiguation problem, not automatically a reason for human escalation. The agent can often resolve the issue with one clarifying question, preserving first-contact resolution and human capacity for cases that genuinely need escalation."}], "o": "<p>When a shared identifier such as a phone number returns multiple accounts, the system faces an identity ambiguity problem. The reliable solution is to obtain additional identifying information from the customer before taking action.<\/p>\n<p>The key distinction is <strong>heuristics estimate; identifiers verify<\/strong>. Selecting the primary plan holder or the highest-scoring match might work most of the time, but a probabilistic choice is not sufficient for financial operations.<\/p>\n<p>The correct order of operations is:<\/p>\n<ol><li>Look up the account using the available information.<\/li><li>Detect when multiple accounts match.<\/li><li>Ask the customer for a distinguishing identifier.<\/li><li>Verify the intended account.<\/li><li>Only then apply a billing credit or make another account-specific change.<\/li><\/ol>\n<p>This prevents wrong-account actions without unnecessarily escalating routine cases to a human.<\/p>", "docs": [["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview"]]}, {"k": "2.22", "d": "d1", "title": "Passing Security Findings Between Subagents", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>In a pull-request review pipeline, a security-review subagent completes its analysis, and its findings must reach a fix-suggestion subagent. How should the findings be moved between the two subagents?<\/p>", "c": [{"l": "A", "ok": false, "t": "Merge the two subagents into one combined agent that reviews and proposes fixes within a single context, removing the handoff.", "e": "Combining the agents removes the handoff but also discards useful specialization, separate system prompts, tool restrictions, and context isolation. These boundaries can help keep verbose security-scan output out of the fix-suggestion stage."}, {"l": "B", "ok": true, "t": "Have the coordinator collect the findings and include the relevant ones in the fix-suggestion subagent's delegation prompt.", "e": "The coordinator should collect the security findings and explicitly include the relevant findings in the next subagent's delegation prompt. This makes the handoff observable and lets the coordinator control exactly which information is passed forward."}, {"l": "C", "ok": false, "t": "Spawn both subagents in parallel in a single coordinator turn so the fix-suggestion work does not wait on the security review.", "e": "Parallel execution is appropriate for independent tasks. Here, the fix-suggestion subagent depends on the security findings, which do not exist until the security-review subagent finishes. The dependent tasks must therefore be sequenced."}, {"l": "D", "ok": false, "t": "Have the fix-suggestion subagent repeat the security analysis itself so no findings ever need to be transferred between agents.", "e": "Repeating the security analysis duplicates work, increases cost and latency, and blurs the distinction between the agents' responsibilities."}], "o": "<p>This is a hub-and-spoke multi-agent architecture. Subagents operate in isolated contexts and return their results to the parent or coordinator. They do not automatically share their internal conversation histories with one another.<\/p>\n<p>The coordinator therefore acts as the information-routing layer:<\/p>\n<ol><li>Invoke the security-review subagent.<\/li><li>Collect and inspect its findings.<\/li><li>Select the findings relevant to remediation.<\/li><li>Include those findings explicitly in the fix-suggestion subagent's prompt.<\/li><li>Collect the proposed fixes and continue the pipeline.<\/li><\/ol>\n<p>This architecture improves observability, enables consistent error handling, and gives the coordinator control over the information provided to each specialist.<\/p>", "docs": [["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code: Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "2.23", "d": "d1", "title": "Dynamically Selecting Only the Necessary Subagents", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>Simple lookup requests currently traverse all four subagents in order, multiplying latency and cost even when only a web search is needed. How should the coordinator be designed so each request invokes only the subagents it requires?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep the fixed four-stage flow but move simple requests to subagents on a faster model tier so full traversal completes more quickly.", "e": "A faster model may shorten each stage, but the system still executes unnecessary stages. The underlying problem is which subagents run, not merely how quickly they run."}, {"l": "B", "ok": false, "t": "Mention every subagent by name in the coordinator's delegation prompts so each stage is explicitly forced rather than left to automatic matching.", "e": "Explicitly naming subagents forces their invocation rather than allowing the coordinator to select only the relevant specialists. This preserves the full-pipeline behavior the design is supposed to eliminate."}, {"l": "C", "ok": false, "t": "Implement a keyword-matching classifier in application code that preselects the required subagents before the coordinator receives the request.", "e": "A keyword classifier creates a hard-coded routing layer that must anticipate different phrasings and combinations of requests. It can be brittle and duplicates some of the reasoning the coordinator is designed to perform."}, {"l": "D", "ok": true, "t": "Write distinct, specific descriptions for each subagent and prompt the coordinator to select and invoke only those whose descriptions match the request.", "e": "Give each subagent a clear, differentiated description and instruct the coordinator to invoke only the specialists needed for the request. Description-driven routing allows a simple lookup to use the web-search subagent without automatically running document analysis, synthesis, and report generation."}], "o": "<p>The Claude Agent SDK supports description-driven subagent selection. The descriptions help Claude determine which specialist is appropriate for a given task, while the coordinator's instructions establish the selection policy.<\/p>\n<p>For example, descriptions might distinguish:<\/p>\n<ul><li>A web-search specialist that retrieves current information and sources.<\/li><li>A document-analysis specialist that examines supplied files.<\/li><li>A synthesis specialist that reconciles findings across sources.<\/li><li>A report-generation specialist that creates a polished deliverable.<\/li><\/ul>\n<p>A simple factual lookup may need only the first specialist. A comprehensive, cited research report may require several or all of them.<\/p>\n<p>Because each subagent invocation has its own context and API cost, selectively invoking agents avoids repeated setup, unnecessary token consumption, and additional latency.<\/p>", "docs": [["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "2.24", "d": "d4", "title": "Retrying Failed Requests in a Message Batch", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>A nightly extraction batch completes with errored results. Most are <code>invalid_request_error<\/code> failures caused by documents that exceeded the context limit, and a few are server errors. How should the team construct the retry submission?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resubmit the entire original batch, since errored requests were not billed and reprocessing the successful requests adds no extra cost.", "e": "Although errored, canceled, and expired requests are not billed, successfully processed requests were charged. Resubmitting the entire batch would incur additional cost for requests that already succeeded."}, {"l": "B", "ok": true, "t": "Chunk the oversized documents, give each chunk a unique <code>custom_id<\/code>, and resubmit the chunks plus the server-error requests as a new batch.", "e": "Oversized documents must be chunked to address the context-limit failure. Each chunk needs its own unique <code>custom_id<\/code>, and the requests that failed with server errors can generally be retried unchanged. Only the failed subset needs to be resubmitted."}, {"l": "C", "ok": false, "t": "Split each oversized document into chunks that all reuse the original <code>custom_id<\/code> so results still correlate to one source document.", "e": "<code>custom_id<\/code> values must be unique within a Message Batch. Reusing the same identifier for multiple chunks violates this requirement and makes individual results harder to correlate reliably."}, {"l": "D", "ok": false, "t": "Resubmit every errored request unchanged in a new batch, since <code>invalid_request_error<\/code> failures are usually transient and resolve on retry.", "e": "Server errors can often be retried unchanged, but an <code>invalid_request_error<\/code> indicates that the request itself needs to be corrected. An oversized document will continue to exceed the context limit unless it is chunked or otherwise reduced."}], "o": "<p>The Message Batches API processes requests independently, so one failed request does not invalidate the successful requests in the same batch.<\/p>\n<p>The correct recovery process is selective:<\/p>\n<ol><li>Inspect each result and identify the error type.<\/li><li>Leave successful requests alone; they have already been processed and billed.<\/li><li>Correct invalid requests before retrying them. In this scenario, split oversized documents into manageable chunks.<\/li><li>Retry server-error requests as appropriate.<\/li><li>Assign a unique <code>custom_id<\/code> to every request, including each chunk.<\/li><li>Use those identifiers to correlate the new results with their original documents and chunks.<\/li><\/ol>\n<p>Batch result lines may arrive in an order different from the original submission, so <code>custom_id<\/code> is essential for reliable correlation. A useful naming convention can include both the source document identifier and a chunk index, such as <code>doc42_chunk01<\/code> and <code>doc42_chunk02<\/code>.<\/p>\n<p>The key distinction is that <strong>transient server failures and invalid requests require different recovery strategies<\/strong>. Selective retries save time and cost while ensuring that the original problem is actually corrected.<\/p>", "docs": [["Message Batches API: Batch processing", "https://platform.claude.com/docs/en/build-with-claude/batch-processing"], ["Message Batches API reference", "https://platform.claude.com/docs/en/api/creating-message-batches"]]}, {"k": "2.25", "d": "d1", "title": "Providing the Actual Data to a Reconciliation Subagent", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>A coordinator delegates reconciliation to a subagent with the prompt:<\/p>\n<blockquote><p>“Reconcile the extracted invoice fields against the source document.”<\/p><\/blockquote>\n<p>The output contains values matching neither the extractions nor the document. What change should you make?<\/p>", "c": [{"l": "A", "ok": false, "t": "Instruct the subagent to read the extractions from the coordinator's conversation history before performing the reconciliation.", "e": "Subagents do not automatically have access to the coordinator's conversation history. Instructing the subagent to consult that history does not make the missing data available."}, {"l": "B", "ok": true, "t": "Embed the complete extracted field values and the relevant source document content directly in the delegation prompt.", "e": "Include the actual extracted invoice fields and the relevant source-document content in the delegation prompt. The subagent can then compare the real values and evidence instead of attempting to reconcile information it has never received."}, {"l": "C", "ok": false, "t": "Move the reconciliation subagent to a model tier with a larger context window so both inputs fit during processing.", "e": "A larger context window does not help when the required data was never included in the subagent's context. Context capacity and context availability are different problems."}, {"l": "D", "ok": false, "t": "Enforce a strict JSON output schema on the reconciliation subagent so its returned field values stay tied to real data.", "e": "A strict JSON schema controls the structure and types of the output, not whether its values are grounded in the source. A schema-valid response can still contain fabricated values if the subagent lacks the necessary evidence."}], "o": "<p>Subagents in the Claude Agent SDK operate with context isolation. Each subagent starts with its own context, containing its instructions and the prompt provided by the coordinator. The parent's conversation history is not automatically inherited.<\/p>\n<p>The original delegation merely refers to “the extracted invoice fields” and “the source document.” These phrases identify the information the subagent needs, but they do not actually provide it.<\/p>\n<p>A reliable delegation must explicitly transfer the evidence:<\/p>\n<ol><li>Include the complete extracted field values, preferably in a structured representation.<\/li><li>Include the relevant source-document content.<\/li><li>State which fields should be reconciled and what counts as a discrepancy.<\/li><li>Ask the subagent to return corrected or reconciled values with supporting evidence.<\/li><\/ol>\n<p>The alternatives fail for different reasons. The coordinator's history is not available just because the subagent is told to look for it. A larger context window cannot recover absent inputs. And schema validation ensures output shape rather than factual grounding.<\/p>\n<p>The core principle is that <strong>context must be passed explicitly across agent boundaries<\/strong>. A well-designed subagent can reason effectively only over the information actually supplied to it.<\/p>", "docs": [["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]]}, {"k": "2.26", "d": "d1", "title": "Ensuring Every Customer Concern Is Delegated", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You add a coordinator that delegates support subtasks to specialized subagents. A customer reports a duplicate charge, a missing loyalty discount, and unwanted auto-renewal. Logs show the coordinator spawned two subtasks, both addressing the duplicate charge; all subagents succeeded, yet the reply ignores the other issues. Which change most effectively fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Restructure the synthesis input so findings for each concern appear at the start of the aggregated context with explicit section headings.", "e": "Position-aware input can help when relevant findings are buried in the middle of a long context. But that is not the failure here: no subagent investigated the loyalty discount or auto-renewal, so there are no findings for the synthesis stage to recover or reorder."}, {"l": "B", "ok": false, "t": "Pass the coordinator's full conversation history into each subagent's prompt so workers can see all of the customer's stated concerns.", "e": "Context isolation is real, but richer context passing does not automatically cause a subagent to investigate concerns that were never assigned to it. The coordinator must first create appropriate subtasks."}, {"l": "C", "ok": false, "t": "Rewrite overlapping tool descriptions so discount and cancellation subtasks are routed to subagents capable of handling them.", "e": "Improving tool descriptions helps when existing subtasks are routed to the wrong tools or specialists. In this scenario, the missing subtasks were never created, so better routing cannot restore the missing coverage."}, {"l": "D", "ok": true, "t": "Revise the coordinator's decomposition instructions so it enumerates every stated concern and delegates one bounded subtask per concern.", "e": "Instruct the coordinator to enumerate every concern in the customer's request and create one clearly bounded subtask for each. This directly addresses the incomplete decomposition that caused the missing issues."}], "o": "<p>In a hub-and-spoke, or orchestrator-workers, architecture, the coordinator is responsible for decomposing the user's request, delegating subtasks, and synthesizing the results.<\/p>\n<p>The coordinator's decomposition determines the maximum coverage the system can achieve. If a concern never becomes a subtask, downstream agents cannot investigate it, and synthesis cannot report findings that were never collected.<\/p>\n<p>A better workflow is:<\/p>\n<ol><li>Identify every distinct issue in the customer's message.<\/li><li>Create a separate, clearly scoped subtask for each issue.<\/li><li>Assign each subtask to the appropriate specialist.<\/li><li>Verify that every concern has a corresponding result.<\/li><li>Synthesize the results into a response that addresses all the issues.<\/li><\/ol>\n<p>For this case, the coordinator should create separate subtasks for the duplicate charge, missing loyalty discount, and unwanted auto-renewal.<\/p>\n<p>The key diagnostic principle is to distinguish a <strong>decomposition failure<\/strong> from an <strong>execution failure<\/strong>. Because the existing subagents succeeded at their assigned tasks, the problem is upstream: the coordinator did not delegate the full scope of the customer's request.<\/p>", "docs": [["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system"], ["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"]]}, {"k": "2.27", "d": "d1", "title": "Choosing a Fixed Pipeline for a Recurring Quality Audit", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>The team adds a weekly quality audit: every resolved refund case is checked against the same four criteria—identity verification, policy compliance, amount limits, and tone—then results are combined into a summary. Which decomposition approach fits?<\/p>", "c": [{"l": "A", "ok": false, "t": "Use dynamic adaptive decomposition, letting the agent decide at runtime which checks each case needs based on what earlier steps reveal.", "e": "Adaptive decomposition is useful when the scope is uncertain and the next step depends on what earlier steps uncover. Here, all four criteria are known in advance and apply to every case, so dynamic planning adds unnecessary variability and overhead."}, {"l": "B", "ok": false, "t": "Send all cases and criteria in a single comprehensive request so the model can judge every case with the full audit context in view.", "e": "Processing many cases against several criteria in one large request can dilute attention. Some cases may receive detailed treatment while others receive shallow or inconsistent judgments. Focused sequential checks make the process easier to inspect."}, {"l": "C", "ok": true, "t": "Use prompt chaining: run each case through the four checks in sequence, then a final pass that aggregates findings into the summary.", "e": "Prompt chaining creates a fixed sequence of focused steps, followed by a dedicated aggregation pass. Every case receives the same checks, and intermediate results remain available for review."}, {"l": "D", "ok": false, "t": "Have a coordinator spawn a subagent per case that iterates until it finds no remaining issues, then merge the subagent reports.", "e": "Iterative refinement is useful when a task requires discovering and repairing quality gaps. This audit has a fixed completion condition: all four checks must run. An open-ended loop adds cost and makes the stopping condition unnecessarily ambiguous."}], "o": "<p>Prompt chaining breaks a task into sequential model calls, each with a specific responsibility. The output of one step becomes the input to the next.<\/p>\n<p>For a recurring refund audit, the workflow can be:<\/p>\n<ol><li>Check identity verification.<\/li><li>Check compliance with refund policy.<\/li><li>Check refund amount limits.<\/li><li>Check tone.<\/li><li>Aggregate the results into a final quality summary.<\/li><\/ol>\n<p>This approach offers consistent coverage, inspectable intermediate results, and a predictable stopping condition. It also makes individual stages easier to test and improve.<\/p>\n<p>The selection rule is to match the workflow to its uncertainty profile. When the steps are fixed and known in advance, a predefined pipeline is preferable to dynamic planning. Dynamic decomposition is more appropriate when findings from one stage determine what must happen next.<\/p>", "docs": [["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["Claude prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "2.28", "d": "d1", "title": "Removing Misleading Prompt Language That Causes Excessive Escalation", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>The agent calls <code>escalate_to_human<\/code> on almost every billing question, even routine ones. The tool descriptions are clear and well-bounded, but the system prompt states: “billing matters are sensitive, so handle escalation with care.” What should you change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add a hook that blocks <code>escalate_to_human<\/code> calls whenever the current conversation concerns a billing topic.", "e": "A blanket block would prevent legitimate escalations, including cases where a customer explicitly requests a human or where the case genuinely falls outside policy. Hooks should enforce hard rules, not compensate for misleading prompt language."}, {"l": "B", "ok": false, "t": "Append a system prompt instruction that routine billing questions must be resolved directly and never escalated at first contact.", "e": "Adding a counter-instruction leaves the original association between billing and escalation in place. The prompt now contains conflicting signals, which can produce inconsistent behavior."}, {"l": "C", "ok": true, "t": "Revise the system prompt so the wording no longer pairs billing with escalation, letting the tool descriptions govern selection.", "e": "The problematic association originates in the system prompt. Remove or rewrite the sentence so billing is not implicitly linked to escalation, and let the clear tool descriptions guide the agent's choice."}, {"l": "D", "ok": false, "t": "Expand the <code>escalate_to_human<\/code> description with billing-specific boundary language so it outweighs the system prompt phrasing.", "e": "The tool descriptions are already clear. Expanding them attempts to make one instruction outweigh another rather than fixing the source of the misleading signal."}], "o": "<p>Tool selection is influenced by the entire context, including system prompts and tool descriptions. Even well-written tool descriptions can be undermined by system-level wording that creates an unintended association.<\/p>\n<p>In this case, repeatedly pairing “billing” with “escalation” can bias the model toward calling <code>escalate_to_human<\/code> whenever billing is mentioned—even when the customer has a routine question that the agent can resolve.<\/p>\n<p>The better approach is to correct the source of the problem. For example, the system prompt can explain that billing requests follow the normal resolution workflow and that escalation should occur only when the established criteria are met.<\/p>\n<p>The alternatives address symptoms rather than the cause. A blanket hook blocks legitimate escalations, a contradictory prompt instruction leaves competing signals in place, and a longer tool description creates a tug-of-war between instructions.<\/p>\n<p>The core lesson is to <strong>debug the instruction that produces the unwanted behavior before adding more rules or constraints<\/strong>.<\/p>", "docs": [["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Define tools for Claude", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"], ["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "2.29", "d": "d1", "title": "Passing Investigation Findings to a Resolution Subagent", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>The coordinator completes a multi-turn investigation of a billing dispute, then spawns a resolution subagent that re-fetches customer data and misstates the disputed amounts. How should the coordinator hand its findings to the subagent?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the resolution subagent re-run <code>get_customer<\/code> and <code>lookup_order<\/code> at the start of its task to rebuild the case state from source systems.", "e": "Re-fetching backend records may recover raw data, but it cannot reproduce all of the coordinator's investigation conclusions, customer-stated expectations, or decisions already made. It also duplicates tool calls and increases latency."}, {"l": "B", "ok": false, "t": "Write the investigation findings into the project <code>CLAUDE.md<\/code> so the subagent picks them up as part of its startup context.", "e": "<code>CLAUDE.md<\/code> is intended for persistent project instructions and shared context, not temporary transactional details for individual customer disputes. Writing case-specific information into it would pollute shared configuration with transient data."}, {"l": "C", "ok": true, "t": "Compile a structured summary of the findings—customer ID, disputed amounts, and decisions made—and include it in the delegation prompt.", "e": "A structured summary explicitly transfers the relevant findings to the resolution subagent. Including identifiers, disputed amounts, and prior decisions provides a reliable foundation for the next stage."}, {"l": "D", "ok": false, "t": "Rely on the subagent automatically inheriting the coordinator's conversation history, since the Task tool spawns it within the same session.", "e": "Subagents do not automatically inherit the coordinator's conversation history or previous tool results. The necessary findings must be explicitly passed to the new agent."}], "o": "<p>A subagent operates with its own isolated context. This separation allows specialized instructions and prevents verbose intermediate work from automatically consuming the coordinator's context, but it also means that important information must be transferred explicitly.<\/p>\n<p>A reliable handoff should contain the minimum sufficient information needed to continue the investigation. For a billing dispute, this might include:<\/p>\n<ul><li>Customer and order identifiers.<\/li><li>The disputed amounts and currency.<\/li><li>The relevant transaction details.<\/li><li>Findings from the investigation.<\/li><li>Decisions already made.<\/li><li>Remaining uncertainties and required next actions.<\/li><\/ul>\n<p>This structured summary reduces redundant backend calls and helps prevent the resolution agent from confusing amounts or repeating work.<\/p>\n<p>The central principle is that <strong>nothing should be assumed to transfer between isolated agents unless it is explicitly included in the handoff or otherwise made available through a documented mechanism<\/strong>.<\/p>", "docs": [["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code: Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "2.30", "d": "d1", "title": "Choosing a Fixed Prompt Chain for a Weekly Market Brief", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The team adds a weekly market-brief workflow: retrieve the same five sources, summarize each, and assemble a fixed-format report. The steps never vary across runs. Which decomposition approach fits this workflow?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run an autonomous agent loop that decides its own steps each week, stopping when it judges the brief complete.", "e": "Autonomous agents are useful for open-ended problems where the number or sequence of steps cannot be predicted. This workflow has a fixed sequence, so autonomous planning adds cost and the possibility of unnecessary variation."}, {"l": "B", "ok": true, "t": "Implement a fixed prompt chain where each step consumes the prior step's output, with programmatic gates between steps.", "e": "A fixed prompt chain matches the predictable workflow. Each step has a defined responsibility, consumes the previous step's output, and can be checked by programmatic gates before the process continues."}, {"l": "C", "ok": false, "t": "Handle the whole brief in a single comprehensive request so all summarization decisions share one context.", "e": "One large request forces the model to manage retrieval results, multiple summaries, and final report assembly simultaneously. Decomposition makes each stage simpler and easier to validate."}, {"l": "D", "ok": false, "t": "Have the coordinator generate the subtask list dynamically at runtime based on what the initial retrieval reveals.", "e": "Dynamic subtask generation is useful when the necessary work depends on findings that cannot be anticipated in advance. Here, the sources, steps, and output format remain the same every week, so dynamic planning adds unnecessary overhead."}], "o": "<p>The key is to choose a workflow structure that matches the uncertainty of the task.<\/p>\n<p>Anthropic distinguishes between predefined workflows, in which model calls follow known control paths, and autonomous agents, which dynamically direct their own processes. The recommended approach is to use the simplest structure that adequately meets the task's needs.<\/p>\n<p>A weekly market brief has a predictable structure:<\/p>\n<ol><li>Retrieve the five designated sources.<\/li><li>Summarize each source.<\/li><li>Combine and reconcile the summaries.<\/li><li>Assemble the fixed-format report.<\/li><li>Validate the final output.<\/li><\/ol>\n<p>A fixed prompt chain makes these steps explicit and repeatable. Programmatic gates can check intermediate outputs—for example, whether all five sources were retrieved and whether each summary contains the required fields—before the pipeline advances.<\/p>\n<p>By contrast, dynamic planning and autonomous loops are better suited to open-ended research, where intermediate discoveries genuinely determine what to investigate next.<\/p>", "docs": [["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system"], ["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview"]]}, {"k": "2.31", "d": "d1", "title": "Normalizing Results from Multiple MCP Servers", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>An Agent SDK application pulls data from three Model Context Protocol (MCP) servers that return Unix timestamps, ISO 8601 dates, and numeric status codes respectively, and its agent frequently misinterprets these mixed formats when correlating findings. What is the most reliable fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Register a <code>PreToolUse<\/code> hook that blocks each outgoing data-retrieval call whenever the target server does not return canonical formats.", "e": "<code>PreToolUse<\/code> hooks run before a tool executes. They can enforce policies by allowing or blocking calls, but they cannot transform a result that has not yet been returned. Blocking heterogeneous retrievals prevents access to data rather than normalizing it."}, {"l": "B", "ok": false, "t": "Document each server's timestamp and status-code conventions in the system prompt so the model translates the values.", "e": "System prompt instructions are probabilistic guidance. Even with detailed documentation, the model can still misinterpret mixed formats, especially in long contexts. This approach also adds recurring prompt overhead without guaranteeing consistency."}, {"l": "C", "ok": true, "t": "Register an Agent SDK <code>PostToolUse<\/code> hook that transforms each tool result into one canonical format before the model processes it.", "e": "A <code>PostToolUse<\/code> hook intercepts the result after the tool executes and can normalize it before the model processes it. This creates a centralized, deterministic transformation that works even with third-party MCP servers whose implementations you cannot change."}, {"l": "D", "ok": false, "t": "Expose a <code>convert_formats<\/code> MCP tool and instruct the agent to invoke it after each data-retrieval call it makes.", "e": "The agent must remember to call the conversion tool after every retrieval. This makes normalization dependent on model compliance and introduces additional tool-call cycles, increasing latency and token costs."}], "o": "<p>Different MCP servers can return semantically equivalent information in different formats. For example, one may return a Unix epoch integer, another an ISO 8601 timestamp, and another a numeric status code. When these values appear together, the model must infer which convention applies to each one.<\/p>\n<p>The most reliable approach is to move normalization out of the model's reasoning and into deterministic code.<\/p>\n<p>A <code>PostToolUse<\/code> hook can convert timestamps to ISO 8601 and map numeric status codes to labeled values before the result reaches the model. This provides one consistent representation across servers without requiring changes to each server's implementation.<\/p>\n<p>The alternatives operate at the wrong point in the lifecycle or rely on the model to remember to perform a required transformation.<\/p>\n<p><strong>Key principle:<\/strong> Use hooks for behavior that must happen consistently on every applicable tool result; use prompts for flexible guidance that does not require deterministic enforcement.<\/p>", "docs": [["Claude Agent SDK hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"], ["Claude Code MCP integration", "https://code.claude.com/docs/en/mcp"]]}, {"k": "2.32", "d": "d3", "title": "Loading Testing Conventions Only for Test Files", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The CI test-generation job writes tests that ignore team testing conventions. Test files sit beside the code they test across dozens of directories. How should the conventions be configured so they load only when test files are involved?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add the testing conventions to the root <code>CLAUDE.md<\/code> so every session, including CI runs, loads them unconditionally.", "e": "Root <code>CLAUDE.md<\/code> instructions load broadly rather than only when test files are involved. This consumes context and competes for attention during unrelated tasks."}, {"l": "B", "ok": false, "t": "Add a <code>CLAUDE.md<\/code> file to every directory that contains test files, duplicating the testing conventions in each one.", "e": "Directory-level instructions would require duplicated copies across dozens of directories. This creates maintenance overhead and risks inconsistent conventions when one copy is updated but others are not."}, {"l": "C", "ok": true, "t": "Create a rule file in <code>.claude/rules/<\/code> with <code>paths<\/code> frontmatter listing globs like <code>**/*.test.ts<\/code> and <code>**/*.test.tsx<\/code>.", "e": "Path-specific rules can use glob patterns in YAML frontmatter to apply automatically to matching files. Patterns such as <code>**/*.test.ts<\/code> and <code>**/*.test.tsx<\/code> match test files across the repository regardless of their directory."}, {"l": "D", "ok": false, "t": "Package the conventions as a skill in <code>.claude/skills/<\/code> so the pipeline invokes it explicitly before generating tests.", "e": "Skills are on-demand workflows. If correctness depends on someone remembering to invoke a skill, an unattended CI job may skip the conventions. File-specific conventions should activate automatically when matching files are involved."}], "o": "<p>Claude Code supports modular rules in <code>.claude/rules/<\/code>. A rule file can specify a <code>paths<\/code> field in its YAML frontmatter, allowing it to apply only when Claude works with files matching specified glob patterns.<\/p>\n<p>For example, a testing-conventions rule can target TypeScript test files across the repository rather than being tied to a single directory.<\/p>\n<p>This approach has several advantages:<\/p>\n<ul><li><strong>Conditional loading:<\/strong> Testing rules become relevant when matching files are involved.<\/li><li><strong>Maintainability:<\/strong> One rule file governs test files across many directories.<\/li><li><strong>Consistency:<\/strong> A single update applies to all matching files.<\/li><li><strong>Reduced context overhead:<\/strong> Unrelated tasks do not need to load test-specific conventions.<\/li><\/ul>\n<p>The important distinction is between persistent, broadly applicable project instructions and path-scoped rules that activate according to the files being handled.<\/p>", "docs": [["Claude Code memory and rules", "https://code.claude.com/docs/en/memory"], ["Claude Code settings", "https://code.claude.com/docs/en/settings"]]}, {"k": "2.33", "d": "d3", "title": "Handling Intermittent Parsing-Service Timeouts", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JavaScript Object Notation (JSON) schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>An extraction subagent intermittently times out when calling the document parsing service, while most retried calls succeed. Which TWO error-handling behaviors should this subagent implement? <em>(Select TWO.)<\/em><\/p>", "c": [{"l": "A", "ok": false, "t": "Forward every timeout to the coordinator immediately so retry decisions are managed in one central place.", "e": "Forwarding every transient failure to the coordinator creates unnecessary coordination turns and costs. Since most retries succeed, the subagent should handle routine recovery locally."}, {"l": "B", "ok": false, "t": "Return an empty extraction result marked as successful so the overall workflow continues uninterrupted.", "e": "Marking a failed extraction as successful silently hides the problem. The coordinator may interpret missing data as a legitimate empty result and produce an incomplete or misleading final output."}, {"l": "C", "ok": true, "t": "When local retries are exhausted, return the failure type, what was attempted, and any partial extractions.", "e": "If local recovery fails, the subagent should return structured failure context, including the failure type, attempted operation, and partial extraction results. This allows the coordinator to decide whether to retry differently, use partial data, or report a coverage gap."}, {"l": "D", "ok": true, "t": "Retry timed-out parsing calls locally with backoff before surfacing anything to the coordinator.", "e": "Timeouts are often transient. Retrying locally with backoff resolves many failures without involving the coordinator and prevents temporary service interruptions from disrupting the broader workflow."}], "o": "<p>Multi-agent error handling follows a layered principle: <strong>recover locally first, propagate only what cannot be resolved<\/strong>.<\/p>\n<p>Because a subagent has its own context and intermediate tool activity, it can perform retries internally without requiring the coordinator to manage every attempt. This is particularly useful when most timeouts resolve after a retry.<\/p>\n<p>However, local recovery must be bounded. If the parsing service remains unavailable, the subagent should report the failure honestly rather than retry indefinitely or pretend the extraction succeeded.<\/p>\n<p>A useful recovery sequence is:<\/p>\n<ol><li>Attempt the parsing operation.<\/li><li>If a transient timeout occurs, retry locally with backoff.<\/li><li>If recovery succeeds, return the extracted information normally.<\/li><li>If local retries are exhausted, report the failure type and attempted operation.<\/li><li>Include any partial extraction results so the coordinator can make an informed next decision.<\/li><\/ol>\n<p>This preserves efficiency while ensuring failures remain visible.<\/p>", "docs": [["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude tool use: Handle tool calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"]]}, {"k": "2.34", "d": "d2", "title": "Extracting Long Contracts with Consistent Accuracy", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>A single extraction pass over 60-page contract bundles produces detailed results for early sections but sparse or missing fields for later ones, and identical clause types are classified inconsistently across sections. How should the extraction be restructured?<\/p>", "c": [{"l": "A", "ok": false, "t": "Switch to a model with a larger context window so all sections receive adequate attention within a single pass.", "e": "A larger context window addresses capacity, not necessarily the quality of analysis. The entire contract bundle may already fit within the available context, while the model still gives uneven attention to different sections."}, {"l": "B", "ok": false, "t": "Run the single-pass extraction three times and keep only field values that agree across at least two of the runs.", "e": "Majority voting across repeated single-pass extractions does not reliably correct a systematic weakness. If later sections are consistently under-analyzed, repeated runs may reproduce the same omissions."}, {"l": "C", "ok": true, "t": "Extract each section in its own focused pass, then run a separate pass to reconcile cross-section references and totals.", "e": "Extracting each section separately gives the model a focused task and helps maintain consistent depth. A dedicated reconciliation pass can then handle information that spans multiple sections, including cross-references, totals, and classification consistency."}, {"l": "D", "ok": false, "t": "Mark every field required in the JSON schema so shallow extractions fail validation and trigger automatic retries.", "e": "JSON schemas enforce output structure, not extraction accuracy. Making every field required can pressure the model to invent values when it has not adequately extracted the relevant information. Repeating the same overloaded process does not address the root cause."}], "o": "<p>The observed symptoms are characteristic of single-pass analysis over long, complex documents. Early sections may receive detailed attention while later sections receive less, and the same clause type may be classified inconsistently across the document.<\/p>\n<p>This illustrates the distinction between <strong>context capacity and analysis quality<\/strong>. A document can fit in the context window without receiving uniformly thorough analysis.<\/p>\n<p>A more reliable architecture uses two stages:<\/p>\n<p><strong>Stage 1: Focused section-level extraction<\/strong><\/p>\n<ul><li>Divide the contract into sections.<\/li><li>Extract the relevant fields from each section independently.<\/li><li>Use consistent instructions and schemas.<\/li><li>Preserve section identifiers and supporting evidence.<\/li><\/ul>\n<p><strong>Stage 2: Cross-section reconciliation<\/strong><\/p>\n<ul><li>Check references between sections.<\/li><li>Reconcile totals and related values.<\/li><li>Compare classifications of equivalent clauses.<\/li><li>Identify unresolved inconsistencies.<\/li><\/ul>\n<p>This is a form of prompt chaining: each stage has a bounded responsibility, and a separate integration stage handles relationships that cannot be evaluated reliably in isolation.<\/p>\n<p>The approach improves traceability and makes it easier to identify which section produced a missing or inconsistent value.<\/p>", "docs": [["Chain complex prompts for stronger performance", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-prompts"], ["Long-context prompting tips", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/long-context-tips"]]}, {"k": "2.35", "d": "d4", "title": "Reading Schema-Validated Output from Claude Code", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>A nightly extraction job runs <code>claude -p<\/code> with <code>--output-format json<\/code> and <code>--json-schema<\/code> over incoming documents. The pipeline's parser reads the top-level <code>result<\/code> field and intermittently fails to obtain schema-conformant JSON. What change fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Switch to <code>--output-format stream-json<\/code> so each extraction arrives as its own parseable JSON line.", "e": "<code>stream-json<\/code> changes the delivery format to newline-delimited JSON events. It does not relocate the schema-validated payload. The pipeline must still read <code>structured_output<\/code> from the appropriate result envelope."}, {"l": "B", "ok": true, "t": "Read the validated extraction payload from the <code>structured_output<\/code> field of the JSON envelope.", "e": "When <code>--json-schema<\/code> is supplied, the validated extraction payload is placed in <code>structured_output<\/code>, not <code>result<\/code>. The <code>result<\/code> field contains the model's text answer, which is not necessarily the schema-conformant payload."}, {"l": "C", "ok": false, "t": "Add a prompt instruction directing Claude to emit the schema-conformant JSON inside the <code>result<\/code> field.", "e": "Prompt instructions cannot change the CLI's output-envelope structure. The location of the validated data is determined by Claude Code, not by instructions asking the model to place it in a particular field."}, {"l
