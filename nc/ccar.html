t_customer<\/code> tool result now and append the <code>lookup_order<\/code> result in a later user message after the next response.", "e": "Every <code>tool_use<\/code> block must have a matching <code>tool_result<\/code> in the user message that immediately follows the assistant message. Leaving <code>lookup_order<\/code> unmatched in that message causes the API to reject the request with a 400 error."}, {"l": "C", "ok": false, "t": "Replace the missing <code>lookup_order<\/code> result with a plain text block in the user message that describes the timeout to the agent.", "e": "A text block does not satisfy the requirement that each <code>tool_use<\/code> block has a <code>tool_result<\/code> with a matching <code>tool_use_id<\/code>. The request fails validation even though the text explains the failure in natural language."}, {"l": "D", "ok": false, "t": "Keep retrying <code>lookup_order<\/code> with exponential backoff and send both tool result blocks together once the backend recovers.", "e": "Retrying transient failures is sound practice in general, but the scenario states a retry already failed and the agent must decide its next step now. Waiting for the backend to recover blocks the conversation indefinitely and keeps the model from reasoning about the failure."}], "o": "<p>Claude can emit several <code>tool_use<\/code> blocks in a single assistant turn. Your loop may run those calls concurrently or one at a time. Either way, the API has a strict contract: the next user message must contain exactly one <code>tool_result<\/code> for each <code>tool_use<\/code>, matched by <code>tool_use_id<\/code>. If any call has no result, the request fails with a 400 error.<\/p>\n<p>The successful <code>get_customer<\/code> call should return its actual result. The failed <code>lookup_order<\/code> call should still return a corresponding tool result, marked with <code>is_error: true<\/code> and containing useful timeout details. That allows Claude to decide whether to escalate or proceed with the available customer information.<\/p>\n<p>Deferring the failed result breaks the immediate tool-result contract. Replacing it with ordinary text does not satisfy the required tool-result structure. Continuing to retry indefinitely prevents the model from responding to the failure that has already occurred.<\/p>", "docs": [["Tool Use Overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Handling Tool Calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "1.27", "d": "d2", "title": "Distinguishing a Valid Empty Result from a Backend Timeout", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p><code>lookup_order<\/code> returns a success with an empty list both for customers with no orders and for backend timeouts. During an outage, the agent told customers they had no orders. Your design makes the agent, not the tool, decide retries and escalation. What is the correct fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Update the <code>lookup_order<\/code> description to say an empty list may indicate an outage, so the agent warns the customer.", "e": "This leaves the ambiguity in place and asks the agent to guess. The agent still cannot tell an outage from a real zero-match result, so it would hedge on every empty answer. The tool response itself must carry the distinction."}, {"l": "B", "ok": true, "t": "Mark timeouts as <code>isError: true<\/code> with a transient category; return zero-match searches as a success with an empty list.", "e": "The two outcomes mean different things and need different agent behavior. A timeout is an access failure, so it should carry <code>isError: true<\/code> and transient metadata the agent can act on. A zero-match search is a successful query, so an empty successful result is the honest answer the agent can relay."}, {"l": "C", "ok": false, "t": "Retry timeouts inside the tool with backoff, and return <code>isError: true<\/code> with a transient category after retries run out.", "e": "Local retry for transient failures is a real, documented design, and the error it finally returns is well formed. It loses here because the scenario states the agent, not the tool, owns retry and escalation decisions. Hiding the first failures inside the tool takes that decision away from the agent and delays escalation during an outage."}, {"l": "D", "ok": false, "t": "Set <code>isError: true<\/code> for both outcomes, with distinct messages so the agent can tell a timeout from a zero-match search.", "e": "This mislabels a valid empty result as a failure. A query that correctly finds no orders succeeded, and marking it as an error invites the agent to retry or apologize for a result that is accurate. The <code>isError<\/code> flag should be set only when tool execution actually failed."}], "o": "<p>This question tests a core reliability distinction: an access failure is not the same as a valid empty result. A timeout means the tool never got an answer; the right agent behavior is to retry or escalate. A zero-match search got a real answer: the customer has no orders. Collapsing both into one response shape forces the agent to misinform customers during outages or to distrust correct empty results.<\/p>\n<p>The MCP and tool-result pattern makes this distinction explicit. A tool execution failure should return <code>is_error: true<\/code> with instructive content, such as a transient error category and a retry hint. Anthropic's guidance recommends errors that say what went wrong and what to try next, for example a rate-limit message with a retry delay. A successful query with no matches should return a normal result; empty tool results are not automatically errors. The error flag belongs only on actual execution failures.<\/p>\n<p>Retrying with backoff inside the tool is recommended practice for transient failures in many designs. The scenario rules it out here: the agent owns retry and escalation decisions, so the tool must report the failure immediately with structured metadata. Silent in-tool retries would delay escalation and hide the outage from the component that decides what to do about it.<\/p>\n<p>Marking both outcomes as errors fails in the other direction because it tells the agent a correct answer is a failure. Description text alone cannot fix this, since the agent still receives two identical responses with opposite meanings.<\/p>", "docs": [["Tool Use Overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Handling Tool Calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "1.28", "d": "d1", "title": "Refreshing Changed Files Automatically When Resuming a Session", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>Engineers resume a named session daily to refine the agent's MCP tool code. A few files change overnight, and teammates forget to mention them, so Claude relies on stale results. What adds the recent changes to context automatically on every resume?<\/p>", "c": [{"l": "A", "ok": false, "t": "Start a fresh session each morning, seeded with a structured summary of the previous session's conclusions.", "e": "Starting fresh with a summary is the right move when most prior tool results are stale. Here, only a few files change overnight, so most of the session's context is still valid. This approach also requires a manual summary each day, while the question asks for an automatic step on every resume."}, {"l": "B", "ok": false, "t": "Add a <code>PostToolUse<\/code> hook that appends each file's last-modified timestamp to every tool result.", "e": "A <code>PostToolUse<\/code> hook fires only after Claude calls a tool in the new session. The stale results from the prior session are already in context before any new tool call runs. Timestamps on future results do not correct reasoning based on the old ones."}, {"l": "C", "ok": true, "t": "Add a <code>SessionStart<\/code> hook that detects resumes and writes the list of files changed since the last session into context.", "e": "<code>SessionStart<\/code> is the lifecycle hook that fires when a session starts or resumes. Its output can be added to context, so it can report recent file changes on every resume. This makes the update automatic instead of depending on engineers remembering to mention changes."}, {"l": "D", "ok": false, "t": "Add a <code>CLAUDE.md<\/code> instruction telling Claude to reread all previously analyzed files at the start of each session.", "e": "This forces full re-exploration instead of targeted re-analysis of the few files that changed. It also relies on an instruction Claude may not follow consistently, while a hook runs as code every time."}], "o": "<p>A resumed session restores the conversation: the prompts, tool calls, tool results, and responses from before. It does not restore or re-check the filesystem. If files changed since the last session, the old tool results sit in context as if they were still true. Claude has no built-in way to notice the drift.<\/p>\n<p>The <code>SessionStart<\/code> hook exists for exactly this gap. It runs when a session starts or resumes, and its output is added to context. A hook that reports the files changed since the last session gives Claude a precise, current list to reread. Claude then refreshes only those files and keeps the rest of its prior analysis. Because the hook is code, it fires on every resume; nobody has to remember to mention the changes.<\/p>\n<p>Starting a fresh session with a summary is the documented alternative when most prior results are stale. In this scenario, only a few files change overnight, so throwing away the session pays a daily rediscovery cost for no gain, and writing the summary is a manual step.<\/p>\n<p>A <code>PostToolUse<\/code> hook acts too late: it runs after new tool calls, while the stale results already shape Claude's reasoning from the first turn. A <code>CLAUDE.md<\/code> instruction to reread everything replaces targeted re-analysis with full re-exploration, and instructions are followed probabilistically rather than guaranteed.<\/p>", "docs": [["Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"], ["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks"], ["Claude Code — CLI Reference", "https://code.claude.com/docs/en/cli-reference"]]}, {"k": "1.29", "d": "d5", "title": "Preserving Time Context in a Billing Dispute Handoff", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>Billing-dispute handoffs show a customer's quoted 15% discount beside 10% from <code>lookup_order<\/code>, with no dates. Both figures are usually correct; the promotion changed after the order date. Which handoff change prevents these false contradictions?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the agent select the figure it judges more reliable and record it with a self-rated confidence score.", "e": "This silently picks one value when both are valid information, which hides the conflict instead of explaining it. Collapsing two source-specific facts into a single number removes the temporal and source context the human needs. The reconciliation decision belongs to the human, who needs both figures with their dates."}, {"l": "B", "ok": false, "t": "Report only the <code>lookup_order<\/code> figure, treating backend data as authoritative over customer statements.", "e": "Trusting the system of record is sound practice in general, but the question states both figures are usually correct for their dates. Dropping the customer's quoted rate removes the exact fact the dispute is about. The human would then decide without knowing what the customer was originally offered."}, {"l": "C", "ok": true, "t": "Record each figure with the date it applies to, keeping both the customer's quoted rate and the tool's rate.", "e": "The two figures measure the promotion at different moments, so neither is wrong. Recording the order date with the customer's figure and the lookup time with the tool's figure makes the timing clear. The human then sees a rate change, not a contradiction, and both values stay available for the policy decision."}, {"l": "D", "ok": false, "t": "Block the escalation and rerun <code>lookup_order<\/code> until the two figures match before sending the handoff.", "e": "Retrying makes sense for transient errors, but this mismatch is not an error. The tool returns the current rate, so rerunning it produces the same figure every time. This change would stall legitimate escalations without ever resolving the difference."}], "o": "<p>The handoff is the only thing the receiving human sees; they have no transcript. So the handoff must carry enough context to interpret every figure on its own. Here the missing context is temporal metadata: the date each figure applies to. The customer's 15% is the promotion rate at order time. The tool's 10% is the rate at lookup time. Without dates, a rate change looks like a contradiction.<\/p>\n<p>When two credible sources give different values, the difference is information. Preserve both values, attach their source and date, and let the human reconcile. Collapsing them into one number destroys that information. This is why dropping the customer's figure fails, even though backend data is normally authoritative. The confidence-score approach fails for the same reason. The agent would pick one value, which is a policy decision—whether to honor the old quote—that belongs to the human. The single selected number also strips away the source and date context the human needs.<\/p>\n<p>Rerunning <code>lookup_order<\/code> until the figures match treats a valid difference as a transient error. The tool will keep returning the current rate, so the retry loop never ends and escalations stall.<\/p>\n<p>Anthropic's prompt guidance supports this structurally. Wrap each piece of source material with explicit metadata, such as a <code>&lt;source&gt;<\/code> tag. Downstream readers then know where and when each claim came from.<\/p>", "docs": [["Prompt Templates and Variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables"], ["Claude Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"]]}, {"k": "1.30", "d": "d2", "title": "Preventing Cross-Customer Data Leakage Through Tool Design", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario B · Customer support resolution agent", "inline": false, "stem": "<p>To investigate billing disputes, the team gave the agent a generic <code>run_query<\/code> tool that executes any SQL string. Logs show some queries return rows belonging to other customers, even though those queries touch only billing tables. What is the correct redesign?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the harness scan <code>run_query<\/code> results and remove rows whose <code>customer_id<\/code> does not match the current customer.", "e": "Output filtering treats the symptom instead of the cause. It breaks on aggregates and on result rows that carry no <code>customer_id<\/code> column, so leaked data can still pass through. The generic query capability remains available for new kinds of misuse."}, {"l": "B", "ok": true, "t": "Replace <code>run_query<\/code> with a <code>get_billing_history<\/code> tool that accepts a verified <code>customer_id<\/code> and a date range.", "e": "This replaces a generic tool with a constrained alternative. The tool interface now fixes the query shape, so the model can never write a join that returns another customer's rows. The misuse becomes impossible instead of merely discouraged."}, {"l": "C", "ok": false, "t": "Add a <code>PreToolUse<\/code> hook that blocks any <code>run_query<\/code> call referencing tables outside the billing schema.", "e": "Hooks give deterministic enforcement, so this is a reasonable instinct. But the logs show the bad queries already touch only billing tables, so a schema-level block would allow every one of them. The flaw is in the query logic, not in which tables are reachable."}, {"l": "D", "ok": false, "t": "Expand the <code>run_query<\/code> description with a rule that every query must filter on the current customer's ID.", "e": "Tool descriptions guide selection and usage, but they are probabilistic. The model can still write a query that violates the rule, and the scenario shows wrong queries slipping through in production. A data isolation requirement needs enforcement in code, not guidance in text."}], "o": "<p>Tool use is a contract between your application and the model. Claude emits a structured request, and your code executes it. Claude never sees or enforces your implementation logic. So the capability surface of a tool is defined entirely by its interface. A tool that accepts an arbitrary SQL string hands the model the full power of SQL, including joins that cross customer boundaries.<\/p>\n<p>The fix is to replace the generic tool with a constrained alternative. A <code>get_billing_history<\/code> tool that takes a verified <code>customer_id<\/code> and a date range runs one fixed, parameterized query. The model can only choose the parameters, not the query shape. Cross-customer leakage becomes structurally impossible. This is the same pattern as replacing <code>fetch_url<\/code> with a <code>load_document<\/code> tool that validates its inputs: constrain the capability at the interface, and the unwanted behavior cannot happen.<\/p>\n<p>The other approaches each leave the root cause in place. A <code>PreToolUse<\/code> hook that blocks out-of-schema tables is a real, deterministic mechanism, but the leaking queries already stay inside the billing schema, so the hook would approve them all. A stronger tool description is probabilistic guidance; the model can still write a non-compliant query. Filtering result rows in the harness is brittle, because aggregated results and rows without a <code>customer_id<\/code> column cannot be checked, and the dangerous capability still exists.<\/p>\n<p>The mental model: when a tool's misuse has data-isolation or compliance consequences, narrow what the tool can do rather than merely policing how the model uses it.<\/p>", "docs": [["Tool Use Overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Define Tools", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "1.31", "d": "d4", "title": "Meeting a Hard Extraction Deadline", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>All extractions currently run on the Message Batches API for its 50% cost savings. A new billing integration needs each uploaded invoice extracted within one hour of upload. Nightly archive reprocessing has no such deadline. How should the team respond?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep upload extractions on batch and poll each batch's status every minute, relying on typical completion in under one hour.", "e": "Most batches do finish in under one hour, so this looks workable. However, there is no latency guarantee, and a batch can take up to 24 hours. Frequent polling only detects completion; it cannot make a slow batch finish within the deadline."}, {"l": "B", "ok": false, "t": "Submit each uploaded invoice as its own single-request batch the moment the document arrives.", "e": "A batch containing one request is still processed asynchronously. It keeps the discount, but it also keeps the up-to-24-hour processing window. The risk of missing the one-hour deadline is unchanged."}, {"l": "C", "ok": false, "t": "Enable <code>stream: true<\/code> on the batch requests so each extraction result arrives as soon as it completes.", "e": "The <code>stream<\/code> option delivers a single synchronous Messages response incrementally over server-sent events. Streaming is not supported inside Message Batch requests. Batch results become accessible once the batch ends, either when all requests complete or after the 24-hour processing window."}, {"l": "D", "ok": true, "t": "Move the upload-triggered extractions to the synchronous Messages API and keep the nightly archive runs on batch.", "e": "The one-hour requirement is a hard deadline, and the Batch API gives no latency guarantee. The synchronous Messages API returns each result in the response, which meets the deadline. The nightly runs have no hard deadline, so they keep the 50% discount on batch."}], "o": "<p>The deciding fact is the deadline. The Message Batches API processes requests asynchronously. Most batches finish in under one hour, but a batch can take up to 24 hours, and Anthropic gives no latency guarantee. A hard one-hour requirement therefore cannot sit on batch. The synchronous Messages API returns the result in the response itself, so it is the right path for any workflow where a person or a downstream system waits.<\/p>\n<p>The mental model is a simple split: blocking work goes synchronous, latency-tolerant work goes batch. The 50% batch discount is the reward for giving up latency control. The nightly archive reprocessing fits batch because it has no hard latency deadline; it can tolerate the asynchronous processing window.<\/p>\n<p>Polling every minute observes progress but does not bound completion time. Shrinking a batch to a single request does not change its processing model. Streaming is unsupported inside batch requests.<\/p>", "docs": [["Message Batches API", "https://platform.claude.com/docs/en/build-with-claude/batch-processing"], ["Messages API reference", "https://platform.claude.com/docs/en/api/messages"]]}, {"k": "1.32", "d": "d5", "title": "Escalating When a User Explicitly Requests a Human", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>A user reports a wrong invoice total. The assistant, which can route cases to a human reviewer, offers a corrected re-extraction that would likely fix the error. The user replies: \"No, have a person check it.\" What should the assistant do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Acknowledge the frustration again and offer a side-by-side view of the extracted and source values.", "e": "Acknowledging frustration and offering a resolution is the right pattern before any explicit request for a human. The assistant already did that, and the user responded by asking for a person, so another resolution offer ignores their clear request."}, {"l": "B", "ok": false, "t": "Escalate only if the user's message scores above a set frustration threshold in sentiment analysis.", "e": "Sentiment analysis is an unreliable proxy for when to escalate. The user has already made the clearest possible signal, a direct request for a person, so no threshold check is needed."}, {"l": "C", "ok": false, "t": "Run the corrected re-extraction first, then escalate with the new result if the user is still unsatisfied.", "e": "Attempting resolution first is sound when the user has not asked for a human. Here the user explicitly asked for a person after the fix was offered, so continuing autonomous work overrides their stated preference and damages trust even if the re-extraction would succeed."}, {"l": "D", "ok": true, "t": "Route the case to the human reviewer now, without running the re-extraction first.", "e": "An explicit request for a human is a first-class escalation trigger, and the assistant must honor it immediately. The acknowledge-and-resolve stage already happened; once the user asks for a person, further autonomous work overrides their stated preference."}], "o": "<p>Escalation design separates two situations. The first is frustration without a request for a human: the agent should acknowledge the emotion and offer a concrete fix, because the issue is within its capability. The second is an explicit request for a human: the agent must escalate immediately, with no further attempts to resolve. The scenario sits at the boundary. The assistant already acknowledged the problem and offered a re-extraction. The user answered that offer by asking for a person. That reply is the trigger, and it ends the autonomous phase.<\/p>\n<p>The reason this rule is absolute is trust. A user who asks for a person and then watches the agent keep working concludes that the system does not listen. That damage happens even when the fix would have worked, so the likely success of the re-extraction does not change the decision.<\/p>\n<p>Sentiment scoring is the weakest signal here. Mood correlates poorly with case complexity, and thresholds add a probabilistic layer on top of a signal that is already explicit. When the user has said the words, no classifier is needed.<\/p>\n<p>The escalation should still carry a structured handoff containing the document, extracted values, and what was offered. Compiling that summary is part of escalating, not a reason to delay it.<\/p>", "docs": [["Building Effective Agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "1.33", "d": "d4", "title": "Resolving Numbered Bibliography References with Few-Shot Examples", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>The system extracts factual claims, each with a value and a source field. Documents with inline citations extract correctly. Documents that use numbered markers with a separate bibliography get wrong source values, though the data values are accurate. Every output passes schema validation, and detailed prose instructions about reference styles have not helped. What is the most effective addition?<\/p>", "c": [{"l": "A", "ok": true, "t": "Add contrasting few-shot examples: a correct extraction from an inline-citation document and one from a numbered bibliography.", "e": "Few-shot examples carry judgment that prose cannot. Showing one correct extraction for each reference style teaches the model how to resolve a numbered marker to its bibliography entry. The model then generalizes the pattern to new documents."}, {"l": "B", "ok": false, "t": "Instruct the model to quote the relevant passages from each document before it produces the structured extraction.", "e": "Quoting first helps the model find relevant content in long documents. Here the model already finds the correct values; it fails when linking a numbered marker to its bibliography entry. Quoting does not teach that mapping."}, {"l": "C", "ok": false, "t": "Change the source field to a required enum of known citation styles so the schema rejects incorrect attributions.", "e": "A schema constrains the shape of the output, not whether the right bibliography entry was chosen. A wrong source can still match an enum of styles. Marking the field required also pushes the model toward filling it with an invented value."}, {"l": "D", "ok": false, "t": "Add a validation-retry loop that resends each failed document together with its specific validation errors for self-correction.", "e": "Retry with error feedback is a sound pattern, but it needs a detected error to feed back. The question states every output already passes schema validation, so there is no validation error to send. The mistakes are semantic and invisible to the validator."}], "o": "<p>The failure in this scenario is structural variety in the source documents. Inline citations put the source next to the claim, so the model handles them easily. A numbered bibliography splits the claim and its source across the document. The model needs to learn how to connect the marker to the correct bibliography entry.<\/p>\n<p>Few-shot prompting demonstrates that decision directly. Contrasting examples show how the same factual claim should be represented when its citation is inline versus when its citation points to a numbered bibliography. The examples communicate the relationship between document structure, claim, and source in a way that prose rules may not.<\/p>\n<p>Anthropic recommends a small set of relevant, diverse examples—around three to five—that cover edge cases. Wrapping them in <code>&lt;example&gt;<\/code> tags helps Claude distinguish examples from instructions.<\/p>\n<p>The other options address different failure types. Quoting passages helps with locating information in long documents, but the values are already correct. A stricter schema can enforce field types and required fields, not whether the chosen source is factually correct. A validation-retry loop requires a detectable validation error, but every extraction already passes.<\/p>\n<p>The general lesson: schemas enforce structure, instructions describe rules, and examples demonstrate how to apply judgment consistently.<\/p>", "docs": [["Prompt Templates and Variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables"], ["Structured Outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]]}, {"k": "1.34", "d": "d4", "title": "Detecting Swapped Buyer and Seller Names", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>Extractions from the system always pass JSON Schema validation, but buyer and seller names are sometimes placed in each other's fields. A self-review instruction added to the extraction prompt rarely changes the output. Which design best catches these subtle errors?<\/p>", "c": [{"l": "A", "ok": false, "t": "Enable extended thinking for the extraction request so the model deliberates longer before producing output.", "e": "Extended thinking gives more reasoning inside the same generation pass. The model is still judging its own work with its own context, so it keeps the same bias toward its first interpretation. More deliberation does not supply the fresh perspective needed here."}, {"l": "B", "ok": false, "t": "Add a retry loop that sends JSON Schema validation errors back with the document for self-correction.", "e": "Retry with validation errors is a sound pattern for structural failures. Here the question states that every extraction already passes schema validation, so there are no errors to feed back. Swapped names are a semantic problem the schema cannot see."}, {"l": "C", "ok": true, "t": "Send the document and the finished extraction to a second Claude instance with no prior context for verification.", "e": "A fresh instance sees only the document and the extraction, not the reasoning that produced the mistake. Without that reasoning context, it has no attachment to the original choices. This makes it far more likely to notice swapped fields than any form of self-review."}, {"l": "D", "ok": false, "t": "Send a follow-up message in the same conversation asking Claude to re-check its extraction for swapped fields.", "e": "A follow-up turn stays inside the same conversation, so the model still holds the reasoning that led to the swap. It tends to confirm its own earlier decisions. The scenario already shows that self-review in context rarely changes the output."}], "o": "<p>Swapped buyer and seller names are a semantic error. The JSON is well formed and every field has the right type, so schema validation passes. Catching this class of error requires a review step, and the key design choice is who reviews.<\/p>\n<p>A model that generated an extraction keeps the reasoning that produced it. When asked to check its own work—through a prompt instruction, a follow-up turn, or extended thinking—it may continue to favor its earlier interpretation. The scenario shows this directly: the self-review instruction almost never changes the output.<\/p>\n<p>An independent review instance breaks this pattern. It receives only the source document and the finished extraction, with none of the generator's reasoning. It forms its own view of which party is the buyer and which is the seller, so a swap stands out as a mismatch. This mirrors human peer review, where a second reader catches what the author rationalized.<\/p>\n<p>The retry-with-error-feedback loop is appropriate for a different problem: a validator produces concrete errors the model can correct. With no validation errors here, that loop has nothing to trigger on.<\/p>", "docs": [["Prompt Engineering Overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"], ["Chain Complex Prompts", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-prompts"]]}, {"k": "1.35", "d": "d4", "title": "Normalizing Informal Quantities Consistently", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>Extractions from this system always pass JSON Schema validation. However, informal quantities like \"a pinch of salt\" are handled inconsistently: sometimes the phrase is copied verbatim, sometimes it is converted to grams but not marked as approximate. Detailed prose normalization instructions have not fixed this. What addition is most effective?<\/p>", "c": [{"l": "A", "ok": false, "t": "Expand the prompt with a normalization rule for every informal unit observed in past documents.", "e": "Informal measurements are too varied for an exhaustive rule list, and new phrasings will keep appearing. The question also says detailed prose instructions have already been tried without success. Examples transfer the decision pattern more reliably than a longer list of rules."}, {"l": "B", "ok": false, "t": "Add a validation-retry loop that sends Pydantic errors and the original document back for self-correction.", "e": "Retry with error feedback is a sound technique when a concrete, detectable error can be expressed. The scenario states these extractions already pass schema validation, so there is no error message to feed back. A converted value that is merely missing its approximate marking looks correct to the validator."}, {"l": "C", "ok": false, "t": "Add a regex pattern to the quantity field so verbatim informal wording fails schema validation.", "e": "A regex pattern on the quantity field checks formatting, not judgment. It could reject verbatim phrases like \"a pinch\", but the second failure mode in the scenario—a converted number that is not marked approximate—is well formed and would pass. The pattern does not teach the model when to apply the approximate flag."}, {"l": "D", "ok": true, "t": "Add 3–5 examples that map informal phrases to normalized amounts with the precision field set to approximate.", "e": "Few-shot examples demonstrate the judgment the prose instructions failed to transfer. Each example shows both decisions at once: convert the informal phrase and mark it approximate. The model can generalize this pattern to informal phrases it has never seen."}], "o": "<p>This question tests the documented strength of few-shot prompting: showing judgment that prose instructions fail to convey. The scenario has two linked decisions. First, convert an informal phrase like \"a pinch of salt\" to a normalized amount. Second, mark that value as approximate.<\/p>\n<p>Prose rules describe these decisions. Examples demonstrate them together, which is why the model can then apply the same pattern to phrases it has never seen. Anthropic recommends a small set of relevant, diverse examples—around three to five—that cover edge cases, wrapped in <code>&lt;example&gt;<\/code> tags so Claude can tell examples apart from instructions.<\/p>\n<p>The other options are real techniques that fail on facts stated in the question. A validation-retry loop needs a concrete, detectable error to send back. Here the extractions already pass validation, so the loop never fires. A regex on the quantity field checks formatting, not whether an informal source phrase should be normalized and flagged as approximate; a converted number missing its approximate flag is well formed and passes. Expanding the rule list runs into the diversity problem: informal units vary too much to enumerate, and the team has already seen detailed instructions fall short.<\/p>\n<p>The general lesson: schemas and validators control structure, prose rules state criteria, and examples transfer decision boundaries. When output is structurally valid but the model applies a judgment inconsistently, examples are usually the right layer to change.<\/p>", "docs": [["Prompt Templates and Variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables"], ["Structured Outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]]}, {"k": "1.36", "d": "d4", "title": "Forcing a Tool Call While Preserving Multiple Schemas", "scen": "<p>A structured extraction system processes unstructured documents using Claude and validates outputs against JSON schemas. It must handle different document types and preserve compatibility with downstream validators.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>A pipeline defines three extraction tools, one for each document type: invoices, contracts, and receipts. It runs on a Claude model that supports forced tool use. Incoming documents arrive unlabeled. In testing, Claude sometimes replies with explanatory text instead of calling any tool. Downstream validators depend on each tool's separate schema. Which configuration fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep <code>tool_choice<\/code> as <code>\"auto\"<\/code> and add a system prompt rule to always call an extraction tool.", "e": "With <code>auto<\/code>, Claude decides whether to call a tool at all, and a prompt instruction cannot make that decision binding. The observed failure—Claude returning explanatory text—can therefore still occur."}, {"l": "B", "ok": false, "t": "Set <code>tool_choice<\/code> to <code>{\"type\": \"tool\"}<\/code> naming one extraction tool for every incoming document.", "e": "Forcing a specific named tool guarantees a tool call, but it applies one schema to every document. Since the incoming documents are unlabeled and can be invoices, contracts, or receipts, the wrong schema could be used."}, {"l": "C", "ok": true, "t": "Set <code>tool_choice<\/code> to <code>{\"type\": \"any\"}<\/code> and keep the three separate extraction tools.", "e": "The <code>any<\/code> setting requires Claude to call one of the provided tools, preventing plain-text replies. Claude retains the freedom to choose the appropriate tool for the unknown document type, and the three separate schemas remain intact for downstream validators."}, {"l": "D", "ok": false, "t": "Combine the three schemas into one extraction tool and force that tool with <code>tool_choice<\/code>.", "e": "A single merged tool would guarantee a tool call, but it would change the contract expected by downstream validators. It could also require many unrelated fields to become optional, weakening the schema's ability to validate each document type."}], "o": "<p>The <code>tool_choice<\/code> parameter controls whether Claude must use a tool:<\/p>\n<ul><li><code>auto<\/code>: Claude may call a tool or respond with text.<\/li><li><code>any<\/code>: Claude must call one of the provided tools.<\/li><li><code>tool<\/code>: Claude must call a specific named tool.<\/li><\/ul>\n<p>The scenario has two requirements: the document type is unknown, so Claude must choose among the available tools; and the downstream validators rely on each tool's separate schema, so those schemas must remain unchanged.<\/p>\n<p>The <code>any<\/code> configuration satisfies both requirements. It guarantees a tool call while leaving the model free to select the appropriate extraction schema.<\/p>\n<p>One important distinction: forcing a tool call does not guarantee that the extracted values are factually correct. Strict tool use can strengthen structural and type guarantees, but semantic correctness still needs appropriate validation.<\/p>", "docs": [["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Strict tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use"]]}, {"k": "1.37", "d": "d4", "title": "Resolving Incompatibility Between Extended Thinking and Forced Tool Use", "scen": "<p>A structured extraction system uses Claude to extract metadata from messy documents, validates the resulting data, and requires every document to produce a structured result.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>A team runs document extraction on a model that supports forced tool use. To improve accuracy on messy documents, they enable manual extended thinking with <code>thinking: {\"type\": \"enabled\", \"budget_tokens\": 10000}<\/code> on requests that force <code>tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}<\/code>. Every request now returns an error. Each document must still yield a structured extraction through a tool call. What should the team change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Change <code>tool_choice<\/code> to <code>{\"type\": \"auto\"}<\/code> and instruct the prompt to always call <code>extract_metadata<\/code>.", "e": "The <code>auto<\/code> mode is compatible with manual extended thinking, so the error would stop. However, <code>auto<\/code> permits Claude to respond with text instead of calling the tool. A prompt instruction cannot guarantee the required tool call."}, {"l": "B", "ok": false, "t": "Keep both settings and retry the failed requests with exponential backoff.", "e": "Retries with backoff are useful for transient failures such as timeouts or temporary service problems. This error results from an invalid combination of request settings, so every retry will fail until the configuration changes."}, {"l": "C", "ok": true, "t": "Remove the <code>thinking<\/code> parameter from these extraction requests and keep the forced <code>tool_choice<\/code>.", "e": "Manual extended thinking does not support <code>tool_choice<\/code> values of <code>any<\/code> or <code>tool<\/code>. Removing the thinking parameter restores the forced tool call while preserving the requirement that every document yield a structured extraction."}, {"l": "D", "ok": false, "t": "Change <code>tool_choice<\/code> to <code>{\"type\": \"any\"}<\/code> so the thinking parameter can stay enabled.", "e": "This might seem reasonable if only the named-tool mode were incompatible. However, the restriction applies to both <code>any<\/code> and <code>tool<\/code>, so the requests would still fail."}], "o": "<p>This is a documented configuration incompatibility. Manual extended thinking and forced tool use with <code>tool_choice<\/code> set to <code>any<\/code> or <code>tool<\/code> cannot be combined in the configuration described.<\/p>\n<p>The team must decide which behavior is essential. Here, every document must produce a structured extraction through a tool call, so the forced tool configuration must be retained and the manual thinking parameter removed.<\/p>\n<p>The alternatives each fail for a different reason. Changing to <code>auto<\/code> removes the error but removes the guarantee of a tool call. Retrying a configuration error does not fix the invalid settings. Switching from a named tool to <code>any<\/code> does not help because both forced modes have the same incompatibility.<\/p>", "docs": [["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Extended thinking", "https://platform.claude.com/docs/en/build-with-claude/extended-thinking"]]}, {"k": "1.38", "d": "d4", "title": "Extracting Large Document Packets Without Losing Detail", "scen": "<p>A structured extraction system processes unstructured documents using Claude and validates the extracted fields against JSON schemas.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>The system extracts fields from 12-document loan packets in a single pass over the whole packet. Some documents yield complete values; others come back shallow or incomplete. Conflicting borrower addresses across documents go unflagged. How should the team restructure the extraction?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep the single pass over the full packet but add few-shot examples showing complete extraction for every document type.", "e": "Few-shot examples can improve consistency in format and judgment. However, they do not reduce the size of the input or prevent uneven attention across twelve documents. The single pass also still lacks a dedicated step for comparing values across documents."}, {"l": "B", "ok": false, "t": "Move the pipeline to a model with a larger context window so one pass can attend to all twelve documents.", "e": "The packet already fits in the context window because the existing pass completes. The problem is uneven attention, not insufficient context capacity. A larger context window does not guarantee equally thorough extraction from every document."}, {"l": "C", "ok": true, "t": "Extract each document in its own pass, then run a separate pass that compares values across documents and flags conflicts.", "e": "Dedicated per-document passes give each document focused attention and help maintain extraction depth. A separate cross-document pass can compare repeated fields, such as borrower addresses, and flag discrepancies explicitly."}, {"l": "D", "ok": false, "t": "Run three independent extractions of the full packet and keep only values that agree in at least two of the runs.", "e": "Majority voting can reduce run-to-run variation, but every run still processes the same large packet and may suffer from uneven attention. Voting also does not inherently compare values across documents, so the address conflict could remain hidden."}], "o": "<p>When a single pass covers many documents, the model's attention may be distributed unevenly. Some documents receive thorough treatment while others receive shallow treatment. This is an attention-allocation problem rather than a context-window capacity problem.<\/p>\n<p>The appropriate solution is to divide the work into two stages:<\/p>\n<ol><li><strong>Local extraction:<\/strong> Process each document independently, extracting its relevant fields with consistent depth.<\/li><li><strong>Cross-document reconciliation:<\/strong> Compare values from the individual extractions, identify conflicts, and emit explicit flags for downstream handling.<\/li><\/ol>\n<p>For example, if two documents contain different borrower addresses, the reconciliation stage should preserve the conflicting values and make the discrepancy visible rather than silently selecting one.<\/p>\n<p>Few-shot examples are useful when the model struggles with output format or applying a judgment consistently. Here, the primary problem is coverage and cross-document reconciliation, so changing the workflow structure is more appropriate.<\/p>", "docs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.39", "d": "d4", "title": "Flagging Invoice Totals That Conflict With Line Items", "scen": "<p>A structured extraction system uses Claude to extract invoice data, validates the output using JSON schemas, and routes edge cases for human review.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>Extracted invoice totals often disagree with the sum of the extracted line items. Audits show the error is usually printed in the source invoice itself. These invoices must go to manual review, with values extracted exactly as printed. What should you add?<\/p>", "c": [{"l": "A", "ok": false, "t": "Enable strict tool use on the extraction tool so the input schema is enforced during sampling.", "e": "Strict tool use constrains the structure and types of tool inputs. It cannot check whether one number equals the sum of several others. The mismatch is semantic, so structural enforcement does not address the core issue."}, {"l": "B", "ok": false, "t": "Recompute the line item sum in validation code and retry the extraction with the mismatch included as error feedback.", "e": "Retrying with validation feedback can help when the model makes an extraction mistake. Here, however, the source invoice itself is often inconsistent. A retry could pressure the model to change faithfully extracted values until they reconcile, concealing the original discrepancy."}, {"l": "C", "ok": false, "t": "Add a prompt instruction that the extracted total must always equal the sum of the extracted line items.", "e": "This instruction encourages the model to produce consistent numbers even when the source document is inconsistent. It could cause the model to alter the printed total or a line item, violating the requirement to preserve the values exactly as printed."}, {"l": "D", "ok": true, "t": "Extend the schema to extract both the stated total and a model-computed line item sum, plus a <code>conflict_detected<\/code> boolean.", "e": "Extracting both the printed total and the calculated line item sum preserves the source information while exposing the arithmetic discrepancy. A <code>conflict_detected<\/code> flag makes the inconsistency machine-readable, allowing downstream code to route the invoice for manual review."}], "o": "<p>JSON schemas and strict tool use enforce structure, not semantic relationships between values. They can ensure that fields exist and have the expected types, but they do not guarantee that an invoice total equals the sum of its line items.<\/p>\n<p>The source document itself is often wrong in this scenario. The system should therefore preserve what the document says rather than inventing consistency.<\/p>\n<p>A suitable schema could include:<\/p>\n<ul><li><code>stated_total<\/code>: the total printed on the invoice.<\/li><li><code>calculated_total<\/code>: the sum of the extracted line items.<\/li><li><code>conflict_detected<\/code>: a boolean indicating whether the values disagree.<\/li><\/ul>\n<p>The application can compare the values and route flagged invoices to manual review. This preserves extraction fidelity and makes the inconsistency explicit.<\/p>\n<p>The broader lesson is that structural validation and semantic validation serve different purposes. Strict tool use helps enforce the shape of the data, while application logic or explicit comparison fields are needed to detect inconsistencies in meaning.<\/p>", "docs": [["Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Strict tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use"]]}, {"k": "1.40", "d": "d4", "title": "Handling Case-Insensitive Enum Values", "scen": "<p>A structured extraction system uses Claude to classify documents into predefined categories. Its schema is shared with downstream systems and must remain unchanged.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>An extraction schema's category enum includes <code>\"Unclear\"<\/code> for ambiguous documents. The schema is shared with downstream systems and must stay unchanged. In a nightly batch, some correct classifications return <code>\"unclear\"<\/code> and fail validation. Retries that include the validation error sometimes return the same lowercase value. What is the right fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Raise the retry budget so failed extractions are re-attempted until a correctly cased value returns.", "e": "Retry with error feedback is useful for genuine formatting or structural mistakes. Here, retries sometimes return the same lowercase value, so increasing the retry budget adds cost and latency without guaranteeing a fix. Normalization in the validator resolves the mismatch deterministically."}, {"l": "B", "ok": false, "t": "Rewrite every enum value in the schema in lowercase so the output matches the validator's list.", "e": "This might seem like a straightforward schema adjustment, but the schema must remain unchanged because downstream systems depend on it. Furthermore, exact capitalization is not guaranteed simply by changing the enum's casing."}, {"l": "C", "ok": true, "t": "Compare the returned category against the enum values case-insensitively in the validation step.", "e": "Comparing enum values without regard to case resolves the mismatch on the consumer side. This approach leaves the shared schema unchanged and avoids relying on the model to reproduce exact capitalization."}, {"l": "D", "ok": false, "t": "Add a prompt instruction requiring the category to match the schema's exact capitalization.", "e": "Prompt instructions may influence capitalization, but they cannot guarantee it. The output can still contain <code>\"unclear\"<\/code> instead of <code>\"Unclear\"<\/code>, leaving the validator vulnerable to the same failure."}], "o": "<p>Schema enforcement guarantees important aspects of structure, such as valid JSON, required fields, and permitted enum values. It does not guarantee that an enum string will always use the exact capitalization specified in the schema.<\/p>\n<p>The scenario requires the schema to remain unchanged, and retries do not reliably fix the capitalization mismatch. The robust solution is to normalize or compare enum strings case-insensitively in the validation layer.<\/p>\n<p>This makes the behavior deterministic without modifying the prompt, the model, or the shared schema.<\/p>\n<p>The alternatives fail because they depend on repeated generation, violate the constraint on the shared schema, or rely on prompt wording for behavior that is not guaranteed.<\/p>", "docs": [["Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "1.41", "d": "d4", "title": "Scheduling Batches Around a 36-Hour Deadline", "scen": "<p>A document extraction system uses Claude and JSON schemas. Downstream systems need results within 36 hours of document arrival, documents arrive continuously, and the team wants the 50% cost savings of the Message Batches API.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>How should the team schedule batch submissions?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep all extractions on the synchronous API to be certain the 36-hour deadline is met.", "e": "Synchronous calls would meet the deadline, but the 36-hour window leaves enough room for the Batch API's processing window. Using synchronous calls for every extraction gives up the requested 50% savings unnecessarily."}, {"l": "B", "ok": false, "t": "Submit batches during overnight off-peak hours so they complete within a few hours.", "e": "The Message Batches API does not guarantee faster processing during off-peak hours. This approach relies on an undocumented performance pattern."}, {"l": "C", "ok": true, "t": "Group arriving documents into batches and submit each batch within 12 hours of arrival.", "e": "Batch processing can take up to 24 hours. Submitting within 12 hours leaves up to 24 hours for processing while keeping the result within the 36-hour deadline."}, {"l": "D", "ok": false, "t": "Collect each day's documents and submit them together as one batch at the end of the day.", "e": "A document that arrives early may wait nearly 24 hours before submission, followed by up to 24 hours of processing. Its result could take close to 48 hours, exceeding the deadline."}], "o": "<p>The Message Batches API trades latency for cost. It offers a 50% discount, but processing can take up to 24 hours, with no latency guarantee inside that window. Architecture must account for the worst case rather than assume typical completion times.<\/p>\n<p>The scheduling rule is:<\/p>\n<p><strong>Latest submission time = result deadline − maximum processing window<\/strong><\/p>\n<p>For a 36-hour deadline:<\/p>\n<p>36 hours − 24 hours = <strong>12 hours<\/strong><\/p>\n<p>Each document must therefore enter a submitted batch within 12 hours of arrival. Submitting batches every few hours adds margin. Waiting until the end of the day could leave early-arriving documents waiting almost 48 hours in total.<\/p>\n<p>Synchronous calls are appropriate when a workflow needs a result immediately. A 36-hour deadline is compatible with batch processing, provided submissions are scheduled correctly.<\/p>", "docs": [["Message Batches API", "https://platform.claude.com/docs/en/build-with-claude/batch-processing"]]}, {"k": "1.42", "d": "d5", "title": "Ordering Extracted Revenue Figures for Trend Analysis", "scen": "<p>A structured extraction system collects revenue figures from documents. Each figure includes its reporting period and source name, but the synthesis report lists figures in the order the documents were processed.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>Analysts compare exact quarterly values and cannot follow the trend. Which output change fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Group the figures under a heading for each source document so provenance stays visible.", "e": "Grouping by source can help when attribution is unclear. Here, every figure already includes its source name. Grouping by document would still scatter the quarters and make trends difficult to follow."}, {"l": "B", "ok": false, "t": "Normalize the entire report into one uniform table so every section renders the same way.", "e": "Flattening every type of content into one format can damage narrative sections and goes beyond what the problem requires. Only the time-series figures need to be reordered."}, {"l": "C", "ok": true, "t": "Order the revenue figures chronologically by reporting period in the synthesis output.", "e": "Revenue figures across quarters form a time series. Chronological ordering makes trends easy to inspect while preserving each exact value and its source."}, {"l": "D", "ok": false, "t": "Rewrite the figures as a prose narrative that describes the overall revenue trend.", "e": "Prose can summarize a trend, but it is not ideal when analysts need to compare exact quarterly values. A narrative could obscure the precise figures."}], "o": "<p>Synthesis outputs are most useful when each type of content is presented in a format suited to its purpose:<\/p>\n<ul><li>Financial data: tables or structured figures.<\/li><li>News and narrative: prose.<\/li><li>Technical findings: structured lists.<\/li><li>Time series: chronological order.<\/li><\/ul>\n<p>The figures are already extracted and attributed correctly. The problem is their ordering. Sorting by reporting period makes the trend visible while preserving all exact values and provenance.<\/p>\n<p>Processing order is an artifact of the pipeline, not an inherent property of the data. The synthesis step should organize results for the audience's needs.<\/p>", "docs": [["How we built our multi-agent research system", "https://www.anthropic.com/engineering/built-multi-agent-research-system"], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "1.43", "d": "d5", "title": "Routing Human Review Using Field-Level Confidence", "scen": "<p>A structured extraction system produces one confidence score per document. Documents scoring above 0.85 skip human review. Reviewers still find frequent date-field errors in documents that scored above 0.85, and reviewer capacity is fixed.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>Which change improves review routing?<\/p>", "c": [{"l": "A", "ok": false, "t": "Raise the document-level skip threshold from 0.85 to 0.95 so more borderline documents reach human review.", "e": "Raising the threshold sends more complete documents to reviewers without specifically targeting the date-field errors. A document with a high overall score can still contain a confidently incorrect date."}, {"l": "B", "ok": true, "t": "Output a confidence score per field and calibrate each field's review threshold on a labeled validation set.", "e": "Field-level scores expose risk at the same granularity as the errors. Calibration on labeled data connects score ranges to measured error rates, allowing reviewers to focus on fields that are actually error-prone."}, {"l": "C", "ok": false, "t": "Add a prompt instruction telling the model to report lower confidence when a field's source text is ambiguous.", "e": "This still relies on self-reported confidence, which may be poorly calibrated. Without labeled validation data, there is no evidence that the revised scores accurately reflect real error rates."}, {"l": "D", "ok": false, "t": "Add stratified random sampling of documents that skip review to measure the error rate in that population.", "e": "Sampling helps monitor error rates and detect emerging problems. However, it measures the problem rather than directly routing review attention to the already-known date-field errors."}], "o": "<p>The problem has two parts:<\/p>\n<ol><li><strong>Wrong granularity:<\/strong> A document-level score cannot flag an erroneous date inside an otherwise accurate document.<\/li><li><strong>Uncalibrated confidence:<\/strong> A model can report high confidence while being wrong, so a raw score is not proof of correctness.<\/li><\/ol>\n<p>The better design produces confidence estimates per field and calibrates them against a labeled validation set. This helps determine how reliably scores correspond to actual accuracy and directs limited reviewer capacity toward fields with higher measured error rates.<\/p>\n<p>The general principle is to treat model confidence as a signal to validate, not as a fact. Labeled evaluation data is needed to establish whether that signal is useful for review decisions.<\/p>", "docs": [["Define success criteria and build evaluations", "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "1.44", "d": "d4", "title": "Reducing False Positives in Vendor-Name Consistency Checks", "scen": "<p>A vendor-name consistency category has a 55% false-positive rate. It flags the same abbreviation variants, such as “Inc.” versus “Incorporated,” on every run. The team temporarily disables the category.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>Which TWO actions best prepare the category for re-enabling?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run the check three times on each document and report only findings that appear in at least two of the three runs.", "e": "Majority voting can reduce random variation across runs. Here, the same abbreviation variants are flagged every time, so the errors are systematic and will survive voting."}, {"l": "B", "ok": true, "t": "Add a <code>detected_pattern<\/code> field to each finding so the team can see which patterns cause the false positives.", "e": "Recording the exact pattern that triggered each finding makes the errors measurable. The team can group findings by pattern, identify the most problematic cases, and improve the criteria systematically."}, {"l": "C", "ok": false, "t": "Add an instruction to flag vendor-name inconsistencies only when the model is highly confident they are real.", "e": "“Highly confident” is subjective and lacks a concrete decision rule. The model may interpret it inconsistently, leaving the false-positive problem unresolved."}, {"l": "D", "ok": true, "t": "Replace the category's criteria with explicit rules defining which vendor-name differences count as real inconsistencies.", "e": "Explicit criteria create a consistent decision boundary. For example, differences limited to legal suffixes such as “Inc.” and “Incorporated” can be defined as equivalent rather than treated as inconsistencies."}], "o": "<p>Temporarily disabling a high-false-positive category protects trust in the rest of the system. Before re-enabling it, the team should fix the source of the noise.<\/p>\n<p>Two improvements work together:<\/p>\n<ol><li><strong>Make the criteria explicit.<\/strong> Define which differences count as real inconsistencies and which should be ignored.<\/li><li><strong>Instrument the findings.<\/strong> Add a <code>detected_pattern<\/code> field so the team can measure which rules produce false positives and target refinements accordingly.<\/li><\/ol>\n<p>Repeated runs do not solve a systematic error: the same mistaken judgment will recur. A vague instruction about confidence also fails to establish a testable rule.<\/p>\n<p>The lesson is to replace subjective judgments with operational criteria and use structured output to measure the behavior being improved.<\/p>", "docs": [["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"], ["Claude Code code review", "https://code.claude.com/docs/en/code-review"]]}, {"k": "1.45", "d": "d4", "title": "Handling Truncated JSON from Strict Tool Use", "scen": "<p>An extraction system uses a tool call with strict mode enabled. Most runs return schema-valid input. On very long documents, however, the tool input JSON sometimes arrives cut off and unparseable. Those responses have <code>stop_reason: \"max_tokens\"<\/code>.<\/p>", "scenLabel": "Scenario C · Structured data extraction", "inline": false, "stem": "<p>What should the team change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the extraction to a final JSON response that uses <code>output_config.format<\/code> with the same JSON schema.", "e": "JSON outputs using <code>output_config.format<\/code> are a structured-output mechanism, but they can also be truncated when the output-token limit is reached. Changing the mechanism does not resolve the underlying limit."}, {"l": "B", "ok": true, "t": "Check <code>stop_reason<\/code> before parsing, and resubmit truncated requests with higher <code>max_tokens<\/code> or chunked documents.", "e": "<code>stop_reason: \"max_tokens\"<\/code> means generation reached the output limit. The JSON may be incomplete, so the system must detect truncation before parsing. Increasing the token limit or splitting long documents addresses the cause."}, {"l": "C", "ok": false, "t": "Resend the original document, the truncated tool input, and the parsing error so the model can self-correct.", "e": "Error-feedback retries can help with mistakes the model can correct. Here, the failure is an output-token limit, not a reasoning error. Retrying under the same limit risks reproducing the same truncation."}, {"l": "D", "ok": false, "t": "Force the extraction tool with a <code>tool_choice<\/code> of type <code>\"tool\"<\/code> so every response must begin with the tool call.", "e": "<code>tool_choice<\/code> controls whether a tool is called and which tool is selected. It does not increase the output-token limit. The tool is already being called in the failing requests."}], "o": "<p>Strict tool use and structured JSON output constrain the structure of generated content. They do not guarantee that generation will finish before the token limit.<\/p>\n<p>When the output hits <code>max_tokens<\/code>, the response can stop mid-object. The resulting JSON is incomplete, and schema conformance is not guaranteed for a truncated response.<\/p>\n<p>The harness should therefore check <code>stop_reason<\/code> before parsing. If the response is truncated, it should increase <code>max_tokens<\/code> when feasible or split a very long document into smaller extraction units. Retrying with the same limit or changing the tool-selection mode does not fix the cause.<\/p>\n<p>The key distinction is between <strong>structural constraints<\/strong> and <strong>completion<\/strong>: a schema constrains the content generated, while the token budget determines how much content can be generated before stopping.<\/p>", "docs": [["Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Messages API reference", "https://platform.claude.com/docs/en/api/messages"]]}, {"k": "1.46", "d": "d5", "title": "Distinguishing a Search Timeout from a Genuine Empty Result", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>The web search subagent retries timeouts twice with backoff, then returns an empty result list whether the source still failed or the query matched nothing. The coordinator therefore retries genuine zero-match queries and accepts timeout gaps as complete findings. Which change fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the subagent add a third retry with a longer backoff for timed-out searches before returning its result list.", "e": "Local retries with backoff are useful for transient failures, but the subagent already retries twice. A source that remains unavailable will still fail, and the returned empty list will remain ambiguous."}, {"l": "B", "ok": true, "t": "Have the subagent report persistent timeouts as errors with failure details and zero-match queries as valid empty results.", "e": "A timeout and a successful search with zero matches are different outcomes. Reporting timeouts as errors gives the coordinator information for recovery, while returning genuine zero matches as successful empty results lets it accept those findings."}, {"l": "C", "ok": false, "t": "Have the coordinator retry every empty result once with a longer timeout before accepting it as a research finding.", "e": "This retries legitimate zero-match searches unnecessarily. Persistent timeouts also remain ambiguous if the subagent continues returning the same empty list for both outcomes."}, {"l": "D", "ok": false, "t": "Have the coordinator keep the successful sources and annotate coverage gaps in the final synthesis report.", "e": "Annotating coverage gaps is useful when a failure is known. Here, the coordinator cannot distinguish an actual gap from a valid empty result, so it cannot reliably identify which sources need a caveat."}], "o": "<p>A timeout means the search did not complete; an empty result means the search completed successfully but found nothing. These states require different responses.<\/p>\n<p>The subagent directly observes which outcome occurred, so it should preserve that distinction in its result. Persistent timeouts should carry failure details and be reported as errors. Genuine zero-match queries should remain successful empty results.<\/p>\n<p>The coordinator can then retry, use an alternative source, or annotate an evidence gap when necessary. An extra retry does not solve the underlying ambiguity, and returning a successful empty list for a timeout can lead to a report that incorrectly implies the source was searched successfully.<\/p>", "docs": [["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"]]}, {"k": "1.47", "d": "d1", "title": "Preventing Internal Codenames from Reaching an External Search Tool", "scen": "<p>A coordinator delegates research to specialized subagents. Internal project codenames must never appear in queries sent to the third-party MCP search tool <code>mcp__search__web_search<\/code>, but searches must still run. Prompt instructions have leaked codenames during testing.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which TWO steps enforce this rule? (Select two.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Register a <code>PostToolUse<\/code> hook that deletes codenames from the search results before the model reads them.", "e": "<code>PostToolUse<\/code> runs after the tool executes. By that point, the query containing the codename has already been sent to the third-party server. Cleaning the returned results cannot prevent the original disclosure."}, {"l": "B", "ok": false, "t": "In the hook callback, return a deny permission decision whenever the query contains a codename.", "e": "Denying the tool call can prevent the query from leaving the system, but it also prevents the search from running. That violates the requirement to continue the search after removing the sensitive term."}, {"l": "C", "ok": true, "t": "In the hook callback, read the query from <code>tool_input<\/code> and return <code>updatedInput<\/code> with the codename removed.", "e": "The callback can inspect the generated query and rewrite the tool input before execution. The search then runs using the sanitized query rather than the original one."}, {"l": "D", "ok": true, "t": "Register a <code>PreToolUse<\/code> hook whose matcher is <code>mcp__search__web_search<\/code>.", "e": "<code>PreToolUse<\/code> executes before the tool call runs, making it the appropriate enforcement point. Matching the fully qualified MCP tool name targets the external search calls that must be sanitized."}], "o": "<p>The key requirements are to prevent disclosure and allow the search to continue. A pre-execution hook provides the correct enforcement point because it runs after Claude generates a tool call but before the external tool executes.<\/p>\n<p>The two necessary steps are:<\/p>\n<ol><li>Register a <code>PreToolUse<\/code> hook targeting <code>mcp__search__web_search<\/code>.<\/li><li>Inspect <code>tool_input<\/code> and return an <code>updatedInput<\/code> that removes the codename.<\/li><\/ol>\n<p>A prompt instruction alone is probabilistic and may leak sensitive terms. A post-execution hook acts too late, while a deny decision blocks the research instead of sanitizing the query.<\/p>\n<p>For compliance-sensitive rules, enforce the constraint in code rather than relying solely on instructions to the model.<\/p>", "docs": [["Agent SDK hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"], ["Claude Code hooks", "https://code.claude.com/docs/en/hooks"]]}, {"k": "1.48", "d": "d2", "title": "Giving the Agent Actionable Error Metadata", "scen": "<p>A multi-agent research system uses a <code>load_document<\/code> tool. The tool sets <code>isError: true<\/code> on every failure, but its content is always the text <code>\"Document unavailable.\"<\/code> The subagent retries permission denials and gives up on timeouts.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which TWO error-response changes most directly fix this retry behavior? (Select two.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Replace the generic text with the document store's raw error payload, including HTTP status and stack trace.", "e": "Raw payloads can expose internal details in inconsistent formats. The agent must still infer whether a failure is retryable, and the extra stack-trace content may consume context without improving the decision."}, {"l": "B", "ok": true, "t": "Add an <code>errorCategory<\/code> field that labels each failure as transient, validation, or permission.", "e": "An explicit category distinguishes failures that require different actions. Transient timeouts can be retried, validation failures may require corrected input, and permission failures generally require a different access path or escalation."}, {"l": "C", "ok": false, "t": "Keep <code>isError: true<\/code> and add a human-readable sentence that describes each failure's cause.", "e": "Clear explanations are useful, but prose alone leaves the agent to infer whether another attempt can succeed. The question calls for more direct signals to guide retry behavior."}, {"l": "D", "ok": true, "t": "Add an <code>isRetryable<\/code> boolean that states whether another attempt can succeed.", "e": "This field explicitly communicates retryability. For example, a transient timeout can set <code>isRetryable: true<\/code>, while a permission denial can set it to <code>false<\/code>."}], "o": "<p>The <code>isError<\/code> flag indicates that execution failed, but it does not explain the failure type or what
