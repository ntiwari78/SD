 projects<\/td><\/tr><tr><td><code>.claude/commands/<\/code> in the repository<\/td><td>Project-level<\/td><td>Shared with the repository's contributors<\/td><\/tr><tr><td>Project <code>CLAUDE.md<\/code><\/td><td>Project-level instructions<\/td><td>Provides persistent context, not command registration<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The solution is to move <code>db-migrate.md<\/code> into the project's <code>.claude/commands/<\/code> directory and commit it. This preserves the command definition while changing its distribution scope.<\/p>\n<p>The broader lesson is that shared developer workflows should use version-controlled project configuration. Copying files between home directories works temporarily but does not create a reliable update mechanism.<\/p>\n<p>The source also notes that <code>.claude/commands/<\/code> is a supported legacy command format; Claude Code also supports Agent Skills under <code>.claude/skills/<\/code>.<\/p>", "docs": [["Claude Code — Slash commands", "https://code.claude.com/docs/en/slash-commands"], ["Claude Code — Skills", "https://code.claude.com/docs/en/skills"]]}, {"k": "3.23", "d": "d1", "title": "Guaranteeing Customer Verification Before a Refund", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>In testing, the agent occasionally issues refunds without first verifying the customer through <code>get_customer<\/code>, despite explicit system prompt instructions requiring the sequence. Compliance policy mandates that verification precede every refund. What enforcement design guarantees this ordering?<\/p>", "c": [{"l": "A", "ok": false, "t": "Rewrite the <code>process_refund<\/code> tool description to state that identity verification via <code>get_customer<\/code> must always be completed first.", "e": "Tool descriptions influence how the model selects and uses tools, but they are still instructions. The model can occasionally fail to follow them, as the testing results already demonstrate."}, {"l": "B", "ok": false, "t": "Add a <code>PostToolUse<\/code> hook on <code>process_refund<\/code> that checks whether a verified customer ID was obtained and flags any refund issued without one.", "e": "<code>PostToolUse<\/code> runs after the tool has executed. It can detect and report a violation, but the refund may already have been processed, so the mandatory ordering is not enforced."}, {"l": "C", "ok": true, "t": "Add a <code>PreToolUse<\/code> hook that blocks <code>process_refund<\/code> calls until <code>get_customer<\/code> has returned a verified customer ID in the session.", "e": "A <code>PreToolUse<\/code> hook intercepts the call before execution. It can check whether the required identity-verification condition has been met and deny the refund call if it has not."}, {"l": "D", "ok": false, "t": "Add few-shot examples to the system prompt demonstrating the <code>get_customer<\/code> then <code>process_refund<\/code> sequence for typical refund cases.", "e": "Few-shot examples can improve adherence, but they remain probabilistic guidance. They cannot guarantee that every refund call follows the mandatory sequence."}], "o": "<p>This question tests the difference between <strong>guiding model behavior and enforcing a rule deterministically<\/strong>.<\/p>\n<p>Prompts, examples, and tool descriptions can encourage the correct sequence, but they cannot guarantee compliance on every run. A financial or compliance requirement that must never be violated needs programmatic enforcement.<\/p>\n<p>The correct flow is:<\/p>\n<ol><li>The agent attempts to call <code>process_refund<\/code>.<\/li><li>A <code>PreToolUse<\/code> hook checks the session state.<\/li><li>If a verified customer ID is missing, the hook denies the call.<\/li><li>The agent must complete verification or route the case to an appropriate escalation path.<\/li><li>Only a call satisfying the precondition is permitted to reach the refund backend.<\/li><\/ol>\n<p>A <code>PostToolUse<\/code> hook is appropriate for logging, auditing, or transforming results. It is too late to prevent an action that has already executed.<\/p>\n<p>The practical principle is straightforward: put mandatory preconditions in code at the point immediately before the protected operation.<\/p>", "docs": [["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks"], ["Claude Agent SDK — Hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"]]}, {"k": "3.24", "d": "d1", "title": "Improving Code Search Coverage with Exploration Subagents", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The review pipeline's coordinator delegates codebase investigation to exploration subagents, instructing each to run long, highly specific search queries, such as full function signatures with file paths. These searches frequently return zero matches, and reviews miss affected call sites. Which prompt-design change improves coverage?<\/p>", "c": [{"l": "A", "ok": false, "t": "Raise each subagent's tool-call budget so it can repeat its assigned specific query more times before returning a result.", "e": "Repeating a query that matches nothing will not discover additional results merely because the tool-call budget is higher. The problem is the overly restrictive query strategy, not the number of attempts."}, {"l": "B", "ok": false, "t": "Spawn additional exploration subagents so more variations of each highly specific query can run in parallel across the codebase.", "e": "More agents running variations of an overly narrow search can increase cost without addressing the underlying problem. The query strategy should improve before parallelism is increased."}, {"l": "C", "ok": false, "t": "Treat empty search results as retryable failures and have the coordinator resubmit the same query to a fresh subagent instance.", "e": "An empty result from a valid search is not necessarily a failure. It may accurately indicate that nothing matched the query. Resubmitting the same over-specific search risks reproducing the same empty result."}, {"l": "D", "ok": true, "t": "Instruct subagents to start with short, broad searches, then progressively narrow toward specific call sites based on findings.", "e": "Broad searches help an agent discover the codebase's actual structure and terminology. Once it has relevant findings, it can refine the queries to investigate particular call sites and dependencies."}], "o": "<p>The main principle is that <strong>early search is for discovery; later search is for confirmation<\/strong>.<\/p>\n<p>A query containing a full signature and an assumed file path may be too restrictive if the codebase uses different names, signatures, wrappers, or module layouts. An agent can execute such a query correctly and still miss relevant code because the search was designed around an incorrect assumption.<\/p>\n<p>A more reliable exploration sequence is:<\/p>\n<ol><li>Start with a short, broad query, such as a function name or distinctive symbol.<\/li><li>Inspect the matches and understand how the codebase is organized.<\/li><li>Follow references and related call sites.<\/li><li>Narrow subsequent queries based on actual findings.<\/li><li>Report remaining gaps explicitly when coverage cannot be confirmed.<\/li><\/ol>\n<p>The distractors address symptoms rather than the cause. More tool calls and more parallel agents do not repair a query strategy that excludes relevant results. Nor should a valid empty search be treated as a transient execution failure.<\/p>\n<p>The underlying lesson for orchestrated agents is to give subagents an exploration strategy that adapts to evidence instead of forcing them to begin with overly specific assumptions.<\/p>", "docs": [["Anthropic — How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system"], ["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "3.25", "d": "d3", "title": "Configuring MCP Tool Permissions for Unattended Reviews", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The review pipeline's <code>.mcp.json<\/code> configures three MCP servers: GitHub, Jira, and a coverage analyzer. Which TWO configuration steps should the team take so the servers' tools are usable in unattended review runs? <strong>(Select TWO.)<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "Write permission rules using the namespaced form <code>mcp__...<\/code>, which keeps same-named tools distinct.", "e": "Claude Code exposes MCP tools using names that include the server name, such as <code>mcp__github__list_issues<\/code>. Permission rules must use the tool names as Claude Code sees them. Namespacing also allows wildcard patterns such as <code>mcp__github__*<\/code>."}, {"l": "B", "ok": false, "t": "Rename any tools that share a name across servers so Claude Code does not merge them into one deduplicated definition.", "e": "Tools from different MCP servers are namespaced, so overlapping underlying tool names remain distinct. Renaming them is unnecessary for avoiding collisions."}, {"l": "C", "ok": true, "t": "Pre-approve the tools the pipeline needs through <code>allowedTools<\/code> entries, since unattended runs cannot answer interactive prompts.", "e": "Tool discovery and tool permission are separate concerns. A tool may be visible to the model but still require approval before execution. In an unattended CI job, the necessary tools must be approved in advance so execution does not wait for a human."}, {"l": "D", "ok": false, "t": "Defer each server's connection until the model first requests one of its tools, so tool catalogs load lazily on demand.", "e": "MCP servers are connected and their tool definitions are discovered when the server connection is established. The configuration does not require the model to request a tool before the server's catalog becomes available."}], "o": "<p>The key is to handle <strong>tool naming and permission approval as separate configuration requirements<\/strong>.<\/p>\n<p>MCP server configuration makes tools available for discovery, but unattended execution also needs appropriate permissions.<\/p>\n<ul><li><strong>Namespaced permission rules<\/strong> identify the correct tools, even when multiple servers expose tools with similar names.<\/li><li><strong>Pre-approved tools<\/strong> prevent permission prompts from blocking unattended CI jobs.<\/li><li><strong>Wildcard rules<\/strong> can be useful when a pipeline needs a defined family of tools, but they should be scoped narrowly enough to avoid granting unnecessary access.<\/li><li><strong>Server discovery<\/strong> is separate from the decision to approve a tool call.<\/li><\/ul>\n<p>For example, if a review job needs GitHub tools, a scoped permission pattern such as <code>mcp__github__*<\/code> can match tools exposed by the GitHub server. The team should grant only the tools required for its review workflow.<\/p>\n<p>The two selected choices ensure that the pipeline can identify the correct MCP tools and invoke approved tools without waiting for an interactive permission prompt.<\/p>", "docs": [["Claude Code — MCP", "https://code.claude.com/docs/en/mcp"], ["Claude Code — Permissions", "https://code.claude.com/docs/en/permissions"], ["Claude Code — Headless mode", "https://code.claude.com/docs/en/headless"]]}, {"k": "3.26", "d": "d1", "title": "Resuming a Session After Files Have Changed", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your workflow using custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>Two days ago, you ran a long named session that analyzed twelve files while diagnosing a race condition. Since then, a teammate modified two of those files; the rest of the analysis remains valid. What should you do when continuing the work?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resume the session and immediately run <code>/compact<\/code> so summarization removes the outdated file contents from the restored history.", "e": "Compaction compresses conversation history to save context space. It does not know which file contents have become outdated or automatically replace them with current versions. A summary can carry stale conclusions forward in condensed form."}, {"l": "B", "ok": true, "t": "Resume the session and name the two modified files, directing Claude to re-read them before relying on its earlier analysis.", "e": "A session preserves conversation history, not a live filesystem snapshot. Explicitly identifying the modified files and asking Claude to re-read them refreshes the relevant evidence while preserving the still-valid analysis of the other ten files."}, {"l": "C", "ok": false, "t": "Resume the session without extra instructions, since resumption restores a filesystem snapshot that refreshes stale file reads.", "e": "Session resumption restores the recorded conversation, including earlier tool results. It does not refresh file contents automatically, so the earlier reads of the two modified files remain in the conversation history."}, {"l": "D", "ok": false, "t": "Discard the session and start a fresh one, because modifying any previously read file invalidates the entire resumed context.", "e": "Starting fresh is appropriate when substantial portions of the previous investigation have become outdated. Here, only two of twelve files changed, so discarding all the useful analysis would be unnecessary."}], "o": "<p>A session is <strong>conversation history, not a filesystem snapshot<\/strong>. When a session resumes, earlier prompts, tool calls, tool results, and responses are restored as recorded. Editing a file does not retroactively update its earlier contents in the conversation.<\/p>\n<p>The recommended approach depends on how much has changed:<\/p>\n<ul><li><strong>A small number of files changed:<\/strong> Resume the session, identify the changed files, and re-read them.<\/li><li><strong>A substantial portion of the codebase changed:<\/strong> Consider starting a new session with a structured summary of the findings that remain valid.<\/li><li><strong>Context is getting too large:<\/strong> Use compaction to reduce context size, not as a mechanism for detecting stale evidence.<\/li><\/ul>\n<p>For this scenario, targeted re-reading preserves the valuable investigation while correcting the outdated information.<\/p>", "docs": [["Claude Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"], ["Claude Code — Memory and instruction files", "https://code.claude.com/docs/en/memory"]]}, {"k": "3.27", "d": "d2", "title": "Guaranteeing the First Tool Call", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>The agent must invoke <code>record_task<\/code> as its first action on every request, but runs sometimes begin with a <code>Grep<\/code> call or a plain-text reply instead. Which <code>tool_choice<\/code> setting on the first request guarantees the required first step?<\/p>", "c": [{"l": "A", "ok": false, "t": "Set <code>tool_choice<\/code> to <code>{\"type\": \"any\"}<\/code> on the initial request so a tool call is guaranteed.", "e": "The <code>any<\/code> setting requires a tool call, but the model still chooses which tool to invoke. It could select <code>Grep<\/code> rather than <code>record_task<\/code>."}, {"l": "B", "ok": true, "t": "Force the <code>record_task<\/code> tool with <code>{\"type\": \"tool\", \"name\": \"record_task\"}<\/code> on the initial request.", "e": "Forcing a specific named tool requires that particular tool call. It prevents both a plain-text response and an unrelated tool call from being the first action. Subsequent requests can return to <code>auto<\/code> so the agent regains flexibility."}, {"l": "C", "ok": false, "t": "Strengthen the <code>record_task<\/code> description to state that it runs before all other tools in every session.", "e": "Tool descriptions guide selection but do not guarantee execution order. Under automatic tool choice, the model can still select another tool or produce a text response."}, {"l": "D", "ok": false, "t": "Add a firm system prompt rule that <code>record_task<\/code> must always precede any other tool call.", "e": "Prompt instructions influence behavior but cannot guarantee compliance on every run. A mandatory first action requires an API-level constraint rather than stronger wording."}], "o": "<p>The <code>tool_choice<\/code> setting determines how much control the application has over tool invocation:<\/p>\n<ul><li><code>auto<\/code>: The model decides whether to call a tool and which one.<\/li><li><code>any<\/code>: A tool call is required, but the model chooses the tool.<\/li><li>A forced named tool: The specified tool must be called.<\/li><\/ul>\n<p>Because the requirement is not merely that <em>some<\/em> tool run, but that <code>record_task<\/code> runs first, forcing the named tool is the appropriate solution.<\/p>\n<p>The broader principle is that prompts and tool descriptions influence behavior probabilistically, while API-level constraints can enforce mandatory invocation requirements.<\/p>", "docs": [["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Claude Agent SDK — TypeScript reference", "https://platform.claude.com/docs/en/agent-sdk/typescript"]]}, {"k": "3.28", "d": "d1", "title": "Handling a Subagent Failure in a Hub-and-Spoke Workflow", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your workflow using custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A coordinator delegates work to an API-extraction subagent and a documentation-writing subagent. The extraction subagent hits an unrecoverable parsing failure mid-task. In a hub-and-spoke design, how should this failure be handled?<\/p>", "c": [{"l": "A", "ok": true, "t": "Return the error with context to the coordinator, which can retry, delegate elsewhere, or continue with partial results.", "e": "The coordinator owns error handling and routing. Returning the failure with enough context lets the coordinator decide whether to retry, delegate the work to another agent, or continue while documenting the missing information."}, {"l": "B", "ok": false, "t": "Terminate the entire workflow immediately so no downstream subagent operates on incomplete extraction output.", "e": "Aborting the entire workflow on one failure discards completed work unnecessarily. The coordinator may be able to continue with partial results while explicitly documenting the gap."}, {"l": "C", "ok": false, "t": "Have the extraction subagent notify the documentation subagent directly so it can adapt its plan around the missing analysis.", "e": "This bypasses the hub-and-spoke architecture. In this design, subagents report results and failures through the coordinator rather than communicating directly with sibling subagents."}, {"l": "D", "ok": false, "t": "Have the extraction subagent return an empty result marked successful so the workflow continues without interruption.", "e": "Silently converting a failure into an empty success hides the problem. The coordinator cannot distinguish a genuine absence of API data from a failed extraction, potentially causing downstream work to rely on incomplete information."}], "o": "<p>In a hub-and-spoke architecture, the coordinator has three central responsibilities:<\/p>\n<ol><li>Decompose the task and delegate work.<\/li><li>Aggregate the results returned by subagents.<\/li><li>Handle errors and determine the appropriate recovery strategy.<\/li><\/ol>\n<p>The coordinator has the broadest view of the workflow, so failures should be returned to it with enough context to support a decision.<\/p>\n<p>A failure does not necessarily require aborting the entire workflow. The coordinator can retry the task, route it elsewhere, or continue with partial results while explicitly identifying the missing information.<\/p>\n<p><strong>Never disguise a failed task as a successful empty result.<\/strong> Observability and accurate status reporting are essential to reliable orchestration.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "3.29", "d": "d4", "title": "Choosing custom_id Values for Message Batches", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>A nightly job submits thousands of documentation-generation requests as one Message Batch, one request per source file. When designing the <code>custom_id<\/code> scheme for these requests, which TWO design decisions are correct? <strong>(Select TWO.)<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "Assign each request a <code>custom_id<\/code> that is unique within the batch, so no two requests in one submission share a value.", "e": "The Message Batches API requires each request's <code>custom_id<\/code> to be unique within a batch. Duplicate values would make it ambiguous which source request a returned result belongs to."}, {"l": "B", "ok": true, "t": "Generate the identifier in your own code at submission time and use it to map each returned result back to its source file.", "e": "The developer supplies <code>custom_id<\/code> when submitting each request. When results are retrieved, the identifier allows the pipeline to associate each response with its originating source file."}, {"l": "C", "ok": false, "t": "Omit <code>custom_id<\/code> on each request and rely on the API to generate one automatically in the batch creation response for later matching.", "e": "The API expects the developer to provide <code>custom_id<\/code> for each request. It does not generate this correlation key automatically on the developer's behalf."}, {"l": "D", "ok": false, "t": "Use each file's full repository path, slashes included, as its <code>custom_id<\/code>, since any UTF-8 string up to 256 characters is accepted.", "e": "The <code>custom_id<\/code> format is restricted. It must contain 1–64 characters matching <code>^[a-zA-Z0-9_-]{1,64}$<\/code>. Slashes and other unsupported characters are rejected, so raw repository paths cannot be used directly."}], "o": "<p>A Message Batch can contain thousands of requests, and returned results are not guaranteed to arrive in submission order. Therefore, each request needs a reliable correlation key.<\/p>\n<p>The correct design has two properties:<\/p>\n<ol><li><strong>Uniqueness:<\/strong> Every request in a batch has a distinct <code>custom_id<\/code>.<\/li><li><strong>Developer ownership:<\/strong> Your application generates the identifier and maintains the mapping back to the original source file.<\/li><\/ol>\n<p>For example, the application could generate a compliant identifier from a sanitized file key or a hash of the repository path, while maintaining a mapping such as:<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><code>custom_id<\/code><\/th><th>Original source<\/th><\/tr><\/thead><tbody><tr><td><code>doc_a82f10<\/code><\/td><td><code>src/api/customer.ts<\/code><\/td><\/tr><tr><td><code>doc_b731c4<\/code><\/td><td><code>src/api/orders.ts<\/code><\/td><\/tr><tr><td><code>doc_c901de<\/code><\/td><td><code>src/services/refunds.ts<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>These values are illustrative. Your application must generate the actual identifiers and maintain the corresponding mapping.<\/p>\n<p>The key distinction is between <code>custom_id<\/code>, which your code supplies to correlate results, and the server-generated message ID, which identifies a message but does not inherently identify the source file in your pipeline.<\/p>", "docs": [["Anthropic API — Message Batches", "https://platform.claude.com/docs/en/build-with-claude/message-batches"], ["Anthropic API — Create a Message Batch", "https://platform.claude.com/docs/en/api/beta/messages/batches/create"]]}, {"k": "3.30", "d": "d3", "title": "Choosing Direct Execution for a Small, Well-Understood Fix", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>While maintaining the agent's codebase in Claude Code, a stack trace pinpoints an off-by-one error in the parser that handles <code>lookup_order<\/code> results; the fix is confined to one function you understand well. How should you carry out this change?<\/p>", "c": [{"l": "A", "ok": true, "t": "Ask Claude to make the fix directly, then run the relevant tests to confirm the behavior.", "e": "The stack trace has already localized the bug, and the change is limited to a function whose behavior is understood. Direct execution avoids unnecessary planning overhead, while testing verifies that the correction works."}, {"l": "B", "ok": false, "t": "Split the work into a planning phase for investigation and a separate execution phase for the edit.", "e": "Separating investigation and execution is valuable for larger tasks with substantial uncertainty. Here, the cause and scope are already understood, so a separate planning phase adds unnecessary process."}, {"l": "C", "ok": false, "t": "Enter plan mode so Claude explores the codebase and produces a plan you approve before editing.", "e": "Plan mode is most useful when the approach is uncertain, the change spans multiple files, or the codebase is unfamiliar. None of those conditions applies to this localized, diagnosed bug."}, {"l": "D", "ok": false, "t": "Delegate the investigation to an Explore subagent so discovery output stays out of the main context.", "e": "Explore subagents are useful when a task requires substantial codebase investigation. The stack trace already identifies the relevant function, so there is no large discovery phase that needs to be isolated."}], "o": "<p>The decision between plan mode and direct execution depends on <strong>uncertainty, scope, and familiarity<\/strong>.<\/p>\n<p>Plan mode is appropriate when Claude must explore an unfamiliar codebase, evaluate alternative approaches, or coordinate a change across multiple files. It allows the developer to review the proposed approach before implementation begins.<\/p>\n<p>Direct execution is appropriate when the problem is clearly diagnosed and the change is small enough to describe precisely. A one-function off-by-one fix is a good example.<\/p>\n<p>A reliable direct-execution workflow is:<\/p>\n<ol><li>Identify the failing behavior and relevant function.<\/li><li>Ask Claude to make the smallest appropriate correction.<\/li><li>Run the relevant tests.<\/li><li>Review the diff and test results.<\/li><\/ol>\n<p>Skipping plan mode does not mean skipping verification. It simply avoids a planning step that would add little value for a well-understood change.<\/p>", "docs": [["Claude Code — Common workflows", "https://code.claude.com/docs/en/common-workflows"], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code — Permission modes", "https://code.claude.com/docs/en/permissions"]]}, {"k": "3.31", "d": "d4", "title": "Improve Consistency with Targeted Few-Shot Examples", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>In testing, the request <em>“my order arrived broken”<\/em> sometimes triggers an immediate <code>process_refund<\/code> and sometimes a <code>lookup_order<\/code> investigation first. Detailed prompt instructions have not made the behavior consistent. What change most reliably fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add ten or more examples covering every request phrasing the team has logged so the agent can match new messages to prior cases.", "e": "This treats few-shot prompting like a lookup table. Large numbers of examples can bloat the context and dilute the most useful demonstrations, while still failing on phrasings that have never appeared in the logs. A small, targeted set is more useful than exhaustive coverage."}, {"l": "B", "ok": false, "t": "Add examples of clear-cut requests only, since ambiguous cases would teach the model conflicting patterns it cannot generalize from.", "e": "The examples should focus on the cases the agent struggles with. Clear-cut requests are already handled consistently; ambiguous examples demonstrate how to make decisions at the difficult boundary. With clear rationales, these examples teach a consistent rule rather than conflicting patterns."}, {"l": "C", "ok": false, "t": "Add examples showing only the final tool call for each request type, keeping them short so they do not dilute the system prompt.", "e": "Showing only the final tool call demonstrates the output format but not the decision-making principle. Without explaining why one action was selected over a plausible alternative, the agent may remain inconsistent on new ambiguous requests."}, {"l": "D", "ok": true, "t": "Add 3–5 examples of ambiguous requests, each showing the chosen tool sequence with a rationale for rejecting the plausible alternative.", "e": "Targeted examples teach judgment that prose instructions may not convey reliably. Showing the tool sequence and explaining why another action was rejected helps Claude learn the decision boundary and apply it to unfamiliar requests."}], "o": "<p>This is a <strong>judgment-boundary problem<\/strong>, not a formatting problem. “My order arrived broken” could justify an investigation before a refund, depending on the order details and the circumstances. A rule such as “investigate before refunding” expresses a goal, but may not consistently resolve borderline cases.<\/p>\n<p>A practical approach is to provide <strong>3–5 diverse examples<\/strong> that concentrate on ambiguous situations. Each should include:<\/p>\n<ul><li>The user's request.<\/li><li>The appropriate tool sequence.<\/li><li>The reason for choosing that sequence.<\/li><li>Why the plausible alternative is not appropriate.<\/li><\/ul>\n<p>For example, the agent might call <code>lookup_order<\/code> first because it needs to confirm the order and understand the reported damage before issuing a refund. The rationale teaches the decision principle, rather than encouraging memorization of exact wording.<\/p>\n<p>Use examples alongside explicit rules, keep them relevant, and structure them clearly—for example, with <code>&lt;example&gt;<\/code> tags. Examples guide the model within the context in which they are supplied; they do not retrain the model's weights or automatically persist into future sessions.<\/p>\n<p><strong>Quick revision:<\/strong> When detailed instructions produce inconsistent decisions, add a few carefully chosen examples of the <em>ambiguous cases<\/em>, with both the chosen action and the rationale.<\/p>", "docs": [["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"], ["Anthropic — Use examples (few-shot prompting)", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting"]]}, {"k": "3.32", "d": "d2", "title": "Share MCP Configuration Without Committing Secrets", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>The team wants a shared ticketing MCP server available to every engineer on the project, but the server needs an API token that must never be committed. Which <strong>TWO<\/strong> configuration steps are correct?<\/p>", "c": [{"l": "A", "ok": false, "t": "Paste each engineer's token value directly into the committed <code>.mcp.json<\/code> since the repository is private.", "e": "A private repository is not a safe place to commit live credentials. Secrets can remain in Git history and become accessible through repository permissions, forks, mirrors, or other exposure paths. Each engineer's secret should remain outside version control."}, {"l": "B", "ok": true, "t": "Add the server entry to <code>.mcp.json<\/code> at the project root and check that file into version control.", "e": "Project-scoped MCP configuration allows the team to share a server definition through the repository. Contributors can obtain the same configuration when they work with the project, rather than recreating it manually."}, {"l": "C", "ok": false, "t": "Have each engineer add the server to <code>~/.claude.json<\/code> and follow setup steps documented in the team wiki.", "e": "User-level configuration is suited to an individual's own servers. Requiring everyone to reproduce shared project configuration manually creates drift and makes updates harder to distribute reliably."}, {"l": "D", "ok": true, "t": "Reference the token in the environment block as <code>${TICKETS_TOKEN}<\/code>, expanded from each engineer's environment.", "e": "Environment-variable expansion lets the shared configuration refer to a secret without storing its value in the repository. Each engineer supplies their own token through their environment."}], "o": "<p>The key is to separate <strong>shared configuration<\/strong> from <strong>private credentials<\/strong>.<\/p>\n<p>For project-wide tooling, put the MCP server definition in the project's <code>.mcp.json<\/code> and commit the configuration. The team shares the server's settings, while each person supplies their own secret through an environment variable such as <code>TICKETS_TOKEN<\/code>.<\/p>\n<p>Conceptually, the configuration references the variable rather than embedding a live token:<\/p>\n<pre><code class=\"lang-json\">{\n  \"mcpServers\": {\n    \"tickets\": {\n      \"command\": \"your-server-command\",\n      \"args\": [],\n      \"env\": {\n        \"TICKETS_TOKEN\": \"${TICKETS_TOKEN}\"\n      }\n    }\n  }\n}<\/code><\/pre>\n<p>This is an illustrative configuration pattern; replace the command and arguments with the actual server's settings.<\/p>\n<p>Hardcoding a token creates a security risk, even if the repository is private. Putting shared settings only in each engineer's personal configuration also defeats the goal of centrally maintained project configuration.<\/p>\n<p><strong>Quick revision:<\/strong> <strong>Project-wide server → committed project <code>.mcp.json<\/code>; secret token → environment variable.<\/strong> Share the configuration, not the credential.<\/p>", "docs": [["Anthropic — Connect Claude Code to tools via MCP", "https://docs.anthropic.com/en/docs/claude-code/mcp"]]}, {"k": "3.33", "d": "d2", "title": "Reduce Discovery Overhead with MCP Resources", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>During each pull request review, the agent spends several tool calls listing available lint rule sets, database schemas, and API documentation pages before it examines any code. Which design change best reduces this discovery overhead?<\/p>", "c": [{"l": "A", "ok": true, "t": "Publish the lint rule index, schema listings, and documentation hierarchy as MCP resources the agent reads directly.", "e": "MCP resources are designed to expose readable contextual information. The agent can access catalogs directly instead of repeatedly discovering their contents through exploratory tool calls."}, {"l": "B", "ok": false, "t": "Add a <code>list_available_inventory<\/code> tool that the agent must call once per review to fetch the full catalog in one response.", "e": "A custom tool can technically return the information, but it duplicates a capability MCP resources are designed to provide. It also adds another tool for the model to select and use."}, {"l": "C", "ok": false, "t": "Hard-code the current lint rules, schema names, and documentation index into <code>CLAUDE.md<\/code> so they load with every session.", "e": "Static catalogs can become outdated when rules, schemas, or documentation change. They also consume context even when a review does not need all that information."}, {"l": "D", "ok": false, "t": "Raise the per-review tool-call budget so the discovery phase can complete before the review's turn limit is reached.", "e": "Increasing the budget treats the symptom instead of removing the cause. The agent still spends time and context rediscovering information, which slows reviews and leaves less room for actual code analysis."}], "o": "<p>MCP provides two complementary ways to connect an agent to external systems:<\/p>\n<ul><li><strong>Tools<\/strong> perform actions, such as creating a ticket, querying a service, or running an operation.<\/li><li><strong>Resources<\/strong> expose information for the agent to read, such as schemas, indexes, and documentation.<\/li><\/ul>\n<p>Lint catalogs, database schemas, and documentation hierarchies are naturally suited to resources. Instead of spending multiple calls discovering which resources exist before each review, the agent can access the relevant catalog directly.<\/p>\n<p>This also avoids embedding a static copy of every catalog in <code>CLAUDE.md<\/code>, where it could become stale and inflate every session. A custom inventory tool may work, but it duplicates a protocol primitive intended for readable contextual data.<\/p>\n<p>In a CI/CD pipeline, this optimization can reduce latency and conserve context for the core task: analyzing the pull request and producing useful findings.<\/p>\n<p><strong>Quick revision:<\/strong> <strong>Repeatedly discovered reference data → MCP resources.<\/strong> Tools are for actions; resources are for readable context.<\/p>", "docs": [["Anthropic — Connect Claude Code to tools via MCP", "https://docs.anthropic.com/en/docs/claude-code/mcp"], ["Model Context Protocol — Resources", "https://modelcontextprotocol.io/docs/concepts/resources"]]}, {"k": "3.34", "d": "d4", "title": "Normalize Dates Before Structured Extraction", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>The agent extracts a structured dispute record before calling <code>lookup_order<\/code>. The <code>purchase_date<\/code> field always passes schema validation, yet values arrive as <code>\"yesterday\"<\/code>, <code>\"early last week\"<\/code>, or <code>\"03/04/2025\"<\/code>, and order lookups fail or return the wrong orders. What is the most effective fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Tighten the schema by adding <code>minLength<\/code> and <code>maxLength<\/code> constraints so malformed date strings are rejected at validation.", "e": "The source explains that structured outputs support only a subset of JSON Schema, and these string constraints may be unsupported. More fundamentally, string-length validation cannot convert relative language such as “yesterday” into an absolute date."}, {"l": "B", "ok": true, "t": "Add prompt normalization rules: resolve relative dates against the current date provided in context and output ISO 8601.", "e": "Normalization requires semantic interpretation, not just structural validation. The model needs a reference date and an explicit rule to convert relative expressions into an absolute date and use a consistent format."}, {"l": "C", "ok": false, "t": "Post-process the extracted dates with a natural-language date-parsing library that converts whatever text the model returned.", "e": "A downstream parser may not have access to the full conversation context needed to interpret phrases such as “early last week.” Numeric dates can also be ambiguous across regional conventions. Post-processing can be useful as validation or a fallback, but it does not replace context-aware normalization."}, {"l": "D", "ok": false, "t": "Set the sampling temperature to zero so the model formats the date field identically on every extraction.", "e": "Temperature affects sampling randomness; it does not establish a date convention. Without explicit normalization rules, the model may consistently reproduce the user's original date wording rather than produce the required format."}], "o": "<p>The distinction is between <strong>structure<\/strong> and <strong>meaning<\/strong>.<\/p>\n<p>A schema can require a field to exist and be a string. That does not guarantee the string represents a valid, unambiguous date in the format required by <code>lookup_order<\/code>.<\/p>\n<p>The prompt should specify:<\/p>\n<ol><li>The current date to use as the reference point.<\/li><li>How to resolve relative expressions such as “yesterday” and “early last week.”<\/li><li>The required output format, such as ISO 8601 with a <code>YYYY-MM-DD<\/code> date.<\/li><li>How to handle ambiguous numeric dates, such as <code>03/04/2025<\/code>, when the intended month and day cannot be determined reliably.<\/li><\/ol>\n<p>For example, if the supplied reference date is 2025-03-05, “yesterday” should normalize to <code>2025-03-04<\/code>. The model should not guess when the context does not disambiguate a numeric date; the prompt should specify when to ask for clarification or mark the value as unresolved.<\/p>\n<p>Schemas remain valuable for enforcing the output's structure. Prompt rules handle the semantic transformation, and application-side validation can then reject impossible or unresolved dates before a backend lookup.<\/p>\n<p><strong>Quick revision:<\/strong> <strong>Schema = structure; prompt = semantic normalization; application validation = final safety check.<\/strong> Supply a reference date and an explicit output convention.<\/p>", "docs": [["Anthropic — Structured outputs", "https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs"], ["Anthropic — Define tools", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview"]]}, {"k": "3.35", "d": "d4", "title": "Restore Recall by Separating Finding from Filtering", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>The team's automated review pass over Claude-generated refactors is prompted to <em>“only report findings you are highly confident about.”<\/em> Precision looks good, but real defects now slip through unreported. What change best restores recall while keeping noise manageable?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run the conservative review pass three times per change and report the union of findings across the runs.", "e": "Repeating the same conservative pass increases cost without fixing its underlying instruction. Findings the model systematically suppresses may remain absent from all three runs."}, {"l": "B", "ok": true, "t": "Report every finding with a self-rated confidence level, moving the confidence threshold into a downstream filter step.", "e": "This separates discovery from selection. The review pass aims for coverage and attaches confidence information; a downstream filter applies explicit thresholds to decide which findings to surface, verify, deduplicate, or discard."}, {"l": "C", "ok": false, "t": "Keep self-filtering in the prompt but lower the bar from “highly confident” to “reasonably confident” findings.", "e": "“Reasonably confident” is still a vague threshold that the model must interpret internally. It may change the number of findings without making the cutoff consistent or measurable."}, {"l": "D", "ok": false, "t": "Add a prompt instruction telling the model to prioritize recall over precision when deciding what to report.", "e": "This is another abstract directive rather than an operational decision rule. It does not specify which findings to include or how uncertain findings should be handled."}], "o": "<p>Precision and recall describe different objectives:<\/p>\n<ul><li><strong>Precision:<\/strong> Of the findings reported, how many are real?<\/li><li><strong>Recall:<\/strong> Of the real defects that exist, how many does the review identify?<\/li><\/ul>\n<p>An instruction such as “only report findings you are highly confident about” encourages the model to suppress uncertain findings. That can improve precision while reducing recall—the exact failure described in this scenario.<\/p>\n<p>A more controllable design separates the process into two stages:<\/p>\n<p><strong>Stage 1 — Find and describe possible issues.<\/strong> Ask the review pass to report all plausible findings, including lower-confidence ones, and attach a confidence level and useful supporting evidence.<\/p>\n<p><strong>Stage 2 — Filter and verify.<\/strong> Use a downstream step with explicit criteria to decide which findings to show, verify further, deduplicate, or discard. Thresholds can be tuned using real review outcomes rather than relying entirely on the model's interpretation of words like “highly” or “reasonably.”<\/p>\n<p>This design restores coverage without requiring every low-confidence finding to be shown directly to developers. It also makes the review process easier to measure and improve over time. Self-reported confidence should be treated as a useful ranking signal, not a guarantee of correctness.<\/p>\n<p>The alternatives leave the same in-prompt suppression problem in place: softer wording remains vague, and repeated runs are expensive without reliably recovering systematically suppressed defects.<\/p>\n<p><strong>Quick revision:<\/strong> <strong>Find broadly first; filter explicitly afterward.<\/strong> If recall matters, don't ask the model to silently discard uncertain findings before they can be evaluated.<\/p>", "docs": [["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"], ["Anthropic — Claude Code documentation", "https://docs.anthropic.com/en/docs/claude-code/overview"]]}, {"k": "3.36", "d": "d1", "title": "Understand Subagent Context Isolation", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A CI pipeline delegates test-suite execution to a subagent while the coordinator continues the review. Which design decisions correctly account for the subagent's context behavior? <strong>Choose two.<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "Have the subagent execute the tests within its own context and return only its final message to the parent conversation.", "e": "The subagent's intermediate tool calls and results remain in its own context window. The parent receives the subagent's final response, rather than every raw command result and test log. This keeps verbose output from bloating the coordinator's context."}, {"l": "B", "ok": false, "t": "Keep review instructions only in the main conversation's system prompt, expecting them to carry over to the subagent.", "e": "A subagent does not automatically inherit the parent's entire system prompt. Instructions that the subagent must follow need to be included in its own definition or passed explicitly through the delegation prompt."}, {"l": "C", "ok": true, "t": "Put conventions the subagent must always follow into the project <code>CLAUDE.md<\/code>, which custom subagents load at startup.", "e": "Custom subagents can load the project's <code>CLAUDE.md<\/code> hierarchy, allowing stable project-wide conventions to be shared without repeating them in every delegation prompt. The documented built-in Explore and Plan agents are exceptions that skip this context to keep research inexpensive."}, {"l": "D", "ok": false, "t": "Omit earlier tool results from the delegation prompt, since the subagent automatically sees them within the same session.", "e": "A non-fork subagent starts with a fresh conversation context. It cannot automatically see the parent's prior messages or tool results. Relevant findings must be passed explicitly."}], "o": "<p>The central concept is <strong>context isolation with an explicit handoff<\/strong>.<\/p>\n<p>A non-fork subagent operates as a separate agent instance. Its context includes its own system prompt, task prompt, tool definitions, applicable project instructions, and environment information. It does not automatically inherit the parent's conversation history, tool results, or system prompt.<\/p>\n<p>This architecture provides two benefits:<\/p>\n<ul><li><strong>Context efficiency:<\/strong> Large test logs and intermediate results remain outside the main review conversation.<\/li><li><strong>Focused execution:<\/strong> The subagent receives the instructions and tools relevant to its assigned task.<\/li><\/ul>\n<p>Use <code>CLAUDE.md<\/code> for stable project conventions. Use the delegation prompt for task-specific findings, previous results, file paths, and requirements that the subagent would not otherwise know.<\/p>\n<p><strong>Quick revision:<\/strong> A subagent starts fresh. Share stable project rules through <code>CLAUDE.md<\/code>, task-specific knowledge through the delegation prompt, and detailed results through the final response.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://docs.anthropic.com/en/docs/claude-code/sdk"], ["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents"]]}, {"k": "3.37", "d": "d1", "title": "Return All Tool Results Correctly", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>Your custom agent loop built on the Messages API receives a billing-dispute response with <code>stop_reason: \"tool_use\"<\/code> containing two <code>tool_use<\/code> blocks: <code>get_customer<\/code> and <code>lookup_order<\/code>. How should the loop return the outputs so the next iteration proceeds correctly?<\/p>", "c": [{"l": "A", "ok": false, "t": "Execute only the first requested tool and return its result; Claude will re-request the remaining tool on the next iteration.", "e": "Every <code>tool_use<\/code> block must be answered. If the loop returns only one result, the other tool call remains unresolved. Claude does not automatically reissue a dropped tool request."}, {"l": "B", "ok": false, "t": "Execute both tools, then return the results in an assistant message, since tool outputs belong to Claude's turn of the history.", "e": "Tool results must be returned in a user message. The assistant message contains Claude's tool requests; the subsequent user message supplies the results from executing those requests."}, {"l": "C", "ok": false, "t": "Execute both tools, then send two consecutive user messages, each carrying one <code>tool_result<\/code>, in the order the calls appeared.", "e": "The tool results need to immediately follow the corresponding assistant tool-use request in the conversation sequence. Splitting the results across separate user messages breaks the required protocol structure."}, {"l": "D", "ok": true, "t": "Execute both tools, then send a single user message with one <code>tool_result<\/code> block per call, each matched by <code>tool_use_id<\/code>.", "e": "Each result is associated with its original tool request through the matching <code>tool_use_id<\/code>. Both results are returned together in one user message, allowing Claude to continue with the combined information."}], "o": "<p>Claude can request multiple tool calls in one assistant response. Your application must execute every requested call and return the corresponding results in the format the Messages API expects.<\/p>\n<p>The correct sequence is:<\/p>\n<ol><li>Receive Claude's assistant response containing both <code>tool_use<\/code> blocks.<\/li><li>Execute <code>get_customer<\/code> and <code>lookup_order<\/code>, either concurrently or sequentially.<\/li><li>Create one <code>tool_result<\/code> block for each tool call.<\/li><li>Match each result to the corresponding call using its <code>tool_use_id<\/code>.<\/li><li>Place both result blocks in a single user message, before any additional text.<\/li><li>Send the updated conversation back to Claude.<\/li><\/ol>\n<p>Illustrative message structure:<\/p>\n<pre><code class=\"lang-json\">{\n  \"role\": \"user\",\n  \"content\": [\n    {\n      \"type\": \"tool_result\",\n      \"tool_use_id\": \"toolu_customer\",\n      \"content\": \"Customer account details...\"\n    },\n    {\n      \"type\": \"tool_result\",\n      \"tool_use_id\": \"toolu_order\",\n      \"content\": \"Order details...\"\n    }\n  ]\n}<\/code><\/pre>\n<p>The IDs and result text above are illustrative. In a real implementation, use the actual IDs returned by Claude and the actual outputs from your tools.<\/p>\n<p><strong>Quick revision:<\/strong> Every <code>tool_use<\/code> needs a matching <code>tool_result<\/code>. Return all results together in one user message and match them using <code>tool_use_id<\/code>.<\/p>", "docs": [["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview"], ["Anthropic — Messages API", "https://docs.anthropic.com/en/api/messages"]]}, {"k": "3.38", "d": "d4", "title": "Generalize Decisions with Contrasting Examples", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, along with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>Prose rules telling the agent whether a legacy code pattern is safe to auto-modernize keep failing on patterns the rules never anticipated. How should the team change the prompt so the judgment transfers to unanticipated patterns?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add the examples once in a calibration session so the model's learned behavior persists and future sessions handle new patterns.", "e": "Prompt examples do not train the model's weights. They influence behavior when included in the current request context, but they do not automatically persist as learned behavior across future sessions."}, {"l": "B", "ok": true, "t": "Add contrasting safe and unsafe examples with reasoning shown, so the model generalizes the decision boundary to novel patterns.", "e": "Contrasting examples demonstrate both sides of a decision. Including reasoning shows why one pattern is safe and another is not, helping Claude generalize the underlying principle to unfamiliar cases."}, {"l": "C", "ok": false, "t": "Add an example for every known legacy pattern so the model can match each incoming case to its nearest documented example.", "e": "This treats examples as a lookup table. Exhaustively documenting known cases consumes context and still leaves new patterns uncovered. A small, diverse set of carefully reasoned examples is more useful for demonstrating the decision boundary."}, {"l": "D", "ok": false, "t": "Remove the prose rules and rely on well-chosen examples alone, since demonstrations fully replace explicit decision criteria.", "e": "Examples complement explicit criteria rather than replace them. The criteria define the operational rules; the examples demonstrate how to apply them in real or ambiguous cases."}], "o": "<p>Few-shot prompting works through <strong>generalization<\/strong>, not memorization of a case list.<\/p>\n<p>If a legacy pattern is safe to modernize only when certain conditions hold, a strong prompt should explain those conditions and demonstrate them with examples. Include examples of both safe and unsafe patterns, with the decision and reasoning for each.<\/p>\n<p>A useful set might contain three to five examples that vary the pattern while keeping the relevant decision criteria clear. This teaches the agent what distinguishes safe transformations from changes that require human review.<\/p>\n<p>The examples should not replace explicit rules. Instead, the rules provide the standard and the examples show how that standard applies. Include the examples whenever the model needs them; a previous calibration session alone will not make the behavior persist.<\/p>\n<p><strong>Quick revision:<\/strong> Use a small set of contrasting examples with reasoning. Teach the decision boundary, not an exhaustive list of known cases.<\/p>", "docs": [["Anthropic — Use examples (multishot prompting)", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting"], ["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"]]}, {"k": "3.39", "d": "d4", "title": "Meet a Delivery SLA with Message Batches", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>The team commits to delivering batch-generated codebase analysis reports within 30 hours of an engineer's request, using the Message Batches API. Which <strong>TWO<\/strong> statements about batch submission cadence are accurate?<\/p>", "c": [{"l": "A", "ok": true, "t": "Requests must be submitted within 6 hours of arrival, since batch processing alone can consume 24 of the 30 hours.", "e": "The total delivery budget is 30 hours, and processing may take up to 24 hours. Therefore, at most six hours can be spent accumulating requests before submission:"}, {"l": "B", "ok": false, "t": "Accumulating requests into one daily batch is safe because most batches complete far sooner than the 24-hour maximum.", "e": "An SLA must be planned around the worst case, not typical completion time. A request could wait almost 24 hours for the next daily batch and then take up to another 24 hours to process, reaching nearly 48 hours."}, {"l": "C", "ok": false, "t": "Submitting batches overnight shortens processing time enough that a 12-hour accumulation window still meets the commitment.", "e": "The documented processing window does not guarantee faster completion overnight. Twelve hours of accumulation plus up to 24 hours of processing totals 36 hours, exceeding the 30-hour commitment."}, {"l": "D", "ok": true, "t": "Submitting accumulated requests every 4 hours caps the worst case at 28 hours: 4 of accumulation plus 24 of processing.", "e": "A request arriving just after a batch submission waits at most four hours for the next submission. Adding the maximum 24-hour processing window yields 28 hours, leaving a two-hour margin."}], "o": "<p>The Message Batches API is designed for asynchronous workloads and offers a cost advantage, but the team must account for its processing window when setting delivery commitments.<\/p>\n<p>The basic formula is:<\/p>\n<div class=\"formula\">Worst-case latency = Maximum accumulation delay + Maximum processing time<\/div>\n<p>For a 30-hour SLA and a 24-hour processing window:<\/p>\n<div class=\"formula\">Maximum accumulation delay = 30 − 24 = 6 hours<\/div>\n<p>A four-hour submission cadence is safer than using the entire six-hour allowance because it leaves two hours of headroom for operational issues, retries, or resubmissions.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Submission cadence<\/th><th>Worst-case total<\/th><th>Meets 30-hour SLA?<\/th><\/tr><\/thead><tbody><tr><td>Every 4 hours<\/td><td>28 hours<\/td><td>Yes<\/td><\/tr><tr><td>Every 6 hours<\/td><td>30 hours<\/td><td>At the limit<\/td><\/tr><tr><td>Every 12 hours<\/td><td>36 hours<\/td><td>No<\/td><\/tr><tr><td>Once daily<\/td><td>Nearly 48 hours<\/td><td>No<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The essential lesson is to plan around documented worst-case bounds rather than assuming that most batches finish early.<\/p>\n<p><strong>Quick revision:<\/strong> For a 30-hour commitment and up to 24 hours of batch processing, submit requests within six hours. A four-hour cadence provides two hours of headroom.<\/p>", "docs": [["Anthropic — Message Batches API", "https://docs.anthropic.com/en/docs/build-with-claude/message-batches"]]}, {"k": "3.40", "d": "d4", "title": "Fix Severity Bias in Few-Shot Examples", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>Since adding three few-shot examples to the review prompt, output formatting is finally consistent, but nearly every finding is now rated critical; all three examples happened to show critical security issues. What is the right fix?<\/p>", "c": [{"l": "A", "ok": true, "t": "Replace the examples with a diverse set spanning multiple severity levels and issue types, keeping the format identical.", "e": "Examples teach both the intended output format and patterns that appear repeatedly in the demonstrations. Varying severity and issue type while keeping the structure consistent teaches the model the complete decision space without losing formatting consistency."}, {"l": "B", "ok": false, "t": "Add an instruction stating that severity must be judged from the code itself, independent of the severity shown in examples.", "e": "The instruction competes with a concrete pattern demonstrated by every example. Because all examples show critical findings, the examples themselves reinforce the skew. Correcting the demonstrations is more direct and reliable."}, {"l": "C", "ok": false, "t": "Remove the few-shot examples and rely on detailed severity criteria in prose, since the examples are biasing outputs.", "e": "Removing examples may undo the formatting consistency they established. The issue is not that few-shot prompting is inherently unsuitable; it is that the examples are too homogeneous. Diversify them instead."}, {"l": "D", "ok": false, "t": "Wrap each example in XML example tags so Claude treats them as format illustrations rather than content to imitate.", "e": "XML tags can help distinguish examples from instructions, but they do not neutralize the examples' content. If every example contains a critical issue, the model may still infer that critical severity is the expected pattern."}], "o": "<p>Few-shot examples teach the model through the patterns they share. Those patterns may include details the prompt author did not intend to teach.<\/p>\n<p>In this scenario, the examples successfully demonstrate the desired output format, but they also all share one feature: <strong>critical severity<\/strong>. The model may generalize that severity level as part of the expected answer.<\/p>\n<p>The right approach is to preserve the successful structure while making the example set more representative:<\/p>\n<ul><li>Include multiple severity levels, such as low, medium, high, and critical, where those levels match the team's rubric.<\/li><li>Cover different issue types, such as correctness bugs, maintainability problems, and security vulnerabilities.<\/li><li>Keep the output structure consistent across examples—for example, location, issue description, severity, and suggested fix.<\/li><li>Ensure the assigned severity in each example follows explicit severity criteria.<\/li><\/ul>\n<p>This teaches both <em>how to format<\/em> the finding and <em>how to judge<\/em> its severity.<\/p>\n<p>Adding more prose does not correct the contradictory signal from homogeneous examples, and tagging the examples does not remove their content. Removing examples altogether sacrifices a technique that was already improving consistency.<\/p>\n<p><strong>Quick revision:<\/strong> When examples cause output bias, diversify the examples while preserving the format. The model learns from repeated content as well as repeated structure.<\/p>", "docs": [["Anthropic — Use examples (multishot prompting)", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting"], ["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"]]}, {"k": "3.41", "d": "d1", "title": "Preserve File Attribution in Multi-Agent Handoffs", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A documentation subagent's prompt concatenates code excerpts from twelve files, with all file paths listed together at the end. Its generated documentation often attributes behavior to the wrong files. How should the handoff be restructured?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the file path list to the top of the prompt so the model processes the mapping before reading any of the excerpts.", "e": "Moving the path list changes its position but does not fix the underlying structural problem. The file paths and code excerpts remain separate, so the model must still infer which path belongs to which excerpt."}, {"l": "B", "ok": false, "t": "Add a system prompt instruction telling the subagent to verify every attribution against the path list before writing documentation.", "e": "This relies on the model following a general instruction while the input still lacks an explicit association between each excerpt and its source. Asking the model to be careful does not eliminate the need to reconstruct that mapping."}, {"l": "C", "ok": false, "t": "Number the excerpts sequentially and rely on their order matching the order of the appended file path list.", "e": "Positional matching is fragile. If an excerpt is omitted, reordered, or duplicated, the correspondence can shift and produce incorrect attributions. The association remains implicit rather than being represented directly."}, {"l": "D", "ok": true, "t": "Wrap each excerpt in a delimited block, such as XML tags, pairing the code content with a separate subtag holding its file path.", "e": "Each excerpt carries its own source metadata. The receiving agent no longer has to infer which path belongs to which code fragment, so attribution remains explicit even when the prompt is long or excerpts are reordered."}], "o": "<p>The key principle is <strong>structural association of content and provenance<\/strong>.<\/p>\n<p>A subagent receives the information included in its own prompt. If twelve code excerpts are supplied in one section and twelve paths in another, the intended mapping may be obvious to the person constructing the prompt, but it is not explicitly encoded in the input.<\/p>\n<p>Instead, represent every excerpt as a self-contained unit:<\/p>\n<pre><code class=\"lang-xml\">&lt;document&gt;\n  &lt;source&gt;src/billing/refunds.ts&lt;/source&gt;\n  &lt;document_content&gt;\n    // Relevant code excerpt goes here\n  &lt;/document_content&gt;\n&lt;/document&gt;<\/code><\/pre>\n<p>This example illustrates the structure; the actual source path and code should come from the repository.<\/p>\n<p>The same wrapper can be repeated for every file. This approach makes source attribution easier to preserve and audit, and it avoids relying on the order of separate lists.<\/p>\n<p>The other options address placement, instructions, or numbering without removing the ambiguity. Explicitly pairing content and metadata is the more robust solution.<\/p>\n<p><strong>Quick revision:<\/strong> Keep every excerpt physically associated with its source path. Explicit structure is more reliable than positional inference.<\/p>", "docs": [["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"], ["Anthropic — Citations", "https://docs.anthropic.com/en/docs/build-with-claude/citations"]]}, {"k": "3.42", "d": "d1", "title": "Filter Verbose MCP Results with a PostToolUse Hook", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>An MCP server the agent relies on returns more than 40 fields per response when only five are relevant, bloating context and confusing the model. The server is third-party and cannot be changed. Which mechanism trims each result before the model processes it?<\/p>", "c": [{"l": "A", "ok": false, "t": "Define a separate <code>trim_fields<\/code> tool that the agent calls after each retrieval to reduce the result to relevant fields.", "e": "The agent must remember to invoke an extra tool, adding latency and another failure point. More importantly, the verbose result may already have entered the conversation context before the trimming tool runs, so the original context bloat has not been prevented."}, {"l": "B", "ok": true, "t": "Register a <code>PostToolUse<\/code> hook that intercepts the tool's result and passes only the relevant fields through to the agent.", "e": "A <code>PostToolUse<\/code> hook can inspect a successful tool response and replace the output Claude receives. The transformation happens in the harness, so it can be applied consistently to third-party MCP results without changing the server itself."}, {"l": "C", "ok": false, "t": "Register a <code>PreToolUse<\/code> hook that rewrites the outgoing tool call so the server returns only the fields the agent needs.", "e": "<code>PreToolUse<\/code> runs before the tool executes. It can block or modify the outgoing call, but it cannot directly filter the result after execution. If the third-party server always returns its full payload, the oversized response remains a problem."}, {"l": "D", "ok": false, "t": "Add a system prompt instruction directing the agent to ignore irrelevant fields in that tool's responses when reasoning.", "e": "The instruction may influence how Claude interprets the response, but it does not remove the unwanted fields from the context window. The extra tokens and distracting information are still present."}], "o": "<p>The distinction is between <strong>changing a tool request<\/strong> and <strong>transforming a tool response<\/strong>.<\/p>\n<p>The Agent SDK hook lifecycle provides different interception points:<\/p>\n<ul><li><code>PreToolUse<\/code>: runs before a tool executes. It is suitable for validating, modifying, or blocking a call.<\/li><li><code>PostToolUse<\/code>: runs after a tool completes successfully. It is suitable for inspecting and transforming the result before Claude continues.<\/li><\/ul>\n<p>Because the third-party MCP server cannot be changed, the harness can apply a deterministic transformation after each successful call. The hook should retain the five relevant fields and return a replacement output compatible with the expected tool-result structure.<\/p>\n<p>Conceptually, the pipeline becomes:<\/p>\n<div class=\"flow\"><div class=\"step\"><strong>MCP tool executes<\/strong><span>Returns 40+ fields<\/span><\/div><div aria-hidden=\"true\" class=\"arrow\">↓<\/div><div class=\"step\"><strong>PostToolUse hook<\/strong><span>Keep the five required fields<\/span><\/div><div aria-hidden=\"true\" class=\"arrow\">↓<\/div><div class=\"step\"><strong>Claude receives filtered output<\/strong><span>Less context noise and lower token use<\/span><\/div><\/div>\n<p>The hook changes what the model sees; it does not undo the tool's execution or reverse any side effects that have already occurred.<\/p>\n<p><strong>Quick revision:<\/strong> Filter results with <code>PostToolUse<\/code>. <code>PreToolUse<\/code> operates before execution; prompt instructions do not remove unwanted payload fields.<\/p>", "docs": [["Claude Agent SDK — Hooks", "https://docs.anthropic.com/en/docs/claude-code/sdk"], ["Claude Code — Hooks reference", "https://docs.anthropic.com/en/docs/claude-code/hooks"]]}, {"k": "3.43", "d": "d1", "title": "Restructure a Large Pull-Request Review", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A pull request touches 16 files. A single review pass over all of them produces detailed feedback on the first few files, shallow comments on the rest, and identical code patterns judged differently across files. How should this review be restructured?<\/p>", "c": [{"l": "A", "ok": false, "t": "Enable extended thinking for the review pass so the model deliberates more thoroughly before commenting on each of the 16 files.", "e": "Extended thinking can deepen reasoning, but the review remains one large task requiring attention across all 16 files. The underlying issue is the task structure, so simply increasing deliberation does not guarantee consistent depth for every file."}, {"l": "B", "ok": false, "t": "Run the identical full-pull-request review three separate times and report only the findings that appear in at least two runs.", "e": "Majority filtering can discard genuine defects found in only one pass. It also increases cost without addressing why each review pass is shallow or inconsistent."}, {"l": "C", "ok": true, "t": "Chain the review: analyze each file individually for local issues, then run a separate pass over cross-file interactions.", "e": "Breaking the review into focused stages gives each file dedicated attention while preserving a separate step for issues that only become apparent when multiple files are considered together."}, {"l": "D", "ok": false, "t": "Move the review to a model tier with a larger context window so all 16 files can be evaluated t
