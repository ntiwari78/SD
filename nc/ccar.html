action should follow. A useful error response should give the agent enough structured information to choose between retrying, correcting input, or escalating.<\/p>\n<p>Two application-defined fields provide that information:<\/p>\n<ul><li><code>errorCategory<\/code>: identifies the type of failure.<\/li><li><code>isRetryable<\/code>: explicitly indicates whether another attempt may succeed.<\/li><\/ul>\n<p>These are custom fields in the error content, not standard protocol-level fields automatically interpreted by the MCP protocol. The tool implementation must populate them, and the agent must use them in its recovery logic.<\/p>\n<p>Returning a raw upstream payload or a more descriptive sentence can be helpful in addition to these fields, but neither is as direct for the retry decision.<\/p>", "docs": [["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Agent SDK hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"]]}, {"k": "1.49", "d": "d2", "title": "Giving the Coordinator Enough Context to Recover from Subagent Failure", "scen": "<p>A coordinator delegates research to a web-search subagent. During a run, the subagent fails and reports only <code>\"search unavailable\"<\/code>. The coordinator's context contains no record of the subagent's queries or partial results.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which change lets the coordinator choose an informed recovery action?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the coordinator re-run the failed searches itself and then decide between retrying and proceeding with gaps.", "e": "The coordinator has no record of which queries the subagent attempted, so it cannot know what to rerun. This also duplicates work rather than fixing the missing failure report."}, {"l": "B", "ok": false, "t": "Pass the coordinator's full conversation history into the subagent's prompt so both agents share context.", "e": "This sends context from the parent to the child, but the problem is the reverse: the subagent's findings are not reaching the coordinator. Sharing the parent's history does not transmit the child's intermediate tool results."}, {"l": "C", "ok": false, "t": "Add retries with exponential backoff inside the subagent so transient timeouts resolve before it reports.", "e": "Local retries are useful for transient failures, but they do not address failures that persist after retrying. The coordinator would still receive only <code>\"search unavailable\"<\/code> without the information needed to recover."}, {"l": "D", "ok": true, "t": "Require the subagent's final report to include the failure type, attempted queries, and any partial results.", "e": "In the Agent SDK, the parent receives the subagent's final message, while intermediate tool calls and results remain inside the subagent. A structured final report is therefore the channel through which the coordinator receives the context it needs."}], "o": "<p>Subagents use isolated contexts. This helps prevent verbose search results and intermediate tool activity from overwhelming the coordinator's context window, but it also means the coordinator cannot automatically inspect everything the subagent did.<\/p>\n<p>The final report must carry the information needed for recovery, including:<\/p>\n<ul><li>The failure type.<\/li><li>The queries that were attempted.<\/li><li>Any partial results gathered.<\/li><li>Useful alternatives or suggested next steps, when available.<\/li><\/ul>\n<p>With that information, the coordinator can decide whether to retry with a modified query, use another source, proceed with partial evidence, or explicitly document a coverage gap.<\/p>\n<p>Local retries remain useful for transient failures, but they are not a substitute for structured reporting when a failure persists. Passing parent history into the child does not solve the missing child-to-parent information flow.<\/p>", "docs": [["Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "1.50", "d": "d5", "title": "Investigating Incorrect Citation URLs Without Exhausting Context", "scen": "<p>Reports attach incorrect source URLs only to citations from the document-ingestion path. Tests confirm that the shared citation formatter renders correctly when given correct URL metadata. An earlier attempt used <code>Read<\/code> on dozens of files and exhausted its context.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which exploration strategy is correct?<\/p>", "c": [{"l": "A", "ok": true, "t": "Grep for the document-ingestion citation symbols to find entry points, then Read those files, following imports.", "e": "This search-first approach targets the path where the bug appears. Grep identifies relevant entry points, and Read loads only the files needed to trace the citation metadata through imports."}, {"l": "B", "ok": false, "t": "Read the pipeline's main entry file in full and trace the flow from that single file.", "e": "The entry file may reveal where processing starts, but citation metadata often passes through several imported modules. Looking at only one file can leave critical transformations unseen and lead to guesses."}, {"l": "C", "ok": false, "t": "Read the shared citation formatter's source in full and fix its URL handling before exploring the ingestion code.", "e": "The formatter would be a reasonable starting point if its behavior were unknown. Here, tests already confirm it works when given correct metadata, so the faulty URL data likely originates earlier in the ingestion path."}, {"l": "D", "ok": false, "t": "Glob for all pipeline source files, then Read each file that the listing returns.", "e": "Glob identifies files by their names and patterns, not by whether they are relevant to the bug. Reading every returned file repeats the context-exhaustion problem."}], "o": "<p>The effective approach is incremental investigation:<\/p>\n<ol><li>Search for the symbols or functions involved in document-ingestion citations.<\/li><li>Read the files containing the relevant matches.<\/li><li>Follow imports and call sites to trace how URL metadata is created and passed along.<\/li><li>Continue only into files that help explain the faulty behavior.<\/li><\/ol>\n<p>This keeps the context window focused on relevant code and helps the agent form conclusions from inspected evidence rather than assumptions.<\/p>\n<p>The question also gives a useful diagnostic clue: the shared formatter has already passed tests with correct URL metadata. That points upstream, toward the code that produces the metadata, rather than toward the formatter itself.<\/p>\n<p>Grep and Read complement each other: search locates likely entry points, and targeted reading provides the implementation details necessary to follow the data flow.<\/p>", "docs": [["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference"], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "1.51", "d": "d5", "title": "Retrying Transient Search Failures Locally", "scen": "<p>A coordinator delegates research to specialized subagents. The web-search subagent's external API frequently times out. One quick retry fixes most timeouts, but a few persist. Currently, every timeout is sent straight to the coordinator, costing extra turns and tokens.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>How should the subagent handle these timeouts?<\/p>", "c": [{"l": "A", "ok": false, "t": "After a failed local retry, return a single generic \"search unavailable\" status to the coordinator for all remaining failures.", "e": "This correctly attempts local recovery first, but the generic status hides the failure type, attempted query, and partial results. The coordinator cannot make an informed decision about recovery."}, {"l": "B", "ok": true, "t": "Retry timed-out calls locally with backoff, and report persistent failures to the coordinator with the attempted query and any partial results.", "e": "The subagent should handle transient failures at the lowest level where recovery is possible. Only persistent failures need to be escalated, and the report should include enough context for the coordinator to decide what to do next."}, {"l": "C", "ok": false, "t": "Report every timeout to the coordinator at once as structured error context with the failure type, the query, and any partial results.", "e": "Structured error context is useful for persistent failures, but escalating every timeout wastes coordinator turns on routine failures that the subagent could resolve itself."}, {"l": "D", "ok": false, "t": "Keep retrying the search inside the subagent with increasing backoff until the call eventually succeeds.", "e": "Unbounded retries can stall the workflow and waste tokens. Persistent failures may never resolve, and the coordinator would never learn about gaps it could work around."}], "o": "<p>Resilient multi-agent error handling is layered:<\/p>\n<ol><li>Attempt local recovery for transient errors, such as timeouts, using one or two retries with backoff.<\/li><li>If the failure persists, report it to the coordinator.<\/li><li>Include the failure type, attempted query, partial results, and possible alternatives.<\/li><\/ol>\n<p>A subagent's intermediate tool calls stay in its own context; only its final message returns to the parent. That makes the final report the coordinator's main source of information about the subagent's work.<\/p>", "docs": [["Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "1.52", "d": "d1", "title": "Resuming a Named Claude Code Session", "scen": "<p>An engineer is two hours into an unnamed session debugging the coordinator's task decomposition. Short, unrelated sessions also run in the same directory daily. Tomorrow, the engineer wants one command that reopens this exact investigation, preserves its full context, and skips any interactive session list.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>What should the engineer do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Plan to run <code>claude --continue<\/code> tomorrow, which reopens the most recent session in the current directory.", "e": "The <code>--continue<\/code> flag resumes the most recent session in the directory. Because other short sessions run there daily, the investigation is unlikely to remain the most recent one."}, {"l": "B", "ok": false, "t": "Run <code>claude --resume<\/code> tomorrow with no session supplied, then choose the investigation from the list it opens.", "e": "This can locate the session, but it opens an interactive picker when no session is supplied. The requirement is to reopen the investigation directly with one command."}, {"l": "C", "ok": true, "t": "Run <code>/rename<\/code> with a descriptive name in the current session, then resume it by that name tomorrow.", "e": "<code>/rename<\/code> names the existing session without discarding its accumulated context. Tomorrow, the engineer can use <code>claude --resume<\/code> with that name to reopen the exact investigation."}, {"l": "D", "ok": false, "t": "Exit now and start a fresh session with <code>claude -n<\/code> to assign a name, then restart the investigation there.", "e": "The <code>--name<\/code> flag names a new session. Starting over would discard the two hours of investigation context that the engineer needs to preserve."}], "o": "<p>Claude Code provides different ways to return to a session:<\/p>\n<ul><li><code>--continue<\/code> resumes the most recent session in the current directory.<\/li><li><code>--resume<\/code> targets a session by its ID or name.<\/li><li><code>/rename<\/code> assigns a name to a session that is already running.<\/li><li><code>--name<\/code> (or <code>-n<\/code>) assigns a name when starting a new session.<\/li><\/ul>\n<p>In this scenario, the session already contains two hours of useful work. Renaming it preserves that context and gives the engineer a stable identifier to use tomorrow.<\/p>\n<p>The intended workflow is to rename the current session and later run:<\/p>\n<pre><code class=\"lang-bash\">claude --resume &lt;name&gt;<\/code><\/pre>", "docs": [["Claude Code CLI reference", "https://code.claude.com/docs/en/cli-reference"], ["Claude Code slash commands", "https://code.claude.com/docs/en/slash-commands"]]}, {"k": "1.53", "d": "d1", "title": "Preserving Citations Across Isolated Subagents", "scen": "<p>A multi-agent research system has a coordinator and specialized subagents. The search subagent collects well-sourced evidence, but synthesis reports lack citations. The search subagent's verbose page content must also stay out of the coordinator's context.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which two actions solve both problems? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the shared citation instructions into the coordinator's system prompt instead of each subagent's prompt.", "e": "A subagent does not automatically inherit the coordinator's system prompt. Moving citation instructions there does not supply the synthesis subagent with the evidence it needs."}, {"l": "B", "ok": true, "t": "Have the search subagent return only a structured report of claims, quotes, and source URLs as its final message.", "e": "The subagent's intermediate tool calls and raw page content remain in its own context. Returning a compact, structured report preserves the evidence and citation URLs without forwarding verbose page content."}, {"l": "C", "ok": true, "t": "Pass the search subagent's returned findings explicitly in the prompt the coordinator gives the synthesis subagent.", "e": "A non-fork subagent starts with its own context and receives the prompt supplied by the coordinator. Explicitly including the search findings gives the synthesis subagent the evidence it needs to cite."}, {"l": "D", "ok": false, "t": "Spawn the search and synthesis subagents in parallel by emitting two Task calls in one coordinator response.", "e": "Parallel execution is useful for independent tasks, but synthesis depends on the search results. Because the subagents do not automatically share context, the synthesis subagent would start without the evidence."}], "o": "<p>Subagents operate with isolated context windows. A non-fork subagent does not automatically see the coordinator's conversation history, system prompt, or previously collected findings. The coordinator must explicitly pass the required information through the delegation prompt.<\/p>\n<p>The most efficient design uses two stages:<\/p>\n<ol><li>The search subagent returns a structured final report containing claims, relevant quotes, and source URLs.<\/li><li>The coordinator passes that report to the synthesis subagent in its prompt.<\/li><\/ol>\n<p>This preserves traceable evidence while keeping raw page content and intermediate search activity out of the coordinator's context.<\/p>\n<p>Parallel execution does not remove dependencies: synthesis cannot use search findings that have not yet been collected and passed to it.<\/p>", "docs": [["Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Create custom subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "1.54", "d": "d1", "title": "Enforcing a Licensing Blocklist with Hooks", "scen": "<p>A <code>PreToolUse<\/code> hook exits with code <code>1<\/code> when the web-search subagent's fetch URL is on a licensing blocklist. Logs show that blocked fetches still execute. Research runs are unattended overnight.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>What change enforces the rule?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add the blocklist to the subagent's system prompt with an instruction to refuse those domains.", "e": "Prompt instructions encourage compliance but cannot guarantee it. A licensing restriction that must never be violated requires code-level enforcement."}, {"l": "B", "ok": false, "t": "Move the blocklist check to a <code>PostToolUse<\/code> hook that returns a blocking error.", "e": "<code>PostToolUse<\/code> runs after the tool has completed. By then, the blocked URL has already been fetched, so the hook cannot prevent the prohibited action."}, {"l": "C", "ok": false, "t": "Change the hook to return JSON with <code>permissionDecision<\/code> set to <code>ask<\/code> for blocklisted URLs.", "e": "An <code>ask<\/code> decision can be appropriate in an interactive session where a human can approve or reject the call. The scenario involves unattended overnight runs, so no person is available to make that decision."}, {"l": "D", "ok": true, "t": "Change the hook to exit with code <code>2<\/code> when the URL is on the blocklist.", "e": "For a command hook, exit code <code>2<\/code> signals a blocking error. On a <code>PreToolUse<\/code> event, it prevents the tool call from executing and sends the hook's error message back to Claude. Exit code <code>1<\/code> is treated as a non-blocking error, which explains why the current hook does not stop the fetch."}], "o": "<p>Hooks enforce rules in code, but the hook must use the correct blocking mechanism.<\/p>\n<ul><li><code>PreToolUse<\/code> runs before the tool call and can prevent execution.<\/li><li><code>PostToolUse<\/code> runs after execution and is too late to prevent a fetch.<\/li><li>Exit code <code>1<\/code> represents a non-blocking hook error.<\/li><li>Exit code <code>2<\/code> blocks the action and returns the error context to Claude.<\/li><\/ul>\n<p>Because the workflow is unattended, the guardrail must work without waiting for a human decision. A <code>PreToolUse<\/code> hook that exits with code <code>2<\/code> for blocklisted URLs enforces the restriction deterministically.<\/p>", "docs": [["Claude Code hooks", "https://code.claude.com/docs/en/hooks"], ["Claude Code features overview", "https://code.claude.com/docs/en/features-overview"]]}, {"k": "1.55", "d": "d1", "title": "Starting a Fresh Session Without Reintroducing Stale Evidence", "scen": "<p>An earlier investigation's conclusions are still trusted, but most sources have since replaced their published figures. Outdated saved tool results must not re-enter context as evidence. The team starts a new coordinator session instead of resuming the old one.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>What should the new session's first prompt include?<\/p>", "c": [{"l": "A", "ok": false, "t": "Seed the prompt with the saved tool results, each labeled with its retrieval date and source.", "e": "Retrieval dates help interpret valid sources collected at different times, but the source figures in this scenario have been replaced. Including the stale results risks the model treating superseded values as current evidence."}, {"l": "B", "ok": false, "t": "Seed the prompt with only the research topic and its list of subtopics.", "e": "This avoids stale evidence, but it also discards conclusions that the team still trusts. The new coordinator would need to repeat the entire investigation rather than rechecking only the changed figures."}, {"l": "C", "ok": false, "t": "Seed the prompt with the full search results and document analyses the prior subagents returned.", "e": "These outputs contain the stale evidence that the fresh session is intended to leave behind. Reintroducing them also consumes context with information that needs to be replaced."}, {"l": "D", "ok": true, "t": "Seed the prompt with the prior conclusions and the claim-to-source mappings that back them.", "e": "This preserves the conclusions the team still trusts while leaving stale tool results out of context. The claim-to-source mappings identify which sources should be revisited to verify updated figures."}], "o": "<p>A new session should preserve the durable parts of the previous investigation without carrying forward outdated evidence.<\/p>\n<p>The seed should include:<\/p>\n<ul><li>The conclusions that remain trusted.<\/li><li>The mapping between each claim and its supporting source.<\/li><li>Enough provenance to locate and re-verify the relevant source.<\/li><\/ul>\n<p>The coordinator can then revisit the sources and refresh the figures that have changed.<\/p>\n<p>Including stale search results—even with retrieval dates—risks anchoring the new session on superseded values. Conversely, starting with only the topic list discards useful prior conclusions and forces unnecessary repeated research.<\/p>\n<p>The general rule is: <strong>resume when the existing context is still trustworthy; start fresh with a structured summary when the evidence has become stale. Preserve conclusions and provenance, but re-verify the underlying evidence.<\/strong><\/p>", "docs": [["Claude Code common workflows", "https://code.claude.com/docs/en/common-workflows"], ["Context windows", "https://code.claude.com/docs/en/context-windows"]]}, {"k": "1.56", "d": "d1", "title": "Routing Only Relevant Context to Downstream Subagents", "scen": "<p>A multi-agent research system has a coordinator and specialized subagents for web search, document analysis, synthesis, and report generation. The coordinator stores each subagent's result separately but forwards all accumulated outputs to every downstream subagent.<\/p>\n<p>Report-generation prompts have grown to 90K tokens, and reports are missing synthesis conclusions. Every handoff must remain auditable in the coordinator's logs.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>What should the team change?<\/p>", "c": [{"l": "A", "ok": true, "t": "Have the coordinator pass each subagent only the stored results that its specific task requires.", "e": "Information routing belongs to the coordinator in a hub-and-spoke design. Since the results are already stored separately, the coordinator can select only the relevant findings for each delegation. This reduces prompt size while preserving an auditable record of every handoff."}, {"l": "B", "ok": false, "t": "Add an intermediate summarization subagent that condenses the accumulated outputs before they reach the report subagent.", "e": "Summarization is useful when all the accumulated content is necessary but exceeds the available context. Here, the coordinator can simply avoid forwarding irrelevant results. An extra summarization step adds cost and could lose citations or exact figures."}, {"l": "C", "ok": false, "t": "Have the synthesis subagent send its output directly to the report subagent, bypassing the coordinator for that handoff.", "e": "Direct handoffs reduce prompt overhead, but they bypass the coordinator's logs. The scenario explicitly requires every handoff to remain auditable, so this approach violates the requirement."}, {"l": "D", "ok": false, "t": "Move the report subagent to a model with a larger context window so the full set of forwarded outputs fits.", "e": "A larger context window accommodates more tokens but does not solve the relevance problem. Important synthesis conclusions can remain buried among large volumes of unrelated content."}], "o": "<p>The coordinator in a hub-and-spoke system owns task decomposition, error handling, and information routing. Subagents have isolated contexts; the coordinator receives their results and decides what information to pass into subsequent prompts.<\/p>\n<p>Forwarding every accumulated result defeats this architecture. The report subagent receives irrelevant search and document outputs, while the synthesis conclusions it needs become harder to find.<\/p>\n<p>The appropriate fix is <strong>selective context routing<\/strong>. Each subagent should receive only the information needed for its assigned task. This reduces context consumption, improves attention to relevant findings, and preserves the coordinator's audit trail.<\/p>", "docs": [["Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview"]]}, {"k": "1.57", "d": "d5", "title": "Correcting Over-Escalation Caused by One-Sided Examples", "scen": "<p>The coordinator's system prompt contains explicit escalation criteria and five few-shot examples. Every example ends in escalation. In production, the coordinator begins escalating routine cases it could resolve itself, such as a single search timeout.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>What change is most effective?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the coordinator self-rate confidence for each case and escalate only below a calibrated threshold.", "e": "Model self-rated confidence is an unreliable proxy for case complexity. The model can be confidently wrong on difficult cases, so adding a confidence threshold does not address the stated cause: the examples all teach the same outcome."}, {"l": "B", "ok": false, "t": "Add more escalation examples covering a wider variety of failure types and research situations.", "e": "Adding more examples with the same outcome reinforces the pattern that cases should be escalated. Variety must include both situations that require escalation and those that the coordinator can resolve independently."}, {"l": "C", "ok": true, "t": "Add examples of cases the coordinator should resolve autonomously, alongside the escalation examples.", "e": "Few-shot examples teach decision boundaries as well as output format. Contrasting examples demonstrate when the coordinator should act independently and when it should escalate."}, {"l": "D", "ok": false, "t": "Replace the few-shot examples with a longer, more precise numbered list of escalation criteria.", "e": "Explicit criteria already exist. Replacing the examples removes a useful way to demonstrate how those criteria apply to specific cases, leaving ambiguous boundary situations less clearly defined."}], "o": "<p>Few-shot examples influence the model's interpretation of which inputs lead to which outcomes. If every example ends in escalation, the model may learn that escalation is the default response—even for a transient timeout that a local retry could resolve.<\/p>\n<p>The fix is to provide examples representing both sides of the decision:<\/p>\n<ul><li>Escalate when a failure cannot be resolved safely or independently.<\/li><li>Resolve autonomously when a routine issue can be handled locally.<\/li><li>Proceed with partial findings when appropriate, while reporting known limitations.<\/li><\/ul>\n<p>This teaches the coordinator the distinction between cases that need human involvement and those it should handle itself.<\/p>", "docs": [["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "1.58", "d": "d2", "title": "Configuring a Personal MCP Server Across Multiple Repositories", "scen": "<p>A developer wants to try an experimental citation-formatting MCP server in several research repositories on their machine. Teammates must not receive the configuration.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which TWO configuration choices are correct? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Put the server's entry in <code>~/.claude/settings.json<\/code> in the home directory.", "e": "This file contains general Claude Code settings, not the MCP server configuration described in the question. MCP server entries are stored separately."}, {"l": "B", "ok": true, "t": "Add the server with <code>claude mcp add --scope user<\/code>.", "e": "User scope makes the server personal to the developer and available across projects on that machine. This meets both requirements: cross-repository use and no sharing with teammates."}, {"l": "C", "ok": true, "t": "Verify the server's entry in <code>~/.claude.json<\/code> in the home directory.", "e": "User-scoped MCP server configurations are stored in <code>~/.claude.json<\/code>. Because this is a home-directory configuration rather than a repository configuration, it is not shared through the project's version control."}, {"l": "D", "ok": false, "t": "Add the server with <code>claude mcp add<\/code> and keep the default scope.", "e": "The default scope is local. A local-scoped server is private, but it applies only to the current project, so it will not automatically load in the developer's other repositories."}], "o": "<p>Claude Code supports three MCP configuration scopes:<\/p>\n<ul><li><strong>Local:<\/strong> Private to the developer and tied to the current project.<\/li><li><strong>Project:<\/strong> Stored in the project's <code>.mcp.json<\/code> and shareable with teammates through version control.<\/li><li><strong>User:<\/strong> Private to the developer and available across projects on the same machine.<\/li><\/ul>\n<p>The scenario requires a configuration that is both personal and cross-project. User scope is the correct choice.<\/p>\n<p>The command is:<\/p>\n<pre><code class=\"lang-bash\">claude mcp add --scope user<\/code><\/pre>\n<p>The resulting configuration should be verified in <code>~/.claude.json<\/code>, rather than <code>~/.claude/settings.json<\/code>.<\/p>", "docs": [["Claude Code MCP", "https://code.claude.com/docs/en/mcp"], ["Claude Code settings", "https://code.claude.com/docs/en/settings"]]}, {"k": "1.59", "d": "d2", "title": "Returning a Non-Retryable Error for an Unapproved Source", "scen": "<p>The <code>load_document<\/code> tool rejects any source that is not on the approved citation list. The list allows no exceptions, and subagents cannot read it.<\/p>\n<p>MCP tools report failures using <code>isError: true<\/code> and a JSON body that follows the team's own error schema: <code>errorCategory<\/code>, <code>retriable<\/code>, and <code>message<\/code>.<\/p>\n<p>The tool currently returns only <code>\"Request denied.\"<\/code> The subagent repeatedly retries the same URL and then reports a service outage to the coordinator.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which error body fixes both behaviors?<\/p>", "c": [{"l": "A", "ok": true, "t": "Set <code>errorCategory<\/code> to <code>\"business\"<\/code> and <code>retriable<\/code> to <code>false<\/code>, with a message explaining the source is not on the approved list.", "e": "The team's schema uses the business category for policy refusals. Setting <code>retriable: false<\/code> tells the subagent to stop retrying, while the message identifies the actual reason for rejection. The coordinator can then choose another source or record a coverage gap."}, {"l": "B", "ok": false, "t": "Return a successful result with an empty document body and a status note saying the source was skipped.", "e": "Reporting success hides the failure from the subagent's error-handling logic. The note also fails to clearly identify the policy reason, preventing the coordinator from choosing an informed alternative."}, {"l": "C", "ok": false, "t": "Set <code>errorCategory<\/code> to <code>\"validation\"<\/code> and <code>retriable<\/code> to <code>true<\/code>, with a message suggesting a retry using a different URL from the approved list.", "e": "Validation errors generally indicate that correcting the input could make the request succeed. The subagent cannot read the approved list, so it would be guessing at alternative URLs, and <code>retriable: true<\/code> would preserve the repeated retry behavior."}, {"l": "D", "ok": false, "t": "Set <code>errorCategory<\/code> to <code>\"permission\"<\/code> and <code>retriable<\/code> to <code>false<\/code>, with a message instructing the agent to escalate to a human reviewer.", "e": "Escalation can be appropriate when a human can grant access. Here, the policy allows no exceptions, so a human reviewer cannot approve the source. Escalation would stall the workflow unnecessarily."}], "o": "<p>A tool error should communicate what failed and what action is appropriate next. The generic <code>\"Request denied.\"<\/code> message does not tell the subagent whether the problem is temporary, caused by malformed input, or the result of an unchangeable policy.<\/p>\n<p>The correct response preserves the error and supplies actionable metadata:<\/p>\n<pre><code class=\"lang-json\">{\n  \"errorCategory\": \"business\",\n  \"retriable\": false,\n  \"message\": \"The source is not on the approved citation list.\"\n}<\/code><\/pre>\n<p>These fields belong to the team's application-level error schema; they are not universal MCP fields. The MCP result should still report the tool failure using <code>isError: true<\/code>.<\/p>\n<p>This makes the subagent stop retrying the prohibited source and communicate the real reason to the coordinator. The coordinator can then choose a different approved source or document the evidence gap.<\/p>", "docs": [["How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["MCP tools specification", "https://modelcontextprotocol.io/specification/latest/server/tools"]]}, {"k": "1.60", "d": "d2", "title": "Editing One Citation When the Same Text Appears Multiple Times", "scen": "<p>The report-generation subagent needs to correct one citation line in a draft report. Its <code>Edit<\/code> call fails because the identical line appears in five places, and only one occurrence should change.<\/p>", "scenLabel": "Scenario D · Multi-agent research system", "inline": false, "stem": "<p>Which TWO recovery approaches are valid? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Call <code>Write<\/code> with only the corrected citation line, letting <code>Write<\/code> merge it into the existing file.", "e": "<code>Write<\/code> does not merge a snippet into an existing file. It creates a file or completely overwrites its contents. Writing only the corrected line would destroy the rest of the report."}, {"l": "B", "ok": true, "t": "Retry <code>Edit<\/code> with an expanded anchor that includes the surrounding lines, so the match becomes unique.", "e": "<code>Edit<\/code> requires the target text to match exactly one location. Adding surrounding lines makes the anchor specific to the intended occurrence, allowing only that citation to be changed."}, {"l": "C", "ok": true, "t": "Use <code>Read<\/code> to load the whole file, then <code>Write<\/code> the complete corrected content back.", "e": "Reading the complete file, making the intended change, and writing the full corrected content back is a valid fallback when <code>Edit<\/code> cannot identify a unique match. It preserves the other four occurrences."}, {"l": "D", "ok": false, "t": "Run <code>Edit<\/code> with its replace-all option so every matching occurrence is updated in one call.", "e": "Replace-all is useful when every occurrence should change. Here, only one of five identical citation lines should be corrected, so replacing all matches would corrupt the other four entries."}], "o": "<p>The <code>Edit<\/code> tool uses an exact text anchor to identify what should be replaced. That anchor must match exactly one location. If it matches five identical citation lines, the tool refuses to guess which one the user intended.<\/p>\n<p>Two approaches resolve the ambiguity safely:<\/p>\n<ol><li><strong>Make the anchor unique:<\/strong> Include surrounding lines that distinguish the target citation from the other four.<\/li><li><strong>Rewrite the complete file:<\/strong> Read the full report, make the correction in context, and write the entire corrected report back.<\/li><\/ol>\n<p>The first approach is more efficient because it avoids transferring the whole file. The second is a dependable fallback when a unique anchor is difficult to construct.<\/p>\n<p>A replace-all operation is inappropriate because it changes every match. Writing only the corrected line is also unsafe because <code>Write<\/code> overwrites the file rather than merging snippets.<\/p>", "docs": [["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference"], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "2.1", "d": "d3", "title": "Grouping Related Findings for Claude Code Remediation", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A CI review pass flags three findings that all trace back to one shared validation design, plus four unrelated one-line fixes in separate modules. How should these findings be fed to Claude Code for remediation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Group the findings by severity level and submit each tier as its own message, addressing the highest severity tier first.", "e": "Severity determines priority, not how findings should be grouped for remediation. A severity tier can mix coupled and unrelated issues, so this grouping does not preserve interdependencies or isolate independent fixes."}, {"l": "B", "ok": true, "t": "Provide the three interrelated findings in one message, then address the four unrelated fixes sequentially in separate turns.", "e": "This matches the delivery pattern to the relationship between the issues. Interdependent findings should be presented together so Claude can make one coherent design decision. Independent fixes are better handled one at a time, allowing each change to be implemented and verified without interference from unrelated work."}, {"l": "C", "ok": false, "t": "Submit all seven findings together in a single message so one remediation pass resolves everything without repeating context.", "e": "Combining all the findings mixes unrelated fixes into the same working set. This can dilute attention and make individual changes harder to verify. Only the three coupled findings benefit from being presented together."}, {"l": "D", "ok": false, "t": "Work through every finding one at a time in separate turns, verifying each individual fix before introducing the next one.", "e": "Strictly sequential handling breaks apart the interdependent group. Fixing one finding without seeing the other two can produce a local patch that conflicts with the shared validation design, creating rework later."}], "o": "<p>The deciding factor when handing multiple issues to Claude Code is <strong>coupling, not count or severity<\/strong>.<\/p>\n<p>When findings share a root cause or interact with each other, Claude needs to reason about them together. Presenting them in one message makes it easier to design a coherent fix rather than three separate patches that conflict.<\/p>\n<p>Truly independent issues benefit from sequential treatment. Each turn then has a narrow, verifiable objective, and mistakes in one fix are less likely to affect another.<\/p>\n<p>The alternatives illustrate the trade-offs:<\/p>\n<ul><li>Grouping by severity answers which issue should be prioritized, not which issues should be solved together.<\/li><li>Submitting everything at once combines unrelated concerns and complicates verification.<\/li><li>Fixing every issue individually separates findings that depend on the same design decision.<\/li><\/ul>\n<p><strong>Practical rule:<\/strong> Use one message per shared design decision. Keep interdependent findings together and handle independent fixes separately.<\/p>", "docs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code common workflows", "https://code.claude.com/docs/en/common-workflows"]]}, {"k": "2.2", "d": "d5", "title": "Reconciling Differing Statistics in Multi-Agent Research", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>A synthesis agent in a multi-agent research system frequently flags differing statistics as contradictions, yet reviewers find most flagged pairs are not genuine conflicts. Subagents currently output only each value and a source name. Which structured-output requirement best supports accurate reconciliation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Instruct the synthesis agent to prefer the figure from whichever source it judges more authoritative and drop the other.", "e": "This silently selects one value and discards information without explaining why the figures differ. Both values may be valid within different time periods or methodologies, so choosing one source does not resolve the underlying ambiguity."}, {"l": "B", "ok": true, "t": "Require subagents to include publication or data-collection dates and methodological context alongside each claim.", "e": "Apparent contradictions can arise because statistics were measured at different times or calculated using different methodologies. Structured dates and methodological context let the synthesis agent distinguish these cases from genuine conflicts."}, {"l": "C", "ok": false, "t": "Have the coordinator average conflicting numeric values into a single figure before passing them to synthesis.", "e": "Averaging invents a value that neither source reported. It also assumes every difference represents a disagreement that can be split, even when both figures may be accurate for their respective contexts."}, {"l": "D", "ok": false, "t": "Add a synthesis prompt rule to interpret any pair of differing figures as a growth trend rather than a contradiction.", "e": "This replaces one blanket assumption with another. Some differences do represent genuine conflicts, errors, or incompatible methodologies. Without dates and methodological context, the synthesis agent has no reliable basis for classifying them."}], "o": "<p>Multi-agent research systems compress information at each handoff. Any information that upstream agents fail to preserve may be unavailable to downstream agents.<\/p>\n<p>If a claim contains only a value and a source name, the synthesis agent may not know that one figure was measured in 2023 and another in 2024, or that the sources used different definitions. It can therefore mistake valid differences for contradictions.<\/p>\n<p>Requiring each claim to carry publication or data-collection dates and methodological context gives the synthesis agent the evidence needed to compare sources accurately.<\/p>\n<p>The underlying principle is that <strong>provenance and temporal context must travel with the claim as structured data<\/strong>. They should not have to be reconstructed later from a bibliography or inferred from the values themselves.<\/p>\n<p>The alternatives fail because they resolve ambiguity without the information needed to resolve it. Choosing the supposedly more authoritative source discards evidence; averaging invents data; and automatically treating differences as trends can conceal real conflicts.<\/p>", "docs": [["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview"], ["Prompt templates and variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables"]]}, {"k": "2.3", "d": "d4", "title": "Diagnosing False Positives in Document Analysis", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>Reviewers dismiss roughly a third of the inconsistency findings produced by the document-analysis subagent, but nobody can tell which detection behaviors generate the false positives. What change best enables systematic analysis of the dismissals?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add a self-rated confidence field to each finding and suppress low-confidence flags so reviewers only see findings the model considers reliable.", "e": "Self-rated confidence is not necessarily well calibrated. Filtering on it hides some findings but does not reveal which detection behaviors produce false positives. The underlying problem remains undiagnosed."}, {"l": "B", "ok": true, "t": "Add a <code>detected_pattern<\/code> field to the finding schema recording which rule or signal triggered each flag, then group dismissed findings by that value.", "e": "A structured pattern field makes the trigger for each finding machine-readable. Grouping dismissed findings by this field reveals which rules, heuristics, or signals account for the false positives, allowing the team to target specific detection behaviors for improvement."}, {"l": "C", "ok": false, "t": "Ask reviewers to enter free-text dismissal notes in the review tool and periodically summarize the notes to spot recurring themes.", "e": "Free-text notes depend on reviewers consistently documenting the reasons for dismissal. The notes can be incomplete, inconsistent, and difficult to aggregate. Recording the triggering pattern when the finding is generated is more reliable."}, {"l": "D", "ok": false, "t": "Store the full reasoning transcript alongside each finding so an engineer can read through dismissed cases and infer common causes manually.", "e": "Raw transcripts are unstructured and require manual review to identify recurring causes. This does not scale well and does not make the results straightforward to aggregate or trend automatically."}], "o": "<p>When reviewers repeatedly dismiss automated findings, the important diagnostic question is not only how many findings are false positives, but <strong>which detection behaviors generate them<\/strong>.<\/p>\n<p>A finding should be represented as a structured record rather than an unstructured remark. A field such as <code>detected_pattern<\/code> can identify the rule, heuristic, or signal responsible for a flag. When reviewers dismiss findings, the team can group those records by pattern and identify the behaviors that need refinement.<\/p>\n<p>Once the dominant sources of false positives are known, the team can refine criteria, add contrasting examples, or disable a category while it is repaired.<\/p>\n<p>Structured outputs make this diagnostic information easier to validate and analyze. The alternatives either hide symptoms, depend on manual reconstruction, or produce data that is difficult to query.<\/p>\n<p><strong>Practical rule:<\/strong> Capture diagnostic metadata when a finding is generated, so false positives can be analyzed systematically rather than investigated from scratch.<\/p>", "docs": [["Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "2.4", "d": "d3", "title": "Sharing Citation and Report Conventions Across a Team", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>While building the coordinator's prompts, a developer wrote the team's citation formatting and report structure conventions into <code>~/.claude/CLAUDE.md<\/code>, but teammates report their Claude Code sessions never apply them. What should the developer do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have each teammate run <code>/memory<\/code> at the start of a session to import the developer's user-level conventions.", "e": "The <code>/memory<\/code> command views and edits memory files loaded on the local machine. It does not import another developer's home-directory file. Teammates' sessions do not automatically have access to the original developer's <code>~/.claude/CLAUDE.md<\/code>."}, {"l": "B", "ok": false, "t": "Copy the conventions into <code>./CLAUDE.local.md<\/code> in the repository so each teammate's sessions load them automatically.", "e": "<code>CLAUDE.local.md<\/code> is intended for personal, project-specific instructions and is generally kept out of version control. It is not the right location for conventions that the whole team must share."}, {"l": "C", "ok": true, "t": "Move the conventions into a project-level <code>CLAUDE.md<\/code> at the repository root and commit it to version control.", "e": "The file <code>~/.claude/CLAUDE.md<\/code> contains user-level instructions for the developer's own environment. A project-level <code>CLAUDE.md<\/code>, committed to the repository, is the appropriate place for team-wide conventions because it is distributed through version control."}, {"l": "D", "ok": false, "t": "Add the conventions to the committed <code>.claude/settings.json<\/code> so every teammate's sessions apply them.", "e": "Settings files hold configuration such as permissions and tool settings; they are not the intended mechanism for storing prose instructions and team conventions."}], "o": "<p>Claude Code instructions have different scopes, and the scope determines who receives them.<\/p>\n<ul><li><strong>User-level instructions:<\/strong> <code>~/.claude/CLAUDE.md<\/code> applies to the developer's own environment across projects.<\/li><li><strong>Project-level instructions:<\/strong> A repository-level <code>CLAUDE.md<\/code> can provide conventions shared by the team through version control.<\/li><li><strong>Personal project instructions:<\/strong> <code>CLAUDE.local.md<\/code> is suitable for local preferences rather than team-wide requirements.<\/li><li><strong>Settings files:<\/strong> JSON settings configure behavior such as permissions and tooling rather than serving as the primary home for natural-language guidance.<\/li><\/ul>\n<p>The fix is to move shared citation and report conventions into the project's <code>CLAUDE.md<\/code> and commit the file. Teammates can then receive the same instructions when they clone or update the repository.<\/p>\n<p>The broader lesson is that persistent instructions are only useful to a team if they are stored in a location the team actually shares.<\/p>", "docs": [["Manage Claude's memory", "https://code.claude.com/docs/en/memory"], ["Claude Code settings", "https://code.claude.com/docs/en/settings"]]}, {"k": "2.5", "d": "d2", "title": "Using Multiple MCP Servers in One Claude Code Session", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>Your <code>.mcp.json<\/code> defines both a GitHub server and a coverage-analysis server. A teammate wants to add a pipeline step that activates each server separately as needed. How should you respond?<\/p>", "c": [{"l": "A", "ok": false, "t": "Advise that only one server's tools can be loaded per session, so the pipeline needs to run a separate Claude Code invocation for each configured server.", "e": "There is no general one-server-per-session restriction. Multiple MCP servers can be configured and connected in the same session. Running separate invocations solely to work around a supposed one-server limit adds unnecessary complexity."}, {"l": "B", "ok": false, "t": "Explain that servers stay dormant until the system prompt references their tools by name, which triggers on-demand discovery.", "e": "Mentioning a tool in the system prompt does not trigger MCP connection or discovery. Tool discovery is handled by the host when it connects to the configured server."}, {"l": "C", "ok": true, "t": "Explain that tools from all configured servers are discovered at connection time and available simultaneously; the agent selects among them by description.", "e": "Claude Code connects to configured MCP servers and discovers their tools. Tools from connected servers can then be available together, with the model selecting among them based on their names, descriptions, and the task requirements. A separate activation step is not inherently necessary."}, {"l": "D", "ok": false, "t": "Tell the teammate the agent must call a listing tool on each server mid-session to load that server's tools before it can use them.", "e": "Capability discovery is handled by the host, including requests such as <code>tools/list<\/code>. The agent does not need to invoke a listing tool as a separate mid-session step before using discovered tools."}], "o": "<p>The key principle is that <strong>the host manages MCP discovery; the agent selects from the available tools<\/strong>.<\/p>\n<p>When Claude Code connects to configured MCP servers, it discovers their capabilities and makes available tools accessible to the model. Tools from a GitHub server and a coverage-analysis server can therefore be used in the same session, subject to the relevant permissions and configuration.<\/p>\n<p>This allows the agent to combine information from multiple sources in a single workflow—for example, reviewing a pull request's diff alongside a coverage report—without requiring a pipeline step to switch between servers manually.<\/p>\n<p>It is important to distinguish availability from permission: a discovered tool is not necessarily authorized for every execution environment. Automated CI runs should configure tool permissions appropriately.<\/p>", "docs": [["Claude Code MCP", "https://code.claude.com/docs/en/mcp"], ["Claude Agent SDK MCP", "https://platform.claude.com/docs/en/agent-sdk/mcp"], ["Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "2.6", "d": "d4", "title": "Managing False Positives in a CI/CD Code Review Pipeline", "scen": "", "scenLabel": "", "inline": true, "stem": "<p>A CI/CD code review pipeline uses Claude to identify potential issues in pull requests. The naming-convention category has a 55% false-positive rate, while security findings are more than 90% accurate. Developers are beginning to ignore both categories because they no longer trust the review results. The prompts are currently fixed. How should the team handle the naming-convention category?<\/p>", "c": [{"l": "A", "ok": false, "t": "Require Claude to report a higher self-stated confidence threshold for naming-convention findings.", "e": "Asking the model to express greater confidence does not reliably eliminate false positives. Self-reported confidence is not necessarily well calibrated, so a confidence threshold may leave the underlying reliability problem unresolved."}, {"l": "B", "ok": false, "t": "Demote naming-convention findings to informational comments rather than actionable review findings.", "e": "Changing the severity or presentation of noisy findings does not necessarily solve the trust problem. Informational comments can still consume developers’ attention and reduce confidence in the review system."}, {"l": "C", "ok": false, "t": "Keep the category live and iteratively adjust the prompts against real pull requests.", "e": "Iterating on prompts against real pull requests can be useful, but keeping a category active while making unvalidated changes means developers continue to experience false positives. It is better to validate the revised behavior before returning it to production."}, {"l": "D", "ok": true, "t": "Suspend the naming-convention category until its rewritten prompts pass offline testing.", "e": "Temporarily suspend the noisy category, revise its prompts, and evaluate the changes offline before re-enabling it. This protects the credibility of the more reliable review categories while the naming checks are improved."}], "o": "<p>False positives can damage trust in an entire review pipeline, not just the category generating them. The appropriate response is to isolate the unreliable category, improve its prompts, and validate the revised behavior against representative examples before putting it back into production.<\/p>", "docs": [["Claude prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"], ["Be clear and direct", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/be-clear-and-direct"]]}, {"k": "2.7", "d": "d1", "title": "Passing Retrieved Data to a Subagent", "scen": "", "scenLabel": "", "inline": true, "stem": "<p>A customer-support resolution agent calls <code>get_customer<\/code> and <code>lookup_order<\/code> to retrieve information about a customer and an order. It then spawns an analysis subagent with the prompt:<\/p>\n<blockquote><p>“Assess refund eligibility for this dispute.”<\/p><\/blockquote>\n<p>The subagent responds that no data was provided. What is the best way to fix the delegation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Spawn the subagent in a subsequent turn so that the parent agent’s tool results and conversation history will automatically be forwarded.", "e": "Spawning the subagent in a later turn does not guarantee that the parent agent’s conversation history or previous tool results will be forwarded into the subagent’s context. The required information must be explicitly provided."}, {"l": "B", "ok": false, "t": "Add <code>get_customer<\/code> and <code>lookup_order<\/code> to the subagent’s allowed tools so that it can access the retrieved records.", "e": "Giving the subagent access to the same tools allows it to make its own calls, but it does not automatically transfer the records already retrieved by the parent agent. Tool permissions and context sharing are different concerns."}, {"l": "C", "ok": false, "t": "Reference the parent agent’s <code>tool_use<\/code> IDs in the delegation prompt so the subagent can retrieve those results.", "e": "Referencing <code>tool_use<\/code> IDs does not provide a general mechanism for the subagent to retrieve results from the parent agent’s separate context. The delegation must carry the relevant information."}, {"l": "D", "ok": true, "t": "Include the retrieved customer and order data directly in the subagent’s delegation prompt.", "e": "Include the customer and order details returned by the parent agent directly in the subagent’s prompt. This gives the subagent the evidence it needs to assess refund eligibility without depending on implicit context sharing."}], "o": "<p>Subagents should not be assumed to inherit the parent agent’s full history or previously retrieved data. A reliable delegation explicitly passes the information needed to complete the assigned task. This makes the handoff clearer and reduces unnecessary tool calls or incomplete analyses.<\/p>", "docs": [["Claude Agent SDK: Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code: Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "2.8", "d": "d2", "title": "Handling Ambiguous Edit Anchors in a Generated Report", "scen": "", "scenLabel": "", "inline": true, "stem": "<p>A multi-agent research system uses a report-generation subagent to update a report. The subagent attempts to use an Edit operation to change one paragraph, but the anchor text it selected appears in four different sections of the report.<\/p>\n<p>What is the most reliable fallback?<\/p>", "c": [{"l": "A", "ok": false, "t": "Shorten the anchor text so that the Edit operation has a smaller amount of text to match.", "e": "Shortening the anchor does not resolve the ambiguity. A shorter string may match even more locations, making it harder to identify the intended paragraph reliably."}, {"l": "B", "ok": true, "t": "Read the full report, apply the change, and write the complete updated content.", "e": "Reading the complete report provides the context needed to locate the correct section. The subagent can then apply the intended change and write the complete updated content, avoiding an ambiguous targeted replacement."}, {"l": "C", "ok": false, "t": "Use Bash and <code>sed<\/code> to replace the matching text directly in the report.", "e": "A broad text-replacement command can modify multiple occurrences unintentionally. This is particularly risky when the same wording appears in several parts of a report."}, {"l": "D", "ok": false, "t": "Delete the other occurrences of the anchor text so that only one match remains.", "e": "Removing other occurrences merely to make the edit operation succeed can damage unrelated content and change the report’s meaning."}], "o": "<p>Targeted edits are convenient when the replacement anchor is unique and unambiguous. When the same anchor occurs in several locations, a full-document read and rewrite is a safer fallback because it preserves the surrounding context and allows the intended change to be applied deliberately.<\/p>", "docs": [["Claude Code tools reference", "https://code.claude.com/docs/en/tools-reference"], ["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "2.9", "d": "d4", "title": "Standardizing Location Fields in Structured Review Findings", "scen": "", "scenLabel": "", "inline": true, "stem": "<p>A CI/CD code-review system produces findings that conform to the required output schema. However, the <code>location<\/code> field uses inconsistent formats, such as:<\/p>\n<ul><li><code>auth.ts:42<\/code><\/li><li><code>line 42 of src/auth.ts<\/code><\/li><\/ul>\n<p>This inconsistency breaks the system that posts inline comments on pull requests.<\/p>\n<p>What is the best fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add a post-processing step that uses regular expressions to normalize the location strings.", "e": "Regex-based post-processing may fix some outputs, but it is a fragile way to compensate for an underspecified generation requirement. Variations in the output may require increasingly complicated parsing rules."}, {"l": "B", "ok": false, "t": "Force Claude to use a tool through <code>tool_choice<\/code>, even though the output already conforms to the schema.", "e": "The problem is not that Claude failed to produce structured output or select a tool. The output already conforms to the schema; the missing requirement is a consistent representation of the location."}, {"l": "C", "ok": false, "t": "Add regular-expression patterns and <code>minLength<\/code> and <code>maxLength<\/code> constraints to the location schema.", "e": "The proposed constraints do not address the central issue of communicating the required format, and not every JSON Schema constraint is supported by every structured-output implementation. A length constraint alone cannot establish the intended path-and-line convention."}, {"l": "D", "ok": true, "t": "Specify the exact location convention in the prompt and in the field’s schema description.", "e": "State the required format explicitly—for example, a relative file path followed by a colon and a line number—and reinforce it in the <code>location<\/code> field’s description. This directly guides generation toward the representation expected by the downstream system."}], "o": "<p>A structurally valid response is not necessarily semantically consistent with the consuming application’s requirements. Prompts and field descriptions should define the exact representation expected for important fields. This reduces ambiguity at the source rather than relying on fragile cleanup logic afterward.<\/p>", "docs": [["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Define tools for Claude", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"]]}, {"k": "2.10", "d": "d2", "title": "Designing Actionable Tool Errors for a Support Agent", "scen": "", "scenLabel": "", "inline": true, "stem": "<p>A customer-support agent uses <code>lookup_order<\/code> to retrieve order information. The tool returns the same generic error message, <code>\"Operation failed\"<\/code>, for three different situations:<\/p>\n<ol><li>A request times out.<\/li><li>The order ID is malformed.<\/li><li>The order belongs to a different customer account.<\/li><\/ol>\n<p>What is the best way to improve the agent’s handling of these failures?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add blanket exponential-backoff retries in the agent harness for every failed request.", "e": "Retrying can help with transient failures such as timeouts, but it will not fix a malformed order ID or an account-access restriction. Applying the same retry policy to every failure wastes time and can produce repeated failures."}, {"l": "B", "ok": false, "t": "Add prompt instructions telling the agent how to respond to each of the three failure modes.", "e": "Prompt instructions cannot reliably distinguish failure modes when the tool returns exactly the same message for all of them. The agent needs meaningful information from the tool to choose the correct response."}, {"l": "C", "ok": false, "t": "Escalate every tool failure to a human support representative.", "e": "Escalating every failure may be safe in some circumstances, but it unnecessarily increases human workload and prevents the agent from resolving routine, recoverable issues."}, {"l": "D", "ok": true, "t": "Return distinct error responses that identify the cause, indicate whether retrying is appropriate, and explain the next action.", "e": "The tool should return distinct, actionable error information. For example, a timeout can be marked as potentially retryable, a malformed ID can prompt the agent to request or correct the identifier, and an account-access issue can direct the agent to follow the appropriate authorization or escalation process."}], "o": "<p>Reliable agents depend on tools that expose meaningful failure information. Error responses should distinguish transient problems from invalid input and authorization issues, and should guide the agent toward an appropriate next step. This enables targeted retries, useful clarification requests, and appropriate escalation rather than indiscriminate recovery behavior.<\/p>", "docs": [["Claude tool use: Implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Claude tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "2.11", "d": "d3", "title": "Improving a Citation Normalizer Through Test-Driven Iteration", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>Claude Code's implementation of the citation normalizer for the report generator keeps mishandling edge cases, including missing authors and duplicate DOIs, despite several rewrites of the prose specification. Which refinement approach most reliably drives progressive improvement?<\/p>", "c": [{"l": "A", "ok": true, "t": "Write a test suite for expected behavior and edge cases first, then share failing test output to iterate.", "e": "Test-driven iteration turns vague requirements into concrete, verifiable targets. Tests can explicitly cover missing authors, duplicate DOIs, and other edge cases. Sharing failing test output gives Claude precise feedback about what remains incorrect, enabling measurable improvement over successive iterations."}, {"l": "B", "ok": false, "t": "Add the full citation formatting specification to <code>CLAUDE.md<\/code> so every session loads the rules automatically.", "e": "<code>CLAUDE.md<\/code> can make instructions persistently available across sessions, but the specification remains prose that the model must interpret. Persistently loading an ambiguous specification does not provide an objective mechanism for detecting and correcting mistakes."}, {"l": "C", "ok": false, "t": "Switch to plan mode so the approach is reviewed and approved before any code is written.", "e": "Plan mode is useful for reviewing implementation approaches before making substantial changes. However, this scenario concerns correctness on specific edge cases rather than uncertainty about the implementation strategy. A reviewed plan does not verify that the normalizer behaves correctly."}, {"l": "D", "ok": false, "t": "Rewrite the specification with IMPORTANT markers on the edge-case rules so the model prioritizes them.", "e": "Emphasis markers can make certain instructions more prominent, but they do not eliminate ambiguity in the specification. Since repeated prose revisions have already failed, making the same requirements more emphatic does not provide the needed verification loop."}], "o": "<p>The recommended approach is <strong>test-driven iteration<\/strong>. First, create tests that define the expected behavior, including known edge cases and relevant performance requirements. Then have Claude implement or refine the normalizer against those tests, sharing failing output after each attempt.<\/p>\n<p>The key distinction is that prose describes intended behavior, while tests provide executable evidence of whether that behavior has been achieved. When the implementation repeatedly mishandles edge cases despite rewritten instructions, the missing ingredient is a machine-checkable definition of correctness.<\/p>\n<p>This process also helps prevent regressions: previously passing tests can be rerun after every change, and progress can be measured by the reduction in failing tests.<\/p>", "docs": [["Claude Code best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code common workflows", "https://code.claude.com/docs/en/common-workflows"]]}, {"k": "2.12", "d": "d1", "title": "Preserving Claim-to-Source Attribution Across Subagents", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The synthesis subagent's drafts frequently attribute claims to the wrong sources. Investigation shows the search and analysis subagents return findings as prose paragraphs with all consulted sources listed at the end. How should subagent outputs be restructured?<\/p>", "c": [{"l": "A", "ok": true, "t": "Have each subagent emit structured findings that pair every claim with its source URL, document name, and publication date.", "e": "Each claim should carry its own source metadata in a structured record. This preserves the connection between a statement and the evidence supporting it, allowing the synthesis agent to attribute claims without guessing."}, {"l": "B", "ok": false, "t": "Have the coordinator keep a master registry of all sources consulted and attach it to the report during final aggregation.", "e": "A master source registry records which sources were consulted but does not identify which source supports each individual claim. The report may have a complete source list while still containing incorrect citations."}, {"l": "C", "ok": false, "t": "Have each subagent append a deduplicated bibliography of every source it consulted to the end of its summary.", "e": "A bibliography provides source names but does not map individual claims to their supporting sources. The synthesis agent must still infer which source belongs to which statement, so the original problem remains."}, {"l": "D", "ok": false, "t": "Pass the complete raw source documents to the synthesis agent so it can trace each claim back to its origin itself.", "e": "Passing all raw source documents increases the synthesis agent's context load and requires it to repeat the attribution work already performed by upstream agents. This is more expensive and remains vulnerable to misattribution."}], "o": "<p>In a multi-agent research pipeline, information can lose important context every time it passes between agents. If one subagent returns several claims and a separate list of sources, the synthesis agent cannot reliably reconstruct the relationship between each claim and its supporting evidence.<\/p>\n<p>The solution is to preserve provenance in the data itself. Each structured finding should contain the claim and associated metadata, such as:<\/p>\n<ul><li>The source URL.<\/li><li>The document name or title.<\/li><li>The publication date.<\/li><\/ul>\n<p>This makes attribution explicit and allows downstream agents to preserve it during synthesis. Publication dates can also help distinguish apparent disagreements caused by different reporting periods.<\/p>\n<p>The central principle is that <strong>source metadata must travel with the claim it supports<\/strong>, rather than being stored separately and reconstructed later.<\/p>", "docs": [["Claude prompt templates and variables", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompt-templates-and-variables"], ["Claude citations", "https://platform.claude.com/docs/en/build-with-claude/citations"]]}, {"k": "2.13", "d": "d1", "title": "Parallelizing Independent Research Subtasks", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The system receives a request to assess how a new data privacy regulation affects the healthcare, finance, and education sectors, with one comprehensive cited report expected. How should the coordinator structure this work?<\/p>", "c": [{"l": "A", "ok": false, "t": "Spawn three parallel subagents whose prompts name only the assigned sector, relying on each to inherit the coordinator's conversation history for the request details.", "e": "Subagents do not automatically inherit the coordinator's complete conversation history. A prompt containing only the sector name may omit the regulation details, research objectives, and citation requirements needed for useful results."}, {"l": "B", "ok": false, "t": "Delegate the entire request to a single search subagent so all three sectors are covered in one context and cross-sector comparisons stay consistent.", "e": "One subagent could attempt all three investigations, but this gives up the benefits of parallel execution and risks diluting attention across distinct research areas. The coordinator can maintain consistency during final synthesis."}, {"l": "C", "ok": false, "t": "Investigate the three sectors sequentially, feeding each subagent the findings from the prior sector so later analyses can build on earlier discoveries.", "e": "The three sector investigations are independent. Running them sequentially introduces unnecessary latency and an artificial dependency between tasks that do not need to wait for one another."}, {"l": "D", "ok": true, "t": "Split the request into three sector subtasks, run parallel subagents that each receive the full request context in their prompts, then synthesize results into one report.", "e": "The coordinator should create three independent subtasks and execute them in parallel. Each subagent must receive the regulation details, its sector assignment, the research objective, and the required output and citation expectations. The coordinator then combines the returned findings into one comprehensive report."}], "o": "<p>This scenario illustrates the <strong>orchestrator-workers pattern<\/strong>: a coordinator decomposes a complex request into independent subtasks, delegates them to specialized agents, and synthesizes their results.<\/p>\n<p>Parallel execution reduces overall waiting time because independent tasks can run concurrently rather than one after another. It also gives each subagent a focused task and context.<\/p>\n<p>However, context isolation is essential to understand. A subagent starts with its own context, so relevant requirements cannot be left implicit. Every delegation should include the information necessary to complete that specific task.<\/p>\n<p>The correct design therefore combines three principles:<\/p>\n<ol><li><strong>Decomposition:<\/strong> Separate the request into healthcare, finance, and education analyses.<\/li><li><strong>Parallel execution:<\/strong> Run the independent analyses concurrently.<\/li><li><strong>Synthesis:<\/strong> Merge the results into a unified report with consistent citations and presentation.<\/li><\/ol>", "docs": [["Claude Agent SDK overview", "https://platform.claude.com/docs/en/agent-sdk/overview"], ["Claude Agent SDK subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "2.14", "d": "d5", "title": "Distinguishing Search Failures from Valid Empty Results", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The web search subagent sometimes experiences connection timeouts and sometimes runs queries that legitimately match nothing. Which TWO reporting behaviors let the coordinator respond correctly to each outcome? <em>(Select TWO.)<\/em><\/p>", "c": [{"l": "A", "ok": false, "t": "Map both timeouts and zero-match queries to one uniform empty-response status so the coordinator's downstream handling stays simple.", "e": "A timeout and a successful query with no matches are different outcomes. Treating both as an empty response prevents the coordinator from knowing whether the search failed or genuinely found nothing."}, {"l": "B", "ok": true, "t": "Return a query that completed with zero matches as a success carrying an empty result set, since no matches is a valid finding.", "e": "When a query completes successfully but returns no matches, the empty result set is a valid outcome. The coordinator can accept this result and use it during synthesis without wasting resources on unnecessary retries."}, {"l": "C", "ok": false, "t": "Treat any empty result set as a failure and have the subagent retry with
