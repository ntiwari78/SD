/overview"], ["Anthropic API — Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "2.60", "d": "d5", "title": "Preventing Repeated Findings in Nightly Review Jobs", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JSON schemas, maintains high accuracy, handles edge cases gracefully, and integrates with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>A nightly Claude Code job reviews changes to a structured extraction pipeline and posts findings to a team dashboard. Every run re-posts the same schema-validation findings, so engineers now ignore the dashboard. How should the job be redesigned?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run the review at temperature zero so successive runs emit identical findings the dashboard can deduplicate by exact text match.", "e": "Deterministic sampling does not guarantee identical output when the code under review changes. Exact text matching is also brittle and cannot distinguish an issue that has been fixed from one that is still present."}, {"l": "B", "ok": true, "t": "Supply the last run's findings as context and direct the reviewer to surface only issues that are new or remain unfixed.", "e": "The reviewer receives the previous findings and an explicit instruction to report only new issues or unresolved carryovers. This addresses repetition by making the missing historical state explicit in the review context."}, {"l": "C", "ok": false, "t": "Instruct the reviewer to report only critical-severity schema violations so the dashboard receives far fewer repeated findings.", "e": "Severity filtering reduces the volume of findings but does not stop repeated critical findings from appearing every night. It also suppresses legitimate lower-severity issues without solving the underlying repetition."}, {"l": "D", "ok": false, "t": "Have the reviewer self-rate confidence on each finding and have the posting step drop findings below a confidence threshold.", "e": "Confidence addresses uncertainty, not repetition. A high-confidence finding can be detected and posted repeatedly. Model-generated confidence is also not necessarily calibrated to actual correctness."}], "o": "<p>Automated review jobs lose their audience when they repeatedly post the same issues. The underlying mechanism is that each CI invocation of Claude Code is a fresh, stateless run: it does not automatically remember the previous run's findings.<\/p>\n<p>The solution is to make the relevant historical state explicit:<\/p>\n<ol><li>Retrieve the prior run's findings.<\/li><li>Include those findings in the new review's context.<\/li><li>Instruct the reviewer to report only issues that are new or remain unfixed.<\/li><li>Update the stored findings after the review completes.<\/li><\/ol>\n<p>This approach preserves coverage of legitimate problems while reducing duplicate reports. It also gives the reviewer a basis for recognizing resolved issues instead of treating every run as a completely new investigation.<\/p>\n<p>The key principle is to solve repeated output with <strong>prior findings and explicit delta instructions<\/strong>, rather than relying on deterministic sampling, severity filtering, or self-reported confidence.<\/p>", "docs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"], ["Anthropic API — Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "3.1", "d": "d3", "title": "Choosing the Correct Subagent for Exploration and Editing", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A pipeline stage delegates a dependency survey to the Explore subagent and also instructs it to fix the outdated import statements it finds. The survey summary comes back, but no files were changed. What is the correct adjustment?<\/p>", "c": [{"l": "A", "ok": true, "t": "Delegate the fix work to the general-purpose subagent, since Explore is read-only and denies Write and Edit.", "e": "Explore is designed for searching and analyzing codebases. Its tool restrictions prevent it from modifying files. A general-purpose subagent can investigate the code and make the required edits when given the appropriate tools."}, {"l": "B", "ok": false, "t": "Override Explore's model field to a larger model, since its default model cannot generate code patches.", "e": "The model affects reasoning capability and cost, not the tools an agent is permitted to use. Even a more capable model cannot modify files without write-capable tools."}, {"l": "C", "ok": false, "t": "Raise Explore's thoroughness level to very thorough so it performs edits in addition to its analysis.", "e": "Thoroughness controls how deeply Explore searches and analyzes. It does not change its permissions or grant Write and Edit access."}, {"l": "D", "ok": false, "t": "Run the survey in the main conversation instead, since file changes made inside any subagent are discarded on return.", "e": "Subagents do not generally discard their file changes. A general-purpose subagent with write access can make persistent modifications. The problem is Explore's specific read-only configuration."}], "o": "<p>Claude Code's built-in subagents are specialized by their available tools, not merely by their prompts.<\/p>\n<p>Explore is useful for broad, read-only investigation. Its restrictions let the main agent delegate noisy discovery work without allowing the Explore subagent to alter the repository. When the task requires both discovery and modification, use a general-purpose subagent or separate the workflow into exploration followed by editing.<\/p>\n<p>The key distinction is between <strong>what an agent can reason about<\/strong> and <strong>what actions its tool permissions allow<\/strong>. Changing the model or thoroughness cannot override a tool restriction.<\/p>", "docs": [["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents"], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "3.2", "d": "d3", "title": "Understanding Tool Use During Plan Mode", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>A developer refactoring the agent's escalation logic enters plan mode and notices Claude running <code>git log<\/code> and grep shell commands before any plan has been presented. What should the developer do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Block all tool calls for the rest of the planning phase so the plan is produced only from context already in the session.", "e": "Plan mode relies on active exploration. Reading files and running commands helps Claude understand the codebase before proposing changes. Blocking all tools would force it to plan without adequate evidence."}, {"l": "B", "ok": false, "t": "Interrupt the session and re-enter plan mode, since running shell commands means the session has dropped out of plan mode.", "e": "Running exploratory shell commands does not mean Claude has left plan mode. The mode restricts edits, not all command execution. Restarting would also discard useful investigation."}, {"l": "C", "ok": false, "t": "Move the work into a temporary Git worktree so any edits Claude stages during planning stay isolated until approval.", "e": "Plan mode defers source edits until approval; it does not rely on staging edits in a temporary worktree. Worktrees isolate filesystem state for separate work, but they are not necessary to make plan mode read-only."}, {"l": "D", "ok": true, "t": "Continue planning; exploratory reads and shell commands are expected, and source edits wait until the plan is approved.", "e": "Plan mode allows Claude to inspect files and run exploratory commands to understand the task. The developer should review the proposed plan before approving execution. The presence of read-only investigation is expected and does not indicate a problem."}], "o": "<p>Plan mode separates <strong>research and planning from implementation<\/strong>. Claude can inspect the repository, trace dependencies, and run exploratory commands before it proposes a plan. Source modifications wait until the developer approves that plan.<\/p>\n<p>This is particularly valuable for changes to complicated workflows, such as escalation logic, where a developer wants to understand the current behavior before committing to an implementation.<\/p>\n<p>Do not confuse the restriction on editing with a restriction on exploration. The purpose of planning is to gather evidence first, propose an approach, and obtain approval before making changes.<\/p>", "docs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code — Permissions", "https://code.claude.com/docs/en/permissions"]]}, {"k": "3.3", "d": "d5", "title": "Reconciling Research Findings That Change Over Time", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>Two research subagents return dated findings on a CI vendor's job concurrency limit: a source published in 2023 states 20 jobs, and a source published in 2025 states 60. The synthesis step currently flags this as an unresolved contradiction. How should the final report handle these values?<\/p>", "c": [{"l": "A", "ok": false, "t": "Escalate the discrepancy to a human reviewer, since two credible sources disagree on a factual value the report depends on.", "e": "Escalation is appropriate when credible sources conflict in a way the available evidence cannot resolve. Here, the publication dates offer a plausible explanation: the vendor's limit may have changed over time. A human review is not necessary merely because historical and current values differ."}, {"l": "B", "ok": false, "t": "Exclude the metric from the report and record a coverage gap until a third source confirms one of the two values.", "e": "A coverage gap means the information could not be obtained. In this case, the system retrieved two values with dates. Omitting both would lose useful historical and current information."}, {"l": "C", "ok": false, "t": "Drop the 2023 figure from the report entirely, since a newer publication always supersedes an older one on the same fact.", "e": "Recency is not an automatic override rule. Removing the older value destroys historical context and hides the fact that the limit may have changed. The older figure could still be relevant to users investigating earlier configurations."}, {"l": "D", "ok": true, "t": "Present the 2025 figure as current and the 2023 figure as historical, with dates showing a likely change over time.", "e": "The publication dates provide temporal context. A limit of 20 jobs in 2023 and 60 in 2025 plausibly indicates that the vendor increased its limit. Presenting both values with their dates preserves provenance while identifying the newer value as current."}], "o": "<p>Research synthesis must distinguish a genuine contradiction from a change over time. Two sources can report different values without either being wrong if the underlying fact changed between publication dates.<\/p>\n<p>The solution is to carry dates and source metadata through the entire research pipeline. Subagents operate in separate contexts and return summaries, so the coordinator cannot reliably infer missing dates later. The output schema should preserve publication or data-collection dates alongside each finding.<\/p>\n<p>The guiding principle is <strong>dates are interpretive metadata, not a tiebreaker<\/strong>. Use them to explain a likely historical change, but do not automatically discard older evidence. Escalate only when the available metadata cannot reasonably resolve a disagreement.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Anthropic — Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents"]]}, {"k": "3.4", "d": "d2", "title": "Reporting Subagent Failures Without Losing Valid Results", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A coordinator agent delegates refactoring investigations (usage scans, dependency traces) to several subagents. You are auditing how subagent failures reach the coordinator. Which TWO reporting behaviors are anti-patterns to eliminate? <em>(Select TWO.)<\/em><\/p>", "c": [{"l": "A", "ok": false, "t": "Reporting a genuinely empty match set as a successful result, distinct from a failed access attempt.", "e": "This is good behavior, not an anti-pattern. A successful search that returns no matches is a valid empty result. Keeping it distinct from an access failure prevents unnecessary retries and false alarms."}, {"l": "B", "ok": true, "t": "Halting the entire investigation as soon as any single subagent reports an unrecoverable failure.", "e": "One subagent's failure does not invalidate the completed work of the others. Stopping the entire workflow discards valid results unnecessarily. The coordinator should continue where possible and explicitly report the incomplete coverage."}, {"l": "C", "ok": false, "t": "Proceeding with results from the remaining subagents while annotating the resulting coverage gap.", "e": "This is recommended behavior. The coordinator preserves usable findings while transparently indicating which investigation could not be completed."}, {"l": "D", "ok": true, "t": "Returning an empty result set marked as successful when a subagent's dependency scan fails midway.", "e": "This silently converts a failure into misinformation. The coordinator may interpret the empty set as proof that no dependencies exist, even though the scan never completed successfully."}], "o": "<p>A subagent runs in its own context, and the coordinator typically receives its final report rather than every internal tool call and retry. That makes accurate failure reporting essential.<\/p>\n<p>Two anti-patterns undermine reliability:<\/p>\n<ol><li><strong>Silent failure suppression:<\/strong> Returning an empty successful result when the investigation actually failed.<\/li><li><strong>Unnecessary global termination:<\/strong> Abandoning the entire investigation because one subagent could not complete its task.<\/li><\/ol>\n<p>A robust coordinator distinguishes successful empty results from failed operations, uses the valid results that are available, and annotates any resulting coverage gaps. This preserves progress without pretending that the investigation is complete.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Anthropic — Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents"]]}, {"k": "3.5", "d": "d2", "title": "Restricting a Subagent's Tool Access", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You define a billing-investigation subagent with an <code>AgentDefinition<\/code>. It needs to read customer and order data, but must be structurally unable to call <code>process_refund<\/code>. Which configuration achieves this guarantee?<\/p>", "c": [{"l": "A", "ok": false, "t": "State in the subagent's description that it is a read-only billing investigator so refund work is never routed to it.", "e": "The <code>description<\/code> field helps Claude decide when to delegate work to the subagent. It does not restrict the tools available after the subagent has been invoked. The refund tool would still be callable if it remained in the subagent's toolset."}, {"l": "B", "ok": false, "t": "Remove <code>process_refund<\/code> from the top-level <code>allowedTools<\/code> list so any attempt to invoke it is rejected automatically.", "e": "<code>allowedTools<\/code> controls which tools are pre-approved; it does not define which tools exist or are available. A tool not listed there can still be called subject to the normal permission handling."}, {"l": "C", "ok": true, "t": "Set the subagent's <code>tools<\/code> field to list only <code>get_customer<\/code> and <code>lookup_order<\/code>, leaving <code>process_refund<\/code> out of its tool set.", "e": "The <code>tools<\/code> field in <code>AgentDefinition<\/code> controls the subagent's available capabilities. When specified, the subagent receives only the listed tools. Because <code>process_refund<\/code> is absent, the billing-investigation subagent cannot invoke it."}, {"l": "D", "ok": false, "t": "Add an instruction to the subagent's prompt stating that it must never call <code>process_refund<\/code> under any circumstances.", "e": "Prompt instructions are behavioral guidance, not an access-control guarantee. The model may still call a tool that remains available, so the tool should be removed from the subagent's capabilities entirely."}], "o": "<p>An <code>AgentDefinition<\/code> separates three concerns:<\/p>\n<ul><li><strong>Description:<\/strong> Helps Claude decide when to delegate to the subagent.<\/li><li><strong>Prompt:<\/strong> Explains how the subagent should perform its assigned work.<\/li><li><strong>Tools:<\/strong> Determines which actions the subagent is capable of taking.<\/li><\/ul>\n<p>Only the tool configuration creates the required structural restriction. A billing investigator needs read access to customer and order information, not the ability to issue refunds. Giving it only <code>get_customer<\/code> and <code>lookup_order<\/code> enforces that separation regardless of the model's generated decisions.<\/p>\n<p>This is an important security principle: <strong>remove unnecessary capabilities rather than relying on instructions not to use them<\/strong>. It is especially important for consequential operations such as refunds.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "3.6", "d": "d5", "title": "Handling Frustrated Developers in Automated Code Reviews", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A developer replies to one of the pipeline's review comments: “This warning is wrong, it keeps blocking my PRs, and it's really frustrating.” The flagged finding is one the system can re-evaluate. How should the response flow be designed?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run sentiment analysis on developer replies and hand the thread to a human whenever negativity crosses a calibrated threshold.", "e": "Sentiment analysis is an unreliable proxy for whether human intervention is necessary. A negative tone does not necessarily mean a problem is beyond the system's capabilities. This approach may escalate easily resolvable disputes while overlooking calmly expressed but genuinely complex cases."}, {"l": "B", "ok": true, "t": "Acknowledge the frustration, re-check the finding with the developer's input, and escalate to a human only if the developer pushes back again.", "e": "Acknowledge the developer's frustration, use the additional context to re-evaluate the disputed finding, and escalate only if the developer reiterates their objection after the resolution attempt. Frustration alone is not an explicit request for human intervention."}, {"l": "C", "ok": false, "t": "Dismiss the flagged finding and pass the check, since holding a disputed warning against an unhappy developer erodes trust in automated review.", "e": "Removing a finding merely because someone disputes it is silent suppression. The warning may identify a real problem. The system should reassess the evidence rather than suppress the finding to avoid conflict."}, {"l": "D", "ok": false, "t": "Escalate the thread to a human maintainer right away, since a frustrated developer response indicates the case exceeds the automated reviewer's scope.", "e": "Frustration does not establish that the case exceeds the system's capabilities. Immediate escalation is appropriate when a human is explicitly requested; otherwise, the system should attempt a reasonable resolution first."}], "o": "<p>The key principle is to distinguish <strong>frustration from an explicit request for human intervention<\/strong>.<\/p>\n<p>A reliable workflow should:<\/p>\n<ol><li>Acknowledge the developer's frustration.<\/li><li>Re-evaluate the finding using the developer's additional context.<\/li><li>Explain the result and the evidence supporting it.<\/li><li>Escalate if the developer continues to object after the re-evaluation, or if human intervention is explicitly requested.<\/li><\/ol>\n<p>This balances automation efficiency with trust. Escalating every frustrated response overwhelms human reviewers, while automatically dismissing disputed findings undermines the integrity of the review process.<\/p>\n<p>Sentiment scoring does not solve the problem because emotional tone is not a dependable measure of task complexity. Observable actions—such as explicitly requesting a human or reiterating an objection after a resolution attempt—provide better escalation signals.<\/p>", "docs": [["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["Claude Code — GitHub Actions", "https://code.claude.com/docs/en/github-actions"]]}, {"k": "3.7", "d": "d4", "title": "Guaranteeing Structured JSON Output", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A CI review job asks Claude for JSON in prose, and parsing sometimes fails. The team defines a <code>report_findings<\/code> tool whose <code>input_schema<\/code> matches the findings format. Which TWO actions should the team take? <strong>(Select TWO.)<\/strong><\/p>", "c": [{"l": "A", "ok": false, "t": "Keep <code>tool_choice<\/code> at <code>auto<\/code> and add a firm prompt instruction to always call <code>report_findings<\/code>, since strict mode ensures the call occurs.", "e": "Strict mode constrains the format of a tool call when one occurs; it does not guarantee that a tool will be called. With <code>auto<\/code>, the model can still respond with plain text instead of invoking the tool."}, {"l": "B", "ok": true, "t": "Set <code>tool_choice<\/code> to force the <code>report_findings<\/code> tool rather than leaving the default <code>auto<\/code>, so every run produces a tool call.", "e": "Forcing the named tool ensures the model uses the structured tool-call path rather than choosing a conversational response. This closes the invocation gap left by <code>auto<\/code>."}, {"l": "C", "ok": false, "t": "Remove the downstream semantic validation layer, since schema conformance now guarantees the accuracy of every extracted value.", "e": "Schema conformance guarantees structural validity, not factual correctness. A finding can have valid JSON and the correct field types while still containing an incorrect severity, file path, or line number. Semantic validation must remain in place."}, {"l": "D", "ok": true, "t": "Add <code>strict: true<\/code> to the <code>report_findings<\/code> tool definition so the tool input is guaranteed to match the schema when called.", "e": "Strict tool use constrains the generated tool input to conform to the declared schema, reducing malformed JSON, missing required parameters, and type mismatches. This guarantee applies when a tool call happens, which is why it should be combined with the appropriate <code>tool_choice<\/code> setting."}], "o": "<p>Reliable structured output requires two distinct guarantees:<\/p>\n<ol><li><strong>Valid tool input:<\/strong> Use <code>strict: true<\/code> so tool arguments conform to the declared input schema.<\/li><li><strong>Guaranteed invocation:<\/strong> Configure <code>tool_choice<\/code> to force <code>report_findings<\/code> when every run must produce that tool call.<\/li><\/ol>\n<p>Neither guarantee establishes that the generated information is true. Downstream validation should continue checking business rules, cross-field consistency, and factual accuracy.<\/p>\n<p>The important distinction is that a schema controls the shape of the output, while validation checks whether the output is meaningful and correct.<\/p>", "docs": [["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Anthropic API — Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]]}, {"k": "3.8", "d": "d3", "title": "Revising an Incomplete Plan Before Execution", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and understand when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>While reviewing a plan Claude produced for a multi-file refactor, a developer notices the plan omits a shared utility module the change must also update. What should the developer do at the approval prompt?<\/p>", "c": [{"l": "A", "ok": false, "t": "Approve the plan in auto mode, since Claude's earlier exploration will surface the module during execution.", "e": "Auto mode proceeds with the approved plan without per-edit oversight. There is no guarantee that execution will rediscover a module omitted from the plan. An incomplete plan can therefore lead directly to an incomplete implementation."}, {"l": "B", "ok": false, "t": "Approve the plan with manual edit review and correct the omission as the affected edits appear.", "e": "Manual edit review helps identify problems in individual changes, but it does not fix the underlying scope omission. Approving a plan already known to be incomplete creates avoidable rework."}, {"l": "C", "ok": false, "t": "Exit plan mode with Shift+Tab and direct Claude to implement the refactor with the module included.", "e": "This abandons the plan-review checkpoint and switches toward direct execution. For a large, multi-file refactor, it is better to resolve the scope gap before implementation begins."}, {"l": "D", "ok": true, "t": "Keep planning and point out the missing module so the plan is revised before any edits begin.", "e": "The approval prompt provides a way to continue planning. Identify the omitted module and have Claude revise the plan while no edits have yet been made."}], "o": "<p>Plan mode separates planning from execution. Claude can explore the codebase and propose a sequence of changes without immediately editing source files. The approval point gives the developer an opportunity to evaluate the plan's completeness before committing to implementation.<\/p>\n<p>The guiding principle is that <strong>planning errors are cheaper to fix before execution than after it<\/strong>.<\/p>\n<p>When a plan omits a required module, the correct response is to revise the plan, confirm the necessary scope, and only then approve implementation. Manual review cannot reliably compensate for a gap in the plan itself, and abandoning the planning checkpoint removes a useful safeguard.<\/p>", "docs": [["Claude Code — Permissions and permission modes", "https://code.claude.com/docs/en/permissions"]]}, {"k": "3.9", "d": "d1", "title": "Refreshing Stale Findings in a Resumed Session", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A nightly re-review job wants to reuse yesterday's review session after a developer pushes a few new commits touching a handful of files. Most of the prior analysis remains valid. How should the job proceed?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resume the prior session and compact its history first, so the outdated tool results are summarized away before the new review begins.", "e": "Compaction summarizes conversation history; it does not compare previous tool results with the current repository. Stale findings can therefore survive compaction, merely in summarized form."}, {"l": "B", "ok": false, "t": "Discard the prior session and launch a completely fresh review that re-explores the entire repository so no stale analysis can carry over.", "e": "A fresh review can be appropriate when extensive changes invalidate most of the previous analysis. Here, only a few files changed, so starting over wastes useful investigation that can be preserved by refreshing the affected evidence."}, {"l": "C", "ok": true, "t": "Resume the prior session, supply the list of files the new commits changed, and instruct Claude to re-read those files before reusing earlier findings.", "e": "Resuming preserves the prior conversation and analysis, while explicitly re-reading changed files replaces the relevant stale evidence. This approach retains the useful bulk of the earlier work and refreshes the parts that may no longer be accurate."}, {"l": "D", "ok": false, "t": "Resume the prior session with no additional input, since resumption automatically reconciles saved tool results with the current repository state.", "e": "Session resumption restores conversation history; it does not automatically refresh earlier file reads. Without explicit instructions to re-read changed files, the model may rely on outdated code and conclusions."}], "o": "<p>A session should be understood as a <strong>conversation transcript, not a snapshot of the repository<\/strong>. It retains prompts, tool calls, tool results, and model responses. Earlier tool results remain in that history even if files change afterward.<\/p>\n<p>The appropriate recovery strategy depends on the amount of change:<\/p>\n<ul><li><strong>Limited changes:<\/strong> Resume the session, identify modified files, and re-read them before relying on previous conclusions.<\/li><li><strong>Extensive changes:<\/strong> Consider starting a fresh session with a structured summary of the still-relevant prior findings.<\/li><li><strong>Compaction:<\/strong> Use it to manage context size, not as a method for refreshing stale evidence.<\/li><\/ul>\n<p>The goal is to preserve valid work while explicitly updating the evidence that may have become outdated.<\/p>", "docs": [["Claude Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"]]}, {"k": "3.10", "d": "d1", "title": "Evaluating Competing Strategies from the Same Baseline", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A session has completed a thorough baseline analysis of a large pull request. The team wants to evaluate two competing review-prompt strategies from that identical baseline, with neither evaluation influencing the other. What should they do?<\/p>", "c": [{"l": "A", "ok": true, "t": "Resume the analysis session once per strategy with <code>fork_session<\/code> enabled, giving each evaluation its own copy of the baseline history.", "e": "Forking on resume creates a new session from a copy of the original conversation history, with its own session ID. Each review strategy starts from the same baseline, but subsequent messages and analysis remain isolated in their respective branches."}, {"l": "B", "ok": false, "t": "Resume the analysis session sequentially for both strategies, instructing Claude to disregard the first evaluation before beginning the second one.", "e": "Both evaluations would accumulate in the same conversation history. Asking the model to ignore the first evaluation does not remove that evaluation from its context, so the second strategy may still be influenced by it."}, {"l": "C", "ok": false, "t": "Start a fresh headless run for each strategy, seeding each prompt with a manually written summary of the baseline analysis findings.", "e": "A manually written summary is a lossy approximation of the original analysis. It can omit important details, and the two summaries may differ. Forking preserves the complete baseline history without requiring the analysis to be repeated or manually summarized."}, {"l": "D", "ok": false, "t": "Create a separate Git worktree for each strategy so the two evaluations run against fully isolated file trees that cannot interfere.", "e": "Git worktrees isolate filesystem state, not conversation history. Separate sessions in separate worktrees do not automatically inherit the original session's analysis. Worktrees may be useful for filesystem isolation, but they do not solve the context-isolation requirement in this question."}], "o": "<p>The objective is to conduct a controlled comparison: both strategies must begin with the same baseline, and neither strategy's subsequent analysis should influence the other.<\/p>\n<p>The <code>fork_session<\/code> mechanism supports this by creating independent session branches from the original history. The original baseline remains unchanged, and each branch can develop its own conclusions.<\/p>\n<p>Remember the distinction:<\/p>\n<ul><li><strong>Session history<\/strong> contains the conversation and analysis available to the model.<\/li><li><strong>Filesystem state<\/strong> contains the repository files being examined.<\/li><li><strong>Forking a session<\/strong> isolates subsequent conversation histories while preserving the shared starting context.<\/li><li><strong>Git worktrees<\/strong> isolate working directories, but do not copy conversation history into a new session.<\/li><\/ul>\n<p>For a fair comparison, fork the baseline once per strategy and let each branch proceed independently.<\/p>", "docs": [["Claude Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"]]}, {"k": "3.11", "d": "d1", "title": "Enforcing a Refund Limit Before Execution", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>A developer implements the $500 refund cap as a <code>PostToolUse<\/code> hook that inspects each <code>process_refund<\/code> call and records a policy violation when the amount exceeds the limit. In testing, over-limit refunds still execute against the backend. How should enforcement be corrected?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep the <code>PostToolUse<\/code> hook but have it return a blocking exit code so the refund transaction is cancelled once the violation is detected.", "e": "A <code>PostToolUse<\/code> hook runs after the tool has executed. By then, the backend may already have processed the refund. A blocking signal can provide feedback to the model, but it cannot cancel an already-completed transaction."}, {"l": "B", "ok": false, "t": "Keep the <code>PostToolUse<\/code> hook but have it rewrite the tool result to report failure, prompting the model to retry the case through <code>escalate_to_human<\/code>.", "e": "Rewriting the result changes what the model sees, not what happened in the backend. Reporting failure after a successful refund creates inconsistent system state and could even prompt the agent to issue another refund."}, {"l": "C", "ok": false, "t": "Add the $500 cap to the <code>process_refund<\/code> tool description and its input schema so the model refuses over-limit amounts when constructing the call.", "e": "Tool descriptions and schemas guide the model but do not provide an absolute enforcement guarantee. Financial policy limits with irreversible consequences require code-level checks."}, {"l": "D", "ok": true, "t": "Move the check into a <code>PreToolUse<\/code> interception hook that denies over-limit <code>process_refund<\/code> calls before execution and routes the case to <code>escalate_to_human<\/code>.", "e": "A <code>PreToolUse<\/code> hook intercepts the call before it reaches the backend. It can deterministically reject a refund above the limit and direct the case to human review."}], "o": "<p>The critical issue is <strong>when the policy check runs<\/strong>.<\/p>\n<ul><li><code>PreToolUse<\/code> runs before execution and can block a prohibited action.<\/li><li><code>PostToolUse<\/code> runs after execution and is useful for observing, annotating, or transforming results.<\/li><li>Tool descriptions and schemas guide model behavior, but are not substitutes for deterministic enforcement.<\/li><\/ul>\n<p>The general principle is to enforce policies <em>before<\/em> irreversible side effects occur. For a financial transaction, logging a violation afterward is not sufficient.<\/p>", "docs": [["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks"], ["Claude Agent SDK — Hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"]]}, {"k": "3.12", "d": "d3", "title": "Preventing a CI Job from Waiting for Input", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>A nightly pipeline job invokes Claude Code to scaffold boilerplate modules, but the job hangs indefinitely waiting for input no human will provide. Which TWO invocation changes prevent the hang? <strong>(Select two.)<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "Pre-approve the tools the job needs with <code>--allowedTools<\/code> so tool calls never pause for a permission prompt.", "e": "Tools that would ordinarily trigger permission prompts can stall an unattended pipeline. Explicitly allowing the required tools provides an approval path for those calls without requiring a human to respond."}, {"l": "B", "ok": true, "t": "Run the invocation with the <code>-p<\/code> flag so the prompt is processed non-interactively and the process exits.", "e": "The <code>-p<\/code> or <code>--print<\/code> flag runs Claude Code in non-interactive mode. It processes the prompt, writes the result to standard output, and exits instead of waiting for another conversational turn."}, {"l": "C", "ok": false, "t": "Pass the prompt as a positional argument to <code>claude<\/code>, which runs the command without entering an interactive session.", "e": "Passing a prompt as an argument alone does not switch execution into non-interactive mode. Without <code>-p<\/code> or <code>--print<\/code>, Claude Code can still enter an interactive session and wait for input."}, {"l": "D", "ok": false, "t": "Add <code>--output-format json<\/code>, which switches Claude Code into non-interactive mode for automated environments.", "e": "<code>--output-format json<\/code> controls how results are emitted; it does not switch the execution mode. It can make output easier to parse, but it does not remove the interactive wait."}], "o": "<p>There are two separate reasons an automated job may hang:<\/p>\n<ol><li><strong>Interactive execution:<\/strong> Use <code>-p<\/code> or <code>--print<\/code> so the process handles the supplied prompt and exits.<\/li><li><strong>Permission prompts:<\/strong> Configure <code>--allowedTools<\/code> for the tools the unattended job needs.<\/li><\/ol>\n<p>These flags solve different problems. The print flag prevents waiting for another user turn; the tool-approval configuration prevents the process from stalling on permission decisions.<\/p>\n<p>One important distinction: <code>--allowedTools<\/code> auto-approves the specified tools; it should not be confused with a complete restriction on which tools the agent is permitted to use.<\/p>", "docs": [["Claude Code — Headless mode", "https://code.claude.com/docs/en/headless"], ["Claude Code — CLI reference", "https://code.claude.com/docs/en/cli-reference"]]}, {"k": "3.13", "d": "d2", "title": "Returning Customer-Friendly Tool Errors", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. It handles ambiguous requests such as returns, billing disputes, and account issues. Its backend MCP tools include <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>The <code>process_refund<\/code> tool rejects an out-of-window refund with:<\/p>\n<ul><li><code>isError: true<\/code><\/li><li><code>errorCategory: \"business\"<\/code><\/li><li><code>isRetryable: false<\/code><\/li><li><code>message: \"ERR_RB_221: refund_window_check failed\"<\/code><\/li><\/ul>\n<p>The agent then tells customers an unspecified internal error occurred. What change fixes the customer communication?<\/p>", "c": [{"l": "A", "ok": false, "t": "Maintain a mapping of error codes to customer explanations in the system prompt so the agent can translate <code>ERR_RB_221<\/code> itself.", "e": "This duplicates knowledge already held by the tool, consumes prompt tokens, and can become outdated when policy codes change. The explanation should be provided where the failure is identified."}, {"l": "B", "ok": false, "t": "Return the policy engine's complete rejection payload, including rule identifiers and internal thresholds, so no detail is lost.", "e": "Exposing raw internal details does not make the response more useful. Rule identifiers and internal thresholds may be inappropriate for customers and do not necessarily help the agent explain the decision."}, {"l": "C", "ok": true, "t": "Include a plain-language reason in the <code>message<\/code> field, such as the order being past the returns window, that the agent can relay.", "e": "The error metadata already indicates that the operation failed and should not be retried. A clear, human-readable message gives the agent the information it needs to explain the policy decision accurately."}, {"l": "D", "ok": false, "t": "Set <code>isRetryable<\/code> to <code>true<\/code> so the agent retries the call and gathers additional detail before responding to the customer.", "e": "A deterministic returns-window violation will not be resolved by retrying the same request. Marking it retryable encourages unnecessary calls without adding useful information."}], "o": "<p>The error response needs to communicate both <strong>what happened<\/strong> and <strong>what the agent should do next<\/strong>.<\/p>\n<p>In this case, the existing fields describe a non-retryable business-rule rejection. The missing piece is a message that explains the reason in understandable language.<\/p>\n<p>A better message might say that the order falls outside the permitted returns window. The agent can then communicate the refusal accurately instead of inventing a reason or claiming an unspecified internal error occurred.<\/p>\n<p>The key distinction is between:<\/p>\n<ul><li><strong>Failure metadata:<\/strong> Indicates the type of failure and whether retrying is appropriate.<\/li><li><strong>Error message:<\/strong> Explains the failure in a way that supports the next action.<\/li><\/ul>\n<p>For a business-rule refusal, the next action is usually a customer explanation, not a retry. Error messages should therefore be useful and customer-appropriate without exposing unnecessary internal implementation details.<\/p>", "docs": [["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"], ["Model Context Protocol — Specification", "https://modelcontextprotocol.io/specification"]]}, {"k": "3.14", "d": "d5", "title": "Validating Accuracy Before Removing Human Reviews", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. It handles returns, billing disputes, and account issues through custom MCP tools. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>Quarterly quality audits show the agent's resolutions are 96% correct overall, and leadership wants to end manual spot-checks of resolved cases. What should the team verify before agreeing?<\/p>", "c": [{"l": "A", "ok": true, "t": "Segment the accuracy figure by issue category and confirm performance is consistent across billing disputes, account issues, and returns.", "e": "A high aggregate accuracy score can conceal poor performance on a minority category. Evaluating each issue category separately reveals whether one type of case remains unreliable."}, {"l": "B", "ok": false, "t": "Extend the audit window to collect a much larger sample so the 96% aggregate estimate reaches statistical significance.", "e": "A larger sample can make the overall estimate more precise, but it cannot reveal category-level weaknesses if the results are still combined into one aggregate figure."}, {"l": "C", "ok": false, "t": "Benchmark the 96% figure against the measured accuracy of human agents and end spot-checks once the agent scores higher.", "e": "Comparing overall agent accuracy with overall human accuracy does not establish that the agent performs reliably on every category. A weak category can remain hidden in both aggregate figures."}, {"l": "D", "ok": false, "t": "Verify that the agent's self-rated confidence exceeded a calibrated threshold on every case included in the audit sample.", "e": "Self-rated confidence is not a dependable substitute for measured correctness. A model can be highly confident and still be wrong, particularly on difficult cases."}], "o": "<p>The risk is that <strong>aggregate accuracy hides uneven performance<\/strong>.<\/p>\n<p>For example, if routine returns account for most cases, excellent results on returns could conceal substantially weaker results on billing disputes. An overall score of 96% would not expose that weakness.<\/p>\n<p>Before removing human spot-checks, the team should:<\/p>\n<ol><li>Break down accuracy by issue category.<\/li><li>Confirm that each category meets the required performance threshold.<\/li><li>Continue monitoring performance after any reduction in oversight.<\/li><\/ol>\n<p>The principle is that a model should be evaluated against the distinct tasks it actually performs, rather than judged solely by one blended score. More data helps estimate an aggregate more precisely, but only segmented evaluation reveals where errors are concentrated.<\/p>", "docs": [["Anthropic — Define your success criteria", "https://platform.claude.com/docs/en/test-and-evaluate/define-success"], ["Anthropic — Create strong empirical evaluations", "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"]]}, {"k": "3.15", "d": "d5", "title": "Reducing Context Bloat in Automated Code Reviews", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>During automated reviews of large pull requests, each call to the pipeline's <code>fetch_pr_details<\/code> MCP tool returns 50+ metadata fields, but the review only needs the diff, changed file paths, and author notes. The context window fills before big reviews finish. Which change is most effective?<\/p>", "c": [{"l": "A", "ok": true, "t": "Add a <code>PostToolUse<\/code> hook that trims each <code>fetch_pr_details<\/code> result to the review-relevant fields before it enters context.", "e": "The hook can transform the tool result to retain only the required fields. This prevents irrelevant metadata from accumulating in the model's context during repeated tool calls."}, {"l": "B", "ok": false, "t": "Compact the conversation between file reviews so the accumulated tool output is condensed into summaries as the session proceeds.", "e": "Compaction acts after the tool outputs have already entered the conversation. It may also lose precise information, such as file paths or diff details. Trimming the results before they accumulate addresses the source of the problem."}, {"l": "C", "ok": false, "t": "Raise <code>max_tokens<\/code> on each request so the model has additional room to work through the accumulated pull request metadata.", "e": "<code>max_tokens<\/code> controls the maximum length of the model's output, not the size of the input context. Increasing it does not remove the irrelevant metadata consuming the context window."}, {"l": "D", "ok": false, "t": "Instruct Claude in the review prompt to disregard any metadata fields that are not relevant to evaluating the code changes.", "e": "Telling the model to ignore a field does not remove that field from the input. All the irrelevant metadata still consumes context tokens, regardless of whether the model attends to it."}], "o": "<p>The most effective fix is to <strong>reduce tool output before it enters the model's context<\/strong>.<\/p>\n<p>If a tool returns more than 50 fields but only three kinds of information matter, retaining only the diff, changed file paths, and author notes can substantially reduce context consumption. This becomes especially important in agentic workflows, where conversation history and tool results may be sent again over successive model turns.<\/p>\n<p>The alternatives address the problem less directly:<\/p>\n<ul><li><strong>Compaction<\/strong> compresses accumulated context but may lose exact details.<\/li><li><strong>Increasing <code>max_tokens<\/code><\/strong> affects output capacity rather than input context size.<\/li><li><strong>Prompt instructions<\/strong> do not remove unused fields or their token cost.<\/li><li><strong>Result trimming<\/strong> reduces the amount of irrelevant data entering context on every call.<\/li><\/ul>\n<p>A <code>PostToolUse<\/code> hook is appropriate here because the goal is to transform the result after the tool runs but before the result is used in subsequent model reasoning. Unlike the refund enforcement scenario in Question 11, this task is about normalizing output, not preventing an irreversible action.<\/p>", "docs": [["Claude Code — Hooks", "https://code.claude.com/docs/en/hooks"], ["Claude Agent SDK — Hooks", "https://platform.claude.com/docs/en/agent-sdk/hooks"]]}, {"k": "3.16", "d": "d4", "title": "Preventing Fabricated Dates in Structured Extraction", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>A pipeline extracts metadata from legacy service manifests. The schema marks <code>deprecation_date<\/code> as required, but many older manifests never record one, and the model fills the field with plausible dates. Which change prevents the fabrication?<\/p>", "c": [{"l": "A", "ok": false, "t": "Re-run each affected extraction with the fabricated date and a correction instruction included in the retry prompt.", "e": "Retry with error feedback works for format and structural mistakes, not for information that is absent from the source. If the manifest contains no deprecation date and the schema still requires a value, the retry can produce another fabrication."}, {"l": "B", "ok": false, "t": "Add a pattern constraint restricting <code>deprecation_date<\/code> to the manifests' ISO date format so fabricated values fail schema validation.", "e": "Fabricated dates are often syntactically valid ISO dates. A format constraint checks the shape of the value, not whether the date actually appears in the manifest. It does not give the model a legal way to represent missing information."}, {"l": "C", "ok": true, "t": "Declare <code>deprecation_date<\/code> nullable with type <code>[\"string\", \"null\"]<\/code> and omit it from <code>required<\/code> so the model can return <code>null<\/code> for missing dates.", "e": "A required field that accepts only strings leaves the model without an honest way to express absence. Making the field nullable and optional allows the output to represent a missing date without inventing one."}, {"l": "D", "ok": false, "t": "Add a system prompt rule stating that the model must never output a deprecation date that does not appear in the manifest text.", "e": "A prompt instruction cannot override a schema that structurally requires a value. If the source lacks a date, the model still has to satisfy the schema, creating pressure to produce a plausible but unsupported value."}], "o": "<p>A schema defines the space of outputs the model is allowed to produce. If a field is mandatory and cannot be null, the model has no schema-valid way to represent a genuinely missing value.<\/p>\n<p>The fix is to make absence an explicit, legal state in the schema.<\/p>\n<p>For example:<\/p>\n<pre><code class=\"lang-json\">{\n  \"type\": \"object\",\n  \"properties\": {\n    \"deprecation_date\": {\n      \"type\": [\"string\", \"null\"]\n    }\n  }\n}<\/code><\/pre>\n<p>In this example, the field can contain a string or <code>null<\/code>. If it is also omitted from the object's <code>required<\/code> list, the field itself may be absent. These are distinct choices:<\/p>\n<ul><li><strong>Nullable:<\/strong> The field may be present with a value of <code>null<\/code>.<\/li><li><strong>Optional:<\/strong> The field may be omitted from the output.<\/li><li><strong>Required and nullable:<\/strong> The field must be present, but <code>null<\/code> is allowed.<\/li><\/ul>\n<p>The best choice depends on the downstream contract. If downstream consumers expect the key to always exist, use a required nullable field. If omission is allowed, the field can be optional.<\/p>", "docs": [["Anthropic — Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Anthropic — Increase output consistency", "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency"]]}, {"k": "3.17", "d": "d1", "title": "Continuing an Investigation After a Major Framework Migration", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>Last week an engineer's session traced how feature flags propagate through a checkout service. A framework migration has since restructured most of the modules that session read. What is the reliable way to continue the investigation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resume the prior session after adding a <code>CLAUDE.md<\/code> note describing the migration so the loaded guidance corrects the stale observations.", "e": "<code>CLAUDE.md<\/code> provides guidance, but it does not remove or rewrite the old tool results restored by the resumed session. The model would still have detailed observations describing the previous module structure."}, {"l": "B", "ok": false, "t": "Resume the prior session and rely on Claude Code's automatic context management to have already dropped the older tool outputs.", "e": "Automatic context management clears or condenses older tool outputs when the context window requires it. It is not a staleness detector and does not guarantee that results describing the old architecture have been removed."}, {"l": "C", "ok": true, "t": "Start a new session seeded with a structured summary of the confirmed propagation findings, leaving the outdated tool results behind.", "e": "A new session provides a clean context. A structured summary preserves the confirmed findings worth carrying forward without reintroducing obsolete file reads and search results."}, {"l": "D", "ok": false, "t": "Fork the prior session so a new branch inherits the full investigation context while the original stays intact for reference.", "e": "Forking copies the existing history, including stale <code>Read<\/code> and <code>Grep<\/code> results. It is useful when exploring alternative approaches from a valid baseline, not when the baseline itself has become outdated."}], "o": "<p>A session is a record of the conversation, not a snapshot of the repository. It contains prompts, tool calls, tool results, and responses as they were recorded.<\/p>\n<p>When a framework migration substantially changes the modules that were investigated, resuming or forking the old session can reintroduce obsolete evidence. The model may then reason from that evidence as though it still describes the current codebase.<\/p>\n<p>The reliable approach is to distinguish between conclusions and the evidence supporting them:<\/p>\n<ul><li><strong>Keep:<\/strong> Confirmed findings about how feature flags propagate, if those conclusions remain useful.<\/li><li><strong>Discard:<\/strong> Old file contents, search results, and other observations that no longer describe the architecture.<\/li><li><strong>Re-verify:<\/strong> The retained conclusions against the current implementation.<\/li><\/ul>\n<p>This is a case where starting fresh is preferable to resuming. If only a small number of files had changed, targeted re-reading within the existing session would be more efficient. Here, because most of the modules were restructured, a new session seeded with a structured summary avoids carrying extensive stale evidence forward.<\/p>", "docs": [["Claude Agent SDK — Sessions", "https://platform.claude.com/docs/en/agent-sdk/sessions"], ["Claude Code — How Claude Code works", "https://code.claude.com/docs/en/how-claude-code-works"]]}, {"k": "3.18", "d": "d3", "title": "Storing Personal Claude Code Instructions Across All Projects", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>An engineer on this team wants Claude Code to follow their personal working preferences—for example, explaining shell commands before running them—in every repository they open, while guaranteeing teammates never receive those preferences through version control. Where should these instructions live?<\/p>", "c": [{"l": "A", "ok": false, "t": "In <code>~/.claude/settings.json<\/code>, which applies personal configuration across all projects.", "e": "The user-level settings file has the right scope but the wrong purpose. It stores structured configuration, such as permissions and tool settings, rather than natural-language instructions describing how Claude should behave."}, {"l": "B", "ok": false, "t": "In a gitignored <code>CLAUDE.local.md<\/code> file created in each repository.", "e": "A <code>CLAUDE.local.md<\/code> file is suitable for personal instructions that apply to one project. However, the engineer would need to create and maintain the file separately in every repository, rather than defining preferences once for all projects."}, {"l": "C", "ok": true, "t": "In <code>~/.claude/CLAUDE.md<\/code> in the engineer's home directory.", "e": "The user-level <code>CLAUDE.md<\/code> file contains personal instructions that apply across the engineer's projects on that machine. Because it resides in the home directory rather than a project repository, it does not get shared through project version control."}, {"l": "D", "ok": false, "t": "In the project-level <code>CLAUDE.md<\/code> under a clearly labeled personal section.", "e": "A project-level <code>CLAUDE.md<\/code> is generally shared with the team through version control. Labeling a section as personal does not prevent the file's contents from being committed or loaded by teammates."}], "o": "<p>Claude Code instruction files have different scopes. The appropriate location depends on two questions:<\/p>\n<ol><li><strong>Who should receive the instructions?<\/strong> Only the individual engineer, or the whole team?<\/li><li><strong>Where should they apply?<\/strong> One repository, or all repositories?<\/li><\/ol>\n<div class=\"tablewrap\"><table><thead><tr><th>Location<\/th><th>Scope<\/th><th>Appropriate use<\/th><\/tr><\/thead><tbody><tr><td><code>~/.claude/CLAUDE.md<\/code><\/td><td>Personal, across projects<\/td><td>Persistent individual preferences<\/td><\/tr><tr><td><code>CLAUDE.local.md<\/code><\/td><td>Personal, one project<\/td><td>Project-specific private instructions<\/td><\/tr><tr><td>Project-level <code>CLAUDE.md<\/code><\/td><td>Shared with the project<\/td><td>Team conventions and repository guidance<\/td><\/tr><tr><td><code>~/.claude/settings.json<\/code><\/td><td>Personal configuration<\/td><td>Structured settings such as permissions<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The requested scope is personal and cross-project, so <code>~/.claude/CLAUDE.md<\/code> is the correct location.<\/p>", "docs": [["Claude Code — Memory and instruction files", "https://code.claude.com/docs/en/memory"], ["Claude Code — Settings", "https://code.claude.com/docs/en/settings"]]}, {"k": "3.19", "d": "d4", "title": "Improving Review Independence for Customer Support Resolutions", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>In pilot testing, a same-session self-review step approves drafts containing subtle policy misapplications; the agent's reasoning shows it considered and dismissed each concern during generation. What change most directly addresses this limitation?<\/p>", "c": [{"l": "A", "ok": true, "t": "Route each draft, along with the case data, to a separate Claude instance that lacks the generation session's reasoning.", "e": "A separate instance receives the draft and underlying case data without inheriting the reasoning that led to the flawed decision. It can evaluate the draft independently rather than being anchored to the generator's prior justifications."}, {"l": "B", "ok": false, "t": "Generate two drafts within the same session and release a response only when both drafts reach matching conclusions.", "e": "Both drafts share the same conversation history and reasoning context. They may therefore repeat the same policy misapplication. Agreement between correlated attempts does not establish independent correctness."}, {"l": "C", "ok": false, "t": "Enable extended thinking during the generation turn so the agent deliberates more thoroughly before finalizing each draft.", "e": "More deliberation can improve reasoning, but it does not remove the anchoring caused by the original reasoning context. The issue is the independence of the review, not simply the amount of reasoning."}, {"l": "D", "ok": false, "t": "Add stronger self-critique instructions telling the same session to challenge its own conclusions before responding.", "e": "The same session still retains the reasoning that justified the original decision. Stronger instructions may help in some cases, but they do not provide the independent perspective needed to challenge a conclusion that the session has already rationalized."}], "o": "<p>The failure described is a form of <strong>shared-context anchoring<\/strong>. During generation, the model considers potential concerns and dismisses them. When asked to review its own draft in the same session, it may rely on the same justifications instead of re-examining the decision from scratch.<\/p>\n<p>The recommended design separates generation and verification:<\/p>\n<ol><li>The generation instance produces a draft resolution.<\/li><li>A separate review instance receives the draft and relevant case data.<\/li><li>The reviewer checks the policy application against the evidence without receiving the generator's reasoning.<\/li><li>The system uses the independent review to identify issues that require correction or escalation.<\/li><\/ol>\n<p>This does not guarantee that the second instance will catch every mistake, but it reduces the shared-context bias that undermines same-session self-review.<\/p>\n<p>The other options increase the effort spent within the original context without eliminating that context. A second draft, extended thinking, or stronger self-critique instructions can all remain anchored to the same assumptions. Independent review changes the information available to the reviewer, which is the key design improvement.<\/p>", "docs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"], ["Anthropic — Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"]]}, {"k": "3.20", "d": "d4", "title": "Building a Test-Driven Workflow for Refund Eligibility", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You are using Claude Code to implement the refund eligibility logic that gates <code>process_refund<\/code> calls. You want a test-driven workflow that produces progressive improvement across iterations. Which two practices should you adopt? <strong>(Select TWO.)<\/strong><\/p>", "c": [{"l": "A", "ok": true, "t": "When a run produces several interdependent failures, share them together in one message so fixes account for their interactions.", "e": "Interdependent failures should be presented together because fixing one may affect another. Giving Claude the related failures in one message allows it to reason about their interactions and produce a coherent fix."}, {"l": "B", "ok": false, "t": "After each failing run, rewrite the prose specification in greater detail instead of pasting the raw failing test output back into the session.", "e": "Raw test output identifies precisely which assertions failed and how actual behavior differed from expected behavior. Rewriting the prose specification discards that concrete signal and reintroduces ambiguity."}, {"l": "C", "ok": true, "t": "Build the test set before implementation, covering expected behavior, edge cases like expired return windows, and performance requirements.", "e": "Writing tests before implementation establishes an objective definition of success. A useful suite should cover normal behavior, important edge cases, and any performance requirements that the refund eligibility logic must meet."}, {"l": "D", "ok": false, "t": "Have Claude generate the test suite after the implementation is complete, confirming its own code passes each case.", "e": "Writing tests after implementation risks encoding the implementation's existing behavior—including its bugs—as the expected behavior. Tests written first provide an independent target against which the implementation can be evaluated."}], "o": "<p>Test-driven iteration has two important components: defining the expected behavior before implementation and using actual test failures to guide subsequent improvements.<\/p>\n<p><strong>First, create the tests before writing the implementation.<\/strong> The test suite should cover the expected behavior and important edge cases, such as an expired return window, a partial refund, or an order without a matching customer. Where relevant, it should also include performance requirements.<\/p>\n<p><strong>Second, feed concrete failure evidence back into the iteration loop.<\/strong> Test output tells Claude exactly which behavior diverged from the specification. This is more useful than repeatedly elaborating a prose description after each failed run.<\/p>\n<p>The way failures are grouped also matters:<\/p>\n<ul><li><strong>Interdependent failures:<\/strong> Present them together so the fix can account for their interactions.<\/li><li><strong>Independent failures:<\/strong> They can be handled sequentially when appropriate.<\/li><li><strong>Tests written before implementation:<\/strong> Define the target independently of the code.<\/li><li><strong>Tests written after implementation:<\/strong> Risk validating the behavior that already exists rather than the behavior that should exist.<\/li><\/ul>\n<p>The two selected practices—writing a comprehensive test set up front and presenting coupled failures together—support progressive, evidence-driven improvement.<\/p>", "docs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code — Common workflows", "https://code.claude.com/docs/en/common-workflows"]]}, {"k": "3.21", "d": "d3", "title": "Sharing MCP Configuration Without Exposing Secrets", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline's automated reviews use a GitHub MCP server that requires a personal access token. The server configuration must reach every contributor and CI runner through version control. How should the token be handled?<\/p>", "c": [{"l": "A", "ok": false, "t": "Store the token in <code>CLAUDE.md<\/code> so it is loaded into context on every session and available whenever the server needs it.", "e": "<code>CLAUDE.md<\/code> provides instructions to the model; it does not configure MCP server credentials. The token would not be supplied to the server this way. It would also place a secret in a committed file and expose it in model context."}, {"l": "B", "ok": true, "t": "Reference the token as <code>${GITHUB_TOKEN}<\/code> in the project <code>.mcp.json<\/code> and export the variable in CI and on developer machines.", "e": "Claude Code supports environment variable expansion in project MCP configuration. The repository can contain the variable reference, while each developer's environment and the CI pipeline supply the actual token securely."}, {"l": "C", "ok": false, "t": "Paste the token directly into the project <code>.mcp.json<\/code>, since the repository is private and only contributors can read it.", "e": "A private repository is not a safe place to commit live credentials. The token may remain in Git history and become accessible to current or future contributors. If exposed, it must be rotated, and removing it from the latest commit alone does not erase historical copies."}, {"l": "D", "ok": false, "t": "Configure the server and its token in <code>~/.claude.json<\/code> on each contributor machine and CI runner, documenting the setup steps.", "e": "This puts the configuration on individual machines rather than in the shared project configuration. It creates manual setup work and configuration drift, undermining the requirement that the server configuration be distributed through version control."}], "o": "<p>The key is to separate <strong>shared configuration from secret values<\/strong>.<\/p>\n<p>The project-level <code>.mcp.json<\/code> file is intended to distribute MCP server configuration through version control. Environment variable expansion lets the committed file reference a credential without containing the credential itself.<\/p>\n<p>For example:<\/p>\n<pre><code class=\"lang-json\">{\n  \"mcpServers\": {\n    \"github\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"your-github-mcp-server\"],\n      \"env\": {\n        \"GITHUB_TOKEN\": \"${GITHUB_TOKEN}\"\n      }\n    }\n  }\n}<\/code><\/pre>\n<p>The exact server command and arguments depend on the MCP server being used. The important pattern is the <code>${GITHUB_TOKEN}<\/code> reference.<\/p>\n<ul><li>Developers provide the token through their local environment.<\/li><li>CI injects the token through a protected pipeline variable or secret.<\/li><li>The committed configuration remains consistent across environments.<\/li><li>Token rotation happens in the secret-management layer rather than by editing Git history.<\/li><\/ul>\n<p>Never commit the live token, even to a private repository.<\/p>", "docs": [["Claude Code — MCP", "https://code.claude.com/docs/en/mcp"], ["Claude Agent SDK — MCP", "https://platform.claude.com/docs/en/agent-sdk/mcp"]]}, {"k": "3.22", "d": "d3", "title": "Sharing a Custom Slash Command with a Team", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and an understanding of when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A developer keeps a custom slash command for database migrations in a file at <code>~/.claude/commands/db-migrate.md<\/code>, so teammates cannot invoke it. What change makes the command available to everyone who clones the repository?<\/p>", "c": [{"l": "A", "ok": false, "t": "Paste the command's prompt body into the project <code>CLAUDE.md<\/code> under a <code># Commands<\/code> heading.", "e": "<code>CLAUDE.md<\/code> supplies persistent project context and conventions. Adding text under a Commands heading does not register that text as an invocable slash command."}, {"l": "B", "ok": false, "t": "Have each teammate copy the file into their own <code>~/.claude/commands/<\/code> directory.", "e": "This can make the command available on individual machines, but it requires manual distribution and updating. New teammates may miss the command, and different developers may end up with different versions."}, {"l": "C", "ok": false, "t": "Add an <code>@import<\/code> in the project <code>CLAUDE.md<\/code> pointing at the file's home-directory path.", "e": "The <code>@path<\/code> import mechanism imports content into <code>CLAUDE.md<\/code>; it does not register command definitions. A home-directory path belonging to one developer also would not resolve on other teammates' machines."}, {"l": "D", "ok": true, "t": "Move the command file into <code>.claude/commands/<\/code> in the repository and commit it.", "e": "A Markdown command file stored in the project's <code>.claude/commands/<\/code> directory is project-scoped. Committing the file makes it available to teammates who clone or pull the repository."}], "o": "<p>Claude Code's custom command scope is determined by the file's location.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Location<\/th><th>Scope<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td><code>~/.claude/commands/<\/code><\/td><td>User-level<\/td><td>Available to one user across
