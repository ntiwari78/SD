ogether in one pass.", "e": "The scenario does not indicate that the files exceed the context limit. A larger window increases capacity, but does not directly resolve attention dilution or inconsistent judgments within a single large review."}], "o": "<p>This is an <strong>attention dilution problem<\/strong>. When one pass must review a large changeset, the model may devote more attention to some files than others. This can result in uneven feedback and inconsistent application of the same standards.<\/p>\n<p>A better design uses prompt chaining: divide the work into multiple sequential calls with distinct responsibilities.<\/p>\n<p><strong>Stage 1 — Per-file review<\/strong><\/p>\n<ul><li>Analyze each file separately.<\/li><li>Identify local correctness, security, and maintainability issues.<\/li><li>Apply the same review criteria to each file.<\/li><li>Produce structured findings that include the file path, relevant location, issue, and rationale.<\/li><\/ul>\n<p><strong>Stage 2 — Cross-file integration review<\/strong><\/p>\n<ul><li>Examine interactions between files.<\/li><li>Compare interfaces, types, function signatures, and data contracts.<\/li><li>Look for inconsistent assumptions, dependency problems, and mismatched behavior.<\/li><li>Check whether individually reasonable changes introduce system-level defects when combined.<\/li><\/ul>\n<p>The integration pass should receive the relevant file relationships and the per-file findings. It should not assume that the individual reviews have already identified every cross-file issue.<\/p>\n<p>This approach also makes intermediate outputs available for inspection, logging, and validation. It is generally more useful than repeatedly running the same overloaded review and hoping that multiple attempts compensate for the original structure.<\/p>\n<p><strong>Quick revision:<\/strong> For a large pull request, review files individually for local defects, then run a separate integration pass for cross-file defects.<\/p>", "docs": [["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"], ["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows"]]}, {"k": "3.44", "d": "d1", "title": "Return Grep Results Through the Messages API", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with MCP servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>The agent requests a <code>Grep<\/code> search across a legacy repository, and the harness executes it successfully. What must the harness do so the model can read the search results and choose its next action?<\/p>", "c": [{"l": "A", "ok": false, "t": "Send the output back in a dedicated tool-role message, keeping tool results separate from ordinary user and assistant content in the history.", "e": "The Claude Messages API does not use a separate <code>tool<\/code> role for these results. Tool requests appear in assistant messages, while tool outputs are supplied through <code>tool_result<\/code> content blocks inside a user message."}, {"l": "B", "ok": false, "t": "Attach the output to the Grep tool's definition metadata so the model reads it when it re-evaluates the available tools on its next pass.", "e": "Tool definitions describe the tool's name, purpose, and input schema. They are not a storage mechanism for runtime results. The output must be included in the conversation history."}, {"l": "C", "ok": true, "t": "Append a <code>tool_result<\/code> block referencing the <code>tool_use<\/code> ID in a user message and send the updated history in the next request.", "e": "The harness must explicitly return the result associated with the original tool call. The matching <code>tool_use_id<\/code> connects the output to the correct request, and the next API call allows Claude to continue reasoning with that result."}, {"l": "D", "ok": false, "t": "Do nothing extra, since the API runs the requested Grep call server-side and automatically injects its output into the model's context.", "e": "The Messages API does not execute client-side tools automatically. The application or harness is responsible for running the requested tool and returning its output to Claude."}], "o": "<p>The key concept is that <strong>Claude's tool request is not the same as tool execution<\/strong>.<\/p>\n<p>When Claude decides to use a tool, the response contains an assistant message with a <code>tool_use<\/code> block, including an ID, tool name, and input arguments. The response may have <code>stop_reason: \"tool_use\"<\/code>.<\/p>\n<p>The harness then performs the operation and returns the output:<\/p>\n<ol><li>Receive the assistant's tool request.<\/li><li>Execute the requested Grep operation.<\/li><li>Capture the result or error.<\/li><li>Create a <code>tool_result<\/code> block with the corresponding <code>tool_use_id<\/code>.<\/li><li>Place that block in a user message.<\/li><li>Send the updated conversation history in the next API request.<\/li><\/ol>\n<p>An illustrative result message looks like this:<\/p>\n<pre><code class=\"lang-json\">{\n  \"role\": \"user\",\n  \"content\": [\n    {\n      \"type\": \"tool_result\",\n      \"tool_use_id\": \"toolu_example\",\n      \"content\": \"Matching lines from the repository...\"\n    }\n  ]\n}<\/code><\/pre>\n<p>The ID and output are illustrative; a real implementation must use the ID from Claude's actual tool request.<\/p>\n<p>This message-based protocol is also why tool outputs are not attached to tool definitions. Definitions remain static, while execution results become part of the growing conversation history.<\/p>\n<p>If multiple tools are requested in one assistant response, the harness must return a matching result for each requested tool call.<\/p>\n<p><strong>Quick revision:<\/strong> The harness executes the tool and returns <code>tool_result<\/code> in a user message, matched by <code>tool_use_id<\/code>. Claude does not automatically execute client tools.<\/p>", "docs": [["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview"], ["Anthropic — Messages API", "https://docs.anthropic.com/en/api/messages"]]}, {"k": "3.45", "d": "d1", "title": "Prevent a Read-Only Subagent from Issuing Refunds", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>A read-only dispute-analysis subagent, added to summarize billing disputes before resolution work begins, has started calling <code>process_refund<\/code> on its own. Refund execution belongs to the main resolution flow. What is the correct fix?<\/p>", "c": [{"l": "A", "ok": true, "t": "Remove <code>process_refund<\/code> from the analysis subagent's toolset, leaving it only the lookup tools its role requires.", "e": "Tool access is an architectural control. If the analysis subagent does not have access to the refund tool, it cannot invoke that tool through its assigned toolset. Restricting tools to the role's requirements directly prevents this category of misuse."}, {"l": "B", "ok": false, "t": "Add a rule to the analysis subagent's system prompt stating that it must never call <code>process_refund<\/code> itself.", "e": "A prompt instruction is not a hard access restriction. The subagent can still attempt to call a tool that remains available to it. Because refund execution is outside its role, removing the tool is more reliable."}, {"l": "C", "ok": false, "t": "Have the coordinator inspect each analysis subagent transcript after the fact and reverse any refunds it issued.", "e": "This is reactive cleanup, not prevention. A refund may already have affected a real customer account before the coordinator notices it. Reversing the transaction may also be difficult or incomplete."}, {"l": "D", "ok": false, "t": "Expand the <code>process_refund<\/code> description to state it is reserved for the resolution flow, keeping all subagents' toolsets identical.", "e": "A clearer description can help the model select tools appropriately, but it does not prevent a subagent from calling a tool it has been granted. Identical toolsets preserve the very access that caused the problem."}], "o": "<p>The design principle is <strong>least-privilege tool access<\/strong>: every agent should receive only the capabilities needed to fulfill its assigned responsibility.<\/p>\n<p>In this scenario, the workflow has two distinct responsibilities:<\/p>\n<ul><li><strong>Analysis subagent:<\/strong> Gather customer and order information, investigate the dispute, and summarize the relevant facts.<\/li><li><strong>Main resolution flow:<\/strong> Decide how to resolve the case and execute permitted actions, such as issuing a refund or escalating to a human.<\/li><\/ul>\n<p>The analysis subagent may need <code>get_customer<\/code> and <code>lookup_order<\/code>, but it does not need <code>process_refund<\/code>. Removing that tool from its configured toolset makes the boundary structural rather than dependent on the model interpreting a warning correctly.<\/p>\n<p>The coordinator should still validate the analysis and decide what action to take next. But it should not depend on after-the-fact transcript inspection to prevent financial actions that the analysis role was never supposed to perform.<\/p>\n<p>This principle applies beyond refunds. A read-only research agent should not receive write tools it does not need; a documentation agent should not automatically receive deployment permissions; and a code-review agent should not have unrestricted production mutation capabilities simply because another agent requires them.<\/p>\n<p><strong>Quick revision:<\/strong> If a subagent must not perform an action, remove the corresponding tool from its toolset. Architectural restrictions are more reliable than prompt warnings.<\/p>", "docs": [["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents"], ["Claude Agent SDK — Overview", "https://docs.anthropic.com/en/docs/claude-code/sdk"]]}, {"k": "3.46", "d": "d2", "title": "Choose the Right Fallback When Edit Fails", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and understand when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>After repeated <code>Edit<\/code> failures on generated boilerplate files containing duplicated code blocks, a teammate proposes that Claude Code should use <code>Read<\/code> followed by <code>Write<\/code> for every file modification going forward. What guidance is correct?<\/p>", "c": [{"l": "A", "ok": false, "t": "Standardize on Bash with <code>sed<\/code> for files containing repeated blocks, since stream editing handles duplicates better.", "e": "Falling back to shell stream editing bypasses purpose-built file tools and their structured, reviewable output. Shell editing can be fragile for multiline code changes and harder to verify. The documented fallback for a failed unique match is <code>Read<\/code> plus <code>Write<\/code>, not <code>sed<\/code>."}, {"l": "B", "ok": true, "t": "Keep <code>Edit<\/code> as the default for targeted changes; use <code>Read<\/code> plus <code>Write<\/code> only when a unique match cannot be found.", "e": "<code>Edit<\/code> is preferred for precise modifications to existing files. When the target text appears multiple times and cannot uniquely identify the intended location, <code>Read<\/code> plus <code>Write<\/code> provides a reliable fallback that does not depend on a unique anchor."}, {"l": "C", "ok": false, "t": "Remove <code>Edit<\/code> from the agent's allowed tools so every modification goes through <code>Write<\/code>, the more reliable operation.", "e": "This forces full-file rewrites even for small changes where <code>Edit<\/code> works correctly. <code>Write<\/code> is not universally more reliable; it simply avoids the unique-anchor requirement at the cost of reproducing the entire file."}, {"l": "D", "ok": false, "t": "Adopt the proposal, since overwriting the full file with <code>Write<\/code> eliminates match failures with no meaningful downside.", "e": "<code>Read<\/code> plus <code>Write<\/code> avoids anchor-matching failures, but it introduces real costs. The model must reproduce the entire file, which consumes more tokens and creates opportunities for unintended changes to content that should remain untouched."}], "o": "<p>The key distinction is between <strong>precise editing<\/strong> and <strong>full-file replacement<\/strong>.<\/p>\n<p>Claude Code's <code>Edit<\/code> tool locates an existing text snippet and replaces it. This works well when the target snippet matches exactly one location. Generated boilerplate, however, may repeat the same block several times, making a short anchor ambiguous.<\/p>\n<p>Use this decision process:<\/p>\n<ol><li><strong>Try <code>Edit<\/code> first.<\/strong> It is efficient and limits changes to the intended region.<\/li><li><strong>Make the anchor more specific if possible.<\/strong> Add surrounding lines to identify the correct occurrence uniquely.<\/li><li><strong>Use <code>Read<\/code> plus <code>Write<\/code> when necessary.<\/strong> Read the entire file, make the intended change, and write the complete corrected content back.<\/li><\/ol>\n<p>This preserves the advantages of targeted editing for routine changes while providing a fallback for repetitive file structures.<\/p>\n<p><strong>Quick revision:<\/strong> <code>Edit<\/code> is the default for targeted changes. Use <code>Read<\/code> plus <code>Write<\/code> when a unique match cannot be found; do not standardize on full-file rewrites unnecessarily.<\/p>", "docs": [["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows"], ["Claude Code — Settings and tools", "https://docs.anthropic.com/en/docs/claude-code/settings"]]}, {"k": "3.47", "d": "d2", "title": "Reduce Tool Selection Errors in a Subagent", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and understand when to use plan mode versus direct execution.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A changelog-generation subagent currently inherits all 20 tools available in the session: the built-in tools plus everything from three connected MCP servers. Logs show it frequently calls the wrong tool. Which change most directly improves its tool selection reliability?<\/p>", "c": [{"l": "A", "ok": true, "t": "Restrict the subagent's <code>tools<\/code> field to the handful of tools its changelog task actually requires.", "e": "Tool selection reliability can degrade as the available tool catalog grows. Restricting the subagent to a small, role-relevant set reduces the number of competing choices and prevents it from selecting tools that it has not been granted."}, {"l": "B", "ok": false, "t": "Expand the subagent's system prompt with a section warning it away from the tools it should not use.", "e": "Prompt instructions are behavioral guidance, not hard restrictions. The irrelevant tools remain available and continue to compete for selection, so occasional wrong-tool calls can persist despite the warnings."}, {"l": "C", "ok": false, "t": "Add an initial routing tool that the subagent must call first to learn which tool fits each step.", "e": "This adds a selection step to solve a selection problem. The subagent must still choose the router correctly, and subsequent calls still occur against the oversized tool inventory. It adds latency and another potential failure point without reducing the available choices."}, {"l": "D", "ok": false, "t": "Prefix each MCP tool's name with its server name so related tools are visually grouped in the catalog.", "e": "Renaming reorganizes the same 20-tool catalog without reducing decision complexity. Tool descriptions and relevance matter more than grouping names by server, and the irrelevant tools remain available."}], "o": "<p>The key principle is <strong>scoped tool access<\/strong>.<\/p>\n<p>A large tool catalog creates more opportunities for incorrect selection. A specialized subagent that only needs to generate changelogs should not inherit every tool connected to the main session simply because those tools are available there.<\/p>\n<p>For example, a changelog subagent might need:<\/p>\n<ul><li><code>Read<\/code> to inspect relevant files.<\/li><li><code>Grep<\/code> to find symbols or references.<\/li><li>A git-history tool to inspect commits.<\/li><\/ul>\n<p>It likely does not need unrelated billing, deployment, or customer-support tools.<\/p>\n<p>In Claude Code, a custom subagent's definition can specify its available tools. This makes the restriction architectural: a tool that is not granted cannot be selected by that subagent through its configured toolset.<\/p>\n<p>The alternatives leave the oversized catalog intact. Warnings rely on probabilistic compliance, renaming does not reduce the number of choices, and routing adds another step without removing irrelevant tools.<\/p>\n<p><strong>Quick revision:<\/strong> Reduce tool selection errors by reducing the tools available to the subagent. Grant tools according to the role, not the entire session's inventory.<\/p>", "docs": [["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents"], ["Anthropic — Tool search tool", "https://docs.anthropic.com/en/docs/agents-and-tools/tool-use/tool-search-tool"]]}, {"k": "3.48", "d": "d3", "title": "Decide When to Use Plan Mode", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>An engineer must swap a deprecated messaging library across roughly 50 files of an unfamiliar legacy service; two integration approaches with different infrastructure needs are both viable. How should the work begin in Claude Code?<\/p>", "c": [{"l": "A", "ok": true, "t": "Enter plan mode so Claude explores the codebase read-only and proposes an approach for approval before any edits.", "e": "The task combines three signals that favor planning: a large number of files, an unfamiliar codebase, and multiple viable approaches with different infrastructure consequences. Plan mode enables research and dependency exploration before changes are made."}, {"l": "B", "ok": false, "t": "Begin direct execution on a small subset of files and let the emerging changes reveal which integration approach fits.", "e": "This defers the architectural decision until code has already been written. If the selected approach conflicts with infrastructure requirements, partially migrated files may need expensive rework."}, {"l": "C", "ok": false, "t": "Use direct execution with <code>/compact<\/code> after each batch of files to keep the growing context from derailing the migration.", "e": "<code>/compact<\/code> manages context size during a long session. It does not explore the codebase, compare architectural approaches, or resolve the infrastructure decision that must be made before implementation."}, {"l": "D", "ok": false, "t": "Write a detailed upfront prompt specifying every file to change, then run in direct execution against that specification.", "e": "This assumes the engineer already understands the legacy codebase well enough to enumerate all affected files and dependencies. The scenario explicitly says the codebase is unfamiliar, so an upfront exhaustive specification is likely to miss important relationships."}], "o": "<p>Claude Code's plan mode is designed for complex tasks where research and decision-making should happen before source edits.<\/p>\n<p>A practical workflow is:<\/p>\n<ol><li><strong>Explore:<\/strong> Identify the messaging library's usage, dependencies, integration points, and tests.<\/li><li><strong>Plan:<\/strong> Compare the two viable approaches and document their infrastructure implications.<\/li><li><strong>Review:<\/strong> Have the engineer examine the proposed migration plan and resolve outstanding decisions.<\/li><li><strong>Implement:<\/strong> Proceed after the approach is approved.<\/li><li><strong>Validate:<\/strong> Run relevant tests and check for remaining uses of the deprecated library.<\/li><\/ol>\n<p>This approach is especially valuable when a decision affects dozens of files. Revising a plan is cheaper than rewriting a partially completed migration.<\/p>\n<p>Plan mode is not required for every change. A small, well-understood fix may be better handled through direct execution. The goal is to match the workflow to the task's complexity and uncertainty.<\/p>\n<p><strong>Quick revision:<\/strong> Use plan mode for large, unfamiliar, or architecturally ambiguous changes. Research first, approve the approach, and implement second.<\/p>", "docs": [["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows"], ["Claude Code — Best practices", "https://docs.anthropic.com/en/docs/claude-code/best-practices"]]}, {"k": "3.49", "d": "d4", "title": "Make Structured-Output Retries Useful", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline emits each review finding as JSON validated against a schema. One finding fails validation: <code>severity<\/code> contains an undefined enum value and <code>line_number<\/code> is <code>null<\/code>. You want the model to self-correct on a retry. What should the retry request contain?<\/p>", "c": [{"l": "A", "ok": false, "t": "Re-run the original review prompt from scratch at a lower temperature so the invalid output is not reproduced.", "e": "A fresh run discards the feedback loop. The model does not learn which fields failed or why. Lower temperature makes sampling more deterministic but does not specifically direct the model toward schema compliance."}, {"l": "B", "ok": false, "t": "Send only the validation errors together with an instruction to regenerate the finding in a schema-compliant form.", "e": "Without the failed output, the model cannot see what it actually produced. Without the source diff, it also lacks the original evidence needed to determine the correct severity and line number. The retry is effectively blind."}, {"l": "C", "ok": false, "t": "Resend the failed finding with a general instruction to repair any formatting problems, omitting the error details to keep the retry small.", "e": "A vague repair instruction forces the model to guess what failed. Specific validation messages—such as an enum value not being in the allowed set—provide a concrete correction target."}, {"l": "D", "ok": true, "t": "Include the reviewed diff, the failed finding, and the specific validation errors so the model can correct against the source.", "e": "The model needs the original source material, the output it produced, and the validator's feedback. Together, these allow it to correct the invalid fields while grounding the result in the actual code being reviewed."}], "o": "<p>The key principle is <strong>retry with explicit error feedback<\/strong>.<\/p>\n<p>A reliable structured-output pipeline validates the model's JSON against a schema. When validation fails, the next request should contain three things:<\/p>\n<ol><li><strong>The original source material:<\/strong> In this scenario, the reviewed diff provides the evidence needed to reassess the finding and determine the correct line number.<\/li><li><strong>The failed output:<\/strong> This shows the model exactly what it produced and which finding needs correction.<\/li><li><strong>The specific validation errors:<\/strong> These identify the concrete problems, such as an unsupported severity value or a field that must not be <code>null<\/code>.<\/li><\/ol>\n<p>For example, the validator might report that <code>\"urgent\"<\/code> is not an allowed severity enum and that <code>line_number<\/code> must be an integer. With the diff and failed finding included, the model can reassess the issue and return a corrected record.<\/p>\n<p>One or two targeted retries may resolve structural and formatting failures. However, retries cannot manufacture information that the source does not contain. If the line number genuinely cannot be established, the schema or workflow may need to permit a missing value or route the finding for human review.<\/p>\n<p><strong>Quick revision:<\/strong> On validation failure, retry with <strong>source + failed output + specific errors<\/strong>. Do not merely rerun the original prompt or provide a vague repair instruction.<\/p>", "docs": [["Anthropic — Structured outputs", "https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs"], ["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview"]]}, {"k": "3.50", "d": "d3", "title": "Fix Missing Review Instructions in CI", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>Reviews on one engineer's laptop consistently apply the team's review criteria, but the same reviews in the CI pipeline ignore them. The criteria live only in the engineer's user-level <code>~/.claude/CLAUDE.md<\/code>; no project <code>CLAUDE.md<\/code> contains them. What is the correct fix, and how do you confirm the scoping?<\/p>", "c": [{"l": "A", "ok": false, "t": "Copy the engineer's <code>~/.claude/CLAUDE.md<\/code> into the CI runner's home directory as a pipeline setup step so the criteria load during CI reviews.", "e": "This can work mechanically, but it creates unversioned configuration that must be maintained separately on the runner. The copied file can drift from the engineer's original. Team-wide instructions belong in a project-level file tracked by version control."}, {"l": "B", "ok": false, "t": "Add the review criteria to <code>.claude/settings.json<\/code>, which is committed and therefore applied by every CI invocation.", "e": "<code>.claude/settings.json<\/code> is used for settings such as permissions, tool configuration, and hooks. It is not the appropriate location for natural-language review instructions intended to enter the model's context."}, {"l": "C", "ok": false, "t": "Inline the full review criteria into the <code>-p<\/code> prompt string for each CI job so no memory file is a dependency at review time.", "e": "Embedding the criteria in each pipeline script duplicates configuration and separates it from the team's canonical guidance. Over time, local and CI review instructions can diverge."}, {"l": "D", "ok": true, "t": "Use <code>/memory<\/code> to inspect the memory file locations, then move the criteria from the user-level <code>CLAUDE.md<\/code> into the project <code>CLAUDE.md<\/code> in the repository.", "e": "User-level instructions apply to that user's environment and do not automatically travel with the repository. Moving shared review criteria into a committed project-level <code>CLAUDE.md<\/code> ensures that both local sessions and CI checkouts can load the same instructions."}], "o": "<p>The key concept is <strong>instruction scope<\/strong>.<\/p>\n<p>Claude Code can load instructions from multiple locations, but those locations have different purposes and distribution behavior.<\/p>\n<ul><li><strong>User-level memory:<\/strong> <code>~/.claude/CLAUDE.md<\/code> applies to the individual user's environment. It is not automatically included when another machine checks out the repository.<\/li><li><strong>Project-level memory:<\/strong> <code>./CLAUDE.md<\/code> or <code>./.claude/CLAUDE.md<\/code> can store shared project instructions and travel with the repository when committed.<\/li><li><strong>Local project notes:<\/strong> <code>CLAUDE.local.md<\/code> can hold personal project-specific notes that are not intended to be shared through version control.<\/li><li><strong>Settings files:<\/strong> These configure Claude Code behavior and permissions; they are not a replacement for natural-language project instructions.<\/li><\/ul>\n<p>Use the <code>/memory<\/code> command to inspect the memory file locations and identify where the review criteria currently live. After moving them to the committed project-level file, use <code>/context<\/code> to inspect the <strong>Memory files<\/strong> section and confirm which files were loaded into the current session. Comparing the local environment with the CI run helps identify any remaining difference in loaded instructions.<\/p>\n<p>The best fix is structural: maintain one shared set of review criteria in the repository rather than copying user configuration to runners or duplicating prompt text in pipeline scripts.<\/p>\n<p><strong>Quick revision:<\/strong> Team-wide instructions belong in a committed project <code>CLAUDE.md<\/code>. Use <code>/memory<\/code> to inspect locations and <code>/context<\/code> to verify loaded memory files.<\/p>", "docs": [["Claude Code — Manage Claude's memory", "https://docs.anthropic.com/en/docs/claude-code/memory"], ["Claude Code — Slash commands", "https://docs.anthropic.com/en/docs/claude-code/slash-commands"]]}, {"k": "3.51", "d": "d3", "title": "Design a Self-Contained Human Escalation", "scen": "<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses built-in tools such as <code>Read<\/code>, <code>Write<\/code>, <code>Bash<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, and integrates with Model Context Protocol (MCP) servers.<\/p>", "scenLabel": "Scenario · Developer productivity tools (Agent SDK)", "inline": false, "stem": "<p>Mid-task, the agent encounters a legacy database migration decision it cannot resolve autonomously and must escalate to a senior engineer. Engineers receiving escalations have no access to the agent's session transcript. What should the escalation contain?<\/p>", "c": [{"l": "A", "ok": false, "t": "Send only the original task description, so the engineer investigates from scratch without being anchored by the agent's earlier conclusions.", "e": "This discards the completed investigation and forces the engineer to repeat potentially hours of exploration. The purpose of the handoff is to preserve useful findings, not erase them."}, {"l": "B", "ok": false, "t": "Send the complete raw output of every <code>Read<\/code>, <code>Grep<\/code>, and <code>Bash<\/code> call the agent executed.", "e": "Raw tool output transfers evidence without synthesis. The engineer must reconstruct the investigation, identify relevant findings, and work out the unresolved decision independently."}, {"l": "C", "ok": true, "t": "Include a structured summary of the affected modules, the analysis completed so far, the blocking question, and a recommended next step.", "e": "The receiving engineer cannot inspect the original transcript, so the handoff must be self-contained. A structured summary preserves the investigation's state and clearly identifies the decision requiring human judgment."}, {"l": "D", "ok": false, "t": "Include an urgency rating and an estimate of the remaining complexity so the engineer can schedule the escalation.", "e": "Priority and effort estimates can help with scheduling, but they do not explain what has already been investigated or what decision remains unresolved. The engineer would still need to start over."}], "o": "<p>This is a <strong>context-transfer problem<\/strong>, not merely a routing problem.<\/p>\n<p>When an agent escalates a task, the human may not have access to the agent's intermediate tool calls, findings, or conversation history. Anything that is not explicitly included in the handoff may be unavailable to the recipient.<\/p>\n<p>A good escalation should contain four essential elements:<\/p>\n<ol><li><strong>Task context:<\/strong> What the agent was trying to accomplish.<\/li><li><strong>Affected modules:<\/strong> Which files, services, database components, or dependencies are involved.<\/li><li><strong>Findings so far:<\/strong> What the agent investigated, what it discovered, and which approaches it considered.<\/li><li><strong>Blocking question and recommendation:<\/strong> The specific decision the engineer must make and the agent's proposed next step.<\/li><\/ol>\n<p>For example, rather than attaching hundreds of lines of database inspection output, the agent might explain that two migration strategies are viable, describe the compatibility trade-off, identify the affected services, and ask which deployment constraint takes priority.<\/p>\n<p>The handoff should preserve enough evidence to support the summary without overwhelming the recipient. A fixed schema can make escalations consistent and easier to process automatically.<\/p>\n<p><strong>Quick revision:<\/strong> A useful human handoff contains <strong>context, findings, blocker, and recommendation<\/strong>. Do not discard the investigation or transfer only raw logs.<\/p>", "docs": [["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["Claude Agent SDK documentation", "https://docs.anthropic.com/en/docs/claude-code/sdk"]]}, {"k": "3.52", "d": "d5", "title": "Handle Subagent Timeouts Without Wasting Coordinator Turns", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates work to specialized subagents, including a web-search subagent, a document-analysis subagent, a synthesis subagent, and a reporting subagent. The system produces comprehensive, cited research reports.<\/p>\n<p>The web-search subagent occasionally encounters timeouts. Most resolve after a brief retry, but some persist. Sending every timeout to the coordinator adds unnecessary turns and token costs.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>What retry and error-reporting strategy best balances resilience, efficiency, and useful error handling?<\/p>", "c": [{"l": "A", "ok": false, "t": "Report every timeout to the coordinator immediately, including the failure type, attempted query, and any partial results.", "e": "Structured error information is valuable when a failure cannot be resolved locally. However, escalating every transient timeout adds the very coordinator overhead the scenario is trying to eliminate."}, {"l": "B", "ok": false, "t": "Keep retrying inside the subagent with increasingly long backoff delays until the request eventually succeeds.", "e": "Some timeouts persist. Unbounded retries can consume time and resources indefinitely, prevent the coordinator from recovering through an alternative strategy, and delay the final report."}, {"l": "C", "ok": false, "t": "After a failed local retry, return a generic “search unavailable” status for all remaining failures.", "e": "This performs local recovery but discards important information. The coordinator cannot tell which query failed, whether any results were retrieved, or whether a modified query or partial-result strategy might work."}, {"l": "D", "ok": true, "t": "Retry timed-out calls locally with backoff, and report persistent failures to the coordinator with the attempted query and any partial results.", "e": "This handles transient failures at the lowest level that can resolve them. Only persistent failures reach the coordinator, and the structured context allows it to decide whether to retry differently, use partial results, or disclose a coverage gap."}], "o": "<p>The central principle is <strong>layered error recovery<\/strong>.<\/p>\n<p>A well-designed multi-agent system should not escalate every small operational problem. The subagent that encounters a timeout is usually best positioned to attempt a quick recovery before involving the coordinator.<\/p>\n<p>A sensible strategy is:<\/p>\n<ol><li>Execute the search request.<\/li><li>If it times out, retry locally once or twice using an appropriate backoff strategy.<\/li><li>If the retry succeeds, continue normally without involving the coordinator.<\/li><li>If the failure persists, return a structured failure report.<\/li><li>Include the failure type, attempted query, available partial results, and possible alternatives.<\/li><\/ol>\n<p>For example, a persistent timeout might be reported as: “Search timed out for query X after two attempts; partial results contain three sources; possible next step: narrow the query or proceed with the available sources and note the coverage limitation.”<\/p>\n<p>This gives the coordinator enough information to make a decision without forcing it to manage routine retries.<\/p>\n<p>The other approaches fail in different ways: immediate escalation wastes coordinator turns, unlimited retries can stall, and generic error messages remove the context needed for recovery.<\/p>\n<p><strong>Quick revision:<\/strong> Retry transient failures locally with bounded backoff. Escalate persistent failures with <strong>the error, attempted query, partial results, and recovery options<\/strong>.<\/p>", "docs": [["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents"], ["Anthropic — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview"]]}, {"k": "3.53", "d": "d1", "title": "Preserve Citations Across Isolated Subagents", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates work to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>\n<p>The search subagent collects well-sourced evidence, but synthesis reports lack citations. The search subagent's verbose page content must also stay out of the coordinator's context.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>Which <strong>TWO<\/strong> actions solve both problems?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the shared citation instructions into the coordinator's system prompt instead of each subagent's prompt.", "e": "A non-fork subagent does not automatically inherit the coordinator's system prompt. Moreover, citation instructions alone cannot supply evidence or source URLs that the synthesis subagent has never received."}, {"l": "B", "ok": true, "t": "Have the search subagent return only a structured report of claims, quotes, and source URLs as its final message.", "e": "A subagent's intermediate tool calls and raw page content stay in its own context window. Its final message is the handoff to the parent, so a concise, structured evidence report preserves citations without transferring all the verbose page content."}, {"l": "C", "ok": true, "t": "Pass the search subagent's returned findings explicitly in the prompt the coordinator gives the synthesis subagent.", "e": "A non-fork subagent starts with a fresh context and receives the prompt explicitly provided by the coordinator. Passing the claims, quotations, and source URLs gives the synthesis subagent the actual evidence needed to produce cited findings."}, {"l": "D", "ok": false, "t": "Spawn the search and synthesis subagents in parallel by issuing two task calls in the same coordinator response.", "e": "Parallel execution can help when tasks are independent, but synthesis depends on the search results. Since the subagents cannot automatically read one another's contexts, the synthesis subagent would start without the evidence it needs."}], "o": "<p>The key principle is <strong>explicit information transfer across isolated contexts<\/strong>.<\/p>\n<p>Subagents do not automatically share their conversation histories. The synthesis agent cannot cite sources merely because the search agent has already found them.<\/p>\n<p>The correct workflow is:<\/p>\n<div class=\"flow\"><div class=\"step\"><strong>1. Search subagent<\/strong><span>Reads pages and collects evidence<\/span><\/div><div aria-hidden=\"true\" class=\"arrow\">↓<\/div><div class=\"step\"><strong>2. Structured evidence report<\/strong><span>Claims, supporting quotes, source URLs<\/span><\/div><div aria-hidden=\"true\" class=\"arrow\">↓<\/div><div class=\"step\"><strong>3. Coordinator passes findings<\/strong><span>Includes evidence in the synthesis prompt<\/span><\/div><div aria-hidden=\"true\" class=\"arrow\">↓<\/div><div class=\"step\"><strong>4. Synthesis subagent<\/strong><span>Produces a cited, evidence-based report<\/span><\/div><\/div>\n<p>This design limits context growth because the coordinator receives a distilled report rather than the full contents of every page. At the same time, it preserves enough provenance for the synthesis agent to connect conclusions to their sources.<\/p>\n<p>The coordinator must explicitly place the returned findings in the synthesis prompt. A vague instruction such as “synthesize the findings” is insufficient if the actual findings are not included.<\/p>\n<p><strong>Quick revision:<\/strong> Keep verbose source content inside the search subagent, return a structured evidence summary, and explicitly pass that summary to the synthesis subagent.<\/p>", "docs": [["Claude Code — Create custom subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents"], ["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "3.54", "d": "d5", "title": "Ask Before Editing an Ambiguous Target", "scen": "<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You integrate Claude Code into your development workflow with custom slash commands, <code>CLAUDE.md<\/code> configurations, and plan mode when appropriate.<\/p>", "scenLabel": "Scenario · Claude Code for software development", "inline": false, "stem": "<p>A developer asks Claude Code to “refactor the PaymentValidator,” but <code>Grep<\/code> locates three unrelated classes with that name in different modules. In previous sessions, Claude guessed and edited the wrong one. Which behavior should the team establish?<\/p>", "c": [{"l": "A", "ok": true, "t": "Have Claude Code request a clarifying identifier, such as the file path or owning module, before making any edits.", "e": "The developer knows which class they intended. A single clarifying question resolves the ambiguity and prevents unintended changes to unrelated modules."}, {"l": "B", "ok": false, "t": "Add a <code>CLAUDE.md<\/code> rule telling Claude Code to select the class with the most recent commit history.", "e": "Commit recency does not reliably identify the class the developer intended. Encoding this heuristic in <code>CLAUDE.md<\/code> makes the guessing behavior systematic rather than eliminating it."}, {"l": "C", "ok": false, "t": "Apply the refactoring to all three matching classes so the intended one is always covered.", "e": "The classes are unrelated. Editing all three guarantees unwanted changes to two modules and creates unnecessary review and rollback work."}, {"l": "D", "ok": false, "t": "Have Claude Code rate its confidence in each candidate and proceed automatically when the confidence exceeds a threshold.", "e": "Self-reported confidence is not a reliable substitute for resolving ambiguity. The model can be confidently wrong, especially when multiple candidates have similar names."}], "o": "<p>This is a <strong>target-selection reliability problem<\/strong>.<\/p>\n<p>A search result identifies possible matches; it does not establish which match the requester intended. When several candidates are plausible, choosing one based on recency, naming patterns, or model confidence merely hides the uncertainty.<\/p>\n<p>The safer workflow is:<\/p>\n<ol><li>Search for <code>PaymentValidator<\/code>.<\/li><li>Identify the multiple matching classes and their module paths.<\/li><li>Ask the developer which file or module they mean.<\/li><li>Wait for clarification.<\/li><li>Make the change only after the target is established.<\/li><\/ol>\n<p>The general rule is that ambiguity should be surfaced rather than suppressed. One extra conversational turn is much cheaper than an incorrect edit that affects an unrelated module and potentially survives review.<\/p>\n<p>A team instruction can reinforce this behavior: when a search returns multiple plausible targets, ask for a distinguishing identifier before editing.<\/p>\n<p><strong>Quick revision:<\/strong> If multiple plausible targets match, ask for the file path or owning module. Do not guess, edit every match, or use confidence scores as a substitute for clarification.<\/p>", "docs": [["Claude Code — Best practices", "https://docs.anthropic.com/en/docs/claude-code/best-practices"], ["Claude Code — Common workflows", "https://docs.anthropic.com/en/docs/claude-code/common-workflows"]]}, {"k": "3.55", "d": "d1", "title": "Continuously Audit Autonomous Resolutions", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>.<\/p>\n<p>Your target is more than 80% first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>QA currently reviews only cases the agent escalates; resolutions the agent completes autonomously go unreviewed. You need ongoing assurance that these autonomous resolutions remain accurate and that novel error patterns surface early. What should you implement?<\/p>", "c": [{"l": "A", "ok": true, "t": "Draw a stratified random sample of autonomous resolutions across issue types and review it on an ongoing basis to measure error rates.", "e": "This directly measures the quality of the population that currently goes unreviewed. Stratification ensures that returns, billing disputes, account issues, and other important segments are represented, helping the team identify emerging failures that might be hidden by an aggregate accuracy score."}, {"l": "B", "ok": false, "t": "Audit every autonomous resolution for one quarter, then discontinue review once aggregate accuracy exceeds the target threshold.", "e": "A one-time audit cannot guarantee future accuracy. Customer behavior, policies, and request distributions change over time, and a strong overall average can conceal a serious problem in a smaller issue category."}, {"l": "C", "ok": false, "t": "Monitor customer complaint and case-reopen rates, treating any sustained rise in either as evidence that resolution quality has slipped.", "e": "Complaints and reopened cases are incomplete, lagging indicators. Some incorrect resolutions never generate complaints, and some errors may remain unnoticed by customers. These metrics are useful supplementary signals, but they cannot replace direct quality sampling."}, {"l": "D", "ok": false, "t": "Have the agent self-rate its confidence on each resolution and route only low-confidence cases to QA for human review.", "e": "Model-reported confidence is not reliably calibrated. The agent may be confidently wrong, leaving precisely those incorrect resolutions out of the review process."}], "o": "<p>This is a <strong>quality measurement gap<\/strong>.<\/p>\n<p>When an agent resolves cases autonomously, those cases leave the escalation-based QA process. If the team measures only escalated cases, it learns about the difficult or uncertain situations but loses direct visibility into the much larger population of supposedly successful autonomous resolutions.<\/p>\n<p>A continuous stratified random-sampling process addresses this:<\/p>\n<ol><li>Define the population of autonomously resolved cases.<\/li><li>Divide the population into meaningful strata, such as returns, billing disputes, and account issues.<\/li><li>Randomly sample cases from each stratum.<\/li><li>Have qualified reviewers assess the correctness and appropriateness of the resolutions.<\/li><li>Track error rates by issue type and over time.<\/li><li>Investigate newly emerging error patterns and adjust agent behavior, tool permissions, or escalation rules as needed.<\/li><\/ol>\n<p>Stratification matters because an aggregate accuracy score can mask a failing subgroup. For example, the agent might perform well on account lookups but incorrectly handle a growing share of billing disputes. Reviewing a representative sample from each category makes that difference easier to detect.<\/p>\n<p>Complaints and reopen rates still provide useful monitoring signals, but they should complement direct audits rather than replace them. Likewise, self-reported confidence can be recorded as a diagnostic feature, but should not determine the entire QA sample.<\/p>\n<p><strong>Quick revision:<\/strong> Continuously review a <strong>stratified random sample of autonomous resolutions<\/strong>. This measures real error rates, detects drift, and helps surface novel failures before they spread.<\/p>", "docs": [["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"], ["Claude Agent SDK documentation", "https://docs.anthropic.com/en/docs/claude-code/sdk"]]}, {"k": "3.56", "d": "d5", "title": "Designing Reliable Human Escalation", "scen": "<p>You are building a customer-support agent with the Claude Agent SDK. It handles returns, billing disputes, and account issues using tools such as <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The goal is to achieve at least 80% first-contact resolution while escalating cases appropriately.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You must define the escalation behavior for two situations: a customer explicitly asks for a human, or a customer complains angrily without asking for a human. Which rule pair is correct?<\/p>", "c": [{"l": "A", "ok": true, "t": "Escalate immediately when a human is explicitly requested; acknowledge frustration and offer a resolution when no such request has been made.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> An explicit request for a human is a clear instruction about the customer's preferred handling. The agent should call <code>escalate_to_human<\/code> immediately. If the customer is frustrated but has not requested a person, the agent should acknowledge their emotion, offer a concrete solution, and escalate if the customer subsequently insists on human assistance.<\/li><li><strong>Key principle:<\/strong> Respect explicit preferences while resolving cases autonomously when appropriate.<\/li><\/ul>"}, {"l": "B", "ok": false, "t": "Acknowledge the emotion and attempt one resolution in both situations, escalating only if the customer repeats the demand.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> This forces a customer who has already requested a human to repeat themselves. The agent should not make the customer go through another resolution attempt after their preference is explicit.<\/li><li><strong>When the approach is appropriate:<\/strong> Acknowledge-and-resolve is suitable for frustration without an explicit request for a human.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Apply a sentiment threshold and escalate whenever negativity exceeds a calibrated level.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Sentiment does not reliably measure whether a case needs human intervention. An angry customer may have a straightforward issue, while a calm customer may explicitly request a human.<\/li><li><strong>Key distinction:<\/strong> Observable customer intent is a more reliable escalation trigger than a sentiment score.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Escalate immediately in both situations because anger and a request for a human both indicate lost confidence in automation.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Anger alone does not mean the agent cannot resolve the problem. Automatically escalating every frustrated customer can unnecessarily reduce first-contact resolution.<\/li><li><strong>Better approach:<\/strong> Attempt resolution when appropriate, but honor a direct request for a human immediately.<\/li><\/ul>"}], "o": "<p>Escalation design must distinguish between <strong>customer emotion and customer intent<\/strong>.<\/p>\n<p>An explicit human request is a direct escalation trigger. Frustration alone is not. In the latter case, acknowledging the concern and offering a useful resolution can preserve customer trust and avoid unnecessary handoffs.<\/p>\n<p>Other valid escalation triggers can include policy exceptions or a genuine inability to make progress.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Explicit request for a human → escalate immediately.<\/li><li>Frustration without a human request → acknowledge, offer a resolution, and escalate if the customer insists.<\/li><li>Do not rely on sentiment thresholds alone.<\/li><li>Keep escalation criteria explicit in the system prompt.<\/li><\/ul>", "docs": [["Anthropic — Building effective agents", "https://www.anthropic.com/research/building-effective-agents"]]}, {"k": "3.57", "d": "d4", "title": "Validation Retries and Missing Information", "scen": "<p>A documentation pipeline runs Claude Code non-interactively. Whenever extraction fails validation, the pipeline retries with the failed output and specific validation errors.<\/p>\n<p>The source documents do not contain <code>owner_team<\/code>; that information exists only in a separate service catalog that is not available in the prompt or tool context.<\/p>", "scenLabel": "Scenario · Claude Code workflows (general)", "inline": false, "stem": "<p>Which change to the retry policy is correct?<\/p>", "c": [{"l": "A", "ok": false, "t": "Stop retrying over-length summaries and truncate them during post-processing.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> An over-length summary is a formatting problem the model can usually correct when given the length limit and validation error. Blind truncation can cut off a sentence or remove essential meaning.<\/li><li><strong>Better approach:<\/strong> Retry with the original content and a specific instruction to shorten the summary.<\/li><\/ul>"}, {"l": "B", "ok": false, "t": "Stop retrying incorrectly nested arrays and regenerate the document from scratch without error context.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Incorrect nesting is a structural error that can often be corrected using targeted feedback. Starting over discards useful information about what failed and why.<\/li><li><strong>Better approach:<\/strong> Include the failed output and the precise schema-validation error in the retry prompt.<\/li><\/ul>"}, {"l": "C", "ok": true, "t": "Stop retrying blank <code>owner_team<\/code> values and supply the service catalog as context so the model can ground the field in actual information.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> The required information is absent from the model's available context. Repeating the same request cannot supply knowledge that the model never received. Providing the catalog or retrieving the relevant value through a tool addresses the actual cause.<\/li><li><strong>Additional safeguard:<\/strong> If the value genuinely cannot be obtained, allow an explicit unknown or null value when the downstream schema permits it rather than encouraging fabrication.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Stop retrying dates in <code>MM/DD/YYYY<\/code> format and send them to a human for manual correction.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> A date-format mismatch is a classic retryable validation failure. The model has the date and the required format, so a targeted retry can often fix it without human intervention.<\/li><li><strong>Better approach:<\/strong> Specify the required ISO 8601 format and return the exact validation error.<\/li><\/ul>"}], "o": "<p>A validation-retry loop works when the model has enough information to correct its mistake.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Failure type<\/th><th>Correct response<\/th><\/tr><\/thead><tbody><tr><td>Wrong date format<\/td><td>Retry with format feedback<\/td><\/tr><tr><td>Incorrect JSON structure<\/td><td>Retry with schema feedback<\/td><\/tr><tr><td>Summary too long<\/td><td>Retry with length feedback<\/td><\/tr><tr><td>Required information missing<\/td><td>Supply the missing source or permit an unknown value<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The distinction is between <strong>a correctable output error and an information gap<\/strong>. Retrying the latter wastes resources and may encourage hallucinated values.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Include the source, failed output, and specific validation errors in retries.<\/li><li>Retry formatting and structural mistakes.<\/li><li>Supply missing information through context or tools.<\/li><li>Never treat repeated prompting as a substitute for evidence.<\/li><\/ul>", "docs": [["Anthropic API documentation", "https://docs.anthropic.com/"], ["Anthropic — Prompt engineering", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"]]}, {"k": "3.58", "d": "d3", "title": "Conditionally Loading Claude Code Rules", "scen": "<p>A team splits a 600-line project <code>CLAUDE.md<\/code> into topic files under <code>.claude/rules/<\/code>. However, sessions still load every rule, including database migration conventions needed only when editing files under <code>db/migrations<\/code>.<\/p>", "scenLabel": "Scenario · Claude Code workflows (general)", "inline": false, "stem": "<p>What change makes the migration rule load conditionally?<\/p>", "c": [{"l": "A", "ok": true, "t": "Add YAML frontmatter with a <code>paths<\/code> field containing glob patterns for database migration files.", "e": "For example, a rule file can begin with:"}, {"l": "B", "ok": false, "t": "Move the migration rule into a <code>db/<\/code> subdirectory under <code>.claude/rules/<\/code>.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Subdirectories help organize rule files, but their location alone does not make the rules conditional.<\/li><li><strong>Key distinction:<\/strong> Directory organization is not equivalent to path-based applicability.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Reference the migration rule using an <code>@import<\/code> statement in <code>CLAUDE.md<\/code>.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Importing a file organizes instructions across files but does not make the imported content load only when a matching path is edited.<\/li><li><strong>Key distinction:<\/strong> An import is not a substitute for path-scoped rule frontmatter.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Add the migration rule to <code>claudeMdExcludes<\/code>.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Excluding a file prevents it from being loaded; it does not defer loading until Claude encounters a relevant file.<\/li><li><strong>Risk:<\/strong> The migration instructions might never be applied.<\/li><\/ul>"}], "o": "<p>Splitting a large instruction file improves maintainability, but it does not automatically reduce the instructions loaded into context.<\/p>\n<p>Two separate concerns must be addressed:<\/p>\n<ol><li><strong>Organization:<\/strong> Divide instructions into topic files, optionally using subdirectories.<\/li><li><strong>Applicability:<\/strong> Add a <code>paths<\/code> field to rule frontmatter when the instructions should apply only to matching files.<\/li><\/ol>\n<p>The question is specifically about conditional applicability, so the correct solution is path-scoped frontmatter.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li><code>.claude/rules/<\/code> → organizes rules.<\/li><li><code>paths<\/code> frontmatter → scopes rules to matching paths.<\/li><li><code>@import<\/code> → imports content; it does not provide path-based conditional loading.<\/li><li><code>claudeMdExcludes<\/code> → excludes content rather than deferring it.<\/li><\/ul>", "docs": [["Claude Code — Memory and rules", "https://code.claude.com/docs/en/memory"], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "3.59", "d": "d3", "title": "Resolving Interdependent Code Review Findings", "scen": "<p>A CI/CD pipeline automatically remediates code-review findings by sending Claude Code one finding per invocation.<\/p>\n<p>On a pull request, three findings stem from the same flawed abstraction. Each fix reintroduces another finding.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>What should change?<\/p>", "c": [{"l": "A", "ok": true, "t": "Send all three related findings in one prompt so a single coherent change addresses their shared cause.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> The findings are coupled. Each fix affects the same abstraction, so the agent needs all three constraints at once to design a consistent solution.<\/li><li><strong>Expected benefit:<\/strong> One coordinated change can address the shared root cause instead of producing a cycle of fixes and regressions.<\/li><\/ul>"}, {"l": "B", "ok": false, "t": "Run each fix in a separate Git worktree in parallel, then merge all three branches.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Parallel worktrees are useful for independent tasks. Here, each branch would modify the same underlying abstraction without awareness of the other findings, increasing the chance of conflicting assumptions and merge problems.<\/li><li><strong>When parallelism helps:<\/strong> When tasks are sufficiently independent that their changes can be developed and validated separately.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Add a retry loop that reruns the reviewer after every fix until no findings remain.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> The retry loop does not address the root cause. Each invocation still receives only one finding, so fixes can continue undoing one another.<\/li><li><strong>Key distinction:<\/strong> Retry loops help with correctable output or validation failures, not with structural conflicts hidden by the task decomposition.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Reorder the findings by severity and apply the most critical fix first.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Prioritization does not resolve the dependencies among the findings. A fix applied first can still violate a constraint represented in one of the other findings.<\/li><li><strong>Better approach:<\/strong> Make the interacting constraints visible together.<\/li><\/ul>"}], "o": "<p>The right way to split work depends on <strong>how tightly the problems are coupled<\/strong>, not simply on how many problems exist.<\/p>\n<p>When multiple findings share a root cause, the model needs to understand their interactions before making changes. Sending them one at a time hides relevant constraints and can create a feedback loop in which each fix causes another failure.<\/p>\n<p>For independent issues, separate changes can still be preferable because they are easier to review and validate.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Shared root cause or interacting constraints → combine findings in one task.<\/li><li>Independent findings → consider separate tasks or parallel work.<\/li><li>Validation or formatting error → targeted retry may help.<\/li><li>Repeated regressions between related fixes → inspect the task decomposition before adding retries.<\/li><\/ul>", "docs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"], ["Claude Code — Common workflows", "https://code.claude.com/docs/en/common-workflows"]]}, {"k": "3.60", "d": "d3", "title": "Returning Actionable Findings from Explore Subagents", "scen": "<p>Explore subagents return prose summaries such as “the retry helper is duplicated in three modules.” The main session must repeat the discovery process just to locate the relevant code before editing.<\/p>", "scenLabel": "Scenario · Claude Code workflows (general)", "inline": false, "stem": "<p>What change fixes this problem?<\/p>", "c": [{"l": "A", "ok": false, "t": "Instruct the main agent to confirm every finding independently with Grep and Read before editing.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> This duplicates the exploration already performed by the subagent. It increases tool calls and main-session context usage instead of fixing the missing information in the handoff.<\/li><li><strong>When verification is appropriate:<\/strong> The main agent may still verify important findings, but verification should not be the routine substitute for actionable subagent output.<\/li><\/ul>"}, {"l": "B", "ok": false, "t": "Keep exploration in the main session and rely on <code>/compact<\/code> to preserve discovered locations.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> This abandons the context-isolation benefit of delegation. Compaction summarizes conversation history and may lose precise details such as file paths and line ranges.<\/li><li><strong>Key distinction:<\/strong> Compacting context is not a reliable way to preserve every actionable source location.<\/li><\/ul>"}, {"l": "C", "ok": true, "t": "Require every subagent finding to be returned as a structured entry containing the file path and line range.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> The problem is not that the subagent failed to find the issue; it is that the summary lacks the location metadata needed for the next step.<\/li><li><strong>Recommended output fields:<\/strong> Finding, file path, line range, relevant symbol, and a concise explanation of the evidence.<\/li><li><strong>Expected benefit:<\/strong> The main session can act on the discovery directly without repeating the entire search.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Require subagents to return their complete exploration transcripts.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Full transcripts preserve details but flood the main session with verbose tool output. This defeats the purpose of delegation and can degrade performance on long tasks.<\/li><li><strong>Better approach:<\/strong> Return a concise, structured result containing the actionable details.<\/li><\/ul>"}], "o": "<p>Subagents are valuable because they can perform detailed exploration in their own context and return a distilled result. That result must preserve enough metadata for downstream work.<\/p>\n<p>A prose summary communicates <em>what<\/em> was discovered, but not necessarily <em>where<\/em>. Adding file paths and line ranges makes the result actionable without transferring the full transcript.<\/p>\n<p>For example, a useful finding might look like this:<\/p>\n<pre><code class=\"lang-json\">{\n  \"finding\": \"Retry helper is duplicated\",\n  \"locations\": [\n    {\n      \"file\": \"src/payments/retry.ts\",\n      \"line_range\": \"24-51\",\n      \"symbol\": \"retryRequest\"\n    },\n    {\n      \"file\": \"src/orders/retry.ts\",\n      \"line_range\": \"18-43\",\n      \"symbol\": \"retryRequest\"\n    }\n  ],\n  \"summary\": \"Both implementations use the same retry policy.\"\n}<\/code><\/pre>\n<p>The example illustrates a possible output contract; the exact schema should match the team's workflow. The essential requirement is that each finding includes its source location.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Subagent summaries should be concise but actionable.<\/li><li>Include file paths and line ranges with each finding.<\/li><li>Preserve useful provenance without returning every tool call.<\/li><li>Structured output reduces duplicated discovery and makes delegation more effective.<\/li><\/ul>", "docs": [["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents"], ["Anthropic — Citations", "https://docs.anthropic.com/en/docs/build-with-claude/citations"]]}, {"k": "4.1", "d": "d2", "title": "Guaranteeing Exactly One Tool Call", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates work to specialized subagents that search the web, analyze documents, synthesize findings, and generate reports.<\/p>\n<p>A document-extraction pipeline's first Messages API request forces <code>extract_metadata<\/code> by name. The request also includes enrichment tools that will be used later. On long documents, Claude sometimes returns three <code>extract_metadata<\/code> calls in one response, one per section. The pipeline requires exactly one metadata record before enrichment begins.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which request change guarantees exactly one <code>extract_metadata<\/code> call?<\/p>", "c": [{"l": "A", "ok": false, "t": "Pass <code>disable_parallel_tool_use<\/code> as a top-level Messages API request parameter, keeping the forced selection unchanged.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> The flag is real, but it belongs inside the <code>tool_choice<\/code> object, not at the top level of the request.<\/li><li><strong>Key distinction:<\/strong> A valid setting placed at the wrong level will not enforce the intended behavior.<\/li><\/ul>"}, {"l": "B", "ok": true, "t": "Keep <code>tool_choice<\/code> forcing <code>extract_metadata<\/code> and set <code>disable_parallel_tool_use<\/code> to <code>true<\/code> inside the <code>tool_choice<\/code> object.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> Forcing the tool by name ensures that Claude calls <code>extract_metadata<\/code>. Setting <code>disable_parallel_tool_use<\/code> to <code>true<\/code> within <code>tool_choice<\/code> prevents multiple parallel calls, providing the required single-call behavior.<\/li><li><strong>Why this matters:<\/strong> The pipeline needs an API-level guarantee rather than a behavior that merely tends to occur.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Add a system prompt rule saying metadata must be extracted once for the whole document, never once per section.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Prompt instructions guide model behavior but cannot guarantee that only one tool call will be emitted. The model may still produce multiple calls on some documents.<\/li><li><strong>When it helps:<\/strong> Prompt instructions can clarify the intended extraction scope, but they should not replace a deterministic API control when call count is critical.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Change <code>tool_choice<\/code> to <code>any<\/code> and set <code>disable_parallel_tool_use<\/code> to <code>true<\/code> inside it.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> This can constrain the response to exactly one tool call, but it does not guarantee that the call will be <code>extract_metadata<\/code>. Since enrichment tools are also available, Claude could select one of those instead.<\/li><li><strong>Key distinction:<\/strong> Limiting the number of calls is not the same as forcing the correct tool.<\/li><\/ul>"}], "o": "<p>Two separate requirements must be satisfied:<\/p>\n<ol><li><strong>Tool identity:<\/strong> Force <code>extract_metadata<\/code> using the named-tool form of <code>tool_choice<\/code>.<\/li><li><strong>Tool-call count:<\/strong> Set <code>disable_parallel_tool_use: true<\/code> inside <code>tool_choice<\/code>.<\/li><\/ol>\n<p>Parallel tool use is enabled by default. Forcing a tool's identity alone does not prevent Claude from emitting several calls to that tool in the same response.<\/p>\n<p>The top-level parameter approach fails because the flag is misplaced. The prompt-only approach fails because instructions are not a hard API constraint. Using <code>any<\/code> constrains the call count but leaves the tool identity ambiguous.<\/p>\n<p><strong>Important limitation:<\/strong> Forced tool selection is not supported in every configuration, including certain combinations involving extended thinking. The scenario explicitly specifies a model that supports forced selection.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li><code>tool_choice<\/code> with a named tool → forces the intended tool.<\/li><li><code>disable_parallel_tool_use: true<\/code> inside <code>tool_choice<\/code> → prevents parallel calls.<\/li><li>Prompt instructions → guidance, not a guarantee.<\/li><li><code>any<\/code> → does not guarantee a particular tool when several tools are available.<\/li><\/ul>", "docs": [["Anthropic API — Tool use overview", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview"], ["Anthropic API — Define tools and tool choice", "https://docs.anthropic.com/en/docs/build-with-claude/tool-use/implement-tool-use"]]}, {"k": "4.2", "d": "d1", "title": "Distinguishing a Real Contradiction from Change Over Time", "scen": "<p>A research coordinator delegates work to search, document-analysis, synthesis, and report-generation subagents.<\/p>\n<p>The synthesis subagent reports a contradiction between two statistics published a year apart. The newer figure reflects genuine growth. Currently, subagents pass each finding as only a value and a source name.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the system be changed?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add a system prompt instruction telling the synthesis agent that differing statistics may cover different periods and should not be labeled as contradictions.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> The synthesis agent cannot distinguish a time-related change from a genuine conflict if the dates are missing.<\/li><li><strong>Additional risk:<\/strong> The instruction may suppress legitimate contradictions between sources that actually disagree.<\/li><\/ul>"}, {"l": "B", "ok": false, "t": "Have the synthesis agent annotate both values as a conflict, preserve source attribution, and pass them to the coordinator to reconcile.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Escalating an actual contradiction with attribution is reasonable, but the scenario describes a temporal difference rather than a genuine disagreement.<\/li><li><strong>Root problem:<\/strong> The coordinator receives the same incomplete data and cannot resolve the issue without publication dates.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Keep the value from the newer source and discard the older value to maintain report consistency.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> The older statistic is useful evidence of change over time. Discarding it removes the growth trend from the report.<\/li><li><strong>Additional problem:<\/strong> Without dates, the synthesis agent cannot reliably determine which source is newer.<\/li><\/ul>"}, {"l": "D", "ok": true, "t": "Require subagents to include the source's publication date as a structured field with every finding.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> Publication dates supply the missing temporal context. The synthesis agent can recognize that the statistics describe change over time rather than automatically interpreting them as contradictory.<\/li><li><strong>Implementation principle:<\/strong> Keep values, source attribution, and dates as distinct structured fields.<\/li><\/ul>"}], "o": "<p>In a multi-agent system, each subagent operates with its own context. Information reaches the next agent only when it is explicitly included in the handoff.<\/p>\n<p>If a finding contains only a value and a source name, downstream agents may lose important metadata such as the publication date. Prompting cannot reliably recover information that was never supplied.<\/p>\n<p>A more useful finding structure would be:<\/p>\n<pre><code class=\"lang-json\">{\n  \"metric\": \"Example metric\",\n  \"value\": 125,\n  \"source\": \"Example report\",\n  \"publication_date\": \"2025-06-15\"\n}<\/code><\/pre>\n<p>This is an illustrative schema, not a claim about the exact format required by the API.<\/p>\n<p>With the dates available, the synthesis agent can explain the increase and cite both sources. For genuine disagreements, it should preserve the conflicting evidence and report the uncertainty rather than automatically choosing one value.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Missing metadata → fix the handoff structure.<\/li><l
