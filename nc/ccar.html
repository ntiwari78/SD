": "D", "ok": false, "t": "Extract the payload with <code>jq -r '.result'<\/code>, since the wrapper nests the model's answer there.", "e": "Extracting <code>.result<\/code> is appropriate when the pipeline wants the ordinary text answer from JSON output. With schema-constrained output, it reads the wrong field and can return text that does not satisfy the schema."}], "o": "<p>Claude Code's print mode can return a JSON envelope containing several distinct fields. Each field has a separate purpose.<\/p>\n<ul><li><code>result<\/code> contains the model's text answer.<\/li><li><code>structured_output<\/code> contains the schema-validated payload when <code>--json-schema<\/code> is supplied.<\/li><li>Other metadata may accompany the result.<\/li><\/ul>\n<p>A pipeline that reads <code>result<\/code> and expects guaranteed schema-conformant JSON is reading the text-answer field rather than the validated-data field. The text may sometimes resemble valid JSON, which explains why the pipeline can appear to work intermittently, but that is not the correct contract to rely on.<\/p>\n<p>The fix is to read the <code>structured_output<\/code> field and handle unsuccessful or incomplete runs explicitly. A robust pipeline should verify that the run completed successfully and that <code>structured_output<\/code> is present before passing the extracted data to downstream systems.<\/p>\n<p>For example, a simplified extraction command might be:<\/p>\n<pre><code class=\"lang-bash\">claude -p \\\n  --output-format json \\\n  --json-schema \"$SCHEMA\" \\\n  \"$DOCUMENT\"<\/code><\/pre>\n<p>The parser should then extract the validated payload from the returned envelope's <code>structured_output<\/code> field rather than assuming the <code>result<\/code> field contains it.<\/p>\n<p>The core principle is to rely on the documented output contract rather than trying to enforce field placement through prompt wording.<\/p>", "docs": [["Claude Code: Headless mode", "https://code.claude.com/docs/en/headless"], ["Claude Code CLI reference", "https://code.claude.com/docs/en/cli-reference"], ["Claude structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]]}, {"k": "2.36", "d": "d2", "title": "Sharing MCP Server Configuration Correctly", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools (<code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, <code>escalate_to_human<\/code>). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>An engineer needs the backend MCP server to load for every teammate who clones the repository, while a prototype notification server should load only for that engineer. How should the two servers be configured?<\/p>", "c": [{"l": "A", "ok": false, "t": "List the backend server in <code>CLAUDE.md<\/code> so it loads for every teammate, and add the prototype to the project root <code>.mcp.json<\/code>.", "e": "<code>CLAUDE.md<\/code> provides context and instructions to the model; it does not register or launch MCP servers. Putting the prototype in the shared project configuration would also expose it to teammates."}, {"l": "B", "ok": false, "t": "Register both servers in <code>~/.claude.json<\/code> and have each teammate copy the backend server entry into their own configuration manually.", "e": "This makes shared infrastructure a manual setup task and allows configurations to drift. A project-level configuration can distribute the shared server consistently."}, {"l": "C", "ok": true, "t": "Define the backend server in a <code>.mcp.json<\/code> file at the project root checked into version control, and register the prototype in <code>~/.claude.json<\/code>.", "e": "Project-scoped MCP servers in <code>.mcp.json<\/code> can be shared through version control, so teammates who clone the repository receive the common configuration. User-scoped configuration in <code>~/.claude.json<\/code> keeps the prototype personal to the engineer."}, {"l": "D", "ok": false, "t": "Define both servers in the project root <code>.mcp.json<\/code>, labeling the prototype as experimental in its description so teammates know to ignore it.", "e": "A description is not a configuration boundary. A server defined in the shared project file is still shared with everyone using that repository."}], "o": "<p>MCP server configuration scope determines who receives a server definition. Use project-level <code>.mcp.json<\/code> for team infrastructure and a user-level <code>~/.claude.json<\/code> entry for personal or experimental servers. Keep secrets out of committed configuration by using environment-variable expansion where appropriate, and remember that project-scoped servers may require user approval before running.<\/p>", "docs": [["Claude Code — Connect to tools with MCP", "https://code.claude.com/docs/en/mcp"], ["Claude Agent SDK — MCP", "https://platform.claude.com/docs/en/agent-sdk/mcp"]]}, {"k": "2.37", "d": "d4", "title": "Choosing the Right API for Live and Batch Workloads", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>Alongside live conversations, the team runs a nightly audit that re-scores every resolved ticket for policy compliance. To capture the Message Batches API's 50% discount, how should these two workloads be split across APIs?<\/p>", "c": [{"l": "A", "ok": false, "t": "Submit both workloads as batches, since most batches finish in under an hour and polling can surface results quickly.", "e": "Typical completion time is not a guarantee. Batch processing can take up to 24 hours and has no latency SLA, so a live customer could be left waiting."}, {"l": "B", "ok": true, "t": "Submit the nightly ticket audit as a batch and keep live customer conversations on synchronous Messages API calls.", "e": "The nightly audit is non-blocking and can tolerate asynchronous processing, making it suitable for the Batch API discount. Live conversations require timely responses because a customer is waiting."}, {"l": "C", "ok": false, "t": "Keep both workloads synchronous, because batch results can return out of input order and cannot be reliably matched to tickets.", "e": "Results can arrive out of order, but <code>custom_id<\/code> lets the application correlate each result with its originating request. Ordering is not a reason to forgo batch processing for the nightly audit."}, {"l": "D", "ok": false, "t": "Submit live conversations as batches with a synchronous fallback triggered whenever a batch has not completed within a few minutes.", "e": "This adds complexity and may duplicate costs. Since batch completion is not guaranteed within a short window, the synchronous fallback could become the effective path anyway."}], "o": "<p>The Message Batches API trades latency for lower cost. It is suitable for offline workloads that do not require an immediate response, such as nightly audits. Live support conversations are interactive and should use synchronous Messages API calls.<\/p>\n<p>Batch results can be correlated using <code>custom_id<\/code>; do not assume results arrive in input order. Most importantly, distinguish a typical completion time from a service-level guarantee.<\/p>", "docs": [["Anthropic API — Message Batches", "https://platform.claude.com/docs/en/build-with-claude/message-batches"]]}, {"k": "2.38", "d": "d5", "title": "Designing Actionable Extraction Errors", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JSON schemas, and integrates with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>A parsing subagent sometimes fails on corrupted files, OCR timeouts, and unsupported layouts. Every failure currently returns a bare <code>\"extraction failed\"<\/code> status, so the coordinator can only retry blindly. Which error-reporting design enables intelligent recovery decisions?<\/p>", "c": [{"l": "A", "ok": true, "t": "Return the failure type, the step attempted, any partial extraction results, and possible alternative approaches.", "e": "The coordinator can use the error context to choose a recovery strategy. For example, it may retry a timeout, route a corrupted file to another parser, or continue with partial results while recording a coverage gap."}, {"l": "B", "ok": false, "t": "Return an empty extraction marked as successful so downstream validation and delivery continue without interruption.", "e": "This hides the failure and makes downstream systems interpret missing output as a legitimate empty result. It also corrupts monitoring and accuracy measurements."}, {"l": "C", "ok": false, "t": "Normalize every failure to a single retry-eligible status so the coordinator applies one uniform recovery path.", "e": "Different failures require different responses. A timeout may be transient, while a corrupted file may not improve with another identical attempt. A single status discards information needed for recovery."}, {"l": "D", "ok": false, "t": "Halt the batch on the first failure and surface the raw exception to an operator for manual triage of the document.", "e": "Stopping the entire batch loses partial progress and turns routine, potentially recoverable errors into manual interruptions. The coordinator should continue processing other documents where possible."}], "o": "<p>An error in an agentic pipeline is information that supports a decision, not merely a stop signal. The coordinator may need to retry, switch approaches, use partial results, annotate missing coverage, or escalate. It needs structured context about what failed, what was attempted, and what information was already recovered.<\/p>\n<p>At the API level, Anthropic's tool-use guidance similarly recommends returning failed tool executions as error results with useful descriptions rather than a generic failure message.<\/p>", "docs": [["Anthropic API — Handle tool calls and results", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"]]}, {"k": "2.39", "d": "d4", "title": "Detecting Semantic Errors in Structured Citations", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates work to specialized subagents for web research, document analysis, synthesis, and report generation.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The document analysis subagent extracts citations through a tool whose input schema is enforced. Reports still contain quotes attributed to the wrong sources and publication years placed in page-number fields. Which TWO actions should you take? <em>(Select TWO.)<\/em><\/p>", "c": [{"l": "A", "ok": true, "t": "Keep schema enforcement for its structural guarantees and add a validation layer that cross-checks extracted values against the source document.", "e": "Schema enforcement ensures the output follows the required structure and types, but it cannot prove that a quote belongs to the cited source or that a value is semantically correct. Source-grounded validation addresses that gap."}, {"l": "B", "ok": true, "t": "Add self-check fields to the extraction schema that surface internal inconsistencies, and route flagged extractions to a review step.", "e": "Complementary fields can expose inconsistencies that are otherwise invisible to schema validation. Flagged records can then be reviewed instead of passing through automatically."}, {"l": "C", "ok": false, "t": "Audit and repair the schema definition, since these failures show malformed JSON is slipping past validation undetected.", "e": "The reported outputs are structurally valid. The problem is incorrect content in valid fields, not malformed JSON."}, {"l": "D", "ok": false, "t": "Tighten the input schema with stricter type constraints and mark more fields as required so misplaced values can no longer pass validation.", "e": "Stricter types and required fields still constrain structure, not truth. A wrong year can still be a valid integer in the wrong field, and requiring unavailable information can encourage fabrication."}], "o": "<p>A JSON schema constrains the <strong>shape<\/strong> of output, not its <strong>meaning<\/strong>. Correctly typed fields and valid JSON do not guarantee accurate attribution, source fidelity, or consistency across values.<\/p>\n<p>A robust extraction pipeline therefore combines schema enforcement with semantic validation. Cross-check extracted claims against the source, use self-checks to expose inconsistencies, and route questionable results to review. Avoid treating stricter structural constraints as a substitute for verifying the extracted facts.<\/p>", "docs": [["Anthropic API — Structured outputs", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"], ["Anthropic API — Strict tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use"]]}, {"k": "2.40", "d": "d1", "title": "Preventing Duplicate Work Across Review Subagents", "scen": "<p>You are integrating Claude Code into a CI/CD pipeline that runs automated code reviews, generates test cases, and provides feedback on pull requests.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline's coordinator spawns three review subagents in parallel, each prompted only with <code>\"review this pull request\"<\/code>. Their findings overlap heavily, nearly doubling token cost without adding review coverage. What is the most effective fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run the subagents sequentially, passing each one the findings of the previous subagents so it avoids re-reporting flagged issues.", "e": "Sequential execution sacrifices the speed benefit of parallel review and treats duplication as a filtering problem instead of fixing the ambiguous assignments that cause it."}, {"l": "B", "ok": true, "t": "Have the coordinator assign each subagent one distinct review concern, such as security, test coverage, or style, in its delegation prompt.", "e": "Subagents need clear task boundaries. Assigning non-overlapping review areas at delegation time reduces duplicated investigations while preserving parallel execution."}, {"l": "C", "ok": false, "t": "Add a shared log file that each subagent updates with its current focus area so the others can steer around duplicated work dynamically.", "e": "This adds fragile coordination and polling overhead. The coordinator can establish distinct scopes before the subagents begin, without relying on agents to negotiate through shared state."}, {"l": "D", "ok": false, "t": "Let all three finish in parallel, then add a deduplication pass in the coordinator that merges overlapping findings before posting feedback.", "e": "Deduplication may clean up the final report, but the duplicated investigations have already consumed tokens and time. The same waste will recur while all agents receive identical, unscoped prompts."}], "o": "<p>Parallel subagents work best when their investigations are independent. A subagent's context starts fresh, so the coordinator should not assume that one subagent knows what another is reviewing. The delegation prompt is the place to define each agent's responsibilities.<\/p>\n<p>Partition the work before launching the agents—for example, security, test coverage, and style. The coordinator can then synthesize their separate findings. This keeps the work parallel while reducing duplicated effort and cost.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Code — Create and use subagents", "https://code.claude.com/docs/en/sub-agents"]]}, {"k": "2.41", "d": "d3", "title": "Importing Shared Review Criteria into CLAUDE.md", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The review criteria live in <code>standards/review-criteria.md<\/code> so other tooling can share the file, and every CI-invoked Claude Code session must have the criteria in context from launch. How should <code>CLAUDE.md<\/code> reference the file?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the criteria into <code>.claude/rules/review-criteria.md<\/code> with a paths glob so the rule activates whenever the pipeline runs a review.", "e": "Path-scoped rules load when Claude works with files matching the specified glob, not unconditionally at session start. Review criteria must apply to every review regardless of which files the pull request touches, so conditional loading is the wrong fit."}, {"l": "B", "ok": true, "t": "Add the line <code>@standards/review-criteria.md<\/code> to the project <code>CLAUDE.md<\/code> so the file's contents expand into context at launch.", "e": "This is the documented import mechanism. An <code>@path<\/code> reference in <code>CLAUDE.md<\/code> causes the referenced file's contents to be included in context at launch, keeping the criteria modular and shareable while ensuring every session receives them."}, {"l": "C", "ok": false, "t": "Wrap the path in backticks as <code>@standards/review-criteria.md<\/code> inside <code>CLAUDE.md<\/code> so Claude Code resolves and reads the file on demand.", "e": "Import parsing skips Markdown code spans and fenced code blocks. A path wrapped in backticks is treated as literal text rather than an import, so the criteria will not be loaded through this mechanism."}, {"l": "D", "ok": false, "t": "Copy the criteria into a <code>CLAUDE.md<\/code> placed inside the <code>standards/<\/code> subdirectory so every session inherits it automatically.", "e": "Nested subdirectory <code>CLAUDE.md<\/code> files load on demand when Claude reads files in that directory; they do not automatically load at session start. Copying the criteria also creates a second source of truth that can drift from the shared file."}], "o": "<p><code>CLAUDE.md<\/code> supports inline imports: writing <code>@path/to/file<\/code> directly in the file causes Claude Code to expand the referenced file into context. This is textual inclusion, not a lazy reference, so the imported content is available at launch.<\/p>\n<p>Relative paths resolve relative to the file containing the import. Imports also do not reduce context usage because the imported content still enters the context window.<\/p>\n<p>For criteria that must apply to every CI run, use an import in the project-level <code>CLAUDE.md<\/code>. Path-scoped rules and nested <code>CLAUDE.md<\/code> files have conditional loading behavior that may leave some reviews without the criteria.<\/p>", "docs": [["Claude Code — Manage memory", "https://code.claude.com/docs/en/memory"], ["Claude Code — Debug your configuration", "https://code.claude.com/docs/en/settings"]]}, {"k": "2.42", "d": "d4", "title": "Designing a Verifier for Calibrated Routing", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You add a verification pass that checks each drafted resolution against refund and escalation policy before it executes, routing risky drafts to a human. How should the verifier's output be designed for calibrated routing?<\/p>", "c": [{"l": "A", "ok": false, "t": "Instruct the verifier to report only high-confidence, high-severity policy violations so routing receives an already-filtered signal.", "e": "Telling the finding pass to filter itself suppresses uncertain findings before routing sees them, reducing recall. Borderline risky drafts may be silently approved because potential concerns never reach the routing logic."}, {"l": "B", "ok": false, "t": "Return a single approve-or-reject verdict per draft so the routing logic stays deterministic and simple to implement.", "e": "A binary verdict discards the calibration signal routing needs. Without per-finding confidence and severity, the system cannot distinguish minor concerns from serious risks or tune review thresholds appropriately."}, {"l": "C", "ok": true, "t": "Have the verifier report every potential issue with a confidence level and severity for each, applying routing thresholds downstream.", "e": "Separating finding from filtering preserves both coverage and routing precision. The verifier surfaces the potential issues it identifies, while downstream logic uses confidence and severity to decide which drafts need human review."}, {"l": "D", "ok": false, "t": "Have the same session that drafted the resolution re-check it and flag anything it now judges a likely policy violation.", "e": "A model reviewing its own draft in the same session retains the reasoning that produced the original decision and may be less likely to challenge it. An independent verification pass can catch issues that self-review rationalizes away."}], "o": "<p>The central design principle is <strong>separating finding from filtering<\/strong>.<\/p>\n<ul><li><strong>Finding stage:<\/strong> Surface potential issues, including uncertain or low-severity findings, and attach confidence and severity information.<\/li><li><strong>Routing stage:<\/strong> Apply explicit, tunable thresholds to decide whether a draft can proceed automatically or needs human review.<\/li><\/ul>\n<p>For example, a low-confidence but high-severity policy concern may warrant escalation, while a low-severity formatting issue may not. If the verifier filters out uncertain findings itself, the downstream stage cannot evaluate concerns it never receives.<\/p>", "docs": [["Anthropic — Prompting Claude Sonnet 5", "https://platform.claude.com/docs/en/about-claude/models/overview"]]}, {"k": "2.43", "d": "d2", "title": "Scoping Tool Access Between Parsing and Validation Agents", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JavaScript Object Notation (JSON) schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>The pipeline delegates work to a parsing subagent and a validation subagent. The validation subagent frequently needs to check single extracted values against the source text and only occasionally needs a full document re-parse. How should its tool access be designed?<\/p>", "c": [{"l": "A", "ok": false, "t": "Merge the validation agent into the parsing agent so the question of cross-role tool access never arises.", "e": "Merging the roles removes useful specialization and creates one agent with a larger toolset and two distinct jobs. It solves the access question by abandoning the architecture rather than allocating tools appropriately."}, {"l": "B", "ok": false, "t": "Route both the snippet checks and the full re-parsing requests through the coordinator, keeping its toolset free of document access.", "e": "Routing every high-frequency snippet check through the coordinator adds a delegation round trip to a common operation. The validation agent needs an efficient way to handle these routine checks locally."}, {"l": "C", "ok": true, "t": "Give it a scoped <code>fetch_source_snippet<\/code> tool for the frequent value checks and route full re-parsing through the coordinator.", "e": "The validation agent receives a narrow cross-role utility for its frequent, simple need, while the rare and complex re-parsing task remains with the parsing specialist. This keeps the validation agent's tool inventory small and relevant to its role."}, {"l": "D", "ok": false, "t": "Grant it the parsing agent's complete toolset so both the frequent checks and the occasional re-parsing stay local.", "e": "Duplicating the parsing agent's full toolset expands the validation agent's inventory beyond its role. An oversized tool inventory can make tool selection less reliable and encourage misuse of tools outside the agent's specialization."}], "o": "<p>Tool allocation is an architectural control. Agents generally select tools more reliably when their available tools are closely aligned with their responsibilities.<\/p>\n<p>The appropriate design balances two costs:<\/p>\n<ul><li><strong>Routing overhead:<\/strong> Frequently used, simple operations should not require unnecessary coordinator round trips.<\/li><li><strong>Tool-selection reliability:<\/strong> Agents should not receive broad tool inventories that encourage unrelated or inappropriate tool use.<\/li><\/ul>\n<p>A constrained <code>fetch_source_snippet<\/code> utility satisfies the validation agent's frequent need without granting it the parsing agent's entire toolset. Full re-parsing remains a specialized task routed through the coordinator.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system"]]}, {"k": "2.44", "d": "d2", "title": "Running Independent Subagent Tasks Concurrently", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>The coordinator delegates three independent extraction passes—parties, financial terms, and key dates—to dedicated subagents, dispatching one Task call per turn and waiting for each result. What change makes the passes run concurrently?<\/p>", "c": [{"l": "A", "ok": false, "t": "Merge the three specialized subagents into a single <code>AgentDefinition<\/code> that performs all extraction passes in one delegation.", "e": "Collapsing the passes into one subagent does not create concurrency. The single agent still performs the three extractions one after another within its own context, reducing specialization and context isolation."}, {"l": "B", "ok": false, "t": "Return each subagent's tool result in its own user message immediately, letting the coordinator start the next pass sooner.", "e": "This changes how results are returned, not how the tool calls are dispatched. The passes remain sequential. Anthropic's guidance is to return all results for multiple tool calls together in a single user message."}, {"l": "C", "ok": true, "t": "Have the coordinator emit the three Task tool calls together in one response instead of one per turn.", "e": "Claude can return multiple <code>tool_use<\/code> blocks in a single response, and the harness can execute independent requests concurrently. Emitting all three calls in one coordinator turn enables the extraction passes to run side by side."}, {"l": "D", "ok": false, "t": "Assign each extraction subagent a lower-latency model so every individual pass completes more quickly.", "e": "A faster model may shorten each pass, but it does not change the sequential dispatch pattern. Total latency remains the sum of the passes rather than approximately the time required by the slowest pass."}], "o": "<p>Concurrency depends on the coordinator's dispatch pattern. If independent tasks are issued as separate calls in separate turns, they run sequentially. If the coordinator issues multiple tool calls in one response, the harness can execute them in parallel when no dependency requires ordering.<\/p>\n<p>For parallel calls, the harness must return a matching <code>tool_result<\/code> for each <code>tool_use<\/code> block, keyed by its <code>tool_use_id<\/code>. The results should be grouped in the same next user message.<\/p>\n<p>The extraction passes here are independent read-only tasks, so they can run concurrently. The result-handling protocol matters too: splitting results into separate messages can discourage the model from continuing to batch tool calls.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Anthropic API — How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "2.45", "d": "d1", "title": "Handling Timeouts in a Web Search Subagent", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The web search subagent's queries to one news archive intermittently time out; an immediate retry usually succeeds, but occasionally the archive stays down for an entire task. How should the subagent handle these timeouts?<\/p>", "c": [{"l": "A", "ok": true, "t": "Retry timed-out queries locally with backoff, and if the archive stays down, escalate the failure to the coordinator with attempted queries and partial results.", "e": "Transient timeouts are often recoverable with a local retry, so the subagent can resolve them without involving the coordinator. Persistent failures should be propagated with enough context for the coordinator to make an informed recovery decision."}, {"l": "B", "ok": false, "t": "Return the results gathered from the other sources under a success status, letting synthesis proceed without interrupting the research workflow.", "e": "Marking a failed source as successful hides the failure. The coordinator and synthesis agent may believe the archive was searched when it was not, leaving a research coverage gap unreported."}, {"l": "C", "ok": false, "t": "Keep retrying the archive inside the subagent until the request eventually succeeds, so the coordinator only ever receives complete result sets.", "e": "Unbounded retries can stall the workflow when the archive remains unavailable, wasting latency and resources. After a small number of local attempts, unresolved failures should be propagated with context."}, {"l": "D", "ok": false, "t": "Forward every timeout to the coordinator as it occurs, keeping all retry and recovery decisions centralized so error handling stays uniform and fully observable.", "e": "Escalating every transient failure floods the coordinator with routine recovery work. Since an immediate retry usually succeeds, the subagent should attempt local recovery first and escalate only when the problem remains unresolved."}], "o": "<p>The guiding principle is to <strong>handle errors at the lowest level capable of resolving them<\/strong>.<\/p>\n<ol><li>Attempt a small number of local retries with backoff for transient failures.<\/li><li>If recovery succeeds, return the results normally.<\/li><li>If the source remains unavailable, report the failure with its type, attempted queries, and any partial results.<\/li><li>Let the coordinator decide whether to retry later, use another source, or proceed with an explicitly documented coverage gap.<\/li><\/ol>\n<p>An execution failure and a valid empty result are not the same outcome. The system must report failures honestly so that downstream synthesis does not mistake missing research for a completed search.<\/p>\n<p>For custom tools, structured error results are useful because they can carry actionable recovery context instead of exposing only a generic exception.<\/p>", "docs": [["Claude Agent SDK — Subagents", "https://platform.claude.com/docs/en/agent-sdk/subagents"], ["Claude Agent SDK — Custom tools", "https://platform.claude.com/docs/en/agent-sdk/custom-tools"]]}, {"k": "2.46", "d": "d2", "title": "Improving MCP Tool Descriptions", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline's custom <code>fetch_pr_diff<\/code> MCP tool is described only as <code>\"Retrieves a diff.\"<\/code> The agent passes repository URLs instead of the required numeric pull request identifier and calls it on merged PRs it cannot serve. Which fix is highest-leverage?<\/p>", "c": [{"l": "A", "ok": false, "t": "Rename the tool to <code>fetch_pr_diff_by_number<\/code> so the required identifier type is evident from the name alone.", "e": "A clearer name can help, but names cannot communicate all input formats, examples, and scope boundaries. The description remains the dominant signal for how the model selects and constructs a tool call."}, {"l": "B", "ok": false, "t": "Add the input format rules and the merged-PR restriction to the pipeline's system prompt rather than to the tool itself.", "e": "System prompt instructions can influence tool use, but the tool description is the more direct and localized signal available when the model constructs a call. Keeping the guidance away from the tool definition weakens it and becomes harder to maintain as more tools are added."}, {"l": "C", "ok": false, "t": "Keep the description minimal and return structured validation errors, letting the agent correct its inputs through repeated retry attempts.", "e": "Structured errors are useful as a safety net, but they are reactive. Each malformed call consumes an additional turn. A better description can prevent avoidable errors before the tool is called."}, {"l": "D", "ok": true, "t": "Rewrite the description to state the numeric identifier format, show an example input, and note that merged PRs are out of scope.", "e": "The tool description is a primary source of information for both tool selection and argument construction. Specifying the expected format, a concrete example, and the tool's boundaries helps prevent malformed and out-of-scope calls."}], "o": "<p>A good tool description should explain what the tool does, when to use it, when not to use it, what each parameter means, what format it expects, and any important limitations.<\/p>\n<p>For example, the description should clearly state that the tool accepts a numeric pull request identifier rather than a repository URL and cannot serve merged pull requests. The input schema should reinforce this contract wherever possible.<\/p>\n<p>The principle is to prevent predictable errors at the decision point rather than relying on retries to repair them afterward.<\/p>", "docs": [["Anthropic API — How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"]]}, {"k": "2.47", "d": "d5", "title": "Calibrating Confidence Scores for Code Review", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>Developers have started ignoring the review comments because roughly a third are false positives. You want to auto-post only findings that are likely genuine and route the rest to a triage queue. What should you implement?<\/p>", "c": [{"l": "A", "ok": false, "t": "Have the same reviewing instance re-evaluate its own findings and auto-post only the ones it still endorses on a second pass.", "e": "A model retains the reasoning that produced its findings and may be reluctant to challenge its own conclusions. Self-review by the same instance is therefore a weak way to filter false positives."}, {"l": "B", "ok": true, "t": "Have the model output a confidence score with each finding, then tune the auto-post threshold on a labeled set of past findings marked valid or false positive.", "e": "Confidence scores become useful routing signals when calibrated against labeled ground truth. Historical reviewer judgments show how well the scores distinguish genuine findings from false positives, allowing the team to choose an evidence-based threshold."}, {"l": "C", "ok": false, "t": "Apply a fixed confidence cutoff of 0.8 across all finding categories, trusting the model's self-reported scores to be consistent without any validation step.", "e": "Model-reported confidence is not automatically calibrated. A score of 0.8 does not guarantee 80% accuracy, and the relationship between confidence and correctness may differ across categories."}, {"l": "D", "ok": false, "t": "Auto-post only findings the model classifies as high severity, on the assumption that severity strongly correlates with a finding being genuine.", "e": "Severity measures the impact of an issue if it is real, not the probability that the finding is correct. A high-severity finding can still be a false positive."}], "o": "<p>The problem is a routing decision: some findings should be posted automatically, while others should be held for triage.<\/p>\n<p>Use per-finding confidence scores, but first build a labeled validation set containing past findings that reviewers have classified as valid or false positive. Measure actual precision across confidence ranges and choose a threshold that meets the team's tolerance for false positives.<\/p>\n<p>Repeat the calibration when prompts, models, or review criteria change. The key principle is <strong>measure, then automate<\/strong> rather than assuming the model's confidence is reliable out of the box.<\/p>", "docs": [["Anthropic API — Define success criteria", "https://platform.claude.com/docs/en/test-and-evaluate/define-success"], ["Anthropic API — Create evaluation datasets", "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"]]}, {"k": "2.48", "d": "d2", "title": "Fixing Ambiguous MCP Tool Descriptions", "scen": "<p>You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>The pipeline exposes <code>scan_code<\/code> (security scanning) and <code>check_code<\/code> (linting), but both tools carry the description <code>\"checks code and reports issues,\"<\/code> and review requests are frequently misrouted. Which TWO changes most directly fix this? <em>(Select TWO.)<\/em><\/p>", "c": [{"l": "A", "ok": false, "t": "Merge both tools into a single <code>analyze_code<\/code> tool with a mode parameter that selects scanning or linting behavior.", "e": "Merging the tools hides the selection problem inside an overloaded interface. The model must still choose the right behavior, but the distinct descriptions that could guide that choice are lost."}, {"l": "B", "ok": true, "t": "Rewrite <code>check_code<\/code>'s description to state what it lints, its expected inputs, and when NOT to use it.", "e": "Explicit descriptions and boundaries help the model distinguish tools that otherwise appear interchangeable. Stating expected inputs and when not to use a tool makes its intended scope clearer."}, {"l": "C", "ok": false, "t": "Add few-shot routing examples to the review prompt showing which tool handles each request type.", "e": "Prompt examples add token overhead and put routing guidance away from the tool definitions used at selection time. The identical descriptions remain ambiguous."}, {"l": "D", "ok": true, "t": "Rename <code>scan_code<\/code> to <code>run_security_scan<\/code> and update its description to reference vulnerability detection specifically.", "e": "A name that reflects the tool's function, combined with a specific description, reduces semantic overlap with the linting tool. The model gets a clearer signal about which tool matches a security request."}], "o": "<p>Claude selects tools primarily by using the information in their descriptions. When two tools have identical or nearly identical descriptions, the model lacks a clear signal for distinguishing their purposes.<\/p>\n<p>The remedy is to make the interface contracts distinct:<\/p>\n<ul><li>Describe the specific function and domain of each tool.<\/li><li>Explain expected inputs and formats.<\/li><li>Include boundaries describing when the tool should not be used.<\/li><li>Use tool names that accurately reflect the intended operation.<\/li><\/ul>\n<p>Avoid merging distinct operations into one overloaded tool simply to reduce the number of tools. The model still has to make a decision, and a mode parameter can make that decision less transparent.<\/p>", "docs": [["Anthropic API — How to implement tool use", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/implement-tool-use"], ["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "2.49", "d": "d3", "title": "Keeping Codebase Discovery Out of the Main Context", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>An engineer maintaining this system asks Claude Code to trace how the coordinator routes tasks. Discovery output (file listings, grep results) is rapidly consuming the main context window. What should the engineer do?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run <code>/compact<\/code> after each discovery phase so the accumulated search output is summarized within the same session.", "e": "Compaction is a recovery mechanism, not an isolation mechanism. The verbose output enters the main context first, and summarization may lose precise details such as file paths and exact matches."}, {"l": "B", "ok": false, "t": "Use <code>/clear<\/code> once the window fills, then restate the findings gathered so far and continue the investigation.", "e": "Clearing discards accumulated understanding along with the noise. The engineer must repeatedly reconstruct the findings, treating the symptom rather than preventing the context pollution."}, {"l": "C", "ok": false, "t": "Switch to plan mode so the investigation proceeds read-only and produces a plan instead of verbose output.", "e": "Plan mode controls whether Claude may make changes; it does not prevent exploration output from accumulating in the main context. A read-only investigation can still generate large amounts of search output."}, {"l": "D", "ok": true, "t": "Delegate the search to the Explore subagent, which holds the verbose output in its own context and returns a summary.", "e": "Explore is a built-in, read-only subagent optimized for searching and analyzing codebases. Because it runs in a separate context window, raw file listings and search results remain there, and the main conversation receives only the distilled findings."}], "o": "<p>The key distinction is <strong>prevention versus recovery<\/strong>.<\/p>\n<p>Codebase discovery often involves directory listings, search results, call sites, and file contents that are useful during investigation but unnecessary in the main conversation. Delegating this work to Explore isolates the high-volume intermediate output while preserving the relevant conclusions.<\/p>\n<p>The alternatives act after the context has already been polluted:<\/p>\n<ul><li><code>/compact<\/code> summarizes accumulated context, potentially losing details.<\/li><li><code>/clear<\/code> discards context and requires reconstruction.<\/li><li>Plan mode restricts changes but does not isolate discovery output.<\/li><\/ul>\n<p>Delegating discovery lets the main session focus on understanding the routing design and making the required maintenance changes.<\/p>", "docs": [["Claude Code — Subagents", "https://code.claude.com/docs/en/sub-agents"], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "2.50", "d": "d3", "title": "Showing Required Skill Arguments to Engineers", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>The team's <code>/extract-fields<\/code> skill requires a source document path and a target schema name, but engineers keep invoking the skill bare and get empty or malformed extractions. Which <code>SKILL.md<\/code> frontmatter change best addresses this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Expand the <code>description<\/code> field so Claude can decide more precisely when the skill should be invoked.", "e": "The description helps Claude determine when a skill is relevant and should be selected. It does not directly display the arguments an engineer must supply when explicitly invoking the skill, so bare invocations can continue."}, {"l": "B", "ok": true, "t": "Add <code>argument-hint<\/code> so the skill's expected arguments are shown to engineers when they invoke it.", "e": "The <code>argument-hint<\/code> frontmatter field communicates the expected arguments to users at invocation time. Showing the required document path and schema name directly addresses the missing-argument behavior."}, {"l": "C", "ok": false, "t": "Add the source document path and schema name to the skill's allowed tools so Claude can discover the arguments automatically.", "e": "Tool permissions determine which tools a skill can use; they do not communicate the required invocation arguments to the engineer."}, {"l": "D", "ok": false, "t": "Move the required arguments into the skill's body and repeat them in the instructions so Claude can infer them during execution.", "e": "Instructions inside the skill body can guide behavior after the skill is invoked, but they do not provide the same visible invocation-time hint that the <code>argument-hint<\/code> field supplies. They also cannot reliably provide a source path or schema name that the engineer has not specified."}], "o": "<p>A skill's frontmatter fields serve different purposes. The <code>description<\/code> explains what the skill does and helps determine when it is relevant; <code>argument-hint<\/code> communicates the expected arguments to the user when invoking it.<\/p>\n<p>For a skill that requires both a document path and a target schema name, an invocation hint makes the contract visible at the point of use. This reduces avoidable empty or malformed extractions caused by missing inputs.<\/p>", "docs": [["Claude Code — Skills", "https://code.claude.com/docs/en/skills"]]}, {"k": "2.51", "d": "d1", "title": "Enforcing Refund Policies Before Tool Execution", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. The target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>Compliance auditors find the agent occasionally processes refunds for orders older than 90 days, despite explicit system prompt instructions forbidding this. These refunds cannot be reversed. Which design guarantees the policy while preserving autonomous handling of in-policy refunds?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add a <code>PostToolUse<\/code> hook that detects refunds on orders past 90 days after execution and automatically issues a compensating reversal transaction.", "e": "<code>PostToolUse<\/code> hooks fire only after the tool has run. The prohibited refund has already executed before the hook can inspect it. Since the scenario states these refunds cannot be reversed, after-the-fact detection cannot guarantee compliance."}, {"l": "B", "ok": false, "t": "Remove the <code>process_refund<\/code> tool from the agent's configured MCP tools entirely and instruct it to route every refund request to a human agent.", "e": "Removing the tool prevents prohibited refunds, but it also prevents the agent from processing legitimate refunds autonomously. This overcorrects by eliminating the capability rather than blocking only the violating subset."}, {"l": "C", "ok": true, "t": "Add a <code>PreToolUse<\/code> hook that blocks <code>process_refund<\/code> calls for orders past 90 days and redirects those cases to the <code>escalate_to_human<\/code> workflow.", "e": "A <code>PreToolUse<\/code> hook runs before the tool executes. It can inspect the order date and block an out-of-policy refund deterministically. In-policy refunds can continue through the normal autonomous workflow, while prohibited cases are escalated."}, {"l": "D", "ok": false, "t": "Move the 90-day rule into the <code>process_refund<\/code> tool description and reinforce it with few-shot refusal examples in the system prompt.", "e": "Tool descriptions and few-shot examples improve the likelihood that the model follows a rule, but they cannot guarantee compliance. The auditors have already found that instruction-based safeguards occasionally fail."}], "o": "<p>The core distinction is between <strong>probabilistic guidance<\/strong> and <strong>programmatic enforcement<\/strong>.<\/p>\n<ul><li>Prompts and tool descriptions influence what the model attempts to do.<\/li><li>A pre-execution hook can enforce a rule independently of the model's reasoning.<\/li><li>A post-execution hook can inspect results or initiate follow-up work, but it cannot prevent an irreversible action that has already occurred.<\/li><\/ul>\n<p>For financially consequential actions, place hard constraints in the enforcement layer. The hook should check the relevant order date before execution, deny prohibited calls, and direct the agent toward an approved escalation path.<\/p>", "docs": [["Claude Code — Hooks reference", "https://code.claude.com/docs/en/hooks"], ["Claude Code — Get started with hooks", "https://code.claude.com/docs/en/hooks-guide"]]}, {"k": "2.52", "d": "d5", "title": "Improving Extraction from the Middle of Long Documents", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JavaScript Object Notation (JSON) schemas, maintains high accuracy, and integrates with downstream systems.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>Extraction requests concatenate multiple document sections into roughly 80K-token inputs. Fields from the first and last sections extract reliably, but fields present in middle sections often come back <code>null<\/code>. Which change addresses this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Relocate the JSON schema and extraction instructions to the middle of the prompt so they sit adjacent to the sections whose fields are missed.", "e": "Anthropic's long-context guidance recommends placing long-form data near the beginning and queries or instructions near the end. Moving instructions into the middle runs counter to that guidance and does not resolve the underlying retrieval problem."}, {"l": "B", "ok": false, "t": "Increase <code>max_tokens<\/code> so the model has sufficient output budget to populate every field defined in the extraction schema.", "e": "The symptom is missed information from the middle of the input, not a response truncated by the output token limit. Increasing the output budget does not improve recall of evidence that the model failed to retrieve."}, {"l": "C", "ok": false, "t": "Add a system prompt instruction directing the model to give equal weight to every section regardless of its position in the input.", "e": "An instruction to attend equally does not eliminate positional attention loss. The model can still miss middle-section evidence even when told to treat every section equally."}, {"l": "D", "ok": true, "t": "Restructure requests so document content sits at the top in XML-tagged sections, with Claude quoting relevant passages before extracting.", "e": "This combines three useful long-context techniques: placing the source material near the beginning, using XML tags to identify document boundaries, and asking Claude to quote relevant passages before producing the structured extraction. Quoting the evidence makes the model locate the supporting text before generating the final fields."}], "o": "<p>This is the classic <strong>lost-in-the-middle<\/strong> problem: information at the beginning and end of a long input is retrieved more reliably than information buried in its middle.<\/p>\n<p>Anthropic's long-context guidance recommends:<\/p>\n<ol><li>Put long-form source material near the top of the prompt.<\/li><li>Clearly delimit documents and sections with XML tags such as <code>&lt;document&gt;<\/code> and <code>&lt;document_content&gt;<\/code>.<\/li><li>Put the task instructions and query after the source material.<\/li><li>Ask Claude to extract or quote relevant passages before producing the final structured result.<\/li><\/ol>\n<p>The goal is not merely to fit the input into the context window. It is to improve the model's ability to locate and use evidence throughout that input.<\/p>", "docs": [["Anthropic API — Context windows", "https://platform.claude.com/docs/en/build-with-claude/context-windows"], ["Anthropic API — Long-context prompting tips", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/long-context-tips"]]}, {"k": "2.53", "d": "d2", "title": "Making Extraction Errors Actionable", "scen": "<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JSON schemas, and must handle edge cases gracefully.<\/p>", "scenLabel": "Scenario · Structured data extraction", "inline": false, "stem": "<p>The extraction tool returns the identical message <code>\"extraction failed\"<\/code> whether the document store timed out or a file uses an unsupported format. The agent keeps retrying unsupported files, wasting turns. How should the tool's error responses change?<\/p>", "c": [{"l": "A", "ok": true, "t": "Include an <code>errorCategory<\/code> and an <code>isRetryable<\/code> flag alongside a descriptive message in each error response.", "e": "Structured error metadata tells the agent what happened and whether another attempt is appropriate. A transient timeout can carry <code>isRetryable: true<\/code>, while an unsupported format can carry <code>isRetryable: false<\/code>. The agent can then retry recoverable failures and stop wasting attempts on permanent ones."}, {"l": "B", "ok": false, "t": "Add a system prompt instruction telling the agent to retry every failed extraction exactly once before moving on.", "e": "A uniform retry policy ignores the distinction between transient and permanent failures. Retrying a timeout may help, but retrying an unsupported format is futile. This rule still wastes turns and can abandon recoverable work prematurely."}, {"l": "C", "ok": false, "t": "Return unsupported-format failures as successful results with an empty extraction object so the agent stops retrying.", "e": "This disguises failure as success. Downstream systems may interpret the empty object as a legitimate extraction result, silently losing information and making the failure harder to detect."}, {"l": "D", "ok": false, "t": "Wrap raw exception stack traces from the parser in the error message so the agent can infer whether to retry.", "e": "Stack traces expose implementation details rather than a reliable, explicit recovery signal. The agent would have to infer retryability from unstructured text. The tool author knows the failure semantics and should communicate them directly."}], "o": "<p>Generic error messages force the model to guess whether a failure is recoverable. Different failure categories require different responses:<\/p>\n<ul><li><strong>Transient error:<\/strong> For example, a document-store timeout. Retry with backoff when appropriate.<\/li><li><strong>Permanent or unsupported input:<\/strong> For example, an unsupported file format. Stop retrying and explain the limitation or route the file elsewhere.<\/li><li><strong>Validation or business error:<\/strong> Correct the input or follow the appropriate workflow rather than blindly retrying.<\/li><\/ul>\n<p>The tool should return a structured error category, an explicit retryability flag, and a human-readable explanation. This turns recovery into a decision based on a defined contract rather than probabilistic interpretation.<\/p>", "docs": [["Claude Agent SDK — MCP", "https://platform.claude.com/docs/en/agent-sdk/mcp"], ["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"]]}, {"k": "2.54", "d": "d3", "title": "Understanding allowed-tools and Enforcing Tool Restrictions", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. It has access to backend systems through MCP tools, including <code>process_refund<\/code> and <code>escalate_to_human<\/code>.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>A developer adds <code>allowed-tools: Read Grep Glob<\/code> to a triage skill's <code>SKILL.md<\/code>, intending to guarantee the skill can never call the <code>process_refund<\/code> tool. Which TWO approaches align with how these mechanisms actually behave? <em>(Select TWO.)<\/em><\/p>", "c": [{"l": "A", "ok": false, "t": "Rely on omitting the refund tool from the <code>allowed-tools<\/code> list to keep it blocked for as long as the skill's instructions remain loaded in context.", "e": "<code>allowed-tools<\/code> is not a denylist. Omitting <code>process_refund<\/code> does not block it, because unlisted tools remain callable under the session's normal permission settings. The grant is also scoped to the invoking turn, not to how long the skill's instructions remain in context."}, {"l": "B", "ok": true, "t": "Enforce the guarantee with a permission deny rule on the refund tool, since deny rules take precedence over a skill's <code>allowed-tools<\/code> grant.", "e": "Permission rules are evaluated in the order <strong>deny, then ask, then allow<\/strong>. A matching deny rule blocks the call even if an allow grant would otherwise match. This provides the enforcement needed to guarantee that the prohibited tool cannot be called."}, {"l": "C", "ok": true, "t": "Treat <code>allowed-tools<\/code> as a turn-scoped pre-approval grant for the listed tools, and expect unlisted tools to stay callable under normal permissions.", "e": "The <code>allowed-tools<\/code> frontmatter field grants permission to use the listed tools without additional permission prompts during the invoking turn. It does not restrict the skill to only those tools, and it does not prevent unlisted tools from being used under the session's ordinary permission settings."}, {"l": "D", "ok": false, "t": "Invoke the skill once at the start of the session so its <code>allowed-tools<\/code> grant persists for every subsequent turn in that session.", "e": "The grant is turn-scoped and clears when the user sends the next message. Invoking the skill again can reapply the grant for a new turn, but the original grant does not persist throughout the session."}], "o": "<p>The key distinction is that <strong><code>allowed-tools<\/code> grants permission; it does not restrict the available toolset<\/strong>.<\/p>\n<p>If a skill lists <code>Read<\/code>, <code>Grep<\/code>, and <code>Glob<\/code>, those tools can be pre-approved during the invoking turn. Other tools—including an MCP refund tool—remain available according to the session's ordinary permission settings.<\/p>\n<p>For a financially consequential action, use a permission deny rule or another programmatic enforcement mechanism. Do not rely on skill instructions or an omitted tool name to guarantee that an action cannot occur.<\/p>", "docs": [["Claude Code — Skills", "https://code.claude.com/docs/en/skills"], ["Claude Code — Permissions", "https://code.claude.com/docs/en/permissions"]]}, {"k": "2.55", "d": "d4", "title": "Producing Consistent Citation and Finding Formats", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator delegates to specialized subagents for web search, document analysis, synthesis, and report generation. The system produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The report-generation subagent formats findings inconsistently: citations appear inline in some reports and as footnotes in others, and field order shifts between runs despite detailed formatting instructions. What most reliably produces a consistent format?<\/p>", "c": [{"l": "A", "ok": false, "t": "Set the sampling temperature to zero so the subagent renders every finding in the same deterministic layout.", "e": "Temperature affects sampling randomness; it does not teach the model which citation style or field order is required. Even with temperature set to zero, an underspecified format can be interpreted differently across different documents or contexts."}, {"l": "B", "ok": false, "t": "Add a post-processing step that uses regular expressions to detect each citation variant and rewrite it into canonical form.", "e": "Regex normalization addresses the symptoms after generation rather than correcting the source of inconsistent output. Each new citation variant may require another special-case pattern, making the pipeline fragile."}, {"l": "C", "ok": true, "t": "Add three to five realistic examples in example tags showing the exact desired finding format and citation style.", "e": "Few-shot examples demonstrate the required structure instead of leaving it open to interpretation. A small collection of realistic, relevant examples shows the model exactly how findings, field order, and citations should appear."}, {"l": "D", "ok": false, "t": "Restate the formatting rules in stronger imperative language at both the top and bottom of the subagent's prompt.", "e": "The prompt already contains detailed instructions, yet formatting remains inconsistent. Repeating the same abstract rules more forcefully does not demonstrate the desired output or resolve the ambiguity."}], "o": "<p>When detailed formatting instructions still produce inconsistent results, use <strong>few-shot prompting<\/strong>: demonstrate the exact desired output with several representative examples.<\/p>\n<p>Good examples should be:<\/p>\n<ul><li><strong>Relevant:<\/strong> They resemble the actual findings the report generator processes.<\/li><li><strong>Diverse:<\/strong> They cover realistic citation and content variations.<\/li><li><strong>Structured:<\/strong> They clearly separate examples from instructions, for example by using <code>&lt;examples&gt;<\/code> and <code>&lt;example&gt;<\/code> tags.<\/li><\/ul>\n<p>The distinction is simple: an instruction describes the target format, while an example demonstrates it. Examples reduce the interpretive gap that allows citation styles and field order to vary.<\/p>", "docs": [["Anthropic API — Prompt engineering overview", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"], ["Anthropic API — Increase output consistency", "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency"]]}, {"k": "2.56", "d": "d1", "title": "Structuring a Security-Hardening Pass on an Unfamiliar Service", "scen": "<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>", "scenLabel": "Scenario · CI/CD code review pipeline", "inline": false, "stem": "<p>A team schedules a Claude Code job to run a security-hardening pass on an unfamiliar API service where entry points, data flows, and shared dependencies are all undocumented. How should the job's prompt structure the work?<\/p>", "c": [{"l": "A", "ok": false, "t": "Restrict the pass to handlers named in past incident reports, since previously exploited code is where remaining vulnerabilities are most likely to concentrate.", "e": "Past incidents are a weak proxy for current risk in an unfamiliar service. Unexamined handlers and undocumented data flows may hide serious vulnerabilities. Restricting the pass to previously exploited areas leaves much of the attack surface unassessed."}, {"l": "B", "ok": false, "t": "Have Claude patch issues as it encounters them while reading through files, letting priorities emerge naturally from whatever code the job happens to inspect first.", "e": "Patching in encounter order skips the mapping step. Work is prioritized by reading sequence rather than exposure or impact. Early fixes may also need rework if later discoveries reveal shared dependencies that affect multiple handlers."}, {"l": "C", "ok": true, "t": "Map the service's entry points and data flows first, rank handlers by exposure and impact, then follow a prioritized plan that adapts as shared dependencies surface.", "e": "This applies adaptive decomposition, which fits open-ended tasks where the full scope is unknown at the start. Mapping entry points and data flows establishes the attack surface, ranking exposure directs effort toward the greatest risks, and an adaptive plan accommodates discoveries such as shared helpers used by multiple handlers."}, {"l": "D", "ok": false, "t": "Apply a fixed, predefined sequence of hardening steps to every module uniformly, since consistent treatment of each file guarantees nothing in the service gets missed.", "e": "A fixed pipeline is appropriate when the steps are known in advance. Here, discovering the service's structure is part of the task. Uniformly treating every module ignores differences in exposure and cannot adapt when exploration reveals a shared dependency that changes the correct order of work."}], "o": "<p>Open-ended security work calls for <strong>dynamic adaptive decomposition<\/strong>. First explore the codebase to identify entry points, handlers, data flows, and shared dependencies. Then rank the work by exposure and impact, and revise the plan as new information emerges.<\/p>\n<p>The key distinction is between predictable tasks and tasks whose scope must be discovered:<\/p>\n<ul><li><strong>Known, repeatable steps:<\/strong> A fixed pipeline or prompt chain is appropriate.<\/li><li><strong>Unfamiliar, evolving scope:<\/strong> Explore first, plan based on discoveries, and adapt as work proceeds.<\/li><\/ul>\n<p>This mirrors the explore-plan-implement workflow recommended in Claude Code best practices. Starting implementation before understanding the codebase risks solving the wrong problem or making changes that must later be revised.<\/p>", "docs": [["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "2.57", "d": "d2", "title": "Handling a Licensing Prohibition in a Research Agent", "scen": "<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>", "scenLabel": "Scenario · Multi-agent research system", "inline": false, "stem": "<p>The web-search subagent requests retrieval of a paywalled source that licensing policy prohibits, and the fetch tool rejects the call. Which error response design lets the subagent handle this refusal correctly?<\/p>", "c": [{"l": "A", "ok": false, "t": "Set <code>errorCategory<\/code> to <code>validation<\/code> and <code>retriable<\/code> to <code>true<\/code>, so the subagent adjusts the request parameters and retries the fetch.", "e": "This mislabels a policy refusal as a fixable input problem. No reformulation of the request will make a prohibited source permissible. Setting <code>retriable<\/code> to <code>true<\/code> encourages futile retry loops."}, {"l": "B", "ok": true, "t": "Set <code>errorCategory<\/code> to <code>business<\/code> and <code>retriable<\/code> to <code>false<\/code>, with a plain-language note explaining the licensing restriction.", "e": "A policy prohibition is a business error: the request may be well formed and the service healthy, but a rule prevents the operation. Marking it non-retriable prevents wasted attempts, while a plain-language explanation lets the subagent tell the coordinator why the source was excluded."}, {"l": "C", "ok": false, "t": "Return a successful result with an empty document body so the research workflow continues without any interruption.", "e": "This silently suppresses the failure. The subagent cannot distinguish a licensing refusal from a genuinely empty source, potentially causing the final report to omit an important coverage gap or imply that retrieval succeeded."}, {"l": "D", "ok": false, "t": "Return the compliance engine's raw rejection payload with internal rule identifiers so no policy detail is lost.", "e": "Internal rule identifiers and raw payloads are not the information the agent needs to make its next decision. Error responses should explain what happened and what action is appropriate, without exposing unnecessary backend details."}], "o": "<p>Structured error metadata helps an agent choose the right recovery action:<\/p>\n<ul><li><strong>Transient error:<\/strong> Retry with backoff.<\/li><li><strong>Validation error:<\/strong> Correct the input and retry.<\/li><li><strong>Business error:<\/strong> Explain the restriction and do not retry.<\/li><li><strong>Permission error:<\/strong> Follow the appropriate authorization or escalation process.<\/li><\/ul>\n<p>A licensing prohibition is a business error because the operation is disallowed by policy rather than failing due to a temporary service problem or malformed request.<\/p>\n<p>In the Messages API, tool failures can be signaled with <code>is_error: true<\/code> on a <code>tool_result<\/code> block. MCP-style tool results use <code>isError<\/code>. Fields such as <code>errorCategory<\/code> and <code>retriable<\/code> are application-level metadata, not protocol-defined fields; the application can include them in the error content for the model to interpret.<\/p>", "docs": [["Anthropic API — How to handle tool calls", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"]]}, {"k": "2.58", "d": "d1", "title": "Fixing Incomplete Task Decomposition in a Support Coordinator", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom Model Context Protocol (MCP) tools: <code>get_customer<\/code>, <code>lookup_order<\/code>, <code>process_refund<\/code>, and <code>escalate_to_human<\/code>. Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>You add a coordinator that delegates support subtasks to specialized subagents. A customer reports a duplicate charge, a missing loyalty discount, and unwanted auto-renewal. Logs show the coordinator spawned two subtasks, both addressing the duplicate charge; all subagents succeeded, yet the reply ignores the other issues. Which change most effectively fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Restructure the synthesis input so findings for each concern appear at the start of the aggregated context with explicit section headings.", "e": "Position-aware input can help when a model overlooks evidence buried in a long context, but it cannot fix findings that were never produced. No subagent investigated the discount or cancellation, so there are no findings for synthesis to reorder."}, {"l": "B", "ok": false, "t": "Pass the coordinator's full conversation history into each subagent's prompt so workers can see all of the customer's stated concerns.", "e": "Context isolation is real, but it is not the failure here. Subagents are expected to handle their assigned work. The discount and cancellation were never delegated as subtasks, so passing more conversation history does not ensure they will be addressed."}, {"l": "C", "ok": false, "t": "Rewrite overlapping tool descriptions so discount and cancellation subtasks are routed to subagents capable of handling them.", "e": "This assumes the subtasks were created but routed incorrectly. The logs show that both subtasks targeted the duplicate charge. Clarifying tool descriptions cannot restore work that was never delegated."}, {"l": "D", "ok": true, "t": "Revise the coordinator's decomposition instructions so it enumerates every stated concern and delegates one bounded subtask per concern.", "e": "The coordinator failed to cover the full scope of the customer's request. Explicitly enumerating each concern before delegation helps ensure the duplicate charge, missing discount, and unwanted auto-renewal are all assigned for investigation."}], "o": "<p>In a hub-and-spoke, or orchestrator-workers, architecture, the coordinator owns task decomposition. It reads the request, divides it into subtasks, delegates the work, and synthesizes the results.<\/p>\n<p>The decomposition stage sets the ceiling for what the system can cover. If a concern is never turned into a subtask, downstream execution and synthesis cannot recover it.<\/p>\n<p>The diagnostic clue is that every subagent succeeded, yet the response is incomplete. That points to a coordination problem rather than an execution failure.<\/p>\n<p>The fix is to require the coordinator to enumerate all concerns and delegate a distinct, bounded task for each. Each delegation should include a clear objective, output format, and task boundary.<\/p>", "docs": [["Anthropic — How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system"], ["Anthropic — Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents"]]}, {"k": "2.59", "d": "d4", "title": "Retrying Structured Extraction with Specific Validation Feedback", "scen": "<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to backend systems through custom MCP tools, including <code>process_refund<\/code>.<\/p>", "scenLabel": "Scenario · Customer support resolution agent", "inline": false, "stem": "<p>Before calling <code>process_refund<\/code>, the agent produces a structured dispute record. Validation fails: <code>refund_amount<\/code> is 85.00 but the extracted disputed line items sum to 70.00, and <code>order_date<\/code> is not ISO 8601. What should the retry request contain?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resubmit the original prompt unchanged, relying on regeneration to produce a valid record.", "e": "Resubmitting without feedback is effectively another attempt at the same task. The model receives no signal about what failed, so the same arithmetic and formatting mistakes may recur."}, {"l": "B", "ok": false, "t": "Resubmit the original prompt with a general reminder appended to double-check amounts and date formats.", "e": "A general reminder is vague. It does not identify the conflicting refund amount or specify which date field violates the required format. Concrete validation errors make the retry targeted."}, {"l": "C", "ok": true, "t": "Include the source conversation and order data, the failed record, and the two specific validation errors.", "e": "The model receives the source material needed to re-derive the correct values, the record that needs correction, and the exact reasons validation failed. This enables a targeted revision rather than blind regeneration."}, {"l": "D", "ok": false, "t": "Send only the two validation errors plus a firmer instruction to comply, omitting the failed record and source data.", "e": "The errors alone do not provide enough context. Without the failed record, the model cannot see which values it needs to revise; without the source data, it cannot re-ground the refund amount or line items. Firmer wording does not replace the missing information."}], "o": "<p>A reliable structured-output retry loop consists of generation, validation, and targeted correction.<\/p>\n<p>When validation fails, include three elements in the retry:<\/p>\n<ol><li><strong>Source material:<\/strong> The conversation and order data needed to derive correct values.<\/li><li><strong>Failed output:<\/strong> The record that must be revised.<\/li><li><strong>Specific validation feedback:<\/strong> The exact errors, such as the mismatch between the refund amount and line-item total, and the required ISO 8601 date format.<\/li><\/ol>\n<p>A retry without feedback is just resampling; it does not systematically reduce the chance of repeating the same error. In contrast, concrete error messages give the model an actionable correction target.<\/p>\n<p>For financially consequential operations, validate arithmetic and business rules programmatically before invoking a refund tool. For example, a system can compare the stated refund amount against a separately calculated sum and flag discrepancies for correction.<\/p>", "docs": [["Anthropic API — Tool use overview", "https://platform.claude.com/docs/en/agents-and-tools/tool-use
