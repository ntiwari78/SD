i>Publication dates → distinguish temporal change from contradiction.<\/li><li>Do not discard older statistics when the trend matters.<\/li><li>Do not suppress genuine conflicts with blanket prompt instructions.<\/li><li>Structured fields preserve context more reliably than prose-only handoffs.<\/li><\/ul>", "docs": [["Anthropic — Prompt engineering overview", "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"], ["Claude Agent SDK — Subagents", "https://docs.anthropic.com/en/docs/claude-code/sub-agents"]]}, {"k": "4.3", "d": "d1", "title": "Resuming a Named Claude Code Session", "scen": "<p>A team runs overnight research jobs using <code>claude -p<\/code> and the <code>--no-session-persistence<\/code> flag to prevent transcripts from being saved to disk.<\/p>\n<p>An engineer wants to reopen a specific run the following morning using <code>--resume<\/code> with a name.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change to the launch command enables this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run <code>claude --continue<\/code> the next morning in the same directory to reopen the most recent conversation.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> <code>--continue<\/code> targets the most recent conversation in the directory rather than a specific named run.<\/li><li><strong>Critical limitation:<\/strong> The original run was launched without session persistence, so there is no saved transcript to reopen.<\/li><\/ul>"}, {"l": "B", "ok": false, "t": "Capture the session ID from the run's JSON output and resume using that ID, because headless runs cannot be resumed by name.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Headless runs can be resumed by name when the session is saved and appropriately named.<\/li><li><strong>Critical limitation:<\/strong> Capturing an ID does not restore a transcript that was never persisted.<\/li><\/ul>"}, {"l": "C", "ok": true, "t": "Remove <code>--no-session-persistence<\/code> and add <code>--name<\/code> with a run label to each launch.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> Resuming by name requires a saved session and a name associated with that session. Removing the persistence-disabling flag allows the transcript to be saved; adding <code>--name<\/code> provides the label used to identify the run later.<\/li><li><strong>Result:<\/strong> The next morning, the engineer can target the specific saved session by name.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Add <code>--name<\/code> with an investigation label but keep <code>--no-session-persistence<\/code>.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Naming a session does not save its transcript. The run remains unavailable for resumption because session persistence is disabled.<\/li><li><strong>Key distinction:<\/strong> A session name identifies a saved session; it cannot substitute for the saved session itself.<\/li><\/ul>"}], "o": "<p>Session resumption depends on persisted conversation data. Claude Code normally saves session transcripts, allowing the CLI to reopen a conversation by session ID or name.<\/p>\n<p>The <code>--no-session-persistence<\/code> flag disables that saving behavior. Consequently, none of the resume mechanisms can recover a transcript that was not written to disk.<\/p>\n<p>For a named overnight run, the correct design is to:<\/p>\n<ol><li>Enable session persistence by removing <code>--no-session-persistence<\/code>.<\/li><li>Assign a distinct label with <code>--name<\/code>.<\/li><li>Resume that specific session using <code>--resume<\/code> and its name.<\/li><\/ol>\n<p>The alternatives fail because they either target the wrong session, assume a missing transcript can be recovered, or name a session without saving it.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li><code>--name<\/code> → labels a session.<\/li><li><code>--resume<\/code> → reopens a saved session.<\/li><li><code>--no-session-persistence<\/code> → prevents the transcript from being saved.<\/li><li><code>--continue<\/code> → targets the most recent conversation, not necessarily the desired run.<\/li><li>Always check whether session persistence is enabled before designing a resume workflow.<\/li><\/ul>", "docs": [["Claude Code — CLI reference", "https://code.claude.com/docs/en/cli-reference"], ["Claude Code — Headless mode", "https://code.claude.com/docs/en/headless"]]}, {"k": "4.4", "d": "d1", "title": "Enforcing Domain Restrictions Across Tools", "scen": "<p>Licensing terms prohibit retrieving content from certain publisher domains. A <code>PreToolUse<\/code> hook matching <code>WebFetch<\/code> denies requests to those domains, but a search subagent can still download the same pages by running <code>curl<\/code> through <code>Bash<\/code>.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change enforces the licensing policy?<\/p>", "c": [{"l": "A", "ok": false, "t": "Change the <code>WebFetch<\/code> hook's <code>permissionDecision<\/code> from <code>deny<\/code> to <code>ask<\/code>, allowing a human to review each restricted-domain fetch.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> The hook still matches only <code>WebFetch<\/code>, not <code>Bash<\/code>. The <code>curl<\/code> command bypasses the hook entirely.<\/li><li><strong>Key distinction:<\/strong> Changing the decision on an existing hook does not extend its coverage to another tool.<\/li><\/ul>"}, {"l": "B", "ok": true, "t": "Register the deny hook for the <code>Bash<\/code> tool as well, inspecting commands for restricted domains before execution.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> The policy violation occurs through a different tool surface. Adding a <code>Bash<\/code> matcher allows the pre-execution hook to inspect shell commands that could retrieve restricted content.<\/li><li><strong>Why timing matters:<\/strong> <code>PreToolUse<\/code> runs before the action, allowing the system to block the prohibited retrieval rather than merely hide its output afterward.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Add the restricted-domain list to the search subagent's system prompt and instruct it never to access those domains.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> A system prompt provides behavioral guidance but does not deterministically prevent a tool call.<\/li><li><strong>Security principle:<\/strong> Rules with contractual or compliance consequences should be enforced at the tool-execution boundary.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Add a <code>PostToolUse<\/code> hook on <code>Bash<\/code> that removes restricted-domain content from the output.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> A post-execution hook runs after the command has executed. By then, the prohibited content has already been retrieved.<\/li><li><strong>When post-processing helps:<\/strong> Redaction or normalization after execution can be useful when retrieval itself is permitted, but it cannot prevent a prohibited retrieval.<\/li><\/ul>"}], "o": "<p>A hook matcher determines which tool calls trigger the hook. A hook matching <code>WebFetch<\/code> does not automatically cover <code>Bash<\/code>, even when both tools can access the same website.<\/p>\n<p>To enforce a domain restriction, the policy must cover all relevant execution paths. Here, the existing <code>WebFetch<\/code> hook should remain, and the deny logic should also cover <code>Bash<\/code> commands that could use <code>curl<\/code> or another command-line downloader to retrieve restricted pages.<\/p>\n<p>The distinction between pre- and post-execution enforcement is essential:<\/p>\n<ul><li><strong><code>PreToolUse<\/code>:<\/strong> Intercepts the call before it executes.<\/li><li><strong><code>PostToolUse<\/code>:<\/strong> Runs after tool execution and can process the resulting output, but cannot undo the retrieval.<\/li><\/ul>\n<p>A prompt-only rule is insufficient when the policy must hold consistently.<\/p>\n<p><strong>Implementation note:<\/strong> A robust Bash policy should inspect or constrain the actual command execution path rather than relying only on a simple substring match. Shell commands can be composed in ways that evade naïve text matching, so strict licensing enforcement may also require sandboxing, network-level domain restrictions, or a controlled fetch proxy.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Hook matchers define the scope of enforcement.<\/li><li><code>WebFetch<\/code> and <code>Bash<\/code> are separate tool paths.<\/li><li><code>PreToolUse<\/code> is appropriate for blocking prohibited actions.<\/li><li><code>PostToolUse<\/code> is too late to prevent retrieval.<\/li><li>Prompt instructions are not a substitute for deterministic enforcement.<\/li><\/ul>", "docs": [["Claude Agent SDK — Hooks", "https://docs.anthropic.com/en/docs/claude-code/hooks"], ["Claude Code — Permissions", "https://code.claude.com/docs/en/permissions"]]}, {"k": "4.5", "d": "d1", "title": "Targeted Follow-Up Analysis of Revised Documents", "scen": "<p>A document-analysis pipeline runs headlessly using <code>claude -p<\/code>. After its first analysis run, several unrelated headless sessions are started in the same project directory, and three source documents are revised.<\/p>\n<p>The pipeline needs to perform a targeted follow-up analysis of those revised documents while preserving the original analysis context.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the script run the follow-up?<\/p>", "c": [{"l": "A", "ok": false, "t": "Resume the saved analysis session using <code>claude -p --resume<\/code> and ask Claude to continue synthesis, without naming the revised documents.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Resuming restores the previous conversation and tool results, but it does not guarantee that revised files will be read again from disk.<\/li><li><strong>Risk:<\/strong> Claude may continue using stale document contents captured during the first run.<\/li><\/ul>"}, {"l": "B", "ok": true, "t": "Capture the <code>session_id<\/code> from the first run's JSON output, resume that exact session by ID, and name the three revised documents for Claude to re-read.", "e": "<span class=\"tag\">Correct<\/span><ul><li><strong>Why it is correct:<\/strong> The session ID identifies the intended analysis session, even when other sessions have subsequently run in the same directory. Explicitly naming the changed documents tells Claude which sources must be refreshed before continuing.<\/li><li><strong>Benefit:<\/strong> The pipeline retains the useful prior analysis while focusing additional work on the files that changed.<\/li><\/ul>"}, {"l": "C", "ok": false, "t": "Run <code>claude --continue -p<\/code> with a prompt naming the revised documents, since <code>--continue<\/code> reopens the most recent session in the directory.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> Several unrelated sessions have been started since the original analysis. <code>--continue<\/code> may therefore select the wrong conversation.<\/li><li><strong>Better approach:<\/strong> Use the original session's ID to target the correct analysis run.<\/li><\/ul>"}, {"l": "D", "ok": false, "t": "Start a fresh <code>claude -p<\/code> run and re-read the entire document corpus.", "e": "<span class=\"tag\">Incorrect<\/span><ul><li><strong>Why it is incorrect:<\/strong> This discards the opportunity to reuse the existing analysis and repeats work on documents that have not changed.<\/li><li><strong>When a fresh run may be appropriate:<\/strong> If the prior session is unavailable, corrupted, or no longer suitable for the task, a new run may be necessary. Those conditions are not stated here.<\/li><\/ul>"}], "o": "<p>The workflow has two distinct requirements:<\/p>\n<ol><li><strong>Resume the correct conversation.<\/strong> Use the <code>session_id<\/code> returned by the initial headless run. This avoids accidentally continuing one of the unrelated sessions created afterward.<\/li><li><strong>Refresh the changed sources.<\/strong> Explicitly tell Claude to re-read the three revised documents before continuing the analysis.<\/li><\/ol>\n<p>Resuming a session restores conversational context, not a guarantee that every earlier tool result will be refreshed against the current filesystem. A previous <code>Read<\/code> result may still describe the older version of a document.<\/p>\n<p>The targeted approach is therefore more efficient and reliable than either blindly continuing the latest session or restarting the entire corpus analysis.<\/p>\n<h4>Quick revision<\/h4>\n<ul><li>Capture the original <code>session_id<\/code> when running headless automation.<\/li><li>Use <code>--resume<\/code> with that ID to target the intended session.<\/li><li><code>--continue<\/code> is not reliable when multiple sessions have run in the same directory.<\/li><li>Name revised files explicitly and instruct Claude to re-read them.<\/li><li>Resuming preserves context; it does not automatically refresh stale file contents.<\/li><\/ul>", "docs": [["Claude Code — Headless mode", "https://code.claude.com/docs/en/headless"], ["Claude Code — CLI reference", "https://code.claude.com/docs/en/cli-reference"], ["Claude Code — Best practices", "https://code.claude.com/docs/en/best-practices"]]}, {"k": "4.6", "d": "d1", "title": "Correctly Ordering Tool Results in the Messages API", "scen": "<p>A multi-agent research system uses a manual tool loop. The search subagent returns a single user message containing guidance text followed by <code>tool_result<\/code> blocks. The API rejects the request with an invalid tool-result ordering error. The loop must also log every tool call before execution.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What is the correct fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Split the reply so each <code>tool_result<\/code> block goes in its own user message.", "e": "The documented pattern is to return all results for a single assistant tool-use turn together in one user message. Splitting the results across messages does not fix the underlying ordering error."}, {"l": "B", "ok": false, "t": "Rewrite the <code>tool_use_id<\/code> values so results follow the order in which tools finished.", "e": "Each result must retain the <code>tool_use_id<\/code> of its original tool call. These identifiers establish the pairing between requests and results; changing them breaks that association."}, {"l": "C", "ok": false, "t": "Replace the manual loop with the SDK Tool Runner.", "e": "Not the best answer for this scenario. The Tool Runner can manage tool execution and result formatting automatically, but the system specifically requires logging each tool call before it runs. A manual loop preserves this level of control."}, {"l": "D", "ok": true, "t": "Move all <code>tool_result<\/code> blocks before any text in the user message.", "e": "The results must immediately follow the assistant's tool-use turn, with all <code>tool_result<\/code> blocks preceding ordinary text in the user message. This fixes the message structure while preserving the custom logging requirement."}], "o": "<p>When using client-side tools, the application is responsible for completing the tool-use cycle correctly. Claude issues tool calls, the application executes them, and the results must be returned using the identifiers and message structure the API expects.<\/p>\n<p>The critical detail is that <strong>the result blocks must come before ordinary text<\/strong> in the response message. Adding guidance text before them violates the expected ordering.<\/p>\n<p>The alternatives fail for different reasons: splitting results changes the documented response pattern, changing IDs breaks request-result matching, and switching to the Tool Runner sacrifices the explicit control the application needs for pre-execution logging.<\/p>\n<p><strong>Key takeaway:<\/strong> Fix the message structure rather than changing tool IDs or abandoning a manual loop that provides necessary control.<\/p>", "docs": []}, {"k": "4.7", "d": "d1", "title": "Preventing Infinite Refinement Loops", "scen": "<p>A coordinator agent delegates research to specialized subagents and repeatedly evaluates report coverage. For some topics, a subtopic has no published sources. The coordinator repeatedly delegates the same gap query, and the run never finishes.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Rewrite each gap query more broadly on every round and continue until coverage is complete.", "e": "Broader queries can help when the original query is poorly phrased. They cannot solve a gap caused by the genuine absence of published sources. The loop remains unbounded."}, {"l": "B", "ok": true, "t": "Cap retries per gap and annotate the coverage limitation in the final report.", "e": "A retry limit gives the system a guaranteed exit. An explicit annotation preserves transparency about what could not be established, without preventing the rest of the report from being completed."}, {"l": "C", "ok": false, "t": "Raise <code>maxTurns<\/code> in the search subagent's <code>AgentDefinition<\/code>.", "e": "<code>maxTurns<\/code> controls the number of tool-use rounds within an individual subagent run. Increasing it does not fix the coordinator's unbounded retry loop or create sources that do not exist."}, {"l": "D", "ok": false, "t": "Relax the coverage criteria so a report with an unfilled subtopic passes automatically.", "e": "This lowers the standard for all reports, including topics where another targeted search could have filled the gap. It also risks concealing the limitation from readers."}], "o": "<p>A refinement loop needs both a success condition and a failure path. If it continues until every gap is filled, it can run forever when a gap is genuinely unfillable.<\/p>\n<p>Repeated delegations also cost time and tokens. Each new subagent may repeat searches without retaining the previous subagent's working context.<\/p>\n<p>The robust design is to use <strong>bounded retries and graceful degradation<\/strong>. After a defined number of attempts, the system completes the report and clearly identifies the unavailable evidence.<\/p>\n<p>This preserves quality better than either endlessly repeating searches or silently lowering the coverage standard.<\/p>\n<p><strong>Key takeaway:<\/strong> Every iterative agent workflow needs a bounded stopping rule and an honest way to report unresolved gaps.<\/p>", "docs": []}, {"k": "4.8", "d": "d1", "title": "Choosing Direct Grep Calls Instead of Subagents", "scen": "<p>Before a refactor, the coordinator must locate every call site of five exported functions and record exact locations. It currently launches one search subagent per function, but the runs are slow and return vague summaries.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Merge the five searches into one subagent and request a combined summary.", "e": "This reduces the number of subagents but still relies on a summary. The requirement is to identify every call site with exact locations, not merely describe where functions appear."}, {"l": "B", "ok": true, "t": "Run one Grep query per function directly in the coordinator.", "e": "Grep searches file contents and can provide the raw match information needed for the refactor. These straightforward searches do not justify the extra delegation overhead."}, {"l": "C", "ok": false, "t": "Keep one subagent per function but require structured file paths and line numbers.", "e": "Structured output could improve precision, but it does not eliminate the cost of running five separate subagents. Direct Grep calls are simpler and faster for these small searches."}, {"l": "D", "ok": false, "t": "Run one Glob query per exported function.", "e": "Glob matches file paths against patterns; it does not search the contents of files for function calls. Grep is the appropriate tool for finding call sites inside source files."}], "o": "<p>Subagents are useful when work is substantial, independent, or likely to overwhelm the main conversation with verbose exploration. They are not automatically the best choice for every search.<\/p>\n<p>Delegation introduces overhead: each subagent runs in its own context, consumes tokens, and typically returns a summary rather than every raw result.<\/p>\n<p>Here, the work consists of five small, precise content searches. Running Grep directly lets the coordinator retain the exact matches and locations needed for the refactor.<\/p>\n<p><strong>Key takeaway:<\/strong> Use direct tools for short, precise searches when you need their raw output. Delegate when the work benefits meaningfully from isolation or parallel investigation.<\/p>", "docs": []}, {"k": "4.9", "d": "d5", "title": "Freeing Context While Preserving Decisions", "scen": "<p>A Claude Code session debugging a synthesis subagent's citation logic has nearly filled its context window. The next task involves changing report-generator code that depends on decisions made during that debugging session.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which command best fits this situation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Increase the <code>autoCompactWindow<\/code> setting.", "e": "This setting adjusts when automatic compaction occurs. Increasing it does not free space in a context window that is already nearly full."}, {"l": "B", "ok": false, "t": "Run <code>/clear<\/code>.", "e": "<code>/clear<\/code> starts a fresh conversation. That is useful for unrelated tasks, but here the next task depends on decisions from the current conversation."}, {"l": "C", "ok": true, "t": "Run <code>/compact<\/code>.", "e": "<code>/compact<\/code> condenses the conversation history to free context while retaining a summary of important decisions. The same session can then continue with the related task."}, {"l": "D", "ok": false, "t": "Run <code>/rewind<\/code> to a checkpoint before the verbose debugging output.", "e": "Rewinding rolls back the conversation to an earlier checkpoint and can discard the debugging conclusions needed for the next task."}], "o": "<p>The deciding factor is whether the next task depends on the existing context.<\/p>\n<ul><li><strong><code>/compact<\/code><\/strong> reduces the context used by the conversation while preserving a summarized record of the important work.<\/li><li><strong><code>/clear<\/code><\/strong> removes the active conversation context and is more appropriate when moving to an unrelated task.<\/li><li><strong><code>/rewind<\/code><\/strong> is for backing out of a previous direction, not for safely compressing a conversation whose conclusions remain useful.<\/li><li><strong><code>autoCompactWindow<\/code><\/strong> affects when automatic compaction is triggered rather than increasing the model's fixed context capacity.<\/li><\/ul>\n<p>Compaction is particularly useful after lengthy debugging sessions, where the decisions and conclusions matter more than retaining every verbose intermediate output. Optional focus instructions can help preserve the details that the next phase requires.<\/p>\n<p><strong>Key takeaway:<\/strong> When the next task depends on the current conversation, compact it rather than clearing or rewinding it.<\/p>", "docs": []}, {"k": "4.10", "d": "d1", "title": "Maintaining Explicit Handoffs Between Subagents", "scen": "<p>A multi-agent research system has a coordinator and specialized subagents for web search, document analysis, synthesis, and report generation. Subagents operate with isolated contexts. The system must preserve coordinator visibility into the information passed between agents and handle subagent failures without unnecessarily terminating the entire run.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which approach meets these requirements?<\/p>", "c": [{"l": "A", "ok": false, "t": "Assume the synthesis subagent can access the search subagent's conversation history.", "e": "Each subagent has an isolated context. Findings must be included explicitly in the downstream subagent's input."}, {"l": "B", "ok": false, "t": "Enable agent teams so the subagents can communicate directly.", "e": "Not appropriate when the architecture requires a single coordinator to maintain visibility over all handoffs. Agent teams are a separate mode that permits direct inter-agent communication and changes that centralized control model."}, {"l": "C", "ok": false, "t": "Have the subagents write findings to a shared file and read them independently.", "e": "This can transfer information, but it creates a side channel. Findings may move between subagents without the coordinator explicitly observing or controlling the handoff, which undermines the stated visibility requirement."}, {"l": "D", "ok": true, "t": "Make the coordinator explicitly pass findings to downstream agents and handle returned outcomes.", "e": "The coordinator should include relevant findings in the next subagent's input and inspect the result returned. If a subagent times out or fails, the coordinator can decide whether to retry, delegate elsewhere, or continue with partial findings and annotate the limitation."}], "o": "<h4>Core concept<\/h4>\n<p><strong>The coordinator must explicitly pass findings into downstream subagents and handle their returned results or failures centrally.<\/strong><\/p>\n<h4>Explanation<\/h4>\n<p>Subagents do not automatically share their conversation histories or intermediate findings with one another. The coordinator is responsible for passing relevant information across each delegation boundary.<\/p>\n<p>For example, if a web-search subagent discovers important evidence, that evidence does not automatically become available to the synthesis subagent. The coordinator must include the search findings in the synthesis subagent's prompt or input.<\/p>\n<p>This explicit handoff allows the coordinator to preserve attribution, track the information being used, and decide what happens when a subagent fails.<\/p>\n<h4>Overall explanation<\/h4>\n<p>The coordinator acts as the control and information-flow hub. Each subagent receives a task and the context supplied to it, then returns its result to the coordinator. This architecture makes information transfer explicit rather than automatic.<\/p>\n<p>The coordinator also has the broadest view of the run. A timeout in one subagent should therefore be treated as a recoverable outcome when possible, not as an automatic reason to abort all research.<\/p>\n<p>Depending on the failure, the coordinator can retry the task, redirect it, or finalize the report with a clear statement about the missing evidence.<\/p>\n<p><strong>Key takeaway:<\/strong> In a coordinator-based multi-agent architecture, make handoffs explicit and keep failure recovery at the coordinator level.<\/p>", "docs": []}, {"k": "4.11", "d": "d2", "title": "Restricting Tools to Each Subagent’s Role", "scen": "<p>A research system has four specialized subagents, each receiving the same catalog of 16 tools. The team has already improved the tool descriptions with clear instructions about their intended boundaries, but the synthesis agent still calls web-search tools.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change most reliably stops this misuse?<\/p>", "c": [{"l": "A", "ok": false, "t": "Expand every tool description with more examples of which subagent should use it.", "e": "Better descriptions are usually a strong first step because they help the model select the appropriate tool. However, the descriptions already contain clear boundary language and the misuse continues. Adding more examples does not reduce the number of tools available to the synthesis agent."}, {"l": "B", "ok": false, "t": "Configure <code>allowedTools<\/code> in the permission settings.", "e": "According to the source, <code>allowedTools<\/code> controls which tool calls are automatically approved; it does not determine which tools the agent can see. Tools outside the allowlist can still be selected and may trigger permission handling."}, {"l": "C", "ok": false, "t": "Add a system-prompt rule telling each subagent to ignore tools outside its role.", "e": "Prompt instructions influence behavior, but they do not remove tools from the available set. The agent can still select an inappropriate tool."}, {"l": "D", "ok": true, "t": "Set the <code>tools<\/code> field in each subagent’s <code>AgentDefinition<\/code> to its role-specific tools.", "e": "The <code>tools<\/code> field limits the subagent to the tools explicitly listed. Tools excluded from its definition are unavailable in that session, making misuse structurally impossible rather than merely discouraged."}], "o": "<p>This question tests the difference between <strong>behavioral guidance and architectural constraints<\/strong>.<\/p>\n<p>Tool descriptions and system prompts influence what the model chooses. Tool configuration determines what the model can choose from in the first place.<\/p>\n<p>When a synthesis agent sees 16 tools, including web-search tools that do not belong to its role, it must repeatedly make the correct selection among unnecessary options. Restricting its tool set reduces this decision complexity and prevents it from calling tools it should never use.<\/p>\n<p>Remember the distinction:<\/p>\n<ul><li><code>tools<\/code> controls which tools are available.<\/li><li><code>allowedTools<\/code> controls permission behavior and automatic approval.<\/li><li>Tool descriptions help the model decide when an available tool is appropriate.<\/li><li>System prompts provide behavioral instructions but do not enforce tool availability.<\/li><\/ul>\n<p><strong>Key takeaway:<\/strong> When unwanted tool use persists despite clear descriptions and prompts, restrict the agent’s actual tool set.<\/p>", "docs": []}, {"k": "4.12", "d": "d2", "title": "Fixing Exact-String Edit Failures", "scen": "<p>A report generator needs to rename a citation tag everywhere in <code>findings.md<\/code>. The <code>Edit<\/code> call fails because the tag occurs 14 times. A second <code>Edit<\/code> call reports no match even though the target text appears to be present.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO actions fix these failures? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Add surrounding context to <code>old_string<\/code> so it identifies exactly one occurrence.", "e": "Incorrect for the requested global rename. Adding context is a valid way to resolve an ambiguous match when only one occurrence should change. Here, the tag must change everywhere, so a unique-context edit would update only one occurrence and leave the other 13 unchanged."}, {"l": "B", "ok": true, "t": "Read the file and copy the exact target text, including indentation, into <code>old_string<\/code>.", "e": "<code>Edit<\/code> uses literal string matching. Differences in whitespace, indentation, or other characters can cause a no-match error even when the text looks similar. Copying the exact text from the file avoids this problem."}, {"l": "C", "ok": true, "t": "Keep the same <code>old_string<\/code> and set <code>replace_all: true<\/code>.", "e": "By default, <code>Edit<\/code> expects <code>old_string<\/code> to match a unique location. The <code>replace_all: true<\/code> option allows the same replacement to be applied to every matching occurrence, which is precisely what a global citation-tag rename requires."}, {"l": "D", "ok": false, "t": "Rewrite <code>old_string<\/code> as a regular expression to tolerate whitespace differences.", "e": "The <code>Edit<\/code> tool does not interpret <code>old_string<\/code> as a regular expression. It searches for the literal text supplied, so a regex pattern will not provide regex-based matching."}], "o": "<p>The <code>Edit<\/code> tool is designed around exact, predictable string replacement. Two separate issues are being tested.<\/p>\n<p><strong>Problem 1: Multiple matches.<\/strong> The target appears 14 times, and the requested change applies to all 14. Use <code>replace_all: true<\/code>. Adding unique context would solve the ambiguity only by narrowing the edit to one occurrence.<\/p>\n<p><strong>Problem 2: No match.<\/strong> The target looks present, but the supplied string does not match it exactly. Read the file and copy the target verbatim, preserving indentation and whitespace.<\/p>\n<p>If a change cannot be safely performed with a targeted edit, reading the file and rewriting the modified content is a heavier fallback. But it is unnecessary for these two cases.<\/p>\n<p><strong>Key takeaway:<\/strong> Use <code>replace_all: true<\/code> for an intentional global replacement, and use the exact file text for literal matching.<\/p>", "docs": []}, {"k": "4.13", "d": "d2", "title": "Resolving Ambiguous Document Searches", "scen": "<p>Users request research reports by title. A document-search tool often returns multiple matches that differ only by publisher or edition. Those distinguishing details are known only to the requester. The agent chooses the most recently added document and sometimes analyzes the wrong report.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What is the most reliable fix?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add few-shot examples showing which document to choose for common ambiguous titles.", "e": "Examples can teach selection patterns, but the correct choice here depends on the requester's intent. When multiple documents share a title, examples cannot reliably reveal which edition the requester means."}, {"l": "B", "ok": false, "t": "Rank the matches and return only the single most likely document.", "e": "This moves the guess from the agent into the search tool. If the available metadata cannot identify the intended edition, ranking cannot reliably resolve the ambiguity. Hiding alternative matches may make the error less visible."}, {"l": "C", "ok": true, "t": "Ask the requester for a distinguishing detail whenever multiple matches are returned.", "e": "The requester knows which document they intended. Asking for the publisher or edition provides the missing information and avoids analyzing or citing the wrong report."}, {"l": "D", "ok": false, "t": "Have the agent rate its confidence in each candidate and proceed above a threshold.", "e": "Self-rated confidence does not establish that the chosen document is correct. The model may be confidently wrong when the available evidence does not identify the intended document."}], "o": "<p>The core issue is <strong>missing information about user intent<\/strong>, not poor ranking.<\/p>\n<p>The agent has several plausible documents, but the title alone does not uniquely identify the desired one. No prompt example or ranking heuristic can reliably recover a preference that the requester has not supplied.<\/p>\n<p>The appropriate workflow is:<\/p>\n<ol><li>Search using the title.<\/li><li>If there is only one valid match, proceed.<\/li><li>If there are multiple plausible matches, present their distinguishing details.<\/li><li>Ask the requester to choose before analyzing the document.<\/li><\/ol>\n<p>An extra clarification turn is a small cost compared with producing a report based on the wrong edition.<\/p>\n<p><strong>Key takeaway:<\/strong> When the user is the only source of the missing disambiguating information, ask rather than guess.<\/p>", "docs": []}, {"k": "4.14", "d": "d2", "title": "Handling Transient Failures Without Losing Search Progress", "scen": "<p>A web-search subagent experiences intermittent connection timeouts. Logs show that most timeouts succeed after a quick retry. Currently, every timeout is sent to the coordinator, which delegates the search again from scratch.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What is the correct division of error handling?<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep retrying inside the subagent until the call succeeds.", "e": "Unbounded retries can stall the entire workflow during a persistent outage. The subagent needs a retry limit and a way to report failure when recovery does not work."}, {"l": "B", "ok": true, "t": "Retry inside the subagent with backoff, then report unresolved failures with structured context.", "e": "The failures are usually transient, so local retries preserve progress and avoid unnecessary coordinator involvement. If retries are exhausted, the subagent should report the failure type, attempted queries, and partial results."}, {"l": "C", "ok": false, "t": "Return whatever results have been gathered so far as a successful result.", "e": "This silently hides the failure. The coordinator cannot distinguish a complete search from a truncated one, which risks treating incomplete evidence as complete."}, {"l": "D", "ok": false, "t": "Immediately report every timeout to the coordinator, including the query and partial results.", "e": "Incorrect in this scenario. Centralized recovery may sound reasonable, but most timeouts resolve quickly on retry. Escalating every timeout wastes coordinator turns and causes repeated work because a newly delegated subagent starts with fresh context."}], "o": "<p>The principle is <strong>local recovery first, escalation second<\/strong>.<\/p>\n<p>A subagent should handle failures it can reasonably resolve itself. For transient timeouts, a bounded retry strategy with backoff is appropriate. If the operation still fails, the subagent should return structured failure information so the coordinator can decide what to do next.<\/p>\n<p>The coordinator may then:<\/p>\n<ul><li>Retry with a modified query.<\/li><li>Use another search source.<\/li><li>Continue with partial findings and explicitly document the coverage gap.<\/li><\/ul>\n<p>Do not confuse a timeout with a legitimate search that returned zero matches. A timeout means the search did not complete; zero matches can be a valid result.<\/p>\n<p><strong>Key takeaway:<\/strong> Retry transient failures locally, but never hide unresolved failures or mislabel partial results as complete.<\/p>", "docs": []}, {"k": "4.15", "d": "d2", "title": "Preventing a Report Generator from Searching Instead of Citing", "scen": "<p>A report-generator subagent has access to a web-search MCP tool whose description simply says, “searches the web for information.” Despite a prompt rule against searching, it searches instead of citing the findings supplied by the coordinator.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO changes most directly fix this? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": false, "t": "Keep web search available but limit it to one search per report.", "e": "A budget controls how much the tool can be used, not whether the tool is appropriate. Even one unnecessary search can substitute unvetted findings for the coordinator's supplied evidence."}, {"l": "B", "ok": true, "t": "Define an explicit tools allowlist containing only the report generator's writing tools.", "e": "Removing the web-search tool from the agent's available tool set makes the unwanted behavior impossible. This is the strongest architectural control when the report generator's role does not require independent searching."}, {"l": "C", "ok": false, "t": "Repeat the citation-only rule in the system prompt and every delegation prompt.", "e": "The scenario already establishes that prompt instructions have failed. Repeating them may reinforce the desired behavior, but it does not prevent the model from selecting a tool that remains available."}, {"l": "D", "ok": true, "t": "Rewrite the web-search description to explain when not to use it.", "e": "Tool descriptions are an important signal for tool selection. A vague description such as “searches the web for information” can match nearly any research-related task. A more precise description should state that the tool is not for use when vetted findings have already been supplied and the task is to write a report from those findings."}], "o": "<p>This question combines two complementary controls:<\/p>\n<ul><li><strong>Availability control:<\/strong> Remove tools the subagent should never use.<\/li><li><strong>Selection guidance:<\/strong> Make the descriptions of tools that remain available precise about when they should and should not be used.<\/li><\/ul>\n<p>The allowlist directly enforces the report generator's role. A clear tool description improves selection wherever the web-search tool is legitimately available to other agents.<\/p>\n<p>A search budget does not solve the selection problem, because a single inappropriate search still violates the requirement. Prompt repetition also leaves the root cause in place: the tool is available and its description broadly matches the task.<\/p>\n<p><strong>Key takeaway:<\/strong> Use tool configuration to enforce role boundaries and precise descriptions to guide appropriate selection.<\/p>", "docs": []}, {"k": "4.16", "d": "d2", "title": "Making Post-Tool Output Normalization Effective", "scen": "<p>A <code>PostToolUse<\/code> hook converts numeric status codes returned by a third-party MCP tool into readable labels. To minimize latency, the hook returns its result asynchronously. Logs confirm that the hook fires on every call and computes the correct conversions, but the model still receives the original numeric codes.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should the team change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Rewrite the hook matcher to use the tool’s full <code>mcp__SERVER__TOOL<\/code> name.", "e": "MCP tools commonly use fully qualified names in hook matchers. However, the logs already confirm that the hook fires on every call. The failure is not matching; it is that the asynchronous result arrives too late to affect what the model sees."}, {"l": "B", "ok": true, "t": "Complete the conversion and return the replacement output synchronously.", "e": "A synchronous hook allows the agent loop to wait for the hook's result before continuing. The normalized output can therefore replace the original tool response before the model processes it."}, {"l": "C", "ok": false, "t": "Return a block decision with a reason listing the converted labels.", "e": "For <code>PostToolUse<\/code>, a block decision does not replace the original tool output with the converted version. The model would still receive the raw codes, potentially alongside the additional reason text."}, {"l": "D", "ok": false, "t": "Move the conversion to a <code>PreToolUse<\/code> hook and rewrite the tool arguments using <code>updatedInput<\/code>.", "e": "A <code>PreToolUse<\/code> hook modifies the input sent to a tool before execution. This scenario concerns normalizing the tool's returned output, not changing its input arguments."}], "o": "<p>The critical distinction is between <strong>asynchronous side effects and synchronous output transformation<\/strong>.<\/p>\n<p>An asynchronous hook is useful for logging, metrics, or other work that should not delay the agent. However, the agent continues without waiting for its eventual result. Such a result cannot modify or inject information into the conversation after the model has already processed the original output.<\/p>\n<p>A synchronous <code>PostToolUse<\/code> hook acts as a gate between tool execution and model consumption. It can normalize the output and return the replacement before the agent continues.<\/p>\n<p><strong>Key takeaway:<\/strong> If a hook must change what the model sees, complete the transformation synchronously.<\/p>", "docs": []}, {"k": "4.17", "d": "d3", "title": "Getting Claude Code to Verify Its Own Implementation", "scen": "<p>A username-normalization function keeps getting incorrect edge-case handling when Claude Code implements it from a prose specification. Reviewers overlook these defects in code diffs. The team wants Claude to check its work before presenting the implementation.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which approach is most effective?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add several input/output examples for the edge cases to the prompt.", "e": "Examples communicate the expected transformation and may improve implementation quality. However, they provide no executable check. Claude can still produce incorrect code, and the team must rely on human reviewers to discover the problem."}, {"l": "B", "ok": false, "t": "Run the task in plan mode and review the proposed edge-case handling before code is written.", "e": "Plan mode helps the team review the intended approach before implementation. It does not verify that the finished code actually follows the plan or handles every edge case correctly."}, {"l": "C", "ok": false, "t": "Use the interview pattern so Claude asks clarifying questions about edge cases.", "e": "The interview pattern is useful when the requirements are unclear or important design decisions remain unresolved. Clarifying the requirements does not automatically test the resulting implementation."}, {"l": "D", "ok": true, "t": "Write a test file first, then have Claude run the tests and fix failures.", "e": "Tests provide both concrete examples of expected behavior and an executable mechanism for checking the implementation. Claude can implement the function, run the tests, inspect failures, and iterate before presenting the code."}], "o": "<p>The scenario is not primarily about helping Claude understand the specification. It is about verifying that the finished implementation behaves correctly.<\/p>\n<p>There is an important difference between communicating expectations and checking results:<\/p>\n<ul><li><strong>Prompt examples<\/strong> show what the function should do.<\/li><li><strong>Plan mode<\/strong> lets the team review the intended approach.<\/li><li><strong>The interview pattern<\/strong> clarifies requirements before implementation.<\/li><li><strong>Executable tests<\/strong> check whether the implementation actually produces the expected outputs.<\/li><\/ul>\n<p>The test-driven approach closes the feedback loop. Each test provides an objective pass/fail signal, allowing Claude to identify and correct edge-case failures before a reviewer has to find them.<\/p>\n<p><strong>Key takeaway:<\/strong> When the goal is self-verification, give Claude tests it can execute—not just examples or a plan to follow.<\/p>", "docs": []}, {"k": "4.18", "d": "d5", "title": "Reporting Subagent Search Failures Clearly", "scen": "<p>A team delegates documentation searches to a subagent because verbose results were filling the main conversation's context window. When searches produce no usable results, the subagent reports only “search unavailable.” The actual outcomes vary: some searches encounter rate limits, while others are valid queries that return no matches.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What should change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the documentation searches back into the main conversation.", "e": "This would make individual errors visible in the main conversation, but it would also reintroduce the original problem: verbose search output consuming the coordinator's context window."}, {"l": "B", "ok": false, "t": "Have the main conversation respawn the subagent whenever it reports that search is unavailable.", "e": "Not all outcomes justify a retry. A transient rate limit may clear later, but a valid query that matches nothing may need to be rephrased rather than repeated. Blindly respawning the agent can waste work and aggravate rate limiting."}, {"l": "C", "ok": false, "t": "Report failed searches as complete with empty findings.", "e": "This silently suppresses errors. The coordinator would treat a failed search as a successful search with no matches, making informed recovery impossible."}, {"l": "D", "ok": true, "t": "Require the subagent's final report to include the failure type, attempted queries, and partial findings.", "e": "The subagent's intermediate tool calls and results remain in its isolated context; only its final report returns to the parent. That report must therefore carry the information the coordinator needs to decide what to do next."}], "o": "<p>Subagent context isolation is useful because it prevents verbose research output from overwhelming the main conversation. However, it creates an information boundary: the coordinator cannot inspect the subagent's intermediate tool calls unless the necessary details are included in the final report.<\/p>\n<p>A generic message such as “search unavailable” collapses several distinct situations:<\/p>\n<ul><li>A rate limit may call for a delayed retry.<\/li><li>A malformed or overly narrow query may need rephrasing.<\/li><li>A valid query with no matches may require a different research strategy.<\/li><li>Partial findings may still be useful if the remaining coverage gap is disclosed.<\/li><\/ul>\n<p>A structured failure report lets the coordinator select the appropriate recovery action without repeating the entire investigation.<\/p>\n<p><strong>Key takeaway:<\/strong> Preserve context boundaries, but make subagent reports informative enough for recovery decisions.<\/p>", "docs": []}, {"k": "4.19", "d": "d5", "title": "Preserving Exact File-and-Line Findings Across Sessions", "scen": "<p>During a long refactoring session, Claude Code correctly identifies the file and line associated with each legacy behavior. After <code>/compact<\/code>, it starts attributing behaviors to the wrong files. Teammates who start new sessions also need access to the exact mappings.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change works best?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run <code>/compact<\/code> earlier and at shorter intervals.", "e": "More frequent compaction does not prevent information loss. Each summarization pass can still discard precise associations between findings and their source locations."}, {"l": "B", "ok": false, "t": "Add the repository's module layout and key file paths to <code>CLAUDE.md<\/code>.", "e": "<code>CLAUDE.md<\/code> is useful for persistent project conventions and general repository guidance. It does not automatically contain the session-specific discoveries about which exact lines implement each legacy behavior."}, {"l": "C", "ok": false, "t": "Give <code>/compact<\/code> explicit instructions to retain every behavior's file path and line number.", "e": "Incorrect for the full requirement. Custom compaction instructions can help preserve details within the current conversation, but the resulting summary remains associated with that session. Teammates starting independent sessions still need a persistent source for the mappings."}, {"l": "D", "ok": true, "t": "Record each behavior's file path and line in a scratchpad file and read it from any session.", "e": "A scratchpad stores the discoveries outside the conversation history. The exact mappings can survive compaction and be retrieved by teammates in later sessions."}], "o": "<p>Compaction trades detailed conversation history for a shorter summary that allows work to continue. That summary may preserve the general findings while losing the exact association between each finding and its file and line number.<\/p>\n<p>The problem becomes more serious when the information must be shared across sessions. Conversation summaries are not a reliable substitute for a persistent, accessible record of discoveries.<\/p>\n<p>A scratchpad file provides that record. As Claude discovers each behavior, it can record a structured mapping such as:<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Legacy behavior<\/th><th>File path<\/th><th>Line number<\/th><\/tr><\/thead><tbody><tr><td>Example behavior A<\/td><td><code>src/example.ts<\/code><\/td><td>42<\/td><\/tr><tr><td>Example behavior B<\/td><td><code>src/legacy.ts<\/code><\/td><td>117<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>The paths and line numbers above are illustrative, not findings from the source file.<\/em><\/p>\n<p>The file should be updated as the investigation progresses and read again whenever a later task depends on the mappings. If the code changes, the stored locations may need to be revalidated.<\/p>\n<p><strong>Key takeaway:<\/strong> Keep precise, reusable discoveries in a persistent file instead of relying on conversational memory or compaction summaries.<\/p>", "docs": []}, {"k": "4.20", "d": "d5", "title": "Validating Structured Output in a CI Pipeline", "scen": "<p>A CI review job runs <code>claude -p<\/code> with <code>--output-format json<\/code> and <code>--json-schema<\/code>. Occasionally, a run reports <code>subtype: success<\/code> but has no <code>structured_output<\/code> field, causing the posting step to crash.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>How should the pipeline check each result before posting?<\/p>", "c": [{"l": "A", "ok": false, "t": "Fall back to parsing the <code>result<\/code> field when <code>structured_output<\/code> is missing.", "e": "The <code>result<\/code> field contains the model's plain-text answer. It is not necessarily validated against the required schema, so falling back to it undermines the guarantee the downstream posting step needs."}, {"l": "B", "ok": false, "t": "Switch to <code>--output-format stream-json<\/code> so the schema is checked on each event.", "e": "<code>stream-json<\/code> changes how the output events are delivered. It does not mean the final structured output is validated and made available on every individual event."}, {"l": "C", "ok": false, "t": "Branch only on the CLI process exit code.", "e": "Exit codes are useful for detecting failed process executions, but the scenario describes runs that report success. A zero exit code does not guarantee that the expected <code>structured_output<\/code> field exists."}, {"l": "D", "ok": true, "t": "Require both <code>subtype: success<\/code> and the presence of <code>structured_output<\/code>.", "e": "These checks validate two separate conditions: the run completed successfully, and the expected schema-shaped payload is available for the next pipeline stage. If either condition fails, the pipeline should treat the result as unusable."}], "o": "<p>The JSON output envelope contains fields with different purposes:<\/p>\n<ul><li><strong><code>result<\/code><\/strong> contains the model's plain-text answer.<\/li><li><strong><code>subtype<\/code><\/strong> describes how the run ended.<\/li><li><strong><code>structured_output<\/code><\/strong> contains the schema-shaped data intended for structured consumption.<\/li><\/ul>\n<p>Using <code>--json-schema<\/code> requests schema-constrained structured output, but the pipeline must still verify that the field it intends to consume is present. A run can report <code>subtype: success<\/code> without providing <code>structured_output<\/code>.<\/p>\n<p>A robust pipeline should therefore validate both conditions before posting. If the structured payload is absent, it should fail clearly or route the run into an explicit recovery path rather than silently falling back to unvalidated prose.<\/p>\n<p><strong>Key takeaway:<\/strong> Successful execution is not the same as having a usable structured result. Validate the status and the required payload.<\/p>", "docs": []}, {"k": "4.21", "d": "d3", "title": "Defining Clear Approval Boundaries in Claude Code", "scen": "<p>During refactoring, Claude Code interrupts the team to confirm trivial renames but changes public API signatures without asking. Both changes use the same tools on the same files. The project's <code>CLAUDE.md<\/code> contains only the vague instruction: “check before risky changes.”<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change is most effective?<\/p>", "c": [{"l": "A", "ok": false, "t": "Move the rule to the top of <code>CLAUDE.md<\/code> and mark it IMPORTANT.", "e": "More prominent wording does not define what “risky” means. Claude may continue to interpret the vague instruction inconsistently."}, {"l": "B", "ok": true, "t": "Define explicit criteria and provide contrasting examples.", "e": "The team should identify changes that Claude can make autonomously and changes that require confirmation, then provide examples of both."}, {"l": "C", "ok": false, "t": "Require plan mode for every refactoring task.", "e": "Plan mode can be useful for major or architectural changes, but requiring it for every refactor adds unnecessary review steps for routine changes. It does not teach Claude which changes actually require confirmation."}, {"l": "D", "ok": false, "t": "Add a <code>PreToolUse<\/code> hook requiring approval for edits to risky file paths.", "e": "Incorrect for this scenario. Hooks are useful when a condition can be checked mechanically, such as a command or protected path. Here, both trivial and consequential edits use the same tools on the same files. The distinction depends on the meaning and impact of the change, not the file path alone."}], "o": "<p>The underlying problem is an <strong>undefined decision boundary<\/strong>. “Check before risky changes” asks Claude to make a judgment without defining the criteria.<\/p>\n<p>A better instruction establishes clear rules based on impact and reversibility. Local, reversible edits can generally proceed; changes affecting public interfaces, shared resources, or dependent modules should trigger confirmation.<\/p>\n<p>Contrasting few-shot examples help demonstrate the intended boundary instead of merely repeating the rule. A mechanical hook would be appropriate if the risky action could be identified reliably by a concrete condition, but it cannot distinguish two semantically different changes that use the same tools and paths.<\/p>\n<p><strong>Key takeaway:<\/strong> Define what requires approval, illustrate the boundary with examples, and reserve mechanical hooks for conditions they can reliably detect.<\/p>", "docs": []}, {"k": "4.22", "d": "d5", "title": "Sharing Review Criteria Between CI and Local Sessions", "scen": "<p>A CI review job runs <code>claude -p<\/code>, but its findings ignore the team's review criteria. The criteria exist only in a few developers' personal <code>~/.claude/CLAUDE.md<\/code> files.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change applies the criteria to both CI runs and every teammate's local session?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add the review criteria to the checked-in <code>.claude/settings.json<\/code>.", "e": "Project settings configure items such as permissions, hooks, and tool behavior. They are not the intended location for prose instructions that define review criteria."}, {"l": "B", "ok": false, "t": "Embed the criteria in the prompt string passed to <code>claude -p<\/code>.", "e": "Incorrect as a complete solution. This would supply the criteria to the CI job, but it would not automatically make them available in teammates' interactive local sessions."}, {"l": "C", "ok": false, "t": "Copy the criteria into <code>~/.claude/CLAUDE.md<\/code> on the CI runner.", "e": "This could fix the CI runner's user-level configuration, but teammates' local sessions would remain unaffected. Maintaining separate copies also risks configuration drift."}, {"l": "D", "ok": true, "t": "Move the criteria into a repository-root <code>CLAUDE.md<\/code>.", "e": "A project-level <code>CLAUDE.md<\/code> can be committed to version control, making the same instructions available to teammates and CI runs in that repository."}], "o": "<p>The key principle is that <strong>instruction scope follows file location<\/strong>.<\/p>\n<ul><li><code>~/.claude/CLAUDE.md<\/code> provides user-level instructions for a particular environment.<\/li><li>A repository-root <code>CLAUDE.md<\/code> provides project guidance shared through version control.<\/li><li><code>.claude/settings.json<\/code> configures settings and behavior rather than serving as the main store for prose review criteria.<\/li><li>Instructions embedded in a CI prompt apply to that particular workflow unless separately provided elsewhere.<\/li><\/ul>\n<p>A single version-controlled project file prevents developers and automated reviews from using different standards. It also makes updates easier because the criteria have one shared source.<\/p>\n<p><strong>Key takeaway:<\/strong> Put team-wide instructions in a project-level <code>CLAUDE.md<\/code> so local development and CI follow the same standards.<\/p>", "docs": []}, {"k": "4.23", "d": "d5", "title": "Giving Subagents the Context They Need", "scen": "<p>A long session agrees on three target modules and a naming rule. The session history contains a large amount of raw file output. A subagent is asked to check coverage for “the modules we discussed,” but it reports on unrelated modules.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What change fixes this?<\/p>", "c": [{"l": "A", "ok": false, "t": "Add Grep and Read to the subagent's tool list so it can rediscover the modules.", "e": "Rediscovering the modules repeats work that has already been done. More importantly, the naming rule is a decision made during the conversation, and the subagent cannot reliably reconstruct it by searching the codebase."}, {"l": "B", "ok": true, "t": "Include the module paths and naming rule directly in the delegation prompt.", "e": "A non-forked subagent starts with fresh, isolated context. Its prompt must contain the relevant paths and decisions needed to perform the task."}, {"l": "C", "ok": false, "t": "Invoke the subagent explicitly by name.", "e": "Explicit invocation controls which subagent handles the task, not what information it receives. The problem is missing context, not incorrect routing."}, {"l": "D", "ok": false, "t": "Fork the session so the subagent inherits the entire conversation.", "e": "Incorrect for this situation. Forking can be useful when a subtask genuinely needs substantial shared context. Here, the session contains bulky raw file output, most of which is irrelevant to the coverage check. Copying the entire history would add unnecessary token cost."}], "o": "<p>Subagents provide context isolation in both directions:<\/p>\n<ul><li><strong>Input:<\/strong> A non-forked subagent does not automatically receive the parent conversation history or previous tool results.<\/li><li><strong>Output:<\/strong> Its intermediate work remains in its own context, and the parent receives the subagent's final report.<\/li><\/ul>\n<p>Consequently, phrases such as “the modules we discussed” do not provide useful information unless those modules are explicitly identified in the delegation prompt.<\/p>\n<p>A well-formed prompt should name the three module paths, state the agreed naming rule, and explain the coverage check required. This gives the subagent the necessary context without transferring a large conversation history.<\/p>\n<p>Forking is an alternative when substantial shared background is essential, but it is inefficient when the relevant information can be summarized in a few lines.<\/p>\n<p><strong>Key takeaway:<\/strong> Treat each subagent prompt like a briefing for a new engineer: include the exact paths, decisions, and constraints the task depends on.<\/p>", "docs": []}, {"k": "4.24", "d": "d5", "title": "Preserving Publication Dates in Research Findings", "scen": "<p>A research subagent collects framework migration guides published across several years. The main agent mixes outdated steps into current advice. The source portal refreshes its last-updated timestamps whenever page templates change.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which change enables correct temporal interpretation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Return only the most recently written guide for each topic and drop older sources.", "e": "Older guides may contain relevant intermediate migration steps. Dropping them discards potentially useful information instead of allowing the main agent to interpret it in the correct historical context."}, {"l": "B", "ok": false, "t": "Put the publication-date requirement only in the main agent's system prompt.", "e": "Subagents do not automatically inherit the parent's system prompt or conversation history. The requirement must be included in the subagent's own instructions or its delegation prompt."}, {"l": "C", "ok": true, "t": "Extract the publication date from each guide's content and return it with every finding.", "e": "Including the date as structured metadata preserves the temporal context when findings are passed to the main agent."}, {"l": "D", "ok": false, "t": "Use the search tool's <code>page_age<\/code> value as the guide's publication date.", "e": "In this scenario, the portal refreshes its last-updated timestamps when page templates change. That timestamp may describe a recent template update rather than the age of the guide's content, making an old guide appear current."}], "o": "<p>When research findings are aggregated from multiple sources, each finding needs enough metadata for the downstream agent to interpret it correctly.<\/p>\n<p>Suppose one migration guide describes a framework's 2023 behavior and another describes its 2025 behavior. Without publication dates, their recommendations may appear contradictory even though they describe different versions.<\/p>\n<p>A structured finding should therefore retain relevant fields such as:<\/p>\n<ul><li>The finding itself.<\/li><li>Its source.<\/li><li>The source's publication date.<\/li><li>The framework version or period, when available.<\/li><\/ul>\n<p>The date should be extracted from the guide's actual content rather than inferred from a portal timestamp known to be unreliable.<\/p>\n<p>This preserves older material without treating it as current guidance and allows the main agent to distinguish genuine contradictions from changes over time.<\/p>\n<p><strong>Key takeaway:<\/strong> Carry publication dates with individual findings so downstream agents can interpret evidence in its proper temporal context.<\/p>", "docs": []}, {"k": "4.25", "d": "d5", "title": "Using the Built-in Explore Subagent Correctly", "scen": "<p>A teammate delegates discovery-only work to Claude Code's built-in Explore subagent. They expect Explore to follow project <code>CLAUDE.md<\/code> conventions and assume its runs do not count toward usage limits.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO workflow adjustments should they make? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": true, "t": "Pass the needed search conventions directly in the Explore task prompt.", "e": "The built-in Explore and Plan subagents start without automatically loading the user's, project's, and local <code>CLAUDE.md<\/code> files. If a particular search convention must be followed, include it explicitly in the task instructions."}, {"l": "B", "ok": false, "t": "Move discovery to a custom subagent that allows Write and Edit tools.", "e": "Explore is read-only, but that is appropriate for discovery-only work. Adding write capabilities is unnecessary when the task is simply to investigate and report findings."}, {"l": "C", "ok": false, "t": "Define a custom subagent because Explore supports only quick searches.", "e": "Explore supports three levels of search thoroughness: quick, medium, and very thorough. Deeper discovery does not inherently require creating a custom subagent."}, {"l": "D", "ok": true, "t": "Budget token spend for discovery runs.", "e": "Explore requests consume usage from the same limits as the main conversation. Context isolation can help keep verbose research out of the main conversation, but it does not make the work free."}], "o": "<p>Explore is a built-in, read-only subagent intended for codebase discovery. Its isolated context helps it conduct research without filling the main conversation with every intermediate search result.<\/p>\n<p>However, isolation does not mean automatic access to project instructions or exemption from usage limits.<\/p>\n<p>The task prompt should include any conventions Explore needs to follow, such as preferred directories, naming rules, search boundaries, or reporting requirements. The team should also account for the tokens used by delegated discovery work when planning usage.<\/p>\n<p>A custom subagent is appropriate when the team needs specialized behavior or a different tool configuration—not simply because a deeper search is required.<\/p>\n<p><strong>Key takeaway:<\/strong> Supply Explore with the conventions it needs, choose the appropriate thoroughness level, and budget for its usage.<\/p>", "docs": []}, {"k": "4.26", "d": "d3", "title": "Choosing Direct Execution Over Plan Mode", "scen": "<p>A form submission bug requires a date-validation conditional in a handler function whose location is already known. The developer can describe the exact rule and expected change in one sentence.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which workflow best fits this change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Start with <code>bypassPermissions<\/code> to reduce approval prompts.", "e": "This setting bypasses normal permission prompts, subject to documented exceptions. It is a permission-control mechanism, not the appropriate way to speed up a small code change. The documentation recommends using it only in sandboxed containers or virtual machines."}, {"l": "B", "ok": false, "t": "Enter plan mode and review the proposed implementation before editing.", "e": "Plan mode is useful when the approach is uncertain, the code is unfamiliar, or the change spans multiple files. Here, the function and intended change are already known, so planning adds unnecessary overhead."}, {"l": "C", "ok": true, "t": "Make the edit directly and run the relevant checks.", "e": "The task is small, clearly specified, and bounded. Claude can make the change immediately and verify it with an appropriate test, build, or linter."}, {"l": "D", "ok": false, "t": "Ask the Explore subagent to map the form-handling code first.", "e": "Explore is useful for discovering unfamiliar code while keeping verbose search results out of the main conversation. There is no need to rediscover a handler whose location is already known."}], "o": "<p>The deciding factor is how well the change is understood.<\/p>\n<p>Plan mode adds value when Claude needs to investigate an unfamiliar codebase, weigh alternative approaches, or coordinate a larger change. For a one-line conditional with a known location and clear acceptance criteria, direct execution is more efficient.<\/p>\n<p>A good direct-execution request should:<\/p>\n<ol><li>Identify the handler file.<\/li><li>State the exact validation rule.<\/li><li>Ask Claude to make only the intended change.<\/li><li>Require relevant checks and inspect their results.<\/li><\/ol>\n<p>The important distinction is between making a change quickly and skipping verification. Direct execution avoids unnecessary planning; it does not eliminate testing.<\/p>\n<p><strong>Key takeaway:<\/strong> For small, well-understood edits, execute directly and verify the result. Use plan mode when uncertainty justifies the extra step.<\/p>", "docs": []}, {"k": "4.27", "d": "d3", "title": "Resolving a Personal Skill That Shadows a Shared Skill", "scen": "<p>A developer copies the team's shared review skill, including its full frontmatter, into <code>~/.claude/skills/my-review/<\/code>. When they type <code>/review<\/code>, Claude Code runs the personal copy instead of the shared project skill.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which TWO changes restore <code>/review<\/code> to the shared skill while keeping the personal copy usable? (Select TWO.)<\/p>", "c": [{"l": "A", "ok": true, "t": "Remove the <code>name<\/code> field from the personal copy's frontmatter.", "e": "When the frontmatter does not specify a name, Claude Code derives the command name from the skill's directory name. The personal copy would then be invoked as <code>/my-review<\/code>, leaving <code>/review<\/code> available to the shared project skill."}, {"l": "B", "ok": false, "t": "Add <code>disable-model-invocation: true<\/code> to the personal copy.", "e": "This setting controls whether Claude can invoke the skill automatically. It does not change how a manually typed <code>/review<\/code> command resolves, so the naming conflict remains."}, {"l": "C", "ok": true, "t": "Change the personal copy's <code>name<\/code> field to a unique name.", "e": "Giving the personal copy a name that does not conflict with a project skill removes the collision. The shared skill can again resolve as <code>/review<\/code>, while the personal copy remains available under its new command name."}, {"l": "D", "ok": false, "t": "Run <code>/reload-skills<\/code>.", "e": "Reloading can help when a new skill directory needs to be recognized, but the shared skill is already loaded. The problem is the naming conflict and precedence between the personal and project skills, not failure to load the directory."}], "o": "<p>Claude Code loads skills from multiple locations, including:<\/p>\n<ul><li>Personal skills under <code>~/.claude/skills/<\/code><\/li><li>Project skills under <code>.claude/skills/<\/code><\/li><\/ul>\n<p>When skills share the same name, a personal skill can take precedence over a project skill. Copying a project skill into the personal directory without changing its frontmatter can therefore cause the personal copy to shadow the shared version.<\/p>\n<p>There are two straightforward solutions:<\/p>\n<ul><li>Give the personal skill a unique name.<\/li><li>Remove its explicit <code>name<\/code> field and let the directory name determine its command.<\/li><\/ul>\n<p>Both approaches preserve the personal variant without overriding the team's <code>/review<\/code> command.<\/p>\n<p><strong>Key takeaway:<\/strong> Resolve skill conflicts by changing names, not by disabling automatic invocation or repeatedly reloading skills.<\/p>", "docs": []}, {"k": "4.28", "d": "d3", "title": "Continuing a Long Investigation With a Resumable Subagent", "scen": "<p>A refactor requires a long codebase investigation that spans several turns. Later search requests depend on answers from earlier searches, and the exploration output is too verbose for the main conversation.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>Which subagent design supports both continuity and context isolation?<\/p>", "c": [{"l": "A", "ok": false, "t": "Run the investigation in the main conversation and compact between phases.", "e": "This exposes the main conversation to the verbose search output before compaction can summarize it. Compaction can also discard precise details needed by later phases."}, {"l": "B", "ok": false, "t": "Launch a fresh Explore subagent for every phase and pass the previous summary into each new task.", "e": "This keeps verbose output isolated, but every fresh Explore invocation starts without the previous subagent's working state. A summary may not preserve all identifiers, file locations, or intermediate findings required by later searches."}, {"l": "C", "ok": true, "t": "Use a resumable general-purpose subagent.", "e": "A general-purpose subagent can return an identifier that allows it to be resumed. Later requests can build on the earlier investigation while its detailed search results remain in the subagent's context."}, {"l": "D", "ok": false, "t": "Run Explore once at the very thorough level.", "e": "A thorough search may discover a great deal, but it cannot anticipate every question that arises from its findings. Because later phases depend on answers to earlier questions, the workflow still needs resumable follow-up investigation."}], "o": "<p>The requirements are both important:<\/p>\n<ol><li><strong>Context isolation:<\/strong> Verbose search results should stay outside the main conversation.<\/li><li><strong>Continuity:<\/strong> Later search requests must be able to use the subagent's previous findings.<\/li><\/ol>\n<p>The built-in Explore subagent is intended for read-only codebase discovery, but it is one-shot and does not provide a resumable <code>agentId<\/code>. A general-purpose or suitably configured custom subagent can be resumed to continue an investigation.<\/p>\n<p>This avoids two weaknesses of the alternatives: flooding the main conversation with research output or repeatedly starting from scratch and losing detailed working state.<\/p>\n<p><strong>Key takeaway:<\/strong> For multi-turn investigations that depend on previous findings, use a resumable general-purpose or custom subagent rather than a sequence of fresh Explore runs.<\/p>", "docs": []}, {"k": "4.29", "d": "d5", "title": "Preventing a Slash Command From Fixing the Wrong Ticket", "scen": "<p>The team's <code>/fix-ticket<\/code> slash command searches a ticket system by title keywords through an MCP tool. Many open tickets have similar titles, so Claude sometimes chooses the most recently updated match and fixes the wrong bug.<\/p>\n<p>Developers usually know the ticket title but do not know its ID until they see the search results.<\/p>", "scenLabel": "", "inline": true, "stem": "<p>What is the most reliable change?<\/p>", "c": [{"l": "A", "ok": false, "t": "Improve the tool description with examples so Claude writes narrower searches.", "e": "Better tool descriptions can improve query quality, but several tickets genuinely share similar titles. Narrower searches cannot guarantee uniqueness when multiple valid candidates match the query."}, {"l": "B", "ok": true, "t": "List the matching tickets with their IDs and ask the developer to choose.", "e": "The developer knows which ticket they intended. Displaying the candidates with stable IDs and useful distinguishing details allows the developer to resolve the ambiguity before any code is changed."}, {"l": "C", "ok": false, "t": "Require the exact ticket ID as an argument to <code>/fix-ticket<\/code>.", "e": "Incorrect for this workflow. Requiring a unique identifier is a valid design in general, but the scenario says developers rarely know the ID at the beginning. Making it mandatory would block the command's primary use case."}, {"l": "D", "ok": false, "t": "Rank the tickets by relevance and return only the highest-scoring result.", "e": "Ranking hides the ambiguity rather than resolving it. A relevance score cannot reliably know which ticket the developer intended, and returning only one candidate makes the incorrect choice harder to detect."}], "o": "<p>When several plausible matches exist, the missing information is the developer's intent—not necessarily the quality of the search.<\/p>\n<p>The robust workflow is:<\/p>\n<ol><li>Search by the title keywords the developer knows.<\/li><li>Return the plausible matches with stable identifiers and distinguishing fields.<\/li><li>Ask the developer to select the intended ticket.<\/li><li>Proceed with investigation and code changes only after the ambiguity is resolved.<\/li><\/ol>\n<p>This extra clarification step is much cheaper than spending a session fixing the wrong bug.<\/p>\n<p>It also follows a broader agent-design principle: when the available context does not establish which entity the user means, ask for clarification rather than guessing.<\/p>\n<p><strong>Key takeaway:<\/strong> Surface ambiguity and ask the user to resolve it before taking consequential action.<\/p>", "docs": []}, {"k": "4.30", "d": "d5", "title": "Preserving Investigation Findings Across Compaction and Sessions", "scen"
