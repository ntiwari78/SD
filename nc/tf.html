<h1>Terraform: Up &amp; Running, as something you can poke</h1>
<p class="lede">Ten chapters and an appendix of Yevgeniy Brikman's book, rebuilt as labs. Each module gives you the mental model first, lets you break a simulated system, and only then shows the HCL.</p>

<p>This is written for an engineer who already programs well and wants to know <em>why</em> Terraform behaves the way it does. Infrastructure code differs from application code in three ways that drive almost every pattern in the book: it has side effects that cost money, it carries durable state outside the code, and a mistake can take down everything at once. Keep those three in mind and most of the rules stop looking arbitrary.</p>

<h2>How each module works</h2>
<div class="grid3 wide">

  <div class="pane"><h4>3 · Code &amp; sharp edges</h4>Idiomatic HCL, CLI, Go and Rego, followed by the places this bites in production.</div>
</div>
<p class="note">The simulators model Terraform's behaviour. They do not call AWS, so nothing here can cost you money. Plan output is shortened but uses the real symbols and wording.</p>

<p class="eyebrow">Chapter 1</p>
<h1>Why Terraform</h1>
<p class="lede">Software is not done when it works on your laptop. It is done when it is running for users, and the path from one to the other is where most outages are born.</p>

<div class="model"><b>Mental model</b>
<p>Infrastructure as code turns operations into a software problem. If a server, a firewall rule or a deploy is described in a text file, you get everything source code already has: diffs, review, tests, history, rollback, reuse. The file becomes the documentation and the documentation can be executed.</p></div>

<h2>DevOps in one paragraph</h2>
<p>The old split had developers throw builds over a wall to operations, who deployed them by hand on hardware they racked themselves. Releases were rare, painful and risky, so teams released less often, which made each release bigger and riskier. DevOps is the set of practices that breaks that loop. Its values are usually summarised as <strong>CAMS</strong>: <strong>C</strong>ulture (dev and ops share goals), <strong>A</strong>utomation (machines do the repeatable work), <strong>M</strong>easurement (you track what you ship) and <strong>S</strong>haring (knowledge is not locked in one person's head). IaC is the automation pillar, and the other three lean on it.</p>

<h2>Five kinds of IaC tool</h2>
<p>These are categories of job, and real stacks use more than one.</p>
<div class="tablewrap wide"><table>
<thead><tr><th>Category</th><th>Job</th><th>Examples</th><th>Weak spot</th></tr></thead>
<tbody>
<tr><td>Ad hoc scripts</td><td>Run steps on a machine</td><td>Bash, Python</td><td>No conventions; every script is its own snowflake</td></tr>
<tr><td>Configuration management</td><td>Install and manage software on existing servers</td><td>Chef, Puppet, Ansible</td><td>Servers are mutated in place and drift apart over time</td></tr>
<tr><td>Server templating</td><td>Bake an image with everything installed</td><td>Packer, Docker, Vagrant</td><td>Something else still has to run the image</td></tr>
<tr><td>Orchestration</td><td>Schedule, heal, scale and roll out images</td><td>Kubernetes, ECS, Nomad</td><td>Needs a cluster to exist first</td></tr>
<tr><td>Provisioning</td><td>Create the servers, networks, databases and load balancers themselves</td><td>Terraform, CloudFormation, Pulumi</td><td>Says little about what runs inside a server</td></tr>
</tbody></table></div>

<p>The same task looks very different in each. Here is "get a web server running" five ways.</p>
<div class="tabs">
<figure class="code"><figcaption>setup-webserver.sh (ad hoc script)</figcaption><pre><code data-lang="bash">#!/bin/bash
# Works once. Run it twice and you get two clones and two Apache starts.
sudo apt-get update
sudo apt-get install -y php apache2
sudo git clone https://github.com/example/php-app.git /var/www/html/app
sudo service apache2 start</code></pre></figure>
<figure class="code"><figcaption>web-server.yml (Ansible, configuration management)</figcaption><pre><code data-lang="yaml">- name: Configure web servers
  hosts: webservers
  become: true
  tasks:
    - name: Install packages          # idempotent: safe to run again
      apt: { name: [php, apache2], update_cache: yes }
    - name: Check out the app
      git: { repo: "https://github.com/example/php-app.git", dest: /var/www/html/app }
    - name: Start Apache
      service: { name: apache2, state: started, enabled: yes }</code></pre></figure>
<figure class="code"><figcaption>web-server.pkr.hcl (Packer, server templating)</figcaption><pre><code data-lang="hcl">source "amazon-ebs" "ubuntu" {
  ami_name      = "php-app-${formatdate("YYYYMMDDhhmm", timestamp())}"
  instance_type = "t2.micro"
  region        = "us-east-2"
  source_ami    = "ami-0fb653ca2d3203ac1"
  ssh_username  = "ubuntu"
}

build {
  sources = ["source.amazon-ebs.ubuntu"]
  provisioner "shell" {
    inline = [
      "sudo apt-get update",
      "sudo apt-get install -y php apache2",
      "sudo git clone https://github.com/example/php-app.git /var/www/html/app",
    ]
  }
}
# Output: an AMI ID. Every server launched from it is identical.</code></pre></figure>
<figure class="code"><figcaption>deployment.yml (Kubernetes, orchestration)</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-app
spec:
  replicas: 3                 # desired state; the control loop keeps it true
  selector:
    matchLabels: { app: php-app }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 3, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: php-app }
    spec:
      containers:
        - name: php-app
          image: example/php-app:v1
          ports: [{ containerPort: 80 }]</code></pre></figure>
<figure class="code"><figcaption>main.tf (Terraform, provisioning)</figcaption><pre><code data-lang="hcl">resource "aws_instance" "app" {
  count         = 3
  ami           = "ami-0fb653ca2d3203ac1"   # the image Packer baked
  instance_type = "t2.micro"
  tags          = { Name = "php-app" }
}</code></pre></figure>
</div>

<h2>Procedural vs declarative, the one distinction that matters most</h2>
<div class="model"><b>Mental model</b>
<p>Procedural code is a <em>log of changes</em>. To know what exists you must replay every script ever run, in order. Declarative code is a <em>snapshot of the goal</em>. The tool diffs the snapshot against reality and works out the steps. That is why a Terraform file always reads as the current state of the world.</p></div>

<h2>The other trade-off axes</h2>
<ul>
<li><strong>Mutable vs immutable.</strong> Configuration management updates servers in place, so each one accumulates its own history of patches. Immutable infrastructure never changes a running server: you build a new image, launch new servers, and delete the old ones. Fewer states to reason about, and what you tested is exactly what runs.</li>
<li><strong>GPL vs DSL.</strong> A general-purpose language (Pulumi with TypeScript or Python, Chef with Ruby) gives you loops, libraries and test frameworks for free. A domain-specific language (HCL, Puppet, YAML) is smaller and uniform, which makes other people's code easier to read and harder to make clever.</li>
<li><strong>Master vs masterless.</strong> A master server holds state and pushes updates. That is one more thing to deploy, secure, patch and keep available. Terraform has no master of its own; the cloud provider's API plays that role.</li>
<li><strong>Agent vs agentless.</strong> Agents on every server need installing, updating and authenticating, and they fail. Terraform needs none because the cloud provider already runs its own agents on its hosts.</li>
</ul>

<h2>How Terraform works</h2>
<p>Terraform is one Go binary named <code>terraform</code>. You run it from a laptop or a CI server. It parses your HCL, builds a dependency graph, and for each resource asks a <em>provider</em> plugin to make API calls on your behalf. There is no extra infrastructure to run.</p>
<div class="wide" data-h="howgraph"></div>

<div class="edge"><b>Sharp edge: "write once, deploy to any cloud"</b>
<p>Terraform does not give you transparent portability, and that goal is a red herring. An AWS load balancer and a Google one differ in features, health checks, pricing and failure modes, so no tool can hide the difference without reducing both to their lowest common denominator. What Terraform gives you is one language, one workflow and one toolchain across providers. You still write <code>aws_instance</code> for AWS and <code>google_compute_instance</code> for GCP.</p></div>

<div class="why"><b>Why this differs from app code</b>
<p>A bug in app code usually breaks one feature. A bug in infrastructure code can delete the database, the network and every server in one command. That asymmetry is why the rest of the book keeps adding safety mechanisms: plans, locks, isolation, versioning, tests.</p></div>

<div class="since"><b>Since the book</b>
<p>In August 2023 HashiCorp moved Terraform from the MPL 2.0 open source licence to the Business Source License. The community forked the last MPL version as <strong>OpenTofu</strong>, now under the Linux Foundation, which stays largely compatible with the HCL in this explainer. IBM has since acquired HashiCorp. When the book's comparison calls Terraform "open source", read that as "source-available, with an open source fork".</p></div>

<h2>Check your model</h2>
<details class="q"><summary>You have 10 servers from an Ansible play with <code>count: 10</code>. You change it to 15 and rerun. How many servers?</summary><p>25. The play says "launch N", and it ran again with N = 15. Procedural code has no memory of what earlier runs did, so you have to carry that history yourself.</p></details>
<details class="q"><summary>Why can Terraform get away with no master and no agents?</summary><p>The cloud provider is already both. Its API is the always-on control plane, and its hypervisor fleet already runs the agents that start and stop machines. Terraform is only a client.</p></details>
<details class="q"><summary>Your team bakes AMIs with Packer and launches them with Terraform. Which trade-off axis did you choose, and what did you give up?</summary><p>Immutable infrastructure. You gain identical servers and trivial rollback to the previous AMI. You pay with slower changes, since even a one-line fix means a new image and a redeploy, and you still need a story for monitoring and rolling updates because VMs give you less of that than an orchestrator does.</p></details>

<template id="t-chapter-2">
<p class="eyebrow">Chapter 2</p>
<h1>Getting started with Terraform</h1>
<p class="lede">Four steps take you from one virtual server to a load-balanced, self-healing cluster. The syntax is small. The idea underneath, a dependency graph that Terraform diffs against the real world, is what you need to keep.</p>

<div class="model"><b>Mental model</b>
<p>A Terraform configuration is a set of nodes, not a script. Each <code>resource</code> is a node. Every time one resource reads an attribute of another, you draw an edge. Terraform sorts that graph, compares each node with what exists, and prints the difference as a <em>plan</em>. File order and block order mean nothing; references mean everything.</p></div>

<h2>Before the first command</h2>
<p>Terraform acts with whatever AWS credentials it finds. Create an IAM user (never use the root account), grant it only the permissions the examples need, and expose its keys as environment variables so they stay out of your code.</p>
<figure class="code"><figcaption>shell</figcaption><pre><code data-lang="bash">export AWS_ACCESS_KEY_ID=(your access key id)
export AWS_SECRET_ACCESS_KEY=(your secret access key)
# These last only for this shell session. Chapter 6 covers better options.</code></pre></figure>

<h2>The CLI lifecycle</h2>
<div class="tablewrap wide"><table>
<thead><tr><th>Command</th><th>What it does</th><th>Touches real infrastructure?</th></tr></thead>
<tbody>
<tr><td><code>terraform init</code></td><td>Downloads provider plugins into <code>.terraform/</code>, records exact versions in <code>.terraform.lock.hcl</code>, configures the backend</td><td>No</td></tr>
<tr><td><code>terraform validate</code></td><td>Checks syntax and internal consistency</td><td>No</td></tr>
<tr><td><code>terraform plan</code></td><td>Reads real state, diffs it against the code, prints what would change</td><td>Read only</td></tr>
<tr><td><code>terraform apply</code></td><td>Shows the plan, asks for <code>yes</code>, then makes the API calls</td><td>Yes</td></tr>
<tr><td><code>terraform output</code></td><td>Prints output values from state</td><td>No</td></tr>
<tr><td><code>terraform graph</code></td><td>Emits the dependency graph in DOT format</td><td>No</td></tr>
<tr><td><code>terraform destroy</code></td><td>Deletes everything in this configuration. There is no undo</td><td>Yes</td></tr>
</tbody></table></div>
<p><code>.terraform/</code> is scratch space: keep it out of Git. <code>.terraform.lock.hcl</code> is the opposite: commit it, so every teammate and CI run uses the same provider builds.</p>

<h3>Reading a plan</h3>
<div class="tablewrap wide"><table>
<thead><tr><th>Symbol</th><th>Meaning</th><th>Typical cause</th></tr></thead>
<tbody>
<tr><td><code>+</code></td><td>Create</td><td>New resource block</td></tr>
<tr><td><code>~</code></td><td>Update in place</td><td>The API allows changing this attribute on a live resource (a tag, an ASG size)</td></tr>
<tr><td><code>-</code></td><td>Destroy</td><td>Block removed from the code</td></tr>
<tr><td><code>-/+</code></td><td>Destroy, then create a replacement</td><td>The attribute is immutable in the API, so the only way to change it is a new resource</td></tr>
<tr><td><code>+/-</code></td><td>Create the replacement, then destroy the old one</td><td>Same, with <code>create_before_destroy = true</code></td></tr>
</tbody></table></div>

<h2>What each step teaches</h2>
<h3>1. A single server</h3>
<p>A <code>provider</code> block says which API to talk to and where. A <code>resource</code> block has a type, a local name and arguments. Together, type and name form the address <code>aws_instance.example</code>, which is how the rest of your code and the state file refer to it.</p>
<h3>2. A web server</h3>
<p>The instance needs a firewall rule, so you add an <code>aws_security_group</code> and reference its <code>id</code> from the instance. That reference is an <em>implicit dependency</em>: Terraform now knows to create the security group first. You never state the order.</p>
<p>User data runs only on first boot. Without <code>user_data_replace_on_change = true</code>, editing the script would update the stored value and leave the running server unchanged. With it, an edit forces a new instance.</p>
<h3>3. A cluster</h3>
<p>One server is a single point of failure. An Auto Scaling Group launches several from a launch configuration, replaces failed ones and resizes with load. Launch configurations are immutable, so any change means a replacement, and the ASG holds a reference to the old one. Terraform's default order is delete-then-create, which fails here because the old configuration is still in use. <code>create_before_destroy = true</code> reverses the order.</p>
<p><em>Data sources</em> appear here too. A <code>data</code> block is a read-only query against the provider, used to look up the default VPC and its subnets instead of hard-coding IDs.</p>
<h3>4. A load balancer</h3>
<p>Users need one address. An Application Load Balancer has a listener (port 80), a listener rule (send every path to a target group) and a target group that health-checks the instances. Setting the ASG's <code>health_check_type = "ELB"</code> makes it trust the target group's HTTP check, so an instance that is up but serving errors gets replaced.</p>

<h2>Variables and outputs: a module's function signature</h2>
<p>Input variables are parameters, outputs are return values. Variables are set, in rising precedence, by a default, a <code>TF_VAR_name</code> environment variable, a <code>.tfvars</code> file or a <code>-var</code> flag. If none is given, Terraform prompts.</p>
<div class="tabs">
<figure class="code"><figcaption>variables.tf</figcaption><pre><code data-lang="hcl">variable "server_port" {
  description = "The port the server will use for HTTP requests"
  type        = number
  default     = 8080
}

# Type constraints catch mistakes before any API call.
variable "example_types" {
  type = object({
    name    = string
    age     = number
    tags    = list(string)
    enabled = bool
    extra   = map(string)
  })
  default = { name = "value1", age = 42, tags = ["a", "b"], enabled = true, extra = {} }
}

variable "db_password" {
  type      = string
  sensitive = true     # redacted in plan and apply output
}</code></pre></figure>
<figure class="code"><figcaption>outputs.tf</figcaption><pre><code data-lang="hcl">output "alb_dns_name" {
  value       = aws_lb.example.dns_name
  description = "The domain name of the load balancer"
}

# sensitive = true hides a value in CLI output.
# depends_on on an output is rare: use it when a consumer must wait
# for something the value itself does not reference.</code></pre></figure>
<figure class="code"><figcaption>smoke test</figcaption><pre><code data-lang="bash">$ terraform apply -var "server_port=8080"
$ terraform output alb_dns_name
"terraform-asg-example-123.us-east-2.elb.amazonaws.com"

$ curl "http://$(terraform output -raw alb_dns_name)"
Hello, World

# Kill one instance in the console and curl again: the ALB routes
# around it and the ASG launches a replacement.
$ terraform destroy</code></pre></figure>
</div>
<p>Inside a string, <code>"${var.server_port}"</code> interpolates a value. Outside a string you write the reference bare: <code>var.server_port</code>.</p>

<div class="edge"><b>Sharp edges</b>
<ul>
<li><strong>Everything is public.</strong> The examples use the default VPC, whose subnets are all public, and open ports to <code>0.0.0.0/0</code>. Fine for learning. In production, servers live in private subnets and only the load balancer faces the internet.</li>
<li><strong>Ports below 1024 need root.</strong> The examples listen on 8080 so the process can run unprivileged; the ALB maps 80 to it.</li>
<li><strong>State and secrets in Git.</strong> Add <code>.terraform/</code>, <code>*.tfstate</code> and <code>*.tfstate.backup</code> to <code>.gitignore</code> on day one. Chapter 3 explains why.</li>
<li><strong>Destroy means destroy.</strong> There is no recycle bin. Read the plan that <code>destroy</code> prints before typing <code>yes</code>.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>Terraform walks the graph in parallel, creating independent resources at once (ten at a time by default). You get speed without writing concurrency code, because the declarations carry enough information to derive a safe order. The same graph tells Terraform what else must change when one node is replaced.</p></div>

<div class="since"><b>Since the book</b>
<p>AWS has stopped adding features to launch configurations and newer accounts cannot create them. Use <code>aws_launch_template</code> with the ASG's <code>launch_template</code> block; templates are versioned, so the replace-and-re-point dance below is no longer needed. The AWS provider is also well past 4.x, and a few arguments here have been renamed. The graph, plan and lifecycle behaviour are unchanged.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>You move the <code>aws_security_group</code> block from the top of <code>main.tf</code> to the bottom. What changes in the plan?</summary><p>Nothing. Order comes from references between resources, never from position in a file or which file a block is in.</p></details>
<details class="q"><summary>Why does changing <code>min_size</code> show <code>~</code> but changing the launch configuration's <code>user_data</code> show a replacement?</summary><p>The Auto Scaling API has an update call for group sizes. It has no update call for launch configurations at all, so the provider marks every argument as forcing a new resource.</p></details>
<details class="q"><summary>What would happen without <code>create_before_destroy</code> on the launch configuration?</summary><p>Terraform would try to delete the old launch configuration first. AWS refuses because the ASG still references it, and the apply fails partway.</p></details>

</template>
<template id="t-chapter-3">
<p class="eyebrow">Chapter 3</p>
<h1>How to manage Terraform state</h1>
<p class="lede">Your code says what you want. The cloud holds what exists. The state file is the join table between them, and most Terraform disasters are state disasters.</p>

<div class="model"><b>Mental model</b>
<p>State is a small database mapping each address in your code, such as <code>aws_instance.example</code>, to a real ID, such as <code>i-0a1b2c3d</code>. Every <code>plan</code> is a three-way comparison: code, state, reality. Treat the state file the way you treat a production database: one shared copy, locked during writes, encrypted, backed up, and split so one failure cannot take everything down.</p></div>

<h2>What is inside terraform.tfstate</h2>
<figure class="code"><figcaption>terraform.tfstate (abridged, with annotations)</figcaption><pre><code data-lang="json">{
  "version": 4,                       # state file format version
  "terraform_version": "1.2.3",
  "serial": 7,                        # increments on every write; detects stale copies
  "lineage": "1f2087f9-4b3c-1b66-65db-8b78faafc6fb",   # unique per state; never changes
  "resources": [
    {
      "mode": "managed",
      "type": "aws_instance",
      "name": "example",
      "instances": [
        { "attributes": { "id": "i-0a1b2c3d4e5f", "ami": "ami-0fb653ca2d3203ac1", "instance_type": "t2.micro" } }
      ]
    }
  ]
}</code></pre></figure>
<p>The format is a private API. It changes between releases, so never edit it by hand or parse it in scripts. Use <code>terraform state</code>, <code>terraform import</code> or <code>terraform output</code>.</p>

<h2>Why Git is the wrong place for it</h2>
<ul>
<li><strong>Manual sync.</strong> Someone will forget to pull before applying or push after, and run against a stale copy.</li>
<li><strong>No locking.</strong> Two people can apply at once. Version control cannot stop that.</li>
<li><strong>Secrets.</strong> State stores every attribute in plain text, including database passwords. Anyone with repo access can read them.</li>
</ul>
<p>A <em>remote backend</em> fixes all three: Terraform loads and saves state automatically on each run, takes a lock, and the store can encrypt and version the file. On AWS the book uses S3 for storage and a DynamoDB table for locks.</p>

<section class="lab">
<header><span class="tag">Lab</span><h3>Two engineers, one state file</h3>
<p>Alice adds a security group. Bob adds a server. Both run <code>apply</code> at 10:00. Choose where state lives and replay.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">Where state lives</span><span data-h="race-be"></span></span></div>
<div class="grid2"><div><div class="lbl" style="margin-bottom:6px">Alice</div><pre data-h="alice"></pre></div><div><div class="lbl" style="margin-bottom:6px">Bob</div><pre data-h="bob"></pre></div></div>
<div class="msg" data-h="race-msg"></div>
</div>

<div class="tabs">
<figure class="code"><figcaption>global/s3/main.tf (bootstrap the backend)</figcaption><pre><code data-lang="hcl">resource "aws_s3_bucket" "terraform_state" {
  bucket = "terraform-up-and-running-state"   # must be globally unique

  lifecycle {
    prevent_destroy = true      # refuse any plan that would delete this bucket
  }
}

# Keep every revision, so you can roll back a bad state write
resource "aws_s3_bucket_versioning" "enabled" {
  bucket = aws_s3_bucket.terraform_state.id
  versioning_configuration { status = "Enabled" }
}

# Encrypt at rest by default
resource "aws_s3_bucket_server_side_encryption_configuration" "default" {
  bucket = aws_s3_bucket.terraform_state.id
  rule {
    apply_server_side_encryption_by_default { sse_algorithm = "AES256" }
  }
}

# State must never be public
resource "aws_s3_bucket_public_access_block" "public_access" {
  bucket                  = aws_s3_bucket.terraform_state.id
  block_public_acls       = true
  block_public_policy     = true
  ignore_public_acls      = true
  restrict_public_buckets = true
}

resource "aws_dynamodb_table" "terraform_locks" {
  name         = "terraform-up-and-running-locks"
  billing_mode = "PAY_PER_REQUEST"
  hash_key     = "LockID"       # the exact name Terraform expects

  attribute {
    name = "LockID"
    type = "S"
  }
}</code></pre></figure>
<figure class="code"><figcaption>backend block</figcaption><pre><code data-lang="hcl">terraform {
  backend "s3" {
    bucket         = "terraform-up-and-running-state"
    key            = "global/s3/terraform.tfstate"   # unique per module
    region         = "us-east-2"
    dynamodb_table = "terraform-up-and-running-locks"
    encrypt        = true
  }
}
# After adding this, run `terraform init` again. Terraform offers to
# copy your local state into the bucket.</code></pre></figure>
<figure class="code"><figcaption>backend.hcl (partial configuration)</figcaption><pre><code data-lang="hcl"># Shared settings live here once...
bucket         = "terraform-up-and-running-state"
region         = "us-east-2"
dynamodb_table = "terraform-up-and-running-locks"
encrypt        = true

# ...and each module keeps only its own key:
#   terraform { backend "s3" { key = "stage/data-stores/mysql/terraform.tfstate" } }
#
# $ terraform init -backend-config=backend.hcl</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges of backends</b>
<ul>
<li><strong>Chicken and egg.</strong> The bucket that stores state is itself created by Terraform. Bootstrap in two steps: create the bucket and table with local state, then add the <code>backend</code> block and re-run <code>init</code> to migrate. Teardown is the reverse: remove the backend block, <code>init</code> to copy state back to disk, then <code>destroy</code>.</li>
<li><strong>No variables in <code>backend</code>.</strong> The block is read before variables exist, so <code>bucket = var.bucket</code> is an error. You either copy the values into every module and hand-maintain a unique <code>key</code>, use a partial configuration as above, or let Terragrunt generate it.</li>
<li><strong>Stuck locks.</strong> A crashed run can leave a lock behind. <code>-lock-timeout=10m</code> waits for a live one; <code>terraform force-unlock</code> clears a dead one, and only after you are sure nobody is applying.</li>
</ul></div>

<h2>Isolation: bulkheads for infrastructure</h2>
<div class="model"><b>Mental model</b>
<p>Ships have watertight compartments so one hull breach floods one section. State files are your compartments. Everything in one state file shares one lock, one set of credentials and one blast radius. Split by environment first, then by component within an environment, with the rarely changed and dangerous parts (network, database) kept apart from the parts you deploy daily.</p></div>

<section class="lab">

<p>Choose a layout, then click any component to run a bad <code>apply</code> there: a typo, a wrong workspace, a corrupted write. Red is what that mistake can damage.</p></header>

<h3>Workspaces</h3>
<p>A workspace is a named state file for the same code. You start in <code>default</code>. In the S3 backend, the others are stored under an <code>env:</code> prefix.</p>
<figure class="code"><figcaption>terraform workspace</figcaption><pre><code data-lang="bash">$ terraform workspace show
default
$ terraform workspace new example1      # empty state: plan wants to create everything again
$ terraform workspace new example2
$ terraform workspace list
  default
  example1
* example2
$ terraform workspace select example1

# In code, the name is available as terraform.workspace:
#   instance_type = terraform.workspace == "default" ? "t2.medium" : "t2.micro"</code></pre></figure>
<p>Workspaces are good for a quick throwaway copy while you experiment. They are a weak way to separate stage from prod: every workspace lives in the same backend behind the same credentials, nothing in the code or the file tree shows which one you are in, and the same person with the same permissions can destroy any of them with one wrong <code>select</code>.</p>

<h3>File layout</h3>
<p>The stronger pattern puts each environment in its own folder and each component in a subfolder, each with its own backend key and, ideally, its own credentials per environment.</p>
<figure class="code"><figcaption>live repository layout</figcaption><pre><code data-lang="text">stage/
  vpc/
  services/
    webserver-cluster/      main.tf  variables.tf  outputs.tf
  data-stores/
    mysql/
prod/
  vpc/
  services/
    webserver-cluster/
  data-stores/
    mysql/
mgmt/                       # shared tooling: bastion host, CI server
  vpc/
global/                     # things not tied to one environment
  s3/
  iam/</code></pre></figure>
<p>The cost is real. You can no longer create everything with one command, there is duplication between <code>stage</code> and <code>prod</code> (Chapter 4 removes it), and references across folders stop working. That last one needs a replacement.</p>

<h2>Reading another stack's outputs</h2>
<p>The web cluster needs the database address, but the database lives in a different state file. The <code>terraform_remote_state</code> data source reads that file's outputs. It is strictly read-only, so the consumer cannot damage the producer.</p>
<div class="tabs">
<figure class="code"><figcaption>stage/data-stores/mysql/main.tf</figcaption><pre><code data-lang="hcl">resource "aws_db_instance" "example" {
  identifier_prefix   = "terraform-up-and-running"
  engine              = "mysql"
  allocated_storage   = 10
  instance_class      = "db.t2.micro"
  skip_final_snapshot = true
  db_name             = "example_database"

  username = var.db_username     # supplied as TF_VAR_db_username
  password = var.db_password     # supplied as TF_VAR_db_password
}

variable "db_username" {
  type      = string
  sensitive = true
}
variable "db_password" {
  type      = string
  sensitive = true
}

output "address" { value = aws_db_instance.example.address }
output "port"    { value = aws_db_instance.example.port }</code></pre></figure>
<figure class="code"><figcaption>stage/services/webserver-cluster/main.tf</figcaption><pre><code data-lang="hcl">data "terraform_remote_state" "db" {
  backend = "s3"
  config = {
    bucket = "terraform-up-and-running-state"
    key    = "stage/data-stores/mysql/terraform.tfstate"
    region = "us-east-2"
  }
}

resource "aws_launch_configuration" "example" {
  image_id        = "ami-0fb653ca2d3203ac1"
  instance_type   = "t2.micro"
  security_groups = [aws_security_group.instance.id]

  # Render the script from a file instead of an inline heredoc
  user_data = templatefile("${path.module}/user-data.sh", {
    server_port = var.server_port
    db_address  = data.terraform_remote_state.db.outputs.address
    db_port     = data.terraform_remote_state.db.outputs.port
  })

  lifecycle { create_before_destroy = true }
}</code></pre></figure>
<figure class="code"><figcaption>user-data.sh</figcaption><pre><code data-lang="bash">#!/bin/bash
# ${...} here is filled in by templatefile, not by bash
cat &gt; index.html &lt;&lt;EOF
&lt;h1&gt;Hello, World&lt;/h1&gt;
&lt;p&gt;DB address: ${db_address}&lt;/p&gt;
&lt;p&gt;DB port: ${db_port}&lt;/p&gt;
EOF

nohup busybox httpd -f -p ${server_port} &amp;</code></pre></figure>
<figure class="code"><figcaption>terraform console</figcaption><pre><code data-lang="bash">$ terraform console          # read-only REPL against your state
&gt; format("%.3f", 3.14159265)
"3.142"
&gt; templatefile("user-data.sh", { server_port = 8080, db_address = "x", db_port = 3306 })</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges</b>
<ul>
<li><strong>Secrets still end up in state.</strong> <code>sensitive = true</code> hides the password in CLI output only. It is written to the state file in plain text, which is why the bucket must be encrypted and tightly permissioned. Chapter 6 goes deeper.</li>
<li><strong>Order of operations moves to you.</strong> With split state, the database must be applied before the cluster that reads it. Terraform no longer sees that dependency.</li>
<li><strong>Remote state exposes every output.</strong> Anyone who can read the state file for outputs can read the whole file. Many teams publish values to a parameter store instead and read those.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>Application code is stateless between deploys; you can always rebuild the binary from source. Infrastructure code cannot rebuild its state from source, because the mapping to real IDs exists nowhere else. Lose or corrupt it and Terraform forgets it owns anything.</p></div>

<div class="since"><b>Since the book</b>
<p>Terraform 1.10 added native S3 locking: set <code>use_lockfile = true</code> in the S3 backend and Terraform writes a <code>.tflock</code> object beside the state, with no DynamoDB table. The <code>dynamodb_table</code> argument is now deprecated. The S3 resource split shown above (separate versioning and encryption resources) is the AWS provider 4.x style and still current.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>Why does a new workspace's first <code>plan</code> want to create everything?</summary><p>A new workspace starts with an empty state file. Terraform decides what exists from state, so empty state means nothing exists as far as it knows, even though the same code is deployed in another workspace.</p></details>
<details class="q"><summary>Your backend bucket has versioning on. What does that buy you?</summary><p>Every state write keeps the previous revision. If a bad apply or a bug corrupts state, you restore an earlier object version instead of reconstructing the mapping by hand with <code>terraform import</code>.</p></details>
<details class="q"><summary>Stage and prod share one state file "to keep things simple". Name two concrete costs.</summary><p>One lock, so a slow apply in stage blocks a prod hotfix. One blast radius, so a mistake while testing in stage can change or destroy prod resources in the same run.</p></details>

</template>
<template id="t-chapter-4">
<p class="eyebrow">Chapter 4</p>
<h1>Reusable infrastructure with modules</h1>
<p class="lede">Stage and prod should be the same architecture at different sizes. Copy-pasting the folder gets you there once. Modules keep you there.</p>

<div class="model"><b>Mental model</b>
<p>A module is a function. Input variables are its parameters, resources are its body, locals are its private variables, outputs are its return value. Any folder of <code>.tf</code> files is a module. The one you run <code>apply</code> in is the <em>root module</em>; anything it calls with a <code>module</code> block is a <em>child</em> or reusable module.</p></div>

<h2>From a folder to a function</h2>
<p>Move the web cluster code out of <code>stage/services/webserver-cluster</code> into <code>modules/services/webserver-cluster</code>. Then do three things to it.</p>
<ol>
<li><strong>Remove the <code>provider</code> block.</strong> Providers are configured by the caller, in the root module. A reusable module that hard-codes a region or account cannot be reused.</li>
<li><strong>Turn every hard-coded name and size into an input variable.</strong> Two copies of the module in one account would otherwise collide on names like <code>terraform-asg-example</code>.</li>
<li><strong>Export what callers will need as outputs.</strong> A caller cannot reach inside a module; it sees only <code>module.NAME.OUTPUT</code>.</li>
</ol>
<div class="tabs">
<figure class="code"><figcaption>modules/…/variables.tf</figcaption><pre><code data-lang="hcl">variable "cluster_name" {
  description = "The name to use for all the cluster resources"
  type        = string
}
variable "db_remote_state_bucket" {
  description = "S3 bucket holding the database's remote state"
  type        = string
}
variable "db_remote_state_key" {
  description = "Path of the database's remote state in S3"
  type        = string
}
variable "instance_type" {
  description = "EC2 instance type to run (e.g. t2.micro)"
  type        = string
}
variable "min_size" { type = number }
variable "max_size" { type = number }</code></pre></figure>
<figure class="code"><figcaption>modules/…/main.tf (excerpt)</figcaption><pre><code data-lang="hcl"># Internal constants. Callers cannot override locals.
locals {
  http_port    = 80
  any_port     = 0
  any_protocol = "-1"
  tcp_protocol = "tcp"
  all_ips      = ["0.0.0.0/0"]
}

resource "aws_security_group" "alb" {
  name = "${var.cluster_name}-alb"
}

resource "aws_launch_configuration" "example" {
  image_id        = "ami-0fb653ca2d3203ac1"
  instance_type   = var.instance_type
  security_groups = [aws_security_group.instance.id]

  # path.module: the folder this file lives in, not the caller's folder
  user_data = templatefile("${path.module}/user-data.sh", {
    server_port = var.server_port
    db_address  = data.terraform_remote_state.db.outputs.address
    db_port     = data.terraform_remote_state.db.outputs.port
  })

  lifecycle { create_before_destroy = true }
}

resource "aws_autoscaling_group" "example" {
  launch_configuration = aws_launch_configuration.example.name
  vpc_zone_identifier  = data.aws_subnets.default.ids
  target_group_arns    = [aws_lb_target_group.asg.arn]
  health_check_type    = "ELB"
  min_size             = var.min_size
  max_size             = var.max_size

  tag {
    key                 = "Name"
    value               = var.cluster_name
    propagate_at_launch = true
  }
}</code></pre></figure>
<figure class="code"><figcaption>modules/…/outputs.tf</figcaption><pre><code data-lang="hcl">output "asg_name" {
  value       = aws_autoscaling_group.example.name
  description = "The name of the Auto Scaling Group"
}
output "alb_dns_name" {
  value       = aws_lb.example.dns_name
  description = "The domain name of the load balancer"
}
output "alb_security_group_id" {
  value       = aws_security_group.alb.id
  description = "Lets callers attach extra rules"
}</code></pre></figure>
<figure class="code"><figcaption>live/prod/…/main.tf</figcaption><pre><code data-lang="hcl">provider "aws" {
  region = "us-east-2"
}

module "webserver_cluster" {
  source = "../../../modules/services/webserver-cluster"

  cluster_name           = "webservers-prod"
  db_remote_state_bucket = "terraform-up-and-running-state"
  db_remote_state_key    = "prod/data-stores/mysql/terraform.tfstate"

  instance_type = "m4.large"
  min_size      = 2
  max_size      = 10
}

# Prod-only behaviour, wired to a module output
resource "aws_autoscaling_schedule" "scale_out_during_business_hours" {
  scheduled_action_name  = "scale-out-during-business-hours"
  min_size               = 2
  max_size               = 10
  desired_capacity       = 10
  recurrence             = "0 9 * * *"
  autoscaling_group_name = module.webserver_cluster.asg_name
}

# Pass-through output: re-export what the module returned
output "alb_dns_name" {
  value = module.webserver_cluster.alb_dns_name
}</code></pre></figure>
</div>
<p>After adding a module or changing its <code>source</code>, run <code>terraform init</code> again. It is the command that downloads modules as well as providers.</p>

<h2>Versioning: stage and prod should not share a working copy</h2>
<div class="model"><b>Mental model</b>
<p>If both environments point at the same folder on disk, every edit to the module is a change to production that nobody has tested. Give the module a version, as you would a library. Stage moves to the new version first. Prod moves when stage has proved it.</p></div>
<p>Put modules in their own Git repository, tag releases, and reference a tag in <code>source</code>. Use semantic versions: bump <strong>MAJOR</strong> for incompatible API changes, <strong>MINOR</strong> for backwards-compatible features, <strong>PATCH</strong> for backwards-compatible fixes.</p>

<section class="lab">

<figure class="code"><figcaption>releasing and pinning</figcaption><pre><code data-lang="bash"># In the modules repo
$ git tag -a "v0.0.2" -m "New user data script"
$ git push --follow-tags

# In live/stage: bump the ref, then init (re-download) and apply

# Private repo? Use SSH so Terraform reuses your Git credentials:

<h2>Two gotchas that only appear in modules</h2>
<h3>File paths</h3>
<p>Relative paths resolve from the folder where you run Terraform, which for a child module is somebody else's folder. Use a path reference.</p>
<div class="tablewrap wide"><table>
<thead><tr><th>Reference</th><th>Resolves to</th><th>Use for</th></tr></thead>
<tbody>
<tr><td><code>path.module</code></td><td>The folder containing the file where the expression is written</td><td>Files shipped with a module, such as <code>user-data.sh</code></td></tr>
<tr><td><code>path.root</code></td><td>The root module's folder</td><td>Files the caller owns</td></tr>
<tr><td><code>path.cwd</code></td><td>The shell's current directory</td><td>Rare: when Terraform is run from somewhere other than the root module</td></tr>
</tbody></table></div>

<h3>Inline blocks versus separate resources</h3>
<p>Some resources let you define children either inline or as their own resource: security group rules, route table routes, network ACL rules. The two styles are both authoritative over the same list, so mixing them makes them overwrite each other. In a module, always use the separate resource. It is the only form a caller can add to from outside.</p>

<div class="tablewrap wide"><table>
<thead><tr><th>Parent with inline blocks</th><th>Separate resource to use in modules</th></tr></thead>
<tbody>
<tr><td><code>aws_security_group</code> (<code>ingress</code>, <code>egress</code>)</td><td><code>aws_security_group_rule</code></td></tr>

<div class="edge"><b>Sharp edges</b>
<ul>
<li><strong>Tags move; pins should not.</strong> A Git tag can be deleted and re-pushed. Treat released tags as immutable, and never point prod at a branch.</li>
<li><strong>Stage is no longer free.</strong> Pinning means every module change is at least three steps: release, bump stage, bump prod. That friction is the safety mechanism working.</li>
<li><strong>Module network isolation is not environment isolation.</strong> The examples deploy stage and prod into the same default VPC. Real environments get separate VPCs, and preferably separate accounts.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>A library bug shows up when you deploy the app that uses it. A module bug shows up when someone next runs <code>apply</code> in any folder that references it, which may be weeks later and during an unrelated change. Version pins make that moment explicit and reviewable.</p></div>

<div class="since"><b>Since the book</b>
<p>The AWS provider now offers <code>aws_vpc_security_group_ingress_rule</code> and <code>aws_vpc_security_group_egress_rule</code>, one rule per resource, and recommends them over <code>aws_security_group_rule</code>. The principle is the same: separate resources in modules, never inline blocks.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>Why keep <code>provider</code> blocks out of reusable modules?</summary><p>The provider configuration decides region, account and credentials. If the module fixes those, callers cannot deploy it elsewhere, and removing a module that owns its provider leaves Terraform unable to destroy the module's resources.</p></details>
<details class="q"><summary>The module uses <code>file("user-data.sh")</code> and works when you test it inside its own folder. What happens when prod calls it?</summary><p>The path resolves against prod's folder, where the file does not exist, and the plan fails. <code>"${path.module}/user-data.sh"</code> fixes it.</p></details>
<details class="q"><summary>You add a required variable to a module. Which part of the version number changes?</summary><p>MAJOR. Existing callers break until they supply the new variable. Giving it a default would make the change backwards compatible and a MINOR bump.</p></details>

</template>
<template id="t-chapter-5">
<p class="eyebrow">Chapter 5</p>
<h1>Loops, if-statements, deployment and gotchas</h1>
<p class="lede">HCL is declarative, so it has no <code>for</code> statement and no <code>if</code> statement. It has ways to say "this many", "one per item" and "only when". Each has a different identity model, and identity is where the bugs are.</p>

<div class="model"><b>Mental model</b>
<p>Every resource instance has an address, and state is keyed by address. <code>count</code> gives instances a <em>position</em>: <code>[0]</code>, <code>[1]</code>, <code>[2]</code>. <code>for_each</code> gives them a <em>name</em>: <code>["neo"]</code>, <code>["trinity"]</code>. Remove something from the middle and positions shift while names do not. Terraform compares by address, so a shifted position looks like a different resource.</p></div>

<h2>Loops</h2>
<div class="tablewrap wide"><table>
<thead><tr><th>Construct</th><th>Loops over</th><th>Produces</th><th>Use when</th></tr></thead>
<tbody>
<tr><td><code>count</code></td><td>A number</td><td>A list of resources or modules</td><td>Identical copies, or zero-or-one conditionals</td></tr>
<tr><td><code>for_each</code></td><td>A set or map</td><td>A map of resources, modules, or (via <code>dynamic</code>) inline blocks</td><td>Distinct items that may come and go</td></tr>
<tr><td><code>for</code> expression</td><td>A list or map</td><td>A new list or map value</td><td>Transforming and filtering data</td></tr>
<tr><td><code>for</code> string directive</td><td>A list or map</td><td>Text inside a string</td><td>Rendering templates</td></tr>
</tbody></table></div>

<div class="tabs">
<figure class="code"><figcaption>count</figcaption><pre><code data-lang="hcl">variable "user_names" {
  type    = list(string)
  default = ["neo", "trinity", "morpheus"]
}

resource "aws_iam_user" "example" {
  count = length(var.user_names)
  name  = var.user_names[count.index]
}

# The resource is now a list
output "first_arn" { value = aws_iam_user.example[0].arn }
output "all_arns"  { value = aws_iam_user.example[*].arn }   # splat</code></pre></figure>
<figure class="code"><figcaption>for_each</figcaption><pre><code data-lang="hcl">resource "aws_iam_user" "example" {
  for_each = toset(var.user_names)    # resources need a set or map, not a list
  name     = each.value               # for a set, each.key == each.value
}

# The resource is now a map keyed by name
output "all_users" { value = aws_iam_user.example }
output "all_arns"  { value = values(aws_iam_user.example)[*].arn }</code></pre></figure>
<figure class="code"><figcaption>dynamic blocks</figcaption><pre><code data-lang="hcl">variable "custom_tags" {
  type    = map(string)
  default = {}
}

resource "aws_autoscaling_group" "example" {
  # ...
  tag {
    key                 = "Name"
    value               = var.cluster_name
    propagate_at_launch = true
  }

  # One inline tag block per map entry
  dynamic "tag" {
    for_each = var.custom_tags

    content {
      key                 = tag.key
      value               = tag.value
      propagate_at_launch = true
    }
  }
}</code></pre></figure>
<figure class="code"><figcaption>for expressions</figcaption><pre><code data-lang="hcl">variable "hero_thousand_faces" {
  type    = map(string)
  default = { neo = "hero", trinity = "love interest", morpheus = "mentor" }
}

# list -&gt; list, with a filter
output "short_upper" { value = [for n in var.user_names : upper(n) if length(n) &lt; 5] }
# =&gt; ["NEO"]

# map -&gt; list
output "bios" { value = [for name, role in var.hero_thousand_faces : "${name} is the ${role}"] }

# map -&gt; map (curly braces and =&gt;)
output "upper_roles" { value = { for name, role in var.hero_thousand_faces : upper(name) =&gt; upper(role) } }</code></pre></figure>
</div>

<h2>Conditionals</h2>
<p>A conditional resource is a loop that runs zero or one times.</p>
<div class="tabs">
<figure class="code"><figcaption>if</figcaption><pre><code data-lang="hcl">variable "enable_autoscaling" {
  type = bool
}

resource "aws_autoscaling_schedule" "scale_out_during_business_hours" {
  count = var.enable_autoscaling ? 1 : 0     # the ternary is the if

  scheduled_action_name  = "${var.cluster_name}-scale-out-during-business-hours"
  min_size               = 2
  max_size               = 10
  desired_capacity       = 10
  recurrence             = "0 9 * * *"
  autoscaling_group_name = aws_autoscaling_group.example.name
}</code></pre></figure>
<figure class="code"><figcaption>if-else and safe outputs</figcaption><pre><code data-lang="hcl">variable "give_neo_cloudwatch_full_access" {
  type = bool
}

resource "aws_iam_user_policy_attachment" "neo_full" {
  count      = var.give_neo_cloudwatch_full_access ? 1 : 0
  user       = aws_iam_user.example[0].name
  policy_arn = aws_iam_policy.cloudwatch_full_access.arn
}

resource "aws_iam_user_policy_attachment" "neo_read_only" {
  count      = var.give_neo_cloudwatch_full_access ? 0 : 1
  user       = aws_iam_user.example[0].name
  policy_arn = aws_iam_policy.cloudwatch_read_only.arn
}

# Exactly one of the two lists has an element. concat joins them,
# one() returns the single element (or null for an empty list).
output "neo_cloudwatch_policy_arn" {
  value = one(concat(
    aws_iam_user_policy_attachment.neo_full[*].policy_arn,
    aws_iam_user_policy_attachment.neo_read_only[*].policy_arn
  ))
}</code></pre></figure>
<figure class="code"><figcaption>conditional dynamic block</figcaption><pre><code data-lang="hcl">dynamic "tag" {
  # for expression filters; for_each loops over what is left
  for_each = {
    for key, value in var.custom_tags :
    key =&gt; upper(value)
    if key != "Name"
  }

  content {
    key                 = tag.key
    value               = tag.value
    propagate_at_launch = true
  }
}</code></pre></figure>
</div>
<p>Prefer <code>count</code> for a simple on/off resource. Prefer <code>for_each</code> whenever items have identity. Inside strings, use the <code>if</code> and <code>for</code> directives.</p>

<h2>Zero-downtime deployment</h2>
<p>The module gains two inputs, <code>ami</code> and <code>server_text</code>, so a deploy is a change to a variable. The question is how the servers get swapped.</p>
<div class="model"><b>Mental model</b>
<p>Terraform's default replacement order is destroy, then create. For anything serving traffic you want the reverse, and you want the new thing to prove it is healthy before the old thing goes. The book's pattern ties the ASG's name to the launch configuration's name, so a new launch configuration forces a new ASG, and <code>create_before_destroy</code> plus <code>min_elb_capacity</code> make Terraform wait for the new servers to pass load balancer health checks before removing the old ASG.</p></div>

<div class="tabs">
<figure class="code"><figcaption>create_before_destroy pattern</figcaption><pre><code data-lang="hcl">resource "aws_launch_configuration" "example" {
  image_id        = var.ami
  instance_type   = var.instance_type
  security_groups = [aws_security_group.instance.id]

  user_data = templatefile("${path.module}/user-data.sh", {
    server_port = var.server_port
    server_text = var.server_text
  })

  lifecycle { create_before_destroy = true }
}

resource "aws_autoscaling_group" "example" {
  # New launch configuration =&gt; new name =&gt; this ASG is replaced
  name = "${var.cluster_name}-${aws_launch_configuration.example.name}"

  launch_configuration = aws_launch_configuration.example.name
  vpc_zone_identifier  = data.aws_subnets.default.ids
  target_group_arns    = [aws_lb_target_group.asg.arn]
  health_check_type    = "ELB"

  min_size = var.min_size
  max_size = var.max_size

  # Wait for this many instances to pass health checks before
  # the replacement counts as created
  min_elb_capacity = var.min_size

  lifecycle { create_before_destroy = true }
}</code></pre></figure>
<figure class="code"><figcaption>instance refresh</figcaption><pre><code data-lang="hcl">resource "aws_autoscaling_group" "example" {
  name                 = var.cluster_name           # stable name: updated in place
  launch_configuration = aws_launch_configuration.example.name
  vpc_zone_identifier  = data.aws_subnets.default.ids
  target_group_arns    = [aws_lb_target_group.asg.arn]
  health_check_type    = "ELB"
  min_size             = var.min_size
  max_size             = var.max_size

  # AWS replaces instances in batches, keeping this share healthy
  instance_refresh {
    strategy = "Rolling"
    preferences {
      min_healthy_percentage = 50
    }
  }
}</code></pre></figure>
</div>

<h2>Refactoring without destroying</h2>
<p>To Terraform, an identifier is identity. Rename <code>aws_security_group.instance</code> to <code>cluster_instance</code> and the plan reads: delete the old one, create a new one. For a security group in use, or a database, that is an outage. A <code>moved</code> block tells Terraform the old address and the new address are the same object, and it updates state as part of a normal, reviewable plan. It replaces the manual, easy-to-forget <code>terraform state mv</code>.</p>

<div class="edge"><b>Gotchas collected</b>
<ul>
<li><strong><code>count</code> and <code>for_each</code> values must be known at plan time.</strong> You can use variables, data sources and literals. You cannot use an attribute that only exists after apply, such as a new resource's ID, because Terraform has to know how many instances to plan.</li>
<li><strong>No <code>count</code> inside inline blocks.</strong> Use a <code>dynamic</code> block with <code>for_each</code>.</li>
<li><strong>The ASG replacement trick resets size.</strong> Every deploy creates a fresh ASG at <code>min_size</code>, discarding whatever auto scaling had scaled it to. A scheduled action or policy that raised capacity is undone until it fires again.</li>
<li><strong>Valid plans can fail.</strong> <code>plan</code> only knows what is in state. If someone created an IAM user by hand with the same name, the plan says "1 to add" and the apply fails with "already exists". Once you use Terraform for something, use only Terraform, and bring existing resources under management with <code>terraform import</code>.</li>
<li><strong>Some parameters are immutable.</strong> Changing them means replacement even if the identifier is unchanged. Always read the plan for <code>forces replacement</code>, and use <code>create_before_destroy</code> where a gap would hurt.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>Renaming a variable in application code is free; the compiler does not care what things were called yesterday. Infrastructure has yesterday baked in. A rename is a migration, and you need the same care you would give a database schema change.</p></div>

<div class="since"><b>Since the book</b>
<p>Terraform 1.5 added <code>import</code> blocks, so adopting an existing resource is now a planned, reviewable change like <code>moved</code>. Terraform 1.7 added <code>removed</code> blocks, which take something out of state without destroying it. And with launch templates, <code>instance_refresh</code> on a stable ASG is the usual rollout path; the name-swap pattern is mostly of historical interest but remains the clearest illustration of <code>create_before_destroy</code>.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>With <code>count</code>, you remove the first name from a list of five. How many resources change?</summary><p>All five. Indexes 0 to 3 each get the next name along (four renames or replacements), and index 4 is destroyed.</p></details>
<details class="q"><summary>Why can't you write <code>count = length(aws_instance.app[*].id)</code> when those instances do not exist yet?</summary><p>Their IDs are unknown until apply, so Terraform cannot decide during plan how many instances of your resource to show. It refuses and tells you the value cannot be determined until apply.</p></details>
<details class="q"><summary>What does <code>%{~ endfor ~}</code> strip?</summary><p>All whitespace, newlines included, immediately before and immediately after the directive. Use one tilde to strip a single side.</p></details>

</template>

<p class="eyebrow">Chapter 6</p>
<h1>Managing secrets with Terraform</h1>
<p class="lede">A database password has to exist somewhere. The work is deciding where, who can read it, and making sure Terraform does not quietly copy it into four other places.</p>

<div class="model"><b>Mental model</b>
<p>Two rules. First, never store a secret in plain text, and that includes your <code>.tf</code> files and your Git history. Second, remember that Terraform <em>handles</em> every secret you give it, so the secret also appears wherever Terraform writes things down: the plan output, the saved plan file and the state file. Securing the source is half the job. Securing those sinks is the other half.</p></div>

<h2>What kinds of secret, stored how</h2>
<div class="tablewrap wide"><table>
<thead><tr><th>Question</th><th>Options</th><th>Why it matters</th></tr></thead>
<tbody>
<tr><td>Whose secret?</td><td>Personal (your logins), customer (your users' passwords, PII), infrastructure (DB passwords, API keys, TLS certificates)</td><td>Each needs a different tool. This chapter is about infrastructure secrets</td></tr>
<tr><td>Stored where?</td><td>Encrypted files in version control (sops, git-crypt, KMS-encrypted blobs), or a centralised secret store (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, Google Secret Manager)</td><td>Files travel with the code. A store gives you one place to audit, rotate and revoke</td></tr>
<tr><td>Reached how?</td><td>API, CLI, UI</td><td>Terraform and apps need an API. Humans need a CLI or UI</td></tr>
</tbody></table></div>
<p>Either way there is still one secret at the bottom: the key that decrypts the file, or the credential that logs in to the store. Good setups make that last secret a short-lived identity instead of a string someone copied.</p>

<h2>Secrets for providers: how Terraform logs in</h2>
<p>For a person at a laptop, use environment variables fed by a secrets manager CLI, so the keys are never in a dotfile. For a machine there are three options.</p>
<div class="tablewrap wide"><table>
<thead><tr><th></th><th>Stored credentials</th><th>IAM role</th><th>OIDC</th></tr></thead>
<tbody>
<tr><td>Example</td><td>Access keys pasted into a hosted CI's secret settings</td><td>CI server running on an EC2 instance</td><td>GitHub Actions assuming a role</td></tr>
<tr><td>No manual credential management</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>No permanent credentials</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Works inside the cloud provider</td><td>No benefit</td><td>Yes</td><td>Not needed</td></tr>
<tr><td>Works from outside the cloud provider</td><td>Yes</td><td>No</td><td>Yes</td></tr>
</tbody></table></div>
<div class="tabs">
<figure class="code"><figcaption>OIDC: let GitHub Actions assume a role</figcaption><pre><code data-lang="hcl"># 1. Tell AWS to trust GitHub's identity provider
resource "aws_iam_openid_connect_provider" "github_actions" {
  url             = "https://token.actions.githubusercontent.com"
  client_id_list  = ["sts.amazonaws.com"]
  thumbprint_list = [data.tls_certificate.github.certificates[0].sha1_fingerprint]
}

data "tls_certificate" "github" {
  url = "https://token.actions.githubusercontent.com"
}

# 2. A role that only specific repos and branches may assume
data "aws_iam_policy_document" "assume_role_policy" {
  statement {
    actions = ["sts:AssumeRoleWithWebIdentity"]
    effect  = "Allow"

    principals {
      identifiers = [aws_iam_openid_connect_provider.github_actions.arn]
      type        = "Federated"
    }

    condition {
      test     = "StringEquals"
      variable = "token.actions.githubusercontent.com:sub"
      values   = ["repo:acme/live:ref:refs/heads/main"]   # be this specific
    }
  }
}

resource "aws_iam_role" "terraform_ci" {
  name_prefix        = "terraform-ci"
  assume_role_policy = data.aws_iam_policy_document.assume_role_policy.json
}</code></pre></figure>
<figure class="code"><figcaption>.github/workflows/terraform.yml</figcaption><pre><code data-lang="yaml">name: Terraform Apply
on:
  push:
    branches: ["main"]

permissions:
  id-token: write          # lets the job request an OIDC token
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/terraform-ci
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init &amp;&amp; terraform apply -auto-approve
# No access keys anywhere. The job gets credentials that expire in an hour.</code></pre></figure>
<figure class="code"><figcaption>IAM role for an EC2-hosted CI server</figcaption><pre><code data-lang="hcl">data "aws_iam_policy_document" "assume_role" {

    effect  = "Allow"

    }

}

resource "aws_iam_role" "ci" {

}

  role = aws_iam_role.ci.name
}

  iam_instance_profile = aws_iam_instance_profile.ci.name
}
# Terraform on this box finds temporary credentials through the
