<h2>Secrets for resources: how the password reaches the database</h2>
<div class="tablewrap wide"><table>
<thead><tr><th></th><th>Environment variables</th><th>Encrypted files</th><th>Central secret store</th></tr></thead>
<tbody>
<tr><td>Plain text kept out of code</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Secret management itself defined as code</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Audit log of key access</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Audit log per secret</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Easy rotation and revocation</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Easy to standardise across teams</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Secrets versioned with the code</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Easy to add a secret</td><td>Yes</td><td>No</td><td>Yes</td></tr>
</tbody></table></div>
<div class="tabs">
<figure class="code"><figcaption>1. Environment variables</figcaption><pre><code data-lang="hcl">variable "db_username" {
  type      = string
  sensitive = true
}
variable "db_password" {
  type      = string
  sensitive = true
}

resource "aws_db_instance" "example" {
  identifier_prefix   = "terraform-up-and-running"
  engine              = "mysql"
  allocated_storage   = 10
  instance_class      = "db.t2.micro"
  skip_final_snapshot = true
  db_name             = var.db_name

  username = var.db_username
  password = var.db_password
}

# $ export TF_VAR_db_username=(value from your password manager CLI)
# $ export TF_VAR_db_password=(value from your password manager CLI)
# A leading space keeps the line out of bash history on many setups.</code></pre></figure>
<figure class="code"><figcaption>2. KMS-encrypted file</figcaption><pre><code data-lang="hcl"># db-creds.yml holds   username: admin / password: ...
# and is encrypted with:  aws kms encrypt --key-id alias/kms-cmk-example ...
# Only the ciphertext, db-creds.yml.encrypted, is committed.

data "aws_kms_secrets" "creds" {
  secret {
    name    = "db"
    payload = file("${path.module}/db-creds.yml.encrypted")
  }
}

locals {
  db_creds = yamldecode(data.aws_kms_secrets.creds.plaintext["db"])
}

resource "aws_db_instance" "example" {
  # ...
  username = local.db_creds.username
  password = local.db_creds.password
}</code></pre></figure>
<figure class="code"><figcaption>3. AWS Secrets Manager</figcaption><pre><code data-lang="hcl"># The secret "db-creds" was stored once, by hand or by another module:
#   {"username": "admin", "password": "..."}

data "aws_secretsmanager_secret_version" "creds" {
  secret_id = "db-creds"
}

locals {
  db_creds = jsondecode(data.aws_secretsmanager_secret_version.creds.secret_string)
}

resource "aws_db_instance" "example" {
  # ...
  username = local.db_creds.username
  password = local.db_creds.password
}</code></pre></figure>
</div>

<h2>The two sinks people forget</h2>
<h3>State files</h3>
<p>Whatever route the secret took in, it is stored in <code>terraform.tfstate</code> in plain text. <code>sensitive = true</code> does not change that. So the state backend needs encryption at rest, encryption in transit, and access limited to the people and roles who would be allowed to read the secret directly.</p>
<h3>Plan files</h3>
<p>A plan saved with <code>-out</code> contains the full values, secrets included, and is not encrypted. If your pipeline passes it between jobs, treat it exactly like state.</p>
<figure class="code"><figcaption>plan files</figcaption><pre><code data-lang="bash">$ terraform plan -out=example.plan      # binary file, contains every value
$ terraform apply example.plan           # applies exactly what was reviewed

$ terraform show example.plan            # anyone holding the file can do this
  # aws_db_instance.example will be created
  + password = "the-real-password"

# Encrypt it in transit and at rest, restrict who can fetch it, and delete it after apply.</code></pre></figure>

<div class="edge"><b>Sharp edges</b>
<ul>
<li><strong><code>sensitive</code> is display-only.</strong> It redacts console and log output. It does nothing for state, plan files or the provider's own debug logs.</li>
<li><strong>Git never forgets.</strong> A secret committed once is in history even after you delete the line. Rotate it; do not just remove it.</li>
<li><strong>Environment variables push the problem elsewhere.</strong> They keep the secret out of code, but where it lives before it reaches the shell is unmanaged, unaudited and different on every laptop.</li>
<li><strong>Least privilege for the pipeline.</strong> A CI role that can run <code>apply</code> can usually do anything. Scope its trust policy to a branch, and split plan-only from apply roles where you can.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>An app reads a secret at runtime and holds it in memory. Terraform reads it and then persists it, because it must remember what it configured. That makes the tooling around Terraform (state, plans, logs) part of your secret-handling surface.</p></div>

<div class="since"><b>Since the book</b>
<p>Terraform 1.10 introduced <em>ephemeral</em> values and resources, and 1.11 added <em>write-only</em> arguments on some resources (an RDS password among them). A secret passed that way is used during apply and never written to state or plan. Where your provider supports it, this closes the state-file leak described above.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>You marked <code>db_password</code> as <code>sensitive</code>. Where can the password still be read?</summary><p>In the state file, in any saved plan file, and in the source you fed it from. The flag only stops Terraform printing it.</p></details>
<details class="q"><summary>Why is OIDC better than access keys stored in CI settings?</summary><p>There is no long-lived secret to leak or rotate. The CI job proves its identity with a signed token, AWS checks the repository and branch against the role's trust policy, and hands back credentials that expire within the hour.</p></details>
<details class="q"><summary>When would you choose encrypted files over a secret store?</summary><p>When you want secrets versioned and reviewed alongside the code and you have few of them. You give up per-secret audit logs and easy rotation, and every change means decrypt, edit, re-encrypt.</p></details>

</template>
<template id="t-chapter-7">
<p class="eyebrow">Chapter 7</p>
<h1>Working with multiple providers</h1>
<p class="lede">So far everything went to one region of one AWS account through one provider block. Real systems span regions, accounts and platforms. Terraform's answer to all three is the same mechanism.</p>

<div class="model"><b>Mental model</b>
<p>Terraform core knows nothing about AWS. It knows how to build a graph and talk to plugins over RPC. A <em>provider</em> is a separate executable that knows one platform's API. A <code>provider</code> block is a configured <em>instance</em> of that plugin: one set of credentials, one region, one endpoint. Every resource belongs to exactly one provider instance. Multi-region, multi-account and multi-cloud all reduce to "configure more instances and say which resource uses which".</p></div>

<h2>How providers get onto your machine</h2>
<p><code>terraform init</code> reads <code>required_providers</code>, downloads each plugin from the Terraform Registry into <code>.terraform/</code>, and records the exact version and checksums in <code>.terraform.lock.hcl</code>. Resource type prefixes map to providers: <code>aws_instance</code> belongs to the provider with local name <code>aws</code>.</p>
<figure class="code"><figcaption>required_providers</figcaption><pre><code data-lang="hcl">terraform {
  required_version = "&gt;= 1.0.0, &lt; 2.0.0"

  required_providers {
    aws = {
      source  = "hashicorp/aws"     # [hostname/]namespace/type; hostname defaults to the public registry
      version = "~&gt; 4.0"            # any 4.x. Pin the major version at least
    }
    kubernetes = {
      source  = "hashicorp/kubernetes"
      version = "~&gt; 2.0"
    }
  }
}</code></pre></figure>
<p>Always declare <code>required_providers</code>. Without it Terraform guesses <code>hashicorp/&lt;prefix&gt;</code> and takes the newest version, which works until the day a major release ships. Commit the lock file so everyone gets the same build.</p>

<h2>Several copies of one provider: aliases</h2>
<p>Two <code>provider "aws"</code> blocks would be ambiguous, so each extra one gets an <code>alias</code>. Resources and data sources choose with <code>provider = aws.NAME</code>. Modules choose with a <code>providers</code> map.</p>

<section class="lab">
<header><span class="tag">Lab</span><h3>Multi-region, multi-account and multi-provider topology explorer</h3>
<p>Pick a topology. Change the wiring and watch the generated code. Click any box to trace what it depends on and what depends on it.</p></header>
<div class="body">
<div class="ctl">
  <span class="field"><span class="lbl">Topology</span><span data-h="topo"></span></span>
  <span class="field" data-h="f-r1"><label for="c7-r1">Primary region</label><select id="c7-r1"><option>us-east-2</option><option>us-west-1</option><option>eu-west-1</option></select></span>
  <span class="field" data-h="f-r2"><label for="c7-r2">Replica region</label><select id="c7-r2"><option>us-west-1</option><option>us-east-2</option><option>eu-west-1</option></select></span>
  <button class="chip" data-h="pass" aria-pressed="true">Pass providers into the module</button>
  <button class="btn ghost" data-h="clear">Clear trace</button>
</div>
<div class="pane"><h4 data-h="gtitle">Topology</h4><div data-h="graph"></div><p class="note" data-h="trace"></p></div>
<div class="grid2">
  <div><div class="lbl" style="margin-bottom:6px">Root module</div><pre data-h="code" style="max-height:480px"></pre></div>
  <div class="stack"><div class="lbl">terraform plan</div><pre data-h="plan"></pre><div class="msg" data-h="msg"></div></div>
</div>
</div>
</section>

<h3>Inside a reusable module</h3>
<p>A reusable module must not contain <code>provider</code> blocks. If it needs more than one provider instance, it declares the aliases it expects with <code>configuration_aliases</code>, and the caller supplies them.</p>
<div class="tabs">
<figure class="code"><figcaption>modules/multi-account/main.tf</figcaption><pre><code data-lang="hcl">terraform {
  required_providers {
    aws = {
      source                = "hashicorp/aws"
      version               = "~&gt; 4.0"
      configuration_aliases = [aws.parent, aws.child]   # "I need two; you provide them"
    }
  }
}

data "aws_caller_identity" "parent" {
  provider = aws.parent
}

data "aws_caller_identity" "child" {
  provider = aws.child
}

output "parent_account_id" { value = data.aws_caller_identity.parent.account_id }
output "child_account_id"  { value = data.aws_caller_identity.child.account_id }</code></pre></figure>
<figure class="code"><figcaption>caller</figcaption><pre><code data-lang="hcl">provider "aws" {
  region = "us-east-2"
  alias  = "parent"
}

provider "aws" {
  region = "us-east-2"
  alias  = "child"

  assume_role {
    role_arn = "arn:aws:iam::222222222222:role/OrganizationAccountAccessRole"
  }
}

module "multi_account_example" {
  source = "../../modules/multi-account"

  providers = {
    aws.parent = aws.parent     # module's name = caller's instance
    aws.child  = aws.child
  }
}</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges of aliases</b>
<ul>
<li><strong>Multi-region is an architecture problem first.</strong> Terraform makes deploying to two regions easy. It does nothing about replication lag, latency between regions, unique ID generation or data-residency law. Decide active-passive or active-active before writing HCL.</li>
<li><strong>Aliases couple what you wanted separate.</strong> A module spanning two regions lives in one state file, so a regional outage blocks <code>plan</code> for both. Most of the time, separate root modules per region or account give better isolation, and aliases are best kept for things that are inherently cross-boundary: a replica, a peering connection, an IAM role assumed across accounts.</li>
<li><strong>Same code, different AMI IDs.</strong> AMI IDs are per region. Look them up with a <code>data "aws_ami"</code> source using the matching provider instead of hard-coding.</li>
</ul></div>

<h2>Different providers together: AWS and Kubernetes</h2>
<p>The same Docker image can run on your laptop and in a cluster, which removes "works on my machine". Kubernetes runs those images: you give it a <em>Deployment</em> (which image, how many replicas, how to roll out) and a <em>Service</em> (a stable endpoint in front of them), and its control loop keeps reality matched to that description.</p>
<p>Terraform's <code>kubernetes</code> provider turns those objects into resources. With it you can create an EKS cluster using the <code>aws</code> provider and deploy an app into it using the <code>kubernetes</code> provider, in one graph. Select the third topology in the lab above to trace it.</p>
<div class="tabs">
<figure class="code"><figcaption>modules/services/k8s-app/main.tf</figcaption><pre><code data-lang="hcl">locals {
  pod_labels = { app = var.name }
}

resource "kubernetes_deployment" "app" {
  metadata {
    name = var.name
  }

  spec {
    replicas = var.replicas

    template {
      metadata {
        labels = local.pod_labels
      }
      spec {
        container {
          name  = var.name
          image = var.image

          port {
            container_port = var.container_port
          }

          dynamic "env" {
            for_each = var.environment_variables
            content {
              name  = env.key
              value = env.value
            }
          }
        }
      }
    }

    selector {
      match_labels = local.pod_labels
    }
  }
}

resource "kubernetes_service" "app" {
  metadata {
    name = var.name
  }

  spec {
    type = "LoadBalancer"       # on EKS this creates an AWS load balancer
    port {
      port        = 80
      target_port = var.container_port
      protocol    = "TCP"
    }
    selector = local.pod_labels
  }
}</code></pre></figure>
<figure class="code"><figcaption>modules/services/eks-cluster/main.tf (excerpt)</figcaption><pre><code data-lang="hcl">resource "aws_eks_cluster" "cluster" {
  name     = var.name
  role_arn = aws_iam_role.cluster.arn
  version  = "1.21"

  vpc_config {
    subnet_ids = data.aws_subnets.default.ids
  }

  # The IAM permissions must exist before, and be deleted after, the cluster
  depends_on = [aws_iam_role_policy_attachment.AmazonEKSClusterPolicy]
}

resource "aws_eks_node_group" "nodes" {
  cluster_name    = aws_eks_cluster.cluster.name
  node_group_name = var.name
  node_role_arn   = aws_iam_role.node_group.arn
  subnet_ids      = data.aws_subnets.default.ids
  instance_types  = var.instance_types

  scaling_config {
    min_size     = var.min_size
    max_size     = var.max_size
    desired_size = var.desired_size
  }
}

output "cluster_endpoint" { value = aws_eks_cluster.cluster.endpoint }
output "cluster_certificate_authority" { value = aws_eks_cluster.cluster.certificate_authority }</code></pre></figure>
<figure class="code"><figcaption>examples/kubernetes-eks/main.tf</figcaption><pre><code data-lang="hcl">provider "aws" {
  region = "us-east-2"
}

module "eks_cluster" {
  source = "../../modules/services/eks-cluster"

  name           = "example-eks-cluster"
  min_size       = 1
  max_size       = 2
  desired_size   = 1
  instance_types = ["t3.small"]   # smaller types run out of pod IP addresses
}

# Configure the kubernetes provider from the cluster the aws provider just made
provider "kubernetes" {
  host                   = module.eks_cluster.cluster_endpoint
  cluster_ca_certificate = base64decode(module.eks_cluster.cluster_certificate_authority[0].data)
  token                  = data.aws_eks_cluster_auth.cluster.token
}

data "aws_eks_cluster_auth" "cluster" {
  name = module.eks_cluster.cluster_name
}

module "simple_webapp" {
  source = "../../modules/services/k8s-app"

  name           = "simple-webapp"
  image          = "training/webapp"
  replicas       = 2
  container_port = 5000

  environment_variables = {
    PROVIDER = "Terraform"
  }

  depends_on = [module.eks_cluster]   # wait for nodes before scheduling pods
}

output "service_endpoint" {
  value = module.simple_webapp.service_endpoint
}</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges of mixing providers</b>
<ul>
<li><strong>A provider configured from a resource is fragile.</strong> The <code>kubernetes</code> provider block above depends on a cluster that may not exist yet, or may be about to be replaced. It works for a first apply and can fail confusingly later. In production, put the cluster and the apps in separate root modules and separate state.</li>
<li><strong>Side-effect resources live outside state.</strong> The <code>LoadBalancer</code> Service makes Kubernetes create an AWS load balancer. Terraform does not track it. Destroy the cluster without first deleting the Service and that load balancer is orphaned, along with its bill.</li>
<li><strong>Multi-cloud in one module is rare for good reason.</strong> It couples the availability of your <code>plan</code> to every cloud involved. One root module per cloud is the common pattern.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>In an application, calling two APIs from one function is ordinary. In Terraform, each provider instance is a trust boundary with its own credentials, and each root module is a failure domain. Combining them is a design decision about blast radius, not just a convenience.</p></div>

<div class="since"><b>Since the book</b>
<p>Kubernetes 1.21 and AWS provider 4.x are long out of support, so pin current versions when you try this. Newer major releases of the AWS provider also accept a <code>region</code> argument on most resources, which removes some uses of aliases for multi-region work. Multi-account still needs one provider instance per account.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>A module declares <code>configuration_aliases = [aws.parent, aws.child]</code> and the caller passes no <code>providers</code> map. What happens?</summary><p>Terraform reports that the module requires provider configurations the caller did not supply. Aliased configurations are never inherited implicitly; only the default, un-aliased provider is.</p></details>
<details class="q"><summary>Why does the lock file matter more once you have several providers?</summary><p>Each provider releases on its own schedule. Without a committed lock file, two engineers running <code>init</code> a week apart can get different builds of any of them and see different plans from the same code.</p></details>
<details class="q"><summary>You destroy the EKS example and find a load balancer still running. Why?</summary><p>Kubernetes created it in response to the Service of type <code>LoadBalancer</code>. Terraform only tracked the Service. If the cluster went away before the Service was deleted cleanly, nothing was left to remove the load balancer.</p></details>

</template>
<template id="t-chapter-8">
<p class="eyebrow">Chapter 8</p>
<h1>Production-grade Terraform code</h1>
<p class="lede">Deploying a server takes minutes. Deploying one you would bet the company on takes months. The gap is a long list of unglamorous work, and the craft is in knowing the list and building it from small, checked pieces.</p>

<div class="model"><b>Mental model</b>
<p>"Production-grade" means the infrastructure will not fall over when traffic rises, will not lose data in an outage, and will not leak data in an attack. You get there the way you build any large system: small modules with narrow interfaces, composed like functions, each with a contract that fails early and loudly when it is misused.</p></div>

<h2>Why it always takes longer</h2>
<div class="tablewrap wide"><table>
<thead><tr><th>Type of infrastructure</th><th>Example</th><th>Time from scratch</th></tr></thead>
<tbody>
<tr><td>Managed service</td><td>Amazon RDS</td><td>1–2 weeks</td></tr>
<tr><td>Self-managed distributed system, stateless</td><td>Node.js apps in an ASG</td><td>2–4 weeks</td></tr>
<tr><td>Self-managed distributed system, stateful</td><td>Elasticsearch cluster</td><td>2–4 months</td></tr>
<tr><td>Entire architecture</td><td>Apps, data stores, load balancers, monitoring</td><td>6–36 months</td></tr>
</tbody></table></div>
<p>Three reasons. The tools are young and still changing under you. The work is full of <em>yak shaving</em>: fixing a TLS issue requires upgrading a tool, which breaks a script, which needs a new OS package. And the essential complexity is large: the checklist of things a production system needs is long, and most engineers know only part of it.</p>

<section class="lab">
<header><span class="tag">Lab</span><h3>Production-grade checklist</h3>
<p>Tick what your module actually handles today. The remainder is what you are choosing to skip, which is fine as long as it is a choice.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c8-kind">What are you building?</label><select id="c8-kind"><option value="1–2 weeks">Managed service (RDS)</option><option value="2–4 weeks" selected>Stateless distributed system (ASG of apps)</option><option value="2–4 months">Stateful distributed system (Elasticsearch)</option><option value="6–36 months">Entire architecture</option></select></span>
<span class="pill info" data-h="est"></span><span class="pill" data-h="cov"></span></div>
<div class="cards" data-h="checklist" style="margin:0"></div>
<div class="msg" data-h="skip"></div>
</div>
</section>

<h2>Module design</h2>
<h3>Small</h3>
<p>A module with hundreds of resources is slow to plan, forces everyone who touches it to hold admin rights over all of it, puts everything in one blast radius, and cannot be reviewed because nobody reads a thousand-line plan. Split by what changes together and what must be isolated. The web cluster from earlier chapters becomes three modules: an ASG with rolling deploys, an ALB, and a thin "hello world app" that wires them.</p>
<h3>Composable</h3>
<p>Functions compose when they avoid side effects: everything comes in through parameters and goes out through return values. Modules compose the same way. Take everything as input variables, including subnet IDs and target group ARNs, and return everything useful as outputs. A module that reads the default VPC itself can only ever run in the default VPC.</p>
<h3>Testable</h3>
<p>Give every module an <code>examples/</code> folder with a runnable root module. It is documentation, a manual test harness, and the thing your automated tests deploy in Chapter 9.</p>
<h3>Versioned</h3>
<p>Pin everything that can change underneath you.</p>
<div class="tabs">
<figure class="code"><figcaption>versions in code</figcaption><pre><code data-lang="hcl">terraform {
  # Core: allow any 1.x. A major version bump needs a deliberate upgrade.
  required_version = "&gt;= 1.0.0, &lt; 2.0.0"

  required_providers {
    aws = {
      source  = "hashicorp/aws"
      version = "~&gt; 4.0"        # reusable modules: a range
    }
  }
}
# Root modules additionally get exact provider builds from the committed
# .terraform.lock.hcl. Reusable modules do not ship a lock file.</code></pre></figure>
<figure class="code"><figcaption>tfenv and tgswitch</figcaption><pre><code data-lang="bash"># tfenv installs and switches Terraform versions.
$ tfenv install 1.2.3
$ tfenv use 1.2.3

# Commit a .terraform-version file and tfenv picks it up automatically:
$ cat live/stage/vpc/.terraform-version
1.2.3
$ cat live/prod/vpc/.terraform-version
1.0.0                      # each root module can sit on its own version

# tgswitch does the same for Terragrunt with a .terragrunt-version file.
$ cat .terragrunt-version
0.39.0</code></pre></figure>
<figure class="code"><figcaption>module sources</figcaption><pre><code data-lang="hcl"># Private module, pinned to a Git tag
module "hello_world_app" {
  source = "git@github.com:acme/modules.git//services/hello-world-app?ref=v0.0.5"
}

# Public Terraform Registry: NAMESPACE/NAME/PROVIDER plus a version constraint
module "rds" {
  source  = "terraform-aws-modules/rds/aws"
  version = "4.4.0"
}
# To publish there: public GitHub repo named terraform-&lt;PROVIDER&gt;-&lt;NAME&gt;,
# standard file layout, and semantic version tags. Organisations can run
# a private registry with the same source syntax.</code></pre></figure>
</div>

<h2>Contracts: fail before the cloud does</h2>
<div class="model"><b>Mental model</b>
<p>There are three moments to catch a bad configuration. Before the plan, from the inputs alone. During the plan, once data sources have been read. After apply, once real attributes exist. The earlier you fail, the cheaper it is: nothing created, nothing to clean up, and the error message is yours instead of an AWS stack trace.</p></div>
<div class="tablewrap wide"><table>
<thead><tr><th>Block</th><th>Lives in</th><th>Can reference</th><th>Fails</th><th>Good for</th></tr></thead>
<tbody>
<tr><td><code>validation</code></td><td><code>variable</code></td><td>Only that variable</td><td>Before plan</td><td>Basic input sanitisation: ranges, allowed values, formats</td></tr>
<tr><td><code>precondition</code></td><td><code>lifecycle</code> of a resource, data source or output</td><td>Other variables, data sources, resources</td><td>During plan when values are known, otherwise just before the resource is applied</td><td>Assumptions that need a lookup: architecture, quotas, free tier</td></tr>
<tr><td><code>postcondition</code></td><td><code>lifecycle</code> of a resource or data source</td><td><code>self</code>, the finished object</td><td>After the resource is applied</td><td>Guarantees to callers: encrypted, multi-AZ, has a public endpoint</td></tr>
</tbody></table></div>

<section class="lab">
<header><span class="tag">Lab</span><h3>Production-grade contract validator</h3>
<p>Set the inputs a careless caller might pass, switch contracts on and off, and see how far the mistake travels before something stops it.</p></header>
<div class="body">
<div class="ctl">
  <span class="field"><label for="c8-type">instance_type</label><select id="c8-type"><option>t2.micro</option><option>t3.micro</option><option>m4.large</option><option>t4g.micro</option></select></span>
  <span class="field"><label for="c8-min">min_size</label><input id="c8-min" type="number" min="0" max="14" value="2" style="width:70px"></span>
  <span class="field"><label for="c8-arch">AMI architecture</label><select id="c8-arch"><option>x86_64</option><option>arm64</option></select></span>
  <span class="field"><label for="c8-az">Subnets span</label><select id="c8-az"><option value="3">3 availability zones</option><option value="1">1 availability zone</option></select></span>
  <span class="field"><label for="c8-enc">Root volume</label><select id="c8-enc"><option value="1">encrypted</option><option value="0">not encrypted</option></select></span>
</div>
<div class="ctl">
  <span class="lbl">Contracts</span>
  <button class="chip" data-h="k-val" aria-pressed="true">variable validation</button>
  <button class="chip" data-h="k-pre" aria-pressed="true">precondition</button>
  <button class="chip" data-h="k-post" aria-pressed="true">postcondition</button>
  <button class="btn ghost" data-h="bad">Load a bad call</button>
</div>
<div class="grid3" data-h="phases"></div>
<pre data-h="out"></pre>
<div class="msg" data-h="verdict"></div>
</div>
</section>

<div class="tabs">
<figure class="code"><figcaption>validation</figcaption><pre><code data-lang="hcl">variable "instance_type" {
  description = "The type of EC2 Instances to run (e.g. t2.micro)"
  type        = string

  validation {
    condition     = contains(["t2.micro", "t3.micro"], var.instance_type)
    error_message = "Only free tier is allowed: t2.micro | t3.micro."
  }
}

variable "min_size" {
  description = "The minimum number of EC2 Instances in the ASG"
  type        = number

  validation {
    condition     = var.min_size &gt; 0
    error_message = "ASGs can't be empty or we'll have an outage!"
  }

  validation {
    condition     = var.min_size &lt;= 10
    error_message = "ASGs must have 10 or fewer instances to keep costs down."
  }
}</code></pre></figure>
<figure class="code"><figcaption>precondition</figcaption><pre><code data-lang="hcl">data "aws_ec2_instance_type" "instance" {
  instance_type = var.instance_type
}

data "aws_ami" "selected" {
  owners = ["self"]
  filter {
    name   = "image-id"
    values = [var.ami]
  }
}

resource "aws_launch_configuration" "example" {
  image_id        = var.ami
  instance_type   = var.instance_type
  security_groups = [aws_security_group.instance.id]
  user_data       = var.user_data

  lifecycle {
    create_before_destroy = true

    # A hard-coded list in a validation block goes stale. Ask AWS instead.
    precondition {
      condition     = data.aws_ec2_instance_type.instance.free_tier_eligible
      error_message = "${var.instance_type} is not part of the AWS Free Tier!"
    }

    precondition {
      condition = contains(
        data.aws_ec2_instance_type.instance.supported_architectures,
        data.aws_ami.selected.architecture
      )
      error_message = "The AMI architecture does not match ${var.instance_type}."
    }
  }
}</code></pre></figure>
<figure class="code"><figcaption>postcondition</figcaption><pre><code data-lang="hcl">resource "aws_autoscaling_group" "example" {
  name                 = var.cluster_name
  launch_configuration = aws_launch_configuration.example.name
  vpc_zone_identifier  = var.subnet_ids
  min_size             = var.min_size
  max_size             = var.max_size

  lifecycle {
    postcondition {
      condition     = length(self.availability_zones) &gt; 1
      error_message = "You must use more than one AZ for high availability!"
    }
  }
}

resource "aws_instance" "example" {
  ami           = var.ami
  instance_type = var.instance_type

  lifecycle {
    postcondition {
      condition     = self.root_block_device[0].encrypted
      error_message = "The root EBS volume must be encrypted."
    }
  }
}</code></pre></figure>
</div>
<p>Use <code>validation</code> for anything checkable from one input. Use <code>precondition</code> for assumptions and <code>postcondition</code> for guarantees. Neither replaces automated tests: these checks run only on the paths a real apply takes, in the environment it runs in.</p>

<h2>Escape hatches</h2>
<p>Sometimes Terraform has no resource for what you need. There are ways out, and each one gives up part of what makes Terraform safe.</p>
<div class="tabs">
<figure class="code"><figcaption>local-exec</figcaption><pre><code data-lang="hcl">resource "aws_instance" "example" {
  ami           = "ami-0fb653ca2d3203ac1"
  instance_type = "t2.micro"

  # Runs on the machine running Terraform, once, at creation
  provisioner "local-exec" {
    command = "echo \"Hello, World from $(uname -smp)\""
  }
}</code></pre></figure>
<figure class="code"><figcaption>remote-exec</figcaption><pre><code data-lang="hcl">resource "aws_instance" "example" {
  ami                    = "ami-0fb653ca2d3203ac1"
  instance_type          = "t2.micro"
  vpc_security_group_ids = [aws_security_group.instance.id]
  key_name               = aws_key_pair.generated_key.key_name

  # Runs on the new server over SSH. Needs an open port and a key.
  provisioner "remote-exec" {
    inline = ["echo \"Hello, World from $(uname -smp)\""]
  }

  connection {
    type        = "ssh"
    host        = self.public_ip
    user        = "ubuntu"
    private_key = tls_private_key.example.private_key_pem
  }
}</code></pre></figure>
<figure class="code"><figcaption>null_resource and external data</figcaption><pre><code data-lang="hcl"># A resource that creates nothing, to hang a provisioner on.
# triggers decides when it is "replaced" and so re-runs.
resource "null_resource" "example" {
  triggers = {
    uuid = uuid()        # changes every run: always re-execute
  }

  provisioner "local-exec" {
    command = "echo \"Hello, World from $(uname -smp)\""
  }
}

# Run a script and read its JSON output as data
data "external" "echo" {
  program = ["bash", "-c", "cat /dev/stdin"]
  query   = { foo = "bar" }
}

output "echo_foo" { value = data.external.echo.result.foo }</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges of escape hatches</b>
<ul>
<li><strong>Provisioners run once.</strong> By default only at creation. Terraform does not track what they did, so there is no plan, no diff and no drift detection for their effects.</li>
<li><strong>They make code non-portable.</strong> A <code>local-exec</code> script assumes an OS, a shell and installed tools on whatever machine runs Terraform.</li>
<li><strong>User data is usually better than <code>remote-exec</code>.</strong> It needs no SSH access and it runs on every instance an ASG launches, including the ones launched at 3 a.m. without Terraform.</li>
<li><strong>A failed provisioner taints the resource.</strong> The next apply destroys and recreates it.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>In app code a failed assertion costs a stack trace. In infrastructure, a failed <code>apply</code> can leave half the resources created and billing. Contracts that fail during <code>plan</code> are the difference between an error message and a clean-up job.</p></div>

<div class="since"><b>Since the book</b>
<p>Terraform 1.4 added the built-in <code>terraform_data</code> resource, which replaces <code>null_resource</code> without needing the null provider (use <code>triggers_replace</code>). Terraform 1.5 added top-level <code>check</code> blocks for assertions that warn without blocking, useful for health checks after apply. Terraform 1.9 lets a variable's <code>validation</code> refer to other variables and data sources.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>A postcondition fails. Was the resource created?</summary><p>Yes. Postconditions run after the change is made, so the resource exists and is in state. Terraform stops there, reports the error, and does not proceed to anything that depends on it. You fix the configuration and apply again.</p></details>
<details class="q"><summary>Why prefer a precondition with a data source over a validation with a hard-coded list of free-tier types?</summary><p>The list in your code goes stale when AWS changes its offering. The data source asks AWS at plan time, so the check stays correct without anyone editing the module.</p></details>
<details class="q"><summary>Your module looks up the default VPC with a data source internally. What does that cost you?</summary><p>Composability and testability. Callers cannot place it in another VPC, and tests cannot inject a throwaway network. Accept <code>vpc_id</code> and <code>subnet_ids</code> as inputs and let the caller decide where they come from.</p></details>

</template>
<template id="t-chapter-9">
<p class="eyebrow">Chapter 9</p>
<h1>How to test Terraform code</h1>
<p class="lede">Infrastructure code that has no tests is broken; you just have not found out how yet. The trouble is that the usual unit-testing playbook does not transfer, because there is no localhost for a cloud.</p>

<div class="model"><b>Mental model</b>
<p>You cannot unit test Terraform in the pure sense, since the only thing a module does is talk to the outside world. So every meaningful test deploys real infrastructure into a real account, checks that it works, and tears it down. Testing strategy is then an economics problem: tests that deploy more give more confidence, and cost more minutes and money. You buy confidence at the cheapest layer that can catch each kind of bug.</p></div>

<h2>Manual testing comes first</h2>
<p>With app code you run it on localhost. With Terraform you run <code>apply</code> in a sandbox and poke at the result with <code>curl</code>. Three rules make that safe:</p>
<ul>
<li><strong>Every developer gets an isolated sandbox account.</strong> Shared dev environments mean your broken experiment is someone else's mystery outage.</li>
<li><strong>Use the <code>examples/</code> folder as the harness.</strong> Each example is a small root module with sane defaults, so testing is <code>terraform apply</code>, verify, <code>terraform destroy</code>.</li>
<li><strong>Clean up automatically.</strong> People forget <code>destroy</code>. Run a scheduled job (cloud-nuke, aws-nuke) that deletes anything in sandbox accounts older than a day or two.</li>
</ul>

<h2>Automated tests with Terratest</h2>
<p>An automated test is the manual loop written down. Terratest is a Go library that wraps the steps: run <code>init</code> and <code>apply</code>, read outputs, make HTTP requests with retries, run <code>destroy</code>.</p>
<div class="tabs">
<figure class="code"><figcaption>test/alb_example_test.go (unit test)</figcaption><pre><code data-lang="go">package test

import (
	"fmt"
	"testing"
	"time"

	"github.com/gruntwork-io/terratest/modules/http-helper"
	"github.com/gruntwork-io/terratest/modules/random"
	"github.com/gruntwork-io/terratest/modules/terraform"
)

func TestAlbExample(t *testing.T) {
	t.Parallel() // run alongside other tests

	opts := &amp;terraform.Options{
		TerraformDir: "../examples/alb",
		Vars: map[string]interface{}{
			// Unique name so parallel runs never collide
			"alb_name": fmt.Sprintf("test-%s", random.UniqueId()),
		},
	}

	// Always clean up, even if an assertion fails
	defer terraform.Destroy(t, opts)

	terraform.InitAndApply(t, opts)

	albDnsName := terraform.OutputRequired(t, opts, "alb_dns_name")
	url := fmt.Sprintf("http://%s", albDnsName)

	// The ALB's default action is a 404. Infrastructure is eventually
	// consistent, so retry for up to 100 seconds.
	http_helper.HttpGetWithRetry(t, url, nil, 404, "404: page not found", 10, 10*time.Second)
}</code></pre></figure>
<figure class="code"><figcaption>integration test with stages</figcaption><pre><code data-lang="go">func TestHelloWorldAppStageWithStages(t *testing.T) {
	t.Parallel()

	// A stage is skipped when SKIP_&lt;name&gt; is set in the environment
	stage := test_structure.RunTestStage

	// Deploy MySQL, undeploy it last
	defer stage(t, "teardown_db", func() { teardownDb(t, dbDirStage) })
	stage(t, "deploy_db", func() { deployDb(t, dbDirStage) })

	// Deploy the app on top of it
	defer stage(t, "teardown_app", func() { teardownApp(t, appDirStage) })
	stage(t, "deploy_app", func() { deployApp(t, dbDirStage, appDirStage) })

	// Check the app works
	stage(t, "validate_app", func() { validateApp(t, appDirStage) })
}

func deployDb(t *testing.T, dbDir string) {
	dbOpts := createDbOpts(t, dbDir)
	// Persist the options to disk so a later run can find this deployment
	test_structure.SaveTerraformOptions(t, dbDir, dbOpts)
	terraform.InitAndApply(t, dbOpts)
}

func teardownDb(t *testing.T, dbDir string) {
	dbOpts := test_structure.LoadTerraformOptions(t, dbDir)
	terraform.Destroy(t, dbOpts)
}</code></pre></figure>
<figure class="code"><figcaption>retries for known flaky errors</figcaption><pre><code data-lang="go">opts := &amp;terraform.Options{
	TerraformDir: "../examples/hello-world-app/standalone",

	MaxRetries:         3,
	TimeBetweenRetries: 5 * time.Second,
	// Only retry errors you have seen and know to be transient
	RetryableTerraformErrors: map[string]string{
		"RequestError: send request failed": "Throttling issue?",
	},
}</code></pre></figure>
<figure class="code"><figcaption>running</figcaption><pre><code data-lang="bash">$ cd test
$ go test -v -timeout 30m                       # Go's default 10 minutes is too short
$ go test -v -timeout 30m -run TestAlbExample   # one test

# Iterate on validation only, against infrastructure left up by a previous run:
$ SKIP_teardown_db=true SKIP_teardown_app=true go test -timeout 30m -run 'TestHelloWorldAppStageWithStages'
$ SKIP_deploy_db=true SKIP_deploy_app=true SKIP_teardown_db=true SKIP_teardown_app=true \
    go test -timeout 30m -run 'TestHelloWorldAppStageWithStages'</code></pre></figure>
</div>

<h3>Unit, integration, end-to-end</h3>
<ul>
<li><strong>Unit test:</strong> deploy one small module on its own. This only works if the module is small and takes its dependencies as inputs.</li>
<li><strong>Integration test:</strong> deploy several modules together, such as the database and the app that reads from it, and check that they work as a pair.</li>
<li><strong>End-to-end test:</strong> deploy the whole architecture and test it as a user would. From scratch this takes hours and fails for unrelated reasons, so in practice you keep a long-lived test environment and apply only the incremental change to it, which also happens to be how you deploy to production.</li>
</ul>

<h3>Dependency injection</h3>
<p>The app module reads the database address from remote state in S3. A unit test would need a real database and a real state file. Make that dependency an input instead, and the test can pass a fake.</p>
<figure class="code"><figcaption>optional injected dependencies</figcaption><pre><code data-lang="hcl">variable "db_remote_state_bucket" {
  type    = string
  default = null
}
variable "db_remote_state_key" {
  type    = string
  default = null
}

# Tests (or callers with their own database) pass this instead
variable "mysql_config" {
  type = object({
    address = string
    port    = number
  })
  default = null
}

data "terraform_remote_state" "db" {
  count   = var.mysql_config == null ? 1 : 0    # only look it up when not injected
  backend = "s3"
  config = {
    bucket = var.db_remote_state_bucket
    key    = var.db_remote_state_key
    region = "us-east-2"
  }
}

locals {
  mysql_config = (
    var.mysql_config == null
    ? data.terraform_remote_state.db[0].outputs
    : var.mysql_config
  )
}</code></pre></figure>

<div class="edge"><b>Sharp edges</b>
<ul>
<li><strong>Parallel tests need namespacing.</strong> Two tests creating an ALB called <code>example</code> collide. Every name must be a variable, set per test to a unique value.</li>
<li><strong>Parallel tests need separate folders.</strong> Two tests running <code>init</code> in the same example directory overwrite each other's <code>.terraform</code> and state. Copy the folder to a temp directory per test (<code>test_structure.CopyTerraformFolderToTemp</code>).</li>
<li><strong>Retry only what you recognise.</strong> Blanket retries hide real bugs. List the specific transient error strings.</li>
<li><strong>Tests cost money.</strong> Small instance types, short lifetimes, and the nightly cleanup job keep it to cents per run.</li>
<li><strong>Never run tests in the production account.</strong> A bug in a test, or in a cleanup tool, deletes whatever it can reach.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>An app's test pyramid is shaped by how much code each test touches. Here it is shaped by how much cloud each test creates. The proportions come out the same: many small fast tests, fewer integration tests, a handful end to end. The reason differs, and so do the numbers: an infrastructure "unit" test takes minutes, not milliseconds.</p></div>

<div class="since"><b>Since the book</b>
<p>Terraform 1.6 added a built-in test framework: <code>.tftest.hcl</code> files with <code>run</code> blocks and assertions, executed by <code>terraform test</code>, and 1.7 added mocking of providers. It covers plan-level and simple apply-level tests in HCL without Go; Terratest remains the choice when you need to make HTTP calls, SSH in, or orchestrate several modules. Also, tfsec has been folded into Aqua's Trivy scanner, and Checkov is now a common alternative for policy scanning.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>Why does every Terratest example start with <code>defer terraform.Destroy</code> before <code>InitAndApply</code>?</summary><p><code>defer</code> registers the cleanup before anything is created, so it runs even if apply fails halfway or an assertion panics. Otherwise a failed test leaves billable resources behind.</p></details>
<details class="q"><summary>Your integration test takes 25 minutes and you are debugging the validation step. How do test stages help?</summary><p>Run once with the teardown stages skipped, leaving the infrastructure up. Then run with deploy and teardown both skipped: only validation executes, in seconds, against what is already there. When it passes, run teardown alone.</p></details>
<details class="q"><summary>Which bugs can static analysis and plan tests never catch?</summary><p>Anything that only shows at runtime: a user data script that crashes, a security group that blocks the health check, an IAM permission that is missing, two modules whose outputs and inputs do not line up. You have to deploy to see those.</p></details>

<template id="t-chapter-10">
<p class="eyebrow">Chapter 10</p>
<h1>How to use Terraform as a team</h1>
<p class="lede">One person with a laptop can keep Terraform consistent by memory. A team cannot. This chapter is about the process that replaces memory: version control as the only way in, and a pipeline as the only thing that applies.</p>

<div class="model"><b>Mental model</b>
<p>Treat a tagged version of your module code as an immutable artifact, like a compiled binary. Build it once, test it, then promote the <em>same</em> artifact through each environment. And treat the <code>main</code> branch of your live repository as a statement of fact about production. If you can read it in <code>main</code>, it is deployed. If it is deployed, you can read it in <code>main</code>.</p></div>

<h2>Getting a team to adopt it</h2>
<p>Moving to infrastructure as code is an investment before it is a saving: people must learn new skills, new tools and a new habit of changing code instead of clicking in a console, and for a while everything is slower. To make the case to whoever sets priorities, start from their problem, not from the tool. If the pain is outages from manual deploys, show how IaC addresses that. Then adopt it incrementally: pick one small, real problem, solve it end to end, and let the result argue for the next step. Budget time for learning, or people under deadline pressure will go back to the console and your code will stop matching reality.</p>

<h2>Two workflows, side by side</h2>
<div class="tablewrap wide"><table>
<thead><tr><th>Step</th><th>Application code</th><th>Infrastructure code</th></tr></thead>
<tbody>
<tr><td>1. Use version control</td><td>One repo per app; work on branches</td><td><code>live</code> and <code>modules</code> repos; avoid long-lived branches for <code>live</code></td></tr>
<tr><td>2. Run the code locally</td><td>Run on localhost; run unit tests</td><td><code>terraform apply</code> in a personal sandbox account; <code>go test</code></td></tr>
<tr><td>3. Make code changes</td><td>Edit, rerun, retest</td><td>Edit, <code>apply</code>, <code>go test</code>, with test stages to shorten the loop</td></tr>
<tr><td>4. Submit for review</td><td>Pull request; coding guidelines</td><td>Pull request, plus the <code>plan</code> output</td></tr>
<tr><td>5. Run automated tests</td><td>CI: unit, integration, end-to-end, static analysis</td><td>CI: the same layers, plus policy checks on the plan</td></tr>
<tr><td>6. Merge and release</td><td><code>git tag</code>; build a versioned, immutable artifact</td><td><code>git tag</code>; the tagged repo <em>is</em> the artifact</td></tr>
<tr><td>7. Deploy</td><td>Orchestrator rolls it out; promote across environments</td><td><code>terraform apply</code> from a deployment server; promote across environments</td></tr>
</tbody></table></div>

<h2>The golden rule</h2>
<p>Go into your live repo, pick folders at random and run <code>terraform plan</code>. If every plan says "no changes", the code is the truth. If you see small diffs and hear "oh, I tweaked that by hand", you are drifting. If plans fail or show huge diffs, the code describes nothing real. The rule that keeps you in the first state: <strong>what is on <code>main</code> in the live repo matches what is running in production, one to one.</strong> Each part of that sentence does work.</p>
<ul>
<li><strong>"What is running":</strong> every change goes through code. No console edits, no ad hoc scripts. Out-of-band changes are bugs that the next apply will either revert or trip over.</li>
<li><strong>"One to one":</strong> one folder per deployed thing. Reading the repo tells you what exists in which environment. This is another reason workspaces are a poor fit for environments: the code shows one copy, reality has three.</li>
<li><strong>"<code>main</code>":</strong> one branch. Terraform's lock stops two applies colliding on one state file, but it cannot help if two branches each apply different code to the same environment. Each apply quietly undoes the other's change.</li>
</ul>

<h2>What reviewers look for</h2>
<p>Code review of infrastructure reads two things: the diff and the plan. A short checklist:</p>
<ul>
<li><strong>The plan.</strong> Is every <code>-/+</code> expected? Anything being destroyed that holds data? Does the count match the size of the code change?</li>
<li><strong>Documentation.</strong> Written docs (README: what it does, why, how to use and change it), code docs (comments for the why, <code>description</code> on every variable and output), and example code that runs.</li>
<li><strong>Automated tests.</strong> New module, new test. Changed behaviour, changed test.</li>
<li><strong>File layout.</strong> Does the change respect the isolation between environments and components?</li>
<li><strong>Style.</strong> <code>terraform fmt</code> clean, consistent names, a conventional file split (<code>main.tf</code>, <code>variables.tf</code>, <code>outputs.tf</code>, and for larger modules files per concern such as <code>iam.tf</code> and <code>networking.tf</code>).</li>
</ul>

<h2>The pipeline</h2>
<div class="tabs">
<figure class="code"><figcaption>modules repo: test on every PR</figcaption><pre><code data-lang="yaml">name: modules-ci
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: |
          for d in examples/*/; do
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
          done
      - run: tflint --recursive
      - run: tfsec .

      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "arn:aws:iam::333333333333:role/ci-tests", aws-region: us-east-2 }

<figure class="code"><figcaption>live repo: plan on PR, apply on merge</figcaption><pre><code data-lang="yaml">name: live-cd
on:
  pull_request:
    paths: ["stage/**", "prod/**"]
  push:
    branches: [main]

jobs:
  plan:
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

        working-directory: stage/services/hello-world-app
      - run: terraform plan -lock-timeout=10m -out=tfplan
        working-directory: stage/services/hello-world-app

    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: prod/services/hello-world-app
      - run: terraform plan -lock-timeout=10m -out=tfplan
        working-directory: prod/services/hello-world-app
      - run: terraform apply -lock-timeout=10m tfplan      # exactly the plan just produced

<figure class="code"><figcaption>Terragrunt: one module, many environments</figcaption><pre><code data-lang="hcl"># live/stage/services/hello-world-app/terragrunt.hcl

# $ terragrunt apply
# $ terragrunt run-all plan      # every module under this folder, in dependency order
# $ terragrunt run-all apply</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges of automating apply</b>
<ul>
<li><strong>The deployment server holds the keys to everything.</strong> Do not expose it to the internet, lock it down, and do not give it permanent admin credentials. Use short-lived roles (Chapter 6), and where you can, separate the permission to plan from the permission to apply.</li>
<li><strong>Apply only from <code>main</code>, only from CI.</strong> A human running apply from a laptop on a branch is the most common way to break the golden rule.</li>
<li><strong>No rollback button.</strong> Infrastructure has no "previous build" to switch back to. If an apply half-fails, state is still saved for what did succeed. You roll forward: fix the code or revert the commit, and apply again.</li>
<li><strong>Handle interrupted applies.</strong> A killed CI job can leave a lock behind or lose state it could not write. Terraform writes an <code>errored.tfstate</code> for you to push; never just retry blindly.</li>
<li><strong><code>run-all apply</code> is powerful and blunt.</strong> A single command that changes many state files defeats the isolation you built in Chapter 3. Use it for creating whole environments, and be careful with it day to day.</li>
</ul></div>

<div class="why"><b>Why this differs from app code</b>
<p>Application deploys are designed to be undone: keep the old version running, shift traffic back. Infrastructure changes often cannot be undone, because a deleted database is gone. So the infrastructure workflow front-loads its safety: review the exact plan, test in an identical environment first, and require a human to approve production.</p></div>

<div class="since"><b>Since the book</b>
<p>Hosted runners for this workflow are now common: HCP Terraform (formerly Terraform Cloud), Atlantis, Spacelift, env0 and others post plans on pull requests and apply on merge with locking built in. Terragrunt has since restructured its CLI (<code>run --all</code> in place of <code>run-all</code>) and added "stacks". The workflow itself, plan on PR and apply from <code>main</code>, has become the standard.</p></div>

<h2>Check your model</h2>
<details class="q"><summary>Two engineers each run <code>apply</code> to stage from their own feature branch, one after the other. Locking worked. What went wrong?</summary><p>Each branch lacks the other's change. The second apply sees the first engineer's resources as "not in configuration" and plans to remove or revert them. Locks prevent simultaneous writes, not conflicting sources of truth.</p></details>
<details class="q"><summary>Why apply a saved plan file instead of running <code>apply</code> fresh after approval?</summary><p>Between review and apply, the world or the code may have moved. Applying the saved file guarantees that what runs is exactly what the reviewer read. If the state changed in between, Terraform refuses the stale plan.</p></details>
<details class="q"><summary>Prod is broken by a bad module version. What is the "rollback"?</summary><p>A new pull request that sets prod's <code>ref</code> back to the previous tag, reviewed and applied through the same pipeline. That is rolling forward to old code. Anything the bad version destroyed stays destroyed.</p></details>
