<template id="t-home">
<p class="eyebrow">Interactive companion · 2nd edition · Go 1.21–1.22</p>
<h1>Learning Go, with the lid off</h1>
<p class="lede">Sixteen chapters of Jon Bodner's book as labs. Each one starts with why Go made a choice, lets you poke at a model of the runtime or the compiler, and then shows the idiomatic code beside the habit you are bringing from another language.</p>
<p>This is for someone who already programs well in Python, Java, C++ or JavaScript. You do not need syntax explained. You need to know which instincts to drop. Go's designers optimised for the reader of the code and for large teams over long periods, and nearly every surprising decision follows from that: one formatting style, no implicit conversions, errors as ordinary values, composition instead of inheritance, and very few ways to be clever.</p>
<h2>How each module works</h2>
<div class="grid3 wide">
  <div class="pane"><h4>1 · Model</h4>The idea behind the feature, and the trade-off Go chose.</div>
  <div class="pane"><h4>2 · Lab</h4>A simulator of the lexer, the memory layout, the scheduler or the toolchain. Change something and watch.</div>
  <div class="pane"><h4>3 · Idiom vs habit</h4>Go code you would be happy to review, next to the version a newcomer writes.</div>
</div>
<p class="note">The labs are models written in JavaScript. They follow Go's documented rules, but they are not the Go compiler. When a lab and <code>go build</code> disagree, the compiler is right.</p>
<h2>Modules</h2>
<div class="cards wide">
<a class="card" href="#chapter-1"><span class="n">01</span><b>Setting up</b><span>One binary, modules, and a lexer that inserts your semicolons.</span></a>
<a class="card" href="#chapter-2"><span class="n">02</span><b>Types and declarations</b><span>Zero values, untyped constants, and floats that cannot hold 0.1.</span></a>
<a class="card" href="#chapter-3"><span class="n">03</span><b>Composite types</b><span>Slices sharing a backing array; strings as bytes, not characters.</span></a>
<a class="card" href="#chapter-4"><span class="n">04</span><b>Blocks, shadows, control</b><span>Where <code>:=</code> quietly makes a second variable, and the Go 1.22 loop fix.</span></a>
<a class="card" href="#chapter-5"><span class="n">05</span><b>Functions</b><span><code>defer</code> as a stack, and what call-by-value really copies.</span></a>
<a class="card" href="#chapter-6"><span class="n">06</span><b>Pointers</b><span>Stack or heap, escape analysis, and the garbage collector's two dials.</span></a>
<a class="card" href="#chapter-7"><span class="n">07</span><b>Types, methods, interfaces</b><span>Method sets and the interface that is not nil.</span></a>
<a class="card" href="#chapter-8"><span class="n">08</span><b>Generics</b><span>Constraints, the <code>~</code> operator, and when not to bother.</span></a>
<a class="card" href="#chapter-9"><span class="n">09</span><b>Errors</b><span>Wrap, join, then walk the tree with <code>errors.Is</code> and <code>errors.As</code>.</span></a>
<a class="card" href="#chapter-10"><span class="n">10</span><b>Modules and packages</b><span>Minimal version selection and what <code>internal</code> hides.</span></a>
<a class="card" href="#chapter-11"><span class="n">11</span><b>Go tooling</b><span>Cross-compiling, build tags, embedding, and reachability-aware vulnerability scans.</span></a>
<a class="card" href="#chapter-12"><span class="n">12</span><b>Concurrency</b><span>Channel rules as a truth table, handoffs, and backpressure.</span></a>
<a class="card" href="#chapter-13"><span class="n">13</span><b>The standard library</b><span>Stacking readers and HTTP middleware.</span></a>
<a class="card" href="#chapter-14"><span class="n">14</span><b>The context</b><span>A cancellation tree you can cut.</span></a>
<a class="card" href="#chapter-15"><span class="n">15</span><b>Writing tests</b><span>Table tests, fuzzing, benchmarks, and the race detector.</span></a>

</div>
<div class="since"><b>Since the book</b>
<p>The second edition covers Go up to 1.22. Later releases added range-over-function iterators and a generic <code>iter</code> package (1.23), generic type aliases and a <code>tool</code> directive in <code>go.mod</code> (1.24), and container-aware <code>GOMAXPROCS</code> (1.25), among others. Boxes like this one flag where a chapter's advice has moved.</p></div>
<p class="note">Explanations and code are written fresh for this explainer and follow the book's structure. For the full treatment, read the book.</p>

<template id="t-chapter-1">
<p class="eyebrow">Chapter 1</p>
<h1>Setting up your Go environment</h1>
<p class="lede">Go's tooling is part of the language's design. The compiler, formatter, vetter, dependency manager and test runner ship as one command, and they agree with each other because they were built together.</p>
<div class="model"><b>Mental model</b>
<p>Go trades choice for uniformity. There is one build tool, one formatter with no options, and one layout for a project. You lose the ability to configure, and you gain the ability to open any Go repository on earth and already know how to build, format and test it.</p></div>

<h2>One binary, no runtime to install</h2>
<p><code>go build</code> produces a single native executable with the runtime and every dependency linked in. There is no VM on the target machine and no interpreter to match versions with. That is why Go images can be built <code>FROM scratch</code> or on a distroless base: the container holds one file. Java needs a JVM, Python and JavaScript need an interpreter plus a dependency tree on disk.</p>
<p>Projects are <em>modules</em>. A module is a directory with a <code>go.mod</code> file at its root. Old tutorials talk about placing code under <code>GOPATH</code> and setting <code>GOROOT</code>; ignore them. Put your module anywhere.</p>
<div class="tabs">
<figure class="code"><figcaption>shell</figcaption><pre><code data-lang="bash">$ mkdir hello &amp;&amp; cd hello
$ go mod init hello_world        # writes go.mod
$ go build                       # produces ./hello_world
$ ./hello_world
Hello, world!
$ go fmt ./...                   # rewrite files in the standard style
$ go vet ./...                   # report code that compiles but is probably wrong</code></pre></figure>
<figure class="code"><figcaption>hello.go</figcaption><pre><code data-lang="go">package main

import "fmt"

func main() {
	fmt.Println("Hello, world!")
}</code></pre></figure>
<figure class="code"><figcaption>go.mod</figcaption><pre><code data-lang="text">module hello_world

go 1.22</code></pre></figure>
<figure class="code"><figcaption>Makefile</figcaption><pre><code data-lang="make">.DEFAULT_GOAL := build

.PHONY: fmt vet build
fmt:
	go fmt ./...

vet: fmt
	go vet ./...

build: vet
	go build
# `make` now formats, vets and builds in order. Each target lists the
# one before it as a prerequisite, so you cannot skip a step.</code></pre></figure>
</div>

<h2>Why there is exactly one format</h2>
<p><code>go fmt</code> has no settings. Tabs for indentation, braces where it puts them, imports sorted. The stated reason is tooling: if every file has the same shape, programs that read and rewrite source code (refactoring tools, code generators, the language's own migration tools) become far simpler to write. The side effect is that formatting arguments in code review disappear.</p>
<p>The formatter's brace placement is not only taste. It is forced by how the lexer works.</p>
<div class="model"><b>Mental model</b>
<p>Go's grammar uses semicolons, as C's does. You almost never type them because the lexer adds one at the end of a line whenever the last token could end a statement: an identifier, a literal, one of <code>break continue fallthrough return</code>, <code>++</code>, <code>--</code>, or a closing <code>)</code>, <code>]</code>, <code>}</code>. Put an opening brace on its own line and the line above it ends with <code>)</code>, so it gets a semicolon, and your function header is cut off from its body.</p></div>

<section class="lab">
<header><span class="tag">Lab</span><h3>Semicolon insertion and formatter sandbox</h3>
<p>Edit the code or load a preset. The middle pane shows what the lexer sees. Below it, a model of <code>go fmt</code> and <code>go vet</code> respond.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">Presets</span><span class="chips" data-h="pre"></span></span></div>
<div class="grid2">
  <div class="stack"><label class="lbl" for="c1-src">You type</label><textarea id="c1-src" spellcheck="false" style="min-height:250px;tab-size:4"></textarea></div>
  <div class="stack"><div class="lbl">The lexer sees</div><pre data-h="lex" style="min-height:250px"></pre></div>
</div>
<div class="grid3">

<p><code>go fmt</code> fixes layout. <code>go vet</code> looks for code that is legal and suspicious: a <code>Printf</code> whose verbs do not match its arguments, a value assigned and never read, unreachable code. Neither replaces the other, and both belong in the build.</p>

<h2>The rest of the kit</h2>
<ul>
<li><strong>Editor support</strong> comes from <code>gopls</code>, the language server behind VS Code's Go extension and others, with Delve as the debugger. GoLand bundles its own.</li>
<li><strong>The Go Playground</strong> runs snippets in the browser and gives you a shareable link. Use it to ask questions and to check what a small piece of code really does. Do not paste secrets into it.</li>
<li><strong>The Go 1 compatibility promise:</strong> code written for Go 1.0 still compiles. Language and standard library changes are backward compatible barring a security fix or a serious bug, so upgrading the toolchain is routine. (Go 1.22's loop variable change, in Chapter 4, is the first deliberate exception, and it is gated by the version in <code>go.mod</code>.)</li>
</ul>
<div class="why"><b>Unlearn</b>
<p>From Java or JavaScript you may expect to pick a build tool, a formatter, a linter config and a project layout before writing a line. In Go those are decided. Spend the time on the code.</p></div>
<div class="since"><b>Since the book</b>
<p>From Go 1.21 the <code>go</code> command can download a newer toolchain itself when <code>go.mod</code> asks for one, so a single install can build modules that need different Go versions. Chapter 10 covers the <code>go</code> and <code>toolchain</code> directives.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>What happens if you put the returned value on the line after <code>return</code>?</summary><p><code>return</code> is one of the tokens that triggers insertion, so the lexer ends the statement right there. In a function with results that is a compile error for a missing value; the expression on the next line would have been a separate statement.</p></details>
<details class="q"><summary>Your team wants four-space indentation. How do you configure <code>go fmt</code>?</summary><p>You cannot. That is its feature. Set your editor's tab width to four and everyone sees what they like while the files stay identical.</p></details>

<template id="t-chapter-2">
<p class="eyebrow">Chapter 2</p>
<h1>Predeclared types and declarations</h1>
<p class="lede">Go's basic types look like every other language's. The rules around them are stricter than most, and the strictness is the point.</p>
<div class="model"><b>Mental model</b>
<p>Go never converts a value's type behind your back. No int-to-float promotion, no truthiness, no string concatenation with numbers. If two types meet, you write the conversion, and a reader can see it. The one soft spot is <em>untyped constants</em>: a literal such as <code>10</code> has no type until it is used, so it fits wherever its value fits.</p></div>

<h2>Zero values, literals, and what the types are</h2>
<p>Every declared variable has a value. If you give none, it gets the type's <em>zero value</em>: <code>0</code>, <code>false</code>, <code>""</code>, or <code>nil</code>. There is no uninitialised memory to read, a whole class of C bugs gone.</p>
<div class="tablewrap wide"><table>
<thead><tr><th>Kind</th><th>Types</th><th>Notes</th></tr></thead><tbody>
<tr><td>Boolean</td><td><code>bool</code></td><td>Only <code>true</code> and <code>false</code>. A number or a string is never a condition</td></tr>
<tr><td>Integers</td><td><code>int8</code>…<code>int64</code>, <code>uint8</code>…<code>uint64</code>, <code>int</code>, <code>uint</code>, <code>byte</code> (= <code>uint8</code>)</td><td>Use <code>int</code> unless a protocol or file format dictates a size</td></tr>
<tr><td>Floats</td><td><code>float32</code>, <code>float64</code></td><td>IEEE 754. Use <code>float64</code>. Never for money</td></tr>
<tr><td>Complex</td><td><code>complex64</code>, <code>complex128</code></td><td>Rarely used; Go is not a numerics language</td></tr>
<tr><td>Text</td><td><code>string</code>, <code>rune</code> (= <code>int32</code>)</td><td>A string is immutable bytes; a rune is one Unicode code point</td></tr>
</tbody></table></div>
<figure class="code"><figcaption>literals</figcaption><pre><code data-lang="go">x := 0b1010          // binary
y := 0o17            // octal; a bare leading 0 also works and is easy to misread
z := 0xFF            // hex
big := 1_234_567     // underscores are ignored, use them to group digits
r := 'a'             // rune literal: single quotes, a number underneath
s := "tab:\t done"   // interpreted string: escapes are processed
raw := `C:\temp\new` // raw string: backquotes, nothing is escaped, may span lines</code></pre></figure>

<h2><code>var</code> or <code>:=</code></h2>
<div class="two wide">
<figure class="code"><figcaption>Declarations in Go</figcaption><pre><code data-lang="go">var x int            // zero value, intent: "starts at zero"
var y = 10           // type inferred
var a, b = 1, "hi"   // several at once
z := 10              // inside functions only; the usual form

// := must declare at least one NEW variable on the left.
z, w := 20, 30       // reuses z, declares w

const pi = 3.14159   // untyped constant
const typed int = 10 // typed constant</code></pre></figure>
<figure class="code"><figcaption>Habits to drop</figcaption><pre><code data-lang="go">// Python / JS: truthiness
if count { }             // does not compile
if count != 0 { }        // say what you mean

// Java: declare everything at the top "just in case"
var unused int           // does not compile: declared and not used

// const as "immutable variable"
const now = time.Now()   // does not compile: not known at compile time</code></pre></figure>
</div>
<p>Use <code>var</code> when you want the zero value, when the default type of a literal is not the type you want (<code>var b byte = 20</code>), or at package level. Use <code>:=</code> otherwise. An unused <em>local</em> variable is a compile error; unused constants and package-level variables are not.</p>
<p>Names are <code>camelCase</code>, never <code>snake_case</code>. The smaller the scope, the shorter the name: <code>i</code> for a loop index, <code>k, v</code> for a map entry, a full word for anything that lives across a page.</p>

<h2>Conversions and untyped constants</h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Type conversion and untyped literal explorer</h3>
<p>Pick a target type and something to put in it. See whether Go accepts it as written, and what you would have to write if it does not.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c2-t">Variable type</label><select id="c2-t"></select></span><span class="field"><label for="c2-v">Value on the right</label><select id="c2-v"></select></span></div>
<pre data-h="code"></pre>
<div class="row"><span class="pill" data-h="verdict"></span></div>
<div class="msg" data-h="why"></div>
</div></section>
<figure class="code"><figcaption>the rule in three lines</figcaption><pre><code data-lang="go">var x int = 10
var y float64 = 30.2
sum := float64(x) + y     // x + y does not compile: mismatched types int and float64

const c = 10              // untyped: works with either
var f float64 = c * y
var i int = c * x</code></pre></figure>

<section class="lab">
<header><span class="tag">Lab</span><h3>IEEE 754 inspector</h3>
<p>Type a decimal number. See the bits a <code>float64</code> stores and the number those bits really represent.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c2-f">Decimal value</label><input id="c2-f" type="text" value="0.1" style="width:170px"></span><span class="chips" data-h="fpre"></span></div>
<pre data-h="bits" style="white-space:pre-wrap;word-break:break-all"></pre>
<div class="tablewrap" style="margin:0"><table data-h="ftab"></table></div>
<div class="msg" data-h="fmsg"></div>
</div></section>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Do not compare floats with <code>==</code>.</strong> Compare the difference against a tolerance, or use integers (cents) or a decimal library.</li>
<li><strong>Integer division truncates</strong> and integer overflow wraps silently. Dividing an integer by zero panics; dividing a float by zero gives <code>+Inf</code>, <code>-Inf</code> or <code>NaN</code>.</li>
<li><strong><code>string(65)</code> is <code>"A"</code>, not <code>"65"</code>.</strong> It converts a code point. Use <code>strconv.Itoa</code> for digits; <code>go vet</code> flags the mistake.</li>
<li><strong>Constants are names for literals</strong>, fixed at compile time. Go has no way to declare a run-time value immutable.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>Why does <code>var f float64 = 10</code> compile but <code>var i int = 10; var f float64 = i</code> not?</summary><p><code>10</code> is an untyped constant and takes whatever numeric type the context needs. <code>i</code> is a variable with type <code>int</code>, and Go will not convert a typed value implicitly.</p></details>
<details class="q"><summary>What is the default type of <code>x := 5.0</code> and of <code>y := 'a'</code>?</summary><p><code>float64</code> and <code>rune</code> (that is, <code>int32</code>). An untyped literal used with <code>:=</code> takes its kind's default type.</p></details>

<template id="t-chapter-3">
<p class="eyebrow">Chapter 3</p>
<h1>Composite types</h1>
<p class="lede">Arrays, slices, strings, maps and structs. Slices are where people from every other language get hurt, because a slice looks like a list and behaves like a window.</p>
<div class="model"><b>Mental model</b>
<p>A slice is three words: a pointer into an array, a length, and a capacity. It owns nothing. Slicing a slice makes a second window onto the same array. <code>append</code> writes into the spare capacity if there is any, and only allocates a new array when there is none. Whether two slices share memory therefore depends on capacity at the moment of the append, which is why the bugs are intermittent.</p></div>

<h2>Arrays: rigid, and mostly a backing store</h2>
<p>The size is part of an array's type: <code>[3]int</code> and <code>[4]int</code> are different types, you cannot write a function that takes "an array of any length", and the size must be a compile-time constant. Use arrays when you know the exact length up front; otherwise use slices, which sit on top of them.</p>
<figure class="code"><figcaption>arrays</figcaption><pre><code data-lang="go">var x [3]int                       // [0 0 0]
y := [3]int{10, 20, 30}
z := [...]int{10, 20, 30}          // length counted for you
sparse := [12]int{1, 5: 4, 6, 10: 100, 15}   // index: value; gaps are zero
fmt.Println(y == z)                // true: arrays are comparable</code></pre></figure>

<h2>Slices</h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Slice backing-array and capacity visualizer</h3>
<p>Solid cells are inside a slice's length. Dashed cells are spare capacity it may write into. Try: <code>y := x[:2]</code>, then append to <code>y</code>, and look at <code>x</code>.</p></header>
<div class="body">
<div class="ctl"><span class="lbl">Make y</span><button class="btn ghost" data-h="o-sub">y := x[:2]</button><button class="btn ghost" data-h="o-full">y := x[:2:2]</button><button class="btn ghost" data-h="o-copy">y := make([]int, 2); copy(y, x)</button></div>
<div class="ctl"><span class="lbl">Mutate</span><button class="btn" data-h="o-ay">y = append(y, 30)</button><button class="btn" data-h="o-ax">x = append(x, 50)</button><button class="btn" data-h="o-sx">x[0] = 99</button><button class="btn" data-h="o-sy">y[0] = 77</button><button class="btn ghost" data-h="o-reset">Reset</button></div>
<div class="stack" data-h="mem"></div>
<pre data-h="log" style="max-height:180px"></pre>
<div class="msg" data-h="smsg"></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>slice basics</figcaption><pre><code data-lang="go">var s []int                 // nil slice: len 0, cap 0, s == nil. Fine to append to.
e := []int{}                // empty, non-nil. Use when "empty list" must encode as [] in JSON
x := []int{1, 2, 3}
x = append(x, 4, 5)         // always assign the result back
x = append(x, e...)         // ... expands a slice into arguments

m := make([]int, 0, 10)     // len 0, cap 10: the usual form when you know the size
bad := make([]int, 10)      // len 10 of zeros; append now adds an 11th element

fmt.Println(slices.Equal(x, m))   // slices are not comparable with ==, except to nil
clear(x)                    // Go 1.21: zeroes the elements, length unchanged</code></pre></figure>
<figure class="code"><figcaption>protecting against shared memory</figcaption><pre><code data-lang="go">x := make([]int, 0, 5)
x = append(x, 1, 2, 3, 4)

y := x[:2]        // shares the array, cap 5: an append to y overwrites x[2]
z := x[:2:2]      // full slice expression: cap limited to 2, so append must reallocate

c := make([]int, 2)
n := copy(c, x)   // independent memory; copies min(len(dst), len(src)) and returns it</code></pre></figure>
<figure class="code"><figcaption>arrays and slices</figcaption><pre><code data-lang="go">arr := [4]int{5, 6, 7, 8}
sl := arr[:]               // slice over the array: shares memory
back := [4]int(sl)         // slice -&gt; array: copies (Go 1.20+)
ptr := (*[4]int)(sl)       // slice -&gt; array pointer: shares
// Converting to a longer array than the slice panics at run time.</code></pre></figure>
</div>
<p>When a slice outgrows its capacity, the runtime allocates a larger array (double while small, then by about 25% past 256 elements), copies the data and returns a slice over the new array. The old array becomes garbage once nothing points to it.</p>

<h2>Strings, runes and bytes</h2>
<div class="model"><b>Mental model</b>
<p>A Go string is an immutable sequence of <em>bytes</em>, conventionally UTF-8. <code>len(s)</code> counts bytes. <code>s[i]</code> is a byte. A character outside ASCII takes two to four bytes, so indexing and slicing by position can cut one in half. A <code>rune</code> is one code point; convert to <code>[]rune</code> or use <code>for range</code> when you need characters.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>UTF-8 byte vs rune inspector</h3>
<p>Type any text. Then drag the slice bounds, which are byte indexes as in Go, and see what <code>s[lo:hi]</code> yields.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c3-s">s</label><input id="c3-s" type="text" value="Hello, 🌞" style="width:220px"></span><span class="pill info" data-h="ulen"></span><span class="pill info" data-h="urunes"></span></div>
<div class="mem" data-h="ubytes"></div>
<div class="ctl"><span class="field"><label for="c3-lo">lo</label><input id="c3-lo" type="range" min="0" max="11" value="4"></span><span class="field"><label for="c3-hi">hi</label><input id="c3-hi" type="range" min="0" max="11" value="8"></span></div>
<pre data-h="uout"></pre><div class="msg" data-h="umsg"></div>
</div></section>
<figure class="code"><figcaption>strings</figcaption><pre><code data-lang="go">s := "Hello, 🌞"
fmt.Println(len(s))                    // 11: seven ASCII bytes plus four for the sun
fmt.Println(utf8.RuneCountInString(s)) // 8
bs := []byte(s)                        // the eleven bytes
rs := []rune(s)                        // the eight code points
fmt.Println(string(rs[7]))             // 🌞
for i, r := range s {                  // i is the BYTE offset of each rune
	fmt.Println(i, string(r))
}</code></pre></figure>

<h2>Maps</h2>
<div class="two wide">
<figure class="code"><figcaption>Idiomatic</figcaption><pre><code data-lang="go">totalWins := map[string]int{}        // empty, ready to write
totalWins["Orcas"]++                 // missing key reads as zero value

v, ok := totalWins["Kittens"]        // comma-ok: was the key there?
if !ok { /* absent, not "zero wins" */ }

delete(totalWins, "Orcas")
clear(totalWins)                     // Go 1.21: empties the map
fmt.Println(maps.Equal(a, b))

// A set. bool reads better; struct{} uses no memory per value.
seen := map[int]bool{}
seen[5] = true
if seen[5] { }</code></pre></figure>
<figure class="code"><figcaption>Trap</figcaption><pre><code data-lang="go">var m map[string]int   // nil map
fmt.Println(m["a"])    // 0: reading a nil map is fine
m["a"] = 1             // panic: assignment to entry in nil map

// "0 means missing" loses information
if totalWins["Kittens"] == 0 { }   // absent, or really zero?

// Maps and slices cannot be map keys (not comparable).</code></pre></figure>
</div>

<h2>Structs</h2>
<figure class="code"><figcaption>structs</figcaption><pre><code data-lang="go">type person struct {
	name string
	age  int
	pet  string
}

var fred person                       // every field at its zero value
bob := person{}                       // same
julia := person{"Julia", 40, "cat"}   // positional: all fields, in order. Brittle.
beth := person{age: 30, name: "Beth"} // keyed: preferred; survives added fields

// Anonymous struct: one-off shapes, common for JSON and table-driven tests
pet := struct {
	name string
	kind string
}{name: "Fido", kind: "dog"}</code></pre></figure>
<p>Structs are comparable with <code>==</code> when every field is comparable. Two different named struct types are never comparable to each other, and can be <em>converted</em> only if their fields match in name, order and type. An anonymous struct with the same fields can be assigned or compared without conversion.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Sub-slices keep the whole array alive.</strong> Holding a 10-byte window on a 1 GB buffer pins the gigabyte. Copy the part you need.</li>
<li><strong><code>append</code> without assigning back</strong> is a compile error if the result is unused, and a logic bug if you assign it to a different name by accident.</li>
<li><strong>Map iteration order is random</strong> on purpose (Chapter 4). Never depend on it.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary><code>x := []int{1,2,3,4}</code>, then <code>y := x[:2]</code> and <code>y = append(y, 30)</code>. What is <code>x</code>?</summary><p><code>[1 2 30 4]</code>. <code>y</code> has length 2 and capacity 4, so the append writes into index 2 of the shared array.</p></details>
<details class="q"><summary>Why is <code>len("🌞")</code> equal to 4?</summary><p><code>len</code> on a string counts bytes, and that code point encodes to four bytes in UTF-8.</p></details>

</template>
<template id="t-chapter-4">
<p class="eyebrow">Chapter 4</p>
<h1>Blocks, shadows and control structures</h1>
<p class="lede">Go has one loop keyword, a <code>switch</code> that does what you meant, and scoping rules that are simple to state and easy to trip on once <code>:=</code> is involved.</p>
<div class="model"><b>Mental model</b>
<p>Every pair of braces is a block, and blocks nest: universe, package, file, function, then each <code>if</code>, <code>for</code> and <code>switch</code>. A name is looked up from the innermost block outward. <code>:=</code> always declares in the <em>current</em> block, so using it inside an <code>if</code> on a name that exists outside creates a second variable that hides the first until the brace closes.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Block scope and shadowing tracer</h3>
<p>Click a line, or step through. The panel shows every block that is open at that line and which declaration each name resolves to.</p></header>
<div class="body">
<div class="row"><button class="btn ghost" data-h="prev">← Line</button><button class="btn" data-h="next">Line →</button></div>
<div class="grid2"><pre data-h="src" style="cursor:pointer"></pre>
<div class="stack"><div class="stack" data-h="env"></div><div class="msg" data-h="note"></div></div></div>
</div></section>
<p>The universe block holds the predeclared names: types such as <code>int</code> and <code>string</code>, constants <code>true</code>, <code>false</code>, <code>nil</code>, and functions such as <code>len</code> and <code>make</code>. They are ordinary identifiers, not keywords, so you can shadow them. Never do. A linter with shadow detection (Chapter 11) catches most of these.</p>

<h2><code>if</code>, with a scoped variable</h2>
<figure class="code"><figcaption>if</figcaption><pre><code data-lang="go">// n exists only inside the if/else chain. Use this to keep
// temporaries from leaking into the rest of the function.
if n := rand.Intn(10); n == 0 {
	fmt.Println("That's too low")
} else if n &gt; 5 {
	fmt.Println("That's too big:", n)
} else {
	fmt.Println("That's a good number:", n)
}
// n is undefined here</code></pre></figure>

<h2>One <code>for</code>, four shapes</h2>
<div class="tabs">
<figure class="code"><figcaption>the four forms</figcaption><pre><code data-lang="go">for i := 0; i &lt; 10; i++ { }       // complete, C style

i := 1
for i &lt; 100 { i = i * 2 }         // condition only: Go's while

for { break }                      // infinite; pair with break or return

for i, v := range []int{2, 4, 6} { // for-range: index and a COPY of the value
	fmt.Println(i, v)
}
for range 3 { }                    // Go 1.22: range over an integer</code></pre></figure>
<figure class="code"><figcaption>continue flattens nesting</figcaption><pre><code data-lang="go">// Instead of wrapping the happy path in ever-deeper ifs,
// reject early and keep the main logic at one indent.
for i := 1; i &lt;= 100; i++ {
	if i%3 == 0 &amp;&amp; i%5 == 0 {
		fmt.Println("FizzBuzz")
		continue
	}
	if i%3 == 0 {
		fmt.Println("Fizz")
		continue
	}
	if i%5 == 0 {
		fmt.Println("Buzz")
		continue
	}
	fmt.Println(i)
}</code></pre></figure>
<figure class="code"><figcaption>labels</figcaption><pre><code data-lang="go">samples := []string{"hello", "apple_π!"}
outer:
	for _, sample := range samples {
		for i, r := range sample {          // i: byte offset, r: rune
			fmt.Println(i, r, string(r))
			if r == 'l' {
				continue outer              // next string, not next rune
			}
		}
		fmt.Println()
	}</code></pre></figure>
</div>
<h3>What <code>for range</code> does that you might not expect</h3>
<ul>
<li><strong>Maps iterate in random order.</strong> Deliberately: it stops code depending on an accident of the hash layout, and it removes a denial-of-service vector where an attacker crafts keys that all collide.</li>
<li><strong>Strings iterate by rune.</strong> The first value is the byte offset, which skips numbers when a character is multi-byte.</li>
<li><strong>The value is a copy.</strong> Changing <code>v</code> does not change the element. Index into the slice to modify it.</li>
<li><strong>Since Go 1.22 each iteration has its own variables.</strong> Before that, one variable was reused for every pass, which broke closures and goroutines that captured it.</li>
</ul>
<section class="lab">

<h2><code>switch</code></h2>
<div class="two wide">
<figure class="code"><figcaption>Go</figcaption><pre><code data-lang="go">switch size := len(word); size {
case 1, 2, 3, 4:               // several values, one case
	fmt.Println(word, "is short")
case 5:
	fmt.Println(word, "is exactly right")
case 6, 7, 8, 9:               // empty case does NOTHING; it does not fall through
default:
	fmt.Println(word, "is long")
}

// Blank switch: any boolean per case. Reads better than if/else-if.
switch {
case i%15 == 0:
	fmt.Println("FizzBuzz")
case i%3 == 0:
	fmt.Println("Fizz")
case i%5 == 0:
	fmt.Println("Buzz")
default:
	fmt.Println(i)
}</code></pre></figure>
<figure class="code"><figcaption>C / Java reflex</figcaption><pre><code data-lang="go">switch x {
case 1:
	doOne()
	break        // legal, pointless: cases never fall through
case 2:
	doTwo()
}

// Inside a for loop, a bare break in a switch case
// leaves the SWITCH, not the loop. Use a label:
loop:
	for {
		switch next() {
		case done:
			break loop
		}
	}</code></pre></figure>
</div>
<p><code>goto</code> exists and is fenced in: it cannot jump over a variable declaration or into a block. You will rarely want it; a labelled <code>break</code> or <code>continue</code>, or a small function, is nearly always clearer.</p>
<div class="why"><b>Unlearn</b><p>If you write <code>x, err := f()</code> inside an <code>if</code> to "reuse" an outer <code>x</code>, you have declared a new one. Declare with <code>var</code> outside and assign with <code>=</code> inside, or restructure so the value does not need to escape the block.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Why can you write <code>true := 10</code>?</summary><p><code>true</code> is a predeclared identifier in the universe block, not a keyword. Your declaration lives in a closer block and shadows it. Legal and a terrible idea.</p></details>
<details class="q"><summary>A module's <code>go.mod</code> says <code>go 1.21</code> but you build with Go 1.23. Which loop semantics apply?</summary><p>The old ones. The per-iteration behaviour is tied to the language version declared in <code>go.mod</code>, so upgrading the toolchain alone never changes how existing code runs.</p></details>

<template id="t-chapter-5">
<p class="eyebrow">Chapter 5</p>
<h1>Functions</h1>
<p class="lede">Go functions are plain: no overloading, no default arguments, no named arguments. What they have instead is multiple return values, first-class function values, and <code>defer</code>.</p>
<div class="model"><b>Mental model</b>
<p>Go is call-by-value, always. Every argument is copied. What matters is <em>what</em> gets copied: for an <code>int</code> or a struct it is the data, for a pointer it is an address, and for a map or slice it is a small header that contains a pointer. That one rule explains every "why did my change stick" and "why didn't it" question.</p></div>

<h2>Parameters and returns</h2>
<div class="two wide">
<figure class="code"><figcaption>Go</figcaption><pre><code data-lang="go">// "Named and optional parameters": pass a struct.
type MyFuncOpts struct {
	FirstName string
	LastName  string
	Age       int
}

func MyFunc(opts MyFuncOpts) error { /* ... */ return nil }

MyFunc(MyFuncOpts{LastName: "Patel", Age: 50})

// Variadic: zero or more, must be last. Inside, vals is []int.
func addTo(base int, vals ...int) []int {
	out := make([]int, 0, len(vals))
	for _, v := range vals {
		out = append(out, base+v)
	}
	return out
}
addTo(3, 2, 4, 6)
addTo(3, []int{1, 2}...)        // expand a slice with ...

// Multiple returns: the error is last, by convention.
func divAndRemainder(num, denom int) (int, int, error) {
	if denom == 0 {
		return 0, 0, errors.New("cannot divide by zero")
	}
	return num / denom, num % denom, nil
}

result, _, err := divAndRemainder(5, 2)   // _ discards a value</code></pre></figure>
<figure class="code"><figcaption>Habits to drop</figcaption><pre><code data-lang="go">// Python: a function returns "a tuple" you may keep whole
t = div_and_remainder(5, 2)        # fine in Python
// Go: each return value must be received (or _ discarded).
// There is no tuple type.

// Java: overloads and defaults
void connect(String host)
void connect(String host, int port)
// Go: one function, an options struct, zero values as defaults.

// Naked return with named results: legal, hard to read.
func div(n, d int) (result int, err error) {
	if d == 0 {
		err = errors.New("div by zero")
		return                    // returns what, exactly? scroll up.
	}
	result = n / d
	return
}
// Named results are fine as documentation and for defer (below).
// Always write the values after return.</code></pre></figure>
</div>

<h2>Functions are values</h2>
<div class="tabs">
<figure class="code"><figcaption>function types and closures</figcaption><pre><code data-lang="go">type opFuncType func(int, int) int

var opMap = map[string]opFuncType{
	"+": func(a, b int) int { return a + b },
	"-": func(a, b int) int { return a - b },
}

// A closure captures variables from the scope where it was created.
func makeMult(base int) func(int) int {
	return func(factor int) int {
		return base * factor
	}
}
twoBase := makeMult(2)
fmt.Println(twoBase(3))   // 6</code></pre></figure>
<figure class="code"><figcaption>passing closures</figcaption><pre><code data-lang="go">type Person struct {
	FirstName string
	LastName  string
	Age       int
}
people := []Person{{"Pat", "Patterson", 37}, {"Tracy", "Bobdaughter", 23}, {"Fred", "Fredson", 18}}

// The closure reads people from the enclosing scope
sort.Slice(people, func(i, j int) bool {
	return people[i].LastName &lt; people[j].LastName
})</code></pre></figure>
</div>

<h2><code>defer</code></h2>
<p><code>defer</code> schedules a call to run when the surrounding function returns, however it returns. It keeps cleanup next to acquisition. Three rules: deferred calls run last-in first-out; arguments are evaluated at the <code>defer</code> statement, not when the call runs; and a deferred closure can read and change named return values.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>LIFO defer stack</h3>
<p>Step through <code>main</code>. Watch what each <code>defer</code> captures when it is pushed, and the order calls pop at return.</p></header>
<div class="body">
<div class="row"><button class="btn" data-h="dnext">Step →</button><button class="btn ghost" data-h="dreset">Restart</button><span class="pill info" data-h="dvar"></span></div>
<div class="grid2"><pre data-h="dsrc"></pre><div class="stack"><div class="pane"><h4>Defer stack (top runs first)</h4><div class="stack" data-h="dstack"></div></div><pre data-h="dout" style="min-height:90px"></pre><div class="msg" data-h="dmsg"></div></div></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>commit or rollback with a named return</figcaption><pre><code data-lang="go">func DoSomeInserts(ctx context.Context, db *sql.DB, value1, value2 string) (err error) {
	tx, err := db.BeginTx(ctx, nil)
	if err != nil {
		return err
	}
	defer func() {
		if err == nil {
			err = tx.Commit()      // may set the function's return value
		}
		if err != nil {
			tx.Rollback()
		}
	}()
	_, err = tx.ExecContext(ctx, "INSERT INTO FOO (val) values $1", value1)
	if err != nil {
		return err
	}
	// use tx for more inserts here
	return nil
}</code></pre></figure>
<figure class="code"><figcaption>return a cleanup closure</figcaption><pre><code data-lang="go">// The caller cannot forget cleanup: an unused closer is a compile error.
func getFile(name string) (*os.File, func(), error) {
	file, err := os.Open(name)
	if err != nil {
		return nil, nil, err
	}
	return file, func() { file.Close() }, nil
}

f, closer, err := getFile(os.Args[1])
if err != nil {
	log.Fatal(err)
}
defer closer()</code></pre></figure>
</div>

<h2>Call by value, case by case</h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Call-by-value inspector</h3>
<p>Pick what you pass. See what is copied into the callee and whether the caller observes the change.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">Argument</span><span data-h="cbv"></span></span></div>
<div class="grid2"><pre data-h="ccode"></pre><div class="stack"><div class="pane"><h4>What gets copied</h4><p data-h="ccopy" style="margin:0"></p></div><div class="row"><span class="pill" data-h="cres"></span></div><div class="msg" data-h="cmsg"></div></div></div>
</div></section>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong><code>defer</code> in a loop</strong> does not run until the function returns. A loop that opens a thousand files and defers each close holds a thousand files open. Move the body into its own function.</li>
<li><strong>Deferred return values are discarded.</strong> <code>defer f.Close()</code> throws away the error. For writes, check it in a deferred closure.</li>
<li><strong>Closures share variables, not snapshots.</strong> Change the outer variable and every closure sees it.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>A function appends to a slice parameter. Why does the caller not see the new element?</summary><p>The callee's copy of the header got a new length (and maybe a new array). The caller's header still has the old length. If there was spare capacity the value was written into the shared array, just past where the caller looks.</p></details>
<details class="q"><summary>Why can a function add a key to a map argument but not make the caller's nil map non-nil?</summary><p>The map value is a pointer to a runtime structure. A copy of a valid pointer reaches the same map. A copy of a nil pointer can be reassigned locally, and that changes only the copy.</p></details>

<template id="t-chapter-6">
<p class="eyebrow">Chapter 6</p>
<h1>Pointers</h1>
<p class="lede">Go has pointers without pointer arithmetic. They exist for two reasons: to let a function change its caller's data, and to give you control over memory layout that garbage-collected languages usually hide.</p>
<div class="model"><b>Mental model</b>
<p>In Java, Python and JavaScript every object variable is secretly a pointer, and you get no say. Go makes it a choice per variable. A <code>Foo</code> is the data itself, laid out inline; a <code>*Foo</code> is an address. Values are cheap to reason about and usually stay on the stack. Pointers allow sharing and mutation, and tend to push data onto the heap where the garbage collector must track it.</p></div>
<figure class="code"><figcaption>the mechanics</figcaption><pre><code data-lang="go">x := 10
p := &amp;x            // &amp; gives the address; p has type *int
fmt.Println(*p)    // * dereferences: 10
*p = 20            // write through the pointer; x is now 20

var q *int         // zero value of a pointer is nil
// fmt.Println(*q) // panic: nil pointer dereference

n := new(int)      // rarely used: allocates a zero int, returns *int

// You cannot take the address of a constant or literal: &amp;10 is an error.
// A tiny generic helper fixes that for struct fields of pointer type:
func makePointer[T any](t T) *T { return &amp;t }
p2 := person{MiddleName: makePointer("Perry")}</code></pre></figure>

<h2>Pointers signal mutability</h2>
<div class="two wide">
<figure class="code"><figcaption>What works</figcaption><pre><code data-lang="go">func update(px *int) {
	*px = 20            // change the value the pointer refers to
}
x := 10
update(&amp;x)              // x is 20

// Prefer returning a value over filling a pointer:
func MakeFoo() (Foo, error) {
	f := Foo{Field1: "val", Field2: 20}
	return f, nil
}</code></pre></figure>
<figure class="code"><figcaption>What does not</figcaption><pre><code data-lang="go">func failedUpdate(px *int) {
	x2 := 20
	px = &amp;x2            // reassigns the LOCAL copy of the pointer
}
var f *int
failedUpdate(f)         // f is still nil

// The "out parameter" style hides data flow:
func MakeFoo(f *Foo) error {
	f.Field1 = "val"
	f.Field2 = 20
	return nil
}</code></pre></figure>
</div>
<p>Pointer parameters are justified when a function must fill something whose type it does not know. <code>json.Unmarshal(data, &v)</code> is the standard example: it predates generics and needs to write into your struct. Treat it as the exception.</p>
<h3>Zero value versus no value</h3>
<p>A <code>*int</code> can be <code>nil</code>, which lets JSON distinguish "field absent" from "field is 0". That is a reasonable use at an encoding boundary. Inside a Go API, do not return a nil pointer to mean "not found": return <code>(T, bool)</code>, the comma-ok idiom, so the caller cannot dereference by accident.</p>
<h3>Is passing a pointer faster?</h3>
<p>Passing a pointer costs about the same for any size, around a nanosecond. Passing a value gets slower as the struct grows, around a millisecond at ten megabytes. <em>Returning</em> is the other way round for small data: returning a pointer to a struct under roughly a megabyte is slower than returning the value, because the data must go to the heap. So for typical structs, use values, and reach for pointers when you need mutation or the data is large. Measure before believing either claim on your hardware.</p>

<h2>Stack, heap and escape analysis</h2>
<div class="model"><b>Mental model</b>
<p>The stack is a region per goroutine where each function call gets a frame. Allocating there is moving one pointer, and freeing is free: the frame vanishes on return. The heap is memory managed by the garbage collector. The compiler prefers the stack and proves, by <em>escape analysis</em>, when it can. Data moves to the heap when its size is not known at compile time or when a pointer to it outlives the frame that created it.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Stack vs heap escape simulator</h3>
<p>Pick a pattern. See where the data lives and what <code>go build -gcflags="-m"</code> reports.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">Pattern</span><span data-h="esc"></span></span></div>
<div class="grid2"><pre data-h="ecode"></pre><div class="stack">
<div class="grid2"><div class="pane"><h4>Stack</h4><div class="stack" data-h="estack"></div></div><div class="pane"><h4>Heap (GC-managed)</h4><div class="stack" data-h="eheap"></div></div></div>
<pre data-h="eout"></pre><div class="msg" data-h="emsg"></div></div></div>
</div></section>
<p>This is <em>mechanical sympathy</em>: writing code that suits the hardware. A slice of structs is one contiguous block that the CPU prefetches. A slice of pointers to structs is a list of addresses scattered over the heap, each a potential cache miss and each an object the collector must visit. Java pays that cost by default; in Go you choose.</p>
<figure class="code"><figcaption>slices as reusable buffers</figcaption><pre><code data-lang="go">file, err := os.Open(fileName)
if err != nil {
	return err
}
defer file.Close()

data := make([]byte, 100)        // one allocation, reused for the whole file
for {
	count, err := file.Read(data) // Read fills the buffer you hand it
	process(data[:count])
	if err != nil {
		if errors.Is(err, io.EOF) {
			return nil
		}
		return err
	}
}</code></pre></figure>
<p>Maps and slices fit this picture. A map variable is a pointer to a runtime struct, so passing it is cheap and shares the table. A slice is a three-word header (pointer, length, capacity) copied by value, sharing the array beneath (Chapters 3 and 5).</p>

<h2>Tuning the collector</h2>
<p>Go's collector favours low latency: it runs concurrently with your program and aims for sub-millisecond pauses. Two environment variables steer it. <code>GOGC</code> sets how much the heap may grow before the next cycle, as a percentage of the live heap left after the last one (default 100, meaning "collect when the heap has doubled"). <code>GOMEMLIMIT</code> sets a soft ceiling on total memory; near it, the collector runs more often regardless of <code>GOGC</code>.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>GC trigger curves</h3>
<p>The program keeps a steady live heap and allocates garbage at a constant rate. Move the dials and watch the saw-tooth.</p></header>
<div class="body">
<div class="ctl">
<span class="field"><label for="c6-live">Live heap: <b data-h="vlive"></b> MB</label><input id="c6-live" type="range" min="100" max="1500" step="50" value="400"></span>
<span class="field"><label for="c6-gogc">GOGC: <b data-h="vgogc"></b></label><input id="c6-gogc" type="range" min="0" max="400" step="25" value="100"></span>
<span class="field"><label for="c6-lim">GOMEMLIMIT: <b data-h="vlim"></b></label><input id="c6-lim" type="range" min="400" max="2100" step="100" value="2100"></span></div>
<div class="pane" data-h="gc"></div>
<div class="row"><span class="pill info" data-h="gpeak"></span><span class="pill" data-h="gcyc"></span></div><div class="msg" data-h="gmsg"></div>
</div></section>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>A nil pointer dereference is a panic,</strong> not an exception you catch. Check, or design so nil cannot occur.</li>
<li><strong><code>GOMEMLIMIT</code> is soft.</strong> If the live heap itself approaches the limit the collector thrashes, burning CPU to reclaim nothing. Set it comfortably below the container's memory, not at it.</li>
<li><strong>Do not hand-tune first.</strong> Reduce allocations (fewer pointers, reuse buffers) before touching GC settings.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>Why can Go return <code>&amp;local</code> safely when C cannot?</summary><p>The compiler sees the address leaving the function and allocates that variable on the heap instead of the stack. The pointer stays valid, and the collector frees it later.</p></details>
<details class="q"><summary>Why does <code>failedUpdate</code> leave the caller's pointer nil?</summary><p>The pointer was copied into the parameter. Assigning to the parameter repoints the copy. Only writing <em>through</em> a non-nil pointer reaches the caller's data.</p></details>

</template>
<template id="t-chapter-7">
<p class="eyebrow">Chapter 7</p>
<h1>Types, methods and interfaces</h1>
<p class="lede">Go has no classes and no inheritance. It has types, functions attached to types, and interfaces that types satisfy without saying so. That turns out to be enough, and easier to change later.</p>
<div class="model"><b>Mental model</b>
<p>A concrete type says what data is stored. An interface says what behaviour a caller needs. In Go the <em>caller</em> declares the interface, and any type with the right methods satisfies it automatically. So a library never has to anticipate your abstractions, and you never import a package just to say "implements".</p></div>

<h2>Types and methods</h2>
<figure class="code"><figcaption>methods</figcaption><pre><code data-lang="go">type Counter struct {
	total       int
	lastUpdated time.Time
}

// Pointer receiver: the method modifies the receiver.
// Receiver name is a short abbreviation of the type. Never this or self.
func (c *Counter) Increment() {
	c.total++
	c.lastUpdated = time.Now()
}

// Value receiver: reads only. Works on a copy.
func (c Counter) String() string {
	return fmt.Sprintf("total: %d, last updated: %v", c.total, c.lastUpdated)
}

var c Counter
c.Increment()          // Go rewrites this as (&amp;c).Increment()
fmt.Println(c.String())</code></pre></figure>
<p>Rules of thumb: use a pointer receiver if the method modifies the receiver or must handle <code>nil</code>. If any method on a type has a pointer receiver, give them all pointer receivers for consistency. Otherwise a value receiver is fine.</p>
<p>The automatic <code>&amp;c</code> is a convenience for variables. It does not apply when a value is stored in an interface, which is where <em>method sets</em> matter: the method set of <code>T</code> holds only value-receiver methods, the method set of <code>*T</code> holds both.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>Method set and implicit interface matcher</h3>
<p>Choose each method's receiver and which methods the interface demands. See which assignments compile.</p></header>
<div class="body">
<div class="ctl">
<span class="field"><span class="lbl">Increment() receiver</span><span data-h="r-inc"></span></span>
<span class="field"><span class="lbl">String() receiver</span><span data-h="r-str"></span></span>
<span class="field"><span class="lbl">Interface requires</span><span class="row"><button class="chip" data-h="q-inc">Increment()</button><button class="chip" data-h="q-str">String() string</button></span></span></div>
<div class="grid2"><pre data-h="mcode"></pre><div class="stack" data-h="mres"></div></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>nil receivers</figcaption><pre><code data-lang="go">type IntTree struct {
	val         int
	left, right *IntTree
}

// Returning the tree lets Insert work on a nil receiver:
// an empty tree is just a nil *IntTree.
func (it *IntTree) Insert(val int) *IntTree {
	if it == nil {
		return &amp;IntTree{val: val}
	}
	if val &lt; it.val {
		it.left = it.left.Insert(val)
	} else if val &gt; it.val {
		it.right = it.right.Insert(val)
	}
	return it
}

func (it *IntTree) Contains(val int) bool {
	switch {
	case it == nil:
		return false
	case val &lt; it.val:
		return it.left.Contains(val)
	case val &gt; it.val:
		return it.right.Contains(val)
	default:
		return true
	}
}

var it *IntTree          // nil is a valid, empty tree
it = it.Insert(5)</code></pre></figure>
<figure class="code"><figcaption>method values, iota</figcaption><pre><code data-lang="go">f1 := myAdder.AddTo       // method value: bound to myAdder, a closure
f2 := Adder.AddTo         // method expression: receiver becomes first parameter
f2(myAdder, 15)

// Declaring a type on another type is NOT inheritance.
type Score int
type HighScore Score      // new type, same underlying type, no shared methods
var hs HighScore = HighScore(Score(10))   // conversion required

// iota: for internal enumerations where the number itself is irrelevant
type MailCategory int
const (
	Uncategorized MailCategory = iota   // 0
	Personal                            // 1
	Spam                                // 2
)
// If the values are defined elsewhere (a spec, a database), write them out.</code></pre></figure>
</div>

<h2>Embedding is composition, not inheritance</h2>
<div class="two wide">
<figure class="code"><figcaption>Go</figcaption><pre><code data-lang="go">type Employee struct {
	Name string
	ID   string
}
func (e Employee) Description() string {
	return fmt.Sprintf("%s (%s)", e.Name, e.ID)
}

type Manager struct {
	Employee            // embedded: fields and methods are promoted
	Reports []Employee
}

m := Manager{Employee: Employee{Name: "Bob", ID: "12345"}}
fmt.Println(m.ID)             // promoted field
fmt.Println(m.Description())  // promoted method</code></pre></figure>
<figure class="code"><figcaption>What a Java mind expects, and does not get</figcaption><pre><code data-lang="go">var eFail Employee = m        // compile error: Manager is not an Employee
var eOK Employee = m.Employee // name the embedded field

// No dynamic dispatch back into the outer type.
type Inner struct{ A int }
func (i Inner) IntPrinter(v int) string { return fmt.Sprintf("Inner: %d", v) }
func (i Inner) Double() string { return i.IntPrinter(i.A * 2) }

type Outer struct{ Inner; S string }
func (o Outer) IntPrinter(v int) string { return fmt.Sprintf("Outer: %d", v) }

o := Outer{Inner: Inner{A: 10}}
fmt.Println(o.Double())       // "Inner: 20". Inner never learns about Outer.</code></pre></figure>
</div>

<h2>Interfaces</h2>
<figure class="code"><figcaption>accept interfaces, return structs</figcaption><pre><code data-lang="go">// The CLIENT declares what it needs. LogicProvider never mentions it.
type Logic interface {
	Process(data string) string
}

type Client struct{ L Logic }
func (c Client) Program() { c.L.Process("data") }

type LogicProvider struct{}
func (lp LogicProvider) Process(data string) string { return "processed " + data }

func main() {
	c := Client{L: LogicProvider{}}    // satisfies Logic implicitly
	c.Program()
}</code></pre></figure>
<p>Implicit interfaces give you duck typing's flexibility with a compiler check. Accepting an interface makes a function usable and testable with anything that fits. Returning a concrete type lets you add methods later without breaking callers. Keep interfaces small: the standard library's best ones (<code>io.Reader</code>, <code>io.Writer</code>, <code>fmt.Stringer</code>) have one method.</p>
<div class="model"><b>Mental model</b>
<p>An interface value is two words: a pointer to type information and a pointer to the data. It is <code>nil</code> only when <em>both</em> are nil. Put a nil pointer of a concrete type into an interface and the type word is filled in, so the interface is not nil, even though calling a method through it will hit a nil receiver.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Nil interface inspector</h3>
<p>Choose what the function returns as its <code>error</code>. Look at the two words inside the interface and what <code>err != nil</code> reports.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">The function returns</span><span data-h="nilpick"></span></span></div>
<div class="grid2"><pre data-h="ncode"></pre><div class="stack"><div class="pane"><h4>err, the interface value</h4><div class="row"><div class="stack" style="gap:3px"><span class="lbl">type word</span><span class="cell" data-h="ntype" style="min-width:140px"></span></div><div class="stack" style="gap:3px"><span class="lbl">value word</span><span class="cell" data-h="nval" style="min-width:140px"></span></div></div></div><div class="row"><span class="pill" data-h="nres"></span></div><div class="msg" data-h="nmsg"></div></div></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>any, assertions, type switches</figcaption><pre><code data-lang="go">var i any = 20                 // any is an alias for interface{}

n, ok := i.(int)               // comma-ok form never panics
if !ok { return fmt.Errorf("unexpected type for %v", i) }
s := i.(string)                // panics: interface holds int, not string

func doThings(i any) {
	switch j := i.(type) {     // j has the case's type inside each branch
	case nil:
	case int:
	case io.Reader:
	case bool, rune:           // several types: j stays any
	default:
	}
}</code></pre></figure>
<figure class="code"><figcaption>function types that implement interfaces</figcaption><pre><code data-lang="go">type Handler interface {
	ServeHTTP(http.ResponseWriter, *http.Request)
}

// A function type with a method: any matching function becomes a Handler.
type HandlerFunc func(http.ResponseWriter, *http.Request)

func (f HandlerFunc) ServeHTTP(w http.ResponseWriter, r *http.Request) {
	f(w, r)
}</code></pre></figure>
<figure class="code"><figcaption>dependency injection by hand</figcaption><pre><code data-lang="go">type DataStore interface{ UserNameForID(userID string) (string, bool) }
type Logger interface{ Log(message string) }

type SimpleLogic struct {
	l  Logger
	ds DataStore
}
func NewSimpleLogic(l Logger, ds DataStore) SimpleLogic { return SimpleLogic{l: l, ds: ds} }

// A plain function becomes a Logger through an adapter type
type LoggerAdapter func(message string)
func (lg LoggerAdapter) Log(message string) { lg(message) }

func main() {
	l := LoggerAdapter(LogOutput)
	ds := NewSimpleDataStore()
	logic := NewSimpleLogic(l, ds)     // wiring is ordinary code in main
	c := NewController(l, logic)
	http.HandleFunc("/hello", c.SayHello)
	http.ListenAndServe(":8080", nil)
}
// For large graphs, Google's Wire generates this wiring code at build time.</code></pre></figure>
</div>
<div class="why"><b>Unlearn</b><p>Do not start from a type hierarchy. Write concrete types. Introduce an interface at the point where a caller needs to accept more than one of them, and declare it next to that caller.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>A function declares <code>var e *MyErr</code>, never sets it, and ends with <code>return e</code> where the result type is <code>error</code>. Callers see an error. Why?</summary><p>The returned interface has type word <code>*MyErr</code> and a nil value word. Only an interface with both words nil equals <code>nil</code>. Return a literal <code>nil</code>, or declare the variable as <code>error</code>.</p></details>
<details class="q"><summary>Why can <code>Counter{}</code> not be stored in an interface that needs <code>Increment()</code> when that method has a pointer receiver?</summary><p>The value inside an interface is not addressable, so Go cannot take its address to call the method. The method set of <code>Counter</code> excludes pointer-receiver methods. Store <code>&amp;Counter{}</code>.</p></details>

</template>
<template id="t-chapter-8">
<p class="eyebrow">Chapter 8</p>
<h1>Generics</h1>
<p class="lede">Go went a decade without generics and added a deliberately small version in 1.18. It removes real duplication. It is also the feature most likely to be overused by people arriving from Java or C++.</p>
<div class="model"><b>Mental model</b>
<p>A type parameter lets you write an algorithm or container once and have the compiler check it for each type it is used with. A <em>constraint</em> is an interface that says which types are allowed and therefore which operations the body may use. Without generics the choices were: copy the code per type, or accept <code>any</code> and give up compile-time checking.</p></div>
<div class="two wide">
<figure class="code"><figcaption>With generics</figcaption><pre><code data-lang="go">type Stack[T comparable] struct {
	vals []T
}

func (s *Stack[T]) Push(val T) { s.vals = append(s.vals, val) }

func (s *Stack[T]) Pop() (T, bool) {
	if len(s.vals) == 0 {
		var zero T            // the zero value of an unknown type
		return zero, false
	}
	top := s.vals[len(s.vals)-1]
	s.vals = s.vals[:len(s.vals)-1]
	return top, true
}

func (s Stack[T]) Contains(val T) bool {
	for _, v := range s.vals {
		if v == val {         // == is allowed because T is comparable
			return true
		}
	}
	return false
}

var s Stack[int]
s.Push(10)
s.Push("nope")               // compile error</code></pre></figure>
<figure class="code"><figcaption>Before: any and hope</figcaption><pre><code data-lang="go">type Stack struct {
	vals []any
}

func (s *Stack) Push(val any) { s.vals = append(s.vals, val) }
func (s *Stack) Pop() (any, bool) { /* ... */ }

var s Stack
s.Push(10)
s.Push("nope")               // compiles; nobody notices
v, _ := s.Pop()
n := v.(int)                 // panics at run time, far from the cause</code></pre></figure>
</div>
<div class="tabs">
<figure class="code"><figcaption>Map, Filter, Reduce</figcaption><pre><code data-lang="go">func Map[T1, T2 any](s []T1, f func(T1) T2) []T2 {
	r := make([]T2, len(s))
	for i, v := range s {
		r[i] = f(v)
	}
	return r
}

func Filter[T any](s []T, f func(T) bool) []T {
	var r []T
	for _, v := range s {
		if f(v) {
			r = append(r, v)
		}
	}
	return r
}

func Reduce[T1, T2 any](s []T1, initializer T2, f func(T2, T1) T2) T2 {
	r := initializer
	for _, v := range s {
		r = f(r, v)
	}
	return r
}

words := []string{"One", "Potato", "Two", "Potato"}
lengths := Map(words, func(s string) int { return len(s) })   // T1, T2 inferred</code></pre></figure>
<figure class="code"><figcaption>constraints with type terms</figcaption><pre><code data-lang="go">// A type set: any type whose UNDERLYING type is one of these.
type Integer interface {
	~int | ~int8 | ~int16 | ~int32 | ~int64 |
		~uint | ~uint8 | ~uint16 | ~uint32 | ~uint64 | ~uintptr
}

func divAndRemainder[T Integer](num, denom T) (T, T, error) {
	if denom == 0 {
		return 0, 0, errors.New("cannot divide by zero")
	}
	return num / denom, num % denom, nil    // / and % valid for every type in the set
}

type MyInt int
var a, b MyInt = 10, 3
divAndRemainder(a, b)        // works because of the ~. Without it, only int itself qualifies.

// Type terms and methods can be combined: the type must satisfy both.
type PrintableInt interface {
	~int
	String() string
}</code></pre></figure>
<figure class="code"><figcaption>slices, maps, cmp (Go 1.21)</figcaption><pre><code data-lang="go">names := []string{"Tracy", "Pat", "Fred"}
slices.Sort(names)
idx, found := slices.BinarySearch(names, "Pat")
fmt.Println(slices.Contains(names, "Fred"), slices.Max(names))

people := []Person{{"Pat", 37}, {"Tracy", 23}}
slices.SortFunc(people, func(a, b Person) int {
	return cmp.Compare(a.Age, b.Age)        // negative, zero or positive
})

m := map[string]int{"a": 1}
m2 := maps.Clone(m)
fmt.Println(maps.Equal(m, m2), min(3, 1, 2), max(2.5, 1))   // min, max are built in</code></pre></figure>
</div>

<header><span class="tag">Lab</span><h3>Type constraint and approximation checker</h3>
<p>Rows are type arguments, columns are constraints. Click any cell for the reason.</p></header>

<div class="ctl" style="border-top:1px solid var(--line);padding-top:14px"><span class="field"><label for="c8-inf">Type inference: what is T?</label><select id="c8-inf"></select></span></div>
<pre data-h="infcode"></pre><div class="msg" data-h="infmsg"></div>

<h2>What Go left out, on purpose</h2>
<ul>
<li><strong>No specialisation.</strong> You cannot write one generic function plus a faster version for a particular type.</li>
<li><strong>No type parameters on methods.</strong> A method may use its type's parameters and cannot introduce its own, so a fluent <code>list.Map[U](...)</code> is impossible. Write a function.</li>
<li><strong>No operator overloading.</strong> <code>+</code> works on built-in numeric and string types only. Your matrix type gets an <code>Add</code> method.</li>
<li><strong>No variadic type parameters, no metaprogramming,</strong> no currying or partial application.</li>
</ul>
<div class="edge"><b>When not to use generics</b><ul>
<li><strong>If a parameter only needs a method called on it, take an interface.</strong> <code>func Process(r io.Reader)</code> beats <code>func Process[T io.Reader](r T)</code>.</li>
<li><strong>If implementations differ per type,</strong> generics will not help. That is what interfaces are for.</li>
<li><strong>Do not rewrite working code</strong> to be generic. Reach for a type parameter when you have written the same function twice for two types, for containers, and for helpers over slices, maps and channels of any element type.</li>
<li><strong>Generic code can be slower</strong> than you expect when called with interface type arguments. Benchmark hot paths.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Go 1.23 added range-over-function iterators and the <code>iter</code> package, with matching functions in <code>slices</code> and <code>maps</code> (<code>slices.Collect</code>, <code>maps.Keys</code> returning an iterator). Go 1.24 allows type aliases to have type parameters.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>What does the <code>~</code> in <code>~int</code> change?</summary><p>Without it, the constraint matches the type <code>int</code> exactly. With it, it matches every type whose underlying type is <code>int</code>, including your own <code>type UserID int</code>.</p></details>
<details class="q"><summary>Why must <code>Pop</code> declare <code>var zero T</code> instead of returning <code>nil</code> or <code>0</code>?</summary><p>The body must be valid for every type <code>T</code> may be. <code>nil</code> is not a value of <code>int</code> and <code>0</code> is not a value of <code>string</code>. A declared variable of type <code>T</code> is always its zero value.</p></details>
