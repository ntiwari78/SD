<template id="t-chapter-9">
<p class="eyebrow">Chapter 9</p>
<h1>Errors</h1>
<p class="lede">Go has no exceptions. A function that can fail returns an <code>error</code> as its last value and the caller deals with it on the next line. People complain about the verbosity for a week and then stop being surprised by where failures come from.</p>
<div class="model"><b>Mental model</b>
<p>An error is a value of an ordinary interface type with one method, <code>Error() string</code>. It travels through return values, the same path as data, so every place an error can appear is visible in the code. Exceptions add a second, invisible control path; Go's designers chose to have only one. Indent the error handling, keep the happy path flush left.</p></div>
<div class="two wide">
<figure class="code"><figcaption>Go</figcaption><pre><code data-lang="go">func calcRemainderAndMod(num, denom int) (int, int, error) {
	if denom == 0 {
		return 0, 0, errors.New("denominator is 0")
	}
	return num / denom, num % denom, nil
}

rem, mod, err := calcRemainderAndMod(20, 3)
if err != nil {
	fmt.Println(err)
	os.Exit(1)
}
fmt.Println(rem, mod)
// Error strings: lowercase, no trailing punctuation.
// Return zero values for the other results alongside an error.</code></pre></figure>
<figure class="code"><figcaption>Exception habits</figcaption><pre><code data-lang="go">// Panic used as throw
func parse(s string) Config {
	if s == "" {
		panic("empty config")     // crashes the caller's program
	}
	// ...
}

// Swallowing
result, _ := doThing()            // the _ hides a failure

// Catch-all at the top, context lost
defer func() {
	if r := recover(); r != nil {
		log.Println("something went wrong")
	}
}()</code></pre></figure>
</div>

<h2>Three kinds of error value</h2>
<div class="tabs">
<figure class="code"><figcaption>strings</figcaption><pre><code data-lang="go">err1 := errors.New("only even numbers are processed")
err2 := fmt.Errorf("%d isn't an even number", i)      // formatted message</code></pre></figure>
<figure class="code"><figcaption>sentinels</figcaption><pre><code data-lang="go">// A package-level variable that means one specific condition.
// Names start with Err. Part of your public API forever, so use few.
var ErrFormat = errors.New("zip: not a valid zip file")

data := []byte("This is not a zip file")
_, err := zip.NewReader(bytes.NewReader(data), int64(len(data)))
if err == zip.ErrFormat {          // works here; errors.Is works after wrapping too
	fmt.Println("Told you so")
}
// Others you will meet: io.EOF, sql.ErrNoRows, context.Canceled</code></pre></figure>
<figure class="code"><figcaption>custom types</figcaption><pre><code data-lang="go">// Errors are values: a struct can carry whatever the caller needs.
type Status int
const (
	InvalidLogin Status = iota + 1
	NotFound
)

type StatusErr struct {
	Status  Status
	Message string
}

func (se StatusErr) Error() string { return se.Message }

func LoginAndGetData(uid, pwd, file string) ([]byte, error) {
	token, err := login(uid, pwd)
	if err != nil {
		return nil, StatusErr{Status: InvalidLogin, Message: fmt.Sprintf("invalid credentials for user %s", uid)}
	}
	// ...
	return data, nil          // always declare the result as error, never as StatusErr
}</code></pre></figure>
</div>

<h2>Wrapping</h2>
<p>As an error passes up the stack, each layer can add context and keep the original inside. <code>fmt.Errorf</code> with <code>%w</code> does that and gives the new error an <code>Unwrap</code> method. Use <code>%v</code> instead and you get the same message with the link cut, which is right when the underlying error is an implementation detail you do not want callers to depend on. Since Go 1.20 an error can wrap several others, through <code>errors.Join</code> or multiple <code>%w</code> verbs, which makes the chain a tree.</p>
<div class="model"><b>Mental model</b>
<p><code>errors.Is(err, target)</code> asks "is this specific <em>value</em> anywhere in the tree?" <code>errors.As(err, &amp;target)</code> asks "is there an error of this <em>type</em>, and if so hand it to me." Both walk depth-first through <code>Unwrap</code>. Never compare a possibly-wrapped error with <code>==</code> or a type assertion.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Error wrapping tree and errors.Is / errors.As traverser</h3>
<p>Build an error from the inside out, then run a query and watch the walk.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">Innermost error</span><span data-h="base"></span></span></div>
<div class="ctl"><span class="lbl">Wrap it</span><button class="btn ghost" data-h="w-w">fmt.Errorf("…: %w", err)</button><button class="btn ghost" data-h="w-v">fmt.Errorf("…: %v", err)</button><button class="btn ghost" data-h="w-j">errors.Join(err, ErrTimeout)</button><button class="btn ghost" data-h="w-r">Reset</button></div>
<div class="ctl"><span class="field"><label for="c9-q">Query</label><select id="c9-q"></select></span><span class="pill" data-h="qres"></span></div>
<div class="grid2"><div class="pane"><h4>Error tree (outermost first)</h4><div data-h="tree"></div></div>
<div class="stack"><div class="lbl">err.Error()</div><pre data-h="estr" style="white-space:pre-wrap"></pre><div class="msg" data-h="qmsg"></div></div></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>Is and As</figcaption><pre><code data-lang="go">func fileChecker(name string) error {
	f, err := os.Open(name)
	if err != nil {
		return fmt.Errorf("in fileChecker: %w", err)
	}
	f.Close()
	return nil
}

err := fileChecker("not_here.txt")
if errors.Is(err, os.ErrNotExist) {          // value match, through the wrapper
	fmt.Println("That file doesn't exist")
}

var statusErr StatusErr
if errors.As(err, &amp;statusErr) {              // type match; fills statusErr
	fmt.Println(statusErr.Status)
}
// The target must be a pointer to an error type or to an interface;
// anything else panics. A type may define its own Is or As method
// to customise matching, e.g. to match on some fields only.</code></pre></figure>
<figure class="code"><figcaption>Join and multiple %w</figcaption><pre><code data-lang="go">func Validate(p Person) error {
	var errs []error
	if len(p.FirstName) == 0 {
		errs = append(errs, errors.New("field FirstName cannot be empty"))
	}
	if p.Age &lt; 0 {
		errs = append(errs, errors.New("field Age cannot be negative"))
	}
	if len(errs) &gt; 0 {
		return errors.Join(errs...)          // one error, every problem reported
	}
	return nil
}

err3 := fmt.Errorf("first: %w, second: %w", err1, err2)   // also wraps both</code></pre></figure>
<figure class="code"><figcaption>defer to wrap once</figcaption><pre><code data-lang="go">// Without this, every return repeats the same fmt.Errorf("in DoSomeThings: %w", err).
func DoSomeThings(val1 int, val2 string) (_ string, err error) {
	defer func() {
		if err != nil {
			err = fmt.Errorf("in DoSomeThings: %w", err)
		}
	}()
	val3, err := doThing1(val1)
	if err != nil {
		return "", err
	}
	val4, err := doThing2(val2)
	if err != nil {
		return "", err
	}
	return doThing3(val3, val4)
}</code></pre></figure>
</div>

<h2><code>panic</code> and <code>recover</code></h2>
<p>A panic means the program is in a state its author did not think possible: an out-of-range index, a nil dereference, a broken invariant. It unwinds the stack running deferred functions, then crashes with a stack trace. <code>recover</code>, called inside a deferred function, stops the unwinding. Its legitimate uses are narrow: shutting down cleanly, and stopping a panic from crossing a boundary you own, such as a library's public API or a server's per-request handler. It is not <code>try/catch</code>.</p>
<figure class="code"><figcaption>a recover boundary</figcaption><pre><code data-lang="go">func div60(i int) {
	defer func() {
		if v := recover(); v != nil {
			fmt.Println(v)             // log it, convert to an error, carry on
		}
	}()
	fmt.Println(60 / i)
}

for _, val := range []int{1, 2, 0, 6} {
	div60(val)                         // the division by zero does not kill the loop
}
// Need a stack trace in an error? fmt's %+v with a third-party wrapper,
// or log with a stack at the boundary. Build with -trimpath to hide local paths.</code></pre></figure>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Returning a typed nil.</strong> Declare error results and variables as <code>error</code>, or a nil <code>*StatusErr</code> becomes a non-nil error (Chapter 7).</li>
<li><strong>Wrapping makes the inner error part of your API.</strong> Callers can now match on it. If that is not a promise you want to keep, use <code>%v</code>.</li>
<li><strong>Sentinels cannot carry detail.</strong> If the caller needs to know which file or which status, use a type.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>You wrap <code>sql.ErrNoRows</code> with <code>%w</code> twice. Does <code>err == sql.ErrNoRows</code> hold?</summary><p>No. <code>err</code> is the outer wrapper, a different value. <code>errors.Is(err, sql.ErrNoRows)</code> holds, because it unwraps.</p></details>
<details class="q"><summary>When is <code>%v</code> the right verb for an underlying error?</summary><p>When you want its text in the message and do not want callers to be able to detect or depend on it, for example a driver-specific error behind a storage interface.</p></details>

</template>
<template id="t-chapter-10">
<p class="eyebrow">Chapter 10</p>
<h1>Modules, packages and imports</h1>
<p class="lede">Go's dependency management was designed after watching other ecosystems struggle. Its choices look odd at first: no lock file, no version ranges, no central registry, and the import path is the major version.</p>
<div class="model"><b>Mental model</b>
<p>Three nested things. A <em>repository</em> is where code lives in version control. A <em>module</em> is a unit of release, a tree with a <code>go.mod</code> at its root and a version. A <em>package</em> is a directory of <code>.go</code> files that compile together. You import packages, you depend on modules, and you usually keep one module per repository.</p></div>
<div class="tabs">
<figure class="code"><figcaption>go.mod</figcaption><pre><code data-lang="text">module github.com/learning-go-book-2e/money

go 1.21                  // minimum Go version; also selects language behaviour

toolchain go1.22.3       // optional: the toolchain to use when building THIS module

require (
	github.com/learning-go-book-2e/formatter v0.0.0-20220918024742-1835a89362c9
	github.com/shopspring/decimal v1.3.1
)

require (
	github.com/fatih/color v1.13.0 // indirect
	golang.org/x/sys v0.0.0-20210630005230-0f9fa26af87c // indirect
)
// go.sum, beside this file, holds a cryptographic hash of every module
// version used. It is a tamper check, not a lock file. Commit both.</code></pre></figure>
<figure class="code"><figcaption>everyday commands</figcaption><pre><code data-lang="bash">$ go get github.com/shopspring/decimal          # add or upgrade one dependency
$ go get github.com/shopspring/decimal@v1.3.1   # a specific version
$ go get -u ./...                               # newest minor/patch of everything
$ go mod tidy                                   # add what is missing, drop what is unused
$ go list -m -versions github.com/learning-go-book-2e/simpletax
$ go mod vendor                                 # copy dependencies into ./vendor
$ go work init ./workspace_lib ./workspace_app  # multi-module workspace</code></pre></figure>
</div>
<h2>Packages</h2>
<ul>
<li><strong>Visibility is spelled with capitalisation.</strong> <code>Format</code> is exported; <code>format</code> is package-private. There is no <code>public</code> or <code>private</code> keyword, and nothing in between except <code>internal</code>.</li>
<li><strong>Name packages for what they provide,</strong> lowercase, one word, no <code>util</code> or <code>common</code>. Callers write <code>extract.Names</code>, so do not repeat the package in the identifier (<code>extract.ExtractNames</code>).</li>
<li><strong>Import cycles are a compile error.</strong> If two packages need each other they are one package, or a shared piece belongs in a third.</li>
<li><strong>Doc comments</strong> go directly above the declaration and start with its name. <code>go doc</code> and pkg.go.dev render them, including headings, lists, links and code blocks.</li>
<li><strong>Avoid <code>init()</code>.</strong> It runs before <code>main</code> with no way to pass arguments or return errors, and hides work behind an import. Reserve it for registering with a registry you cannot avoid, and prefer explicit setup.</li>
</ul>
<figure class="code"><figcaption>a common layout</figcaption><pre><code data-lang="text">myapp/
  go.mod
  cmd/
    server/main.go        # one directory per binary; package main
    migrate/main.go
  internal/               # importable only from inside myapp
    auth/
    store/
  pkg/                    # optional: code you intend others to import
    api/
# Start flat. Add directories when the code tells you to, not before.</code></pre></figure>

<h2>Minimal version selection</h2>
<div class="model"><b>Mental model</b>
<p>Each module states the <em>minimum</em> version of each dependency it needs. Go builds with the smallest version that satisfies every stated minimum, which is simply the highest of them. It never picks something newer just because it exists. The result is the same today and next year without a lock file, and a dependency upgrades only when somebody edits a <code>go.mod</code>.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Minimal version selection simulator</h3>
<p>Your app needs modules A and B. Both need C. Change what each asks for and compare Go's answer with a newest-wins resolver.</p></header>
<div class="body">
<div class="ctl">
<span class="field"><label for="c10-a">A requires C at least</label><select id="c10-a"></select></span>
<span class="field"><label for="c10-b">B requires C at least</label><select id="c10-b"></select></span>
<span class="field"><label for="c10-m">Your go.mod requires C</label><select id="c10-m"></select></span></div>
<div class="pane" data-h="mvs"></div>
<div class="row"><span class="pill ok" data-h="pick"></span><span class="pill warn" data-h="npm"></span></div><div class="msg" data-h="mvsmsg"></div>
</div></section>
<p>Versions follow semantic versioning, and Go enforces the part that matters. A module at <code>v2</code> or above must put the major version in its module path, so <code>github.com/x/c</code> and <code>github.com/x/c/v2</code> are different modules that can both be in one build. That is the <em>import compatibility rule</em>: same import path means backward compatible. <code>v0</code> makes no promises.</p>
<div class="tabs">
<figure class="code"><figcaption>v2 import path</figcaption><pre><code data-lang="go">// go.mod of the library
module github.com/learning-go-book-2e/simpletax/v2

// in your code
import "github.com/learning-go-book-2e/simpletax/v2"</code></pre></figure>
<figure class="code"><figcaption>replace, exclude, retract</figcaption><pre><code data-lang="text">// In your go.mod: use a fork or a local copy (only honoured in the main module)
replace github.com/some/dep =&gt; ../dep-fork
exclude github.com/some/dep v1.4.2          // never select this version

// In a library's own go.mod: withdraw a bad release
retract v1.5.0 // published with a broken checksum</code></pre></figure>
<figure class="code"><figcaption>go.work</figcaption><pre><code data-lang="text">go 1.21

use (
	./workspace_lib      // local edits here are seen by...
	./workspace_app      // ...this module, with no replace directives to forget
)
// Keep go.work out of version control: it describes your machine.</code></pre></figure>
<figure class="code"><figcaption>type alias for a gradual move</figcaption><pre><code data-lang="go">// Old package keeps compiling for callers while the type lives elsewhere.
package oldpkg

import "example.com/app/newpkg"

type Foo = newpkg.Foo       // = makes an alias: the SAME type, two names

// Without the = it would be a new type with no methods.</code></pre></figure>
</div>

<h2><code>internal</code></h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Who may import an internal package?</h3>
<p>Pick an importing package and an internal package. The rule: code may import <code>…/internal/…</code> only if it lives under the directory that contains <code>internal</code>.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c10-from">Importer</label><select id="c10-from"></select></span><span class="field"><label for="c10-to">Imports</label><select id="c10-to"></select></span><span class="pill" data-h="ires"></span></div>
<div class="tree" data-h="itree"></div><div class="msg" data-h="imsg"></div>
</div></section>
<h3>Where modules come from</h3>
<p>There is no central registry. A module's path is where its source lives. By default the <code>go</code> command fetches through Google's module proxy (<code>GOPROXY=https://proxy.golang.org,direct</code>), which caches every version so a deleted repository does not break your build, and checks hashes against a public checksum database. For private code, set <code>GOPRIVATE=*.example.com,github.com/my-org/*</code> so those paths bypass the proxy and the checksum database. Companies often run their own proxy.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>"Minimal" surprises people expecting latest.</strong> A fix released upstream reaches you only after <code>go get -u</code> or an explicit bump.</li>
<li><strong><code>replace</code> in a library is ignored by its consumers.</strong> It is for the top-level module only.</li>
<li><strong>Vendoring must be kept in sync.</strong> After any dependency change run <code>go mod vendor</code> again; the build fails if <code>vendor/</code> and <code>go.mod</code> disagree.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Go 1.24 added a <code>tool</code> directive to <code>go.mod</code> and <code>go get -tool</code>, so developer tools can be versioned per module and run with <code>go tool name</code>, replacing the old <code>tools.go</code> blank-import trick.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>A needs C v1.1.0, B needs C v1.3.0, and C v1.9.0 exists. What gets built?</summary><p>C v1.3.0: the lowest version that meets both minimums. v1.9.0 is ignored until some <code>go.mod</code> in the graph asks for it.</p></details>
<details class="q"><summary>Why can v1 and v2 of the same library coexist in one binary?</summary><p>Their module paths differ (<code>…/c</code> and <code>…/c/v2</code>), so to the toolchain they are unrelated modules with separate packages and types.</p></details>

<template id="t-chapter-11">
<p class="eyebrow">Chapter 11</p>
<h1>Go tooling</h1>
<p class="lede">The <code>go</code> command is a build system, package manager, test runner and code generator host. Around it sits a small set of tools nearly every team uses. Knowing them is part of writing idiomatic Go.</p>
<div class="model"><b>Mental model</b>
<p>The build is a pure function of source files, the target platform and a few environment variables. No install step on the target, no interpreter, no shared libraries by default. That makes three things cheap that are painful elsewhere: cross-compiling, shipping assets inside the binary, and knowing precisely which code a binary contains.</p></div>
<div class="tabs">
<figure class="code"><figcaption>run, install</figcaption><pre><code data-lang="bash">$ go run .                         # compile to a temp dir, run, delete. For prototypes and scripts
$ go run main.go helper.go

# Install a tool as a binary in $GOPATH/bin (default ~/go/bin). Version is required.
# This does not touch any go.mod.
$ go install github.com/rakyll/hey@latest
$ go install golang.org/x/tools/cmd/goimports@latest
$ goimports -l -w .                # gofmt plus: adds missing imports, removes unused, sorts</code></pre></figure>
<figure class="code"><figcaption>linters</figcaption><pre><code data-lang="bash">$ go vet ./...                                         # built in, few false positives
$ go install honnef.co/go/tools/cmd/staticcheck@latest
$ staticcheck ./...                                    # 150+ checks, high signal
$ revive ./...                                         # style and naming, configurable
$ golangci-lint run                                    # runs dozens of linters in one pass</code></pre></figure>
<figure class="code"><figcaption>.golangci.yml</figcaption><pre><code data-lang="yaml">linters:
  enable:
    - govet
    - staticcheck
    - errcheck          # unchecked error returns
    - ineffassign       # assignments never read
    - unused
    - predeclared       # shadowing of true, nil, len...
linters-settings:
  govet:
    enable:
      - shadow          # := shadowing from Chapter 4
# Start with a small set the team agrees on. Every new linter
# is a new source of arguments; add them one at a time.</code></pre></figure>
<figure class="code"><figcaption>Makefile</figcaption><pre><code data-lang="make">.DEFAULT_GOAL := build
.PHONY: fmt vet lint vuln generate build build-linux

fmt:
	goimports -l -w .
vet: fmt
	go vet ./...
lint: vet
	staticcheck ./...
vuln:
	govulncheck ./...
generate:

build: lint
	go build -o bin/app ./cmd/app
build-linux: lint
	CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/app-linux-amd64 ./cmd/app</code></pre></figure>
</div>

<h2>govulncheck: is the vulnerable code reachable?</h2>
<p>Most scanners report every known vulnerability in every module version you depend on. <code>govulncheck</code> goes further: it builds your program's call graph and reports a vulnerability only when your code can reach the affected function. A flaw in a function you never call is listed separately as informational.</p>

# Before that, or to keep one installed side by side:
$ go install golang.org/dl/go1.19.2@latest &amp;&amp; go1.19.2 download
$ go1.19.2 build</code></pre></figure>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Cross-compiling with cgo needs a C cross-compiler</strong> for the target. Pure Go (<code>CGO_ENABLED=0</code>) cross-compiles with nothing extra, and gives a static binary that runs in a scratch container.</li>
<li><strong>Embedded files are in the binary for anyone to read.</strong> Never embed secrets.</li>
<li><strong>A file whose build constraint is false is not compiled, so it is not type-checked either.</strong> Platform-specific code rots unless CI builds every target.</li>
<li><strong>Linters disagree with each other.</strong> Treat lint output as advice until the team has agreed which rules are law.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>Why does <code>go install tool@latest</code> not add the tool to your <code>go.mod</code>?</summary><p>With a version suffix, <code>go install</code> builds the tool in its own module context, ignoring the current directory's module. Your dependencies stay limited to what your code imports.</p></details>
<details class="q"><summary><code>//go:embed templates</code> skipped <code>templates/_base.html</code>. Why?</summary><p>When a pattern names a directory, files beginning with <code>.</code> or <code>_</code> are left out. Use the <code>all:</code> prefix, or a wildcard pattern, to include them.</p></details>

<template id="t-chapter-12">
<p class="eyebrow">Chapter 12</p>
<h1>Concurrency in Go</h1>
<p class="lede">Goroutines and channels are the features Go is known for. The book's advice is to use them less than you expect, and to be exact about the rules when you do.</p>
<div class="model"><b>Mental model</b>
<p>Concurrency is structuring a program as independent steps that may overlap. Parallelism is running steps at the same instant. Concurrency helps when steps wait on something outside the CPU: a network call, a disk, a database. For in-memory work that finishes in microseconds, the overhead of coordinating goroutines costs more than it saves. Go's model is Communicating Sequential Processes: goroutines do not share variables, they hand values to each other through channels.</p></div>
<h2>Goroutines</h2>
<p>A goroutine is a function running on a lightweight thread managed by the Go runtime, not the OS. It starts with a small stack that grows as needed, so creating one costs little memory and switching between them avoids a system call. The scheduler multiplexes many goroutines over a few OS threads and parks any that are blocked on I/O or a channel. Tens of thousands is ordinary.</p>
<figure class="code"><figcaption>keep the go keyword out of your API</figcaption><pre><code data-lang="go">// Business logic: an ordinary function. Easy to test, no concurrency in sight.
func process(val int) int { return val * 2 }

// Concurrency lives in a wrapper, started with a closure.
func processConcurrently(inVals []int) []int {
	in := make(chan int, 5)
	out := make(chan int, 5)
	for i := 0; i &lt; 5; i++ {          // five workers
		go func() {
			for val := range in {     // ends when in is closed
				out &lt;- process(val)
			}
		}()
	}
	go func() {
		for _, v := range inVals {
			in &lt;- v
		}
		close(in)                     // the WRITER closes
	}()
	outVals := make([]int, 0, len(inVals))
	for range len(inVals) {
		outVals = append(outVals, &lt;-out)
	}
	return outVals
}</code></pre></figure>

<h2>Channels</h2>
<figure class="code"><figcaption>channel syntax</figcaption><pre><code data-lang="go">ch := make(chan int)        // unbuffered: a send waits for a receive, and vice versa
bch := make(chan int, 10)   // buffered: sends wait only when the buffer is full

a := &lt;-ch                   // receive
ch &lt;- 5                     // send

func producer(out chan&lt;- int) {}   // send-only parameter
func consumer(in &lt;-chan int) {}    // receive-only parameter

for v := range ch { }       // receive until the channel is closed and drained
v, ok := &lt;-ch               // ok is false once it is closed and empty
close(ch)</code></pre></figure>

<h2><code>select</code></h2>
<p><code>select</code> waits on several channel operations at once and runs one that can proceed. If several can, it picks at random, which prevents starvation and removes the lock-ordering problem behind most deadlocks. A <code>default</code> case makes it non-blocking. A <code>nil</code> channel never becomes ready, so setting a channel variable to <code>nil</code> switches its case off.</p>
<div class="tabs">
<figure class="code"><figcaption>for-select with a done channel</figcaption><pre><code data-lang="go">for {
	select {
	case &lt;-done:
		return                 // someone told us to stop
	case v := &lt;-ch:
		fmt.Println(v)
	}
}</code></pre></figure>
<figure class="code"><figcaption>turning a case off with nil</figcaption><pre><code data-lang="go">// Reading a closed channel always succeeds, so a closed case would spin.
for count := 0; count &lt; 2; {
	select {
	case v, ok := &lt;-in:
		if !ok {
			in = nil           // this case can never fire again
			count++
			continue
		}
		// process v
	case v, ok := &lt;-in2:
		if !ok {
			in2 = nil
			count++
			continue
		}
		// process v
	}
}</code></pre></figure>
<figure class="code"><figcaption>timeouts</figcaption><pre><code data-lang="go">func timeLimit[T any](worker func() T, limit time.Duration) (T, error) {
	out := make(chan T, 1)                 // buffered: the worker can finish and exit even if nobody is listening
	ctx, cancel := context.WithTimeout(context.Background(), limit)
	defer cancel()
	go func() {
		out &lt;- worker()
	}()
	select {
	case result := &lt;-out:
		return result, nil
	case &lt;-ctx.Done():
		var zero T
		return zero, errors.New("work timed out")
	}
}</code></pre></figure>
</div>

<h2>Patterns that keep you out of trouble</h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Backpressure with a buffered-channel semaphore</h3>
<p>The server allows three requests in flight. Tokens live in a buffered channel; <code>select</code> with <code>default</code> rejects work when none is free.</p></header>
<div class="body">
<div class="row"><button class="btn" data-h="arrive">A request arrives</button><button class="btn ghost" data-h="finish">One request finishes</button><span class="pill info" data-h="sstat"></span></div>
<div class="grid2"><div class="stack"><div class="pane"><h4>Token channel (cap 3)</h4><div class="mem" data-h="tok"></div></div><pre data-h="slog" style="max-height:150px"></pre><div class="msg" data-h="smsg"></div></div>
<pre data-h="scode"></pre></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>avoid leaks</figcaption><pre><code data-lang="go">// A goroutine blocked forever on a channel is never collected.
// Give every goroutine a way to be told to stop.
func countTo(ctx context.Context, max int) &lt;-chan int {
	ch := make(chan int)
	go func() {
		defer close(ch)
		for i := 0; i &lt; max; i++ {
			select {
			case &lt;-ctx.Done():
				return             // caller lost interest
			case ch &lt;- i:
			}
		}
	}()
	return ch
}

ctx, cancel := context.WithCancel(context.Background())
defer cancel()                     // without this, breaking early strands the goroutine
for i := range countTo(ctx, 10) {
	if i &gt; 5 {
		break
	}
	fmt.Println(i)
}</code></pre></figure>
<figure class="code"><figcaption>WaitGroup and Once</figcaption><pre><code data-lang="go">var wg sync.WaitGroup
wg.Add(3)                          // before starting the goroutines
for i := 0; i &lt; 3; i++ {
	go func() {
		defer wg.Done()
		doThing()
	}()
}
wg.Wait()                          // blocks until the counter is zero

// Lazy, exactly-once initialisation, safe from any goroutine
var parser SlowComplicatedParser
var once sync.Once

func Parse(dataToParse string) string {
	once.Do(func() { parser = initParser() })
	return parser.Parse(dataToParse)
}
// Go 1.21 adds sync.OnceFunc, OnceValue and OnceValues as shortcuts.</code></pre></figure>
<figure class="code"><figcaption>mutex or channel?</figcaption><pre><code data-lang="go">// Sharing a small piece of state between goroutines: a mutex is clearer.
type MutexScoreboardManager struct {
	l          sync.RWMutex
	scoreboard map[string]int
}

func (m *MutexScoreboardManager) Update(name string, val int) {
	m.l.Lock()
	defer m.l.Unlock()
	m.scoreboard[name] = val
}

func (m *MutexScoreboardManager) Read(name string) (int, bool) {
	m.l.RLock()
	defer m.l.RUnlock()
	val, ok := m.scoreboard[name]
	return val, ok
}
// Coordinating goroutines or handing a value from one to another: a channel.
// Guarding a field in a struct: a mutex. Never copy a mutex; pass by pointer.</code></pre></figure>
</div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Deadlock.</strong> If every goroutine is blocked, the runtime kills the program with "all goroutines are asleep". If only some are, you have a silent leak.</li>
<li><strong>Buffered channels do not fix a design.</strong> Use a buffer when you know how many goroutines you launched and want to bound work, not to make a deadlock go away.</li>
<li><strong>Closing is the sender's job,</strong> once, and only needed when a receiver is waiting for the end. Closing from two places is a panic waiting to happen.</li>
<li><strong>Leave <code>sync/atomic</code> and <code>sync.Map</code> alone</strong> unless you have measured a need. They are easy to get subtly wrong.</li>
<li><strong>Run tests with <code>-race</code>.</strong> Data races are undefined behaviour; the detector finds the ones your tests exercise (Chapter 15).</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>Why does reading from a closed channel not block?</summary><p>A closed channel is permanently ready: it yields remaining buffered values, then the zero value with <code>ok == false</code>, immediately and forever. That is what lets <code>for range</code> terminate, and why a closed channel inside <code>select</code> must be set to <code>nil</code>.</p></details>
<details class="q"><summary>The <code>timeLimit</code> helper makes its channel with capacity 1. What happens with capacity 0 when the timeout fires first?</summary><p>The worker eventually tries to send, nobody will ever receive, and that goroutine blocks forever: a leak per timed-out call. The buffer lets it deposit the result and exit.</p></details>

<template id="t-chapter-13">
<p class="eyebrow">Chapter 13</p>
<h1>The standard library</h1>
<p class="lede">Go's standard library is large enough to build production services without a framework. Its best parts share one habit: tiny interfaces that compose.</p>
<div class="model"><b>Mental model</b>
<p><code>io.Reader</code> and <code>io.Writer</code> have one method each. Because they ask for so little, almost everything implements them: files, sockets, buffers, compressors, hashers, HTTP bodies. And because functions accept the interface, you add behaviour by <em>wrapping</em>: a reader that takes a reader. This is the decorator pattern with no base classes, and it is the shape of HTTP middleware too.</p></div>
<h2>io and friends</h2>
<figure class="code"><figcaption>Reader, Writer and why the signature looks odd</figcaption><pre><code data-lang="go">type Reader interface {
	Read(p []byte) (n int, err error)    // caller supplies the buffer: no allocation per call
}
type Writer interface {
	Write(p []byte) (n int, err error)
}

// Works on anything readable: a file, a string, a gzip stream, a network body.
func countLetters(r io.Reader) (map[string]int, error) {
	buf := make([]byte, 2048)
	out := map[string]int{}
	for {
		n, err := r.Read(buf)
		for _, b := range buf[:n] {      // process n bytes BEFORE checking err
			if (b &gt;= 'A' &amp;&amp; b &lt;= 'Z') || (b &gt;= 'a' &amp;&amp; b &lt;= 'z') {
				out[string(b)]++
			}
		}
		if err == io.EOF {
			return out, nil
		}
		if err != nil {
			return nil, err
		}
	}
}
// Also in io: Copy, MultiReader, MultiWriter, LimitReader, TeeReader, ReadAll,
// and Closer and Seeker with combined interfaces such as ReadCloser.</code></pre></figure>

<h2>time</h2>
<figure class="code"><figcaption>durations, instants, layouts</figcaption><pre><code data-lang="go">d := 2*time.Hour + 30*time.Minute          // time.Duration: an int64 of nanoseconds
t := time.Now()                            // time.Time: an instant, with a location
later := t.Add(d)
fmt.Println(later.Sub(t), t.Before(later), t.Equal(later))   // use Equal, not ==

// Layouts are written as an EXAMPLE of the reference time:
//   Mon Jan 2 15:04:05 MST 2006     (01/02 03:04:05PM '06 -0700: the fields count 1 2 3 4 5 6 7)
t2, err := time.Parse("2006-01-02 15:04:05 -0700", "2023-03-13 00:00:00 +0000")
fmt.Println(t2.Format("January 2, 2006 at 3:04:05PM MST"))

// time.Now() also records a monotonic reading, so elapsed time is
// immune to the wall clock being adjusted underneath you.
start := time.Now()
doWork()
elapsed := time.Since(start)

timer := time.NewTimer(2 * time.Second)    // fires once on timer.C
ticker := time.NewTicker(time.Second)      // fires repeatedly; call ticker.Stop()</code></pre></figure>

<h2>encoding/json</h2>
<div class="two wide">
<figure class="code"><figcaption>Go</figcaption><pre><code data-lang="go">type Order struct {
	ID          string    `json:"id"`
	DateOrdered time.Time `json:"date_ordered"`
	CustomerID  string    `json:"customer_id"`
	Items       []Item    `json:"items"`
	Note        string    `json:"note,omitempty"`   // left out when empty
	internal    int       // unexported: invisible to the encoder
}

var o Order
err := json.Unmarshal([]byte(data), &amp;o)      // needs a pointer to fill
out, err := json.Marshal(o)

// Streams: decode straight from any io.Reader, no intermediate []byte
dec := json.NewDecoder(resp.Body)
for dec.More() {
	var t struct{ Name string `json:"name"` }
	if err := dec.Decode(&amp;t); err != nil {
		return err
	}
}
err = json.NewEncoder(w).Encode(o)</code></pre></figure>
<figure class="code"><figcaption>Custom formats without touching every caller</figcaption><pre><code data-lang="go">// A named type for the odd date format...
type RFC822ZTime struct {
	time.Time
}

func (rt RFC822ZTime) MarshalJSON() ([]byte, error) {
	out := rt.Time.Format(time.RFC822Z)
	return []byte(`"` + out + `"`), nil
}

func (rt *RFC822ZTime) UnmarshalJSON(b []byte) error {
	if string(b) == "null" {
		return nil
	}
	t, err := time.Parse(`"`+time.RFC822Z+`"`, string(b))
	if err != nil {
		return err
	}
	*rt = RFC822ZTime{t}
	return nil
}
// ...used as a field type. The embedded time.Time keeps
// all of its methods available.</code></pre></figure>

<h2>net/http</h2>
<div class="tabs">
<figure class="code"><figcaption>client</figcaption><pre><code data-lang="go">// http.DefaultClient has NO timeout. A hung server hangs your goroutine forever.
client := &amp;http.Client{
	Timeout: 30 * time.Second,
}

req, err := http.NewRequestWithContext(context.Background(), http.MethodGet,
	"https://jsonplaceholder.typicode.com/todos/1", nil)
if err != nil {

req.Header.Add("X-My-Client", "Learning Go")
res, err := client.Do(req)
if err != nil {

}
defer res.Body.Close()                       // always, or the connection leaks

	panic(fmt.Sprintf("unexpected status: got %v", res.Status))
}

	UserID int    `json:"userId"`
	Title  string `json:"title"`

err = json.NewDecoder(res.Body).Decode(&amp;data)
// Create one client and reuse it: it pools connections and is safe for concurrent use.</code></pre></figure>
<figure class="code"><figcaption>server and Go 1.22 routing</figcaption><pre><code data-lang="go">mux := http.NewServeMux()

// Go 1.22: method and path wildcards in the pattern
mux.HandleFunc("GET /hello/{name}", func(w http.ResponseWriter, r *http.Request) {
	name := r.PathValue("name")
	w.Write([]byte(fmt.Sprintf("Hello, %s!\n", name)))
})

mux.Handle("/static/", http.StripPrefix("/static", http.FileServer(http.Dir("./public"))))

	Addr:         ":8080",
	ReadTimeout:  30 * time.Second,          // set these: the defaults are "wait forever"
	WriteTimeout: 90 * time.Second,
	IdleTimeout:  120 * time.Second,
	Handler:      mux,

	panic(err)

<figure class="code"><figcaption>middleware</figcaption><pre><code data-lang="go">// A middleware is a function that takes a handler and returns a handler.
func RequestTimer(h http.Handler) http.Handler {
	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
		start := time.Now()
		h.ServeHTTP(w, r)                    // call the next layer
		slog.Info("request time", "path", r.URL.Path, "duration", time.Since(start))
	})
}

var securityMsg = []byte("You didn't give the secret password\n")

// Configurable middleware: a function returning a middleware
func TerribleSecurityProvider(password string) func(http.Handler) http.Handler {
	return func(h http.Handler) http.Handler {
		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
			if r.Header.Get("X-Secret-Password") != password {
				w.WriteHeader(http.StatusUnauthorized)
				w.Write(securityMsg)
				return                       // stop: the next layer never runs
			}
			h.ServeHTTP(w, r)
		})
	}
}

terribleSecurity := TerribleSecurityProvider("GOPHER")
wrapped := terribleSecurity(RequestTimer(mux))   // outermost first</code></pre></figure>
<figure class="code"><figcaption>ResponseController and slog</figcaption><pre><code data-lang="go">// ResponseController (Go 1.20) reaches optional features without type assertions.
func handler(rw http.ResponseWriter, req *http.Request) {
	rc := http.NewResponseController(rw)
	for i := 0; i &lt; 10; i++ {
		rw.Write([]byte(fmt.Sprintf("data %d\n", i)))
		if err := rc.Flush(); err != nil &amp;&amp; !errors.Is(err, http.ErrNotSupported) {
			return
		}
		time.Sleep(time.Second)
	}
}

// log/slog (Go 1.21): structured, levelled logging in the standard library
logger := slog.New(slog.NewJSONHandler(os.Stdout, &amp;slog.HandlerOptions{Level: slog.LevelDebug}))
logger.Info("user logged in", "id", "fred", "last_login", time.Now())
// {"time":"…","level":"INFO","msg":"user logged in","id":"fred","last_login":"…"}

// Hot path: typed attributes avoid allocations
logger.LogAttrs(ctx, slog.LevelInfo, "faster logging", slog.String("id", "fred"))</code></pre></figure>
</div>

<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Process <code>n</code> bytes before checking the error.</strong> A <code>Read</code> may return data and <code>io.EOF</code> in the same call.</li>
<li><strong>Close what you open, in the right order.</strong> With stacked readers, close the gzip reader and then the file, usually by returning a closer function.</li>
<li><strong>JSON numbers decoded into <code>any</code> become <code>float64</code>,</strong> and unknown fields are silently dropped unless you call <code>DisallowUnknownFields</code>.</li>
<li><strong>A panic in a handler</strong> is recovered by the server and logged, killing only that request. Do not rely on it.</li>
</ul></div>
<div class="since"><b>Since the book</b><p><code>encoding/json/v2</code> has been under development as an experiment since Go 1.25, with stricter defaults and better performance. Go 1.24 added the <code>omitzero</code> tag option, which omits zero-valued struct fields such as an unset <code>time.Time</code> where <code>omitempty</code> does not.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Why does <code>Read</code> take a buffer instead of returning one?</summary><p>So the caller controls allocation. A loop reading a large file reuses one slice; an API that returned a fresh slice per call would create garbage on every iteration.</p></details>
<details class="q"><summary>Why <code>2006-01-02</code> and not <code>YYYY-MM-DD</code>?</summary><p>Go layouts are an example of one specific instant, chosen so each field has a distinct number (month 1, day 2, hour 3 PM, minute 4, second 5, year 6, zone -7). You write what you want the output to look like for that instant.</p></details>

<p class="eyebrow">Chapter 14</p>
<h1>The context</h1>
<p class="lede">A server handles a request by fanning out to databases and other services. When the client hangs up, or a deadline passes, all of that work should stop. <code>context.Context</code> is how Go carries that signal, and a few request-scoped values, through a call tree.</p>
<div class="model"><b>Mental model</b>
<p>A context is an immutable node in a tree. You never change one; you wrap it to make a child that adds a cancel function, a deadline or a value. Cancelling a node cancels everything beneath it and nothing above or beside it. Go has no thread-local storage and no way to kill a goroutine from outside, so the context is passed explicitly, as the first parameter, and code cooperates by checking it.</p></div>
<figure class="code"><figcaption>conventions</figcaption><pre><code data-lang="go">// First parameter, named ctx. Never stored in a struct field, never nil.
func logic(ctx context.Context, info string) (string, error) {
	// do some interesting stuff here
	return "", nil
}

ctx := context.Background()   // the root: never cancelled, no values, no deadline
ctx = context.TODO()          // same thing, but says "I have not decided what goes here yet"

// In an HTTP handler, the request already carries one:
func handler(rw http.ResponseWriter, req *http.Request) {
	ctx := req.Context()                      // cancelled when the client disconnects
	result, err := logic(ctx, req.URL.Query().Get("q"))
	// ...
}
// Outbound calls pass it on:
req, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)</code></pre></figure>

<h2>Cancellation and deadlines</h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Context tree and cascading cancellation</h3>
<p>Click a node with a cancel function to call it, or drag the clock forward to let timeouts fire. Red nodes are done.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c14-t">Elapsed: <b data-h="tv"></b></label><input id="c14-t" type="range" min="0" max="6" step="0.5" value="0" style="width:260px"></span><button class="btn ghost" data-h="creset">Reset</button></div>

<div class="tabs">
<figure class="code"><figcaption>WithCancel</figcaption><pre><code data-lang="go">ctx, cancel := context.WithCancel(context.Background())
defer cancel()        // ALWAYS. Not calling cancel leaks the child until the parent ends.

ch := make(chan string)
var wg sync.WaitGroup
wg.Add(2)
go func() {
	defer wg.Done()
	for {
		resp, err := makeRequest(ctx, "http://httpbin.org/status/200,200,200,500")
		if err != nil {
			fmt.Println("error in status goroutine:", err)
			cancel()              // one failure stops the sibling too
			return
		}
		if resp.StatusCode == http.StatusInternalServerError {
			cancel()
			return
		}
		select {
		case ch &lt;- "success from status":
		case &lt;-ctx.Done():
		}
		time.Sleep(1 * time.Second)
	}
}()</code></pre></figure>
<figure class="code"><figcaption>WithCancelCause</figcaption><pre><code data-lang="go">ctx, cancel := context.WithCancelCause(context.Background())
defer cancel(nil)

// somewhere in a goroutine:
cancel(fmt.Errorf("in status goroutine: %w", err))    // record WHY

// later, anyone holding ctx or a descendant:
&lt;-ctx.Done()
fmt.Println(ctx.Err())             // context canceled
fmt.Println(context.Cause(ctx))    // in status goroutine: …</code></pre></figure>
<figure class="code"><figcaption>WithTimeout / WithDeadline</figcaption><pre><code data-lang="go">ctx := context.Background()
parent, cancel := context.WithTimeout(ctx, 2*time.Second)
defer cancel()
child, cancel2 := context.WithTimeout(parent, 3*time.Second)   // longer than the parent
defer cancel2()

start := time.Now()
&lt;-child.Done()                     // fires after 2s: a child can never outlive its parent
fmt.Println(time.Since(start).Truncate(time.Second), child.Err())   // 2s context deadline exceeded

// WithDeadline takes an absolute time.Time instead of a duration.
// ctx.Err() is context.DeadlineExceeded for timeouts, context.Canceled for cancel().</code></pre></figure>
<figure class="code"><figcaption>honouring cancellation in your own code</figcaption><pre><code data-lang="go">func longRunningComputation(ctx context.Context, data string) (string, error) {
	for i := 0; i &lt; len(work); i++ {
		// Check now and then in CPU-bound loops
		if err := context.Cause(ctx); err != nil {
			return "", err
		}
		// ...do a slice of the work...
	}
	return result, nil
}

// Waiting on a channel? Always select on Done as well.
select {
case result := &lt;-out:
	return result, nil
case &lt;-ctx.Done():
	return "", context.Cause(ctx)
}</code></pre></figure>
</div>

<h2>Values</h2>
<div class="two wide">
<figure class="code"><figcaption>Collision-proof keys</figcaption><pre><code data-lang="go">// An unexported key type: no other package can construct this key,
// so no other package can read or overwrite the value by accident.
type userKey int

const (
	_ userKey = iota
	key
)

func ContextWithUser(ctx context.Context, user string) context.Context {
	return context.WithValue(ctx, key, user)
}

func UserFromContext(ctx context.Context) (string, bool) {
	user, ok := ctx.Value(key).(string)
	return user, ok
}

// Middleware puts it in, business logic takes it out through the helpers.
func Middleware(h http.Handler) http.Handler {
	return http.HandlerFunc(func(rw http.ResponseWriter, req *http.Request) {
		user, err := extractUser(req)
		if err != nil {
			rw.WriteHeader(http.StatusUnauthorized)
			return
		}
		ctx := ContextWithUser(req.Context(), user)
		h.ServeHTTP(rw, req.WithContext(ctx))
	})
}</code></pre></figure>
<figure class="code"><figcaption>Misuse</figcaption><pre><code data-lang="go">// String keys collide across packages
ctx = context.WithValue(ctx, "user", u)

// Context as a bag of optional parameters:
// the function's real inputs are now invisible.
func Charge(ctx context.Context) error {
	amount := ctx.Value("amount").(int)     // panics if absent
	card := ctx.Value("card").(string)
	// ...
}

// Better: pull values out at the edge and pass
// them as ordinary arguments.
func Charge(ctx context.Context, user string,
	amount int, card string) error { /* ... */ }</code></pre></figure>
</div>
<p>Good candidates for context values are things that cross API boundaries with a request and are not business inputs: an authenticated user, a trace or request ID. Values are looked up by walking the chain of wrappers, so keep them few.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Forgetting <code>cancel</code>.</strong> <code>go vet</code> reports a discarded cancel function. Call it with <code>defer</code> even when the context will time out anyway; it frees the timer early.</li>
<li><strong>Cancellation is cooperative.</strong> A function that never looks at <code>ctx.Done()</code> keeps running. The standard library's network and database calls do look.</li>
<li><strong>Do not put a context in a struct.</strong> It ties the struct's lifetime to one request. Pass it per call.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Go 1.21 added <code>context.WithoutCancel</code> (keep the values, drop the cancellation, for work that must outlive the request), <code>context.AfterFunc</code> (run a function when a context is done), and <code>WithTimeoutCause</code> and <code>WithDeadlineCause</code>.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>A handler's context is cancelled. A sibling request's database query keeps running. Why?</summary><p>Each request has its own subtree under the server's base context. Cancellation flows down from the cancelled node only.</p></details>
<details class="q"><summary>A child is created with a 5 second timeout under a parent with 2 seconds. When does the child end?</summary><p>At 2 seconds. A child inherits the parent's cancellation, so its effective deadline is the earlier of the two.</p></details>

</template>
<template id="t-chapter-15">
<p class="eyebrow">Chapter 15</p>
<h1>Writing tests</h1>
<p class="lede">Testing is built into the toolchain: one package, one command, no framework to choose. The same tool runs unit tests, benchmarks, fuzzers, coverage and a data race detector.</p>
<div class="model"><b>Mental model</b>
<p>A Go test is an ordinary function in an ordinary file. There are no assertion libraries by default and no annotations; you write an <code>if</code> and call <code>t.Error</code>. That plainness is deliberate: tests are code, read with the same skills, and the conventions that grew on top (table-driven tests, subtests) are just loops and closures.</p></div>
<div class="tabs">
<figure class="code"><figcaption>basics</figcaption><pre><code data-lang="go">// adder/adder_test.go — same directory, name ends in _test.go
package adder                       // same package: can reach unexported identifiers

import "testing"

func Test_addNumbers(t *testing.T) {
	result := addNumbers(2, 3)
	if result != 5 {
		t.Error("incorrect result: expected 5, got", result)   // report, keep going
	}
}
// t.Errorf formats. t.Fatal / t.Fatalf report and stop THIS test function:
// use them when continuing would only produce noise (a nil you are about to dereference).</code></pre></figure>
<figure class="code"><figcaption>setup, teardown, files, env</figcaption><pre><code data-lang="go">func TestMain(m *testing.M) {       // once per package, when you need global setup
	fmt.Println("Set up stuff for tests here")
	exitVal := m.Run()
	fmt.Println("Clean up stuff after tests here")
	os.Exit(exitVal)
}

func createFile(t *testing.T) (string, error) {
	f, err := os.Create(filepath.Join(t.TempDir(), "tempFile"))   // dir removed automatically
	if err != nil {
		return "", err
	}
	t.Cleanup(func() { f.Close() })          // runs when the test ends, LIFO like defer
	return f.Name(), nil
}

func TestEnvVarProcess(t *testing.T) {
	t.Setenv("OUTPUT_FORMAT", "JSON")        // restored after the test
	// ...
}
// Fixture files live in a directory named testdata; go ignores it when building.
// Passing results are cached. Force a rerun with:  go test -count=1 ./...</code></pre></figure>
<figure class="code"><figcaption>black-box tests</figcaption><pre><code data-lang="go">// adder/adder_public_test.go

	"testing"
	"github.com/learning-go-book-2e/ch15/sample_code/pubadder"
)

func TestAddNumbers(t *testing.T) {
	result := pubadder.AddNumbers(2, 3)      // only the exported API is visible

		t.Error("incorrect result: expected 5, got", result)

}</code></pre></figure>
</div>

<h2>Table-driven tests</h2>
<div class="two wide">
<figure class="code"><figcaption>Idiomatic</figcaption><pre><code data-lang="go">func TestDoMath(t *testing.T) {

		t.Run(d.name, func(t *testing.T) {      // one subtest per row
			result, err := DoMath(d.num1, d.num2, d.op)

<section class="lab">
<header><span class="tag">Lab</span><h3>Table-driven test runner with cmp.Diff</h3>

<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Parallel subtests and shared rows.</strong> Before Go 1.22, a subtest calling <code>t.Parallel()</code> captured the loop variable and every subtest ran the last row. Fixed by the 1.22 loop semantics (Chapter 4).</li>
<li><strong>The race detector only sees races that happen</strong> during the run, slows execution several-fold and uses much more memory. Run it in CI, not in production.</li>
<li><strong>Benchmarks lie when the compiler deletes your code.</strong> Assign results to a package-level variable.</li>
<li><strong>Do not ship the fuzzer's generated corpus cache;</strong> do commit the failing inputs under <code>testdata/fuzz</code>.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Go 1.24 added <code>b.Loop()</code>: write <code>for b.Loop() { … }</code> instead of the <code>b.N</code> loop. It excludes setup from timing automatically and prevents the compiler from optimising the body away, so the sink variable is no longer needed. Go 1.25 added <code>testing/synctest</code> for deterministic tests of concurrent, time-dependent code.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>When do you choose <code>t.Fatal</code> over <code>t.Error</code>?</summary><p>When the rest of the test cannot give useful information after this failure, for example setup failed or a value you are about to use is nil. Otherwise prefer <code>t.Error</code> so one run reports every problem.</p></details>
<details class="q"><summary>The fuzzer found a crash. What turns that into a regression test?</summary><p>Nothing more. The failing input is written to <code>testdata/fuzz/&lt;FuzzName&gt;/</code>, and ordinary <code>go test</code> runs every file there as a seed. Commit it.</p></details>

<template id="t-chapter-16">
<p class="eyebrow">Chapter 16</p>
<h1>Here be dragons: reflect, unsafe and cgo</h1>
<p class="lede">Three escape hatches from Go's safety and simplicity. Each exists for a real reason, each is used by the standard library, and each should make you pause before you reach for it.</p>
<div class="model"><b>Mental model</b>
<p>Go's type system and memory safety are what let you trust code you did not write. <code>reflect</code> steps around the type system at run time. <code>unsafe</code> steps around memory safety. <code>cgo</code> steps out of Go altogether. Use them at the edges of a program, where data enters or leaves in a shape Go cannot know at compile time, and keep them out of the middle.</p></div>

<h2>reflect</h2>
<p>Reflection lets code inspect and build values whose types are not known when it is compiled. It is how <code>encoding/json</code> reads your struct tags and how <code>database/sql</code> fills your fields. Three concepts carry it: a <code>reflect.Type</code> describes a type, a <code>reflect.Kind</code> says what sort of thing it is underneath (struct, slice, int, pointer…), and a <code>reflect.Value</code> holds an actual value.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>Type vs Kind explorer</h3>
<p>Pick a value. See what <code>reflect.TypeOf</code> reports and which further methods are legal for its kind.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c16-v">v</label><select id="c16-v"></select></span></div>
<div class="grid2"><pre data-h="rcode"></pre><div class="stack"><div class="tablewrap" style="margin:0"><table data-h="rtab"></table></div><div class="msg" data-h="rmsg"></div></div></div>
</div></section>
<div class="tabs">
<figure class="code"><figcaption>reading and setting</figcaption><pre><code data-lang="go">type Foo struct {
	A int    `myTag:"value"`
	B string `myTag:"value2"`
}

var f Foo
ft := reflect.TypeOf(f)
for i := 0; i &lt; ft.NumField(); i++ {
	curField := ft.Field(i)
	fmt.Println(curField.Name, curField.Type.Name(), curField.Tag.Get("myTag"))
}

// To CHANGE a value you must start from a pointer and call Elem.
i := 10
iv := reflect.ValueOf(&amp;i)      // Value holding *int
ivv := iv.Elem()               // Value for the int it points to: settable
fmt.Println(reflect.ValueOf(i).CanSet(), ivv.CanSet())   // false true
ivv.SetInt(20)

// Make a new value of a type known only at run time
var stringType = reflect.TypeOf((*string)(nil)).Elem()
ssv := reflect.MakeSlice(reflect.SliceOf(stringType), 0, 10)
sv := reflect.New(stringType).Elem()
sv.SetString("hello")
ssv = reflect.Append(ssv, sv)
ss := ssv.Interface().([]string)     // back to a normal Go value</code></pre></figure>
<figure class="code"><figcaption>is the interface holding nil?</figcaption><pre><code data-lang="go">// An interface can be non-nil while holding a nil pointer (Chapter 7).
// Reflection is the only general way to check.
func hasNoValue(i any) bool {
	iv := reflect.ValueOf(i)
	if !iv.IsValid() {             // the interface itself is nil
		return true
	}
	switch iv.Kind() {
	case reflect.Pointer, reflect.Slice, reflect.Map, reflect.Func, reflect.Interface:
		return iv.IsNil()          // IsNil panics for other kinds
	default:
		return false
	}
}</code></pre></figure>
<figure class="code"><figcaption>a tag-driven marshaler (core)</figcaption><pre><code data-lang="go">// Turn a slice of tagged structs into CSV rows.
type MyData struct {
	Name   string `csv:"name"`
	Age    int    `csv:"age"`
	HasPet bool   `csv:"has_pet"`
}

func marshalHeader(vt reflect.Type) []string {
	var row []string
	for i := 0; i &lt; vt.NumField(); i++ {
		field := vt.Field(i)
		if curTag, ok := field.Tag.Lookup("csv"); ok {
			row = append(row, curTag)
		}
	}
	return row
}

func marshalOne(vv reflect.Value) ([]string, error) {
	var row []string
	vt := vv.Type()
	for i := 0; i &lt; vv.NumField(); i++ {
		fieldVal := vv.Field(i)
		if _, ok := vt.Field(i).Tag.Lookup("csv"); !ok {
			continue
		}
		switch fieldVal.Kind() {
		case reflect.Int:
			row = append(row, strconv.FormatInt(fieldVal.Int(), 10))
		case reflect.String:
			row = append(row, fieldVal.String())
		case reflect.Bool:
			row = append(row, strconv.FormatBool(fieldVal.Bool()))
		default:
			return nil, fmt.Errorf("cannot handle field of kind %v", fieldVal.Kind())
		}
	}
	return row, nil
}</code></pre></figure>
</div>
<div class="edge"><b>The cost of reflect</b><ul>
<li><strong>Errors move from compile time to run time.</strong> Call a method the kind does not support and it panics.</li>
<li><strong>It is slow.</strong> A reflective filter over a slice runs dozens of times slower than a typed loop and allocates far more. A generic version matches hand-written speed.</li>
<li><strong>Prefer generics</strong> when the logic is the same for every type, and <strong>code generation</strong> when you need per-type code. Keep reflection for marshaling at program boundaries and for things only it can do, such as building new struct types at run time.</li>
</ul></div>

<h2>unsafe</h2>
<p><code>unsafe.Pointer</code> can be converted to and from any pointer type and to <code>uintptr</code> for arithmetic. With it you can reinterpret memory. The package also exposes how the compiler lays structs out, which is useful without doing anything dangerous.</p>
<div class="model"><b>Mental model</b>
<p>Each field must start at an offset that is a multiple of its own alignment (8 for an <code>int64</code> on a 64-bit machine, 1 for a <code>bool</code>). The compiler keeps your field order and inserts padding to make that true, then rounds the whole struct up to its largest alignment. So field order changes size. Ordering fields from largest alignment to smallest minimises padding.</p></div>

	b bool

fmt.Println(unsafe.Sizeof(IntBool{}))        // 16: trailing padding to a multiple of 8
fmt.Println(unsafe.Sizeof(BoolIntBool{}))    // 24
fmt.Println(unsafe.Sizeof(IntBoolBool{}))    // 16: same fields, a third smaller</code></pre></figure>
<figure class="code"><figcaption>binary wire formats</figcaption><pre><code data-lang="go">// A network packet with a fixed layout:
type Data struct {
	Value  uint32   // 4 bytes
	Label  [10]byte // 10 bytes
	Active bool     // 1 byte
	// one byte of padding brings the size to 16
}

// Safe: decode field by field, endianness explicit.
func DataFromBytes(b [16]byte) Data {
	d := Data{}
	d.Value = binary.BigEndian.Uint32(b[:4])
	copy(d.Label[:], b[4:14])
	d.Active = b[14] != 0
	return d
}

// Unsafe: reinterpret the bytes in place. Faster, and wrong on a
// little-endian CPU unless you swap the integer yourself.
func DataFromBytesUnsafe(b [16]byte) Data {
	data := *(*Data)(unsafe.Pointer(&amp;b))
	if isLE {
		data.Value = bits.ReverseBytes32(data.Value)
	}
	return data
}</code></pre></figure>
<figure class="code"><figcaption>unsafe.Slice, unsafe.String</figcaption><pre><code data-lang="go">// Go 1.20: convert between string and []byte without copying.
s := "hello"
b := unsafe.Slice(unsafe.StringData(s), len(s))   // []byte sharing the string's memory
// b[0] = 'j'   // undefined behaviour: strings are immutable, this may crash

b2 := []byte("cello")
s2 := unsafe.String(unsafe.SliceData(b2), len(b2))
b2[0] = 'h'
fmt.Println(s2)   // "hello": a string that changed. Everything that assumed
                  // immutability (map keys, concurrent readers) is now at risk.</code></pre></figure>
</div>
<p>Follow the patterns documented in the <code>unsafe</code> package and no others. <code>go vet</code> flags several misuses, and building with <code>-race</code> or <code>-gcflags=-d=checkptr</code> adds run-time checks for invalid pointer conversions.</p>

<h2>cgo</h2>
<div class="two wide">
<figure class="code"><figcaption>Calling C</figcaption><pre><code data-lang="go">package main

import "fmt"

/*
#cgo LDFLAGS: -lm
#include &lt;stdio.h&gt;
#include &lt;math.h&gt;
#include "mylib.h"

int add(int a, int b) {
    int sum = a + b;
    printf("a: %d, b: %d, sum %d\n", a, b, sum);
    return sum;
}
*/
import "C"       // must directly follow the comment, no blank line

func main() {
	c := C.int(C.add(C.int(3), C.int(2)))
	fmt.Println(c)
	fmt.Println(float64(C.sqrt(C.double(100))))
	fmt.Println(C.multiply(C.int(10), C.int(20)))
}</code></pre></figure>
<figure class="code"><figcaption>What it costs</figcaption><pre><code data-lang="go">// 1. Speed. A cgo call is roughly 30x slower than a C function calling C,
//    because the runtime must switch stacks and coordinate with the
//    scheduler and collector. "Rewrite the hot loop in C" usually loses.

// 2. Memory. Go's collector moves and frees memory C knows nothing about.
//    You may not hand C a Go pointer that itself contains pointers,
//    and C must not keep a Go pointer after the call returns.
//    For long-lived handles use cgo.Handle.

// 3. Build. You now need a C toolchain, cross-compiling is hard again,
//    and the single static binary is gone.

// "Cgo is not Go." Use it to reach an existing C library with no
// Go equivalent. For performance, write better Go.</code></pre></figure>
</div>
<div class="why"><b>Unlearn</b><p>In Python or Java, dropping to native code is the standard way to go faster, and reflection is everyday framework machinery. In Go the plain code is already compiled and fast, and the standard answers are generics and code generation. These three tools are for the places where the plain language cannot reach.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Why is <code>struct{ b bool; i int64; b2 bool }</code> 24 bytes when its fields add up to 10?</summary><p><code>i</code> must start at a multiple of 8, so 7 bytes of padding follow <code>b</code>. <code>b2</code> lands at offset 16, and the struct is rounded up to a multiple of its largest alignment, adding 7 more.</p></details>
<details class="q"><summary><code>reflect.TypeOf(&amp;Foo{})</code>: what are its Name and Kind?</summary><p>Name is the empty string, because pointer types are unnamed. Kind is <code>reflect.Pointer</code>. Call <code>Elem()</code> to get the type <code>Foo</code>, whose kind is <code>reflect.Struct</code>.</p></details>
