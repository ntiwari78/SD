<template id="t-home">
<p class="eyebrow">Interactive companion · Baier, Sayfan, White · Packt</p>
<h1>The Complete Kubernetes Guide, as a system you can operate</h1>
<p class="lede">Nineteen chapters, each rebuilt as a lab. You get the reason a mechanism exists, a simulator to break it in, and then the manifests and commands.</p>
<p>The book is written for people who will run clusters. So is this. Kubernetes looks like a pile of resource types until you see the one idea underneath: you write down the state you want, and a set of independent control loops keeps nudging reality toward it. Pods, labels, Services, StatefulSets, autoscalers and custom resources are all that idea applied to a different problem. Hold on to it and the rest is detail.</p>
<h2>How each module works</h2>
<div class="grid3 wide">
  <div class="pane"><h4>1 · Model</h4>What problem the construct solves and why it is shaped the way it is.</div>
  <div class="pane"><h4>2 · Lab</h4>A simulator of a control loop, a packet path, a scheduler or a failure. Change it and watch.</div>
  <div class="pane"><h4>3 · Manifests &amp; gotchas</h4>YAML and <code>kubectl</code> you can run, then the ways this fails in production.</div>
</div>
<p class="note">The labs are models written in JavaScript. They follow Kubernetes' documented behaviour and talk to no cluster. Command output is shortened.</p>
<h2>Modules</h2>
<div class="cards wide" data-h="cards"></div>
<div class="since"><b>Since the book</b>
<p>The book describes Kubernetes around versions 1.10 to 1.12, and parts of it are now history: Heapster, <code>kube-up.sh</code>, <code>rkt</code>, Federation v1, PodSecurityPolicy, Tiller, and <code>extensions/v1beta1</code> API versions have all been retired. The manifests here use current API versions so they apply to a modern cluster, and boxes like this one say what replaced what. The design ideas have held up well.</p></div>
<p class="note">Explanations and manifests are written fresh for this explainer and follow the book's structure and examples. For the full treatment, read the book.</p>

</template>
<template id="t-chapter-1">
<p class="eyebrow">Chapter 1</p>
<h1>Introduction to Kubernetes</h1>
<p class="lede">A container is not a small virtual machine. It is an ordinary Linux process that the kernel has been told to lie to. Once you see which lies, the rest of Kubernetes reads as bookkeeping for a great many such processes.</p>
<div class="model"><b>Mental model</b>
<p>Three kernel features make a container. <strong>Namespaces</strong> control what a process can <em>see</em>: its own process list, network stack, mounts, hostname. <strong>Control groups</strong> control what it can <em>use</em>: CPU, memory, I/O. A <strong>union filesystem</strong> stacks read-only image layers under one thin writable layer, so a thousand containers can share the same base image and each still believes it has a private disk. Docker packaged these; it did not invent them.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Container primitives simulator</h3>
<p>Switch isolation features on and off, then look at what a shell inside the process reports and what a runaway neighbour can do to it.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">Namespaces</span><span class="row" data-h="ns"></span></span><span class="field"><span class="lbl">cgroups</span><span class="row" data-h="cg"></span></span><span class="field"><span class="lbl">Filesystem</span><span class="row" data-h="fs"></span></span></div>
<div class="grid2"><pre data-h="sh" class="term"></pre><div class="stack"><div class="pane"><h4>Image layers</h4><div class="stack" style="gap:4px" data-h="layers"></div></div><div class="msg" data-h="pmsg"></div></div></div>
</div></section>
<div class="tablewrap wide"><table><thead><tr><th>cgroup controller</th><th>Limits or accounts for</th></tr></thead><tbody>
<tr><td><code>memory</code></td><td>RAM and swap. Exceed the limit and the kernel's OOM killer ends the process</td></tr>
<tr><td><code>cpu</code>, <code>cpuset</code></td><td>CPU share and time quota; pinning to particular cores</td></tr>
<tr><td><code>blkio</code></td><td>Block device read and write rates</td></tr>
<tr><td><code>freezer</code></td><td>Suspending and resuming a whole group of processes</td></tr>
<tr><td><code>net_cls</code>, <code>net_prio</code></td><td>Tagging and prioritising network traffic</td></tr>
<tr><td><code>devices</code></td><td>Which device nodes the group may open</td></tr>
</tbody></table></div>
<p>Namespaces are created with the <code>clone</code> and <code>unshare</code> system calls and joined with <code>setns</code>. The six the book covers are <code>pid</code>, <code>net</code>, <code>ipc</code>, <code>mnt</code>, <code>uts</code> (hostname) and <code>user</code>.</p>
<h2>Why this led to orchestration</h2>
<p>Containers gave teams the same artifact from laptop to production, which makes continuous delivery practical, and they pack many more workloads onto a machine than VMs do. They also encouraged splitting applications into many small services. That creates a new job: placing hundreds of containers on dozens of machines, connecting them, restarting the ones that die and rolling out new versions. Kubernetes is the system that does that job.</p>
<h2>Getting a cluster</h2>
<section class="lab">
<header><span class="tag">Lab</span><h3>Cluster bootstrap comparison</h3><p>Four ways the book brings up a cluster. Pick one.</p></header>
<div class="body"><div class="ctl"><span data-h="boot"></span></div>
<div class="grid2"><pre data-h="bcmd"></pre><div class="stack"><div class="tablewrap" style="margin:0"><table data-h="btab"></table></div><div class="msg" data-h="bmsg"></div></div></div></div></section>
<figure class="code"><figcaption>first look at a cluster</figcaption><pre><code data-lang="bash">$ kubectl cluster-info
Kubernetes control plane is running at https://203.0.113.10
CoreDNS is running at https://203.0.113.10/api/v1/namespaces/kube-system/services/kube-dns:dns/proxy

$ kubectl get nodes
$ kubectl get pods --namespace kube-system        # the cluster's own components run as pods
$ kubectl get services --namespace kube-system
$ kubectl proxy                                   # local, authenticated tunnel to the API on :8001</code></pre></figure>
<p>On the master you will find the API server, <code>etcd</code>, the controller manager and the scheduler. On every node: the <code>kubelet</code>, <code>kube-proxy</code> and a container runtime. Add-ons such as DNS, the dashboard and monitoring run as pods in <code>kube-system</code>.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Containers share the host kernel.</strong> A kernel exploit crosses every namespace. Isolation is weaker than a VM's, which is why Chapter 12 exists.</li>
<li><strong>The writable layer is ephemeral.</strong> Anything written there disappears with the container. Data that matters goes in a volume (Chapter 6).</li>
<li><strong>Clean up cloud clusters.</strong> A forgotten test cluster bills by the hour, load balancers and disks included.</li>
</ul></div>
<div class="since"><b>Since the book</b><p><code>kube-up.sh</code> is deprecated and Heapster, InfluxDB-based monitoring and the bundled dashboard add-on are gone from default installs. Use a managed service, <code>kubeadm</code>, <code>kops</code>, or <code>kind</code>/<code>minikube</code> locally, with metrics-server and Prometheus for metrics. Modern distributions use cgroups v2, a single unified hierarchy.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>A container has a memory cgroup limit and no PID namespace. What can it see, and what can it not do?</summary><p>It sees every process on the host in <code>ps</code>, because nothing hides them. It still cannot use more memory than its limit. Seeing and using are controlled separately.</p></details>
<details class="q"><summary>Why can 50 containers from one 800 MB image fit on a 10 GB disk?</summary><p>The image's layers are stored once and mounted read-only into each. Every container adds only its own thin copy-on-write layer.</p></details>

</template>
<template id="t-chapter-2">
<p class="eyebrow">Chapter 2</p>
<h1>Understanding Kubernetes architecture</h1>
<p class="lede">Kubernetes is a database with a REST API in front and a crowd of independent programs watching it. Nothing in the system tells anything else what to do directly.</p>
<div class="model"><b>Mental model</b>
<p>Every component talks only to the API server. The API server is the only thing that talks to <code>etcd</code>. Each controller <em>watches</em> for objects it cares about, compares what is declared with what exists, and acts to close the gap. The scheduler is such a loop (pods with no node), the kubelet is one (pods assigned to my node), a Deployment controller is one. Because they share state and nothing else, any of them can crash and resume without the others noticing.</p></div>
<p>Kubernetes orchestrates containers: placement, scaling, healing, service discovery, rollout. It is not a full platform as a service. It does not build your code, dictate a language or framework, or bundle middleware, databases or a CI system. Those are left to you, by design.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>Control-plane and CRI architecture explorer</h3>
<p>Click a component to see its job and its connections, or step through what happens after <code>kubectl apply</code> of a three-replica Deployment.</p></header>
<div class="body">
<div class="row"><button class="btn" data-h="step">Step: kubectl apply →</button><button class="btn ghost" data-h="rst">Reset</button><span class="pill info" data-h="sn"></span></div>
<div class="pane" data-h="arch"></div><div class="msg" data-h="amsg"></div>
</div></section>
<h2>The vocabulary</h2>
<div class="tablewrap wide"><table><thead><tr><th>Concept</th><th>What it is</th></tr></thead><tbody>
<tr><td>Cluster, Node, Master</td><td>A set of machines; a worker machine; the machines running the control plane</td></tr>
<tr><td>Pod</td><td>One or more containers that share a network namespace and volumes, scheduled together. The unit of deployment</td></tr>
<tr><td>Label, Selector</td><td>Key-value tags on objects, and queries over them. How everything finds everything</td></tr>
<tr><td>Annotation</td><td>Arbitrary metadata for tools. Not queryable</td></tr>
<tr><td>ReplicaSet (formerly ReplicationController)</td><td>Keeps N copies of a pod template running</td></tr>
<tr><td>Service</td><td>A stable name and virtual IP in front of a changing set of pods</td></tr>
<tr><td>Volume, StatefulSet, Secret</td><td>Storage attached to a pod; pods with stable identity; sensitive data</td></tr>
<tr><td>Name, Namespace</td><td>Unique per kind within a namespace; a virtual cluster for grouping and quotas</td></tr>
</tbody></table></div>
<p>Servers treated as <em>pets</em> have names and get nursed back to health. Servers treated as <em>cattle</em> are numbered and replaced. Kubernetes assumes cattle: pods are disposable, and identity lives in labels and Services.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>Label selector tester</h3><p>Type a selector. Equality-based and set-based forms can be mixed, separated by commas (AND).</p></header>
<div class="body"><div class="ctl"><span class="field"><label for="c2-sel">kubectl get pods -l</label><input id="c2-sel" type="text" value="app=web,tier in (frontend,cache),env!=dev" style="width:min(100%,430px)"></span><span class="chips" data-h="selpre"></span></div>
<div class="stack" style="gap:5px" data-h="pods"></div><div class="msg" data-h="selmsg"></div></div></section>
<h3>Pods as a design unit</h3>
<section class="lab"><header><span class="tag">Lab</span><h3>Multi-container pod patterns</h3></header>
<div class="body"><div class="ctl"><span data-h="pat"></span></div><div class="grid2"><div class="pane" data-h="patg"></div><div class="msg" data-h="patm"></div></div></div></section>
<h2>The Container Runtime Interface</h2>
<p>The kubelet does not know Docker. It speaks gRPC to whatever implements two services, and that is what let Kubernetes swap runtimes without changing itself. Go interfaces do the same job for clouds: <code>cloudprovider.Interface</code> exposes <code>LoadBalancer</code>, <code>Instances</code>, <code>Zones</code> and <code>Routes</code>, and each provider implements them.</p>
<div class="tabs">
<figure class="code"><figcaption>CRI (abridged protobuf)</figcaption><pre><code data-lang="text">service RuntimeService {
    rpc RunPodSandbox(RunPodSandboxRequest) returns (RunPodSandboxResponse) {}
    rpc StopPodSandbox(StopPodSandboxRequest) returns (StopPodSandboxResponse) {}
    rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse) {}
    rpc StartContainer(StartContainerRequest) returns (StartContainerResponse) {}
    rpc ExecSync(ExecSyncRequest) returns (ExecSyncResponse) {}
    // ...
}

service ImageService {
    rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {}
    rpc PullImage(PullImageRequest) returns (PullImageResponse) {}
    rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse) {}
}</code></pre></figure>
<figure class="code"><figcaption>cloud provider interface (abridged)</figcaption><pre><code data-lang="go">type Interface interface {
	LoadBalancer() (LoadBalancer, bool)
	Instances() (Instances, bool)
	Zones() (Zones, bool)
	Routes() (Routes, bool)
	ProviderName() string
}

type LoadBalancer interface {
	GetLoadBalancer(ctx context.Context, clusterName string, service *v1.Service) (status *v1.LoadBalancerStatus, exists bool, err error)
	EnsureLoadBalancer(ctx context.Context, clusterName string, service *v1.Service, nodes []*v1.Node) (*v1.LoadBalancerStatus, error)
	EnsureLoadBalancerDeleted(ctx context.Context, clusterName string, service *v1.Service) error
}</code></pre></figure>
<figure class="code"><figcaption>rollback by relabelling</figcaption><pre><code data-lang="bash"># Two ReplicaSets, version 1 and version 2, both labelled app=web.
# The Service selects app=web,track=stable.
$ kubectl label pods -l version=2 track=stable --overwrite    # promote v2
$ kubectl label pods -l version=1 track-                      # retire v1 from the Service
# Rolling back is the same two commands in reverse. No pods restart.</code></pre></figure>
</div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>etcd is the cluster.</strong> Lose it without a backup and every object is gone, though running containers keep running for a while.</li>
<li><strong>Everything is eventually consistent.</strong> <code>kubectl apply</code> returning means "recorded", not "done". Watch status, not exit codes.</li>
<li><strong>A selector that matches too much</strong> makes a controller adopt or a Service route to pods you did not intend. Label precisely.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Docker support in the kubelet (dockershim) was removed in Kubernetes 1.24; <code>containerd</code> and CRI-O are the standard runtimes, and <code>rkt</code> and Hyper containers are discontinued. Cloud provider code has moved out of the core into external cloud controller managers.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>The scheduler crashes for five minutes. What happens to running pods, and to new ones?</summary><p>Running pods are untouched: the kubelet owns them. New pods are stored with no node assigned and sit in <code>Pending</code> until a scheduler returns and binds them.</p></details>
<details class="q"><summary>Why does the kubelet never read etcd directly?</summary><p>Only the API server does. That gives one place for authentication, authorisation, validation and versioning, and lets every other component be a stateless client.</p></details>

</template>
<template id="t-chapter-3">
<p class="eyebrow">Chapter 3</p>
<h1>Building a foundation with core constructs</h1>
<p class="lede">Pods, labels, Services and replica controllers are the four parts nearly everything else is assembled from. Add health checks and resource requests and you have the minimum for a workload that heals itself.</p>
<div class="model"><b>Mental model</b>
<p>You declare a <em>desired state</em>: three replicas of this pod template, reachable under this name. The cluster records it in <code>etcd</code>, observes the <em>actual state</em>, and works to make the two equal, for ever. You never start or stop a container. You change the declaration, and controllers do the rest. Health checks are how the cluster learns that actual state has drifted in a way it cannot see from outside the container.</p></div>
<p>The book describes the system in layers: a <strong>nucleus</strong> (API, pod execution), an <strong>application layer</strong> (deployments, routing), a <strong>governance layer</strong> (policy, autoscaling, quotas), an <strong>interface layer</strong> (kubectl, client libraries) and the <strong>ecosystem</strong> above, inside and below Kubernetes. The control plane keeps its truth in <code>etcd</code>, and a highly available setup runs an odd number of masters, 2n+1, so a majority survives n failures.</p>
<div class="tabs">
<figure class="code"><figcaption>pod</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Pod
metadata:
  name: node-js-pod
  labels:
    name: node-js-pod
spec:
  containers:
    - name: node-js-pod
      image: bitnami/apache:latest
      ports:
        - containerPort: 80
      resources:
        requests: { cpu: 250m, memory: 128Mi }   # what the scheduler reserves
        limits:   { cpu: 500m, memory: 256Mi }   # where the kernel stops it
# Containers in one pod share an IP, localhost and volumes.
# The pod is mortal: when it dies it is replaced, never repaired.</code></pre></figure>
<figure class="code"><figcaption>replicaset</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: node-js-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-js-express
    matchExpressions:                       # set-based: ReplicationController cannot do this
      - { key: deployment, operator: In, values: [test, staging] }
  template:
    metadata:
      labels:
        app: node-js-express
        deployment: test
    spec:
      containers:
        - name: node-js-rs
          image: jonbaier/node-express-info:latest
          ports:
            - containerPort: 80</code></pre></figure>
<figure class="code"><figcaption>service</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Service
metadata:
  name: node-js
  labels:
    name: node-js
spec:
  type: LoadBalancer
  ports:
    - port: 80
  selector:
    app: node-js-express      # every ready pod with this label becomes an endpoint</code></pre></figure>
<figure class="code"><figcaption>probes and hooks</figcaption><pre><code data-lang="yaml">    spec:
      containers:
        - name: node-js
          image: jonbaier/node-express-info:latest
          livenessProbe:               # failing =&gt; kubelet restarts the container
            httpGet: { path: /status/, port: 80 }
            initialDelaySeconds: 30    # give the app time to boot
            timeoutSeconds: 1
          readinessProbe:              # failing =&gt; removed from Service endpoints
            httpGet: { path: /status/, port: 80 }
            initialDelaySeconds: 30
            timeoutSeconds: 1
          lifecycle:
            postStart:                 # runs right after the container starts
              httpGet: { path: /init/, port: 80 }
            preStop:                   # runs before SIGTERM; use it to drain
              exec:
                command: ["/usr/local/bin/apachectl", "-k", "graceful-stop"]
# Probe handlers: httpGet, tcpSocket, exec. Hooks are delivered
# at least once, so make them idempotent.</code></pre></figure>
<figure class="code"><figcaption>inspect</figcaption><pre><code data-lang="bash">$ kubectl get pods -l app=node-js-express
$ kubectl describe pod node-js-rs-7xk2p        # events at the bottom tell the story
$ kubectl exec -it node-js-rs-7xk2p -- sh
$ kubectl get endpoints node-js</code></pre></figure>
</div>
<p>A Service gets a virtual IP that never changes. <code>kube-proxy</code> on each node makes that IP work, in one of three modes: <code>userspace</code> (a real proxy process, slow), <code>iptables</code> (kernel NAT rules, the long-time default) or <code>ipvs</code> (kernel load balancer, scales to many services).</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>Liveness vs readiness probe simulator</h3>
<p>Three replicas behind a Service. Make <code>/status</code> start failing on pod 1 and advance the clock.</p></header>
<div class="body">
<div class="ctl"><span class="field"><span class="lbl">pod-1 /status fails, checked by</span><span data-h="mode"></span></span><button class="btn" data-h="t10">+10 s</button><button class="btn" data-h="t60">+60 s</button><button class="btn ghost" data-h="t0">Reset</button><span class="pill info" data-h="clock"></span></div>
<div class="grid2"><pre data-h="getpods"></pre><div class="stack"><div class="pane"><h4>Service endpoints (who gets traffic)</h4><div class="row" data-h="eps"></div></div><pre data-h="events" style="max-height:170px"></pre></div></div><div class="msg" data-h="prmsg"></div>
</div></section>
<section class="lab">
<header><span class="tag">Lab</span><h3>Scheduler fit</h3><p>Two nodes with one CPU each. System pods already use 200m per node. Set the request and see where pods land.</p></header>
<div class="body"><div class="ctl"><span class="field"><label for="c3-cpu">requests.cpu: <b data-h="cpuv"></b></label><input id="c3-cpu" type="range" min="100" max="2000" step="100" value="500"></span><span class="field"><label for="c3-rep">replicas: <b data-h="repv"></b></label><input id="c3-rep" type="range" min="1" max="5" value="3"></span></div>
<div class="grid2" data-h="nodes"></div><pre data-h="sev"></pre></div></section>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>A liveness probe that checks a dependency</strong> turns one database blip into every pod restarting at once. Liveness asks "is this process stuck?" Readiness asks "can it serve right now?"</li>
<li><strong>No <code>initialDelaySeconds</code></strong> on a slow-starting app means it is killed before it finishes booting, for ever.</li>
<li><strong>Requests are a reservation, limits are a wall.</strong> The scheduler only looks at requests. A node can be "full" while its CPUs idle.</li>
<li><strong><code>preStop</code> has a deadline.</strong> After <code>terminationGracePeriodSeconds</code> (30 by default) the container is killed regardless.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>ReplicationController still exists and is legacy; use Deployments, which manage ReplicaSets. A third probe, <code>startupProbe</code>, now covers slow boots properly: liveness and readiness wait until it succeeds.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>A pod has only a liveness probe and its app deadlocks. Between restarts, does it receive traffic?</summary><p>Yes. Without a readiness probe a running container counts as ready, so it stays in the endpoints until the kubelet kills it. Use both probes.</p></details>
<details class="q"><summary>A node has 4 idle CPUs and a pod requesting 500m stays Pending with "Insufficient cpu". How?</summary><p>Scheduling uses the sum of <em>requests</em> on the node, not live usage. Other pods have reserved the capacity even if they are not using it.</p></details>

</template>
<template id="t-chapter-4">
<p class="eyebrow">Chapter 4</p>
<h1>Networking, load balancers and Ingress</h1>
<p class="lede">Kubernetes networking rests on one rule that is easy to state and took the industry years to implement well: every pod gets its own IP address, and every pod can reach every other pod at that address without NAT.</p>
<div class="model"><b>Mental model</b>
<p>Docker's default puts containers on a private bridge per host and maps ports to the host, so two hosts need port bookkeeping and the address a container sees for itself differs from the one others use. Kubernetes removes that. A pod is like a small VM on a flat network: it has one IP, its containers share it and talk over <code>localhost</code>, and that IP is the same from every vantage point. A hidden <code>pause</code> container holds the pod's network namespace so app containers can restart without losing the address.</p></div>
<p>Pod IPs are real and short-lived. A <strong>Service</strong> adds a stable virtual IP and DNS name in front of a label-selected set of pods. An <strong>Ingress</strong> adds HTTP routing by host and path in front of Services.</p>
<section class="lab">
<header><span class="tag">Lab</span><h3>Pod flat-IP, kube-proxy and Ingress routing simulator</h3>
<p>Pick a journey and follow the packet. Highlighted boxes are on the path.</p></header>
<div class="body">
<div class="ctl"><span class="field"><label for="c4-j">Journey</label><select id="c4-j"></select></span><span class="field" data-h="hostf"><label for="c4-host">Host header</label><select id="c4-host"><option>a.whale.hey</option><option>b.whale.hey</option><option>c.whale.hey</option></select></span></div>
<div class="pane" data-h="net"></div>
<div class="grid2"><div class="stack" style="gap:5px" data-h="hops"></div><div class="msg" data-h="jmsg"></div></div>
</div></section>
<h2>Service types</h2>
<div class="tablewrap wide"><table><thead><tr><th>Type</th><th>Reachable from</th><th>How</th></tr></thead><tbody>
<tr><td><code>ClusterIP</code> (default)</td><td>Inside the cluster</td><td>Virtual IP, DNAT by kube-proxy rules on every node</td></tr>
<tr><td><code>NodePort</code></td><td>Any node's IP, port 30000–32767</td><td>ClusterIP plus the same port opened on every node</td></tr>
<tr><td><code>LoadBalancer</code></td><td>The internet</td><td>NodePort plus a cloud load balancer the cloud controller creates</td></tr>
<tr><td><code>ExternalName</code></td><td>Inside the cluster</td><td>A DNS CNAME to an outside name; no proxying at all</td></tr>
<tr><td>Headless (<code>clusterIP: None</code>)</td><td>Inside the cluster</td><td>No virtual IP; DNS returns the pod IPs themselves</td></tr>
</tbody></table></div>
<div class="tabs">
<figure class="code"><figcaption>NodePort, multi-port</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Service
metadata:
  name: node-js-nodeport
spec:
  type: NodePort
  sessionAffinity: ClientIP      # optional: same client, same pod
  selector:
    name: node-js
  ports:
    - name: http
      port: 80                   # the Service's port
      targetPort: 8080           # the container's port
      nodePort: 30001            # opened on every node
    - name: https
      port: 443
      targetPort: 8443</code></pre></figure>
<figure class="code"><figcaption>headless</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Service
metadata:
  name: node-js-none
spec:
  clusterIP: None                # no VIP, no kube-proxy involvement
  selector:
    name: node-js
  ports:
    - port: 80
# nslookup node-js-none.default.svc.cluster.local
#   -&gt; 10.244.1.6, 10.244.2.7     one A record per ready pod</code></pre></figure>
<figure class="code"><figcaption>external endpoints</figcaption><pre><code data-lang="yaml"># A Service with NO selector, pointed at something outside the cluster.
# Pods use "custom-service" today; when the database migrates into
# Kubernetes you add a selector and no client changes.
apiVersion: v1
kind: Service
metadata:
  name: custom-service
spec:
  ports:
    - port: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: custom-service           # must match the Service name
subsets:
  - addresses:
      - ip: 203.0.113.25
    ports:
      - port: 80</code></pre></figure>
<figure class="code"><figcaption>ingress (whalesay)</figcaption><pre><code data-lang="yaml">apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whale-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: a.whale.hey          # name-based virtual hosting
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: whale-svc-a, port: { number: 80 } }
    - host: b.whale.hey
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: whale-svc-b, port: { number: 80 } }
# Fan-out is the same idea with one host and several paths.
# An Ingress does nothing until an ingress controller is running.</code></pre></figure>
<figure class="code"><figcaption>namespace and quota</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Namespace
metadata:
  name: test
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: test-quotas
  namespace: test
spec:
  hard:
    pods: "3"
    services: "1"
    replicationcontrollers: "1"
# A 4th pod is rejected at admission: exceeded quota: test-quotas</code></pre></figure>
</div>
<h2>Finding services</h2>
<p>Two mechanisms. Each pod gets <strong>environment variables</strong> such as <code>NODE_JS_SERVICE_HOST</code> for every Service that existed when it started, which is fragile because order matters. <strong>Cluster DNS</strong> (CoreDNS) gives every Service a name, <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>, with SRV records for named ports. Use DNS.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>NodePort hides the client IP.</strong> Traffic landing on a node without the pod is forwarded with source NAT. <code>externalTrafficPolicy: Local</code> keeps the IP and only routes to local pods.</li>
<li><strong>One <code>LoadBalancer</code> Service is one cloud load balancer,</strong> with its own bill. Put many HTTP services behind a single Ingress instead.</li>
<li><strong>The pod network needs a plugin.</strong> <code>kubenet</code> is basic; CNI plugins such as Flannel, Calico, Weave and Canal differ in encapsulation, performance and whether they enforce NetworkPolicy (Chapter 15).</li>
</ul></div>
<div class="since"><b>Since the book</b><p><code>Ingress</code> is stable as <code>networking.k8s.io/v1</code> and frozen; its successor is the Gateway API, which splits the role into Gateway and HTTPRoute objects. Endpoints are now served through <code>EndpointSlice</code>. kube-proxy's userspace mode is gone, and some CNIs replace kube-proxy entirely with eBPF.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Why can you not ping a ClusterIP?</summary><p>It is not assigned to any interface. It exists only as a match in NAT rules for the Service's protocol and port, so ICMP has nothing to hit (IPVS mode is an exception).</p></details>
<details class="q"><summary>When do you want a headless Service?</summary><p>When clients need each pod individually: database replicas, peer discovery in a cluster such as Cassandra, or client-side load balancing. Chapter 13 depends on it.</p></details>

</template>
<template id="t-chapter-5">
<p class="eyebrow">Chapter 5</p>
<h1>Using critical Kubernetes resources</h1>
<p class="lede">The book designs a platform called Hue: an assistant that learns about you and acts on your behalf through many small services. It is a vehicle for one question. Given a real system, which Kubernetes resource fits which part?</p>
<div class="model"><b>Mental model</b>
<p>Match the resource to the lifetime of the work. Something that should run for ever and be replaceable is a <strong>Deployment</strong>. Something that should run to completion is a <strong>Job</strong>, on a schedule a <strong>CronJob</strong>. Something that should run once on every node is a <strong>DaemonSet</strong>. Something that must happen before the app starts is an <strong>init container</strong>. And "is it ready for traffic" is always a <strong>readiness probe</strong>, never a sleep.</p></div>
<h2>Hue in brief</h2>
<div class="tablewrap wide"><table><thead><tr><th>Hue component</th><th>Nature</th><th>Kubernetes resource</th></tr></thead><tbody>
<tr><td>Profile, graph, identity, authorizer, learner</td><td>Long-running internal microservices</td><td>Deployment + ClusterIP Service</td></tr>
<tr><td>Public API, reminders</td><td>Long-running, externally reachable</td><td>Deployment + LoadBalancer Service or Ingress</td></tr>
<tr><td>Generic sensors and actuators, plugins</td><td>Many small adapters to outside services</td><td>Deployments, often with sidecars</td></tr>
<tr><td>Model retraining, data migration</td><td>Batch, finite</td><td>Job, CronJob</td></tr>
<tr><td>Schema migration, waiting for the database</td><td>Must finish before the app starts</td><td>Init container</td></tr>
<tr><td>Log and metrics collection, shared proxy</td><td>One per node</td><td>DaemonSet</td></tr>
<tr><td>Legacy systems outside the cluster</td><td>External</td><td>Service without selector, ExternalName</td></tr>
<tr><td>Teams, staging vs production</td><td>Isolation</td><td>Namespaces</td></tr>
</tbody></table></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Microservices bring-up sequencer</h3><p>Step through bringing up <code>hue-learn</code>, which depends on a database. Toggle the safeguards off to see what each one prevents.</p></header>
<div class="body"><div class="row"><button class="btn" data-h="bnext">Next →</button><button class="btn ghost" data-h="brst">Restart</button><button class="chip" data-h="binit">init container</button><button class="chip" data-h="bready">readinessProbe</button></div>

<div class="tabs">
<figure class="code"><figcaption>deployment</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: Deployment
metadata:
  name: hue-learn
  labels: { app: hue, service: learn }
spec:
  replicas: 3
  selector:
    matchLabels: { app: hue, service: learn }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: hue, service: learn }
    spec:
      initContainers:                      # run in order, each to completion
        - name: wait-for-db
          image: busybox:1.36

      containers:
        - name: hue-learner
          image: g1g1/hue-learn:v3.0
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
# kubectl apply -f hue-learn.yaml
# kubectl set image deployment/hue-learn hue-learner=g1g1/hue-learn:v4.0
# kubectl rollout status deployment/hue-learn
# kubectl rollout undo deployment/hue-learn</code></pre></figure>
<figure class="code"><figcaption>job and cronjob</figcaption><pre><code data-lang="yaml">apiVersion: batch/v1
kind: Job
metadata:
  name: factorial5
spec:
  completions: 3          # run until 3 pods have succeeded
  parallelism: 2          # at most 2 at a time
  backoffLimit: 4
  ttlSecondsAfterFinished: 600    # clean up the finished Job and its pods
  template:
    spec:
      restartPolicy: Never        # Jobs may not use Always
      containers:
        - name: factorial5
          image: python:3.12
          command: ["python", "-c", "import math; print(math.factorial(5))"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stretch
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid       # skip a run if the last is still going
  jobTemplate:
    spec:
      template:

          restartPolicy: OnFailure

      hostPID: true
      hostNetwork: true            # one agent per node, on the node's address

<section class="lab">
<header><span class="tag">Lab</span><h3>Rolling update stepper</h3><p>Four replicas moving from v1 to v2. The two knobs decide how far the Deployment may overshoot and undershoot.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">maxSurge</span><span data-h="surge"></span></span><span class="field"><span class="lbl">maxUnavailable</span><span data-h="unav"></span></span><button class="chip" data-h="broken">v2 never becomes ready</button><button class="btn" data-h="rnext">Step →</button><button class="btn ghost" data-h="rrst">Restart</button></div>
<div class="row"><span class="lbl" style="width:60px">pods</span><div class="fleet" data-h="rfleet"></div></div>
<div class="row"><span class="pill" data-h="ravail"></span><span class="pill info" data-h="rtotal"></span></div><div class="msg" data-h="rmsg"></div></div></section>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Bare pods are not rescheduled.</strong> A pod created directly dies with its node. Always go through a controller.</li>
<li><strong>Finished Jobs pile up</strong> unless you delete them or set a TTL.</li>
<li><strong>CronJobs can run twice or not at all</strong> around controller restarts. Make the work idempotent.</li>
<li><strong>Init containers run again on every pod restart.</strong> They must be safe to repeat.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>With <code>maxSurge: 0, maxUnavailable: 1</code>, what happens to capacity during a rollout?</summary><p>It dips by one pod at a time: an old pod is removed before its replacement exists. No extra resources are needed, which matters when the cluster is full.</p></details>
<details class="q"><summary>Why prefer an init container over a retry loop inside the app for waiting on a dependency?</summary><p>It keeps startup ordering out of the application image, can use different tools and permissions, and makes the wait visible in pod status as <code>Init:0/1</code>.</p></details>

</template>
<template id="t-chapter-6">
<p class="eyebrow">Chapter 6</p>
<h1>Exploring Kubernetes storage concepts</h1>
<p class="lede">Containers forget. Their filesystem is discarded on every restart, which is right for code and wrong for data. Kubernetes storage is the set of abstractions that lets data outlive the things that use it.</p>
<div class="model"><b>Mental model</b>
<p>Separate three lifetimes. A <strong>container's</strong> writable layer dies with the container. A <strong>pod's</strong> volumes live as long as the pod and are shared by its containers. A <strong>PersistentVolume</strong> lives independently of any pod. A <strong>PersistentVolumeClaim</strong> is a request for storage ("10 GiB, read-write") that binds to a volume, so an application asks for <em>what</em> it needs and an administrator, or a <strong>StorageClass</strong>, decides <em>how</em> it is supplied. It is the same split as pods and nodes.</p></div>
<div class="tabs">
<figure class="code"><figcaption>emptyDir</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Pod
metadata:
  name: memory-pd
spec:
  containers:
    - name: memory-pd
      image: nginx:1.27
      volumeMounts:
        - mountPath: /memory-pd
          name: memory-volume
  volumes:
    - name: memory-volume
      emptyDir:
        medium: Memory        # tmpfs: fast, counts against memory limits. Omit for node disk.
# Survives container restarts. Deleted when the pod leaves the node.</code></pre></figure>
<figure class="code"><figcaption>cloud disk, directly</figcaption><pre><code data-lang="yaml"># The pod names a specific disk. Works, and couples the pod to one cloud,
# one zone and one pre-created disk.
  volumes:
    - name: gce-pd
      gcePersistentDisk:
        pdName: mysite-volume-1
        fsType: ext4</code></pre></figure>
<figure class="code"><figcaption>PV and PVC, static</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-10g
spec:
  capacity: { storage: 10Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/p/zones/us-central1-b/disks/mysite-volume-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
  storageClassName: ""          # empty: only bind to a pre-made PV</code></pre></figure>
<figure class="code"><figcaption>StorageClass, dynamic</figcaption><pre><code data-lang="yaml">apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer   # create the disk in the zone where the pod lands
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
spec:
  storageClassName: fast
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
# No PV written by hand: the provisioner creates the disk and the PV on demand.</code></pre></figure>
</div>

<header><span class="tag">Lab</span><h3>PV / PVC binding lifecycle</h3><p>Drive the objects through their life. Watch which deletions destroy data and which do not.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">Provisioning</span><span data-h="prov"></span></span><span class="field"><span class="lbl">reclaimPolicy</span><span data-h="recl"></span></span></div>

<div class="grid3"><div class="pane"><h4>Pod</h4><div data-h="spod"></div></div><div class="pane"><h4>PVC web-data</h4><div data-h="spvc"></div></div><div class="pane"><h4>PV and cloud disk</h4><div data-h="spv"></div></div></div>
<div class="msg" data-h="lmsg"></div></div></section>
<h2>StatefulSets</h2>
<div class="model"><b>Mental model</b>
<p>A Deployment's pods are interchangeable: random names, any order, shared or no storage. Clustered databases need the opposite. A StatefulSet gives each replica an <em>ordinal</em> and three things that stick to it: a stable name (<code>web-0</code>, <code>web-1</code>), a stable DNS record through a headless Service, and its own PersistentVolumeClaim from a template. Kill <code>web-1</code> and what returns is <code>web-1</code>, attached to <code>web-1</code>'s disk.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>StatefulSet ordinals and volumes</h3><p>Scale up and down. Pods are created in order and removed in reverse; claims stay behind.</p></header>
<div class="body"><div class="ctl"><span class="field"><label for="c6-rep">replicas: <b data-h="srep"></b></label><input id="c6-rep" type="range" min="0" max="5" value="3"></span></div>
<div class="tablewrap" style="margin:0"><table data-h="stab"></table></div><div class="msg" data-h="smsg"></div></div></section>
<figure class="code"><figcaption>statefulset</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Service
metadata:
  name: whaleset
spec:
  clusterIP: None                 # headless: gives each pod its own DNS name
  selector: { app: whales }
  ports: [{ port: 80, name: web }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: whaleset
spec:
  serviceName: whaleset
  replicas: 3
  selector:
    matchLabels: { app: whales }
  template:
    metadata:
      labels: { app: whales }
    spec:
      containers:
        - name: whales
          image: nginx:1.27
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:           # one PVC per replica: www-whaleset-0, www-whaleset-1, ...
    - metadata:
        name: www
      spec:
        storageClassName: fast
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }</code></pre></figure>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Disks live in one zone.</strong> A pod bound to a zonal disk can only run in that zone. If the zone fails, the pod waits.</li>
<li><strong><code>ReadWriteOnce</code> means one node,</strong> not one pod. Most block storage cannot be mounted on two nodes, which blocks a rolling update of a Deployment that uses a single claim.</li>
<li><strong><code>reclaimPolicy: Delete</code> is the default for dynamic classes.</strong> Deleting the claim deletes the data. Use <code>Retain</code> for anything you would miss.</li>
<li><strong>Scaling a StatefulSet down keeps the claims,</strong> on purpose. You pay for the disks until you delete them yourself.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>In-tree volume plugins such as <code>gcePersistentDisk</code> and <code>awsElasticBlockStore</code> have been migrated to CSI drivers (Chapter 17). StatefulSets gained an optional <code>persistentVolumeClaimRetentionPolicy</code> to delete claims on scale-down or deletion.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>A pod using a PVC is deleted and recreated on another node. What happens to the data?</summary><p>Nothing. The claim and volume are separate objects. The volume is detached from the old node, attached to the new one and mounted into the new pod, provided the new node is in a zone the disk can reach.</p></details>
<details class="q"><summary>Why does a StatefulSet need a headless Service?</summary><p>So each pod gets an individual DNS name, <code>pod.service.namespace.svc.cluster.local</code>. A normal Service would hide them behind one virtual IP, and cluster members need to address each other.</p></details>

</template>
<template id="t-chapter-7">
<p class="eyebrow">Chapter 7</p>
<h1>Monitoring and logging</h1>
<p class="lede">A cluster moves workloads around without asking. That is the point, and it means you cannot find a problem by logging in to the machine where the app runs, because by then it runs somewhere else.</p>
<div class="model"><b>Mental model</b>
<p>Three kinds of signal answer three kinds of question. <strong>Metrics</strong> are numbers over time: is something wrong, and since when? <strong>Logs</strong> are events with text: what did the program say when it went wrong? <strong>System-level tracing</strong> watches system calls and connections: what was the process doing that it did not say? In Kubernetes each signal must be collected from every node, tagged with pod, namespace and labels, and shipped somewhere that outlives the pod.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Observability pipeline and telemetry explorer</h3><p>Pick a pipeline to see how data moves, or pick a question to see which pipeline answers it.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">Pipeline</span><span data-h="pipe"></span></span><span class="field"><label for="c7-q">Or: I need to know…</label><select id="c7-q"></select></span></div>
<div class="pane" data-h="pg"></div>
<div class="grid2"><div class="tablewrap" style="margin:0"><table data-h="ptab"></table></div><div class="stack"><pre data-h="pcmd"></pre><div class="msg" data-h="pmsg"></div></div></div></div></section>
<h2>The pieces</h2>
<ul>
<li><strong>cAdvisor</strong> is built into the kubelet and reports CPU, memory, filesystem and network use per container.</li>
<li><strong>Heapster</strong> (in the book) polled every kubelet, aggregated by pod and namespace and wrote to <strong>InfluxDB</strong>, with <strong>Grafana</strong> for dashboards.</li>
<li><strong>Fluentd</strong> runs as a DaemonSet, tails container log files under <code>/var/log/containers</code> on each node, adds Kubernetes metadata and forwards to a backend: Google Cloud Logging on GCE, Elasticsearch elsewhere.</li>
<li><strong>Sysdig</strong> captures system calls with container context. The hosted product adds topology views, dashboards and alerting; the <code>sysdig</code> CLI and <code>csysdig</code> curses UI work on a single host.</li>
<li><strong>Prometheus</strong> scrapes HTTP <code>/metrics</code> endpoints it discovers through the Kubernetes API, stores time series locally, evaluates alert rules and hands alerts to Alertmanager. The <strong>Prometheus Operator</strong> lets you declare all of that as Kubernetes resources.</li>
</ul>
<div class="tabs">
<figure class="code"><figcaption>dashboards through the proxy</figcaption><pre><code data-lang="bash">$ kubectl proxy &amp;
# then browse the API-proxied service, for example:
# http://localhost:8001/api/v1/namespaces/monitoring/services/grafana:80/proxy/
$ kubectl port-forward -n monitoring svc/grafana 3000:80     # simpler for one service
$ kubectl top nodes
$ kubectl top pods -A --sort-by=memory</code></pre></figure>
<figure class="code"><figcaption>fluentd daemonset (shape)</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: kube-system
spec:
  selector:
    matchLabels: { app: fluentd }
  template:
    metadata:
      labels: { app: fluentd }
    spec:
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }   # run on masters too
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1-debian-elasticsearch
          env:
            - { name: FLUENT_ELASTICSEARCH_HOST, value: elasticsearch.logging }
          volumeMounts:
            - { name: varlog, mountPath: /var/log, readOnly: true }
      volumes:
        - name: varlog
          hostPath: { path: /var/log }
# Apps write to stdout/stderr. The runtime writes files on the node.
# Fluentd ships them. Nothing in the app knows about the logging backend.</code></pre></figure>
<figure class="code"><figcaption>sysdig</figcaption><pre><code data-lang="bash">$ sudo sysdig -pc -c topcontainers_cpu          # busiest containers right now
$ sudo sysdig -pc -c topconns container.name=web
$ sudo sysdig -pc evt.type=open and k8s.ns.name=default and fd.name contains /etc
$ sudo sysdig -w incident.scap                   # record now, analyse later
$ sudo csysdig                                   # top-like UI; F2 switches views (containers, K8s pods…)</code></pre></figure>
<figure class="code"><figcaption>prometheus operator</figcaption><pre><code data-lang="yaml">apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hue-learn
  labels: { release: kube-prometheus }
spec:
  selector:
    matchLabels: { app: hue, service: learn }   # scrape every Service with these labels
  endpoints:
    - port: metrics
      interval: 30s
# The operator turns ServiceMonitor objects into Prometheus scrape config.
# New service with the right labels =&gt; scraped automatically.</code></pre></figure>
</div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Logs on a node are rotated and lost.</strong> <code>kubectl logs</code> shows only what is still on disk, and nothing once the pod is deleted.</li>
<li><strong>High-cardinality labels</strong> (user IDs, request IDs) multiply time series and can exhaust a Prometheus server's memory.</li>
<li><strong>Monitoring inside the cluster goes down with the cluster.</strong> Alert on the monitoring system from somewhere outside it.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Heapster was retired in Kubernetes 1.13. <code>metrics-server</code> now feeds <code>kubectl top</code> and the autoscaler; Prometheus with the kube-prometheus stack is the usual choice for history and alerting. Fluent Bit is a common lighter replacement for Fluentd on nodes, and OpenTelemetry has become the standard for traces and increasingly for metrics and logs. Sysdig's open-source lineage continues in Falco for runtime security.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Why is log collection a DaemonSet and not a sidecar in every pod?</summary><p>The runtime already writes every container's stdout to files on the node. One agent per node reads them all, so applications need no changes and no extra container each.</p></details>
<details class="q"><summary>Prometheus pulls; Heapster pushed to InfluxDB. What does pulling buy you?</summary><p>The server knows what it expects to scrape, so a missing target is itself a signal (<code>up == 0</code>). Targets stay simple: they expose a page and hold no knowledge of where metrics go.</p></details>

</template>
<template id="t-chapter-8">
<p class="eyebrow">Chapter 8</p>
<h1>Monitoring, logging and troubleshooting</h1>
<p class="lede">Telemetry is only useful if you can turn it into a diagnosis. This chapter takes the same tools and points them at the failures clusters really have: hardware, limits, configuration and cost.</p>
<div class="model"><b>Mental model</b>
<p>Debug from the outside in, along the chain a request follows. Is the node healthy? Is the pod scheduled, started, ready? Does the Service select it? Each layer has one command that answers the question, and the <em>Events</em> section of <code>kubectl describe</code> is where Kubernetes tells you, in words, what it tried and why it stopped. Most incidents are solved by reading events before reading dashboards.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Cluster incident and troubleshooting simulator</h3><p>Pick an incident. Run commands to gather clues, then name the root cause.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">Incident</span><span data-h="inc"></span></span></div>
<div class="msg" data-h="brief"></div>
<div class="row" data-h="cmds"></div>
<pre data-h="out" style="min-height:150px;max-height:330px"></pre>
<div class="ctl"><span class="lbl">Root cause?</span><span class="row" data-h="opts"></span></div><div class="msg" data-h="verdict"></div></div></section>
<h2>What collects what</h2>
<div class="tablewrap wide"><table><thead><tr><th>Layer</th><th>Component</th><th>Gives you</th></tr></thead><tbody>
<tr><td>Container metrics</td><td>cAdvisor in the kubelet</td><td>CPU usage and limits, memory working set, filesystem use, network bytes and errors, uptime</td></tr>
<tr><td>Aggregation</td><td>Heapster in the book; metrics-server and Prometheus today</td><td>The same, rolled up by pod, namespace, node and cluster</td></tr>
<tr><td>Logs</td><td>Fluentd → Elasticsearch → Kibana (EFK)</td><td>Searchable, centralised log lines with pod metadata</td></tr>
<tr><td>Node health</td><td>Node Problem Detector</td><td>Kernel deadlocks, filesystem corruption, hardware errors, surfaced as node conditions and events</td></tr>
</tbody></table></div>
<div class="tabs">
<figure class="code"><figcaption>node problem detector</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-problem-detector
  namespace: kube-system
spec:
  selector:
    matchLabels: { app: node-problem-detector }
  template:
    metadata:
      labels: { app: node-problem-detector }
    spec:
      containers:
        - name: node-problem-detector
          image: registry.k8s.io/node-problem-detector/node-problem-detector:v0.8.19
          securityContext: { privileged: true }
          volumeMounts:
            - { name: log, mountPath: /var/log, readOnly: true }
            - { name: kmsg, mountPath: /dev/kmsg, readOnly: true }
      volumes:
        - { name: log, hostPath: { path: /var/log } }
        - { name: kmsg, hostPath: { path: /dev/kmsg } }
# Its problem daemons watch the kernel log and report NodeConditions such as
# KernelDeadlock or ReadonlyFilesystem. The kubelet cannot see these itself.</code></pre></figure>
<figure class="code"><figcaption>quota and limit range</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: ResourceQuota
metadata: { name: compute, namespace: team-a }
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: team-a }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }   # applied when a container sets none
      default:        { cpu: 500m, memory: 256Mi }
# With a compute quota in force, a pod that sets no requests is REJECTED
# unless a LimitRange supplies defaults.</code></pre></figure>
<figure class="code"><figcaption>the diagnostic ladder</figcaption><pre><code data-lang="bash">$ kubectl get nodes                                  # Ready? pressure conditions?
$ kubectl describe node &lt;node&gt;                       # Conditions, Allocated resources, Events
$ kubectl get pods -o wide                           # status, restarts, which node
$ kubectl describe pod &lt;pod&gt;                         # Events: scheduling, pulls, probes, OOMKilled
$ kubectl logs &lt;pod&gt; --previous                      # output of the container that just died
$ kubectl get endpoints &lt;service&gt;                    # empty means the selector or readiness is wrong
$ kubectl get events -A --sort-by=.lastTimestamp | tail -30
$ kubectl describe quota -n &lt;ns&gt;
$ kubectl top pods -A --sort-by=cpu</code></pre></figure>
<figure class="code"><figcaption>prometheus queries</figcaption><pre><code data-lang="text"># Containers being CPU-throttled (fraction of periods throttled)
rate(container_cpu_cfs_throttled_periods_total[5m])
  / rate(container_cpu_cfs_periods_total[5m]) &gt; 0.25

# Memory close to its limit: the next step is an OOM kill
container_memory_working_set_bytes / on(pod, container)
  kube_pod_container_resource_limits{resource="memory"} &gt; 0.9

# Nodes under pressure
kube_node_status_condition{condition=~"MemoryPressure|DiskPressure", status="true"} == 1

# etcd has no leader
etcd_server_has_leader == 0</code></pre></figure>
</div>
<h2>Thinking about hardware and cost</h2>
<ul>
<li><strong>Hardware fails.</strong> In the cloud you replace the node. On bare metal you also diagnose it, keep spares and plan capacity, in exchange for control and often lower unit cost.</li>
<li><strong>Limits, shares and quotas interact.</strong> CPU over its limit is <em>throttled</em>: slower, still alive. Memory over its limit is <em>killed</em>. A namespace over quota cannot create pods at all.</li>
<li><strong>Performance and cost pull apart.</strong> Generous requests waste nodes; tight ones cause throttling and eviction. Measure real use, then set requests near it and limits above.</li>
<li><strong>Hybrid clusters</strong> add network latency and data-transfer charges between sites to every decision.</li>
</ul>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong><code>OOMKilled</code> does not appear in application logs.</strong> The kernel kills the process without warning. Look at <code>Last State</code> in <code>kubectl describe pod</code>.</li>
<li><strong>Evictions follow priority.</strong> Under node memory pressure the kubelet evicts pods using more than they requested first. Pods with no requests are the first to go.</li>
<li><strong>A Service with no endpoints returns "connection refused" instantly,</strong> which looks like an app crash and is usually a label typo.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>A container is slow but never restarts, and node CPU is mostly idle. What do you check?</summary><p>CPU throttling. A limit caps the container's CPU time per period regardless of spare capacity on the node. Check the throttling metrics and raise or remove the limit.</p></details>
<details class="q"><summary>A Deployment reports 0 of 3 replicas and there are no pods at all. Where is the error?</summary><p>On the ReplicaSet, not on any pod: <code>kubectl describe rs</code> shows the admission failure, typically a quota or a missing default request.</p></details>

</template>
<template id="t-chapter-9">
<p class="eyebrow">Chapter 9</p>
<h1>Operating systems, platforms, and cloud and local providers</h1>
<p class="lede">Kubernetes sits on a stack of choices: which runtime starts containers, which operating system the nodes run, and who operates the control plane. Standards are what make those choices swappable.</p>
<div class="model"><b>Mental model</b>
<p>Three interfaces carve the stack into replaceable parts. The <strong>OCI image spec</strong> says what a container image is, so any tool can build one and any runtime can run it. The <strong>OCI runtime spec</strong> says how to start a container from an unpacked image; <code>runc</code> is the reference implementation. The <strong>CRI</strong> says how the kubelet asks for pods and images. Everything else, including whether you or a cloud vendor carries the pager, is a decision about who operates which layer.</p></div>
<h2>Standards and foundations</h2>
<ul>
<li><strong>Open Container Initiative (OCI):</strong> formed in 2015 under the Linux Foundation, seeded with Docker's image format and <code>runc</code>. Its charter is narrow on purpose: specify the image and the runtime, stay neutral on orchestration.</li>
<li><strong>Cloud Native Computing Foundation (CNCF):</strong> also a Linux Foundation project, home of Kubernetes, Prometheus, containerd, etcd, CoreDNS and many others. It provides neutral governance, so no single vendor owns the direction.</li>
<li><strong>Container Runtime Interface (CRI):</strong> the kubelet's plugin boundary from Chapter 2.</li>
</ul>
<section class="lab">
<header><span class="tag">Lab</span><h3>Runtime, host OS and managed platform trade-off matrix</h3><p>Choose a runtime to see the call stack under the kubelet, and a platform to see who is responsible for what.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">Runtime</span><span data-h="rt"></span></span></div>
<div class="grid2"><div class="pane" data-h="rtg"></div><div class="msg" data-h="rtm"></div></div>
<div class="ctl" style="border-top:1px solid var(--line);padding-top:14px"><span class="field"><span class="lbl">Platform</span><span data-h="pf"></span></span><span class="pill" data-h="load"></span></div>
<div class="tablewrap" style="margin:0"><table data-h="resp"></table></div><div class="msg" data-h="pfm"></div></div></section>
<h2>Container-optimised operating systems</h2>
<p>A general-purpose distribution carries a package manager, compilers and services a container host never uses, each one something to patch. Container-focused systems strip that away. <strong>CoreOS Container Linux</strong> shipped a minimal, read-only root, updated itself atomically by swapping between two partitions, and gave the world <code>etcd</code> and <code>rkt</code>; <strong>Tectonic</strong> was CoreOS's commercial Kubernetes distribution. <strong>Project Atomic</strong> did the same for the Red Hat family with image-based updates through <code>rpm-ostree</code>. The trade-off is consistent: less to attack and maintain, in exchange for doing everything through containers and immutable images, with little room to install tools on the host.</p>
<div class="tabs">
<figure class="code"><figcaption>cri-o</figcaption><pre><code data-lang="bash"># Install CRI-O and point the kubelet at its socket
$ sudo systemctl enable --now crio
$ kubeadm init --cri-socket unix:///var/run/crio/crio.sock

# crictl is the runtime-neutral debugging tool: it speaks CRI to whatever is there
$ sudo crictl info
$ sudo crictl pods
$ sudo crictl ps -a
$ sudo crictl images
$ sudo crictl logs &lt;container-id&gt;
$ sudo crictl inspect &lt;container-id&gt; | jq .info.runtimeSpec.linux.namespaces

$ kubectl get nodes -o wide          # the CONTAINER-RUNTIME column shows cri-o://1.x</code></pre></figure>
<figure class="code"><figcaption>choosing managed vs self-managed</figcaption><pre><code data-lang="text">Choose a managed service (GKE, EKS, AKS) when
  - you have no team dedicated to running control planes
  - you want upgrades, etcd backups and master HA to be someone else's job
  - your workloads already live in that cloud

Choose self-managed (kubeadm, kops, bare metal) when
  - you need control-plane flags, versions or features the provider does not expose
  - you run on premises, at the edge or under data-residency rules
  - you operate at a scale where the management fee or instance pricing matters
  - you have people who can carry the pager for etcd</code></pre></figure>
</div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>"Managed" stops at the control plane.</strong> Your workloads, RBAC, network policy, node images in some modes, and add-ons remain your responsibility.</li>
<li><strong>Portability is at the API, not below it.</strong> Load balancer annotations, storage classes, IAM integration and ingress controllers differ per provider.</li>
<li><strong>Runtime choice rarely shows in an application.</strong> It shows in debugging tools: on containerd or CRI-O there is no <code>docker ps</code>; use <code>crictl</code>.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>CoreOS was acquired by Red Hat; Container Linux reached end of life in 2020 and continues as Flatcar Container Linux and Fedora CoreOS. Tectonic folded into OpenShift. <code>rkt</code> was archived. Newer container-optimised systems include Bottlerocket and Talos. All three large clouds now offer modes where nodes are managed too (GKE Autopilot, EKS with Fargate or Auto Mode, AKS Automatic).</p></div>
<h2>Check your model</h2>
<details class="q"><summary>An image built with Docker runs on a CRI-O node. Why?</summary><p>Both follow the OCI image specification. The image is a standard set of layers and a config file; nothing in it is Docker-specific.</p></details>
<details class="q"><summary>On EKS, who upgrades the kubelet?</summary><p>With self-managed or managed node groups, you start the node upgrade. The provider upgrades the control plane; node versions follow when you roll the node group, unless you use a mode where nodes are fully managed.</p></details>

</template>
<template id="t-chapter-10">
<p class="eyebrow">Chapter 10</p>
<h1>Creating Kubernetes clusters</h1>
<p class="lede">There are more ways to create a cluster than there are reasons to. This chapter builds three, from a laptop to bare metal, so that when you click a button in a cloud console you know what it did for you.</p>
<div class="model"><b>Mental model</b>
<p>Every cluster, however it is made, needs the same things in the same order: machines with a container runtime and kubelet; certificates so components trust each other; etcd; the control-plane processes; a pod network; then worker nodes that join with a token. Tools differ only in how many of those steps they perform for you.</p></div>

master$ sudo kubeadm init --pod-network-cidr=192.168.0.0/16 \
          --apiserver-advertise-address=192.168.77.10
master$ mkdir -p $HOME/.kube &amp;&amp; sudo cp /etc/kubernetes/admin.conf $HOME/.kube/config

master$ kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml

worker$ sudo kubeadm join 192.168.77.10:6443 --token abcdef.0123456789abcdef \

master$ kubeadm token create --print-join-command     # tokens expire after 24h</code></pre></figure>
