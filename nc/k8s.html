$ gcloud container clusters create demo --zone us-central1-b --num-nodes 3
$ gcloud container clusters get-credentials demo --zone us-central1-b

# AWS
$ eksctl create cluster --name demo --region us-west-2 --nodes 3
$ kops create cluster --name demo.k8s.local --zones us-west-2a --yes     # self-managed alternative

# Azure
$ az aks create -g demo-rg -n demo --node-count 3 --generate-ssh-keys
$ az aks get-credentials -g demo-rg -n demo</code></pre></figure>
</div>
<h2>Clouds and bare metal</h2>
<p>Kubernetes reaches cloud features through the cloud provider interface: nodes, load balancers, routes, zones, volumes. GCP has GCE and GKE; AWS has EKS, Fargate for running pods without managing nodes, and kops; Azure has AKS; Alibaba Cloud has its own container service. On bare metal none of that exists. You supply load balancing, storage and node lifecycle yourself, and tools such as bootkube let the control plane host itself as pods. Choose bare metal for cost at scale, data locality, special hardware or regulation, and expect to staff it.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Nodes are <code>NotReady</code> until a pod network is installed.</strong> <code>kubeadm init</code> does not choose one for you, and the pod CIDR you passed must match the CNI's configuration.</li>
<li><strong>A single control-plane node is a single point of failure.</strong> Fine for learning; production needs three, with etcd on each or on separate machines.</li>
<li><strong>Minikube is one node.</strong> Affinity rules, node failure and pod-to-pod traffic across nodes cannot be tested there. Use <code>kind</code> or multi-node minikube.</li>
<li><strong>Swap, time sync, and firewalls between nodes</strong> cause most first-install failures.</li>
</ul></div>
<div class="since"><b>Since the book</b><p><code>kind</code> (Kubernetes in Docker) and k3d/k3s are now common for local and CI clusters. Cluster API manages clusters declaratively from another Kubernetes cluster. On bare metal, MetalLB or kube-vip supply <code>LoadBalancer</code> Services.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>What does the <code>--discovery-token-ca-cert-hash</code> in <code>kubeadm join</code> protect against?</summary><p>A joining node contacting an impostor. The token authenticates the node to the cluster; the hash lets the node verify it is talking to the real API server's certificate authority.</p></details>
<details class="q"><summary>CoreDNS pods stay Pending right after <code>kubeadm init</code>. Is something broken?</summary><p>No. They need a pod network to get an IP, and none is installed yet. They start as soon as you apply a CNI manifest.</p></details>

</template>
<template id="t-chapter-11">
<p class="eyebrow">Chapter 11</p>
<h1>Cluster federation and multi-tenancy</h1>
<p class="lede">One cluster lives in one region and belongs to one provider. Sooner or later a region goes down, users on another continent complain about latency, or someone asks what happens if the vendor relationship sours. Federation is the idea of treating several clusters as one.</p>
<div class="model"><b>Mental model</b>
<p>Apply Kubernetes' own trick one level up. A <em>federation control plane</em> has its own API server and controllers. You give it a desired state, such as "nine replicas of this Deployment, and this Service", and its controllers push matching objects into each member cluster and keep them in sync. Two things then make it feel like one system: workloads are spread across clusters, and a single DNS name resolves to healthy endpoints in whichever cluster is closest and alive.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Multi-cluster federation and cross-region failover simulator</h3><p>Three member clusters. Fail one, move the user, and change the total replica count.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">User is in</span><span data-h="uloc"></span></span><span class="field"><label for="c11-rep">Federated replicas: <b data-h="frv"></b></label><input id="c11-rep" type="range" min="3" max="18" value="9"></span><span class="field"><span class="lbl">Cluster health (click to fail)</span><span class="row" data-h="health"></span></span></div>
<div class="grid3" data-h="clusters"></div>
<pre data-h="dns"></pre><div class="msg" data-h="fmsg"></div></div></section>
<h2>What gets federated</h2>
<div class="tablewrap wide"><table><thead><tr><th>Resource</th><th>Behaviour across clusters</th></tr></thead><tbody>
<tr><td>Deployments / ReplicaSets</td><td>Total replicas are divided among clusters, evenly or by weights, and rebalanced when a cluster is lost</td></tr>
<tr><td>Services + DNS</td><td>A Service is created in each cluster; the federation programs cloud DNS (Route 53, Cloud DNS) with regional and global records that drop unhealthy clusters</td></tr>
<tr><td>ConfigMaps, Secrets</td><td>Copied to every member, so applications see the same configuration everywhere</td></tr>
<tr><td>HorizontalPodAutoscalers</td><td>The federated HPA distributes min and max across clusters and shifts quota toward clusters under load</td></tr>
<tr><td>Jobs, Events, Namespaces</td><td>Jobs are split by completions; events are aggregated; namespaces are created in every member</td></tr>
</tbody></table></div>
<div class="tabs">
<figure class="code"><figcaption>contexts</figcaption><pre><code data-lang="bash"># Each cluster is a context in your kubeconfig. Federation started here.
$ kubectl config get-contexts
CURRENT   NAME            CLUSTER         AUTHINFO
*         gke-us          gke-us          admin-us
          eks-eu          eks-eu          admin-eu
          aks-asia        aks-asia        admin-asia
$ kubectl config use-context eks-eu
$ kubectl --context aks-asia get nodes</code></pre></figure>
<figure class="code"><figcaption>the book&#x27;s workflow (kubefed v1)</figcaption><pre><code data-lang="bash"># Stand up a federation control plane in a host cluster
$ kubefed init master-control --host-cluster-context=gke-us \
    --dns-provider="google-clouddns" --dns-zone-name="example.com."

# Join member clusters
$ kubectl config use-context master-control
$ kubefed join gke-us   --host-cluster-context=gke-us
$ kubefed join eks-eu   --host-cluster-context=gke-us
$ kubefed join aks-asia --host-cluster-context=gke-us
$ kubectl get clusters

# Anything created in this context is federated
$ kubectl create -f node-js-deploy-fed.yaml
$ kubectl create -f node-js-svc-fed.yaml

# Tear down: unjoin each cluster, then delete the federation namespace
$ kubefed unjoin eks-eu --host-cluster-context=gke-us</code></pre></figure>
<figure class="code"><figcaption>weighted placement</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-js-deploy
  annotations:
    federation.kubernetes.io/deployment-preferences: |
      {
        "rebalance": true,
        "clusters": {
          "gke-us":   { "minReplicas": 2, "weight": 2 },
          "eks-eu":   { "minReplicas": 2, "weight": 1 },
          "aks-asia": { "minReplicas": 2, "weight": 1 }
        }
      }
spec:
  replicas: 9
  selector:
    matchLabels: { name: node-js-deploy }
  template:
    metadata:
      labels: { name: node-js-deploy }
    spec:
      containers:
        - name: node-js-deploy
          image: jonbaier/pod-scaling:latest</code></pre></figure>
</div>
<h2>Multi-tenancy inside one cluster</h2>
<p>The opposite problem: many teams, one cluster. Namespaces give each team a scope for names, RBAC rules, resource quotas and network policies. That is <em>soft</em> multi-tenancy, suitable for teams in one company. Tenants who do not trust each other share a kernel and a control plane, so they need separate clusters or stronger sandboxing.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>DNS failover is only as fast as TTLs and client caches.</strong> Expect minutes, not seconds, unless a global load balancer sits in front.</li>
<li><strong>Data does not federate.</strong> Stateless pods move freely; databases need their own cross-region replication and a decision about consistency.</li>
<li><strong>The federation control plane is another thing to run,</strong> and its failure must not take member clusters down. Members keep working independently.</li>
<li><strong>Cross-region traffic costs money and latency.</strong> Keep chatty services in the same cluster.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Federation v1 and its <code>kubefed</code> CLI were abandoned, and the successor KubeFed (v2) has been archived as well. No single replacement won. Teams now combine GitOps tools that apply the same manifests to many clusters (Argo CD ApplicationSets, Flux), fleet managers (Karmada, Open Cluster Management), the Multi-Cluster Services API for cross-cluster service discovery, and cloud global load balancers or service meshes for traffic. The reasons for multi-cluster in this chapter all still apply.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>The federation control plane goes down. What happens to users?</summary><p>Nothing immediately. Each member cluster keeps running its workloads and DNS keeps its last records. What stops is reconciliation: no rebalancing and no DNS updates until it returns.</p></details>
<details class="q"><summary>Why is a database the hard part of multi-region?</summary><p>Pods can be recreated anywhere from an image. Data has one current value, and replicating it across regions forces a choice between waiting for remote acknowledgement on every write and accepting that regions briefly disagree.</p></details>

</template>
<template id="t-chapter-12">
<p class="eyebrow">Chapter 12</p>
<h1>Cluster authentication, authorization and container security</h1>
<p class="lede">A cluster concentrates risk. One API controls every workload, and every workload shares kernels with its neighbours. Security here is layers, each assuming the one before it has already failed.</p>
<div class="model"><b>Mental model</b>
<p>Two separate surfaces. The first is the <strong>API</strong>: every request passes the same gates in the same order. Who are you (authentication)? May you do this (authorization)? Is this particular object acceptable (admission)? The second is the <strong>container at run time</strong>: what can the process do on the node if it is compromised? RBAC answers nothing about the second, and <code>securityContext</code> answers nothing about the first. You need both.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>API request security and RBAC / admission pipeline tracer</h3><p>Compose a request. Follow it through each gate and see where, and why, it is stopped.</p></header>
<div class="body"><div class="ctl">
<span class="field"><label for="c12-who">Who</label><select id="c12-who"><option value="alice">alice (developer, client cert)</option><option value="bob">bob (auditor, OIDC token)</option><option value="ci">system:serviceaccount:prod:deployer</option><option value="anon">no credentials</option><option value="expired">carol (expired certificate)</option></select></span>
<span class="field"><label for="c12-verb">Verb</label><select id="c12-verb"><option>get</option><option>create</option><option>delete</option></select></span>
<span class="field"><label for="c12-res">Resource</label><select id="c12-res"><option>pods</option><option>secrets</option><option>nodes</option></select></span>
<span class="field"><label for="c12-ns">Namespace</label><select id="c12-ns"><option>dev</option><option>prod</option></select></span>
<span class="field" data-h="specf"><label for="c12-spec">Pod spec</label><select id="c12-spec"><option value="ok">non-root, no extras</option><option value="root">runs as root</option><option value="priv">privileged: true</option><option value="host">hostPath: /</option></select></span></div>
<pre data-h="req"></pre><div class="stack" style="gap:5px" data-h="gates"></div><div class="msg" data-h="gmsg"></div></div></section>
<div class="tabs">
<figure class="code"><figcaption>RBAC</figcaption><pre><code data-lang="yaml">apiVersion: rbac.authorization.k8s.io/v1
kind: Role                       # namespaced; ClusterRole is cluster-wide
metadata:
  namespace: dev
  name: dev-edit
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "pods/log", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding                # grants the Role to subjects, in this namespace
metadata:
  namespace: dev
  name: alice-dev-edit
subjects:
  - kind: User
    name: alice
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev-edit
  apiGroup: rbac.authorization.k8s.io
# RBAC is additive only: there are no deny rules. No matching rule means no.
# kubectl auth can-i create pods --namespace prod --as alice</code></pre></figure>
<figure class="code"><figcaption>securityContext</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Pod
metadata:
  name: hardened
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: registry.example.com/team/app@sha256:9b2f…   # pin by digest from a trusted registry
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        limits: { cpu: 500m, memory: 256Mi }               # limits are a security control too</code></pre></figure>
<figure class="code"><figcaption>pod security (modern)</figcaption><pre><code data-lang="yaml"># PodSecurityPolicy, as in the book, was removed in Kubernetes 1.25.
# Its replacement is a label on the namespace:
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    pod-security.kubernetes.io/enforce: restricted    # privileged | baseline | restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted</code></pre></figure>
<figure class="code"><figcaption>secrets</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Secret
metadata:
  name: secret-pii
type: Opaque
stringData:                       # written in clear here, stored base64-encoded
  username: admin
  password: s3cr3t
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
spec:
  containers:
    - name: app
      image: nginx:1.27
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: secret-pii, key: username }
      volumeMounts:
        - { name: creds, mountPath: /etc/secret-pii, readOnly: true }
  volumes:
    - name: creds
      secret: { secretName: secret-pii }      # delivered on tmpfs: never written to the node's disk
# kubectl create secret generic secret-pii --from-literal=username=admin --from-literal=password=s3cr3t</code></pre></figure>
</div>
<h2>Defence in depth for containers</h2>
<ul>
<li><strong>Kernel isolation.</strong> Namespaces and cgroups are the boundary. Drop capabilities, forbid privilege escalation, apply seccomp and AppArmor or SELinux profiles to narrow what a process can ask the kernel for.</li>
<li><strong>Resource exhaustion.</strong> Limits and quotas stop one container, or one tenant, from starving the node. A fork bomb is a security incident.</li>
<li><strong>Trusted images.</strong> Pull only from registries you control, scan continuously for known vulnerabilities, and sign images so admission can verify that what runs is what you built.</li>
<li><strong>Secure communication.</strong> TLS on every control-plane link, kubelets authenticated to the API server and the reverse, etcd reachable only from the API server.</li>
</ul>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Base64 is not encryption.</strong> Anyone with <code>get secrets</code>, or read access to etcd or its backups, has the values. Turn on encryption at rest and keep secret access narrow.</li>
<li><strong>"Create pods" is close to "read all secrets" in that namespace.</strong> A pod can mount any secret there and print it.</li>
<li><strong><code>cluster-admin</code> bindings accumulate.</strong> Audit them. Service accounts for CI are the usual offenders.</li>
<li><strong>Env-var secrets leak</strong> into crash dumps, <code>describe</code> output in some tools, and child processes. Prefer mounted files.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>PodSecurityPolicy is gone; Pod Security Admission (above) covers the common cases and policy engines such as Kyverno or OPA Gatekeeper handle the rest. Validating admission policies written in CEL are now built in. Image signing has standardised around Sigstore's cosign.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>RBAC allows alice to create pods in <code>dev</code>. Her privileged pod is rejected. By what?</summary><p>Admission. Authorization only asks whether she may create pods at all. An admission controller then inspects the object itself and applies the namespace's pod security level.</p></details>
<details class="q"><summary>Why mount secrets on <code>tmpfs</code>?</summary><p>So the plaintext lives only in memory on the node and disappears when the pod does. It never lands on a disk that could be imaged or recovered later.</p></details>

</template>
<template id="t-chapter-13">
<p class="eyebrow">Chapter 13</p>
<h1>Running stateful applications with Kubernetes</h1>
<p class="lede">Kubernetes was built for stateless services first. Running a database on it is possible and sometimes right. Doing it well means understanding what the database needs that an ordinary pod does not get.</p>
<div class="model"><b>Mental model</b>
<p>A distributed database is a group of members that know each other by name, each holding data the others expect it to have. Replace a member with an anonymous newcomer on an empty disk and the cluster must rebuild everything it held. So the platform must preserve <em>identity</em> (the same name returns) and <em>storage</em> (the same disk comes with it), and members need a way to <em>find each other</em>. A StatefulSet with a headless Service provides all three.</p></div>
<h2>Inside or outside the cluster?</h2>
<div class="two wide">
<div class="pane"><h4>Run state inside Kubernetes when</h4><ul><li>You want one way to deploy, monitor and upgrade everything</li><li>The datastore is itself distributed and tolerates member replacement (Cassandra, etcd, Kafka)</li><li>You have, or will adopt, an operator that knows the database's procedures</li></ul></div>
<div class="pane"><h4>Keep it outside when</h4><ul><li>A managed service exists and meets your needs (RDS, Cloud SQL)</li><li>The database is a single-primary system with fragile failover</li><li>Nobody on the team can restore it at 3 a.m. through Kubernetes abstractions</li></ul></div>
</div>
<p>Either way, applications find the datastore the same way: through a Service's DNS name, or through environment variables fed from a <strong>ConfigMap</strong>, so that moving the database later is a configuration change.</p>
<div class="tabs">
<figure class="code"><figcaption>configmap</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  db-ip-addresses: 1.2.3.4,5.6.7.8
---
apiVersion: v1
kind: Pod
metadata:
  name: some-pod
spec:
  containers:
    - name: some-container
      image: busybox:1.36
      command: ["/bin/sh", "-c", "env"]
      env:
        - name: DB_IP_ADDRESSES
          valueFrom:
            configMapKeyRef: { name: db-config, key: db-ip-addresses }
# kubectl create configmap db-config --from-literal=db-ip-addresses=1.2.3.4,5.6.7.8</code></pre></figure>
<figure class="code"><figcaption>cassandra headless service</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels: { app: cassandra }
spec:
  clusterIP: None                  # headless: DNS returns each pod, not a VIP
  ports:
    - port: 9042
  selector:
    app: cassandra</code></pre></figure>
<figure class="code"><figcaption>cassandra statefulset</figcaption><pre><code data-lang="yaml">apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 3
  selector:
    matchLabels: { app: cassandra }
  template:
    metadata:
      labels: { app: cassandra }
    spec:
      terminationGracePeriodSeconds: 1800      # time to drain before SIGKILL
      affinity:
        podAntiAffinity:                        # one Cassandra node per Kubernetes node
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: cassandra }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cassandra
          image: gcr.io/google-samples/cassandra:v13
          ports:
            - { containerPort: 7000, name: intra-node }
            - { containerPort: 9042, name: cql }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: 500m, memory: 1Gi }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "nodetool drain"] }
          env:
            - { name: CASSANDRA_CLUSTER_NAME, value: "K8Demo" }
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.default.svc.cluster.local"   # a stable name to bootstrap from
          readinessProbe:
            exec: { command: ["/bin/bash", "-c", "/ready-probe.sh"] }
            initialDelaySeconds: 15
          volumeMounts:
            - { name: cassandra-data, mountPath: /cassandra_data }
  volumeClaimTemplates:
    - metadata: { name: cassandra-data }
      spec:
        storageClassName: fast
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }</code></pre></figure>
<figure class="code"><figcaption>inspect</figcaption><pre><code data-lang="bash">$ kubectl get statefulset cassandra
$ kubectl get pods -l app=cassandra -o wide
$ kubectl get pvc -l app=cassandra
$ kubectl exec cassandra-0 -- nodetool status

--  Address      Load       Tokens  Owns   Host ID   Rack
UN  10.244.2.9   103.8 KiB  32      67.1%  f2c1…     Rack1-K8Demo
UN  10.244.1.7   89.5 KiB   32      66.2%  9a0e…     Rack1-K8Demo
UN  10.244.3.4   110.2 KiB  32      66.7%  41bd…     Rack1-K8Demo
$ kubectl run -it --rm dns --image=busybox:1.36 -- nslookup cassandra</code></pre></figure>
</div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Cassandra ring and failover simulator</h3><p>Bring a three-node ring up, then kill a member. Compare a StatefulSet with running the same image under a Deployment.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">Controller</span><span data-h="ctl"></span></span><button class="btn" data-h="up">Start next pod</button><button class="btn danger" data-h="kill">Kill the second member</button><button class="btn ghost" data-h="rst">Reset</button></div>
<div class="tablewrap" style="margin:0"><table data-h="ring"></table></div><pre data-h="rlog" style="max-height:170px"></pre><div class="msg" data-h="rmsg"></div></div></section>
<p>The book weighs three ways to run Cassandra. A <strong>StatefulSet</strong> gives stable names and storage and is the natural fit. A <strong>ReplicationController</strong> or Deployment treats members as interchangeable, so it needs a custom seed provider that asks the Kubernetes API for peers, and loses data locality on restart. A <strong>DaemonSet</strong> runs exactly one member per selected node with local disks: best raw performance, and scaling means adding nodes.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>A stuck pod blocks the rest.</strong> With the default ordered policy, if <code>cassandra-1</code> never becomes Ready, <code>cassandra-2</code> is never created.</li>
<li><strong>Kubernetes will not force-delete a StatefulSet pod on an unreachable node,</strong> because two members with one identity would corrupt data. Recovery needs a human or an operator.</li>
<li><strong>Short grace periods lose writes.</strong> Give the database time to flush, and use <code>preStop</code> to drain.</li>
<li><strong>The controller knows nothing about your database.</strong> Backups, repairs, schema changes and safe scaling are still procedures. Operators encode them.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>Why point <code>CASSANDRA_SEEDS</code> at <code>cassandra-0</code>'s DNS name and not at an IP?</summary><p>Pod IPs change on every restart. The StatefulSet DNS name is stable and always resolves to whichever pod currently holds ordinal 0.</p></details>
<details class="q"><summary>What does anti-affinity add for a replicated database?</summary><p>It stops two members landing on one Kubernetes node. Otherwise a single machine failure could remove two replicas of the same data at once.</p></details>

</template>
<template id="t-chapter-14">
<p class="eyebrow">Chapter 14</p>
<h1>Rolling updates, scalability and quotas</h1>
<p class="lede">Scaling in Kubernetes happens at three levels at once: pods per workload, nodes per cluster, and the control plane's own ability to keep up. Quotas are the brakes that stop any one of them consuming the rest.</p>
<div class="model"><b>Mental model</b>
<p>The Horizontal Pod Autoscaler is one more control loop. Every 15 seconds it compares a measured value with a target and adjusts <code>replicas</code>: <code>desired = ceil(current × measured ÷ target)</code>. CPU utilisation is measured against each pod's <em>request</em>, so an HPA on a workload without requests cannot work. It only changes a number; the scheduler, quotas and node capacity decide whether those replicas actually run.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>HPA, ResourceQuota and capacity lab</h3><p>Each pod requests 200m CPU and handles about 100 requests per second at full use of that request. Raise the load and find out which limit you hit first.</p></header>
<div class="body"><div class="ctl">
<span class="field"><label for="c14-load">Traffic: <b data-h="lv"></b> rps</label><input id="c14-load" type="range" min="50" max="2500" step="50" value="300"></span>
<span class="field"><label for="c14-max">HPA maxReplicas: <b data-h="mv"></b></label><input id="c14-max" type="range" min="2" max="30" value="10"></span>
<span class="field"><label for="c14-q">Quota requests.cpu: <b data-h="qv"></b></label><input id="c14-q" type="range" min="1" max="8" step="0.5" value="4"></span>
<span class="field"><label for="c14-n">Nodes (4 pods each): <b data-h="nv"></b></label><input id="c14-n" type="range" min="1" max="8" value="3"></span></div>
<div class="fleet" data-h="pods"></div>
<div class="row"><span class="pill info" data-h="want"></span><span class="pill" data-h="run"></span><span class="pill" data-h="util"></span></div>
<pre data-h="hout"></pre><div class="msg" data-h="hmsg"></div></div></section>
<div class="tabs">
<figure class="code"><figcaption>HPA</figcaption><pre><code data-lang="yaml">apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-js-scaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-js-scaling
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }   # percent of the REQUEST
    - type: Pods                       # custom metric, served by an adapter
      pods:
        metric: { name: requests_per_second }
        target: { type: AverageValue, averageValue: "100" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # do not flap
# Shortcut:  kubectl autoscale deployment node-js-scaling --min=2 --max=10 --cpu-percent=50
# During a rolling update the HPA keeps working, because it targets the Deployment, not a ReplicaSet.</code></pre></figure>
<figure class="code"><figcaption>quota</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    pods: "30"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: best-effort-cap
  namespace: team-a
spec:
  hard:
    pods: "5"
  scopes: ["BestEffort"]               # applies only to pods with no requests or limits</code></pre></figure>
<figure class="code"><figcaption>limit range</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "2",  memory: 2Gi }
      min:            { cpu: 50m,  memory: 64Mi }
      maxLimitRequestRatio: { cpu: "5" }     # limit at most 5x the request</code></pre></figure>
</div>
<h2>Requests, limits and what happens at the edges</h2>
<div class="tablewrap wide"><table><thead><tr><th></th><th>Request</th><th>Limit</th></tr></thead><tbody>
<tr><td>Used by</td><td>Scheduler, HPA, quota</td><td>Kernel cgroup</td></tr>
<tr><td>CPU exceeded</td><td>Fine if the node has spare</td><td>Throttled: slower, never killed</td></tr>
<tr><td>Memory exceeded</td><td>First in line for eviction under node pressure</td><td>OOM-killed and restarted</td></tr>
<tr><td>Both unset</td><td colspan="2">"BestEffort": schedulable anywhere, evicted first</td></tr>
<tr><td>Request = limit</td><td colspan="2">"Guaranteed": last to be evicted</td></tr>
</tbody></table></div>
<h2>Capacity planning</h2>
<ul>
<li><strong>Node size.</strong> A few large nodes waste less on per-node overhead and lose more when one fails. Many small nodes do the opposite. Mix pools: general purpose, memory-heavy, GPU.</li>
<li><strong>Elastic clouds.</strong> The cluster autoscaler adds nodes when pods are unschedulable and removes idle ones. Watch cloud quotas and regional capacity; Fargate-style offerings remove nodes from the picture.</li>
<li><strong>Storage.</strong> Trade speed, durability and price per class, and remember the zone constraint.</li>
</ul>
<section class="lab">
<header><span class="tag">Lab</span><h3>Control-plane scale</h3><p>How the control plane itself copes as the cluster grows.</p></header>
<div class="body"><div class="ctl"><span class="field"><label for="c14-cn">Cluster size: <b data-h="cnv"></b> nodes</label><input id="c14-cn" type="range" min="0" max="5" value="2" style="width:260px"></span></div>
<div class="grid2"><div class="tablewrap" style="margin:0"><table data-h="ctab"></table></div><div class="msg" data-h="cmsg"></div></div></div></section>
<p>Kubernetes publishes two service-level objectives it tests at scale: 99% of API calls answer within one second, and 99% of pods start within five seconds once their images are present. <strong>Kubemark</strong> is how they test: real masters with thousands of "hollow" nodes that run the kubelet's logic and no containers, so scheduler and API behaviour can be measured without paying for the machines.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>The HPA and a hand-set <code>replicas</code> fight.</strong> Remove <code>replicas</code> from manifests you re-apply, or every deploy resets the count.</li>
<li><strong>Scaling pods beyond node capacity produces Pending pods,</strong> not service. Pair the HPA with a cluster autoscaler.</li>
<li><strong>A compute quota makes requests mandatory.</strong> Pods without them are rejected unless a LimitRange supplies defaults.</li>
<li><strong>CPU limits throttle bursty services</strong> even on idle nodes. Many teams set memory limits and omit CPU limits.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>The HPA API is <code>autoscaling/v2</code> with multiple metrics and scaling behaviour; metrics come from metrics-server and custom-metrics adapters, not Heapster. The Vertical Pod Autoscaler adjusts requests, KEDA scales on event sources and to zero, and Karpenter provisions right-sized nodes. Supported limits are about 5,000 nodes and 150,000 pods per cluster.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Three pods average 90% CPU against a 50% target. How many does the HPA ask for?</summary><p><code>ceil(3 × 90 / 50) = 6</code>. It then waits for metrics from the new pods before deciding again.</p></details>
<details class="q"><summary>The HPA wants 12 replicas, the quota allows 8. Where do you see the failure?</summary><p>On the ReplicaSet's events: <code>exceeded quota</code>. The HPA shows 12 desired, the Deployment shows 8 available, and no pods are Pending because the extra four were never created.</p></details>

</template>
<template id="t-chapter-15">
<p class="eyebrow">Chapter 15</p>
<h1>Advanced Kubernetes networking</h1>
<p class="lede">Chapter 4 said every pod can reach every other pod. This chapter opens the box: the Linux parts that make that true, the plugin contract that wires them, and the policy objects that take reachability away again.</p>
<div class="model"><b>Mental model</b>
<p>Kubernetes states requirements and implements none of them. Pods get an IP, pods reach pods without NAT, nodes reach pods. A <strong>CNI plugin</strong> is a small executable the runtime calls with "add this container to the network" and "remove it". Plugins build the result from ordinary Linux pieces: a network namespace per pod, a <code>veth</code> pair as a cable from the pod to the node, a bridge or routing table on the node, and either encapsulation or real routes between nodes.</p></div>
<h2>The Linux parts</h2>
<div class="tablewrap wide"><table><thead><tr><th>Piece</th><th>Role in a pod's network</th></tr></thead><tbody>
<tr><td>Network namespace</td><td>The pod's private interfaces, routes and ports</td></tr>
<tr><td><code>veth</code> pair</td><td>Two linked virtual interfaces: one end is <code>eth0</code> in the pod, the other sits on the node</td></tr>
<tr><td>Bridge</td><td>A virtual switch on the node joining all local veth ends</td></tr>
<tr><td>CIDR / subnet</td><td>Each node gets a slice of the pod range, e.g. <code>10.244.1.0/24</code></td></tr>
<tr><td>Routing</td><td>How a packet for another node's slice finds that node</td></tr>
<tr><td>MTU</td><td>Largest packet size. Encapsulation adds headers, so the pod MTU must shrink (1450 for VXLAN on 1500)</td></tr>
</tbody></table></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Packet journey and CNI / NetworkPolicy inspector</h3><p>Choose who is talking to whom, how nodes are connected and which policies exist. See the path and whether the packet is allowed.</p></header>
<div class="body"><div class="ctl">
<span class="field"><label for="c15-src">From</label><select id="c15-src"><option value="fe">frontend pod (ns web)</option><option value="api">api pod (ns web)</option><option value="batch">batch pod (ns jobs)</option><option value="ext">external client via NodePort</option></select></span>
<span class="field"><label for="c15-dst">To</label><select id="c15-dst"><option value="db">db pod :5432 (ns data)</option><option value="api">api pod :8080 (ns web)</option></select></span>
<span class="field"><span class="lbl">Between nodes</span><span data-h="mode"></span></span>
<span class="field"><span class="lbl">Policies in ns data</span><span class="row"><button class="chip" data-h="deny">default-deny ingress</button><button class="chip" data-h="allow">allow api → db :5432</button></span></span>
<button class="chip" data-h="enf">CNI enforces NetworkPolicy</button></div>
<div class="grid2"><div class="stack" style="gap:5px" data-h="hops"></div><div class="stack"><div class="row"><span class="pill" data-h="verdict" style="font-size:13.5px"></span><span class="pill info" data-h="mtu"></span></div><div class="msg" data-h="nmsg"></div></div></div></div></section>
<div class="tabs">
<figure class="code"><figcaption>NetworkPolicy</figcaption><pre><code data-lang="yaml"># 1. Lock the namespace down: selects every pod, allows nothing in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. Open exactly what is needed. Policies are additive allow-lists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-db
  namespace: data
spec:
  podSelector:
    matchLabels: { app: db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: web }
          podSelector:                      # same list item = AND
            matchLabels: { app: api }
      ports:
        - { protocol: TCP, port: 5432 }</code></pre></figure>
<figure class="code"><figcaption>external load balancing</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local     # keep the client's source IP; only nodes with a local pod receive traffic
  selector: { app: api }
  ports:
    - { port: 80, targetPort: 8080 }
# Without a cloud: NodePort behind HAProxy, with Keepalived floating a virtual IP
# between two HAProxy hosts; or MetalLB; or an ingress proxy such as Traefik.</code></pre></figure>
<figure class="code"><figcaption>CNI configuration</figcaption><pre><code data-lang="json">{
  "cniVersion": "1.0.0",
  "name": "mynet",
  "plugins": [
    {
      "type": "bridge",
      "bridge": "cni0",
      "isGateway": true,
      "ipMasq": true,
      "ipam": {
        "type": "host-local",
        "subnet": "10.244.1.0/24",
        "routes": [{ "dst": "0.0.0.0/0" }]
      }
    },
    { "type": "loopback" }
  ]
}</code></pre></figure>
<figure class="code"><figcaption>a CNI plugin is just an executable</figcaption><pre><code data-lang="bash">#!/bin/bash
# The runtime sets env vars and passes the network config on stdin.
#   CNI_COMMAND     ADD | DEL | CHECK | VERSION
#   CNI_CONTAINERID the sandbox id
#   CNI_NETNS       path to the pod's network namespace
#   CNI_IFNAME      interface name to create inside it (eth0)
config=$(cat /dev/stdin)

case "$CNI_COMMAND" in
  ADD)
    ip link add veth_host type veth peer name veth_pod     # make the cable
    ip link set veth_pod netns "$CNI_NETNS" name "$CNI_IFNAME"
    ip link set veth_host master cni0 up                   # plug one end into the bridge
    # ...assign an IP from IPAM, add the default route...
    echo '{ "cniVersion": "1.0.0", "ips": [{ "address": "10.244.1.17/24" }] }'
    ;;
  DEL)
    ip link del veth_host 2&gt;/dev/null
    ;;
esac</code></pre></figure>
</div>
<h2>Implementations</h2>
<div class="tablewrap wide"><table><thead><tr><th>Plugin</th><th>Between nodes</th><th>NetworkPolicy</th><th>Note</th></tr></thead><tbody>
<tr><td>Flannel</td><td>VXLAN overlay (or host-gw)</td><td>No</td><td>Simple; a common first choice</td></tr>
<tr><td>Calico</td><td>BGP routes, optional IP-in-IP or VXLAN</td><td>Yes</td><td>No overlay needed where the network can route pod CIDRs</td></tr>
<tr><td>Canal</td><td>Flannel networking</td><td>Yes, via Calico</td><td>The two combined</td></tr>
<tr><td>Weave Net</td><td>Mesh overlay, encrypted option</td><td>Yes</td><td>Self-configuring</td></tr>
<tr><td>Open vSwitch, Contiv, Nuage, Romana</td><td>SDN-based</td><td>Varies</td><td>For environments with an existing SDN</td></tr>
<tr><td><code>kubenet</code></td><td>Cloud routes</td><td>No</td><td>Built-in basic bridge; limited</td></tr>
</tbody></table></div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>A NetworkPolicy on a CNI that does not enforce it does nothing,</strong> and the API accepts it without complaint.</li>
<li><strong>Policies select by label.</strong> Anyone who can label a pod <code>app: api</code> in an allowed namespace is let in. Guard label changes with RBAC.</li>
<li><strong>Default-deny also blocks DNS</strong> if you deny egress. Allow UDP and TCP 53 to the cluster DNS first.</li>
<li><strong>MTU mismatches cause hangs on large responses</strong> while small requests work. Suspect it when only big payloads fail.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>Cilium, built on eBPF, has become a leading CNI and can replace kube-proxy, enforce policy at layer 7 and provide observability. Weave Net is no longer maintained. Admin-level policies that namespace owners cannot override are arriving as AdminNetworkPolicy.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>No NetworkPolicy selects a pod. Who can reach it?</summary><p>Everyone. Pods are non-isolated by default. A pod becomes isolated for a direction only once some policy selects it for that direction.</p></details>
<details class="q"><summary>Why does an overlay network need a smaller MTU?</summary><p>Each packet is wrapped in an outer header (about 50 bytes for VXLAN). If the inner packet were full size, the wrapped one would exceed the physical network's limit and be fragmented or dropped.</p></details>

</template>
<template id="t-chapter-16">
<p class="eyebrow">Chapter 16</p>
<h1>Kubernetes infrastructure management</h1>
<p class="lede">Creating a cluster is an afternoon. Keeping one healthy for years is the job: upgrades every few months, nodes that need patching, hardware that fails without notice.</p>
<div class="model"><b>Mental model</b>
<p>Treat nodes as cattle too. A node is never repaired in place while it serves traffic. You <strong>cordon</strong> it (no new pods), <strong>drain</strong> it (evict what is there, so controllers recreate those pods elsewhere), do the work or replace the machine, then <strong>uncordon</strong>. The same move upgrades a kernel, a kubelet or a whole cluster, one node at a time. A <strong>PodDisruptionBudget</strong> is the contract that says how many pods of a workload may be down during that voluntary churn.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Node maintenance and upgrade runbook simulator</h3><p>Three nodes, four <code>web</code> replicas with a disruption budget, one bare pod, and a logging DaemonSet. Take node-1 out for maintenance without breaking the budget.</p></header>
<div class="body"><div class="ctl"><span class="field"><span class="lbl">PDB minAvailable for web</span><span data-h="pdb"></span></span><button class="chip" data-h="ign">--ignore-daemonsets</button><button class="chip" data-h="force">--force</button><button class="btn ghost" data-h="mrst">Reset</button></div>
<div class="grid3" data-h="mnodes"></div>
<div class="row"><span class="pill" data-h="avail"></span></div><pre data-h="mlog" style="max-height:200px"></pre><div class="msg" data-h="mmsg"></div></div></section>
<div class="tabs">
<figure class="code"><figcaption>node maintenance</figcaption><pre><code data-lang="bash">$ kubectl cordon node-1                       # SchedulingDisabled; running pods stay
$ kubectl drain node-1 --ignore-daemonsets --delete-emptydir-data --timeout=5m
    # evicts pods through the Eviction API, honouring PodDisruptionBudgets
    # and each pod's terminationGracePeriodSeconds
# ...patch, reboot, or replace the machine...
$ kubectl uncordon node-1
$ kubectl get nodes
NAME     STATUS                     ROLES    VERSION
node-1   Ready,SchedulingDisabled   &lt;none&gt;   v1.30.4</code></pre></figure>
<figure class="code"><figcaption>PodDisruptionBudget</figcaption><pre><code data-lang="yaml">apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
spec:
  minAvailable: 3            # or maxUnavailable: 1
  selector:
    matchLabels: { app: web }
# Applies to VOLUNTARY disruptions: drains, autoscaler scale-down, upgrades.
# It cannot stop a node from dying.</code></pre></figure>
<figure class="code"><figcaption>self-managed upgrade (kubeadm)</figcaption><pre><code data-lang="bash"># One minor version at a time. Control plane first, then nodes.
cp1$ sudo kubeadm upgrade plan
cp1$ sudo kubeadm upgrade apply v1.31.2
cp2$ sudo kubeadm upgrade node              # remaining control-plane nodes
# then on each control-plane node: upgrade kubelet and kubectl packages, restart kubelet

# Each worker, one at a time:
$ kubectl drain node-1 --ignore-daemonsets
node-1$ sudo kubeadm upgrade node &amp;&amp; sudo apt-get install -y kubelet=1.31.2-* &amp;&amp; sudo systemctl restart kubelet
$ kubectl uncordon node-1
# Before starting: etcd snapshot, read the release notes for removed APIs, upgrade the CNI if required.</code></pre></figure>
<figure class="code"><figcaption>managed upgrade</figcaption><pre><code data-lang="bash"># GKE
$ gcloud container clusters upgrade demo --master --cluster-version 1.31
$ gcloud container clusters upgrade demo --node-pool default-pool
$ gcloud container clusters resize demo --node-pool default-pool --num-nodes 5

# AKS
$ az aks upgrade -g demo-rg -n demo --kubernetes-version 1.31.2
$ az aks scale   -g demo-rg -n demo --node-count 5
# The provider cordons, drains and replaces nodes for you, with surge nodes
# to hold capacity. Your PodDisruptionBudgets still govern the pace.</code></pre></figure>
</div>
<h2>Planning and hardening</h2>
<ul>
<li><strong>Plan.</strong> Decide the number of clusters (per environment, per region), node pools, zones, and the upgrade cadence before the first workload lands. Changing these later is a migration.</li>
<li><strong>Harden.</strong> Private API endpoint or tight source ranges, RBAC with no anonymous access, encryption at rest for etcd, audit logging, minimal node images, regular etcd snapshots tested by restoring them.</li>
<li><strong>Tune.</strong> Reserve node resources for the kubelet and OS (<code>kubeReserved</code>, <code>systemReserved</code>), set eviction thresholds, spread replicas across zones with topology constraints.</li>
<li><strong>Expect instability.</strong> Cloud instances are retired, spot capacity is reclaimed, disks fail. Run at least two replicas of everything that matters, across nodes and zones, and let controllers do the recovery.</li>
</ul>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>A budget that can never be satisfied blocks drains for ever.</strong> <code>minAvailable</code> equal to <code>replicas</code>, or a single-replica workload with <code>minAvailable: 1</code>, stalls every upgrade.</li>
<li><strong>Skipping minor versions is unsupported.</strong> 1.28 to 1.30 means going through 1.29.</li>
<li><strong>Removed API versions break manifests after an upgrade.</strong> Scan for deprecated APIs before, not after.</li>
<li><strong>Draining does not wait for the replacement to be ready</strong> unless a budget makes it. No PDB means all replicas on a node can go at once.</li>
</ul></div>
<h2>Check your model</h2>
<details class="q"><summary>What is the difference between cordon and drain?</summary><p>Cordon only stops new pods being scheduled to the node. Drain cordons and then evicts the pods already there, respecting disruption budgets.</p></details>
<details class="q"><summary>A node dies suddenly with two of four <code>web</code> pods; the budget says <code>minAvailable: 3</code>. Was the budget violated?</summary><p>The budget does not apply. It limits voluntary evictions only. The ReplicaSet recreates the pods elsewhere; while availability is below three, further voluntary drains are refused.</p></details>

</template>
<template id="t-chapter-17">
<p class="eyebrow">Chapter 17</p>
<h1>Customizing Kubernetes: API and plugins</h1>
<p class="lede">Kubernetes ships with a few dozen resource types and one scheduler. Nearly every part of that can be replaced or extended without forking it, which is why the project has lasted.</p>
<div class="model"><b>Mental model</b>
<p>The API server is a generic machine for storing typed objects and notifying watchers. A <strong>CustomResourceDefinition</strong> teaches it a new type. From then on <code>kubectl</code>, RBAC, watches and storage all work for that type, with no code of yours in the server. A <strong>controller</strong> you write watches those objects and makes them true. That pair, CRD plus controller, is an <em>operator</em>, and it is the same pattern as every built-in resource. The other extension points are hooks along the request path and plug-in interfaces below it.</p></div>
<h2>The API is just HTTP</h2>
<div class="tabs">
<figure class="code"><figcaption>curl, httpie, jq</figcaption><pre><code data-lang="bash">$ kubectl proxy --port 8080 &amp;                        # handles auth for you
$ curl -s localhost:8080/api/v1/namespaces/default/pods | jq '.items[].metadata.name'
$ http localhost:8080/api/v1/services | jq '.items[] | {name: .metadata.name, ip: .spec.clusterIP}'
$ curl -s localhost:8080/openapi/v2 | jq '.paths | keys | length'   # the whole API, described
$ kubectl get --raw /apis | jq '.groups[].name'
$ kubectl api-resources                               # every type the server knows, CRDs included</code></pre></figure>
<figure class="code"><figcaption>Python client</figcaption><pre><code data-lang="python">from kubernetes import client, config, watch

config.load_kube_config()
v1 = client.CoreV1Api()

# list
for item in v1.list_namespace().items:
    print(item.metadata.name)

# create
pod = client.V1Pod(
    metadata=client.V1ObjectMeta(name="nginx-pod"),
    spec=client.V1PodSpec(containers=[
        client.V1Container(name="nginx", image="nginx:1.27",
                           ports=[client.V1ContainerPort(container_port=80)])]))
v1.create_namespaced_pod(namespace="default", body=pod)

# watch: the same mechanism every controller uses
w = watch.Watch()
for event in w.stream(v1.list_namespace, _request_timeout=60):
    print(f"Event: {event['type']} {event['object'].metadata.name}")

# or drive kubectl when that is simpler
import subprocess, json
out = subprocess.check_output(["kubectl", "get", "pods", "-o", "json"])
print([p["metadata"]["name"] for p in json.loads(out)["items"]])</code></pre></figure>
<figure class="code"><figcaption>CRD and a custom resource</figcaption><pre><code data-lang="yaml">apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: candies.awesome.corp.com          # must be &lt;plural&gt;.&lt;group&gt;
spec:
  group: awesome.corp.com
  scope: Namespaced
  names:
    plural: candies
    singular: candy
    kind: Candy
    shortNames: [cn]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:                  # structural schema: validated by the API server
          type: object
          properties:
            spec:
              type: object
              required: [flavor]
              properties:
                flavor: { type: string, enum: [chocolate, vanilla, mint] }
                count:  { type: integer, minimum: 1, default: 1 }
---
apiVersion: awesome.corp.com/v1
kind: Candy
metadata:
  name: chocolate
spec:
  flavor: chocolate
  count: 3
# kubectl get candies      kubectl get cn chocolate -o yaml      kubectl delete candy chocolate</code></pre></figure>
</div>
<section class="lab">
<header><span class="tag">Lab</span><h3>CRD, admission webhook and custom scheduler pipeline</h3><p>Apply a <code>Candy</code>. Flip the switches to break it at different stages and see what each extension point is for.</p></header>
<div class="body"><div class="ctl">
<span class="field"><span class="lbl">The manifest's flavor</span><span data-h="flav"></span></span>
<button class="chip" data-h="crd">CRD is installed</button><button class="chip" data-h="hook">Validating webhook: max 5 per namespace (4 exist)</button><button class="chip" data-h="ctrl">Candy controller is running</button><button class="chip" data-h="csch">Pods use schedulerName: sweet-scheduler</button><button class="chip" data-h="cschup">sweet-scheduler is running</button></div>
<div class="stack" style="gap:5px" data-h="stg"></div><div class="msg" data-h="cmsg"></div></div></section>
<h2>Other ways to extend</h2>
<div class="tablewrap wide"><table><thead><tr><th>Extension point</th><th>What you supply</th><th>Use it for</th></tr></thead><tbody>
<tr><td>API aggregation</td><td>Your own API server registered under the main one</td><td>Types that need their own storage or logic; metrics APIs work this way</td></tr>
<tr><td>Authentication webhook</td><td>A service that maps a bearer token to a user</td><td>Company single sign-on</td></tr>
<tr><td>Authorization webhook</td><td>A service that answers allow or deny per request</td><td>Policy too complex for RBAC</td></tr>
<tr><td>Admission webhooks</td><td>Mutating and validating services called before persistence</td><td>Injecting sidecars, enforcing conventions</td></tr>
<tr><td>Custom scheduler</td><td>A program that binds pods naming it in <code>schedulerName</code></td><td>Placement rules the default cannot express</td></tr>
<tr><td>Custom metrics</td><td>An adapter serving the custom metrics API</td><td>HPA on queue length or requests per second</td></tr>
<tr><td>Storage: FlexVolume, CSI</td><td>A driver that provisions, attaches and mounts volumes</td><td>Any storage system, without changing Kubernetes</td></tr>
</tbody></table></div>
<div class="tabs">
<figure class="code"><figcaption>admission webhook registration</figcaption><pre><code data-lang="yaml">apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: candy-policy
webhooks:
  - name: candies.awesome.corp.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail            # if the webhook is down, reject. Ignore = let it through.
    timeoutSeconds: 5
    rules:
      - apiGroups: ["awesome.corp.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["candies"]
    clientConfig:
      service: { namespace: policy, name: candy-webhook, path: /validate }
      caBundle: LS0tLS1CRUdJTi…
# The API server POSTs an AdmissionReview; the webhook replies allowed: true/false with a message.</code></pre></figure>
<figure class="code"><figcaption>custom scheduler</figcaption><pre><code data-lang="yaml">apiVersion: v1
kind: Pod
metadata:
  name: some-pod
spec:
  schedulerName: sweet-scheduler   # the default scheduler now ignores this pod
  containers:
    - name: some-container
      image: registry.k8s.io/pause:3.9
# A scheduler is a loop: watch pods with spec.nodeName == "" and my name,
# pick a node, POST a Binding. If it is not running, the pod stays Pending for ever.</code></pre></figure>
<figure class="code"><figcaption>FlexVolume vs CSI</figcaption><pre><code data-lang="text">FlexVolume (older)                         CSI (the standard)
-----------------------------------------  -------------------------------------------
Executable installed on every node         Driver runs as pods (DaemonSet + controller)
and master, invoked by the kubelet         and speaks gRPC over a socket
Needs root access to hosts to deploy       Deployed with kubectl like any workload
Limited: attach, mount                     Provision, attach, mount, snapshot, resize, clone
Specific to Kubernetes                     Shared spec across orchestrators
Deprecated                                 What every storage vendor ships today</code></pre></figure>
</div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>A CRD with no controller is a database table.</strong> Objects are stored and nothing happens. That can be useful, and is often a surprise.</li>
<li><strong>A failing webhook with <code>failurePolicy: Fail</code> can lock the cluster,</strong> including the pods needed to fix the webhook. Exclude system namespaces and keep webhooks highly available.</li>
<li><strong>Deleting a CRD deletes every object of that type.</strong></li>
<li><strong>Webhooks add latency to every matching request.</strong> Keep them fast and narrowly scoped.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>CRDs are <code>apiextensions.k8s.io/v1</code> and require a structural schema. Validation rules can be written inline in CEL, and ValidatingAdmissionPolicy does simple admission checks in-process without a webhook. The scheduler is now extended through its plugin framework more often than replaced. Service Catalog has been retired, and FlexVolume is deprecated in favour of CSI.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>What can you do with a custom resource the moment its CRD is applied, before writing any code?</summary><p>Create, read, update, delete, list and watch it with <code>kubectl</code> or any client, protect it with RBAC, and have it validated against its schema. Nothing acts on it until a controller exists.</p></details>
<details class="q"><summary>Why are mutating webhooks called before validating ones?</summary><p>So validation sees the final object. A mutation could otherwise slip in something a validator would have rejected.</p></details>

<template id="t-chapter-18">
<p class="eyebrow">Chapter 18</p>
<h1>Handling the Kubernetes package manager</h1>
<p class="lede">A real application is a dozen manifests that differ slightly per environment. Copying YAML and editing it by hand works until the day staging and production drift apart. Helm treats those manifests as one versioned, parameterised unit.</p>
<div class="model"><b>Mental model</b>
<p>Three nouns. A <strong>chart</strong> is a package: templates plus default values. A <strong>release</strong> is one installation of a chart in a cluster, with a name. A <strong>revision</strong> is a numbered snapshot of a release, created on every install, upgrade or rollback. Rendering is a pure function: <code>templates + merged values → manifests</code>. Everything interesting about Helm is either in how values are merged or in how revisions are kept.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Helm chart and value precedence renderer</h3><p>Edit any layer of values and the manifest re-renders. Then install, upgrade and roll back to see revisions accumulate.</p></header>
<div class="body">
<div class="grid3">
  <div class="stack"><label class="lbl" for="c18-v">1 · chart values.yaml (defaults)</label><textarea id="c18-v" spellcheck="false" style="min-height:170px"></textarea></div>
  <div class="stack"><label class="lbl" for="c18-f">2 · -f prod.yaml (overrides 1)</label><textarea id="c18-f" spellcheck="false" style="min-height:170px"></textarea></div>
  <div class="stack"><label class="lbl" for="c18-s">3 · --set (overrides all)</label><input id="c18-s" type="text" value="image.tag=2.1.0"><div class="note">Comma-separated <code>key.path=value</code>. Subchart defaults sit below layer 1: <code>redis.port: 6379</code>, <code>redis.enabled: false</code>.</div><div class="tablewrap" style="margin:0"><table data-h="src"></table></div></div>
</div>
<div class="grid2"><div><div class="lbl" style="margin-bottom:6px">templates/deployment.yaml</div><pre data-h="tpl" style="max-height:330px"></pre></div><div><div class="lbl" style="margin-bottom:6px">helm template (rendered)</div><pre data-h="out" style="max-height:330px"></pre></div></div>
<div class="row"><button class="btn" data-h="inst">helm install hue ./hue-chart</button><button class="btn" data-h="upg">helm upgrade hue ./hue-chart</button><button class="btn ghost" data-h="rb">helm rollback hue (to previous)</button><button class="btn danger" data-h="un">helm uninstall hue</button></div>
<div class="tablewrap" style="margin:0"><table data-h="hist"></table></div><div class="msg" data-h="hmsg"></div></div></section>
<div class="tabs">
<figure class="code"><figcaption>Chart.yaml</figcaption><pre><code data-lang="yaml">apiVersion: v2
name: hue-chart
description: The Hue learner service
type: application
version: 0.3.1            # the CHART's version: bump on any change to templates or defaults
appVersion: "2.0.0"       # the version of the software inside: informational
deprecated: false
dependencies:
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled       # install the subchart only when this value is true
# helm dependency update   -&gt; downloads subcharts into charts/ and writes Chart.lock</code></pre></figure>
<figure class="code"><figcaption>chart layout</figcaption><pre><code data-lang="text">hue-chart/
  Chart.yaml
  values.yaml              # defaults
  charts/                  # subcharts (dependencies)
  templates/
    deployment.yaml
    service.yaml
    _helpers.tpl           # named templates: {{ include "hue.fullname" . }}
    NOTES.txt              # printed after install
  .helmignore

$ helm create hue-chart                    # scaffold from the built-in starter
$ helm create --starter my-starter foo     # or from your organisation's starter pack
$ helm lint hue-chart
$ helm package hue-chart                   # hue-chart-0.3.1.tgz</code></pre></figure>
<figure class="code"><figcaption>template language</figcaption><pre><code data-lang="yaml">metadata:
  name: {{ include "hue.fullname" . }}
  labels:
    {{- include "hue.labels" . | nindent 4 }}          # pipelines: value | function args
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  template:
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.resources }}                # with: changes what "." means inside
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
          {{- range $key, $val := .Values.env }}       # range: loop over a map or list
            - name: {{ $key | upper }}
              value: {{ $val | quote }}
          {{- end }}
# {{- trims whitespace to the left, -}} to the right.
# Inside range and with, "." is rebound; use "$" to reach the root: $.Release.Name</code></pre></figure>
<figure class="code"><figcaption>releases</figcaption><pre><code data-lang="bash">$ helm repo add bitnami https://charts.bitnami.com/bitnami &amp;&amp; helm repo update
$ helm search repo redis
$ helm install hue ./hue-chart -f prod.yaml --set image.tag=2.1.0 -n hue --create-namespace
$ helm status hue -n hue
$ helm get values hue -n hue                  # what was supplied
$ helm get manifest hue -n hue                # what was rendered
$ helm upgrade hue ./hue-chart -f prod.yaml --set replicaCount=5 -n hue
$ helm history hue -n hue
$ helm rollback hue 1 -n hue
$ helm uninstall hue -n hue
$ helm template hue ./hue-chart -f prod.yaml  # render locally, touch nothing</code></pre></figure>
</div>
<h3>Value precedence, including subcharts</h3>
<p>Lowest to highest: a subchart's own <code>values.yaml</code>; the parent chart's <code>values.yaml</code>, which overrides a subchart under a key named after it (<code>redis.port</code>); each <code>-f</code> file in the order given; then <code>--set</code>. A subchart never sees its parent's values, except anything placed under <code>global</code>, which every chart can read.</p>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>Templating YAML with text substitution is fragile.</strong> Indentation errors and unquoted values (<code>tag: 1.10</code> becoming the number 1.1) are the classic bugs. Use <code>quote</code>, <code>nindent</code> and <code>helm lint</code>.</li>
<li><strong>A rollback restores manifests, not data.</strong> A database migration applied by revision 3 is still applied after rolling back to revision 2.</li>
<li><strong><code>helm upgrade</code> without the earlier <code>--set</code> flags drops them.</strong> Keep values in files under version control, or use <code>--reuse-values</code> knowingly.</li>
<li><strong>Hand edits with <code>kubectl</code> drift</strong> from what the release records, and the next upgrade may or may not undo them.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>The book describes Helm 2, where a server-side component, <strong>Tiller</strong>, ran in the cluster with broad permissions and held release state. Helm 3 removed Tiller. The client talks to the API with your own credentials, release state is stored as Secrets in the release's namespace, <code>helm delete</code> became <code>helm uninstall</code>, release names are scoped per namespace, and charts can be stored in OCI registries. Upgrades use a three-way merge that takes live state into account.</p></div>
<h2>Check your model</h2>
<details class="q"><summary><code>values.yaml</code> says <code>replicaCount: 2</code>, <code>prod.yaml</code> says 4, and you pass <code>--set replicaCount=6</code>. What is deployed?</summary><p>Six. <code>--set</code> wins over files, and later files win over earlier ones and over chart defaults.</p></details>
<details class="q"><summary>What is the difference between <code>version</code> and <code>appVersion</code> in <code>Chart.yaml</code>?</summary><p><code>version</code> is the chart's own semantic version and must change whenever the package changes. <code>appVersion</code> describes the application the chart deploys and is informational; a template may use it as the default image tag.</p></details>

</template>
<template id="t-chapter-19">
<p class="eyebrow">Chapter 19</p>
<h1>The future of Kubernetes</h1>
<p class="lede">The book closes by looking ahead from about 2018. Enough time has passed to check the predictions, which is a useful exercise in telling the durable parts of a technology from the fashionable ones.</p>
<div class="model"><b>Mental model</b>
<p>Kubernetes won by becoming boring in the middle and open at the edges. The core (API machinery, pods, controllers) changed little. Almost everything else moved <em>out of tree</em> behind an interface: runtimes behind CRI, networks behind CNI, storage behind CSI, clouds behind the cloud provider interface, new behaviour behind CRDs and webhooks. Read the ecosystem as a map of those interfaces and it stops looking like a zoo.</p></div>
<section class="lab">
<header><span class="tag">Lab</span><h3>Cloud-native ecosystem and platform evolution map</h3><p>Click an area around the core to see the interface it plugs into, what the book named, and where it stands now.</p></header>
<div class="body"><div class="pane" data-h="map"></div>
<div class="grid2"><div class="tablewrap" style="margin:0"><table data-h="mt"></table></div><div class="msg" data-h="mm"></div></div></div></section>
<h2>How the project runs</h2>
<ul>
<li><strong>Releases.</strong> Minor versions arrived roughly every three months in the book's era, each supported for about nine. Features move through alpha, beta and stable, and APIs carry that maturity in their version (<code>v1alpha1</code>, <code>v1beta1</code>, <code>v1</code>).</li>
<li><strong>Special Interest Groups</strong> own areas such as networking, storage, scheduling and auth; working groups form around cross-cutting topics and disband when done. Every change goes through the owning SIG.</li>
<li><strong>Competition.</strong> Docker Swarm, Mesos with Marathon, and each cloud's own orchestrator were alternatives. The clouds chose to offer managed Kubernetes and compete above it.</li>
<li><strong>Ecosystem.</strong> Distributions such as OpenShift build a platform on top; OpenStack runs beside or beneath it; service meshes add traffic control and identity between services; serverless frameworks run functions on it.</li>
</ul>
<figure class="code"><figcaption>Git to cluster</figcaption><pre><code data-lang="bash"># 1. A commit to the application repository triggers CI
$ docker build -t registry.example.com/hue/learn:$GIT_SHA .
$ docker push registry.example.com/hue/learn:$GIT_SHA
$ cosign sign registry.example.com/hue/learn@$DIGEST          # sign what was built

# 2. CI packages and publishes the chart, versioned
$ helm lint charts/hue-learn &amp;&amp; helm package charts/hue-learn --version 0.3.2 --app-version $GIT_SHA
$ helm push hue-learn-0.3.2.tgz oci://registry.example.com/charts

# 3. CI opens a pull request against the environment repository
#    environments/staging/hue-learn.yaml:   chart 0.3.1 -&gt; 0.3.2,  image.tag -&gt; $GIT_SHA

# 4. A GitOps controller in the cluster (Argo CD, Flux) sees the merge and reconciles
$ argocd app get hue-learn-staging
Sync Status:   Synced to main (9f3c2a1)
Health Status: Healthy

# 5. Promotion to production is another pull request. Rollback is a git revert.
#    Nobody runs kubectl apply or helm upgrade by hand against production.</code></pre></figure>
<h2>Criteria for evaluating what comes next</h2>
<div class="tablewrap wide"><table><thead><tr><th>Question</th><th>Why it matters</th></tr></thead><tbody>
<tr><td>Does it plug into a standard interface, or patch the core?</td><td>Interfaces survive upgrades. Patches do not</td></tr>
<tr><td>Is it under neutral governance with several maintaining organisations?</td><td>Single-vendor projects change licence or direction</td></tr>
<tr><td>Can you remove it later?</td><td>CRDs and annotations create lock-in as surely as a proprietary API</td></tr>
<tr><td>Who operates it at 3 a.m.?</td><td>Every add-on is a system someone must upgrade and debug</td></tr>
<tr><td>Does it solve a problem you have measured?</td><td>Service meshes and multi-cluster tools are costly answers to questions many teams never ask</td></tr>
</tbody></table></div>
<div class="edge"><b>Sharp edges</b><ul>
<li><strong>The API you write against may be removed.</strong> Beta APIs are deprecated on a schedule. Pin versions, read release notes, and budget time for each upgrade.</li>
<li><strong>The ecosystem churns faster than the core.</strong> Several tools this book recommends no longer exist. Favour the ones behind stable interfaces.</li>
<li><strong>Platform sprawl is real.</strong> A cluster with forty operators has forty upgrade paths.</li>
</ul></div>
<div class="since"><b>Since the book</b><p>What held: modularisation and out-of-tree plugins, managed Kubernetes everywhere, Helm, operators, service meshes as an option, CI/CD converging on Git as the source of truth. What changed: releases slowed to three a year with about a year of support; Docker Swarm and Mesos faded; Docker as a runtime, Heapster, Federation, PodSecurityPolicy and Tiller were removed; eBPF networking, the Gateway API, GitOps controllers, policy engines and platform engineering on top of Kubernetes became mainstream.</p></div>
<h2>Check your model</h2>
<details class="q"><summary>Why did moving cloud providers and volume plugins out of the main repository matter?</summary><p>In-tree code ships on Kubernetes' schedule and makes every vendor's bug a core bug. Out of tree, each provider releases independently, the core gets smaller and safer, and new providers need no permission.</p></details>
<details class="q"><summary>What single design decision made most of this extensibility possible?</summary><p>A declarative API with watch, and the rule that all components, built-in or custom, communicate only through it. Anything that can read and write objects can participate.</p></details>
